# EXP-002: one verification. The folder name is its permanent identifier;
# the title may change.
title: "NIST CFTT case: mulder tools called directly, no model"
title_ko: "NIST CFTT 케이스에서 모델 없이 mulder 도구만 호출"
server: mulder
status: in-progress # planned | in-progress | done
change: >
  Calls mulder's disk tools directly from a script, without a model, to check
  whether they find and recover the deleted files on the NIST CFTT image.
change_ko: >
  모델 없이 스크립트로 mulder 디스크 도구를 직접 호출해서, NIST CFTT 이미지에서
  삭제 파일을 찾아 복구할 수 있는지 검증한다.
links:
  - https://cfreds-archive.nist.gov/dfr-test-images.html
  - https://cfreds-archive.nist.gov/dfr-images/setup-july-10-2012.pdf

case: nist-dfr-01-fat
harness: bench-runner

variants:
  before: mulder-1.5.10 # upstream release

scripted_expect:
  before: { questions: 5/5, facts: 14/14 }

conclusion: >
  Scripted 5/5 questions, 14/14 facts: every fact is reachable with mulder's
  disk tools, but only with workarounds. Without an offset run_fls indexes
  only the FAT32 partition (it lists other partitions only when they are at
  least 204,800 sectors and of an NTFS, FAT32 or Linux type); with an offset
  it skips the second and third partition as "already indexed" unless force
  is set;
  get_file_metadata and extract_file_by_inode take no partition and read the
  FAT32 partition only; get_deleted_files reports 8 deleted entries where
  there is 1. Model runs are pending.
conclusion_ko: >
  scripted 5/5 질문, 14/14 사실. 모든 사실에 mulder 디스크 도구로 닿지만, 우회가
  필요하다. run_fls는 오프셋 없이 부르면 FAT32 파티션만 색인하고(다른 파티션은
  204,800섹터 이상이면서 NTFS·FAT32·Linux 유형일 때만 색인), 오프셋을 주면 force
  없이는 두 번째·세 번째 파티션을 "이미 색인됨"으로 건너뛴다. get_file_metadata와 extract_file_by_inode는 파티션 인자가
  없어 FAT32 파티션만 읽는다. get_deleted_files는 삭제 파일이 1개인데 8개라고 한다.
  모델 실행은 아직 하지 않았다.
