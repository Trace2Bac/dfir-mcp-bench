# EXP-002: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does Haiku read an empty capture search as \"no capture\"?"
title_ko: "Haiku는 캡처 검색 결과가 비면 \"캡처가 없다\"고 읽을까?"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  One question from the NIST Hacking Case, the name of the file that holds
  the intercepted traffic, asked of one agent that calls mulder's tools
  itself: Claude Code with Haiku and `mulder serve` as its only tools. The
  file has no extension, and upstream mulder's analyze_disk_pcaps looks for
  captures by extension only, so on this image it reports "No packet capture
  files found in the TSK file listing." The agent reads each tool result
  directly, so nothing is lost between stages and mulder's own investigate
  prompts are not used. The labels differ in the tools' interpretation
  limits: before has none (the caveats in mulder's tools are removed), after
  has mulder's own and one more, on that empty result: what was searched (by
  name only, for five extensions), that files with another extension or none
  were not opened, and that this does not show the image holds no packet
  captures. Five runs per label. Compared: how many answers state that there
  is no such file or name a wrong one, how many say it was not determined,
  and how many find the file, and which tools the agent used to get there.
change_ko: >
  NIST Hacking Case의 질문 하나(가로챈 트래픽이 든 파일 이름)를, mulder 도구를 직접 부르는 에이전트
  하나에게 묻습니다. Haiku로 동작하는 Claude Code이고, 도구는 `mulder serve`뿐입니다. 이 파일은
  확장자가 없고, upstream mulder의 analyze_disk_pcaps는 확장자로만 캡처를 찾기 때문에 이 이미지에서는
  "No packet capture files found in the TSK file listing."이라고 보고합니다. 에이전트가 도구 결과를
  직접 읽으므로 단계 사이에서 사라지는 것이 없고, mulder investigate의 프롬프트도 쓰이지 않습니다. 두
  라벨의 차이는 도구의 해석 한계입니다. before에는 없습니다(mulder 도구의 주의 문구를 지움). after에는
  mulder 원래의 한계와, 빈 결과에 대한 한계 하나가 더 있습니다. 무엇을 찾았는지(파일 이름으로만, 확장자
  다섯 개), 다른 확장자나 확장자 없는 파일은 열지 않았다는 것, 그래서 이미지에 캡처가 없다는 뜻은
  아니라는 것입니다. 라벨당 5회로, 그런 파일이 없다거나 틀린 파일을 답한 수, 확인하지 못했다고 답한 수,
  파일을 찾은 수를 비교하고, 에이전트가 어떤 도구로 답에 이르렀는지도 봅니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-q23
harness: claude-code
harness_options:
  model: claude-haiku-4-5
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10-messages-no-limits    # upstream tools, no interpretation limit
  after: mulder-1.5.10-messages-pcap-limit    # mulder's own limits, plus what the empty pcap search does not show
