# EXP-002: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does Haiku read an empty capture search as \"no capture\"?"
title_ko: "Haiku는 캡처 검색 결과가 비면 \"캡처가 없다\"고 읽을까?"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  One question from the NIST Hacking Case: the name of the file that holds
  the intercepted traffic. That file has no extension, and upstream mulder's
  analyze_disk_pcaps looks for captures by extension only, so on this image
  it reports "No packet capture files found in the TSK file listing." Both
  labels run upstream mulder 1.5.10 with only the message channel added, so
  that the pcap tool runs and its message reaches the analyst. before has no
  interpretation limit at all: mulder's general rules in the analyst prompts
  (such as "absence of evidence in one source is not conclusive") and the
  caveats in its tools are removed. after keeps all of them and adds one
  limit to that empty result: what was searched (by name only, for five
  extensions), that files with another extension or none were not opened,
  and that this does not show the image holds no packet captures. Five runs
  per label. Compared: how many answers state that there is no such file or
  name a wrong one, how many say it was not determined, and how many find
  the file.
change_ko: >
  NIST Hacking Case의 질문 하나, 가로챈 트래픽이 든 파일의 이름을 묻습니다. 이 파일은 확장자가
  없고, upstream mulder의 analyze_disk_pcaps는 확장자로만 캡처를 찾기 때문에 이 이미지에서는 "No
  packet capture files found in the TSK file listing."이라고 보고합니다. 두 라벨 모두 upstream mulder
  1.5.10에 메시지 전달만 더해서, pcap 도구가 실행되고 그 메시지가 analyst까지 갑니다. before에는 해석
  한계가 전혀 없습니다. analyst 프롬프트의 mulder 일반 규칙("한 출처에 증거가 없다고 결론을 낼 수는
  없다" 등)과 도구의 주의 문구를 모두 지웠습니다. after는 그것들을 모두 두고, 빈 결과에 해석 한계
  하나를 더합니다. 무엇을 찾았는지(파일 이름으로만, 확장자 다섯 개), 다른 확장자나 확장자 없는 파일은
  열지 않았다는 것, 그래서 이미지에 캡처가 없다는 뜻은 아니라는 것입니다. 라벨당 5회로, 그런 파일이
  없다거나 틀린 파일을 답한 수, 확인하지 못했다고 답한 수, 파일을 찾은 수를 비교합니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-q23
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10-messages-no-limits    # upstream tools, messages reach the analyst, no interpretation limit
  after: mulder-1.5.10-messages-pcap-limit    # mulder's own limits, plus what the empty pcap search does not show
