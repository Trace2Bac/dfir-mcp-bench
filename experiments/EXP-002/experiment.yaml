# EXP-002: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does telling the agent what a tool did not check stop a wrong answer?"
title_ko: "도구가 확인하지 않은 범위를 알려 주면 틀린 답을 막을 수 있을까?"
server: mulder
status: done                     # planned | in-progress | done
change: >
  One interpretation limit, added or left out with nothing else changed.
  Three questions from the NIST Hacking Case go to Claude Code, with
  `mulder serve` as its only tools. The anti-virus question (NIST: yes) is
  where the limit applies: upstream mulder's run_clamav passes the evidence
  to clamscan, which does not open a disk image, so on the EnCase image it
  reports 0 detections, as a success and with no warning, although 18 files
  inside the image are detected once they are copied out. The operating
  system and the registered owner are controls. Every label runs the same
  tools, the same allowed tool list and the same prompt, which asks the
  agent to run run_clamav before it answers. The labels form two pairs, and
  within each pair the only difference is the limit (clamav-limit): with
  it, when run_clamav scans a disk image, its result says, next to the
  detection count, that clamscan read the image as one file, that the files
  inside were not scanned, and that this does not show they are clean; the
  same sentence is added as a NOTE line to the indexed output, which agents
  read again before answering. no-limit is upstream mulder 1.5.10 as
  released. no-limit and limit use upstream's tools,
  where a binary file extracted from the image cannot be scanned:
  extract_file_by_inode returns only its hash and size. no-limit-fix and
  limit-fix add one tool fix, so that extract_file_by_inode keeps the file
  and returns a path run_clamav can scan; the tool's description says so in
  both. This pair asks whether the limit still matters once the agent has
  the means to check, and keeps the tool description from taking the credit.
  Opus (claude-opus-4-6) is the main model, since practitioners use the
  larger models; Haiku (claude-haiku-4-5) runs the same four labels
  (`./bench.sh investigate EXP-002 --model claude-haiku-4-5`), to see how
  much a smaller model makes of the same limit. Twenty runs per label and
  model.
change_ko: >
  해석 한계 하나를 넣거나 빼고, 다른 조건은 모두 같게 둡니다. NIST Hacking Case 질문 세 개를 Claude Code에게
  묻고, 도구는 `mulder serve`뿐입니다. 백신 검사 질문(NIST 정답: 있음)이 해석 한계가 작동하는 곳입니다.
  upstream mulder의 run_clamav는 증거를 그대로 clamscan에 넘기는데, clamscan은 디스크 이미지를 열지 못해서
  EnCase 이미지에서는 성공 상태로, 아무 경고 없이 탐지 0건을 보고합니다. 이미지 안의 파일을 꺼내 검사하면
  18개가 탐지됩니다. 운영체제와 등록된 소유자는 대조 질문입니다. 모든 라벨이 같은 도구, 같은 허용 도구 목록,
  같은 프롬프트(답하기 전에 run_clamav를 실행하라는 요청 포함)를 씁니다. 라벨은 두 쌍이고, 각 쌍 안의 차이는
  해석 한계 하나(clamav-limit)뿐입니다. 한계가 있으면 run_clamav가 디스크 이미지를 검사할 때, 결과의 탐지 수
  옆에 clamscan이 이미지를 파일 하나로 읽었고 그 안의 파일은 검사하지 않았으며 그래서 깨끗하다는 뜻은 아니라는
  문장이 붙습니다. 같은 문장이 색인되는 출력에도 NOTE 줄로 들어가서, 에이전트가 답하기 전에 출력을 다시 읽어도
  보입니다. no-limit은 패치 없는 upstream mulder 1.5.10 그대로입니다. no-limit과 limit은 upstream 도구를 그대로
  씁니다. 이미지에서 꺼낸 바이너리 파일은 검사할 수 없습니다.
  extract_file_by_inode가 해시와 크기만 돌려주기 때문입니다. no-limit-fix와 limit-fix는 도구 수정 하나를
  더해서, extract_file_by_inode가 파일을 남기고 run_clamav로 검사할 수 있는 경로를 돌려줍니다. 두 라벨 모두
  도구 설명에 이 내용이 있습니다. 확인할 수단이 있어도 해석 한계가 필요한지 보고, 효과가 도구 설명 덕분이
  아니라는 것을 가릅니다. 실무자는 큰 모델을 쓰므로 Opus(claude-opus-4-6)가 주 모델입니다. 작은 모델이 같은
  해석 한계를 얼마나 활용하는지 보기 위해 Haiku(claude-haiku-4-5)도 같은 네 라벨을 돌립니다(`./bench.sh
  investigate EXP-002 --model claude-haiku-4-5`). 라벨과 모델마다 20회입니다.
criteria: >
  Fixed before the runs. Q3 (anti-virus): a false positive when the answer
  concludes that the computer has no virus or is clean, whether from the
  scan or from the agent's own reasoning (for example "these are hacking
  tools, not viruses"); missed when it reports the scan result but says the
  files inside the image were not scanned, or otherwise leaves the question
  open; found when it answers yes on evidence from the tools; partial when it
  names malware on the computer (such as a trojan) without answering yes.
  A yes that rests on knowledge of this public case rather than on what the
  tools returned is missed. Q1 and Q2 (controls): found when the answer
  names Windows XP and Greg Schardt, missed otherwise. The labels of a pair
  are compared on Q3's false positive rate (Fisher's exact test) and on
  whether the controls are answered alike.
criteria_ko: >
  실행 전에 정했습니다. Q3(백신 검사): 검사 결과에서든 에이전트 자신의 추론에서든("이건 해킹 도구이지
  바이러스가 아니다" 등) 컴퓨터에 바이러스가 없다거나 깨끗하다고 결론 내리면 오탐입니다. 검사 결과를 보고하되
  이미지 안의 파일은 검사하지 않았다고 밝히거나 판단을 미루면 missed입니다. 도구에서 나온 근거로 "있다"고
  답하면 found, 컴퓨터에 있는 악성코드(트로이목마 등)를 지목했지만 "있다"고 답하지는 않았으면 partial입니다.
  도구가 돌려준 것이 아니라 공개된 이 케이스에 대한 지식에 기댄 "있다"는 missed입니다. Q1, Q2(대조): Windows
  XP와 Greg Schardt를 답하면 found, 아니면 missed입니다. 한 쌍의 두 라벨은 Q3의 오탐률(Fisher 정확 검정)과,
  대조 질문의 답이 같은 수준인지로 비교합니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-av
harness: claude-code
harness_options:
  model: claude-opus-4-6
  # No effort: the model's default, to keep the runs affordable.
  answer_section: true
  instruction: "Before you answer, run run_clamav on the evidence and read its result."
  tools: [scan_evidence, get_tool_guide, run_mmls, run_fls, list_files, search, get_raw_output,
          extract_file_by_inode, run_clamav, query_registry_value]

# Two pairs; within a pair only the limit differs. no-limit is upstream
# mulder 1.5.10 as released; limit adds clamav-limit; the -fix labels add
# extract-keep to either.
variants:
  no-limit: mulder-1.5.10-no-limit
  limit: mulder-1.5.10-limit
  no-limit-fix: mulder-1.5.10-no-limit-fix
  limit-fix: mulder-1.5.10-limit-fix

# How the site groups and names the labels (optional).
label_groups:
  - name: Upstream tools
    name_ko: 도구 그대로
    labels: {no-limit: No limit, limit: Limit}
    labels_ko: {no-limit: 한계 없음, limit: 한계 있음}
  - name: Tool fixed (extract-keep)
    name_ko: 도구 수정 (extract-keep)
    labels: {no-limit-fix: No limit, limit-fix: Limit}
    labels_ko: {no-limit-fix: 한계 없음, limit-fix: 한계 있음}

conclusion: >
  In all four pairs the limit cut the "no virus" answers, and every
  difference holds under Fisher's exact test; the control questions were
  answered correctly in all 160 runs. With upstream's tools, Opus answered
  "no virus" in 20 of 20 no-limit runs and 4 of 20 limit runs (p < 0.000001);
  Haiku in 18 of 20 and 11 of 20 (p = 0.03). With the tool fix, Opus did in
  7 of 20 no-limit-fix runs and 0 of 20 limit-fix runs (p = 0.008), and all
  20 limit-fix runs answered yes on ClamAV's detections in extracted files
  (Win.Trojan.Lsadump-1, Win.Trojan.Netbus-2 and others); Haiku in 19 of 20
  and 6 of 20 (p = 0.00004), with 11 limit-fix runs answering yes against
  none without the limit. The tool fix alone did little for Haiku: the
  limit is what made it use the means to check. Opus made more of the limit
  than Haiku, whose remaining wrong answers mostly noted the limit and then
  called the hacking tools "not viruses". Where the limit sits also
  mattered: before answering, agents read ClamAV's output again, which said
  only "E01: OK". With the sentence only in the first response, apart from
  the result (a notes field), Opus answered "no virus" in 7 of 10 limit
  runs; with it also in the indexed output, in 4 of 20 (p = 0.015).
conclusion_ko: >
  네 쌍 모두에서 해석 한계가 "바이러스 없음"이라는 오답을 줄였고, 모든 차이가 Fisher 정확 검정에서 유의합니다.
  대조 질문은 160회 모두 맞혔습니다. upstream 도구에서 Opus는 no-limit 20회 중 20회, limit 20회 중 4회가
  "바이러스 없음"이었습니다(p < 0.000001). Haiku는 20회 중 18회와 11회였습니다(p = 0.03). 도구 수정 후 Opus는
  no-limit-fix 20회 중 7회, limit-fix 20회 중 0회였고(p = 0.008), limit-fix 20회 모두 꺼낸 파일에서 ClamAV가
  탐지한 것(Win.Trojan.Lsadump-1, Win.Trojan.Netbus-2 등)을 근거로 "있다"고 답했습니다. Haiku는 20회 중 19회와
  6회였고(p = 0.00004), limit-fix 11회가 "있다"고 답했습니다. 한계가 없을 때는 한 번도 없었습니다. Haiku에게는
  도구 수정만으로는 거의 효과가 없었고, 확인 수단을 쓰게 만든 것은 해석 한계였습니다. 한계를 더 잘 활용한 것은
  Opus였습니다. Haiku의 남은 오답은 대부분 한계를 언급한 뒤 해킹 도구는 "바이러스가 아니다"라고 결론
  냈습니다. 한계의 위치도 중요했습니다. 에이전트는 답하기 전에 ClamAV 출력을 다시 읽는데, 그 출력에는
  "E01: OK"만 있었습니다. 문장이 첫 응답에만, 결과와 떨어진 notes 칸에 있었을 때 Opus limit은 10회 중 7회가
  "바이러스 없음"이었고, 색인되는 출력에도 넣자 20회 중 4회였습니다(p = 0.015).
