# EXP-006: one verification. The folder name is the identifier to cite;
# the title may change.
title: "Does trudi's lifecycle check hide an exfiltration phase that was never examined?"
title_ko: "trudi의 공격 단계 점검이 검사하지 않은 유출 단계를 가릴까?"
server: trudi
status: planned                  # planned | in-progress | done
change: |
  EXP-005 showed that, before the fix, trudi's readiness check counts the
  exfiltration phase as examined once any successful tool call names a .zip
  file. This test looks at what an agent reports on a real case, run through
  trudi's tools the way EXP-003 ran mulder's: Claude Code with the MCP
  server, without trudi's own director and reviewer models.

  - Evidence: the NIST Data Leakage PC image, without the removable media.
    The briefing does not say the case is about leakage.
  - Task: Claude Code (Opus) examines the image with trudi's model-free tools
    and reports, for each lifecycle phase, whether it was established, ruled
    out or not examined, and whether data left the PC.
  - Prompt addition (from trudi's own procedure, claude/CLAUDE.md "Attack-
    Lifecycle Coverage"): call reason_readiness_status before reporting; a
    phase it shows as never examined is a blind spot, not a clean bill.
  - Before: a tool call on one of the leaked archives makes the check count
    exfiltration as examined, and its warning stops naming it.
  - After (lifecycle-skip-fingerprints, our patch): hashing does not count.
  - To be confirmed without a model before any run: that an ordinary step on
    this image (hashing or extracting one of its archives) does change the
    check before the fix.
change_ko: |
  EXP-005에서 수정 전 trudi의 준비 점검이, 성공한 도구 호출이 .zip 파일을 가리키기만 해도 유출 단계를 검사한 것으로 센다는 것을 확인했습니다. 여기서는 실제 사건에서 에이전트가 무엇을 보고하는지 봅니다. EXP-003에서 mulder를 돌린 방식처럼, trudi 자체의 지휘·검토 모델 없이 Claude Code와 MCP 서버로 돌립니다.

  - 증거: 이동식 매체를 뺀 NIST Data Leakage PC 이미지. 브리핑은 유출 사건이라고 말하지 않습니다.
  - 작업: Claude Code(Opus)가 trudi의 모델 없는 도구로 이미지를 조사하고, 공격 단계마다 확인/배제/미검사를 적고, 자료가 PC를 떠났는지 답합니다.
  - 프롬프트 추가(trudi 자체 절차, claude/CLAUDE.md "Attack-Lifecycle Coverage"): 보고 전에 reason_readiness_status를 부르고, 검사하지 않은 것으로 나온 단계는 깨끗한 것이 아니라 사각지대로 다룹니다.
  - 수정 전: 유출된 압축 파일 하나에 도구를 실행하면 점검이 유출 단계를 검사한 것으로 세고, 경고에서 빠집니다.
  - 수정 후(lifecycle-skip-fingerprints, 우리 패치): 해시 계산은 세지 않습니다.
  - 실행 전에 모델 없이 먼저 확인할 것: 이 이미지에서 평범한 작업(압축 파일의 해시 계산이나 추출)이 수정 전 점검을 실제로 바꾸는지.
links:
  - https://github.com/nebulae/trudi
  - https://cfreds-archive.nist.gov/data_leakage_case/data-leakage-case.html
  - https://cfreds-archive.nist.gov/data_leakage_case/leakage-answers.pdf

case: nist-data-leakage-trudi
harness: claude-code
harness_options:
  model: claude-opus-4-6
  answer_section: true
  instruction: "Start with misc_start_execution_log. Before you report, call reason_readiness_status: a forensic investigation must try to establish or rule out each phase of the attack lifecycle, and a phase it shows as never examined is a blind spot, not a clean bill."
  tools: [misc_start_execution_log, reason_readiness_status, hash_file, ewf_info, tsk_mmls, tsk_fls, tsk_icat,
          ez_recmd_hive, ez_lecmd, ez_jlecmd, ez_pecmd, ez_sbecmd, misc_usbdeviceforensics, misc_hindsight_chrome,
          misc_evtx_filter, strings_grep]

variants:
  before: trudi-88fbca7                  # trudi main as published
  after: trudi-88fbca7-lifecycle-fix     # plus lifecycle-skip-fingerprints
