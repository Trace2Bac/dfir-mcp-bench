# EXP-006: one verification. The folder name is the identifier to cite;
# the title may change.
title: "Does trudi's lifecycle check hide an exfiltration phase that was never examined?"
title_ko: "trudi의 공격 단계 점검이 검사하지 않은 유출 단계를 가릴까?"
server: trudi
status: in-progress              # planned | in-progress | done
change: |
  trudi's readiness check decides whether each phase of the attack lifecycle
  was examined by matching patterns against the commands of successful tool
  calls. Before the fix, any call that names a .zip file matches the
  exfiltration pattern for archivers (\bzip\b) and counts that phase as
  examined. This test looks at what an agent reports on a real case when
  that happens at the first step.

  - Evidence: a system-level triage collection made from the NIST Data
    Leakage PC image (real files): system registry hives, main event logs,
    Prefetch, RecentFileCache, setupapi.dev.log, as PC-triage.zip and
    unpacked. The USB stick that carried the data out (NIST RM#2) shows in
    the SYSTEM hive and the device-install log. The briefing does not say
    the case is about leakage.
  - Task: Claude Code (Opus) calls trudi over MCP with its model-free tools
    (trudi's own director and reviewer models are not used, as mulder was
    run without its orchestrator in EXP-003). It verifies the collection,
    examines it, and reports each lifecycle phase as established, ruled out
    or not examined. Leakage is not asked about directly.
  - Prompt addition, as in EXP-003: work through the lifecycle one phase at
    a time, call reason_readiness_status after each, use its lifecycle
    coverage to pick a phase not yet examined, and answer when it shows
    every phase covered. This follows trudi's procedure (claude/CLAUDE.md,
    "Attack-Lifecycle Coverage"), where the lifecycle phases are the goals
    that drive collection and analysis.
  - Before: verifying PC-triage.zip counts exfiltration as examined, so the
    check never offers it as a phase still to examine.
  - After (lifecycle-skip-fingerprints and lifecycle-archive-names, our
    patches): neither hashing nor a .zip file name counts, and the check
    shows exfiltration as not examined until one of its sources (USB
    history and others) is looked at.
  - The two labels differ by the patches only.
change_ko: |
  trudi의 준비 점검은 성공한 도구 호출의 명령에 패턴을 대조해 공격 단계마다 검사했는지 정합니다. 수정 전에는 .zip 파일을 가리키는 호출이 하나라도 있으면 유출 단계의 압축 도구 패턴(\bzip\b)이 맞아서 그 단계를 검사한 것으로 셉니다. 여기서는 그 일이 첫 단계에서 일어날 때 에이전트가 실제 사건에서 무엇을 보고하는지 봅니다.

  - 증거: NIST Data Leakage PC 이미지에서 만든 시스템 수준 트리아지 수집본(실제 파일). 레지스트리 시스템 하이브, 주요 이벤트 로그, Prefetch, RecentFileCache, setupapi.dev.log를 PC-triage.zip과 풀어 둔 폴더로 둡니다. 자료를 반출한 USB 메모리(NIST RM#2)는 SYSTEM 하이브와 장치 설치 로그에 나타납니다. 브리핑은 유출 사건이라고 말하지 않습니다.
  - 작업: Claude Code(Opus)가 MCP로 trudi의 모델 없는 도구를 씁니다(EXP-003에서 mulder를 오케스트레이터 없이 돌린 것처럼 trudi 자체의 지휘·검토 모델은 쓰지 않음). 수집본을 확인하고 조사한 뒤, 공격 단계마다 확인/배제/미검사를 적습니다. 유출을 직접 묻지는 않습니다.
  - 프롬프트 추가(EXP-003과 같은 방식): 공격 단계를 하나씩 조사하고, 단계마다 reason_readiness_status를 불러 그 공격 단계 범위로 아직 검사하지 않은 단계를 고르며, 모든 단계가 다뤄졌다고 나오면 답합니다. 공격 단계를 조사의 목표로 삼는 trudi 절차(claude/CLAUDE.md "Attack-Lifecycle Coverage")를 따른 것입니다.
  - 수정 전: PC-triage.zip을 확인하면 유출 단계가 검사한 것이 되어, 점검이 유출을 남은 단계로 내놓지 않습니다.
  - 수정 후(lifecycle-skip-fingerprints와 lifecycle-archive-names, 우리 패치): 해시도 .zip 파일 이름도 세지 않으므로, 유출 자료(USB 기록 등)를 볼 때까지 점검이 유출 단계를 미검사로 보여 줍니다.
  - 두 라벨의 차이는 패치뿐입니다.
criteria: |
  Written before the runs, and judged from each run's tool calls together
  with its answer.

  - The exfiltration sources in this collection are the SYSTEM hive's USB
    keys (USBSTOR, MountedDevices), setupapi.dev.log and the event logs. A
    run examined exfiltration when a tool read one of them for removable
    media (for example RegRipper usbstor or a search of setupapi.dev.log
    for USBSTOR).
  - Q1 is judged on the exfiltration phase. Found: exfiltration established
    from those sources, naming the USB stick RM#2 (SanDisk Cruzer Fit, S/N
    4C530012550531106501, 2015-03-24). Partial: USB storage connections
    reported but exfiltration not established. False positive: exfiltration
    called examined, ruled out or clean while no exfiltration source was
    examined, or ruled out at all (NIST: data left the PC). Missed: it says
    exfiltration was not examined.
  - The labels are compared on Q1 false positives and on how many runs
    examined an exfiltration source (Fisher's exact test).
criteria_ko: |
  실행 전에 정했고, 실행 기록의 도구 호출과 답을 함께 봅니다.

  - 이 수집본에서 유출 단계의 자료는 SYSTEM 하이브의 USB 키(USBSTOR, MountedDevices), setupapi.dev.log, 이벤트 로그입니다. 도구로 이 가운데 하나를 이동식 매체 관점에서 읽었으면(예: RegRipper usbstor, setupapi.dev.log에서 USBSTOR 검색) 유출 단계를 검사한 것입니다.
  - Q1은 유출 단계로 판정합니다. 일치: 그 자료로 유출을 확인하고 USB 메모리 RM#2(SanDisk Cruzer Fit, S/N 4C530012550531106501, 2015-03-24)를 지목한 경우. 부분: USB 저장 장치 연결은 보고했지만 유출을 확인하지 않은 경우. 오탐: 유출 자료를 하나도 보지 않았는데 유출을 검사했다·배제했다·깨끗하다고 하거나, 어떤 경우든 유출을 배제한 경우(NIST: 자료가 PC를 떠남). 놓침: 유출 단계를 검사하지 않았다고 밝힌 경우.
  - 두 라벨은 Q1 오탐률과 유출 자료를 검사한 실행 수(Fisher 정확 검정)로 비교합니다.
