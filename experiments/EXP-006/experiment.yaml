# EXP-006: one verification. The folder name is its permanent identifier;
# the title may change.
title: "The Haiku tool changes on another Windows case (Data Leakage)"
title_ko: "Haiku용 도구 변경을 다른 Windows 사건에 적용 (Data Leakage)"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  EXP-004 changed mulder's tools on the NIST Hacking Case and reviewed the
  result against that case's answers; EXP-005 ran the same versions on
  Rhino Hunt, a case of a different kind, where most of the new tools did
  not apply. This experiment runs them, unchanged, on a case of the same
  kind that was not used to build them: the NIST Data Leakage Case, EnCase
  images of a Windows 7 PC, a USB stick and a CD-R. Many of its questions
  are of the kind the new tools answer (the acquisition hashes, OS, time
  zone, computer name, accounts, last shutdown, network interface,
  installed programs, the Recycle Bin), and many are not (e-mail, USB
  devices, the network drive, Google Drive logs, CD burning, Sticky Notes,
  deleted files on the USB stick). The question is whether the EXP-004 gain
  holds on a Windows case it was not made for. Haiku in every role, five
  runs per label.
change_ko: >
  EXP-004는 NIST Hacking Case로 mulder 도구를 고치고 그 사건의 정답으로 검토했다. EXP-005는 같은
  버전을 종류가 다른 사건(Rhino Hunt)에 돌렸고, 새 도구 대부분이 적용되지 않았다. 이 실험은 같은
  버전을 그대로, 만들 때 쓰지 않은 같은 종류의 사건에 돌린다. NIST Data Leakage Case로, Windows 7
  PC와 USB 메모리, CD-R의 EnCase 이미지다. 질문 중 상당수는 새 도구가 답하는 종류(획득 해시, OS,
  시간대, 컴퓨터 이름, 계정, 마지막 종료, 네트워크 인터페이스, 설치 프로그램, 휴지통)이고, 상당수는
  그렇지 않다(이메일, USB 장치, 네트워크 드라이브, Google Drive 로그, CD 굽기, Sticky Notes, USB의
  삭제 파일). EXP-004의 향상이 만들 때 쓰지 않은 Windows 사건에서도 유지되는지 본다. 모든 역할
  Haiku, 라벨당 5회.
links:
  - https://cfreds-archive.nist.gov/data_leakage_case/data-leakage-case.html
  - https://cfreds-archive.nist.gov/data_leakage_case/leakage-answers.pdf

case: nist-data-leakage
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10                  # upstream release
  after: mulder-1.5.10-haiku-assists     # the version reviewed in EXP-004
