# EXP-006: one verification. The folder name is its permanent identifier;
# the title may change.
title: "[Baseline] mulder investigate on the NIST Hacking Case with Sonnet"
title_ko: "[Baseline] Sonnet으로 돌린 NIST Hacking Case mulder investigate"
server: mulder
kind: baseline                   # bug-fix | feature | ablation | baseline
status: done                     # planned | in-progress | done
change: >
  None. The same run as EXP-005 (unmodified mulder 1.5.10, the NIST CFReDS
  Hacking Case, all 31 questions of NIST's answer key) with Sonnet 4.6 in
  place of Opus 4.6 as planner and analyst. It shows how much the score
  depends on the model and whether the cheaper setting is good enough for
  repeated before/after runs.
change_ko: >
  변경 없음. EXP-005와 같은 실행(수정하지 않은 mulder 1.5.10, NIST CFReDS Hacking Case,
  NIST 정답지 31개 질문 전부)에서 planner와 analyst만 Opus 4.6 대신 Sonnet 4.6으로
  바꾼다. 점수가 모델에 얼마나 좌우되는지, 그리고 반복 before/after 실행에 더 싼 설정을
  써도 되는지 본다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
# Only the planner and analyst model differ from EXP-005.
harness: mulder-investigate
harness_options:
  models: {planner: claude-sonnet-4-6, executor: claude-haiku-4-5, analyst: claude-sonnet-4-6}
  effort: max
  answer_section: true

variants:
  before: mulder-1.5.10          # upstream release

conclusion: >
  No report in two attempts. The first stopped in the report phase when the
  API credit ran out. The second ran 50 minutes: catalog, extraction and
  alternative narrative passed, then the report phase used 12 sessions of 25
  turns (three attempts, each with three continuations) without calling
  submit_narrative or finalize_report, and the run failed with "The report
  was not finalized". 586 of its 881 tool calls were in the report phase,
  444 of them searches: each session said it would gather details for the
  case questions, and each continuation restarted with a fresh context and
  searched again. mulder reported 148.6K Sonnet and 17.5K Haiku output
  tokens. The same briefing let Opus (EXP-005) and Haiku (EXP-009) finish,
  so with Sonnet the request to answer all 31 questions in the report keeps
  the report writer investigating. The logs of the second attempt are in
  failed/. Not usable for repeated runs on this case.
conclusion_ko: >
  두 번 모두 보고서 없음. 첫 번째는 보고서 단계에서 API 크레딧이 떨어져 멈췄다. 두 번째는
  50분 동안 목록 작성, 추출, 반대 가설 검토 단계를 통과했지만, 보고서 단계에서 25턴짜리
  세션을 12번(시도 3번, 시도마다 이어 하기 3번) 쓰는 동안 submit_narrative도 finalize_report도
  부르지 않아 "The report was not finalized"로 실패했다. 도구 호출 881번 중 586번이 보고서
  단계였고 그중 444번이 검색이었다. 세션마다 질문에 답할 세부 정보를 더 모으겠다고 했고, 이어
  하기는 새 맥락으로 다시 시작해 또 검색했다. mulder가 보고한 출력 토큰은 Sonnet 148.6K,
  Haiku 17.5K. 같은 브리핑으로 Opus(EXP-005)와 Haiku(EXP-009)는 끝냈으므로, Sonnet에서는
  보고서에 31개 질문에 모두 답하라는 요청이 보고서 작성자를 계속 조사하게 만든다. 두 번째
  시도의 로그는 failed/에 있다. 이 케이스의 반복 실행에는 쓸 수 없다.
