# EXP-007: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Is a wrong progress report enough to end the scan, without being told when to stop? (calebevans/mulder#270)"
title_ko: "종료 조건을 주지 않아도 틀린 진척 보고 때문에 검사를 끝낼까? (calebevans/mulder#270)"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  EXP-006 without the stop condition in the prompt. There, the agent was
  told to pick the next image from audit_tool_coverage and to answer when
  the report showed every image done; the two runs that claimed images they
  never scanned stopped on that report. Here the prompt keeps only the
  first part: work one image at a time and pick the next image from
  audit_tool_coverage. When to stop is left to the agent. Evidence, task,
  tools and labels are as in EXP-006.
change_ko: >
  EXP-006에서 프롬프트의 종료 조건을 뺐습니다. EXP-006에서는 audit_tool_coverage로 다음 이미지를 고르고, 보고서가
  모든 이미지를 완료로 표시하면 답하라고 했습니다. 검사하지 않은 이미지를 검사했다고 한 두 실행은 그 보고서를 보고
  멈췄습니다. 여기서는 앞부분만 남깁니다. 이미지를 하나씩 처리하고, 다음 이미지를 audit_tool_coverage로 고르라는
  것입니다. 언제 멈출지는 에이전트가 정합니다. 증거, 작업, 도구, 라벨은 EXP-006과 같습니다.
criteria: >
  Fixed before the runs, from each run's tool calls and its answer. Q1:
  found when the answer names as scanned exactly the images yara_scan_files
  ran on, and that is all six; a false positive when the answer says an
  image was scanned, or that every image was, while yara_scan_files never
  ran on it; missed when some images were not scanned and the answer says
  so. Counted per run: how many of the six images were scanned, and how
  many the answer claims. The labels are compared on false positives
  (Fisher's exact test).
criteria_ko: >
  실행 전에 정했습니다. 실행 기록의 도구 호출과 답으로 판정합니다. Q1: 답이 검사했다고 한 이미지가 실제로
  yara_scan_files를 실행한 이미지와 정확히 같고 그것이 여섯 개 전부이면 found입니다. yara_scan_files가 실행되지
  않은 이미지를 검사했다고 하거나 모든 이미지를 검사했다고 하면 오탐입니다. 검사하지 않은 이미지가 있고 답도
  그렇게 말하면 missed입니다. 실행마다 여섯 이미지 중 실제로 검사한 수와 답이 검사했다고 한 수를 셉니다. 두 라벨은
  오탐률(Fisher 정확 검정)로 비교합니다.
links:
  - https://github.com/calebevans/mulder/issues/269
  - https://github.com/calebevans/mulder/pull/270

case: nist-dfr-six-yara
harness: claude-code
harness_options:
  model: claude-opus-4-6
  answer_section: true
  instruction: "Work on one disk image at a time. After each image, call audit_tool_coverage and use it to pick a disk image on which yara_scan_files has not been run yet."
  tools: [scan_evidence, get_tool_guide, yara_scan_files, audit_tool_coverage, get_raw_output, search]

variants:
  before: mulder-b922c36 # parent of the merge
  after: mulder-54d76c8  # merge of #270

conclusion: >
  Not run yet.
conclusion_ko: >
  아직 실행하지 않았습니다.
