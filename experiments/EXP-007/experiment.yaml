# EXP-007: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does stating a tool's limits change Haiku's conclusions?"
title_ko: "도구의 해석 한계를 알리면 Haiku의 결론이 달라질까?"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  Both labels run the same improved tools (tool-improvements, system-profile
  and recycle-bin patches), and in both the tools' messages, which summarize
  what was found and where it is indexed, reach the analyst. They differ only
  in interpretation limits,
  statements of what a tool's result does not show or what the tool did not
  check. before has none: every such statement is removed, in mulder's
  prompts (the evidence interpretation rules, attribution caution, "absence
  of evidence in one source is not conclusive"), in mulder's tools (the YARA
  and malfind caveats, partial-scan warnings) and in the bench's own tool
  changes. after has all of them: mulder's own
  and the sentences limit-display appends to the messages (analyze_disk_pcaps: which files it searched
  and that files with other extensions were not opened; run_hashdeep: that
  the file hashes are not the media hash; run_clamav: what it scanned inside
  the image and what it did not; the new tools: what they could not read),
  Compared, five runs per label: false positives (claims the
  evidence contradicts, such as "no capture exists" or "no virus"), then
  full match and detection.
change_ko: >
  두 라벨 모두 같은 개선 도구(tool-improvements, system-profile, recycle-bin 패치)를 쓰고, 둘 다 찾은
  것과 색인된 위치를 요약한 도구 메시지가 analyst까지 갑니다. 차이는
  해석 한계 하나입니다. 해석 한계는 도구 결과가 무엇을 보여 주지 않는지, 도구가 무엇을 확인하지
  않았는지를 알리는 문장입니다. before에는 해석 한계가 전혀 없습니다. mulder 프롬프트(증거 해석 규칙,
  귀속 주의, "한 출처에 증거가 없다고 결론을 낼 수는 없다" 같은 문장), mulder 도구(YARA와 malfind의
  주의 문구, 일부만 검사했다는 경고), 벤치가 고친 도구에서 이런 문장을 모두 지웠습니다. after에는 모두 있습니다.
  mulder의 원래 한계와 limit-display가 메시지 끝에 덧붙인 한계(analyze_disk_pcaps: 어떤 파일을 찾았고 다른 확장자
  파일은 열지 않았다는 것, run_hashdeep: 파일 해시는 매체 해시가 아니라는 것, run_clamav: 이미지
  안에서 무엇을 검사했고 무엇을 하지 않았는지, 새 도구: 읽지 못한 것)입니다. 라벨당 5회로 오탐(증거와 반대되는 단정, 예: "캡처가
  없습니다", "바이러스가 없습니다")을 먼저 보고, 완전 일치와 탐지를 함께 비교합니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10-tool-assists-no-limits  # improved tools, every limit statement removed
  after: mulder-1.5.10-tool-assists-limits      # the same tools, every limit statement, reaching the analyst
