# EXP-007: one verification. The folder name is the identifier to cite;
# the title may change.
title: "Does an agent following findevil's procedure skip a shell history the report counted?"
title_ko: "findevil 절차를 따르는 에이전트가, 보고서가 검사됨으로 센 셸 이력을 건너뛸까?"
server: findevil
status: in-progress              # planned | in-progress | done
change: |
  EXP-005 showed that, before the fix, assess_coverage counts all three
  shell histories of findevil's scenario 02 as examined once
  find_shell_histories has listed them. This test looks at what an agent
  does with that report in an ordinary investigation.

  - Task: Claude Code (Sonnet 5.5) investigates scenario 02 end to end with all of
    findevil's tools, and says whose shell histories it analyzed and how the
    server was compromised.
  - Prompt: nothing added. findevil's own instructions tell the agent to
    repeat its work until assess_coverage says COVERAGE CLEAN.
  - Before: the report stops asking for the histories once they are listed.
  - After (coverage-per-location, our patch): it lists each history not yet
    analyzed.
  - Why Sonnet 5.5: with Opus 4.6, 20 of 20 runs analyzed all three
    histories right after listing them and read the report only at the end
    (archived). A team member's Sonnet 5.5 runs left a history unanalyzed in
    4 of 10.
  - The two labels differ by the patch only.
change_ko: |
  EXP-005에서 수정 전 assess_coverage가 findevil 시나리오 02의 셸 이력 세 개를, find_shell_histories로 나열만 해도 모두 검사한 것으로 센다는 것을 확인했습니다. 여기서는 평범한 조사에서 에이전트가 이 보고서를 받아 어떻게 하는지 봅니다.

  - 작업: Claude Code(Sonnet 5.5)가 findevil의 모든 도구로 시나리오 02를 처음부터 끝까지 조사하고, 누구의 셸 이력을 분석했는지와 서버가 어떻게 침해됐는지 답합니다.
  - 프롬프트: 추가한 문장이 없습니다. findevil의 서버 지침이 assess_coverage가 COVERAGE CLEAN이라고 할 때까지 작업을 되풀이하라고 합니다.
  - 수정 전: 이력을 나열만 하면 보고서가 더 이상 이력 분석을 요구하지 않습니다.
  - 수정 후(coverage-per-location, 우리 패치): 아직 분석하지 않은 이력을 하나하나 나열합니다.
  - Sonnet 5.5인 이유: Opus 4.6에서는 20회 모두 이력을 나열하자마자 세 개를 다 분석했고, 보고서는 마지막에만 봤습니다(보관함). 팀원이 Sonnet 5.5로 돌렸을 때는 10회 중 4회가 분석하지 않은 이력을 남겼습니다.
  - 두 라벨의 차이는 패치 하나뿐입니다.
criteria: |
  Written before the runs, and judged from each run's tool calls together
  with its answer.

  - Q1 found: the users named are exactly those whose history
    analyze_bash_history ran on, and that is all three.
  - Q1 false positive: the answer says a user's history was analyzed, or
    that all were, while analyze_bash_history never ran on it.
  - Q1 missed: some histories were not analyzed and the answer says so.
  - Q2 found: 185.229.59.103 and system-updater.service, from the tools.
    Partial: one of them. False positive: the server was not compromised.
  - A script (runner/bench/scan_claims.py) compares the histories each run
    analyzed with the users its answer names.
  - The labels are compared on Q1 false positives and on how many runs
    analyzed all three histories (Fisher's exact test).
criteria_ko: |
  실행 전에 정했고, 실행 기록의 도구 호출과 답을 함께 봅니다.

  - Q1 일치: 답에 적힌 사용자가 analyze_bash_history를 실제로 실행한 이력의 사용자와 정확히 같고, 그것이 세 명 전부인 경우.
  - Q1 오탐: analyze_bash_history를 실행하지 않은 이력을 분석했다고 하거나, 모두 분석했다고 한 경우.
  - Q1 놓침: 분석하지 않은 이력이 있고 답에서도 그렇게 밝힌 경우.
  - Q2 일치: 도구 결과를 근거로 185.229.59.103과 system-updater.service를 답한 경우. 부분: 둘 중 하나. 오탐: 서버가 침해되지 않았다고 한 경우.
  - 실행마다 실제로 분석한 이력과 답에 적힌 사용자를 스크립트(runner/bench/scan_claims.py)로 비교합니다.
  - 두 라벨은 Q1 오탐률과 세 이력을 모두 분석한 실행 수(Fisher 정확 검정)로 비교합니다.
