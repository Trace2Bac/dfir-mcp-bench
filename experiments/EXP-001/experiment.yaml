# EXP-001: one verification. The folder name is its permanent identifier;
# the title may change.
title: "[Bug Fix] tshark field names (calebevans/mulder#274)"
title_ko: "[Bug Fix] tshark 필드 이름 수정 (calebevans/mulder#274)"
server: mulder
kind: bug-fix # bug-fix | feature | ablation | baseline
status: done # planned | in-progress | done
change: >
  Our first test: verifying our PR calebevans/mulder#274. The run_pcap_analysis
  tool asked tshark for fields that current Wireshark does not have
  (dns.resp.addr, smtp.response.parameter), so both the dns and smtp modes
  failed. Even so, mulder reported success and stored the tshark error as the
  result. The fix requests dns.a and smtp.rsp.parameter.
change_ko: >
  첫 번째 테스트로, 우리가 올린 PR calebevans/mulder#274를 검증했다.
  run_pcap_analysis 도구가 현재 Wireshark에 없는 필드(dns.resp.addr,
  smtp.response.parameter)를 tshark에 요청해서 dns·smtp 두 모드가 모두 실패했다.
  그런데도 mulder는 성공했다고 보고하고 tshark 오류 문구를 결과로 저장했다.
  수정 후에는 dns.a와 smtp.rsp.parameter를 요청한다.
links:
  - https://github.com/calebevans/mulder/issues/273
  - https://github.com/calebevans/mulder/pull/274

# How it was tested: the case (questions, tools, scripted calls; its dataset is
# named in the case) and the harness that ran it.
case: pcap-dns-smtp
harness: bench-runner # runner/ with a local model, or scripted calls

# Server versions, by label (servers/mulder/variants/<name>.env). before is the
# parent commit of the fix and after the fix commit, so they differ by the fix.
variants:
  before: mulder-1040615 # v1.5.4, parent of the fix
  after: mulder-e74ae6d # the fix commit

# Scores the scripted run must reach on each label; `./bench.sh check` fails
# when a run differs.
scripted_expect:
  before: { questions: 0/3, facts: 0/4 }
  after: { questions: 3/3, facts: 4/4 }

conclusion: >
  Without a model the same calls return the tshark error before the fix and
  the DNS answer and SMTP session after it (0/3 to 3/3). With qwen3.5-9b,
  thinking off, five runs each: 0/5 runs passed before and 5/5 after, 12 turns
  (the limit) against 5. The model saw no tool error before the fix, because
  mulder reported success. One earlier run with thinking on passed before the
  fix by switching to mode=custom; thinking-on runs were not repeated.
conclusion_ko: >
  모델 없이 같은 호출을 하면 수정 전에는 tshark 오류가, 수정 후에는 DNS 응답과
  SMTP 세션이 나온다 (0/3 → 3/3). qwen3.5-9b(생각 끔)로 각각 5번 돌린 결과 수정 전
  0/5, 수정 후 5/5 성공, 턴은 12(한도) 대 5였다. 수정 전에는 mulder가 success를
  돌려줘서 모델이 도구 오류를 보지 못했다. 생각을 켠 예전 실행 한 번은 mode=custom으로
  바꿔 수정 전에도 통과했다. 생각 켠 실행은 반복하지 않았다.
