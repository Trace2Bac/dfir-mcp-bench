# EXP-008: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does stating a tool's limits change Haiku's conclusions? (Data Leakage)"
title_ko: "도구의 해석 한계를 알리면 Haiku의 결론이 달라질까? (Data Leakage)"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  The same two versions as EXP-007, on another case. In EXP-007 (NIST
  Hacking Case) the tools found what they looked for (the capture, the
  ClamAV detections, the acquisition hash), so the interpretation limits had
  nothing to prevent: on the questions those tools answer both labels scored
  the same. This experiment runs them on the NIST Data Leakage Case, where
  many questions are of a kind the tools do not answer (e-mail, USB devices,
  the network drive, CD burning) and where some tools come back empty (there
  is no packet capture) or partial (three EnCase images, one of them in
  segments). That is where a limit statement can matter: before reads only
  "nothing found", after also reads what was searched and that this does not
  show the evidence is absent. Both labels run the same improved tools and
  pass the same result messages to the analyst; before has every
  interpretation limit removed, after has all of them. Compared, five runs
  per label: false positives (especially claims that something does not
  exist or did not happen), how many missed answers say "not determined"
  rather than state a wrong value, then full match and detection.
change_ko: >
  EXP-007과 같은 두 버전을 다른 케이스에 돌립니다. EXP-007(NIST Hacking Case)에서는 도구가 찾으려던 것을
  모두 찾아서(캡처, ClamAV 탐지, 획득 해시) 해석 한계가 막을 일이 없었습니다. 그 도구들이 답하는
  질문에서는 두 라벨의 점수가 같았습니다. 이 실험은 NIST Data Leakage Case에 돌립니다. 질문 상당수가
  도구가 답하지 못하는 종류(이메일, USB 장치, 네트워크 드라이브, CD 굽기)이고, 결과가 비거나(캡처
  파일이 없음) 일부만 나오는(EnCase 이미지 3개, 그중 하나는 여러 조각) 도구가 있습니다. 해석 한계가
  작동할 수 있는 상황입니다. before는 "찾지 못했습니다"만 받고, after는 어디까지 찾았는지와 그것이
  증거가 없다는 뜻은 아니라는 것도 받습니다. 두 라벨 모두 같은 개선 도구를 쓰고 같은 결과 메시지가
  analyst까지 갑니다. before는 해석 한계를 모두 지웠고, after는 모두 있습니다. 라벨당 5회로 오탐(특히
  "없습니다", "하지 않았습니다" 같은 단정)을 먼저 보고, 놓친 답 중 틀린 값을 단정하지 않고 "확인
  불가"라고 답한 비율, 완전 일치와 탐지를 함께 비교합니다.
