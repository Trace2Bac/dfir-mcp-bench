# EXP-009: one verification. The folder name is its permanent identifier;
# the title may change.
title: "analyze_disk_pcaps says what it searched when it finds nothing (Haiku)"
title_ko: "analyze_disk_pcaps가 찾은 것이 없을 때 확인 범위를 알림 (Haiku)"
server: mulder
status: done                     # planned | in-progress | done
change: >
  analyze_disk_pcaps looks for packet captures in the disk image's file
  listing by file name extension only. When it finds none it returns a plain
  success, "No packet capture files found", so a model can read it as "there
  is no capture". In the first run here (before, run 1) Haiku did exactly
  that for the capture saved as "interception" and concluded Ethereal had not
  been used. The after version keeps the search as it is and changes only
  the empty result: status no_results, the number of files and the
  partitions checked, that files were matched by extension only, and that
  this does not show the image holds no capture (guideline 4.1 and 4.2). It
  also changes get_completed_results, which a batch caller uses to read
  results, to pass on a result's own status and message: it returned only
  the outer "success", so a version with the tool change alone (run twice,
  then removed) never got its message to the model. after-2 carries the
  limit the rest of the way: indexed results also pass on their status,
  message and warning, the executor copies them into a "note" instead of
  summarizing them, and the analyst, which saw only tool, status and source,
  also receives that note. It also makes run_clamav warn, in its result and
  in the indexed text, when it scans a disk image as one file. Compared:
  claims that no capture exists (Q23) and that there is no virus (Q31), over
  five runs per label.
change_ko: >
  analyze_disk_pcaps는 디스크 이미지의 파일 목록에서 확장자로만 캡처 파일을 찾는다. 찾은 것이
  없으면 "No packet capture files found"와 함께 그냥 성공을 돌려주므로, 모델이 "캡처 파일이
  없다"로 읽을 수 있다. 이 실험의 첫 실행(before 1회차)에서 Haiku가 실제로 "interception"으로
  저장된 캡처를 놓치고 Ethereal을 쓰지 않았다고 결론지었다. after는 찾는 방식은 그대로 두고
  결과 없음 응답만 바꾼다. 상태 no_results, 확인한 파일 수와 파티션, 확장자로만 찾았다는 것,
  그래서 캡처가 없다고 단정할 수 없다는 것을 알린다(가이드라인 4.1, 4.2). 또 일괄 실행 결과를 읽는
  get_completed_results가 결과의 상태와 메시지를 함께 넘기게 바꾼다. 이 함수는 바깥의 "success"만
  넘겼기 때문에, 도구만 바꾼 버전(2회 실행 후 삭제)은 메시지가 모델에 닿지 않았다. 반복 실행에서
  Q23~Q25와 "캡처 파일이 없다"는 주장을 비교한다. after-2는 한계를 끝까지 전달한다. 색인되는
  결과도 상태, 메시지, 경고를 넘기고, executor는 이를 요약하지 않고 "note"에 그대로 옮기며,
  tool, status, source만 받던 analyst가 그 note도 받는다. 또 run_clamav가 디스크 이미지를 파일
  하나로 검사할 때 결과와 색인 텍스트에 경고를 넣는다. 라벨당 5회로 "캡처가 없다"(Q23),
  "바이러스가 없다"(Q31)는 단정을 비교한다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10                 # upstream release
  after: mulder-1.5.10-pcap-scope-batch   # the empty-result change, and get_completed_results passing it on
  after-2: mulder-1.5.10-limits-to-analyst   # and the limit carried on to the analyst; run_clamav's caveat

conclusion: >
  Haiku in every role, five runs per label. With get_completed_results
  passing the result's status and message (after), the message reached the
  executor, but the claim that no capture exists did
  not go away: it appeared in 2 of 5 runs before and 2 of 5 after.
  Reading the executor's reports explains it. The analyst sees the
  executor's summary, not the tool result, and Haiku rewrote it differently
  each time: "not found by extension" (run 1) and the full note with the
  extensions (run 2) were followed by no claim of absence; "no files with
  standard extensions" (run 3) and "No PCAP files found" (run 5) by the
  claim; in run 4 the tool was not mentioned and no claim was made. So the
  limit reached the analysis only when the executor kept it. Review,
  median (range): before full match 19% (16 to 26), false positives 6% (3
  to 10); after 26% (19 to 35), 3% (0 to 13); the ranges overlap.
  The capture was not found in any run (it has no extension). after-2 is
  to be run five times.
conclusion_ko: >
  모든 역할 Haiku, 라벨당 5회. get_completed_results가 결과의 상태와 메시지를 넘기게 하자(after)
  메시지가 executor까지는 전달됐지만,
  "캡처가 없다"는 단정은 줄지 않았다. before 5회 중 2회, after 5회 중 2회. executor 보고를
  읽어 보면 이유가 보인다. 분석 단계는 도구 결과가 아니라 executor의 요약을 보는데, Haiku가 매번
  다르게 옮겼다. "확장자로 찾지 못함"(1회차), 확장자 목록까지 담은 주의(2회차) 뒤에는 단정이 없었고,
  "표준 확장자 파일 없음"(3회차), "PCAP 파일 없음"(5회차) 뒤에는 단정이 나왔다. 4회차는 이 도구를
  언급하지 않았고 단정도 없었다. 즉 한계는 executor가 그대로 옮겼을 때만 분석까지 닿았다. 검토
  중앙값(범위): before 완전 일치 19%(16~26), 오탐 6%(3~10); after 26%(19~35), 3%(0~13).
  범위가 겹친다. 캡처 파일은 어느 실행에서도 찾지 못했다(확장자가 없음). after-2는 5회 돌릴 예정이다.
