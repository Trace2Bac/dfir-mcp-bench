case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10                 # upstream release
  after: mulder-1.5.10-pcap-scope-batch   # the empty-result change, and get_completed_results passing it on
  after-2: mulder-1.5.10-limits-to-analyst   # and the limit carried on to the analyst; run_clamav's caveat
  after-3: mulder-1.5.10-tool-assists        # and three tools that do work Haiku left undone
  after-4: mulder-1.5.10-tool-assists-2      # and those tools always planned; the capture's path in its summary

conclusion: >
  Haiku in every role, five runs per label. With get_completed_results
  passing the result's status and message (after), the message reached the
  executor, but the claim that no capture exists did not go away: 2 of 5
  runs before and 2 of 5 after. The analyst sees the executor's summary, not
  the tool result, and Haiku kept the limit in some runs and dropped it in
  others; the claim followed the runs that dropped it. after-2 carries the
  limit to the analyst as a "note". The claim then appeared in 1 of 5 runs
  (run 4, although the full note was in its executor report), and the claim
  that there is no virus in 2 of 5, as before and after; in run 5 the
  analyst quoted the ClamAV caveat and still concluded "No viruses
  detected". Review, median (range): before full match 19% (16 to 26),
  false positives 6% (3 to 10); after 26% (19 to 35), 3% (0 to 13); after-2
  26% (19 to 32), 6% (0 to 10). The ranges overlap, so the change is not
  shown to lower false positives with Haiku: delivering the limit is
  necessary, but Haiku does not always act on it. Up to after-2 the capture
  was not found by name in any run (it has no extension). after-3, where
  three tools do work Haiku left undone, is the first change whose range
  does not overlap the others: full match 48% (35 to 58) against 26% (19 to
  32) for after-2, detection 61% (52 to 71), false positives 3% (0 to 6).
  get_windows_system_profile was called in all five runs, and Q2 to Q6, Q9
  to Q11 and Q13 were answered in every run (before: Q6, Q9 and Q13 at most
  once). Q24 and Q25 (the victim's Pocket PC and the MSN Hotmail sites, from
  the capture's HTTP summary) were found in three runs, never before. Q1 was
  found in the two runs that called run_hashdeep. Left: the capture was
  named in one run only, and in run 4 the report says no capture file was
  recovered although the tool had found and analysed it (the indexed
  capture summary does not carry the file's path). run_hashdeep ran in two
  runs and analyze_disk_pcaps in four.
conclusion_ko: >
  모든 역할 Haiku, 라벨당 5회. get_completed_results가 결과의 상태와 메시지를 넘기게 하자(after)
  메시지가 executor까지는 전달됐지만, "캡처가 없다"는 단정은 줄지 않았다. before 5회 중 2회, after
  5회 중 2회. 분석 단계는 도구 결과가 아니라 executor의 요약을 보는데, Haiku가 한계를 어떤 실행에서는
  옮기고 어떤 실행에서는 뺐고, 단정은 뺀 실행에서 나왔다. after-2는 한계를 "note"로 analyst까지
  전달한다. 그러자 "캡처가 없다"는 5회 중 1회(4회차, executor 보고에 note 전문이 있었는데도), "바이러스가
  없다"는 5회 중 2회로 before, after와 같았다. 5회차는 ClamAV 주의 문구를 그대로 인용하고도 "바이러스
  없음"으로 결론지었다. 검토 중앙값(범위): before 완전 일치 19%(16~26), 오탐 6%(3~10); after
  26%(19~35), 3%(0~13); after-2 26%(19~32), 6%(0~10). 범위가 겹치므로 Haiku에서는 이 변경이
  오탐을 줄인다고 보이지 않았다. 한계 전달은 필요조건이지만, Haiku가 그것을 늘 따르지는 않는다.
  after-2까지는 캡처 파일 이름을 어느 실행에서도 찾지 못했다(확장자가 없음). Haiku가 하지 않던 일을
  도구 세 개가 대신하게 한 after-3는 처음으로 범위가 겹치지 않았다. 완전 일치 48%(35~58), after-2는
  26%(19~32); 탐지 61%(52~71), 오탐 3%(0~6). get_windows_system_profile은 5회 모두 호출됐고,
  Q2~Q6, Q9~Q11, Q13은 매번 맞혔다(before에서 Q6, Q9, Q13은 많아야 1회). Q24, Q25(피해자의 Pocket
  PC와 MSN Hotmail 사이트, 캡처의 HTTP 요약에서 나옴)는 3회 맞혔다(이전에는 0회). Q1은 run_hashdeep을
  부른 2회에서 맞혔다. 남은 것: 캡처 파일 이름은 1회만 답했고, 4회차는 도구가 파일을 찾아 분석했는데도
  보고서에 "캡처 파일 없음"이라고 썼다(색인된 캡처 요약에 파일 경로가 없음). run_hashdeep은 2회,
  analyze_disk_pcaps는 4회 실행됐다.
