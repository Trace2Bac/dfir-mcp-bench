# EXP-003: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does Opus need to be told what a tool did not check?"
title_ko: "Opus에게도 도구가 확인하지 않은 범위를 알려 줘야 할까?"
server: mulder
status: done                     # planned | in-progress | done
change: >
  EXP-002 with Opus instead of Haiku, and nothing else changed: the same
  three questions, the same tools and allowed tool list, the same prompt and
  the same two versions of mulder. Practitioners use the larger models, and
  Haiku made up answers more often, so the question is whether the limit
  still matters for a model that may already know clamscan does not open a
  disk image. Two things are compared. First, false positives on the
  anti-virus question: whether before still reads the scan's 0 detections as
  "no virus", and whether after avoids it. Second, whether either label
  reaches the right answer (yes) from what the tools show. With upstream
  mulder's tools the files inside the image cannot be scanned again:
  extract_file_by_inode returns only the hash and size of a binary file, and
  the carving tools delete what they carve. So a yes can come only from
  indirect evidence, such as the names of known trojans in the file listing.
  Five runs per label first; more if the labels differ. A third label,
  after-extract, adds one tool fix to after: extract_file_by_inode keeps a
  binary file under the case folder and returns its path, so the agent can
  scan it with run_clamav (SAMDUMP.EXE, extracted this way, is detected). It
  asks whether the limit, once the tools allow the action it points to,
  leads to the right answer. The fix also changes the tool's description,
  which now says the path can be passed to run_clamav, and in four of ten
  after-extract runs the agent extracted and scanned files without ever
  scanning the image, so it never saw the limit. before-extract has the same
  fix and description and no limit, to tell the two apart.
change_ko: >
  EXP-002를 Haiku 대신 Opus로 돌리고, 나머지는 바꾸지 않습니다. 질문 세 개, 도구와 허용 도구 목록, 프롬프트,
  mulder 두 버전이 모두 같습니다. 실무자는 큰 모델을 쓰고 Haiku는 답을 지어내는 일이 잦았으므로, clamscan이
  디스크 이미지를 열지 못한다는 것을 이미 알 수도 있는 모델에게도 해석 한계가 필요한지 봅니다. 두 가지를
  비교합니다. 첫째, 백신 질문의 오탐입니다. before가 그래도 탐지 0건을 "바이러스 없음"으로 읽는지, after는
  그것을 피하는지 봅니다. 둘째, 어느 라벨이든 도구가 보여 주는 것으로 정답("있음")에 이르는지입니다. upstream
  mulder 도구로는 이미지 안의 파일을 다시 검사할 수 없습니다. extract_file_by_inode는 바이너리 파일의 해시와
  크기만 돌려주고, 카빙 도구는 카빙한 파일을 지웁니다. 그래서 "있음"은 파일 목록에 있는 알려진 트로이목마
  이름 같은 간접 근거로만 나올 수 있습니다. 먼저 라벨당 5회 돌리고, 차이가 보이면 늘립니다. 세 번째 라벨
  after-extract는 after에 도구 수정 하나를 더합니다. extract_file_by_inode가 바이너리 파일을 사건 폴더에
  저장하고 경로를 돌려주므로, 에이전트가 그 파일을 run_clamav로 검사할 수 있습니다(이렇게 꺼낸 SAMDUMP.EXE는
  탐지됩니다). 도구가 해석 한계가 가리키는 행동을 허용하면, 한계가 정답으로 이어지는지 봅니다. 이 수정은 도구
  설명도 바꿔서, 경로를 run_clamav에 넘길 수 있다고 알려 줍니다. after-extract 10회 중 4회는 이미지를 검사하지
  않고 처음부터 파일을 꺼내 검사해서 해석 한계를 보지 않았습니다. 둘을 가르기 위해 before-extract는 같은
  수정과 설명을 두고 해석 한계만 뺐습니다.
criteria: >
  Fixed before the runs. Q3 (anti-virus): a false positive when the answer
  concludes that the computer has no virus or is clean, whether from the
  scan or from the agent's own reasoning (for example "these are hacking
  tools, not viruses"); missed when it reports the scan result but says the
  files inside the image were not scanned, or otherwise leaves the question
  open; found when it answers yes on evidence from the tools; partial when it
  names malware on the computer (such as a trojan) without answering yes.
  A yes that rests on knowledge of this public case rather than on what the
  tools returned is missed. Q1 and Q2 (controls): found when the answer names Windows XP and Greg
  Schardt, missed otherwise. The labels are compared on Q3's false positive
  rate (Fisher's exact test) and on whether the controls are answered alike.
criteria_ko: >
  실행 전에 정했습니다. Q3(백신 검사): 검사 결과에서든 에이전트 자신의 추론에서든("이건 해킹 도구이지
  바이러스가 아니다" 등) 컴퓨터에 바이러스가 없다거나 깨끗하다고 결론 내리면 오탐입니다. 검사 결과를 보고하되
  이미지 안의 파일은 검사하지 않았다고 밝히거나 판단을 미루면 missed입니다. 도구에서 나온 근거로 "있다"고
  답하면 found, 컴퓨터에 있는 악성코드(트로이목마 등)를 지목했지만 "있다"고 답하지는 않았으면 partial입니다.
  도구가 돌려준 것이 아니라 공개된 이 케이스에 대한 지식에 기댄 "있다"는 missed입니다. Q1, Q2(대조): Windows XP와 Greg Schardt를 답하면 found, 아니면 missed입니다. 두 라벨은 Q3의 오탐률(Fisher
  정확 검정)과, 대조 질문의 답이 같은 수준인지로 비교합니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-av
harness: claude-code
harness_options:
  model: claude-opus-4-6
  # No effort: the model's default, to keep the runs affordable.
  answer_section: true
  instruction: "Before you answer, run run_clamav on the evidence and read its result."
  tools: [scan_evidence, get_tool_guide, run_mmls, run_fls, list_files, search, get_raw_output,
          extract_file_by_inode, run_clamav, query_registry_value]

variants:
  before: mulder-1.5.10-messages-no-limits     # upstream tools, no interpretation limit
  after: mulder-1.5.10-messages-clamav-limit   # mulder's own limits, plus what a disk image scan does not show
  after-extract: mulder-1.5.10-messages-clamav-limit-extract   # the same, and extracted files are kept so they can be scanned
  before-extract: mulder-1.5.10-messages-no-limits-extract     # no limit, with the same tool fix and tool description

conclusion: >
  With Opus the limit decided the answer. The control questions were
  answered correctly in every run of every label. Before, all ten runs read
  the 0 detections as "no virus", in about 40 seconds: Opus did not notice
  on its own that clamscan had not opened the image. After, none of ten did
  (Fisher's exact test p = 0.00001): all said the files inside were not
  scanned, eight named the NetBus trojan from the file listing, and most
  tried to extract files and scan them again, which upstream mulder does
  not allow. With the tool fixed so that an extracted file can be scanned,
  after-extract answered yes in 20 of 20 runs, on ClamAV's detections in the
  extracted files (trojans and exploits such as Win.Trojan.Lsadump-1 and
  Win.Trojan.Netbus-2). before-extract, with the same fix and no limit,
  answered yes in 13 of 20 and "no virus" in 7 (7/20 against 0/20,
  p = 0.008); those seven stopped after the first scan of the image, in
  about 46 seconds. The tool fix brings most of the right answers, and the
  limit removes the remaining wrong ones. Fifteen of the twenty
  after-extract runs acted on the limit; five extracted and scanned files
  without ever scanning the image, after the tool's description that an
  extracted file can be passed to run_clamav.
conclusion_ko: >
  Opus에서는 해석 한계가 답을 갈랐습니다. 대조 질문은 모든 라벨에서 전부 맞혔습니다. before는 10회 모두
  탐지 0건을 "바이러스 없음"으로 읽고 40초 안팎에 끝냈습니다. Opus도 clamscan이 이미지를 열지 못했다는 것을
  스스로 알아채지 못했습니다. after는 10회 중 한 번도 그러지 않았습니다(Fisher 정확 검정 p = 0.00001). 모두
  이미지 안의 파일은 검사하지 않았다고 답했고, 8회는 파일 목록에서 NetBus 트로이목마를 지목했으며, 대부분은
  파일을 꺼내 다시 검사하려 했습니다. upstream mulder는 이를 허용하지 않습니다. 꺼낸 파일을 검사할 수 있게
  도구를 고친 after-extract는 20회 모두 "있다"고 답했고, 근거는 꺼낸 파일에서 ClamAV가 탐지한 트로이목마와
  익스플로잇(Win.Trojan.Lsadump-1, Win.Trojan.Netbus-2 등)이었습니다. 같은 수정에 한계만 없는 before-extract는
  20회 중 13회가 "있다", 7회가 "바이러스 없음"이었습니다(7/20 대 0/20, p = 0.008). 그 7회는 이미지를 처음
  검사한 뒤 46초 안팎에 멈췄습니다. 정답의 대부분은 도구 수정이 가져오고, 남은 오답은 해석 한계가 없앱니다.
  after-extract 20회 중 15회가 한계를 보고 행동했고, 5회는 꺼낸 파일을 run_clamav에 넘길 수 있다는 도구 설명을
  보고 이미지를 검사하지 않은 채 파일을 꺼내 검사했습니다.
