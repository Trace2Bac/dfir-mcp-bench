# EXP-003: one verification. The folder name is the identifier to cite;
# the title may change.
title: "Does a wrong progress report end an investigation early?"
title_ko: "틀린 진척 보고가 조사를 일찍 끝내게 만들까?"
server: mulder
status: done                     # planned | in-progress | done
change: |
  Before the fix (calebevans/mulder#270), audit_tool_coverage built one list
  of tool names from the whole case's audit log, so a tool run on one disk
  image counted as run on every disk image. This test looks at what happens
  when an agent decides from that report when it is done.

  - Task: Claude Code (Opus) calls mulder serve over MCP, scans six NIST disk
    images with YARA and says which images it scanned.
  - Prompt: work on one image at a time, pick the next image from
    audit_tool_coverage, and answer when the report shows every image scanned.
  - The built-in rules match nothing on any of the six images, so in the answer
    an image that was never scanned looks the same as a clean one.
  - The two labels differ by the fix only.
change_ko: |
  수정 전(calebevans/mulder#270) audit_tool_coverage는 사건 전체의 감사 로그에서 도구 이름 목록 하나만 만들어서, 디스크 이미지 하나에 실행한 도구를 모든 디스크 이미지에 실행한 것으로 셌습니다. 여기서는 이 보고서를 보고 언제 끝낼지 정하는 에이전트에게 어떤 일이 생기는지 봅니다.

  - 작업: Claude Code(Opus)가 MCP로 mulder serve를 부르고, NIST 디스크 이미지 여섯 개를 YARA로 검사한 뒤 어떤 이미지를 검사했는지 답합니다.
  - 프롬프트: 이미지를 하나씩 처리하고, 다음 이미지를 audit_tool_coverage로 고르고, 보고서가 모든 이미지를 검사했다고 표시하면 답합니다.
  - 내장 규칙은 여섯 이미지 모두에서 아무것도 찾지 않아서, 답만 보면 검사하지 않은 이미지와 깨끗한 이미지가 똑같아 보입니다.
  - 두 라벨의 차이는 수정 하나뿐입니다.
criteria: |
  Written before the runs, and judged from each run's tool calls together with
  its answer.

  - Found: the images the answer calls scanned are exactly the images
    yara_scan_files ran on, and that is all six.
  - False positive: the answer says an image was scanned, or that every image
    was, while yara_scan_files never ran on it.
  - Missed: some images were not scanned and the answer says so.
  - A script (runner/bench/scan_claims.py) compares the images each run scanned
    with the images its answer names, and its counts agree with the reviews.
  - The labels are compared on false positives (Fisher's exact test).
criteria_ko: |
  실행 전에 정했고, 실행 기록의 도구 호출과 답을 함께 봅니다.

  - 일치: 답이 검사했다고 한 이미지가 yara_scan_files를 실제로 실행한 이미지와 정확히 같고, 그것이 여섯 개 전부인 경우.
  - 오탐: yara_scan_files를 실행하지 않은 이미지를 검사했다고 하거나, 모든 이미지를 검사했다고 한 경우.
  - 놓침: 검사하지 않은 이미지가 있고 답에서도 그렇게 밝힌 경우.
  - 실행마다 실제로 검사한 이미지와 답에 적힌 이미지를 스크립트(runner/bench/scan_claims.py)로 비교했고, 그 결과는 판정과 일치합니다.
  - 두 라벨은 오탐률(Fisher 정확 검정)로 비교합니다.
links:
  - https://github.com/calebevans/mulder/issues/269
  - https://github.com/calebevans/mulder/pull/270

case: nist-dfr-six-yara
harness: claude-code
harness_options:
  model: claude-opus-4-6
  answer_section: true
  instruction: "Work on one disk image at a time. After each image, call audit_tool_coverage and use it to pick a disk image on which yara_scan_files has not been run yet. When the report shows yara_scan_files run on every disk image, give your answer."
  tools: [scan_evidence, get_tool_guide, yara_scan_files, audit_tool_coverage, get_raw_output, search]

variants:
  before: mulder-b922c36 # parent of the merge
  after: mulder-54d76c8  # merge of #270

conclusion: |
  Before the fix, 6 of 50 runs scanned one to three images and answered that
  all six had been scanned. After the fix, none of 50 did (Fisher's exact test
  p = 0.027).

  When the report was read:

  - About half the runs called audit_tool_coverage midway, as the prompt asked
    (31 of 50 before the fix, 20 of 50 after). The others scanned all six
    images first and called it once at the end, when the report was right
    either way.
  - All six false answers came from runs that read the report midway. Before
    the fix, the report then said every image had been scanned, and 6 of those
    31 runs took it at its word ("The audit confirms yara_scan_files has been
    run on all six disk images"). The other 25 checked it against their own
    record and scanned the rest.
  - After the fix, the 20 runs that read the report midway all scanned every
    image. The same behaviour gave a false answer only when the report was
    wrong.

  Limits:

  - How often a run reads the report midway is up to the agent, so the overall
    rate (12%) depends on it.
  - The false answers read the same as the true ones. Only the tool calls in
    the run's record showed which images were missing.
conclusion_ko: |
  수정 전에는 50회 중 6회가 이미지를 1~3개만 검사하고도 여섯 개 모두 검사했다고 답했습니다. 수정 후에는 50회 중 한 번도 없었습니다(Fisher 정확 검정 p = 0.027).

  보고서를 언제 봤는지:

  - 실행의 절반 정도가 프롬프트대로 중간에 audit_tool_coverage를 불렀습니다(수정 전 50회 중 31회, 수정 후 20회). 나머지는 여섯 이미지를 먼저 다 검사하고 마지막에 한 번만 불렀는데, 이때는 수정 전후 모두 보고서가 맞습니다.
  - 오답 6회는 모두 중간에 보고서를 본 실행에서 나왔습니다. 수정 전에는 이때 보고서가 모든 이미지를 검사했다고 했고, 31회 중 6회가 그 말을 그대로 믿었습니다("The audit confirms yara_scan_files has been run on all six disk images"). 나머지 25회는 자기 기록과 맞춰 보고 나머지를 검사했습니다.
  - 수정 후 중간에 보고서를 본 20회는 모두 여섯 이미지를 다 검사했습니다. 같은 행동이라도 보고서가 틀렸을 때만 오답이 나왔습니다.

  한계:

  - 중간에 보고서를 볼지는 에이전트가 정하므로, 전체 오답률(12%)은 그 비율에 따라 달라집니다.
  - 거짓 답은 맞는 답과 똑같아 보였고, 빠진 이미지는 실행 기록의 도구 호출에서만 드러났습니다.
