# EXP-003: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Credit audit_tool_coverage runs only to the evidence they named (calebevans/mulder#270)"
title_ko: "audit_tool_coverage가 도구를 실제로 실행한 증거에만 반영 (calebevans/mulder#270)"
server: mulder
status: done                     # planned | in-progress | done
change: >
  audit_tool_coverage reports, per evidence item, which applicable tools were
  run. It built one set of tool names from the whole case's audit log and
  compared every item against it, so a tool run on one disk image counted as
  run on every disk image. Investigation progress judged by tool names alone
  marks work on one target as done for another. The fix credits a tool to an
  item only when the tool's evidence-input argument names that item or a
  folder holding it. Checked without a model: run_fls on the first of two
  NIST test images, then audit_tool_coverage, on the parent of the fix and
  on its merge.
change_ko: >
  audit_tool_coverage는 증거마다 적용 가능한 도구 중 어떤 것을 실행했는지 보고합니다. 그런데 사건 전체의
  감사 로그에서 도구 이름 집합 하나를 만들고 모든 증거를 그 집합과 비교해서, 디스크 이미지 하나에 실행한
  도구가 모든 디스크 이미지에 실행한 것으로 셌습니다. 조사 진척을 도구 이름만으로 판단하면 한 대상에 한
  작업이 다른 대상의 작업까지 완료로 표시됩니다. 수정 후에는 도구의 증거 입력 인자가 그 증거나 그 증거가 든
  폴더를 가리킬 때만 그 증거에 반영합니다. 모델 없이 확인합니다. NIST 테스트 이미지 두 개 중 첫 번째에만
  run_fls를 실행하고 audit_tool_coverage를 부르는 것을, 수정 직전 커밋과 수정 머지 커밋에서 똑같이 합니다.
links:
  - https://github.com/calebevans/mulder/issues/269
  - https://github.com/calebevans/mulder/pull/270

case: nist-dfr-two-images
harness: bench-runner # runner/ with scripted calls

# before is main just before the merge and after the merge, so they differ by
# the pull request only (audit.py, review.py and a test file).
variants:
  before: mulder-b922c36 # parent of the merge
  after: mulder-54d76c8  # merge of #270

scripted_expect:
  before: { questions: 0/2, facts: 0/2 }
  after: { questions: 2/2, facts: 2/2 }

conclusion: >
  Before the fix, the report credits run_fls to both images although it ran
  on dfr-01-fat.dd only: dfr-02-ntfs.dd lists run_fls under tools_run and the
  case has 12 gaps. After it, dfr-02-ntfs.dd keeps run_fls under
  tools_not_run, with no tool run, and the case has 13 gaps. The result does
  not depend on a model. Whether an agent that follows the report skips the
  second image is EXP-004.
conclusion_ko: >
  수정 전에는 run_fls를 dfr-01-fat.dd에만 실행했는데도 보고서가 두 이미지 모두에 실행한 것으로 셉니다.
  dfr-02-ntfs.dd의 tools_run에 run_fls가 있고, 미실행 도구는 12개입니다. 수정 후에는 dfr-02-ntfs.dd에
  run_fls가 tools_not_run으로 남고 실행한 도구가 없으며, 미실행 도구는 13개입니다. 결과는 모델과 무관합니다.
  보고서를 따르는 에이전트가 두 번째 이미지를 건너뛰는지는 EXP-004에서 봅니다.
