# EXP-003: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does a larger model act on the limits it is given? (Opus)"
title_ko: "큰 모델은 전달받은 한계를 따를까? (Opus)"
server: mulder
status: done                        # planned | in-progress | done
change: >
  analyze_disk_pcaps finds packet captures by file name extension only and,
  when it finds none, returns a plain success ("No packet capture files
  found"); run_clamav scans a disk image as one opaque file and reports
  "OK". A model can read either as "there is none". The after version keeps
  both searches as they are and states their limits: analyze_disk_pcaps
  returns status no_results with what it checked (files matched by
  extension only, so this does not show the image holds no capture), and
  run_clamav warns, in its result and its indexed text, that the files
  inside the image were not scanned (guideline 4.1 and 4.2). The limits
  are then carried to the analyst: get_completed_results passes on a
  result's own status, message and warning, the executor copies them into a
  "note" instead of summarizing them, and the analyst receives that note.
  Opus is planner and analyst, the executor is Haiku. Compared, three runs
  per label: claims that no capture exists (Q23) and that there is no virus
  (Q31), and the false positive rate.
change_ko: >
  analyze_disk_pcaps는 확장자로만 캡처 파일을 찾고, 찾은 것이 없으면 "No packet capture files
  found"와 함께 그냥 성공을 돌려준다. run_clamav는 디스크 이미지를 파일 하나로 검사하고 "OK"를
  보고한다. 모델은 두 결과 모두 "없다"로 읽을 수 있다. after는 두 도구의 검색 방식은 그대로 두고
  한계를 알린다. analyze_disk_pcaps는 상태 no_results와 확인한 범위(확장자로만 찾았으므로 캡처가
  없다고 단정할 수 없음)를 돌려주고, run_clamav는 이미지 안의 파일은 검사하지 않았다고 결과와 색인
  텍스트에 경고한다(가이드라인 4.1, 4.2). 그리고 한계를 analyst까지 전달한다. get_completed_results가
  결과의 상태, 메시지, 경고를 넘기고, executor는 이를 요약하지 않고 "note"에 그대로 옮기며, analyst가
  그 note를 받는다. planner와 analyst는 Opus, executor는 Haiku다. 라벨당 3회로 "캡처가 없다"(Q23),
  "바이러스가 없다"(Q31) 단정과 오탐률을 비교한다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-opus-4-6, executor: claude-haiku-4-5, analyst: claude-opus-4-6}
  effort: max
  answer_section: true

variants:
  before: mulder-1.5.10                      # upstream release
  after: mulder-1.5.10-limits-to-analyst     # the limits stated and carried to the analyst

conclusion: >
  Three runs per label. Review, median (range): before full match 77% (74
  to 81), false positives 3% in every run; after 74% (71 to 77), 0% (0 to
  3). Opus found the capture "interception" by reading the file listing in
  five of six runs, so Q23 does not separate the labels. Q31: before claimed
  once that the system has no virus (run 3, from ClamAV's "OK" on the disk
  image); after never did. ClamAV ran in two after runs: in run 1 the
  caveat reached the answer ("no conclusion can be drawn about the files in
  the image"); in run 2 the executor saw the warning but did not copy it,
  and the answer reported "OK" without a caveat. The other false positives
  were on Q1 (hashes said to match; before 2, after 1), which this change
  does not touch; two runs also gave an MD5 recalled from the NIST case
  documents. With Opus the limit is followed when it arrives, but errors
  are rare to begin with, so three runs show a direction, not a measured
  difference.
conclusion_ko: >
  라벨당 3회. 검토 중앙값(범위): before 완전 일치 77%(74~81), 오탐 매번 3%; after 74%(71~77),
  0%(0~3). Opus는 6회 중 5회에서 파일 목록을 읽어 캡처 파일 "interception"을 찾았으므로 Q23으로는
  두 라벨이 갈리지 않는다. Q31: before는 한 번(3회차) 디스크 이미지에 대한 ClamAV "OK"로 "바이러스가
  없다"고 단정했고, after는 한 번도 단정하지 않았다. after에서 ClamAV는 두 번 실행됐다. 1회차는
  주의가 답까지 닿았고("이미지 안의 파일에 대해서는 결론을 낼 수 없다"), 2회차는 executor가 경고를
  보고도 옮기지 않아 답이 주의 없이 "OK"를 보고했다. 나머지 오탐은 Q1(해시 일치 주장; before 2회,
  after 1회)로 이번 변경과 관계없다. 두 실행은 NIST 문서에서 기억한 MD5를 적기도 했다. Opus는
  한계가 도착하면 따르지만, 원래 오류가 드물어서 3회로는 방향만 보이고 차이를 측정했다고 할 수는 없다.
