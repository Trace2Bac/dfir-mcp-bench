# EXP-005: one verification. The folder name is the identifier to cite;
# the title may change.
title: "trudi counts a hashed archive as an examined exfiltration phase"
title_ko: "trudi가 해시만 계산한 압축 파일로 유출 단계를 검사한 것으로 셈"
server: trudi
status: done                     # planned | in-progress | done
change: |
  trudi's readiness check reports, for each phase of the attack lifecycle,
  whether its artifact sources were examined, and warns about the phases
  that were not. It decides from the commands of successful tool calls,
  matched against patterns per phase.

  - Before: hashing collection.zip with hash_file matches the exfiltration
    pattern for archivers (\bzip\b) in the file name, so exfiltration counts
    as examined and leaves the warning, although nothing in the archive was
    read.
  - After (lifecycle-skip-fingerprints, our patch): the hash.* tools, which
    only fingerprint a file, are left out of that match.
  - Checked without a model: the same scripted calls on both variants, on a
    staging archive of three office files. reason_readiness_status calls no
    model.
change_ko: |
  trudi의 준비 점검은 공격 단계마다 그 단계의 자료를 검사했는지 보고하고, 검사하지 않은 단계를 경고합니다. 성공한 도구 호출의 명령을 단계별 패턴과 대조해 정합니다.

  - 수정 전: hash_file로 collection.zip의 해시를 계산하면 파일 이름에서 유출 단계의 압축 도구 패턴(\bzip\b)이 맞아서, 압축 파일의 내용은 하나도 읽지 않았는데 유출 단계가 검사한 것이 되고 경고에서 빠집니다.
  - 수정 후(lifecycle-skip-fingerprints, 우리 패치): 파일의 지문만 만드는 hash.* 도구는 이 대조에서 뺍니다.
  - 모델 없이 확인합니다. 사무 파일 세 개를 묶은 반출 준비 압축 파일에서 두 버전에 같은 도구 호출을 보냅니다. reason_readiness_status는 모델을 부르지 않습니다.
links:
  - https://github.com/nebulae/trudi
  - https://github.com/nebulae/trudi/blob/88fbca78186b6a0ca40423cf5e37a9dc46ae051e/tools/_gates/_lifecycle.py#L99

case: trudi-hash-archive
harness: bench-runner # runner/ with scripted calls

variants:
  before: trudi-88fbca7                  # trudi main as published
  after: trudi-88fbca7-lifecycle-fix     # plus lifecycle-skip-fingerprints

scripted_expect:
  before: { questions: 0/2, facts: 0/2 }
  after: { questions: 2/2, facts: 2/2 }

conclusion: |
  After the fix, hashing an archive no longer counts as examining
  exfiltration.

  - Before: after only hash_file on collection.zip, the exfiltration phase
    is "examined" with "sources_examined": ["archive_sync_tools"], and the
    warning lists 4 phases never examined, not 5 (0 of 2).
  - After: exfiltration is "not_examined" and the warning lists all 5
    phases (2 of 2).
  - trudi's own tests on the lifecycle model and readiness check (175 in the
    files that cover them) pass before and after the change.
  - Checked without a model; the result does not depend on one.
conclusion_ko: |
  수정 후에는 압축 파일의 해시 계산을 유출 단계 검사로 세지 않습니다.

  - 수정 전: collection.zip에 hash_file만 실행했는데, 유출 단계가 "sources_examined": ["archive_sync_tools"]와 함께 "examined"이고, 경고는 검사하지 않은 단계를 5개가 아니라 4개로 적습니다(0/2).
  - 수정 후: 유출 단계는 "not_examined"이고, 경고는 다섯 단계를 모두 적습니다(2/2).
  - trudi의 공격 단계 모델과 준비 점검을 다루는 자체 테스트(해당 파일의 175개)는 수정 전후 모두 통과합니다.
  - 모델 없이 확인했고 결과는 모델과 상관없습니다.
