# EXP-005: one verification. The folder name is its permanent identifier;
# the title may change.
title: "The Haiku tool changes on another case (Rhino Hunt)"
title_ko: "Haiku용 도구 변경을 다른 사건에 적용 (Rhino Hunt)"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  EXP-004 changed mulder's tools on the NIST Hacking Case and reviewed the
  result against that case's answers, so the gain may be partly fitted to
  that case. This experiment runs the same two versions, unchanged, on a
  case they were not built for: Rhino Hunt (DFRWS 2005), a dd image of a
  reformatted USB key and network traces, with no Windows system. Most of
  the new tools do not apply here (no registry, no Recycle Bin, no EWF
  image); what does apply is the packet capture search by header, the
  source names returned by get_completed_results, the tools added to a
  plan when the planner leaves them out, run_clamav on the files inside the
  image, and the tool limits carried to the analyst. The question is
  whether the after version does at least as well as before on a case it
  was not made for. Haiku in every role, five runs per label.
change_ko: >
  EXP-004는 NIST Hacking Case로 mulder 도구를 고치고 그 사건의 정답으로 검토했으므로, 향상의 일부가
  그 사건에 맞춘 결과일 수 있다. 이 실험은 같은 두 버전을 그대로, 만들 때 쓰지 않은 사건에 돌린다.
  Rhino Hunt(DFRWS 2005)는 포맷된 USB 키의 dd 이미지와 네트워크 트레이스로, Windows 시스템이 없다.
  새 도구 대부분은 여기에 해당하지 않는다(레지스트리, 휴지통, EWF 이미지가 없음). 해당하는 것은 헤더로
  캡처를 찾는 기능, get_completed_results가 돌려주는 source 이름, planner가 빠뜨린 도구를 계획에
  추가하는 기능, 이미지 안 파일의 run_clamav 검사, analyst까지 전달되는 도구의 한계다. after가 만들
  때 쓰지 않은 사건에서도 before만큼 이상 하는지 본다. 모든 역할 Haiku, 라벨당 5회.
links:
  - https://cfreds-archive.nist.gov/dfrws/Rhino_Hunt.html
  - https://cfreds-archive.nist.gov/dfrws/DFRWS2005-answers.pdf

case: rhino-hunt
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10                  # upstream release
  after: mulder-1.5.10-haiku-assists     # the version reviewed in EXP-004
