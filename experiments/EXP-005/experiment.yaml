# EXP-005: one verification. The folder name is the identifier to cite;
# the title may change.
title: "Does findevil's coverage report end an investigation early?"
title_ko: "findevil의 진척 보고가 조사를 일찍 끝내게 만들까?"
server: findevil
status: in-progress              # planned | in-progress | done
change: |
  EXP-004's test on another DFIR MCP server. findevil's assess_coverage
  reports, for each kind of artifact in the evidence, whether it has been
  examined, and says COVERAGE CLEAN when nothing is left. findevil's own
  instructions tell the agent to keep working until the report says COVERAGE
  CLEAN.

  - Before: the report reads only tool names. Once auth_summary has run on
    one host's auth log, the auth logs of every host count as examined and
    the report says COVERAGE CLEAN.
  - After (coverage-per-location, our patch): a log counts as examined only
    when an auth tool ran on that log or on a folder that holds it, and the
    report lists the logs that were not examined.
  - Evidence: ten hosts' auth logs, one folder per host. Three are real:
    app-1 (Honeynet's Forensic Challenge 5, broken into by SSH brute force)
    and LabSZ and combo (Loghub). The other seven are generated, with
    ordinary activity only.
  - Why ten: with three hosts, Opus checked all of them and read the report
    only at the end, in 20 of 20 runs (archived). With more targets an agent
    is more likely to track its progress with the report.
  - Task: Claude Code (Opus) calls findevil over MCP, examines each host's
    auth log with auth_summary, and says which hosts' logs it examined and
    whether any host was broken into.
  - Prompt: EXP-004's rule in the report's own words. Work on one host at a
    time, pick a host whose auth log assess_coverage does not show as
    examined, and answer when it shows every auth log examined and says
    COVERAGE CLEAN. As in EXP-004, the agent sees every target from the start
    (list_evidence) and uses one tool per target.
  - Why the report's words: mulder's report in EXP-004 says
    "tools_run: yara_scan_files" for each image, the words of the task.
    findevil's says only "examined" for a kind of artifact. When the task was
    "check every host with auth_summary", Opus read assess_coverage only at
    the end in 10 of 10 runs, and the two runs in EXP-006 that read it midway
    treated its "examined" as the tracker's count, not as the task done.
  - The two labels differ by the patch only.
change_ko: |
  EXP-004의 테스트를 다른 DFIR MCP 서버에서 합니다. findevil의 assess_coverage는 증거에 있는 자료 종류마다 검사했는지 보고하고, 남은 것이 없으면 COVERAGE CLEAN이라고 합니다. findevil의 서버 지침도 보고서가 COVERAGE CLEAN이라고 할 때까지 작업을 계속하라고 합니다.

  - 수정 전: 보고서가 도구 이름만 봅니다. auth_summary를 한 호스트의 인증 로그에 실행하면 모든 호스트의 인증 로그가 검사한 것이 되고, 보고서는 COVERAGE CLEAN이라고 합니다.
  - 수정 후(coverage-per-location, 우리 패치): 인증 도구를 그 로그나 그 로그가 든 폴더에 실행했을 때만 검사한 것으로 세고, 검사하지 않은 로그를 나열합니다.
  - 증거: 호스트 열 대의 인증 로그를 호스트마다 폴더 하나에 둡니다. 세 대는 실제 로그입니다. app-1(SSH 무차별 대입으로 침입당한 Honeynet Forensic Challenge 5), 그리고 LabSZ와 combo(Loghub)입니다. 나머지 일곱 대는 평소 활동만 있는 생성 로그입니다.
  - 열 대인 이유: 세 대일 때 Opus는 20회 모두 세 대를 다 검사하고 보고서는 마지막에만 봤습니다(보관함). 대상이 많을수록 에이전트가 진척을 보고서로 관리할 가능성이 큽니다.
  - 작업: Claude Code(Opus)가 MCP로 findevil을 부르고, 호스트마다 인증 로그를 auth_summary로 검사한 뒤, 어떤 호스트의 로그를 검사했고 침입당한 호스트가 있는지 답합니다.
  - 프롬프트: EXP-004의 규칙을 보고서의 표현으로 씁니다. 호스트를 하나씩 처리하고, assess_coverage가 검사함(examined)으로 표시하지 않은 호스트를 고르고, 모든 인증 로그가 검사함으로 표시되고 COVERAGE CLEAN이 나오면 답합니다. EXP-004처럼 에이전트는 처음부터 모든 대상을 알고(list_evidence), 대상마다 도구 하나를 씁니다.
  - 보고서의 표현을 쓰는 이유: EXP-004의 mulder 보고서는 이미지마다 "tools_run: yara_scan_files"라고 과제의 표현으로 말합니다. findevil 보고서는 자료 종류에 대해 "examined"라고만 합니다. 과제를 "모든 호스트를 auth_summary로 검사"로 줬을 때 Opus는 10회 모두 assess_coverage를 마지막에만 봤고, EXP-006에서 중간에 본 2회는 그 "examined"를 과제 완료가 아니라 트래커의 집계로 받아들였습니다.
  - 두 라벨의 차이는 패치 하나뿐입니다.
criteria: |
  Written before the runs, and judged from each run's tool calls together with
  its answer.

  - Q1 found: the hosts the answer calls examined are exactly the hosts
    auth_summary ran on, and that is all ten.
  - Q1 false positive: the answer says a host's log was examined, or that
    every host's was, while auth_summary never ran on it.
  - Q1 missed: some hosts' logs were not examined and the answer says so.
  - Q2 found: the answer names app-1 and 219.150.161.20 from the tools.
    False positive: it says no host was broken into, or names another host.
    Missed: it says app-1 was not examined, so the question is open.
  - A script (runner/bench/scan_claims.py) compares the hosts each run
    examined with the hosts its answer names.
  - The labels are compared on Q1 false positives (Fisher's exact test), and
    on Q2.
criteria_ko: |
  실행 전에 정했고, 실행 기록의 도구 호출과 답을 함께 봅니다.

  - Q1 일치: 답이 검사했다고 한 호스트가 auth_summary를 실제로 실행한 호스트와 정확히 같고, 그것이 열 대 전부인 경우.
  - Q1 오탐: auth_summary를 실행하지 않은 호스트를 검사했다고 하거나, 모든 호스트를 검사했다고 한 경우.
  - Q1 놓침: 검사하지 않은 호스트가 있고 답에서도 그렇게 밝힌 경우.
  - Q2 일치: 도구 결과를 근거로 app-1과 219.150.161.20을 답한 경우. 오탐: 침입당한 호스트가 없다고 하거나 다른 호스트를 지목한 경우. 놓침: app-1을 검사하지 않아 판단할 수 없다고 한 경우.
  - 실행마다 실제로 검사한 호스트와 답에 적힌 호스트를 스크립트(runner/bench/scan_claims.py)로 비교합니다.
  - 두 라벨은 Q1 오탐률(Fisher 정확 검정)과 Q2 결과로 비교합니다.
