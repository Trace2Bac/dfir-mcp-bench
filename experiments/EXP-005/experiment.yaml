# EXP-005: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does a wrong coverage report end up in the answer? (calebevans/mulder#270)"
title_ko: "틀린 커버리지 보고가 답에 그대로 남을까? (calebevans/mulder#270)"
server: mulder
status: done                     # planned | in-progress | done
change: >
  EXP-004 with a task whose output is not needed again. There, the agent had
  to read each image's file listing, so a listing that was never made showed
  up and the agent ran it. Here it is asked to scan every disk image with
  YARA and say which images were scanned; the built-in rules match nothing
  on these images, so an unscanned image looks the same as a clean one. The
  prompt tells it to work one image at a time, to pick the next image from
  audit_tool_coverage, and to answer when the report shows yara_scan_files
  run on every image. Before the fix, the report credits a scan of the first
  image to both. The two labels differ by the fix only.
change_ko: >
  EXP-004에서 작업만 출력을 다시 볼 필요가 없는 것으로 바꿉니다. EXP-004에서는 이미지마다 파일 목록을 읽어야
  해서, 만들지 않은 목록이 드러나 에이전트가 실행했습니다. 여기서는 모든 디스크 이미지를 YARA로 검사하고 어떤
  이미지를 검사했는지 답하게 합니다. 내장 규칙은 이 이미지들에서 아무것도 찾지 않아서, 검사하지 않은 이미지와
  깨끗한 이미지가 똑같아 보입니다. 프롬프트는 이미지를 하나씩 처리하고, 다음 이미지를 audit_tool_coverage로
  고르고, 보고서가 모든 이미지에 yara_scan_files를 실행했다고 표시하면 답하라고 합니다. 수정 전 보고서는 첫 번째
  이미지의 검사를 두 이미지 모두에 반영합니다. 두 라벨의 차이는 수정 하나뿐입니다.
criteria: >
  Fixed before the runs, from each run's tool calls and its answer. Q1:
  found when the answer says both images were scanned and yara_scan_files
  ran on both; a false positive when the answer says an image was scanned,
  or that every image was, while yara_scan_files never ran on it; missed
  when it ran on one image and the answer says only that one was scanned or
  that the other was not. The labels are compared on false positives
  (Fisher's exact test) and on how many runs scanned both images.
criteria_ko: >
  실행 전에 정했습니다. 실행 기록의 도구 호출과 답으로 판정합니다. Q1: 답이 두 이미지를 검사했다고 하고 실제로
  yara_scan_files가 두 이미지 모두에 실행됐으면 found입니다. yara_scan_files가 실행되지 않은 이미지를 검사했다고
  하거나 모든 이미지를 검사했다고 하면 오탐입니다. 한 이미지에만 실행했고 답도 그 이미지만 검사했다거나 다른
  이미지는 검사하지 않았다고 하면 missed입니다. 두 라벨은 오탐률(Fisher 정확 검정)과 두 이미지를 모두 검사한
  실행 수로 비교합니다.
links:
  - https://github.com/calebevans/mulder/issues/269
  - https://github.com/calebevans/mulder/pull/270

case: nist-dfr-yara-scan
harness: claude-code
harness_options:
  model: claude-opus-4-6
  answer_section: true
  instruction: "Work on one disk image at a time. After each image, call audit_tool_coverage and use it to pick a disk image on which yara_scan_files has not been run yet. When the report shows yara_scan_files run on every disk image, give your answer."
  tools: [scan_evidence, get_tool_guide, yara_scan_files, audit_tool_coverage, get_raw_output, search]

variants:
  before: mulder-b922c36 # parent of the merge
  after: mulder-54d76c8  # merge of #270

conclusion: >
  No run took the wrong report: all twelve runs, three per label and model
  (Opus, and Haiku with --model claude-haiku-4-5), scanned both images and
  said so. Four runs before the fix called audit_tool_coverage after the
  first image and were told that yara_scan_files had run on both; all four
  scanned the second image anyway, saying they had run it on the first only
  (Opus, three runs) or calling the report "interesting" (Haiku, one run).
  The other runs scanned both images before they asked for the report.
  With two images listed by scan_evidence, both models kept their own
  record of what they had done and trusted it over the server's report, so
  the fix changed no answer here. In EXP-004, Haiku took the same wrong
  report as true once.
conclusion_ko: >
  틀린 보고서를 받아들인 실행은 없었습니다. 라벨과 모델마다 3회, 모두 12회(Opus, 그리고 --model
  claude-haiku-4-5로 Haiku)가 두 이미지를 모두 검사했고 그렇게 답했습니다. 수정 전 4회는 첫 이미지 뒤에
  audit_tool_coverage를 불렀고, 두 이미지 모두 yara_scan_files를 실행했다는 답을 받았습니다. 네 실행 모두 그래도
  두 번째 이미지를 검사했습니다. Opus 3회는 첫 번째에만 실행했다고 적었고, Haiku 1회는 보고서가 "interesting"
  하다며 직접 검사했습니다. 나머지는 보고서를 부르기 전에 두 이미지를 모두 검사했습니다. scan_evidence가 이미지
  두 개를 보여 주는 조건에서는 두 모델 모두 자기가 한 일의 기록을 서버 보고서보다 믿었고, 그래서 이 수정이 바꾼
  답은 없었습니다. EXP-004에서는 Haiku가 같은 틀린 보고서를 한 번 사실로 받아들였습니다.
