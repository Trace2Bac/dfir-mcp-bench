# EXP-010: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does a larger model act on the limits it is given? (Opus)"
title_ko: "큰 모델은 전달받은 한계를 따를까? (Opus)"
server: mulder
status: done                        # planned | in-progress | done
change: >
  EXP-009 again, with Opus as planner and analyst. In EXP-009 (Haiku in every
  role) after-2 carried the limits of analyze_disk_pcaps and run_clamav all
  the way to the analyst, but the analyst still claimed in some runs that no
  capture exists or that there is no virus, even when it quoted the caveat.
  This run checks whether Opus acts on the same limits. The executor stays
  Haiku, as in EXP-005: after-2 already makes it copy the limits word for
  word. Compared: claims that no capture exists (Q23) and that there is no
  virus (Q31), and the false positive rate, before against after-2.
change_ko: >
  EXP-009를 planner와 analyst만 Opus로 바꿔 다시 돌린다. EXP-009(모든 역할 Haiku)의 after-2에서는
  analyze_disk_pcaps와 run_clamav의 한계가 analyst까지 전달됐지만, analyst가 일부 실행에서 주의
  문구를 인용하고도 "캡처가 없다", "바이러스가 없다"고 단정했다. 같은 한계를 Opus는 따르는지 본다.
  executor는 EXP-005처럼 Haiku로 둔다. after-2에서 executor가 한계를 그대로 옮기도록 이미 바꿨기
  때문이다. before와 after-2에서 "캡처가 없다"(Q23), "바이러스가 없다"(Q31) 단정과 오탐률을 비교한다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-opus-4-6, executor: claude-haiku-4-5, analyst: claude-opus-4-6}
  effort: max
  answer_section: true

variants:
  before: mulder-1.5.10                      # upstream release
  after-2: mulder-1.5.10-limits-to-analyst   # same as EXP-009 after-2

conclusion: >
  Three runs per label. Review, median (range): before full match 77% (74
  to 81), false positives 3% in every run; after-2 74% (71 to 77), 0% (0 to
  3). Opus found the capture "interception" by reading the file listing in
  five of six runs, so Q23 does not separate the labels. Q31: before claimed
  once that the system has no virus (run 3, from ClamAV's "OK" on the disk
  image); after-2 never did. ClamAV ran in two after-2 runs: in run 1 the
  caveat reached the answer ("no conclusion can be drawn about the files in
  the image"); in run 2 the executor saw the warning but did not copy it,
  and the answer reported "OK" without a caveat. The other false positives
  were on Q1 (hashes said to match; before 2, after-2 1), which this change
  does not touch; two runs also gave an MD5 recalled from the NIST case
  documents. With Opus the limit is followed when it arrives, but errors
  are rare to begin with, so three runs show a direction, not a measured
  difference.
conclusion_ko: >
  라벨당 3회. 검토 중앙값(범위): before 완전 일치 77%(74~81), 오탐 매번 3%; after-2 74%(71~77),
  0%(0~3). Opus는 6회 중 5회에서 파일 목록을 읽어 캡처 파일 "interception"을 찾았으므로 Q23으로는
  두 라벨이 갈리지 않는다. Q31: before는 한 번(3회차) 디스크 이미지에 대한 ClamAV "OK"로 "바이러스가
  없다"고 단정했고, after-2는 한 번도 단정하지 않았다. after-2에서 ClamAV는 두 번 실행됐다. 1회차는
  주의가 답까지 닿았고("이미지 안의 파일에 대해서는 결론을 낼 수 없다"), 2회차는 executor가 경고를
  보고도 옮기지 않아 답이 주의 없이 "OK"를 보고했다. 나머지 오탐은 Q1(해시 일치 주장; before 2회,
  after-2 1회)로 이번 변경과 관계없다. 두 실행은 NIST 문서에서 기억한 MD5를 적기도 했다. Opus는
  한계가 도착하면 따르지만, 원래 오류가 드물어서 3회로는 방향만 보이고 차이를 측정했다고 할 수는 없다.
