# EXP-010: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does a larger model act on the limits it is given? (Opus)"
title_ko: "큰 모델은 전달받은 한계를 따를까? (Opus)"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  EXP-009 again, with Opus as planner and analyst. In EXP-009 (Haiku in every
  role) after-2 carried the limits of analyze_disk_pcaps and run_clamav all
  the way to the analyst, but the analyst still claimed in some runs that no
  capture exists or that there is no virus, even when it quoted the caveat.
  This run checks whether Opus acts on the same limits. The executor stays
  Haiku, as in EXP-005: after-2 already makes it copy the limits word for
  word. Compared: claims that no capture exists (Q23) and that there is no
  virus (Q31), and the false positive rate, before against after-2.
change_ko: >
  EXP-009를 planner와 analyst만 Opus로 바꿔 다시 돌린다. EXP-009(모든 역할 Haiku)의 after-2에서는
  analyze_disk_pcaps와 run_clamav의 한계가 analyst까지 전달됐지만, analyst가 일부 실행에서 주의
  문구를 인용하고도 "캡처가 없다", "바이러스가 없다"고 단정했다. 같은 한계를 Opus는 따르는지 본다.
  executor는 EXP-005처럼 Haiku로 둔다. after-2에서 executor가 한계를 그대로 옮기도록 이미 바꿨기
  때문이다. before와 after-2에서 "캡처가 없다"(Q23), "바이러스가 없다"(Q31) 단정과 오탐률을 비교한다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-opus-4-6, executor: claude-haiku-4-5, analyst: claude-opus-4-6}
  effort: max
  answer_section: true

variants:
  before: mulder-1.5.10                      # upstream release
  after-2: mulder-1.5.10-limits-to-analyst   # same as EXP-009 after-2
