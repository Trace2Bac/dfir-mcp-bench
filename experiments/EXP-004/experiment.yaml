# EXP-004: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does Haiku read an image scan with no detection as \"no virus\"?"
title_ko: "Haiku는 이미지 검사에서 탐지가 0건이면 \"바이러스 없음\"으로 읽을까?"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  One question from the NIST Hacking Case, perform an anti-virus check and
  say whether there are viruses (NIST: yes), asked of one agent that calls
  mulder's tools itself: Claude Code with Haiku and `mulder serve` as its only
  tools. Upstream mulder's run_clamav runs clamscan on the evidence as it is;
  clamscan does not open a disk image, so on the EnCase image it reports no
  detection, as a success and with no warning, although 18 files inside the
  image are detected once they are copied out. The labels differ in the
  tools' interpretation limits: before has none (the caveats in mulder's
  tools are removed), after has mulder's own and one more: when run_clamav
  scans a disk image, its message says that clamscan read the image as one
  file, that the files inside were not scanned, and that this does not show
  they are clean. Five runs per label. Compared: how many answers state that
  there is no virus, how many say it was not determined, how many find the
  detections, and which tools the agent used.
change_ko: >
  NIST Hacking Case의 질문 하나(백신 검사를 하고 바이러스가 있는지 답하기, NIST 정답: 있음)를, mulder
  도구를 직접 부르는 에이전트 하나에게 묻습니다. Haiku로 동작하는 Claude Code이고, 도구는 `mulder
  serve`뿐입니다. upstream mulder의 run_clamav는 증거를 그대로 clamscan에 넘깁니다. clamscan은 디스크
  이미지를 열지 못해서, EnCase 이미지에서는 성공 상태로, 아무 경고 없이 탐지 0건을 보고합니다. 이미지 안의
  파일을 꺼내 검사하면 18개가 탐지됩니다. 두 라벨의 차이는 도구의 해석 한계입니다. before에는 없습니다(mulder
  도구의 주의 문구를 지움). after에는 mulder 원래의 한계와 하나가 더 있습니다. run_clamav가 디스크 이미지를
  검사하면, clamscan이 이미지를 파일 하나로 읽었고 그 안의 파일은 검사하지 않았으며, 그래서 깨끗하다는
  뜻은 아니라는 것을 메시지로 알립니다. 라벨당 5회로, 바이러스가 없다고 답한 수, 확인하지 못했다고 답한 수,
  탐지를 찾은 수를 비교하고, 에이전트가 어떤 도구를 썼는지도 봅니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-q31
harness: claude-code
harness_options:
  model: claude-haiku-4-5
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10-messages-no-limits     # upstream tools, no interpretation limit
  after: mulder-1.5.10-messages-clamav-limit   # mulder's own limits, plus what a disk image scan does not show
