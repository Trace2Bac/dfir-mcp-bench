# EXP-004: one verification. The folder name is the identifier to cite;
# the title may change.
title: "Does findevil's coverage report hide a shell history its own tools do not list?"
title_ko: "findevil 진척 보고가, 자기 도구가 나열하지 않는 셸 이력을 가릴까?"
server: findevil
status: done                     # planned | in-progress | done
change: |
  EXP-003 showed what happens when progress is counted per kind of tool
  instead of per target. This test adds an edge case: a target the server's
  own listing tool does not find.

  - Task: Claude Code (Opus) investigates findevil's scenario 02 at a real
    system's size with all of findevil's tools, and says whose shell
    histories it analyzed and what they show. One attacker shell history is
    added: www-data's, in its home /var/www.
  - The edge case: find_shell_histories looks only in /root and /home/*. An
    account whose home is elsewhere, such as www-data in /var/www, is never
    listed. list_evidence cuts its listing at 300 lines, so on a real-size
    snapshot it does not show the file either.
  - Before: assess_coverage counts shell history examined once any history
    tool has run, and names at most three files, so a history the agent
    never saw stays hidden and the verdict can be COVERAGE CLEAN.
  - After (coverage-per-location, our patch): the report counts each file
    and lists the ones not examined. find_shell_histories itself is not
    changed (searching each account's home from /etc/passwd would fix it
    too), so the report is the only place the agent can learn of the file.
  - The two labels differ by the patch only.
  - Prompt: nothing added. findevil's own instructions tell the agent to
    repeat its work until assess_coverage says COVERAGE CLEAN.
  - With the scenario's ten-odd files alone (no Debian /etc), list_evidence
    showed /var/www/.bash_history and Opus analyzed it in 10 of 10 runs
    (archived).
change_ko: |
  EXP-003은 진척을 대상마다가 아니라 도구 종류마다 셀 때 생기는 일을 보였습니다. 여기서는 경계 사례 하나를 더합니다. 서버 자신의 목록 도구가 찾지 못하는 대상입니다.

  - 작업: Claude Code(Opus)가 findevil의 모든 도구로, 실제 시스템 크기로 만든 findevil 시나리오 02를 조사하고, 누구의 셸 이력을 분석했는지와 이력에서 무엇이 보이는지 답합니다. 공격자 셸 이력 하나를 더했습니다. 홈이 /var/www인 www-data의 이력입니다.
  - 경계 사례: find_shell_histories는 /root와 /home/*만 봅니다. www-data(/var/www)처럼 홈이 다른 곳에 있는 계정은 나열되지 않습니다. list_evidence는 목록을 300줄에서 자르므로, 실제 크기의 스냅숏에서는 이 파일을 보여 주지 않습니다.
  - 수정 전: assess_coverage는 이력 도구가 하나라도 실행되면 셸 이력을 검사한 것으로 세고 파일을 세 개까지만 적어서, 에이전트가 보지 못한 이력은 계속 가려지고 판정은 COVERAGE CLEAN일 수 있습니다.
  - 수정 후(coverage-per-location, 우리 패치): 파일마다 세고, 검사하지 않은 파일을 나열합니다. find_shell_histories 자체는 고치지 않았으므로(/etc/passwd에 적힌 계정마다 홈을 찾게 하면 이것도 해결됨), 에이전트가 이 파일을 알 수 있는 곳은 보고서뿐입니다.
  - 두 라벨의 차이는 패치 하나뿐입니다.
  - 프롬프트: 추가한 문장이 없습니다. findevil의 서버 지침이 assess_coverage가 COVERAGE CLEAN이라고 할 때까지 작업을 되풀이하라고 합니다.
  - 시나리오의 파일 10여 개만 있을 때(Debian /etc 없이)는 list_evidence에 /var/www/.bash_history가 보여서, Opus가 10회 모두 분석했습니다(보관함).
criteria: |
  Written before the runs, and judged from each run's tool calls together
  with its answer.

  - Q1 found: the accounts named are exactly those whose history
    analyze_bash_history ran on, including www-data.
  - Q1 false positive: the answer says an account's history was analyzed,
    or that every account's was, while analyze_bash_history never ran on it.
  - Q1 missed: www-data's history was not analyzed, and the answer does
    not claim it was.
  - Q2 found: www-data's history, with the file fetched from
    185.229.59.103, from the tools. False positive: no shell history shows
    what the attacker did.
  - The labels are compared on how many runs analyzed www-data's history,
    and on Q2 false positives (Fisher's exact test).
criteria_ko: |
  실행 전에 정했고, 실행 기록의 도구 호출과 답을 함께 봅니다.

  - Q1 일치: 답에 적힌 계정이 analyze_bash_history를 실제로 실행한 이력의 계정과 정확히 같고, www-data가 들어 있는 경우.
  - Q1 오탐: analyze_bash_history를 실행하지 않은 계정의 이력을 분석했다고 하거나, 모든 계정의 이력을 분석했다고 한 경우.
  - Q1 놓침: www-data 이력을 분석하지 않았고, 분석했다고 하지도 않은 경우.
  - Q2 일치: 도구 결과를 근거로 www-data 이력과 185.229.59.103에서 받은 파일을 답한 경우. 오탐: 어떤 셸 이력에도 공격자가 한 일이 없다고 한 경우.
  - 두 라벨은 www-data 이력을 분석한 실행 수와 Q2 오탐률(Fisher 정확 검정)로 비교합니다.
