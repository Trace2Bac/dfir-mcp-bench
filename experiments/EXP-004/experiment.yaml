# EXP-004: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does Haiku read an image scan with no detection as \"no virus\"?"
title_ko: "Haiku는 이미지 검사에서 탐지가 0건이면 \"바이러스 없음\"으로 읽을까?"
server: mulder
status: done                     # planned | in-progress | done
change: >
  One question from the NIST Hacking Case, perform an anti-virus check and
  say whether there are viruses (NIST: yes), asked of one agent that calls
  mulder's tools itself: Claude Code with Haiku and `mulder serve` as its only
  tools. Upstream mulder's run_clamav runs clamscan on the evidence as it is;
  clamscan does not open a disk image, so on the EnCase image it reports no
  detection, as a success and with no warning, although 18 files inside the
  image are detected once they are copied out. The labels differ in the
  tools' interpretation limits: before has none (the caveats in mulder's
  tools are removed), after has mulder's own and one more: when run_clamav
  scans a disk image, its message says that clamscan read the image as one
  file, that the files inside were not scanned, and that this does not show
  they are clean. The agent may use only the tools a disk examination needs
  for this question (listing, search, file extraction, run_clamav), and the
  prompt asks it to run run_clamav before it answers; both are the same in
  both labels. Five runs per label. Compared: how many answers state that
  there is no virus, how many say it was not determined, how many find the
  detections, and which tools the agent used.
change_ko: >
  NIST Hacking Case의 질문 하나(백신 검사를 하고 바이러스가 있는지 답하기, NIST 정답: 있음)를, mulder
  도구를 직접 부르는 에이전트 하나에게 묻습니다. Haiku로 동작하는 Claude Code이고, 도구는 `mulder
  serve`뿐입니다. upstream mulder의 run_clamav는 증거를 그대로 clamscan에 넘깁니다. clamscan은 디스크
  이미지를 열지 못해서, EnCase 이미지에서는 성공 상태로, 아무 경고 없이 탐지 0건을 보고합니다. 이미지 안의
  파일을 꺼내 검사하면 18개가 탐지됩니다. 두 라벨의 차이는 도구의 해석 한계입니다. before에는 없습니다(mulder
  도구의 주의 문구를 지움). after에는 mulder 원래의 한계와 하나가 더 있습니다. run_clamav가 디스크 이미지를
  검사하면, clamscan이 이미지를 파일 하나로 읽었고 그 안의 파일은 검사하지 않았으며, 그래서 깨끗하다는
  뜻은 아니라는 것을 메시지로 알립니다. 에이전트는 이 질문에 필요한 도구(파일 목록, 검색, 파일 추출,
  run_clamav)만 쓸 수 있고, 프롬프트에서 답하기 전에 run_clamav를 실행하라고 요청합니다. 둘 다 두 라벨이
  같습니다. 라벨당 5회로, 바이러스가 없다고 답한 수, 확인하지 못했다고 답한 수,
  탐지를 찾은 수를 비교하고, 에이전트가 어떤 도구를 썼는지도 봅니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-q31
harness: claude-code
harness_options:
  model: claude-haiku-4-5
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true
  # Fixed for both labels, so that the only difference is the tool's limit.
  # In the first try (one run per label, deleted), before ran run_clamav on
  # the evidence and answered that it holds no virus; after never called
  # run_clamav and ran YARA on an empty folder instead.
  instruction: "Before you answer, run run_clamav on the evidence and read its result."
  tools: [scan_evidence, get_tool_guide, run_mmls, run_fls, list_files, search, get_raw_output,
          extract_file_by_inode, run_clamav]

variants:
  before: mulder-1.5.10-messages-no-limits     # upstream tools, no interpretation limit
  after: mulder-1.5.10-messages-clamav-limit   # mulder's own limits, plus what a disk image scan does not show

conclusion: >
  The interpretation limit stopped the wrong conclusion. Before, all five
  runs read run_clamav's 0 detections as the answer and stated that the
  computer has no virus (5/5 false positives). After, with the one sentence
  on the result, four of five runs said the files inside the image were not
  scanned and that the result does not show they are clean; one run ignored
  it and called the scan clean (1/5). No run reached the right answer (yes):
  four after runs extracted a file from the image, but none scanned it again.
  The limit made the answer honest; finding the viruses needs a tool that
  scans the files inside the image.
conclusion_ko: >
  해석 한계가 틀린 결론을 막았습니다. before는 5회 모두 run_clamav의 탐지 0건을 그대로 답으로 받아
  "바이러스가 없다"고 단정했습니다(오탐 5/5). 결과에 문장 하나가 붙은 after는 5회 중 4회가 이미지 안의
  파일은 검사하지 않았고 깨끗하다는 뜻은 아니라고 답했습니다. 1회는 이를 무시하고 깨끗하다고 했습니다
  (오탐 1/5). 정답(있음)에 이른 실행은 없습니다. after 4회가 이미지에서 파일을 꺼냈지만 다시 검사하지는
  않았습니다. 해석 한계는 답을 정직하게 만들었고, 바이러스를 찾으려면 이미지 안의 파일을 검사하는 도구가
  필요합니다.
