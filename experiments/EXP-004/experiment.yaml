# EXP-004: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does one sentence on a tool's limit stop a wrong conclusion?"
title_ko: "도구의 한계를 알리는 문장 하나가 틀린 결론을 막을까?"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  The test of whether stating a tool's interpretation limit matters, built
  so that nothing else differs. Three questions from the NIST Hacking Case
  go to one agent that calls mulder's tools itself (Claude Code with Haiku,
  `mulder serve` as its only tools). The anti-virus question (NIST: yes) is
  where the limit applies: upstream mulder's run_clamav passes the evidence
  to clamscan, which does not open a disk image, so on the EnCase image it
  reports no detection, as a success and with no warning, although 18 files
  inside the image are detected once they are copied out. The operating
  system and the registered owner are controls, answered directly by the
  registry tool. The two labels run the same tools, the same allowed tool
  list and the same prompt, which asks the agent to run run_clamav before it
  answers. They differ in one thing: in after, when run_clamav scans a disk
  image its message adds that clamscan read the image as one file, that the
  files inside were not scanned, and that this does not show they are clean.
  before has no interpretation limit (the caveats in mulder's tools are
  removed). Twenty runs per label. EXP-002 is the pilot for this test.
change_ko: >
  도구의 해석 한계를 알리는 것이 중요한지를, 다른 조건은 모두 같게 두고 시험합니다. NIST Hacking Case 질문
  세 개를, mulder 도구를 직접 부르는 에이전트 하나(Haiku로 동작하는 Claude Code, 도구는 `mulder serve`뿐)에게
  묻습니다. 백신 검사 질문(NIST 정답: 있음)이 해석 한계가 작동하는 곳입니다. upstream mulder의 run_clamav는
  증거를 그대로 clamscan에 넘기는데, clamscan은 디스크 이미지를 열지 못해서 EnCase 이미지에서는 성공 상태로,
  아무 경고 없이 탐지 0건을 보고합니다. 이미지 안의 파일을 꺼내 검사하면 18개가 탐지됩니다. 운영체제와 등록된
  소유자는 레지스트리 도구가 바로 답하는 대조 질문입니다. 두 라벨은 같은 도구, 같은 허용 도구 목록, 같은
  프롬프트(답하기 전에 run_clamav를 실행하라는 요청 포함)를 씁니다. 차이는 하나입니다. after에서는
  run_clamav가 디스크 이미지를 검사하면, clamscan이 이미지를 파일 하나로 읽었고 그 안의 파일은 검사하지
  않았으며 그래서 깨끗하다는 뜻은 아니라는 문장이 메시지에 붙습니다. before에는 해석 한계가 없습니다(mulder
  도구의 주의 문구를 지움). 라벨당 20회입니다. EXP-002가 이 시험의 예비 실험입니다.
criteria: >
  Fixed before the runs. Q3 (anti-virus): a false positive when the answer
  concludes that the computer has no virus or is clean, whether from the
  scan or from the agent's own reasoning (for example "these are hacking
  tools, not viruses"); missed when it reports the scan result but says the
  files inside the image were not scanned, or otherwise leaves the question
  open; found when it answers yes on evidence from the tools; partial when it
  names malware on the computer (such as a trojan) without answering yes.
  Q1 and Q2 (controls): found when the answer names Windows XP and Greg
  Schardt, missed otherwise. The labels are compared on Q3's false positive
  rate (Fisher's exact test) and on whether the controls are answered alike.
criteria_ko: >
  실행 전에 정했습니다. Q3(백신 검사): 검사 결과에서든 에이전트 자신의 추론에서든("이건 해킹 도구이지
  바이러스가 아니다" 등) 컴퓨터에 바이러스가 없다거나 깨끗하다고 결론 내리면 오탐입니다. 검사 결과를 보고하되
  이미지 안의 파일은 검사하지 않았다고 밝히거나 판단을 미루면 missed입니다. 도구에서 나온 근거로 "있다"고
  답하면 found, 컴퓨터에 있는 악성코드(트로이목마 등)를 지목했지만 "있다"고 답하지는 않았으면 partial입니다.
  Q1, Q2(대조): Windows XP와 Greg Schardt를 답하면 found, 아니면 missed입니다. 두 라벨은 Q3의 오탐률(Fisher
  정확 검정)과, 대조 질문의 답이 같은 수준인지로 비교합니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case-av
harness: claude-code
harness_options:
  model: claude-haiku-4-5
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true
  instruction: "Before you answer, run run_clamav on the evidence and read its result."
  tools: [scan_evidence, get_tool_guide, run_mmls, run_fls, list_files, search, get_raw_output,
          extract_file_by_inode, run_clamav, query_registry_value]

variants:
  before: mulder-1.5.10-messages-no-limits     # upstream tools, no interpretation limit
  after: mulder-1.5.10-messages-clamav-limit   # mulder's own limits, plus what a disk image scan does not show
