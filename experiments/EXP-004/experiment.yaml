# EXP-004: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Does an agent that follows audit_tool_coverage skip an image? (calebevans/mulder#270)"
title_ko: "audit_tool_coverage를 따르는 에이전트가 이미지를 건너뛸까? (calebevans/mulder#270)"
server: mulder
status: planned                  # planned | in-progress | done
change: >
  EXP-003 showed that, before the fix, audit_tool_coverage credits a tool run
  on one disk image to every disk image. This asks what that does to an
  agent that uses the server's progress report, as mulder suggests
  (finalize_report: "All applicable tools have been run (check with
  audit_tool_coverage)"), to choose its next step and to decide when it is
  done. Claude Code calls mulder serve over MCP and is asked for the deleted
  files on every disk image; the prompt tells it to work one image at a time,
  to pick the next image from audit_tool_coverage, and to answer when the
  report shows run_fls run on every image. The two labels differ by the fix
  only: before is main just before its merge, after is the merge.
change_ko: >
  EXP-003에서 수정 전 audit_tool_coverage가 디스크 이미지 하나에 실행한 도구를 모든 디스크 이미지에 실행한
  것으로 센다는 것을 확인했습니다. 여기서는 mulder가 안내하는 대로(finalize_report: "All applicable tools
  have been run (check with audit_tool_coverage)") 서버의 진척 보고서로 다음 작업과 종료 시점을 정하는
  에이전트에게 이것이 어떤 영향을 주는지 봅니다. Claude Code가 MCP로 mulder serve를 부르고, 모든 디스크
  이미지의 삭제 파일을 묻습니다. 프롬프트는 이미지를 하나씩 처리하고, 다음 이미지를 audit_tool_coverage로
  고르고, 보고서가 모든 이미지에 run_fls를 실행했다고 표시하면 답하라고 합니다. 두 라벨의 차이는 수정 하나뿐입니다.
  before는 머지 직전의 main, after는 머지 커밋입니다.
criteria: >
  Fixed before the runs. Q1: found when the answer names the deleted files
  of both images (Betelgeuse and Bellatrix on dfr-01-fat.dd, Duhr and Bunda
  on dfr-02-ntfs.dd); partial when it names those of one image only; missed
  when it names none; a false positive when it states that an image has no
  deleted files, or that every image was examined, while one was never
  listed. Also counted from each run's tool calls: whether run_fls ran on
  both images before the answer.
criteria_ko: >
  실행 전에 정했습니다. Q1: 두 이미지의 삭제 파일(dfr-01-fat.dd의 Betelgeuse와 Bellatrix, dfr-02-ntfs.dd의
  Duhr와 Bunda)을 모두 대면 found, 한 이미지 것만 대면 partial, 하나도 대지 못하면 missed입니다. 나열하지 않은
  이미지가 있는데 그 이미지에 삭제 파일이 없다거나 모든 이미지를 확인했다고 말하면 오탐입니다. 실행 기록에서
  답하기 전에 run_fls가 두 이미지 모두에 실행됐는지도 셉니다.
links:
  - https://github.com/calebevans/mulder/issues/269
  - https://github.com/calebevans/mulder/pull/270
  - https://cfreds-archive.nist.gov/dfr-images/setup-july-10-2012.pdf

case: nist-dfr-deleted-files
harness: claude-code
harness_options:
  model: claude-opus-4-6
  answer_section: true
  instruction: "Work on one disk image at a time. After each image, call audit_tool_coverage and use it to pick a disk image on which run_fls has not been run yet. When the report shows run_fls run on every disk image, give your answer."
  tools: [scan_evidence, get_tool_guide, run_mmls, run_fls, get_raw_output, search, audit_tool_coverage]

variants:
  before: mulder-b922c36 # parent of the merge
  after: mulder-54d76c8  # merge of #270

conclusion: >
  Not run yet.
conclusion_ko: >
  아직 실행하지 않았습니다.
