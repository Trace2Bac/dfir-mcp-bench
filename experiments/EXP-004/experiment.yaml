# EXP-004: one verification. The folder name is its permanent identifier;
# the title may change.
title: "Tools that do the work Haiku leaves undone"
title_ko: "Haiku가 하지 않는 일을 도구가 대신함"
server: mulder
status: done                     # planned | in-progress | done
change: >
  With Haiku in every role, mulder investigate misses most answers less
  from wrong reasoning than from work Haiku does not do: registry values it
  does not query, a capture without a file name extension it does not open,
  a hash it does not check, tools the planner leaves out. Earlier trial runs
  of this case (not kept) also showed that stating a tool's limits is not
  enough: Haiku often read the limit and still concluded "no capture" or "no
  virus". The after version has the tools do that work. run_hashdeep checks
  the acquisition hash stored in an EWF image with ewfverify and says the
  file hashes are not the media hash. analyze_disk_pcaps also recognizes a
  capture without an extension by its header, lists the HTTP hosts and user
  agents in it, and names the file's path in its summary. A new
  get_windows_system_profile reads the OS, install date, owner, computer
  name, time zone, last shutdown, network cards, installed programs and
  local accounts in one call. A new get_recycle_bin reads the Recycle Bin
  index (INFO2, $I) and says whether each item is still in the bin.
  run_clamav also copies the files out of a disk image with tsk_recover and
  scans them, since clamscan cannot open an image. get_completed_results
  returns the source name of a result, and the sources a tool such as
  analyze_disk_pcaps indexes one per file (in a trial run the executor made
  up a source name for the capture and the analyst found nothing under it).
  When the first extraction plan for a disk image leaves out run_hashdeep,
  analyze_disk_pcaps, get_windows_system_profile or get_recycle_bin, they
  are added to it in code. It also carries tool limits to the analyst, as
  in EXP-003. Compared, five runs per label: full match, detection and
  false positives.
change_ko: >
  모든 역할을 Haiku로 하면 mulder investigate가 틀리는 답은 잘못된 추론보다 Haiku가 하지 않은 일에서
  나옵니다. 조회하지 않은 레지스트리 값, 확장자가 없어 열어 보지 않은 캡처 파일, 확인하지 않은 해시,
  planner가 빼먹은 도구입니다. 이 케이스로 먼저 돌려 본 실행(기록은 남기지 않음)에서는 도구의 한계를
  알리는 것만으로는 부족하다는 것도 보였습니다. Haiku는 한계를 읽고도 "캡처 없음", "바이러스 없음"으로
  결론짓는 경우가 많았습니다. after는 그 일을 도구가 대신합니다. run_hashdeep이 EWF 이미지에 저장된 획득
  해시를 ewfverify로 확인하고, 파일 해시는 매체 해시가 아니라고 알립니다. analyze_disk_pcaps가 확장자
  없는 캡처도 헤더로 알아보고, HTTP 호스트와 User-Agent를 정리하고, 요약에 파일 경로를 넣습니다. 새
  도구 get_windows_system_profile이 OS, 설치일, 소유자, 컴퓨터 이름, 시간대, 마지막 종료, 네트워크
  카드, 설치 프로그램, 로컬 계정을 한 번에 읽습니다. 새 도구 get_recycle_bin이 휴지통 색인(INFO2,
  $I)을 읽고 각 항목이 아직 휴지통에 있는지 알립니다. run_clamav가 디스크 이미지 안의 파일을
  tsk_recover로 꺼내 검사합니다(clamscan은 이미지를 열지 못함). get_completed_results가 결과의 source
  이름과, analyze_disk_pcaps처럼 파일마다 만드는 source들을 돌려줍니다(먼저 돌려 본 실행에서 executor가
  캡처의 source 이름을 지어내 analyst가 아무것도 찾지 못했습니다). 디스크 이미지의 첫 추출 계획에
  run_hashdeep, analyze_disk_pcaps, get_windows_system_profile, get_recycle_bin이 빠지면 코드가
  추가합니다. EXP-003처럼 도구의 한계도 analyst까지 전달합니다. 라벨당 5회로 완전 일치, 탐지, 오탐을
  비교합니다.
links:
  - https://cfreds-archive.nist.gov/Hacking_Case.html
  - https://cfreds-archive.nist.gov/images/TestAnswers.pdf

case: nist-hacking-case
harness: mulder-investigate
harness_options:
  models: {planner: claude-haiku-4-5, executor: claude-haiku-4-5, analyst: claude-haiku-4-5}
  # No effort: the effort setting is for Opus and Sonnet models.
  answer_section: true

variants:
  before: mulder-1.5.10                  # upstream release
  after: mulder-1.5.10-haiku-assists     # every tool assist above

conclusion: >
  Haiku in every role, five runs per label. Review, median (range): before
  full match 29% (19 to 32), detection 39% (26 to 45), false positives 6% (0
  to 6); after 65% (45 to 65), 71% (55 to 74), 0% (0 to 6). The ranges do
  not overlap. Every after run called run_hashdeep, analyze_disk_pcaps,
  get_windows_system_profile, get_recycle_bin and run_clamav. Answered in
  all five after runs and in none before: Q1 (the acquisition hash, which
  before claimed as verified in three runs from the E01 file hashes), Q28
  and Q29 (four executables, still in the Recycle Bin) and Q31 (ClamAV
  found 18 files inside the image; before, three runs said there was no
  virus). The capture "interception" and what it shows (Q23 to Q25) were
  found in four runs, never before. In the fifth (run 4) the executor
  passed on the right source, pcap.disk.interception, but the analyst only
  searched it with words such as "pcap" and "victim", found nothing, never
  read it, and wrote that no capture exists. Still missed in every run:
  Q7, Q15, Q20, Q27 and Q30. The ClamAV scan of the files inside the image
  made each after run take about 31 minutes, against about 14 before.
conclusion_ko: >
  모든 역할 Haiku, 라벨당 5회. 검토 중앙값(범위): before 완전 일치 29%(19~32), 탐지 39%(26~45),
  오탐 6%(0~6); after 65%(45~65), 71%(55~74), 0%(0~6). 범위가 겹치지 않습니다. after는 5회 모두
  run_hashdeep, analyze_disk_pcaps, get_windows_system_profile, get_recycle_bin, run_clamav를
  호출했습니다. after 5회 모두 맞히고 before는 한 번도 못 맞힌 문제: Q1(획득 해시. before는 3회에서 E01
  파일 해시로 "검증됐습니다"라고 단정), Q28, Q29(실행 파일 4개, 아직 휴지통에 있음), Q31(ClamAV가 이미지
  안의 파일 18개를 탐지. before는 3회에서 "바이러스 없음"). 캡처 파일 "interception"과 그 내용
  (Q23~Q25)은 4회 맞혔습니다(before 0회). 나머지 1회(4회차)는 executor가 올바른 source
  pcap.disk.interception을 넘겼지만, analyst가 "pcap", "victim" 같은 단어로만 검색해 결과가 없자
  원문을 읽지 않고 "캡처 없음"이라고 썼습니다. 5회 모두 틀린 문제: Q7, Q15, Q20, Q27, Q30. 이미지 안
  파일의 ClamAV 검사 때문에 after 1회 실행이 약 31분 걸렸습니다(before 약 14분).
