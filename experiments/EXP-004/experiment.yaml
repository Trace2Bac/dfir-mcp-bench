case: findevil-scenario-02-www
harness: claude-code
harness_options:
  model: claude-opus-4-6
  answer_section: true

variants:
  before: findevil-d1a8d25               # findevil as published
  after: findevil-d1a8d25-per-location   # plus coverage-per-location

conclusion: |
  With the fix, the coverage report caught the history the agent's tools
  had missed, and every run found the attacker's commands; without it, no
  run did (0 of 10 against 10 of 10, Fisher's exact test p < 0.001).

  - Before: in all 10 runs the agent analyzed the three histories
    find_shell_histories listed, then read assess_coverage, which marked
    shell history "✅ examined" (in 3 runs with COVERAGE CLEAN). It never
    analyzed www-data's history, and concluded that no shell history holds
    the attacker's commands (Q2 false positive, 10 of 10).
  - After: in all 10 runs the first report said "⚠ 3 of 4 examined" and
    listed /var/www/.bash_history as never examined. The agent analyzed it
    on the next call ("I missed a shell history at fs/var/www/.bash_history")
    and reported the download from 185.229.59.103 (Q1 and Q2 found, 10 of
    10).
  - The agent did the same work in both labels and read the report at the
    same point, near the end. What differed was what the report said about
    the one target the listing tool had not shown.
  - Limits: the history was written for this bench, in an account the
    scenario already has, and a real Debian /etc was added so that
    list_evidence cuts its listing as it does on real snapshots. With the
    scenario's ten-odd files alone, list_evidence showed the file and the
    agent found it unaided (10 of 10, archived). find_shell_histories, the
    other half of the cause, is not changed by the patch.
conclusion_ko: |
  수정 후에는 진척 보고가 에이전트의 도구가 놓친 이력을 잡아내서 모든 실행이 공격자의 명령을 찾았고, 수정 전에는 한 번도 찾지 못했습니다(10회 중 0회 대 10회, Fisher 정확 검정 p < 0.001).

  - 수정 전: 10회 모두 에이전트가 find_shell_histories가 나열한 이력 세 개를 분석한 뒤 assess_coverage를 봤고, 보고서는 셸 이력을 "✅ examined"로 표시했습니다(3회는 COVERAGE CLEAN). www-data 이력은 한 번도 분석하지 않았고, 어떤 셸 이력에도 공격자의 명령이 없다고 결론 내렸습니다(Q2 오탐 10회 중 10회).
  - 수정 후: 10회 모두 첫 보고서가 "⚠ 3 of 4 examined"라고 하고 /var/www/.bash_history를 검사하지 않은 것으로 나열했습니다. 에이전트는 바로 다음 호출에서 그 이력을 분석했고("I missed a shell history at fs/var/www/.bash_history"), 185.229.59.103에서 받은 파일을 보고했습니다(Q1, Q2 일치 10회 중 10회).
  - 두 라벨에서 에이전트는 같은 작업을 하고 같은 시점(조사 막바지)에 보고서를 봤습니다. 달랐던 것은 목록 도구가 보여 주지 않은 대상 하나에 대해 보고서가 한 말뿐입니다.
  - 한계: 이 이력은 시나리오에 원래 있는 계정에 이 벤치를 위해 써 넣은 것이고, list_evidence가 실제 스냅숏처럼 목록을 자르도록 실제 Debian /etc를 더했습니다. 시나리오의 파일 10여 개만 있을 때는 list_evidence에 파일이 보여서 에이전트가 스스로 찾았습니다(10회 중 10회, 보관함). 원인의 나머지 절반인 find_shell_histories는 이 패치로 바뀌지 않습니다.
