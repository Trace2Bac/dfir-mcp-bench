# One entry per patch in patches/: what it changes and why. Kept outside
# patches/ so that editing it does not change the image build. Shown on the
# site's patch pages next to the diff. Patches apply in the order a variant
# lists them (PATCHES in servers/mulder/variants/*.env), each on top of the
# ones before it: tool-improvements, system-profile, recycle-bin, then
# strip-limits or limit-display. None of them is upstream yet.

tool-improvements.patch:
  title: "Existing tools find more, and batch results name their sources"
  title_ko: "기존 도구가 더 찾고, 일괄 결과가 source 이름을 알려 줌"
  summary: >
    run_hashdeep checks the acquisition hash stored in an EWF image with
    ewfverify and indexes the check as hashdeep.acquisition; an image
    ewfverify cannot read is recorded as a failed check, not as "no stored
    hash". analyze_disk_pcaps also opens files without an extension and
    recognizes a capture by its header (user folders first, files under 24
    bytes skipped), lists the HTTP hosts and user agents in a capture, and
    names the file's path in its indexed summary. run_clamav copies the files
    out of a disk image with tsk_recover and scans them, since clamscan
    cannot open an image. get_completed_results returns each result's source
    name, the sources a tool indexes one per file, and the job's status (it
    returned none of these, a bug). A tool's message now reaches the analyst:
    tool_response keeps it outside the preview, get_completed_results passes it
    on (it dropped it), the executor prompts copy it word for word into a
    "message" field of their report, and the analyst receives it. The
    messages of run_hashdeep, analyze_disk_pcaps and run_clamav summarize
    what was found and where it is indexed. When the first extraction plan
    for a disk image leaves out run_hashdeep or analyze_disk_pcaps, they are
    added to it in code.
  summary_ko: >
    run_hashdeep이 EWF 이미지에 저장된 획득 해시를 ewfverify로 확인해 hashdeep.acquisition으로
    색인합니다. ewfverify가 이미지를 다 읽지 못하면 "저장 해시 없음"이 아니라 검증 실패로 기록합니다.
    analyze_disk_pcaps가 확장자 없는 파일도 열어 헤더로 캡처를 알아보고(사용자 폴더 먼저, 24바이트
    미만 제외), 캡처 안의 HTTP 호스트와 User-Agent를 정리하고, 색인 요약에 파일 경로를 넣습니다.
    run_clamav가 디스크 이미지 안의 파일을 tsk_recover로 꺼내 검사합니다(clamscan은 이미지를 열지
    못함). get_completed_results가 결과의 source 이름, 파일마다 만드는 source들, 작업 상태를
    돌려줍니다(원래 하나도 돌려주지 못한 버그). 도구의 메시지가 analyst까지 갑니다. tool_response가
    메시지를 미리보기 밖에 두고, get_completed_results가 넘기고(원래 버렸습니다), executor 프롬프트가
    보고서의 "message" 칸에 그대로 옮기며, analyst가 받습니다. run_hashdeep, analyze_disk_pcaps,
    run_clamav의 메시지는 찾은 것과 색인된 위치를 요약합니다. 디스크 이미지의 첫 추출 계획에
    run_hashdeep이나 analyze_disk_pcaps가 빠지면 코드가 추가합니다.
  known_issues: >
    The ClamAV scan of the files inside an image can take an hour or more on
    a large disk.
  known_issues_ko: >
    이미지 안 파일의 ClamAV 검사는 큰 디스크에서 1시간 이상 걸릴 수 있습니다.
  changes:
    - "run_hashdeep: checks the acquisition hash stored in an EWF image with ewfverify (indexed as hashdeep.acquisition); an unreadable image is a failed check"
    - "analyze_disk_pcaps: opens files without an extension and recognizes a capture by its header (user folders first, files under 24 bytes skipped)"
    - "analyze_disk_pcaps: lists HTTP hosts and user agents in a capture, and names the file's path in its indexed summary"
    - "run_clamav: copies the files out of a disk image with tsk_recover and scans them (3 processes)"
    - "get_completed_results: returns source names, the sources a tool indexes one per file, and the job status (bug fix)"
    - "Message channel: a tool's message reaches the analyst (tool_response, get_completed_results, executor report, analyst)"
    - "Result summaries in the messages of run_hashdeep, analyze_disk_pcaps and run_clamav"
    - "Planner: run_hashdeep and analyze_disk_pcaps are added to a disk image plan in code when left out"
  changes_ko:
    - "run_hashdeep: EWF 이미지에 저장된 획득 해시를 ewfverify로 확인(hashdeep.acquisition으로 색인), 이미지를 못 읽으면 검증 실패로 기록"
    - "analyze_disk_pcaps: 확장자 없는 파일을 열어 헤더로 캡처를 판별(사용자 폴더 먼저, 24바이트 미만 제외)"
    - "analyze_disk_pcaps: 캡처의 HTTP 호스트·User-Agent 요약, 색인 요약에 파일 경로 표시"
    - "run_clamav: 디스크 이미지 안의 파일을 tsk_recover로 꺼내 검사(프로세스 3개)"
    - "get_completed_results: source 이름, 파일별 source 목록, 작업 상태를 돌려줌(버그 수정)"
    - "메시지 전달 통로: 도구 메시지가 analyst까지 전달(tool_response, get_completed_results, executor 보고, analyst)"
    - "run_hashdeep, analyze_disk_pcaps, run_clamav 메시지에 결과 요약"
    - "planner: 디스크 이미지 계획에 run_hashdeep, analyze_disk_pcaps가 빠지면 코드가 추가"

system-profile.patch:
  title: "New tool: get_windows_system_profile"
  title_ko: "새 도구: get_windows_system_profile"
  summary: >
    Reads the OS, install date, owner, computer name, time zone (with the
    offset in effect), last shutdown, network cards and addresses, installed
    programs and local accounts (logon count, last logon) from the SYSTEM,
    SOFTWARE and SAM hives in one call, and indexes them as registry.profile.
    When no hive can be read it says whether there was no file listing, no
    hive in it, or a hive that could not be read. mulder can reach the same
    values with run_registry_parser and query_registry_value; this tool
    saves a weaker model the many separate queries. Planned with every
    Windows disk image, and added to the plan in code when left out.
  summary_ko: >
    SYSTEM, SOFTWARE, SAM 하이브에서 OS, 설치일, 소유자, 컴퓨터 이름, 시간대(적용 중인 오프셋
    포함), 마지막 종료, 네트워크 카드와 주소, 설치 프로그램, 로컬 계정(로그인 횟수, 마지막 로그인)을
    한 번에 읽어 registry.profile로 색인합니다. 하이브를 못 읽으면 파일 목록이 없었는지, 목록에
    하이브가 없었는지, 하이브를 읽지 못했는지를 알립니다. mulder는 run_registry_parser와
    query_registry_value로 같은 값을 얻을 수 있습니다. 이 도구는 약한 모델이 여러 번 따로 조회하지 않게
    해 줍니다. Windows 디스크 이미지마다 계획하고, 빠지면 코드가 추가합니다.
  changes:
    - "New tool get_windows_system_profile: OS, install date, owner, computer name, time zone, last shutdown, network, installed programs, local accounts in one call (indexed as registry.profile)"
    - "Says why no hive was read: no file listing, no hive in it, or a hive that could not be read"
    - "Registered in the tool guide and the planner and analyst prompts; added to a Windows plan in code when left out"
  changes_ko:
    - "새 도구 get_windows_system_profile: OS, 설치일, 소유자, 컴퓨터 이름, 시간대, 마지막 종료, 네트워크, 설치 프로그램, 로컬 계정을 한 번에(registry.profile로 색인)"
    - "하이브를 못 읽으면 이유를 알림: 파일 목록 없음, 목록에 하이브 없음, 하이브 읽기 실패"
    - "도구 안내와 planner·analyst 프롬프트에 등록, Windows 계획에서 빠지면 코드가 추가"

recycle-bin.patch:
  title: "New tool: get_recycle_bin"
  title_ko: "새 도구: get_recycle_bin"
  summary: >
    Reads the Recycle Bin index of every user (INFO2 up to Windows XP, $I
    files from Vista on, including index files deleted when the bin was
    emptied): the original path, deletion time and size of each item, the
    name it is stored under, and whether that stored file is still allocated.
    Counts the executable items, indexes the list as recycle_bin, and
    summarizes the counts in its message. mulder
    had no tool that reads the Recycle Bin index. Planned with every Windows
    disk image, and added to the plan in code when left out.
  summary_ko: >
    모든 사용자의 휴지통 색인(Windows XP까지는 INFO2, Vista부터는 $I 파일, 휴지통을 비울 때
    삭제된 색인 포함)을 읽습니다. 항목마다 원래 경로, 삭제 시각, 크기, 휴지통 안에 저장된 이름, 그
    파일이 아직 할당돼 있는지를 알리고, 실행 파일 수를 세어 recycle_bin으로 색인하고, 메시지에 개수를
    요약합니다. mulder에는
    휴지통 색인을 읽는 도구가 없었습니다. Windows 디스크 이미지마다 계획하고, 빠지면 코드가 추가합니다.
  changes:
    - "New tool get_recycle_bin: INFO2 and $I records of every user, including index files deleted when the bin was emptied (indexed as recycle_bin)"
    - "Message summarizes the item count, the executables and how many are still stored in the bin"
    - "Registered in the tool guide and the planner and analyst prompts; added to a Windows plan in code when left out"
  changes_ko:
    - "새 도구 get_recycle_bin: 모든 사용자의 INFO2·$I 기록, 휴지통을 비울 때 삭제된 색인 파일도 읽음(recycle_bin으로 색인)"
    - "메시지에 항목 수, 실행 파일 수, 휴지통에 아직 남은 수를 요약"
    - "도구 안내와 planner·analyst 프롬프트에 등록, Windows 계획에서 빠지면 코드가 추가"

limit-display.patch:
  title: "Tools state what they did not check (interpretation limits)"
  title_ko: "도구가 확인하지 않은 범위를 알림 (해석 한계)"
  summary: >
    Applied in the variant with interpretation limits (the one without them
    applies strip-limits instead). It only appends limit sentences to tool
    messages that every variant already sends: analyze_disk_pcaps says how
    many files it searched, on which partitions, by which extensions and how
    many it opened by header, that files with other extensions were not
    opened, and with no result that this does not show the image holds no
    capture; run_hashdeep says the file hashes are not the media hash and
    that a failed check says nothing about a stored hash; run_clamav says
    what it scanned inside an image and what it did not (also in its indexed
    text); get_windows_system_profile and get_recycle_bin name what they
    could not read.
  summary_ko: >
    해석 한계가 있는 variant에 적용합니다(없는 variant는 대신 strip-limits를 적용합니다). 모든
    variant가 이미 보내는 도구 메시지 끝에 한계 문장만 덧붙입니다. analyze_disk_pcaps는 몇 개 파일을
    어느 파티션에서 어떤 확장자로 찾았고 몇 개를 헤더로 열어 봤는지, 다른 확장자 파일은 열지
    않았다는 것, 결과가 없으면 캡처가 없다는 뜻은 아니라는 것을 적습니다. run_hashdeep은 파일 해시가
    매체 해시가 아니라는 것과, 검증 실패가 해시 저장 여부를 말해 주지 않는다는 것을 적습니다.
    run_clamav는 이미지 안에서 무엇을 검사했고 무엇을 하지 않았는지 적습니다(색인 텍스트에도).
    get_windows_system_profile과 get_recycle_bin은 읽지 못한 것을 적습니다.
  changes:
    - "analyze_disk_pcaps: appends what it searched and that files with other extensions were not opened; with no result, that this does not show there is no capture"
    - "run_hashdeep: appends that the file hashes are not the media hash, and that a failed check says nothing about a stored hash"
    - "run_clamav: appends what it scanned inside an image and what it did not (also in the indexed text)"
    - "get_windows_system_profile, get_recycle_bin: append what they could not read"
  changes_ko:
    - "analyze_disk_pcaps: 확인 범위와 다른 확장자 파일은 열지 않았다는 문장, 결과가 없으면 캡처가 없다는 뜻은 아니라는 문장 추가"
    - "run_hashdeep: 파일 해시는 매체 해시가 아니라는 문장, 검증 실패가 해시 저장 여부를 말해 주지 않는다는 문장 추가"
    - "run_clamav: 이미지 안에서 검사한 것과 하지 않은 것(색인 텍스트에도) 추가"
    - "get_windows_system_profile, get_recycle_bin: 읽지 못한 것 추가"

strip-limits.patch:
  title: "Remove every interpretation limit (bench only)"
  title_ko: "해석 한계를 모두 제거 (벤치 전용)"
  summary: >
    For the baseline with no interpretation limits, not for upstream. Removes
    every statement of what a result does not show or what was not checked,
    in mulder's prompts, mulder's tools and the bench's own tool changes.
    Tool descriptions of what a tool does, error messages, the general rule
    that every claim must be supported by its source, and operational
    warnings are kept. The netflow tools' caveat rows stay (the tools do not
    run on a disk image). The ClamAV tests that checked the warning text are
    adjusted.
  summary_ko: >
    해석 한계가 없는 기준선을 위한 것이고, upstream용이 아닙니다. 결과가 무엇을 보여 주지 않는지,
    무엇을 확인하지 않았는지 말하는 문장을 mulder 프롬프트, mulder 도구, 벤치가 고친 도구에서 모두
    지웁니다. 도구가 무엇을 하는지에 대한 설명, 오류 메시지, "모든 주장은 출처로 뒷받침해야 한다"는
    일반 원칙, 운영상의 경고는 남깁니다. netflow 도구의 caveat 행은 남깁니다(디스크 이미지에서는
    실행되지 않음). 경고 문장을 확인하던 ClamAV 테스트는 맞게 고쳤습니다.
  changes:
    - "Analyst prompts: removes the evidence interpretation rules (single detections, signatures not proving compromise, tool noise), the detection plausibility check, attribution caution, dual-use tools, memory RWX guidance, detection context weighting, extension at face value, and the NetFlow reading notes"
    - "Report prompt: removes the attribution caution paragraphs"
    - "yara: removes the caveat and the noise warning; yara_scan_memory: removes the interpretation notes"
    - "volatility: removes the malfind caveat and the explanation of header-only output"
    - "run_clamav, run_bulk_extractor: removes the partial-scan warning text (the partial flag stays)"
    - "detect_timestomping: removes the sentence that no result does not guarantee absence"
    - "Bench tools: removes the interpretive sentences from run_hashdeep, run_clamav, get_windows_system_profile and get_recycle_bin (descriptions, indexed text, error reasons)"
  changes_ko:
    - "analyst 프롬프트: 증거 해석 규칙(탐지 하나, 시그니처가 침해를 증명하지 않음, 도구 노이즈), 탐지 타당성 검사, 귀속 주의, 이중 용도 도구, 메모리 RWX 지침, 탐지 위치 가중치, 확장자를 그대로 믿지 말 것, NetFlow 해석 메모 제거"
    - "보고서 프롬프트: 귀속 주의 문단 제거"
    - "yara: 주의 문구와 노이즈 경고 제거, yara_scan_memory: 해석 메모 제거"
    - "volatility: malfind 주의 문구, 헤더만 나왔을 때의 설명 제거"
    - "run_clamav, run_bulk_extractor: 일부만 검사했다는 경고 문장 제거(partial 표시는 남김)"
    - "detect_timestomping: 결과가 없다고 없음을 보장하지 않는다는 문장 제거"
    - "벤치 도구: run_hashdeep, run_clamav, get_windows_system_profile, get_recycle_bin의 해석 문장 제거(도구 설명, 색인 텍스트, 오류 이유)"
