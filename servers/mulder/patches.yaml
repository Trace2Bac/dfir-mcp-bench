# One entry per patch in patches/: what it changes and why. Kept outside
# patches/ so that editing it does not change the image build. Shown on the
# site's patch pages next to the diff. Patches apply in the order a variant
# lists them (PATCHES in servers/mulder/variants/*.env), each on top of the
# ones before it. None of them is upstream yet. The patches hold no tests:
# they change nothing in a run, and the regression tests go with the
# upstream pull requests instead.

clamav-limit.patch:
  title: "run_clamav says what a disk image scan does not show"
  title_ko: "run_clamav가 디스크 이미지 검사의 한계를 알림"
  summary: >
    One interpretation limit on upstream's run_clamav, and a way for it to
    reach the agent whole. clamscan does not open a disk image: it reads an
    EnCase or raw image as one file and reports no detection, which mulder
    returns as a success. When the target is a disk image, or a folder
    holding one, the message now says that clamscan read it as one file,
    that the files inside were not scanned, and that this does not show they
    are clean. The scan itself does not change. To deliver it, tool_response
    takes a tool's notes (warning, caveat, note, message) out of the result
    and returns them whole under notes, outside the 500-character preview,
    where a long result could cut them off. A result with no such note is
    returned as before.
  summary_ko: >
    upstream run_clamav에 해석 한계 하나를 붙이고, 그것이 에이전트에게 잘리지 않고 닿게 합니다. clamscan은 디스크
    이미지를 열지 못합니다. EnCase나 raw 이미지를 파일 하나로 읽고 탐지 0건을 보고하며, mulder는 이를 성공으로
    돌려줍니다. 검사 대상이 디스크 이미지이거나 이미지가 든 폴더이면, 메시지에 clamscan이 이미지를 파일 하나로
    읽었고 그 안의 파일은 검사하지 않았으며, 그래서 깨끗하다는 뜻은 아니라는 것을 적습니다. 검사 자체는 바뀌지
    않습니다. 이 문구를 전달하기 위해 tool_response가 도구의 주의 문구(warning, caveat, note, message)를 결과에서
    꺼내, 긴 결과에 잘릴 수 있는 500자 미리보기 밖의 notes에 그대로 싣습니다. 주의 문구가 없는 결과는 전과 같습니다.
  changes:
    - "run_clamav: on a disk image, the message says the files inside were not scanned and that this does not show they are clean"
    - "tool_response: warning, caveat, note and message go to notes, outside the preview, whole"
  changes_ko:
    - "run_clamav: 디스크 이미지를 검사하면 그 안의 파일은 검사하지 않았고, 깨끗하다는 뜻은 아니라는 것을 메시지에 표시"
    - "tool_response: warning, caveat, note, message를 미리보기 밖의 notes에 잘리지 않게 실음"

extract-keep.patch:
  title: "extract_file_by_inode keeps a binary file for other tools"
  title_ko: "extract_file_by_inode가 꺼낸 바이너리 파일을 다른 도구가 쓸 수 있게 남김"
  summary: >
    Upstream's extract_file_by_inode returns only the SHA-256 and size of a
    binary file and keeps nothing, so no other tool can read it: an agent that
    knows the files inside a disk image were not scanned cannot scan one
    after extracting it. The binary file is now saved under the case's
    extracted folder (extracted/inodes/inode_<n>), as extract_optical_file
    already does for optical discs, and its path is returned. Text files are
    indexed as before.
  summary_ko: >
    upstream extract_file_by_inode는 바이너리 파일의 SHA-256과 크기만 돌려주고 아무것도 남기지 않아서, 다른
    도구가 그 파일을 읽을 수 없습니다. 디스크 이미지 안의 파일을 검사하지 않았다는 것을 아는 에이전트도 파일을
    꺼낸 뒤 검사할 수 없습니다. 이제 바이너리 파일을 사건의 extracted 폴더(extracted/inodes/inode_<n>)에
    저장하고 경로를 돌려줍니다. 광학 디스크에서 extract_optical_file이 이미 하는 방식과 같습니다. 텍스트 파일은
    전처럼 색인합니다.
  changes:
    - "extract_file_by_inode: a binary file is saved under the case's extracted folder and its path returned"
  changes_ko:
    - "extract_file_by_inode: 바이너리 파일을 사건의 extracted 폴더에 저장하고 경로를 돌려줌"
