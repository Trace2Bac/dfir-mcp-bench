# Changes to mulder that the experiments test, one entry each: what it
# changes and why. Shown on the site's patch pages next to the diff.
#
# Two kinds of entry:
# - <name>.patch: a patch in patches/, applied by the variants that list it
#   (PATCHES in variants/*.env), in that order, each on top of the ones
#   before it. Patches hold no tests: the regression tests go with the
#   upstream pull request.
# - any other key: a change already in upstream mulder. `diff` names the
#   stored diff (upstream/), and `variants` the variants built on it.
#
# Either kind may carry `upstream`: the repository, the pull request and
# issue, and `status` (proposed while the pull request is open, merged once
# it is in, with the merge commit). When a patch here is merged upstream,
# add this block; the variants can then move to the merge commit.

clamav-limit.patch:
  title: "run_clamav says what a disk image scan does not show"
  title_ko: "run_clamav가 디스크 이미지 검사의 한계를 알림"
  summary: >
    One interpretation limit on upstream's run_clamav. clamscan does not open
    a disk image. It reads an EnCase or raw image as one file and reports no
    detection, and mulder returns that as a success. When the target is a disk
    image, or a folder that holds one (every segment, .E01, .E02 and so on),
    the result now says next to the detection count that clamscan read the
    image as one file, that the files inside were not scanned, and that this
    does not show they are clean. The same sentence is added to the indexed
    output as a NOTE line, so an agent that reads the output again with
    get_raw_output or search before it answers still sees it. In EXP-002,
    agents that had the sentence only in the first response read it, then read
    the output ("E01: OK") again before the final answer and often answered
    "no virus". The scan itself does not change.
  summary_ko: >
    upstream run_clamav에 해석 한계 하나를 붙입니다. clamscan은 디스크 이미지를 열지 못합니다. EnCase나 raw 이미지를 파일 하나로 읽고 탐지 0건을 보고하며,
    mulder는 이를 성공으로 돌려줍니다. 검사 대상이 디스크 이미지이거나 이미지가 든 폴더이면(.E01, .E02 같은 조각 모두), 결과의 탐지 수 옆에 문장이 하나 붙습니다.
    clamscan이 이미지를 파일 하나로 읽었고, 안의 파일은 검사하지 않았으며, 그러니 깨끗하다는 뜻이 아니라는 내용입니다. 같은 문장을 색인되는 출력에도 NOTE 줄로 넣어서, 답하기
    전에 get_raw_output이나 search로 출력을 다시 읽어도 보이게 합니다. EXP-002에서는 이 문장을 첫 응답에서만 받은 에이전트가 문장을 읽고도, 최종 답 전에
    출력("E01: OK")을 다시 읽고 나서 "바이러스 없음"이라고 답하는 경우가 많았습니다. 검사 자체는 바뀌지 않습니다.
  changes:
    - "run_clamav: on a disk image, the result says the files inside were not scanned and that this does not show they are clean"
    - "run_clamav: the same sentence goes into the indexed output as a NOTE line, so re-reading the output shows it"
  changes_ko:
    - "run_clamav: 디스크 이미지를 검사하면 그 안의 파일은 검사하지 않았고, 깨끗하다는 뜻은 아니라는 것을 결과에 표시"
    - "run_clamav: 같은 문장을 색인되는 출력에 NOTE 줄로 넣어, 출력을 다시 읽어도 보이게 함"

extract-keep.patch:
  title: "extract_file_by_inode keeps a binary file for other tools"
  title_ko: "extract_file_by_inode가 꺼낸 바이너리 파일을 다른 도구가 쓸 수 있게 남김"
  summary: >
    Upstream's extract_file_by_inode returns only the SHA-256 and size of a
    binary file and keeps nothing, so no other tool can read the file. An
    agent that knows the files inside a disk image were not scanned still
    cannot scan one after taking it out. The binary file is now saved under
    the case's extracted folder (extracted/inodes/inode_<n>) and its path is
    returned, as extract_optical_file already does for optical discs. Text
    files are indexed as before.
  summary_ko: >
    upstream extract_file_by_inode는 바이너리 파일의 SHA-256과 크기만 돌려주고 파일은 남기지 않아서, 다른 도구가 그 파일을 읽을 수 없습니다. 디스크 이미지
    안의 파일이 검사되지 않았다는 것을 아는 에이전트도, 파일을 꺼낸 뒤 검사할 방법이 없습니다. 이제 바이너리 파일을 사건의 extracted
    폴더(extracted/inodes/inode_<n>)에 저장하고 경로를 돌려줍니다. 광학 디스크에서 extract_optical_file이 이미 하는 방식과 같습니다. 텍스트 파일은
    전처럼 색인합니다.
  changes:
    - "extract_file_by_inode: a binary file is saved under the case's extracted folder and its path returned"
  changes_ko:
    - "extract_file_by_inode: 바이너리 파일을 사건의 extracted 폴더에 저장하고 경로를 돌려줌"

pr-274:
  title: "run_pcap_analysis asks tshark for fields that exist"
  title_ko: "run_pcap_analysis가 실제로 있는 tshark 필드를 요청"
  summary: >
    The dns and smtp modes of run_pcap_analysis asked tshark for
    dns.resp.addr and smtp.response.parameter. Current Wireshark has neither,
    so both modes failed, while mulder reported success and stored tshark's
    error as the result. They now ask for dns.a and smtp.rsp.parameter. The
    pull request adds tests/test_pcap_fields.py.
  summary_ko: >
    run_pcap_analysis의 dns와 smtp 모드가 tshark에 dns.resp.addr와 smtp.response.parameter를 요청했습니다.
    지금의 Wireshark에는 두 필드가 없어서 두 모드가 모두 실패했는데, mulder는 성공으로 보고하고 tshark 오류를
    결과로 저장했습니다. 이제 dns.a와 smtp.rsp.parameter를 요청합니다. PR에는 tests/test_pcap_fields.py가
    함께 들어 있습니다.
  changes:
    - "run_pcap_analysis: the dns mode asks for dns.a, the smtp mode for smtp.rsp.parameter"
  changes_ko:
    - "run_pcap_analysis: dns 모드는 dns.a, smtp 모드는 smtp.rsp.parameter를 요청"
  diff: upstream/pr-274.diff     # git diff 1040615 e74ae6d
  variants: [mulder-e74ae6d]
  upstream:
    repo: calebevans/mulder
    pr: 274
    issue: 273
    status: merged
    merged: d20b77c8a6a6d6b872fa039e6fbf9a5a4056c711
    merged_at: 2026-10-16

pr-270:
  title: "audit_tool_coverage counts a tool only for the evidence it ran on"
  title_ko: "audit_tool_coverage가 도구를 실제로 실행한 증거에만 반영"
  summary: >
    audit_tool_coverage compared every evidence item with one list of tool
    names from the whole case's audit log, so a tool run on one disk image
    counted as run on every disk image. It now counts a tool for an item only
    when the tool's evidence-input argument names that item or a folder that
    holds it. AuditLog gains tool_call_entries() to read the stored
    arguments. The pull request adds tests/test_audit_tool_coverage_targets.py.
  summary_ko: >
    audit_tool_coverage는 모든 증거를 사건 전체 감사 로그의 도구 이름 목록 하나와 비교해서, 디스크 이미지 하나에
    실행한 도구를 모든 디스크 이미지에 실행한 것으로 셌습니다. 이제 도구의 증거 입력 인자가 그 증거나 그 증거가 든
    폴더를 가리킬 때만 실행한 것으로 셉니다. 저장된 인자를 읽도록 AuditLog에 tool_call_entries()가 생겼습니다.
    PR에는 tests/test_audit_tool_coverage_targets.py가 함께 들어 있습니다.
  changes:
    - "audit_tool_coverage: a tool counts for an evidence item only when its evidence-input argument names the item or its folder"
    - "AuditLog: tool_call_entries() returns the stored tool calls with their arguments"
  changes_ko:
    - "audit_tool_coverage: 증거 입력 인자가 그 증거나 그 폴더를 가리킬 때만 그 증거에 실행한 것으로 셈"
    - "AuditLog: 저장된 도구 호출과 인자를 돌려주는 tool_call_entries() 추가"
  diff: upstream/pr-270.diff     # git diff b922c36 54d76c8
  variants: [mulder-54d76c8]
  upstream:
    repo: calebevans/mulder
    pr: 270
    issue: 269
    status: merged
    merged: 54d76c8c9b85c68330a3c7b315c376638aec541e
    merged_at: 2026-10-16
