steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: ws0142-net
  - tool: run_strings
    note_ko: "준비: netstat 결과 적재"
    args:
      target_path: ${EVIDENCE}/WS0142/triage/netstat_ano.txt
  - tool: enrich_iocs
    note_ko: "결함 호출: 의심 연결의 상대 주소·이름 평판 조회"
    args:
      case_id: ws0142-net
      iocs: ["198.51.100.23", "10.0.2.15", "fs01.corp.example"]
expect:
  - step: 3
    note_ko: "응답에는 내부 값 10.0.2.15가 보통 IOC처럼 조회 결과로 실린다"
    regex: '"ioc": "10\.0\.2\.15",\s*"ioc_type": "ipv4"'
  - file_contains: ${OUTSIDE}/received.log
    note_ko: "내부 서버 주소가 ip-api.com에 평문 HTTP로 간다"
    text: "proxy: GET http://ip-api.com/json/10.0.2.15?"
  - file_regex: ${OUTSIDE}/received.log
    note_ko: "같은 주소가 API 키와 함께 AbuseIPDB에 간다"
    pattern: 'proxy: CONNECT api\.abuseipdb\.com:443[^\n]*\n  GET /api/v2/check\?ipAddress=10\.0\.2\.15'
  - file_contains: ${OUTSIDE}/received.log
    note_ko: "내부 파일 서버 이름이 VirusTotal에 간다"
    text: "GET /api/v3/domains/fs01.corp.example"
