  - path: recorder.py
    root: outside
    text: |
      # Stand-in for the reputation services: an HTTPS proxy on 127.0.0.1:18443
      # that answers CONNECT, ends TLS with its own certificate (trusted by the
      # server through SSL_CERT_FILE), logs the request it is sent and answers 404.
      # Nothing is forwarded.
      import socket, ssl, sys, time
      log = open(sys.argv[1], "w")
      ctx = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH)
      ctx.load_cert_chain(sys.argv[2], sys.argv[3])
      srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      srv.bind(("127.0.0.1", 18443)); srv.listen(8); srv.settimeout(5)
      end = time.time() + 90
      def head(f):
          lines = []
          while True:
              ln = f.readline()
              if not ln or ln in (b"\r\n", b"\n"):
                  return lines
              lines.append(ln.decode(errors="replace").rstrip())
      while time.time() < end:
          try:
              c, _ = srv.accept()
          except socket.timeout:
              continue
          try:
              f = c.makefile("rb")
              connect = head(f)
              log.write(f"proxy: {connect[0]}\n")
              c.sendall(b"HTTP/1.1 200 Connection established\r\n\r\n")
              t = ctx.wrap_socket(c, server_side=True)
              req = head(t.makefile("rb"))
              for ln in req:
                  if not ln.lower().startswith(("accept", "user-agent", "connection")):
                      log.write(f"  {ln}\n")
              log.flush()
              body = b'{"error": {"code": "NotFoundError", "message": "stand-in"}}'
              t.sendall(b"HTTP/1.1 404 Not Found\r\nContent-Type: application/json\r\nContent-Length: "
                        + str(len(body)).encode() + b"\r\nConnection: close\r\n\r\n" + body)
              t.close()
          except Exception as e:
              log.write(f"error: {e}\n"); log.flush()
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4153-003
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: misc_batch_run
    note_ko: "준비: 평판 서비스 대역 프록시를 띄운다"
    args:
      tool_calls:
        - cmd: ["sh", "-c", "python3 ${OUTSIDE}/recorder.py ${OUTSIDE}/received.log ${OUTSIDE}/cert.pem ${OUTSIDE}/key.pem >/dev/null 2>&1 & sleep 1"]
  - tool: enrich_vt_lookup_domain
    note_ko: "결함 호출: 내부 파일 서버 이름을 VirusTotal에서 조회한다"
    args:
      domain: fs01.corp.example.local
  - tool: enrich_vt_lookup_ip
    note_ko: "결함 호출: 사설 IP를 VirusTotal에서 조회한다"
    args:
      ip_address: 10.20.30.40
  - tool: enrich_abuseipdb_check
    note_ko: "결함 호출: 같은 사설 IP를 AbuseIPDB에서 조회한다"
    args:
      ip_address: 10.20.30.40
  - tool: misc_batch_run
    note_ko: "확인: 대역 프록시가 받은 요청 기록을 읽는다"
    args:
      tool_calls:
        - cmd: ["cat", "${OUTSIDE}/received.log"]
expect:
  - step: 3
    note_ko: "내부 이름 조회는 경고 없이 성공으로 답한다"
    regex: '^\{"success":\s*true,\s*"domain":\s*"fs01\.corp\.example\.local"'
  - step: 4
    note_ko: "사설 IP 조회도 성공으로 답한다"
    regex: '^\{"success":\s*true,\s*"ip":\s*"10\.20\.30\.40"'
  - step: 6
    note_ko: "내부 이름이 API 키와 함께 www.virustotal.com으로 갔다"
    regex: 'CONNECT www\.virustotal\.com:443[^"]*\\n  GET /api/v3/domains/fs01\.corp\.example\.local HTTP/1\.1[^"]*x-apikey: 0bench0fake'
  - step: 6
    note_ko: "사설 IP도 VirusTotal로 갔다"
    contains: "GET /api/v3/ip_addresses/10.20.30.40 HTTP/1.1"
  - step: 6
    note_ko: "같은 사설 IP가 api.abuseipdb.com으로도 갔다"
    regex: 'CONNECT api\.abuseipdb\.com:443[^"]*\\n  GET /api/v2/check\?ipAddress=10\.20\.30\.40'
