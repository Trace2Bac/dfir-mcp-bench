# Matrix case P1009-013: misc_start_execution_log carries @output_safe, so an
# output_path inside a protected location (an `evidence` path segment) is
# refused before configure() runs. The refusal names only the output path;
# the trace state is left as it was, so every later call is still recorded
# in the previous case's trace, and nothing in the refusal says so.
# Here CASE-A is open, the model starts CASE-B with output_path under
# CASE-B's evidence/ folder (case-template keeps evidence/ and analysis/
# side by side), and then hashes CASE-B's evidence file.
case_id: P1009-013
problem: P1009
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "`output_path`는 모델 인자라, 사건 폴더의 `evidence/`와 `analysis/`를 헷갈린 모델 실수나 증거 속 지시문으로 보호 위치가 들어올 수 있다. 거부 뒤 모델이 다음 도구를 그대로 부르는 것은 흔한 흐름이다."
coverage: full
summary: With CASE-A's trace open, misc_start_execution_log for CASE-B with an output_path under CASE-B/evidence is refused with a message about the output path only, and the next hash_file of CASE-B's evidence is recorded in CASE-A's trace while CASE-B has no trace at all.
summary_ko: "사건 A의 기록이 열린 상태에서 사건 B의 `misc_start_execution_log`를 `evidence/` 아래 `output_path`로 부르면 출력 경로 문제만 알리고 거부된다. 이어서 사건 B의 증거 파일을 `hash_file`로 해시하면 그 기록이 사건 A의 trace에 남고 사건 B에는 trace가 없다."
defect_ko: "이 서버는 `start_execution_log`가 거부되면 앞 사건의 기록 상태를 그대로 두는데, 거부 응답은 출력 경로만 말하고 이후 호출이 앞 사건의 기록에 쓰인다는 사실을 알리지 않는다. 거부 응답에 지금 열린 기록(사건 A)을 밝히거나 기록 상태를 비워 다음 호출이 앞 사건에 쓰이지 않게 해야 한다. 모델은 사건 B의 증거 해시가 사건 B의 보관 기록에 남았다고 알고, 사건 A의 기록에는 다른 사건의 해시가 섞인다."
setup_ko: "`cases/CASE-A`와 `cases/CASE-B` 두 사건 폴더를 두고 B의 `evidence/`에 메모리 수집 도구가 남긴 수집 기록 파일 하나를 둔다. A의 기록을 연 뒤 B의 기록을 `evidence/` 아래 경로로 열려고 하고, 이어서 B의 증거 파일을 해시한다."
fixture:
- path: cases/CASE-A/analysis
  root: outside
  dir: true
- path: cases/CASE-B/analysis
  root: outside
  dir: true
# A collection log as winpmem's acquisition wrapper writes it next to the image.
- path: cases/CASE-B/evidence/FIN-SRV02_acquisition.log
  root: outside
  text: "2026-11-20T03:12:44Z winpmem_mini_x64_rc2.exe FIN-SRV02.raw\r\n2026-11-20T03:12:44Z Driver loaded, physical memory 17179869184 bytes\r\n2026-11-20T03:19:02Z Acquisition complete: 17179869184 bytes written\r\n"
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 사건 A의 기록을 연다"
  args:
    case_id: CASE-A
    output_path: ${OUTSIDE}/cases/CASE-A/analysis/CASE-A_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-A
    launch_dashboard: false
- tool: misc_start_execution_log
  note_ko: "결함 호출: 사건 B의 기록을 evidence/ 아래 경로로 열려 한다"
  args:
    case_id: CASE-B
    output_path: ${OUTSIDE}/cases/CASE-B/evidence/CASE-B_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-B
    launch_dashboard: false
- tool: hash_file
  note_ko: "거부 뒤 사건 B의 증거 파일을 해시한다"
  args:
    file_path: ${OUTSIDE}/cases/CASE-B/evidence/FIN-SRV02_acquisition.log
expect:
- step: 2
  note_ko: 거부 응답은 출력 경로가 보호 위치라는 것만 말한다
  contains: "is inside a protected evidence directory. Write outputs to ./analysis/, ./exports/, or ./reports/ only."
- step: 2
  note_ko: 거부 응답에는 지금 열린 사건 A가 나오지 않는다(아래 파일 확인과 대조)
  not_contains: CASE-A
- step: 3
  note_ko: 사건 B 증거의 해시는 성공으로 돌아온다
  regex: '"success": true.*FIN-SRV02_acquisition.log'
- file_regex: ${OUTSIDE}/cases/CASE-A/analysis/CASE-A_trace.json
  note_ko: 사건 B 증거 파일의 해시가 사건 A의 trace에 기록된다
  pattern: '"cmd": "hash\.file [^"]*/cases/CASE-B/evidence/FIN-SRV02_acquisition\.log"'
- file_missing: ${OUTSIDE}/cases/CASE-B/evidence/CASE-B_trace.json
  note_ko: 사건 B의 trace는 만들어지지 않았다
- file_missing: ${OUTSIDE}/cases/CASE-B/analysis/CASE-B_trace.json
  note_ko: 사건 B의 analysis 폴더에도 trace가 없다
