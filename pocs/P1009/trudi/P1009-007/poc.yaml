# Matrix case P1009-007: a tool that runs as a background job records its
# completion into whatever trace the global log points at when it finishes
# (core/executor.py _log_tool -> core.execution_log.log), not into the
# trace of the case it was started for. tsk_recover is always a job
# (core/jobs.py BACKGROUND_ALWAYS); the job hint tells the model to continue
# with other work, and misc_start_execution_log may be called at any time.
# Here a tsk_recover of CASE-A's USB image is started, CASE-B is opened, and
# CASE-B's memory image is hashed while the job runs: the tsk_recover entry
# (with CASE-A's image and output folder) lands in CASE-B's trace.
# The USB image is a real FAT12 volume (boot sector, two FATs, root
# directory with PAYMENT.TXT, data) written as the first sectors of a
# 160 KiB image. tsk_recover itself is the real one (The Sleuth Kit); trudi
# runs it as "sudo tsk_recover ..." (SIFT has passwordless sudo) and the
# image has no sudo, so ${STUBS}/sudo runs the command after one second, a
# stand-in for the minutes a real disk image takes (this 160 KiB one would
# otherwise finish before the next request is read).
case_id: P1009-007
problem: P1009
server: trudi
variant: trudi-88fbca7-fastmcp3
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "job 응답의 `hint`가 기다리지 말고 다른 일을 하라고 안내하고 `start_execution_log` 설명도 언제 불러도 된다고 하므로, 한 서버에서 앞 사건의 복구 작업을 띄워 둔 채 다음 사건을 여는 흐름은 특별한 상태 없이 생긴다."
coverage: "partial: job_status is not polled (its job_id is random and a step cannot reuse it); the completion entry is written when the job ends, without a poll"
coverage_ko: "job_id가 무작위라 다음 단계에서 쓸 수 없어 `job_status`는 부르지 않는다. 완료 기록은 폴링 없이 작업이 끝날 때 쓰인다."
summary: tsk_recover started as a background job for CASE-A finishes after misc_start_execution_log has opened CASE-B, and its completion entry, with CASE-A's image and output folder, is written to CASE-B's trace while CASE-A's trace has none, because the job records into the global log at completion instead of the case it was started for.
summary_ko: "사건 A에서 백그라운드 작업으로 띄운 `tsk_recover`가 `misc_start_execution_log`로 사건 B를 연 뒤에 끝나면, 사건 A의 이미지와 출력 폴더가 든 완료 기록이 사건 B의 trace에 쓰이고 사건 A의 trace에는 남지 않는다. 작업이 시작한 사건의 기록이 아니라 끝날 때의 전역 기록에 쓰기 때문이다."
defect_ko: "이 서버는 백그라운드 작업의 완료 기록을 작업이 끝나는 시점의 전역 기록 객체에 쓰고, 시작할 때의 사건 기록을 작업에 고정하지 않는다. 작업은 자신을 띄운 사건의 trace에 완료를 기록해야 한다. 모델과 보고서는 사건 A의 복구 결과를 사건 B에서 실행한 도구로 알고, 사건 A의 trace에는 복구를 실행한 근거가 없다."
setup_ko: "`cases/CASE-A`의 `evidence/`에 FAT12 USB 이미지를, `cases/CASE-B`의 `evidence/`에 512 MiB 메모리 이미지를 둔다. A의 기록을 열고 `tsk_recover` 작업을 띄운 뒤, 곧바로 B의 기록을 열고 B의 메모리 이미지를 해시한다."
env:
  PATH: ${STUBS}:${PATH}
stubs:
- name: sudo
  text: |
    #!/bin/sh
    # Stand-in for passwordless sudo on SIFT: run the command as is, after
    # one second (a real disk image takes minutes to recover).
    sleep 1
    exec "$@"
fixture:
- path: cases/CASE-A/analysis
  root: outside
  dir: true
- path: cases/CASE-B/analysis
  root: outside
  dir: true
