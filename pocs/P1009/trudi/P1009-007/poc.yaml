steps:
- tool: misc_start_execution_log
  note_ko: "준비: 사건 A의 기록을 연다"
  args:
    case_id: CASE-A
    output_path: ${OUTSIDE}/cases/CASE-A/analysis/CASE-A_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-A
    launch_dashboard: false
- tool: tsk_recover
  note_ko: "사건 A의 USB 이미지에서 파일을 복구하는 작업을 띄운다(백그라운드 작업)"
  args:
    image: ${OUTSIDE}/cases/CASE-A/evidence/usb.dd
    output_dir: ${OUTSIDE}/cases/CASE-A/analysis/recovered
- tool: misc_start_execution_log
  note_ko: "결함 조건: 작업이 도는 동안 사건 B의 기록을 연다"
  args:
    case_id: CASE-B
    output_path: ${OUTSIDE}/cases/CASE-B/analysis/CASE-B_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-B
    launch_dashboard: false
- tool: hash_file
  note_ko: "사건 B의 메모리 이미지를 해시한다(그사이 사건 A의 작업이 끝난다)"
  args:
    file_path: ${OUTSIDE}/cases/CASE-B/evidence/FIN-SRV02.raw
  timeout_s: 300
expect:
- step: 2
  note_ko: tsk_recover는 백그라운드 작업 번호를 돌려준다
  regex: '"success": true, "status": "(running|queued)", "job_id": "tsk_recover-[0-9a-f]+", "tool": "tsk_recover"'
- step: 3
  note_ko: 사건 B의 새 기록이 열린다
  regex: '"success": true, "case_id": "CASE-B", "log_path": "[^"]*CASE-B_trace.json", "entries_recovered": 0'
- step: 4
  note_ko: 사건 B의 메모리 이미지 해시가 끝난다
  regex: '"success": true.*FIN-SRV02.raw'
- file_exists: ${OUTSIDE}/cases/CASE-A/analysis/recovered/PAYMENT.TXT
  note_ko: 복구 작업은 실제로 끝나 사건 A 폴더에 파일을 복구했다
- file_regex: ${OUTSIDE}/cases/CASE-B/analysis/CASE-B_trace.json
  note_ko: 사건 A 이미지의 tsk_recover 완료 기록이 사건 B의 trace에 있다
  pattern: '"cmd": "sudo tsk_recover -a [^"]*/cases/CASE-A/evidence/usb\.dd [^"]*/cases/CASE-A/analysis/recovered"'
- file_not_contains: ${OUTSIDE}/cases/CASE-A/analysis/CASE-A_trace.json
  note_ko: 사건 A의 trace에는 tsk_recover 실행 기록이 없다
  text: '"cmd": "sudo tsk_recover'
