steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: fls-offset-reuse
  - tool: run_mmls
    note_ko: "파티션 표 적재"
    args:
      image_path: ${EVIDENCE}/usb.img
  - tool: get_raw_output
    note_ko: "파티션 표 보기(섹터 252의 DATA가 더 크다)"
    args:
      source_name: tsk.partitions
  - tool: run_fls
    note_ko: "작은 RECOVERY 파티션을 오프셋 63으로 지정해 목록 보기"
    args:
      image_path: ${EVIDENCE}/usb.img
      partition_offset: 63
  - tool: run_fls
    note_ko: "결함 호출: 오프셋을 생략하고 `force=True`로 기본 파티션 다시 색인"
    args:
      image_path: ${EVIDENCE}/usb.img
      force: true
  - tool: get_raw_output
    note_ko: "결함 호출 뒤 `tsk.filelist` 원문 보기"
    args:
      source_name: tsk.filelist
  - tool: run_fls
    note_ko: "비교 호출: DATA 파티션 오프셋 252를 직접 지정"
    args:
      image_path: ${EVIDENCE}/usb.img
      partition_offset: 252
      force: true
  - tool: get_raw_output
    note_ko: "비교 호출 뒤 `tsk.filelist` 원문 보기"
    args:
      source_name: tsk.filelist
expect:
  - step: 3
    note_ko: "mmls가 섹터 252에서 시작하는 3,844섹터 파티션(가장 큼)을 보인다"
    contains: "0000000252   0000004095   0000003844"
  - step: 5
    note_ko: "오프셋을 생략한 재실행이 success로 `tsk.filelist`를 적재한다"
    regex: '"status": "success"[\s\S]*"source": "tsk.filelist"'
  - step: 6
    note_ko: "그 뒤 `tsk.filelist`에는 RECOVERY 파티션 목록(AUTORUN.INF)이 두 번 들어 있다"
    regex: '"total_windows": 2\b[\s\S]*AUTORUN\.INF[\s\S]*AUTORUN\.INF'
  - step: 6
    note_ko: "DATA 파티션의 파일은 목록에 없다"
    not_contains: "FALCON.TXT"
  - step: 8
    note_ko: "오프셋 252를 주면 DATA 파티션의 FALCON.TXT가 나온다"
    contains: "FALCON.TXT"
