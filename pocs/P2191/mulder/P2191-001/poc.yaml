# Matrix case P2191-001: run_fls says the partition offset is auto-detected
# via mmls when partition_offset is omitted, but the handler first reads the
# offset a previous run_fls stored for the same image_path (DB kv
# tsk_partition_offset:<image>) and uses it. After an explicit run on the
# small partition, a forced run without an offset lists that small partition
# again as tsk.filelist (documented as the primary, largest partition).
# The evidence is a real 2 MiB MBR image built with sfdisk and mkfs.fat 4.2
# in the server image: partition 1 at sector 63 (189 sectors, FAT12, label
# RECOVERY, AUTORUN.INF) and partition 2 at sector 252 (3,844 sectors, FAT12,
# label DATA, Q3_PAYROLL.CSV and FALCON.TXT); mmls and fls read both. Only
# the first 138,300 bytes are not zero; size pads the rest
# (sha256 7f55e0676d0c3ae192995baf406646ee7b16d5f3afbce2efd09c69282fc6c5aa).
case_id: P2191-001
problem: P2191
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "파티션이 둘인 이미지에서 작은 파티션을 먼저 오프셋을 줘서 본 뒤, 설명대로 오프셋을 생략하고 `force`로 다시 불러 기본(가장 큰) 파티션을 색인하는 흐름은 있을 수 있다."
coverage: full
summary: >-
  On a USB image with a 189-sector RECOVERY partition at sector 63 and a
  3,844-sector DATA partition at sector 252, run_fls with partition_offset 63
  and then run_fls with force=True and no partition_offset both index the
  RECOVERY partition (AUTORUN.INF) as tsk.filelist; the DATA partition with
  FALCON.TXT is listed only when offset 252 is given.
summary_ko: "섹터 63의 189섹터 RECOVERY 파티션과 섹터 252의 3,844섹터 DATA 파티션이 있는 USB 이미지에서, `run_fls`를 `partition_offset=63`으로 부른 뒤 오프셋 없이 `force=True`로 다시 부르면 두 번 다 RECOVERY 파티션(AUTORUN.INF)이 `tsk.filelist`로 적재된다. DATA 파티션의 FALCON.TXT는 오프셋 252를 줘야만 나온다."
defect_ko: "이 서버는 `partition_offset`을 생략한 `run_fls`에서 mmls로 찾지 않고, 같은 이미지에 앞서 준 오프셋을 DB에서 꺼내 그대로 쓴다. 설명대로라면 생략하면 mmls로 기본(가장 큰) 파티션을 찾아 `tsk.filelist`로 적재해야 한다. 모델은 `tsk.filelist`가 큰 DATA 파티션의 목록이라고 믿고, 거기 있는 파일(FALCON.TXT, Q3_PAYROLL.CSV)이 디스크에 없다고 잘못 안다."
setup_ko: "작은 RECOVERY 파티션(AUTORUN.INF)과 큰 DATA 파티션(Q3_PAYROLL.CSV, FALCON.TXT)이 있는 2MiB USB 이미지를 넣었다."
