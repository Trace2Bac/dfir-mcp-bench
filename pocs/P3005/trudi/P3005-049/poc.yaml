# Matrix case P3005-049: when a cited call's output is a folder, the review
# packet takes the folder's five newest data files as that call's artifact
# (entry_text_sources -> _candidate_output_files, tools/_output_reader.py:
# 293-307, 587-609; build_packet, core/evidence_packets.py:224-240).
# ez_evtxecmd records its --csv folder as output_path, so when another log
# was parsed into the same output_dir later, that log's CSV is put into the
# packet as evidence of the earlier call, and the reviewer model gets it.
# The reviewer is a stand-in for the Anthropic Messages API (anthropic_stub);
# what trudi sends it (the packet) is real, and the trace keeps it in the
# reason_call entry's inputs.user_message.
# Evidence: two real event logs: the PowerShell Operational log of
# EVTX-ATTACK-SAMPLES (Powershell_4104_MiniDumpWriteDump_Lsass.evtx, as in
# P2054-034) and the TerminalServices-LocalSessionManager Operational log of
# the NIST CFReDS Data Leakage PC (as in P2062-018).
case_id: P3005-049
problem: P3005
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: source-vs-result
level: mcp
realism: common
realism_ko: "서버 안내가 출력을 `analysis/` 아래로 정하므로 여러 로그를 같은 `output_dir`(파일 이름만 달리)로 처리하는 것은 흔한 흐름이고, 발견을 기록하기 전 `reason_evaluate_finding` 검토는 서버가 요구하는 단계다."
coverage: "partial: ez_evtxecmd only; any tool whose recorded output is a folder shares it; the reviewer is a stand-in"
coverage_ko: "`ez_evtxecmd`만 보였다. 기록된 출력이 폴더인 다른 도구도 같다. 검토 모델은 대역이다."
summary: ez_evtxecmd parses a PowerShell Operational log into analysis/evtx/powershell.csv (call 3) and then a TerminalServices LocalSessionManager log into analysis/evtx/lsm.csv (call 4); reason_evaluate_finding citing only call 3 sends the reviewer a packet whose evidence for call 3 lists lsm.csv and call 4's console log as call 3's artifact output, next to powershell.csv.
summary_ko: "`ez_evtxecmd`로 PowerShell Operational 로그를 `analysis/evtx/powershell.csv`(call 3)로, 이어 TerminalServices LocalSessionManager 로그를 같은 폴더의 `lsm.csv`(call 4)로 처리한 뒤 call 3만 인용해 `reason_evaluate_finding`을 부르면, 검토 모델에 보내는 packet에 `powershell.csv`와 함께 `lsm.csv`와 call 4의 콘솔 로그가 call 3의 산출물(`artifact_output`)로 들어간다."
defect_ko: "이 서버는 인용한 호출의 출력이 폴더면 그 폴더의 최신 데이터 파일 5개를 그 호출의 산출물로 고르고, 그 파일이 이 호출이 만든 것인지 대조하지 않는다. 정상이라면 호출이 만든 파일(`--csvf`로 정한 `powershell.csv`)만 그 호출의 근거로 써야 한다. 검토 모델은 다른 로그의 CSV와 다른 실행의 콘솔 로그를 call 3의 근거로 받아 검토하고, 그 행이 발견어와 맞으면 다른 입력의 내용으로 발견을 판정한다."
setup_ko: "EVTX-ATTACK-SAMPLES의 PowerShell Operational 로그(lsass를 `MiniDumpWriteDump`로 덤프하는 4104 스크립트 블록 포함)와 CFReDS Data Leakage PC의 TerminalServices-LocalSessionManager Operational 로그를 증거로 두고, 검토 모델 API는 정해진 답(VERDICT: SUPPORTED)을 돌려주는 대역으로 받았다."
anthropic_stub:
  responses:
    - "VERDICT: SUPPORTED\nThe cited rows show the 4104 script block calling MiniDumpWriteDump on lsass."
