steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3005-049
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: ez_evtxecmd
    note_ko: "PowerShell 로그를 `analysis/evtx/powershell.csv`로 처리한다"
    timeout_s: 300
    args:
      evtx_path: ${EVIDENCE}/Logs/Microsoft-Windows-PowerShell%4Operational.evtx
      output_dir: ${DB_DIR}/analysis/evtx
      output_file: powershell.csv
  - tool: ez_evtxecmd
    note_ko: "다른 로그를 같은 폴더의 `lsm.csv`로 처리한다"
    timeout_s: 300
    args:
      evtx_path: ${EVIDENCE}/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
      output_dir: ${DB_DIR}/analysis/evtx
      output_file: lsm.csv
  - tool: reason_evaluate_finding
    note_ko: "결함 호출: 첫 호출(call 3)만 인용해 발견을 검토받는다"
    timeout_s: 180
    args:
      finding: "On MSEDGEWIN10 a PowerShell script block (event 4104) called MiniDumpWriteDump on lsass at 2020-06-30 14:24:08 UTC."
      supporting_evidence: "EvtxECmd output of the PowerShell Operational log (call 3, powershell.csv)."
      input_call_ids: [3]
expect:
  - step: 2
    note_ko: "PowerShell 로그 처리는 call 3이다"
    regex: '"success":\s*true[\s\S]*--csvf powershell\.csv[\s\S]*"_trudi_call_id":\s*3\b'
  - step: 3
    note_ko: "LocalSessionManager 로그 처리는 call 4로, `lsm.csv`를 만든다"
    regex: '"success":\s*true[\s\S]*--csvf lsm\.csv[\s\S]*"_trudi_call_id":\s*4\b'
  - step: 4
    note_ko: "검토 모델에 보낸 packet에서 call 3의 근거로 자기 출력 `powershell.csv`가 들어간다"
    regex: '\\"call_id\\": 3, \\"kind\\": \\"artifact_output\\", \\"path\\": \\"[^\\"]*/analysis/evtx/powershell\.csv\\"'
  - step: 4
    note_ko: "같은 packet에서 call 4가 만든 `lsm.csv`도 call 3의 근거로 들어간다"
    regex: '\\"call_id\\": 3, \\"kind\\": \\"artifact_output\\", \\"path\\": \\"[^\\"]*/analysis/evtx/lsm\.csv\\"'
  - step: 4
    note_ko: "packet은 인용 호출 call 3의 근거만 담는다(call 4는 인용하지 않았다)"
    not_regex: '\\"call_id\\": 4, \\"kind\\"'
  - step: 4
    note_ko: "검토 결과가 그 packet으로 돌아온다"
    regex: '"success":\s*true[\s\S]*VERDICT: SUPPORTED'
