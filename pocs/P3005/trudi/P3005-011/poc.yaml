# Matrix case P3005-011: network_to_process (and process_to_file) gather
# earlier runs with _recent_tool_stdouts (tools/correlate.py:25-49), which
# takes every tool_call entry of the trace whose cmd contains "netscan" /
# "netstat" and keeps only call_id, cmd, stdout_excerpt and success. The
# memory image in the command is never looked at, and the connections it
# returns (tools/correlate.py:167-229) carry no image, so the output of
# several hosts' memory images comes back as one list.
# The trace is the one trudi's repository keeps for its SRL-2018 enterprise
# run (cases/srl-2018-enterprise/analysis/SRL-2018-ENTERPRISE_trace.json at
# 88fbca7), reduced to its six Volatility netscan/netstat entries (calls 43,
# 56, 621, 623, 624, 625: base-rd01, base-rd-04 and base-wkstn-04 memory
# images), each entry unchanged, in the layout the server writes
# (json.dumps(indent=2)). Calls 56 and 624 both hold a connection to
# 172.16.4.10.
case_id: P3005-011
problem: P3005
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: source-vs-result
level: mcp
realism: possible
realism_ko: "한 사건에서 여러 호스트의 메모리 이미지를 차례로 분석하면 서버가 각 vol 호출을 같은 trace에 남기고, trudi 저장소의 실제 SRL-2018 trace에도 세 이미지의 netscan·netstat 기록이 함께 있다."
coverage: "partial: network_to_process only; process_to_file reads the trace the same way"
coverage_ko: "`correlate_network_to_process`만 보였다. `correlate_process_to_file`도 같은 방식으로 trace를 읽는다."
summary: With a trace holding netscan/netstat runs of three memory images (base-rd01, base-rd-04, base-wkstn-04), correlate_network_to_process(ip=172.16.4.10) returns connections from call 56 (base-rd01) and call 624 (base-rd-04) as one success list, each with only a call id and a JSON line, and no image or host.
summary_ko: "세 메모리 이미지(base-rd01, base-rd-04, base-wkstn-04)의 netscan·netstat 실행이 든 trace에서 `correlate_network_to_process(ip='172.16.4.10')`는 call 56(base-rd01)과 call 624(base-rd-04)의 연결을 한 성공 목록으로 돌려주고, 각 항목에는 call 번호와 JSON 한 줄만 있을 뿐 이미지나 호스트가 없다."
defect_ko: "이 서버는 trace에서 명령 문자열에 `netscan`·`netstat`이 든 기록을 모두 모으면서 어느 메모리 이미지의 출력인지 보지 않고, 결과에도 출처 이미지를 적지 않는다. 정상이라면 이미지별로 나눠 돌려주거나 대상 이미지를 받아 그 이미지의 기록만 써야 한다. 모델은 서로 다른 두 호스트(172.16.6.11, 172.16.6.14)의 연결을 한 시스템의 연결로 잘못 안다."
setup_ko: "trudi 저장소에 든 실제 SRL-2018 사건 trace에서 세 메모리 이미지의 Volatility netscan·netstat 기록 여섯 개만 남겨(항목은 그대로) 이어서 연다."
