steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 세 메모리 이미지의 vol 기록이 든 사건 trace를 이어서 연다"
    args:
      case_id: SRL-2018-ENTERPRISE
      output_path: ${OUTSIDE}/srl-2018-enterprise/analysis/SRL-2018-ENTERPRISE_trace.json
      case_dir: ${OUTSIDE}/srl-2018-enterprise
      launch_dashboard: false
  - tool: correlate_network_to_process
    note_ko: "결함 호출: 172.16.4.10과의 연결을 프로세스와 잇는다"
    args:
      ip: 172.16.4.10
expect:
  - step: 1
    note_ko: "trace의 기록 여섯 개를 이어 연다"
    regex: '"entries_recovered":\s*6\b'
  - step: 2
    note_ko: "base-rd01 이미지의 netstat(call 56) 연결이 들어 있다"
    regex: '"netscan_call_id":\s*56\b'
  - step: 2
    note_ko: "base-rd-04 이미지의 netstat(call 624) 연결도 같은 목록에 들어 있다"
    regex: '"netscan_call_id":\s*624\b'
  - step: 2
    note_ko: "결과 어디에도 출처 메모리 이미지가 없다"
    not_regex: 'memory\.img|base-rd|wkstn'
  - file_regex: ${OUTSIDE}/srl-2018-enterprise/analysis/SRL-2018-ENTERPRISE_trace.json
    pattern: '"call_id": 56,[^}]*base-rd01-memory\.img -r json windows\.netstat'
    note_ko: "trace에서 call 56은 base-rd01 이미지의 netstat다"
  - file_regex: ${OUTSIDE}/srl-2018-enterprise/analysis/SRL-2018-ENTERPRISE_trace.json
    pattern: '"call_id": 624,[^}]*base-rd-04-memory\.img -r json windows\.netstat'
    note_ko: "trace에서 call 624는 base-rd-04 이미지의 netstat다"
