# Matrix case P3085-010: the server's instructions and the output check's own
# error text say outputs go to ./analysis/, ./exports/ or ./reports/, but
# assert_output_safe and @output_safe (core/paths.py:58-74, 109-149) only
# refuse evidence locations, so a tool writes its derivative anywhere else.
# The read tools then refuse that path (assert_readable_output,
# core/paths.py:80-102), so the derivative cannot be read back with
# read_output.
# Evidence: a real Windows 7 prefetch file (the same file as P4117-024).
case_id: P3085-010
problem: P3085
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "`output_path`는 모델이 정하는 인자라, 모델이 습관처럼 `/tmp` 아래 이름을 고르거나 증거 안 문서의 지시를 따라 다른 경로를 적으면 그대로 들어온다."
coverage: "partial: strings_extract only; the other tools that take an output path pass the same check"
coverage_ko: "`strings_extract`만 보였다. 출력 경로를 받는 다른 도구도 같은 검사를 거친다."
summary: strings_extract with output_path /tmp/sc_strings.txt (outside analysis/, exports/ and reports/) writes the strings there and answers success, and read_output on the same path is refused as not under analysis/ exports/ reports/.
summary_ko: "`strings_extract`에 `analysis/`·`exports/`·`reports/` 밖의 `output_path`(`/tmp/sc_strings.txt`)를 주면 그 경로에 문자열을 쓰고 성공으로 답하지만, 같은 경로를 `read_output`으로 읽으면 `analysis/ exports/ reports/` 아래가 아니라며 거부된다."
defect_ko: "이 서버는 출력 위치를 `analysis/`·`exports/`·`reports/`로 정해 안내하면서도, 쓰기 전에는 증거 위치인지만 검사해 그 밖의 어느 경로에도 파생물을 쓴다. 정상이라면 정한 폴더 밖의 출력 경로를 거부해야 한다. 모델은 파생물이 사건 폴더에 남아 나중에 읽고 인용할 수 있다고 잘못 알고, 사건 밖에 흩어진 파일은 `read_output`으로 다시 읽을 수 없다."
setup_ko: "실제 Windows 7 Prefetch 파일 `SC.EXE-945D79AE.pf`를 증거로 두었다."
