  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3085-010
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: strings_extract
    note_ko: "결함 호출: 정한 폴더 밖의 `/tmp/sc_strings.txt`로 문자열을 쓴다"
    args:
      file_path: ${EVIDENCE}/C/Windows/Prefetch/SC.EXE-945D79AE.pf
      output_path: /tmp/sc_strings.txt
  - tool: read_output
    note_ko: "비교 호출: 방금 쓴 파생물을 읽는다"
    args:
      path: /tmp/sc_strings.txt
expect:
  - step: 2
    note_ko: "정한 폴더 밖의 출력 경로를 받아 성공으로 답한다"
    regex: "\"success\":\\s*true"
  - step: 2
    note_ko: "응답의 출력 경로가 `/tmp/sc_strings.txt`다"
    regex: "\"output_path\":\\s*\"/tmp/sc_strings\\.txt\""
  - file_contains: /tmp/sc_strings.txt
    text: "SC.EXE"
    note_ko: "그 경로에 Prefetch 파일의 문자열이 실제로 쓰였다"
  - step: 3
    note_ko: "같은 파일을 `read_output`으로 읽으면 정한 폴더 밖이라며 거부된다"
    contains: "is not under analysis/ exports/ reports/"
