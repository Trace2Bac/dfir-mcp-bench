      regex: true
      source: ez.evtx
  - tool: search
    note_ko: "비교 호출: 같은 방식으로 스크립트 블록의 `MiniDumpWriteDump` 찾기"
    args:
      query: "MiniDumpWriteDump"
      regex: true
      source: ez.evtx
expect:
  - step: 2
    note_ko: "`-enc` 검색이 success에 1건이다"
    regex: '"status": "success"[\s\S]*total_findings\\": 1\b'
  - step: 2
    note_ko: "Chainsaw 실행이 실패 없이 적재된다(`chainsaw.search`, indexed)"
    regex: '"source": "chainsaw.search"[\s\S]*status\\": \\"indexed'
  - step: 3
    note_ko: "같은 로그가 `ez.evtx`로 적재된다"
    regex: '"status": "success"[\s\S]*"source": "ez.evtx"'
  - step: 4
    note_ko: "적재한 로그에는 `-enc`라는 글자가 없다(0건)"
    regex: '"status": "success"[\s\S]*"total_matches": 0\b'
  - step: 5
    note_ko: "같은 정규식 검색이 그 로그의 스크립트 블록은 찾는다"
    regex: '"status": "success"[\s\S]*"total_matches": [1-9]'
