# Matrix case P2067-011: run_chainsaw in search mode puts search_term right
# after "search" with no "--" before it, so a term that starts with "-" is
# read by Chainsaw 2.16.0 as options. "-enc" (the PowerShell encoded-command
# switch an analyst hunts for) becomes "-e nc", a regex search for "nc", and
# the PATTERN slot then takes the evidence path. The run exits 0 and the
# response reports the records that contain "nc".
case_id: P2067-011
problem: P2067
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "PowerShell 로그에서 인코딩된 명령을 찾으려고 `-enc`·`-nop` 같은 스위치를 그대로 검색어로 넣는 것은 흔한 사냥 방식이다."
coverage: full
summary: >-
  run_chainsaw mode=search with search_term '-enc' on a PowerShell
  Operational log returns success with total_findings 1 (Chainsaw read the
  term as '-e nc' and matched the lsass dump script block), while a regex search for '-enc' over the same log indexed by
  run_evtx_parser finds nothing.
summary_ko: "PowerShell Operational 로그에 `run_chainsaw`를 `mode=search`, `search_term='-enc'`로 부르면 success에 `total_findings: 1`이 온다(Chainsaw가 검색어를 `-e nc`로 읽어 lsass 덤프 스크립트 블록에 걸림). 같은 로그를 `run_evtx_parser`로 적재해 `-enc`를 정규식으로 찾으면 0건이다."
defect_ko: "이 서버는 `search_term`을 옵션 끝 표시(`--`) 없이 `search` 바로 뒤에 넣어, `-`로 시작하는 검색어를 Chainsaw가 옵션으로 읽는다. `-enc`는 정규식 `nc` 검색이 되고 증거 경로는 검색어 자리로 밀린다. 정상이라면 검색어를 글자 그대로 찾아야 한다. 모델은 `-enc`가 든 기록이 있다고, 즉 인코딩된 PowerShell 명령이 실행됐다고 잘못 안다."
setup_ko: "lsass를 MiniDumpWriteDump로 덤프하는 스크립트 블록(4104)이 든 공개 샘플 PowerShell Operational 로그를 넣었다. 로그 어디에도 `-enc`라는 글자는 없다."
