# Matrix case P4103-001: _run_tool appends "\n[STDERR]: <stderr>" whenever the
# exit code is not 0. grep exits 1 when nothing matches, so log_search gets a
# non-empty string, skips its "No matches found" branch and returns text that
# looks like a tool error.
case_id: P4103-001
problem: P4103
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "없는 패턴을 찾는 검색은 조사에서 매우 흔하다."
coverage: full
summary: 'log_search for a pattern that is not in the file returns "[STDERR]: " (grep exits 1 for no match) instead of "No matches found", so an ordinary no-match result reads as a failed search.'
summary_ko: "파일에 없는 패턴으로 log_search를 하면 \"No matches found\" 대신 \"[STDERR]: \"를 돌려준다(grep은 일치가 없으면 1로 끝난다). 그래서 평범한 일치 없음 결과가 실패한 검색으로 읽힌다."
defect_ko: "정상이라면 일치가 없을 때 `No matches found`를 돌려줘야 하는데, 이 서버는 grep의 종료 코드 1을 오류로 보고 빈 `[STDERR]: `를 붙여 돌려준다. 그래서 모델은 일치 없음을 검색 실패로 잘못 안다."
setup_ko: "한 줄짜리 syslog를 두고 그 안에 없는 `mimikatz`를 찾게 했다."
fixture:
  - path: var/log/syslog
    text: |
      Apr 15 10:00:00 web systemd[1]: Started Daily apt download activities.
steps:
  - tool: log_search
    note_ko: "결함이 있는 호출: 없는 패턴으로 검색"
    args:
      path: ${EVIDENCE}/var/log/syslog
      pattern: "mimikatz"
expect:
  - step: 1
    note_ko: "응답에 오류처럼 보이는 `[STDERR]: `가 들어 있다"
    contains: "[STDERR]: "
  - step: 1
    note_ko: "일치 없음을 뜻하는 `No matches found` 안내가 없다"
    not_contains: "No matches found"
