# Matrix case P4117-127: live_process_details reads /proc/<pid>/maps (and
# status, cmdline, environ) through `head -c 8192` on the remote shell, so a
# process map longer than 8 KB is cut there; ssh_run sees only the cut text,
# so the response says truncated: false and carries no mark. (The case also
# names live_users' `last -F | head -50`, live_recent_logins' `tail -200` and
# live_persistence_audit's tail/head cuts; those are not run here.)
# The live host is simulated: ${STUBS}/ssh drops the ssh options and
# user@host and runs the remote command line locally, as the remote shell
# would. /proc/4242 of the "host" is an apache2 worker (Ubuntu 22.04 paths):
# ${STUBS}/cat serves its status, cmdline, environ and maps from files in
# the kernel's formats, and ${STUBS}/lsof prints lsof's table for it. head
# and sh are the real ones. The map is 339 lines (37,762 bytes); the
# rootkit library /usr/local/lib/libsysupdate.so, loaded through
# /etc/ld.so.preload (so not in environ), is mapped first by ld.so and so
# sits near the end of the map, just below ld-linux.
case_id: P4117-127
problem: P4117
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "아파치처럼 모듈·라이브러리가 많은 프로세스의 maps는 8KB를 쉽게 넘고, /etc/ld.so.preload로 올리는 라이브러리는 maps 끝쪽에 놓이는 흔한 리눅스 루트킷 방식이다."
coverage: "partial: the live host is simulated (ssh, cat for /proc/4242, lsof are stubs in their real output formats); only live_process_details' head -c 8192 cut is run, not the head/tail cuts of live_users, live_recent_logins and live_persistence_audit"
coverage_ko: "실제 원격 호스트가 아니라 흉내 낸 호스트다(ssh, /proc/4242를 읽는 cat, lsof는 실제 출력 형식을 따른 대역). live_process_details의 head -c 8192만 확인했고 live_users·live_recent_logins·live_persistence_audit의 head/tail 자르기는 돌리지 않았다"
summary: On a live host whose apache2 process (pid 4242) has a 339-line map with the ld.so.preload rootkit library /usr/local/lib/libsysupdate.so near the end, live_process_details returns success, truncated false and a map that stops after 8,192 bytes (74 lines, no ld-linux, no [stack]) without the library, while live_open_files on the same pid lists it as a mapped file.
summary_ko: "apache2 프로세스(pid 4242)의 maps가 339줄이고 그 끝쪽에 ld.so.preload 루트킷 라이브러리 /usr/local/lib/libsysupdate.so가 있는 호스트에서, live_process_details는 성공과 truncated false를 내면서 8,192바이트(74줄, ld-linux·[stack] 없음)에서 끊긴 maps를 돌려주고 그 라이브러리는 없다. 같은 pid에 live_open_files를 부르면 그 라이브러리가 매핑된 파일로 나온다."
defect_ko: "이 서버는 원격 셸에서 /proc 파일을 8,192바이트로 자르고, 응답에는 잘림 표시 없이 truncated false를 낸다. 정상이라면 잘랐다는 것과 원래 크기를 알리거나 전체를 돌려줘야 한다. 모델은 이 프로세스에 수상한 라이브러리가 올라와 있지 않다고 잘못 안다."
setup_ko: "원격 호스트를 흉내 내고, 아파치 프로세스 4242의 /proc 파일을 커널 형식대로 넣었다. maps(339줄) 끝쪽, ld-linux 바로 아래에 /etc/ld.so.preload로 올라온 루트킷 라이브러리가 있다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
  TRUDI_LIVE_HOSTS_CONFIG: ${DB_DIR}/live_hosts.json
  PATH: ${STUBS}:${PATH}
stubs:
  - name: ssh
    text: |
      #!/bin/sh
      # Stand-in for ssh to the registered live host: skip the options and
      # user@host up to "--", then run the remote command line (already
      # shell-quoted by trudi) the way the remote shell would.
      while [ $# -gt 0 ]; do
        if [ "$1" = "--" ]; then shift; break; fi
        shift
      done
      exec sh -c "$*"
  - name: cat
    text: |
      #!/bin/sh
      # The host's /proc/4242 (an apache2 worker): its files, in the kernel's
      # formats, are kept under ${DB_DIR}/host/proc/4242. Anything else is the
      # real cat.
      case "$1" in
        /proc/4242/*) exec /bin/cat "${DB_DIR}/host/proc/4242/${1#/proc/4242/}" ;;
      esac
      exec /bin/cat "$@"
  - name: lsof
    text: |
      #!/bin/sh
      # Stub of `lsof -p 4242 -n -P` (lsof 4.93) on the host: the table is kept
      # in ${DB_DIR}/host/lsof-4242.txt.
      if [ "$1" = "-p" ] && [ "$2" = "4242" ]; then exec /bin/cat "${DB_DIR}/host/lsof-4242.txt"; fi
      exit 1
