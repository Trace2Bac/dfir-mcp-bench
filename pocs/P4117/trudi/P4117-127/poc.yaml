steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 기록을 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: live_process_details
    note_ko: "결함 호출: 아파치 프로세스의 /proc 정보를 읽음"
    args:
      host: web01
      pid: 4242
  - tool: live_open_files
    note_ko: "비교 호출: 같은 프로세스의 열린 파일·매핑을 lsof로 봄"
    args:
      host: web01
      pid: 4242
expect:
  - step: 2
    note_ko: "maps 구역이 실린 성공 응답이다"
    regex: '"success": true[\s\S]*===/proc/4242/maps===\\n55d4c3a00000-55d4c3a15000 r--p'
  - step: 2
    note_ko: "그런데 잘리지 않았다고 한다"
    contains: '"truncated": false'
  - step: 2
    note_ko: "maps는 8,192바이트에서 줄 중간에 끊겨 ld-linux와 [stack]까지 가지 못한다"
    not_regex: 'ld-linux-x86-64|\[stack\]'
  - step: 2
    note_ko: "maps에 루트킷 라이브러리가 없다"
    not_contains: "libsysupdate"
  - step: 3
    note_ko: "같은 프로세스에 /usr/local/lib/libsysupdate.so가 매핑되어 있다"
    regex: 'apache2 4242 root  mem    REG +8,1 +\d+ +\d+ /usr/local/lib/libsysupdate\.so'
