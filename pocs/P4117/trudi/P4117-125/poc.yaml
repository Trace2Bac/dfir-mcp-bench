# Matrix case P4117-125: read_output says `truncated` is set when the
# max_rows/max_chars caps are hit, but on the `where` path (_read_csv) it stops
# at max_rows without adding the "[row cap]" marker that `truncated` is
# computed from, so a filtered read cut at 200 rows answers truncated: false.
# The CSV is EvtxECmd output of a file server's Security log as it lies under
# analysis/ after ez_evtxecmd (EvtxECmd 1.x CSV columns, compact Payload
# JSON): 236 logons (4624) and 59 logoffs (4634) over one day; the RDP logon
# of CORP\Administrator from 203.0.113.7 (logon type 10) is logon no. 223.
case_id: P4117-125
problem: P4117
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "로그온 이벤트가 하루에 수백 건인 서버는 흔하고, EventId로 걸러 몇 개 열만 보는 읽기는 기본 상한(200행) 그대로 쓰기 쉽다."
coverage: full
summary: On an EvtxECmd CSV with 236 logon events, read_output with where EventId=4624 and four columns returns the first 200 logons with truncated false, so the RDP logon of CORP\Administrator from 203.0.113.7 (logon 223) is missing from what reads as every match; a query for that IP on the same filter returns it.
summary_ko: "로그온 이벤트 236건이 든 EvtxECmd CSV에서 `where: EventId=4624`와 열 네 개로 read_output을 부르면 앞 200건만 오면서 `truncated: false`다. 그래서 223번째 로그온인 203.0.113.7의 CORP\\Administrator RDP 로그온이 빠진 결과가 전체 일치처럼 보인다. 같은 조건에 그 IP를 query로 주면 그 행이 나온다."
defect_ko: "이 서버는 where로 거른 읽기가 max_rows(200)에 닿아 멈춰도 `truncated`를 false로 낸다. 정상이라면 상한에 닿았음을 `truncated: true`와 표시로 알려야 한다. 모델은 4624 이벤트가 200건뿐이고 외부 IP의 관리자 RDP 로그온은 없었다고 잘못 안다."
setup_ko: "파일 서버 보안 로그를 EvtxECmd로 해석한 CSV(로그온 236건, 로그오프 59건)를 analysis/에 두었다. 223번째 로그온이 203.0.113.7에서 온 Administrator의 RDP(유형 10) 로그온이다."
