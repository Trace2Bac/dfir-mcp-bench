steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4117-125
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: read_output
    note_ko: "결함 호출: 로그온(4624) 행만 몇 개 열로 읽는다"
    args:
      path: ${DB_DIR}/analysis/evtx/Security.csv
      where: EventId=4624
      columns: TimeCreated,UserName,RemoteHost,PayloadData2
  - tool: read_output
    note_ko: "비교 호출: 같은 조건에서 203.0.113.7이 든 행을 찾는다"
    args:
      path: ${DB_DIR}/analysis/evtx/Security.csv
      where: EventId=4624
      query: 203.0.113.7
      columns: TimeCreated,UserName,RemoteHost,PayloadData2
expect:
  - step: 2
    note_ko: "200번째 로그온(19:29:20)까지 온다"
    contains: "2026-11-03 19:29:20.0000000,CORP\\\\svc_scan"
  - step: 2
    note_ko: "201번째 로그온(19:33:53)부터는 오지 않는다"
    not_contains: "2026-11-03 19:33:53"
  - step: 2
    note_ko: "그런데도 잘리지 않았다고 한다"
    regex: '"truncated": false'
  - step: 3
    note_ko: "같은 조건의 4624에 203.0.113.7의 Administrator RDP(유형 10) 로그온이 있다"
    regex: 'CORP\\\\Administrator,- \(203\.0\.113\.7\),LogonType 10'
