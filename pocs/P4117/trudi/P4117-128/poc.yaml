# Matrix case P4117-128: af_timestomp_drift stops reading the MFTECmd CSV as
# soon as it has max_records (200) drifting records, and reports drift_count,
# total_checked and the suggested finding from that partial read, with no
# sign that it stopped: drift_count is the cap, total_checked is where it
# stopped, and the records after it are never compared.
# The CSV has MFTECmd's own layout (the 0x30 columns are filled only where
# they differ from 0x10, as MFTECmd writes them) for a workstation volume:
# 520 ordinary files, half of them modified after creation (SI modified later
# than FN, which this tool counts as drift), then wuauhelper.exe in
# ProgramData whose SI times were set back to 2019 (SI<FN, zeroed
# sub-seconds), then 40 more files.
case_id: P4117-128
problem: P4117
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "만든 뒤 고친 파일은 SI 수정 시각이 FN과 달라 실제 볼륨에서는 이런 '어긋남'이 수천 건 나오므로, 기본 상한 200에 닿는 것은 거의 늘 일어난다."
coverage: full
summary: On an MFTECmd CSV of 561 records where the timestomped wuauhelper.exe (SI 2019, FN 2026-11-02) comes after 260 ordinary modified files, af_timestomp_drift returns drift_count 200, total_checked 399 and a suggested finding of "200 MFT records" without wuauhelper.exe and without saying it stopped; with max_records 1000 it checks all 561 records and lists wuauhelper.exe.
summary_ko: "레코드 561개 중, SI를 2019년으로 되돌린 wuauhelper.exe(FN은 2026-11-02)가 수정된 일반 파일 260개 뒤에 오는 MFTECmd CSV에서, af_timestomp_drift는 drift_count 200, total_checked 399, \"200 MFT records\" 판정을 내고 wuauhelper.exe는 싣지 않으며 중간에 멈췄다고 말하지 않는다. max_records 1000으로 부르면 561개를 다 보고 wuauhelper.exe를 싣는다."
defect_ko: "이 서버는 어긋난 레코드가 200개가 되면 CSV 읽기를 멈추고, 그때까지의 수를 전체 결과처럼 낸다. 정상이라면 끝까지 읽거나 상한에 닿아 멈췄다는 것과 읽은 범위를 알려야 한다. 모델은 볼륨 전체를 검사했고 시각 조작 파일이 목록에 없다고 잘못 안다."
setup_ko: "워크스테이션 볼륨의 MFTECmd CSV를 analysis/에 두었다. 일반 파일 520개(절반은 만든 뒤 수정됨) 뒤에 SI 시각을 2019년으로 되돌린 wuauhelper.exe가 있다."
