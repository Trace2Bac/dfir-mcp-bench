steps:
  - tool: af_timestomp_drift
    note_ko: "결함 호출: 기본값으로 시각 조작을 찾는다"
    args:
      mft_csv_path: "${DB_DIR}/analysis/mft/20261103091522_MFTECmd_$MFT_Output.csv"
  - tool: af_timestomp_drift
    note_ko: "비교 호출: 상한을 1000으로 올려 다시 찾는다"
    args:
      mft_csv_path: "${DB_DIR}/analysis/mft/20261103091522_MFTECmd_$MFT_Output.csv"
      max_records: 1000
expect:
  - step: 1
    note_ko: "어긋난 레코드 수가 상한 그대로 200이다"
    regex: '"drift_count": 200\b'
  - step: 1
    note_ko: "561개 중 399개만 보고 멈췄다"
    regex: '"total_checked": 399\b'
  - step: 1
    note_ko: "판정 문장도 200건으로 쓴다"
    contains: "Timestomp evidence: 200 MFT records"
  - step: 1
    note_ko: "멈췄다는 표시 없이 성공 응답이다"
    not_regex: '"(truncated|capped|complete|limit_reached)"'
  - step: 2
    note_ko: "끝까지 보면 561개를 검사하고 wuauhelper.exe(SI 2019, FN 2026-11-02)가 나온다"
    regex: '"total_checked": 561[\s\S]*wuauhelper\.exe", "si_ts": "2019-03-19T04:43:05", "fn_ts": "2026-11-02T23:41:07'
