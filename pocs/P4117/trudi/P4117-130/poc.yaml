# Matrix case P4117-130: net_http_session_inventory keeps every request path
# of a session while parsing, then returns only the first 50
# (request_paths[:50]) with no count and no mark that the list was cut.
# (The same case also names misc_parse_scheduled_tasks' 8,192-character cut
# of each task XML; that part is not run here.)
# The capture is a real pcap (libpcap, Ethernet, built for this PoC): one
# keep-alive HTTP session from workstation 10.0.2.42 to the intranet
# SharePoint (10.0.5.20:80), 61 GET requests with distinct paths; the last
# three open the payroll report library and download two payroll workbooks.
# trudi runs tcpdump as `sudo tcpdump ...` (SIFT has passwordless sudo); the
# image has no sudo, so ${STUBS}/sudo only runs the command it is given.
# tcpdump itself is the real one.
case_id: P4117-130
problem: P4117
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "브라우저는 페이지 하나에도 스크립트·그림 등 수십 개 경로를 요청하므로 한 세션의 요청 경로가 50개를 넘는 것은 흔하다."
coverage: "partial: only net_http_session_inventory's request_paths cut is run; misc_parse_scheduled_tasks' 8,192-character cut of task XML is not"
coverage_ko: "net_http_session_inventory의 요청 경로 자르기만 확인했고, misc_parse_scheduled_tasks의 작업 XML 8,192자 자르기는 돌리지 않았다"
summary: On a pcap of one intranet HTTP session with 61 distinct GET paths, the last three opening the payroll library and downloading two payroll workbooks, net_http_session_inventory returns the session with exactly the first 50 paths, none of the payroll ones, and no count or mark; tcpdump_read on the same pcap shows all 61 requests.
summary_ko: "서로 다른 GET 경로 61개가 든 사내 HTTP 세션 하나(마지막 셋은 급여 보고서 폴더를 열고 급여 파일 두 개를 내려받음)의 pcap에서, net_http_session_inventory는 앞 50개 경로만 담은 세션을 돌려주고 급여 경로는 하나도 없으며 개수나 잘림 표시도 없다. 같은 pcap을 tcpdump_read로 보면 요청 61개가 모두 나온다."
defect_ko: "이 서버는 세션의 요청 경로를 앞 50개로 자르면서 전체 개수나 잘림을 알리지 않는다. 정상이라면 경로를 모두 싣거나 전체 개수와 잘렸음을 함께 실어야 한다. 모델은 이 세션이 급여 자료에 접근하지 않았다고 잘못 안다."
setup_ko: "워크스테이션 10.0.2.42가 사내 SharePoint(10.0.5.20:80)에 붙은 HTTP 세션 하나(경로 61개)를 담은 pcap을 넣었다. 마지막 세 요청이 급여 보고서 폴더 열기와 급여 파일 두 개 내려받기다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
  PATH: ${STUBS}:${PATH}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: net/ws0142_intranet.pcap
    hex: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4117-130
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: net_http_session_inventory
    note_ko: "결함 호출: pcap의 HTTP 세션 목록"
    args:
      pcap_file: ${EVIDENCE}/net/ws0142_intranet.pcap
  - tool: net_tcpdump_read
    note_ko: "비교 호출: 같은 pcap에서 워크스테이션이 보낸 패킷을 모두 본다"
    args:
      pcap_file: ${EVIDENCE}/net/ws0142_intranet.pcap
      filter_expr: src host 10.0.2.42
      count: 0
expect:
  - step: 2
    note_ko: "intranet 세션의 경로 목록은 첫 요청부터 실린다"
    regex: '"host": "intranet\.corp\.example\.com", "user_agent": "[^"]*", "cookies": \{[^}]*\}, "set_cookies": \{\}, "url_params": \{\}, "auth_headers": \[\], "request_paths": \["/", "/portal/home\.aspx"'
  - step: 2
    note_ko: "세션의 경로 목록에는 정확히 50개가 있다"
    regex: '"request_paths": \[(?:"[^"]*", ){49}"[^"]*"\]'
  - step: 2
    note_ko: "급여 경로는 세션 목록에 없다"
    not_contains: "/hr/payroll/"
  - step: 3
    note_ko: "같은 세션이 급여 파일 두 개를 내려받았다"
    regex: 'GET /hr/payroll/_layouts/15/download\.aspx\?SourceUrl=/hr/payroll/Reports/2026-10_salaries_all_staff\.xlsx[\s\S]*GET /hr/payroll/_layouts/15/download\.aspx\?SourceUrl=/hr/payroll/Reports/2026-10_bank_details\.xlsx'
