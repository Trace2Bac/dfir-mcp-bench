# Matrix case P4117-126: read_mail stops reading the store after scan_cap
# (5,000) messages (core/mail_roster.iter_store) and says nothing about it:
# match_count counts only what it read, and the response carries no warning
# that the store has more messages. messages_scanned is 5000, which reads as
# the size of the mailbox.
# The store is a mailbox exported with `readpst -e` (one .eml per message, a
# folder per Outlook folder) under exports/mail: 5,200 helpdesk notifications
# in Inbox and 3 messages in Sent Items, one of them j.doe sending a zip of
# customer data to an outside address. Files are read in sorted path order,
# so Inbox fills the cap and Sent Items is never read.
case_id: P4117-126
problem: P4117
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "알림 메일이 쌓여 메시지가 5,000통을 넘는 업무 메일함은 흔하고, 내보낸 메일함 전체에서 외부 수신자를 찾는 것은 유출 조사의 기본이다."
coverage: full
summary: On a readpst -e export with 5,200 Inbox notifications and a Sent Items message from j.doe to an outside address with a customer-data zip, read_mail over the whole store for that address returns success with messages_scanned 5000, match_count 0 and no warning, while read_mail on the Sent Items folder alone finds the message.
summary_ko: "Inbox 알림 5,200통과, j.doe가 고객 자료 zip을 외부 주소로 보낸 Sent Items 메일이 든 readpst -e 내보내기에서, 메일함 전체에 그 주소로 read_mail을 부르면 messages_scanned 5000, match_count 0, 경고 없음의 성공 응답이 온다. Sent Items 폴더만 주면 그 메일이 나온다."
defect_ko: "이 서버는 메일 5,000통에서 읽기를 멈추고, 그 뒤를 읽지 않았다는 것을 알리지 않는다. 정상이라면 상한에 닿았음과 읽지 않은 범위를 알리거나 끝까지 읽어야 한다. 모델은 메일함에 외부로 보낸 메일이 없다고 잘못 안다."
setup_ko: "readpst -e로 내보낸 메일함(Inbox 알림 5,200통, Sent Items 3통)을 exports/mail에 두었다. Sent Items의 한 통이 고객 자료 zip을 외부 주소로 보낸 메일이다."
fixture:
  # trudi does not create the trace folder; an empty analysis/ is made for it.
  - path: analysis/.keep
    root: db
    text: ""
  - path: "exports/mail/j.doe/Inbox/{i}.eml"
    root: db
    repeat: 5200
    text: "From: ServiceDesk <servicedesk@corp.example.com>\r\nTo: j.doe@corp.example.com\r\nSubject: [SD-{i}] Ticket updated: VPN client prompts for re-authentication\r\nDate: Mon, 02 Nov 2026 08:14:00 +0000\r\nMessage-ID: <sd-{i}@servicedesk.corp.example.com>\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nTicket SD-{i} was updated by the service desk.\r\nStatus: In progress\r\n\r\nReply above this line to add a comment.\r\n"
  - path: "exports/mail/j.doe/Sent Items/1.eml"
    root: db
    text: "From: John Doe <j.doe@corp.example.com>\r\nTo: Martin Lee <m.lee@corp.example.com>\r\nSubject: RE: Q3 review slides\r\nDate: Thu, 05 Nov 2026 10:02:11 +0000\r\nMessage-ID: <a81c@corp.example.com>\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nThanks, I will add the regional numbers tomorrow.\r\n"
  - path: "exports/mail/j.doe/Sent Items/2.eml"
    root: db
    text: "From: John Doe <j.doe@corp.example.com>\r\nTo: jdoe.home@mail.example.net\r\nSubject: docs\r\nDate: Fri, 06 Nov 2026 22:47:35 +0000\r\nMessage-ID: <c55e@corp.example.com>\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary=\"b1\"\r\n\r\n--b1\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nfor the weekend\r\n--b1\r\nContent-Type: application/zip; name=\"Q3_customers.zip\"\r\nContent-Disposition: attachment; filename=\"Q3_customers.zip\"\r\nContent-Transfer-Encoding: base64\r\n\r\nUEsFBgAAAAAAAAAAAAAAAAAAAAAAAA==\r\n--b1--\r\n"
  - path: "exports/mail/j.doe/Sent Items/3.eml"
    root: db
    text: "From: John Doe <j.doe@corp.example.com>\r\nTo: ServiceDesk <servicedesk@corp.example.com>\r\nSubject: RE: [SD-4410] Ticket updated: VPN client prompts for re-authentication\r\nDate: Mon, 09 Nov 2026 07:58:02 +0000\r\nMessage-ID: <d02f@corp.example.com>\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nStill happening after the update.\r\n"
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4117-126
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: read_mail
    note_ko: "결함 호출: 메일함 전체에서 외부 주소가 받는 사람인 메일을 찾는다"
    args:
      mail_path: ${DB_DIR}/exports/mail/j.doe
      query: mail.example.net
      field: recipient
    timeout_s: 300
  - tool: read_mail
    note_ko: "비교 호출: Sent Items 폴더만 같은 조건으로 찾는다"
    args:
      mail_path: ${DB_DIR}/exports/mail/j.doe/Sent Items
      query: mail.example.net
      field: recipient
expect:
  - step: 2
    note_ko: "메일함 전체 검색은 5,000통만 읽는다"
    regex: '"messages_scanned": 5000\b'
  - step: 2
    note_ko: "일치 0건을 성공으로 돌려준다"
    regex: '"messages": \[\], "match_count": 0'
  - step: 2
    note_ko: "읽지 않은 메일이 있다는 경고가 없다"
    not_contains: '"warning"'
  - step: 3
    note_ko: "Sent Items에는 고객 자료 zip을 외부 주소로 보낸 메일이 있다"
    regex: '"to": "jdoe\.home@mail\.example\.net", "cc": "", "subject": "docs"'
