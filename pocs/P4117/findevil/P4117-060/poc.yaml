# find_persistence and verify_finding) only decodes the first 10 base64-like
# blobs in a file. A payload in the 11th blob is never decoded, and nothing
# says the rest of the file was skipped.
# Blobs 1-10 decode to harmless text. Both files also match "obfuscated
# execution" directly ("base64 -d"); the difference is the decoded download.
