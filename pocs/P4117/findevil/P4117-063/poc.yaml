# Matrix case P4117-063: build_timeline stops collecting filesystem mtime
# events after 500 files, in rglob order (not time order), and neither the
# Events count nor the table says that the cap was hit.
# 600 files are written; with a window that covers all of them and
# max_events 1000 the timeline should hold 600 filesystem events.
case_id: P4117-063
problem: P4117
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "조사 구간 안에 수정된 파일이 500개를 넘는 것은 흔하다."
coverage: full
summary: With 600 files modified inside the window and max_events 1000, build_timeline reports "Events 500" and lists 500 filesystem events, with no note that it stopped at 500 files.
summary_ko: "구간 안에서 수정된 파일이 600개이고 `max_events`가 1000이다. `build_timeline`은 \"Events 500\"을 내고 파일 시스템 이벤트 500개를 나열하며, 500개에서 멈췄다는 말은 없다."
defect_ko: "이 서버는 파일 시스템 사건을 시간순이 아닌 순회 순서로 모으다 500개에서 말없이 멈춘다. 요청한 `max_events`까지 싣거나 멈췄다고 밝혀야 한다. 모델은 구간 안의 변경이 500개뿐이라고 잘못 안다."
setup_ko: "파일 600개를 만들고, 모두 들어가는 구간과 `max_events` 1000으로 타임라인을 요청했다."
fixture:
  - {path: "case/fs/srv/cache/f{i}", text: "x", repeat: 600}
steps:
  - tool: build_timeline
    note_ko: "결함 호출: 넓은 구간으로 타임라인 생성"
    args:
      evidence_root: ${EVIDENCE}/case
      since_iso: "2000-01-01T00:00:00Z"
      until_iso: "2100-01-01T00:00:00Z"
      max_events: 1000
expect:
  - step: 1
    note_ko: "사건이 500개로 나온다"
    contains: "- **Events:** 500"
  - step: 1
    note_ko: "500개에서 멈췄다는 말이 없다"
    not_regex: "(?i)truncat|more events|\\bcap\\b|limit|first 500|stopped"
