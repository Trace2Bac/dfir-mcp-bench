# Matrix case P4117-004: analyze_container_artifacts looks for docker-compose
# files under the whole root, find_persistence only under etc/opt/srv/home/root,
# and neither response states its search scope.
case_id: P4117-004
problem: P4117
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: possible
realism_ko: "앱 폴더(`/var/www/app`)에 docker-compose 파일을 두는 일은 흔하지만, `find_persistence`가 이를 다뤄야 하는지는 해석이 갈린다."
coverage: full
summary: A privileged docker-compose.yml under var/www/app is reported as a high finding by analyze_container_artifacts, while find_persistence on the same root says nothing about it and does not state that it only searched etc, opt, srv, home and root.
summary_ko: "`var/www/app` 아래의 privileged docker-compose.yml을 `analyze_container_artifacts`는 high로 보고한다. 같은 루트에서 `find_persistence`는 아무 말이 없고, etc, opt, srv, home, root만 찾았다는 것도 밝히지 않는다."
defect_ko: "`find_persistence`는 몇 폴더만 보면서 검사 범위를 알리지 않는다. 같은 파일을 찾거나 범위를 밝혀야 한다. `find_persistence`만 부른 모델은 privileged 컨테이너 설정이 없다고 잘못 안다."
setup_ko: "`privileged: true`가 든 docker-compose.yml을 `var/www/app` 아래에 넣었다."
fixture:
  - path: fs/var/www/app/docker-compose.yml
    text: |
      services:
        web:
          image: nginx:1.25
          privileged: true
steps:
  - tool: analyze_container_artifacts
    note_ko: "비교 호출: 컨테이너 분석은 파일을 찾음"
    args:
      root_path: ${EVIDENCE}/fs
  - tool: find_persistence
    note_ko: "결함 호출: 지속성 검사"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "컨테이너 분석이 이 파일을 high로 보고한다"
    contains: "var/www/app/docker-compose.yml` — docker-compose file exposes the host"
  - step: 2
    note_ko: "지속성 검사에는 docker-compose가 나오지 않는다"
    not_contains: "docker-compose"
  - step: 2
    note_ko: "지속성 검사가 검사 범위를 밝히지 않는다"
    not_regex: "(?i)only (searched|scanned)|search(ed)? scope|not searched|var/www"
