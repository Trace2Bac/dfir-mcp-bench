# Matrix case P4117-062: assess_coverage builds its
# evidence inventory with EVIDENCE_DIR.rglob("*") and stops after 200,000
# paths, without saying so. The evidence has a case/var/log/auth.log; in the
# "big" run there are also 200,001 extracted files directly under the
# evidence root, which rglob yields before descending into case/, so the
# inventory stops before auth.log and the tool says COVERAGE CLEAN. The
# "small" run (no extra files) reports auth.log as never examined.
case_id: P4117-062
problem: P4117
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "전체 파일 시스템을 풀어 놓은 증거는 경로가 20만 개를 넘는 일이 흔하지만, 검사 대상이 그 뒤에 나와야 결함이 드러난다."
coverage: full
summary: When the evidence directory has more than 200,000 paths, assess_coverage stops its inventory without saying so, so an unexamined auth.log is not listed and the verdict is COVERAGE CLEAN, while the same evidence without the extra files reports the auth.log gap.
summary_ko: "증거 폴더의 경로가 200,000개를 넘으면 `assess_coverage`가 말없이 목록 작성을 멈춘다. 그래서 검사하지 않은 `auth.log`가 빠지고 COVERAGE CLEAN이 나온다. 추가 파일이 없는 같은 증거에서는 `auth.log` 공백을 보고한다."
defect_ko: "이 서버는 증거 목록을 20만 개에서 말없이 멈춘다. 끝까지 만들거나 멈췄다고 밝혀야 한다. 모델은 읽지 않은 `auth.log`가 있는데도 검사 범위가 깨끗하다고 잘못 안다."
setup_ko: "auth.log 하나를 두고, 비교 조건에서는 증거 루트에 빈 파일 200,001개를 더 넣었다."
fixture:
  - path: case/var/log/auth.log
    text: "Mar  1 10:00:01 web01 sshd[1201]: Failed password for root from 203.0.113.7 port 51122 ssh2\n"
conditions:
  - name: small
  - name: big
    fixture:
      - path: f{i}.bin
        text: ""
        repeat: 200001
steps:
  - tool: assess_coverage
    note_ko: "결함 호출: 검사 범위 평가"
    timeout_s: 600
expect:
  - step: 1
    note_ko: "파일이 적으면 auth.log가 목록에 나온다"
    condition: small
    contains: "auth.log"
  - step: 1
    note_ko: "파일이 적으면 공백이 남았다고 판정한다"
    condition: small
    contains: "GAP(S) REMAIN"
  - step: 1
    note_ko: "파일이 많으면 auth.log가 목록에서 빠진다"
    condition: big
    not_contains: "auth.log"
  - step: 1
    note_ko: "파일이 많으면 `COVERAGE CLEAN` 판정이 나온다"
    condition: big
    contains: "**Verdict: COVERAGE CLEAN**"
  - step: 1
    note_ko: "목록을 중간에 멈췄다는 말이 없다"
    condition: big
    not_regex: "(?i)200[,_]?000|truncat|partial|stopped|not all"
