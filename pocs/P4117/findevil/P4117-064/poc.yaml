# Matrix case P4117-064: verify_package_integrity hashes
# each package file with _md5_of, which stops at 1 GiB. The fixture is an
# unmodified package file of 1 GiB + 4096 bytes (sparse, all zero bytes) whose
# dpkg md5sums entry is the MD5 of the whole file. The tool compares the MD5
# of the first 1 GiB only and lists the file as Modified, with no note that
# only part of it was hashed.
#   MD5(1 GiB + 4096 zero bytes) = e05e5bb07c97fc74d0bd6bb64948bdf3 (recorded)
#   MD5(first 1 GiB of zeros)    = cd573cfaace07e7949bc0c46028904ff (what the tool computes)
case_id: P4117-064
problem: P4117
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
coverage: full
summary: For an unmodified package file larger than 1 GiB, verify_package_integrity hashes only the first 1 GiB, so the MD5 differs from the dpkg record and the file is listed as Modified with no note that it was partly hashed.
fixture:
  - path: rootfs/var/lib/dpkg/info/big-model-data.md5sums
    text: "e05e5bb07c97fc74d0bd6bb64948bdf3  usr/share/big-model-data/model.bin\n"
  - path: rootfs/usr/share/big-model-data/model.bin
    size: 1073745920
steps:
  - tool: verify_package_integrity
    args:
      root_path: ${EVIDENCE}/rootfs
    timeout_s: 300
expect:
  - step: 1
    contains: "**Modified files:** 1"
  - step: 1
    contains: "`e05e5bb07c97fc74d0bd6bb64948bdf3` | `cd573cfaace07e7949bc0c46028904ff`"
  - step: 1
    not_regex: "(?i)1 GiB|partial|first .*bytes|truncat"
