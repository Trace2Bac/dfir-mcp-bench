# Matrix case P4117-074: index_app_files drops a matched file larger than
# max_file_size_kb (512 KB by default) in _extract_and_read_file and counts
# it in files_skipped_binary, the same counter as binary files
# (app_files.py), so a skipped large text log is reported as binary and the
# size limit is never mentioned.
#
# Evidence: a 12 MiB NTFS volume made in this image with mkntfs and ntfs-3g
# (mounted with --privileged only while building), acquired with ewfacquire
# (EnCase 6, deflate). Program Files/TeamViewer holds two placeholder
# executables, TeamViewer.exe.config (not a default extension), Connections_incoming.txt and
# TeamViewer15_Logfile.log, a 526,330-byte text log (written by a script in
# the TeamViewer log line layout: 18 days of keep-alive lines, then on
# 2026-11-07 an incoming session from partner 1482905117, source IP
# 185.220.101.47, and an upload of finance_q3.zip).
#   raw volume sha256 a5b04a9b3e62714face8c7c158cb808fcf01ce76057d79a7dae493530ae373f5
case_id: P4117-074
problem: P4117
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "TeamViewer·AnyDesk 같은 원격 접속 프로그램의 로그는 몇 주만 지나도 수백 KB~수 MB가 되고, 침입 조사에서 가장 먼저 보는 파일이다."
coverage: full
summary: >-
  For Program Files/TeamViewer, index_app_files reports files_extracted 1 and
  files_skipped_binary 1 with no mention of a size limit; the skipped file
  is the 526 KB text log TeamViewer15_Logfile.log, which the same call
  indexes as text when max_file_size_kb is 2048.
summary_ko: "`Program Files/TeamViewer`에 `index_app_files`를 부르면 크기 상한 이야기 없이 `files_extracted: 1`, `files_skipped_binary: 1`을 낸다. 건너뛴 파일은 526 KB짜리 텍스트 로그 `TeamViewer15_Logfile.log`이고, `max_file_size_kb` 2048로 부르면 같은 호출이 이 로그를 텍스트로 적재한다."
defect_ko: "이 서버는 `max_file_size_kb`를 넘어 건너뛴 파일을 바이너리로 건너뛴 수에 섞어 세고, 크기 때문에 빠진 파일이 있다는 것을 알리지 않는다. 정상이라면 크기로 건너뛴 파일의 수와 이름을 따로 밝혀야 한다. 모델은 빠진 파일을 바이너리라고 보고, 텍스트 로그를 읽지 않은 채 조사를 마친다."
setup_ko: "`Program Files/TeamViewer`에 실행 파일 두 개, 설정 파일, `Connections_incoming.txt`, 526 KB짜리 텍스트 로그 `TeamViewer15_Logfile.log`(11월 7일 외부 원격 세션과 파일 업로드 기록 포함)가 있는 NTFS 볼륨(E01)을 두었다."
