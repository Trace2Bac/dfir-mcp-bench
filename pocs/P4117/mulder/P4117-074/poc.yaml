steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: ws0412-teamviewer
  - tool: run_fls
    note_ko: "파일 목록 적재"
    args:
      image_path: ${EVIDENCE}/ws0412-c.E01
  - tool: index_app_files
    note_ko: "결함 호출: TeamViewer 폴더의 텍스트 파일 적재(기본 크기 상한)"
    args:
      case_id: ws0412-teamviewer
      image_path: ${EVIDENCE}/ws0412-c.E01
      directory_pattern: Program Files/TeamViewer
  - tool: list_sources
    note_ko: "비교 호출: 적재된 source 목록"
  - tool: index_app_files
    note_ko: "비교 호출: 크기 상한을 2 MB로 올려 다시 적재"
    args:
      case_id: ws0412-teamviewer
      image_path: ${EVIDENCE}/ws0412-c.E01
      directory_pattern: Program Files/TeamViewer
      max_file_size_kb: 2048
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 로그의 첫 window 읽기"
    args:
      source_name: appfiles.program_files.teamviewer.teamviewer15_logfile.log
      limit: 1
expect:
  - step: 3
    note_ko: "텍스트 파일 2개 중 1개를 바이너리로 건너뛰었다고 적는다"
    regex: '"files_discovered": 2,[\s\S]*"files_extracted": 1,[\s\S]*"files_skipped_binary": 1,'
  - step: 3
    note_ko: "적재된 것은 Connections_incoming.txt뿐이다"
    regex: '"sample_files": \[\s*"Program Files/TeamViewer/Connections_incoming\.txt"\s*\]'
  - step: 3
    note_ko: "크기 상한 때문에 건너뛰었다는 표시가 없다"
    not_regex: '(?i)too large|size limit|max_file_size|skipped_size|larger than'
  - step: 4
    note_ko: "로그는 적재되지 않았다"
    not_contains: 'teamviewer15_logfile'
  - step: 5
    note_ko: "크기 상한을 올리면 건너뛴 파일이 텍스트 로그로 적재된다"
    regex: '"files_skipped_binary": 0,[\s\S]*"Program Files/TeamViewer/TeamViewer15_Logfile\.log"'
  - step: 6
    note_ko: "건너뛴 파일은 바이너리가 아니라 TeamViewer 텍스트 로그다"
    regex: '=== Program Files/TeamViewer/TeamViewer15_Logfile\.log ===\\nStart Logging \(Version 15\.59\.3'

