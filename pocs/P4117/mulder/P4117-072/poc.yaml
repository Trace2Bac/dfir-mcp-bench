steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: ws0307-deleted
  - tool: run_fls
    note_ko: "파일 목록 적재"
    args:
      image_path: ${EVIDENCE}/ws0307-c.E01
  - tool: get_deleted_files
    note_ko: "결함 호출: 지워진 파일 요약"
  - tool: search
    note_ko: "비교 호출: 파일 목록에서 rclone 찾기"
    args:
      query: rclone
      source: tsk.filelist
  - tool: get_raw_output
    note_ko: "비교 호출: rclone이 든 마지막 window(64)의 원문"
    args:
      source_name: tsk.filelist
      after_id: 63
      limit: 1
expect:
  - step: 3
    note_ko: "지워진 항목이 든 window가 50개보다 많다"
    regex: '"total_windows": (5[1-9]|[6-9]\d|\d{3,}),'
  - step: 3
    note_ko: "상위 디렉터리 분포에 Users만 있다"
    regex: '"top_directories": \[\s*\{\s*"name": "Users",\s*"entries": \d+\s*\}\s*\]'
  - step: 4
    note_ko: "rclone은 마지막 window 64에 있다"
    contains: '"window_id": 64,'
  - step: 5
    note_ko: "파일 목록에는 지워진 Windows/Temp/rclone.exe가 있다"
    regex: '\* \d+-128-\d+:\\tWindows/Temp/rclone\.exe'
