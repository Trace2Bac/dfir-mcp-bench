# Matrix case P4117-072: list_files and get_deleted_files count
# top_directories from the first 50 tsk.filelist windows only (tsk.py
# "for w in deleted[:50]"), while approx_deleted_count covers all of them;
# the response does not say that top_directories is a sample.
#
# Evidence: a 24 MiB NTFS volume made in this image with mkntfs and ntfs-3g
# (mounted with --privileged only while building), acquired with ewfacquire
# (EnCase 6, deflate). alice's IE/Edge INetCache held 2,400 cached files
# (names like logo_8f3a...[1].png in four random 8-character folders) that
# were then deleted, as Disk Cleanup does; after that, the intruder's
# staging files in Windows\Temp (rclone.exe, rclone.conf,
# files_2026-11.7z, cleanup.ps1) were created and deleted. fls lists the
# cache entries under Users/ and the four staging files last, under
# Windows/Temp, in the last window of the listing.
#   raw volume sha256 f24b20874264223fa77ef84f2697268323db29f402b9216caa4a47f0745ba0d8
case_id: P4117-072
problem: P4117
server: mulder
