realism: common
realism_ko: "브라우저 캐시 정리로 지워진 파일 수천 개가 사용자 폴더에 남는 것은 흔하고, 침입자가 `Windows\\Temp`의 도구를 지우는 것도 흔한 흔적 지우기다. 파일 목록은 경로 이름순이라 `Windows/`가 `Users/` 뒤에 온다."
coverage: "partial: get_deleted_files is shown; list_files builds top_directories the same way"
coverage_ko: "`get_deleted_files`만 보인다. `list_files`도 같은 방식으로 앞 50 window에서 `top_directories`를 만든다."
summary: >-
  On a volume with about 2,300 deleted browser-cache entries under Users/ and
  four deleted staging files under Windows/Temp (rclone.exe and others),
  get_deleted_files reports top_directories with Users only, built from the
  first 50 windows, next to an approx_deleted_count for all windows; search
  finds the deleted Windows/Temp/rclone.exe in tsk.filelist.
summary_ko: "`Users/` 아래 지워진 브라우저 캐시 약 2,300개와 `Windows/Temp` 아래 지워진 반출 도구 4개(`rclone.exe` 등)가 있는 볼륨에서, `get_deleted_files`는 앞 50 window로만 센 `top_directories`에 `Users` 하나만 내고, `approx_deleted_count`는 전체 window로 센다. `search`로는 지워진 `Windows/Temp/rclone.exe`가 `tsk.filelist`에 있다."
defect_ko: "이 서버는 지워진 파일의 상위 디렉터리 분포를 앞 50 window에서만 세면서, 표본이라는 표시 없이 전체 건수와 함께 낸다. 정상이라면 모든 window로 세거나, 몇 window로 센 값인지 밝혀야 한다. 모델은 지워진 파일이 모두 `Users` 아래(브라우저 캐시)에 있다고 잘못 알고 `Windows\\Temp`의 지워진 도구를 놓친다."
setup_ko: "사용자 alice의 INetCache에서 지운 캐시 파일 2,400개와, 그 뒤에 침입자가 `Windows\\Temp`에서 지운 `rclone.exe`·`rclone.conf`·`files_2026-11.7z`·`cleanup.ps1`이 있는 NTFS 볼륨(E01)을 두었다."
