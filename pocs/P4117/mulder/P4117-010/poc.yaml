display: multi-call
level: mcp
realism: common
realism_ko: "공격 도구를 심은 뒤 `$SI` 시각을 시스템 파일과 같게 되돌리는 timestomping은 흔한 안티포렌식이고, 실제 볼륨의 MFT는 행이 수만 개라 거의 모든 파일이 첫 window 밖에 있다."
coverage: full
summary: >-
  On an NTFS volume where wuauhelper.exe (MFT entry 194) has its $SI times set
  back to 2019 while $FN keeps 2026, run_mft_parser indexes the MFTECmd CSV
  (whose SI<FN column is True for that row), yet detect_timestomping returns
  "No timestomping indicators found in N MFT windows" with
  total_mft_windows_analyzed N, because only the first window, the one with
  the CSV header, was actually compared.
summary_ko: "`wuauhelper.exe`(MFT 항목 194)의 `$SI` 시각을 2019년으로 되돌리고 `$FN`은 2026년 그대로인 NTFS 볼륨에서, `run_mft_parser`가 적재한 MFTECmd CSV는 그 행의 `SI<FN` 열이 True인데도 `detect_timestomping`은 `No timestomping indicators found in N MFT windows`와 `total_mft_windows_analyzed: N`을 낸다. 실제로 비교한 것은 CSV 머리줄이 있는 첫 window뿐이다."
defect_ko: "이 서버는 window마다 첫 줄을 CSV 머리줄로 읽어, 머리줄이 없는 두 번째 window부터는 모두 건너뛰고도 전체 window를 분석했다고 적는다. 정상이라면 첫 window의 머리줄로 모든 행을 비교하거나, 실제로 비교한 행 수를 밝혀야 한다. 모델은 MFT 전체에 timestomping 흔적이 없다고 잘못 안다."
setup_ko: "작은 Windows식 파일 트리가 든 NTFS 볼륨(E01)을 두었다. 마지막에 만든 `ProgramData\\Microsoft\\Crypto\\wuauhelper.exe`는 MFT 레코드의 `$SI` 시각만 2019-03-19로 바꿨다(timestomping). `$FN` 생성 시각은 실제 생성 시각 그대로다."
