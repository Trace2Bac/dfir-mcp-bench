steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: ws0142-timestomp
  - tool: run_mft_parser
    note_ko: "MFTECmd로 $MFT 적재"
    args:
      image_path: ${EVIDENCE}/ws0142-c.E01
  - tool: detect_timestomping
    note_ko: "결함 호출: MFT 전체에서 timestomping 찾기"
  - tool: search
    note_ko: "비교 호출: 적재된 MFT에서 wuauhelper.exe가 든 window 찾기(마지막 window 13)"
    args:
      query: wuauhelper
      source: ez.mft
  - tool: get_raw_output
    note_ko: "비교 호출: 그 window(13)의 원문"
    args:
      source_name: ez.mft
      after_id: 12
      limit: 1
expect:
  - step: 3
    note_ko: "아무 것도 찾지 못했다고 답한다"
    contains: '"status": "no_results"'
  - step: 3
    note_ko: "window 여러 개를 모두 분석했다고 적는다"
    regex: 'No timestomping indicators found in ([2-9]|\d\d+) MFT windows'
  - step: 4
    note_ko: "wuauhelper.exe 행은 머리줄이 없는 마지막 window 13에 있다"
    regex: '"window_id": 13,[\s\S]*"line_start": 148'
  - step: 5
    note_ko: "적재된 MFT 행에는 $SI 생성 2019-03-19, $FN 생성 2026-11-28, MFTECmd의 SI<FN=True가 있다"
    regex: 'wuauhelper\.exe,\.exe,4096,1,,False,False,False,True,[^,]*,[^,]*,[^,]*,[^,]*,2019-03-19 04:52:11\.0000000,2026-11-28'
