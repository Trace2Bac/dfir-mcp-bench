# Matrix case P4117-010: detect_timestomping reads the first line of every
# ez.mft window as the CSV header (artifacts.py
# _analyze_mft_windows_for_timestomping). MFTECmd writes one CSV with one
# header line and extract_and_index splits it into ~4 KB windows, so every
# window after the first has no SI/FN columns and is skipped. The response
# still says "No timestomping indicators found in N MFT windows" and
# total_mft_windows_analyzed: N.
#
# Evidence: a 16 MiB NTFS volume made in this image with mkntfs and ntfs-3g
# (mounted with --privileged only while building), acquired with ewfacquire
# (EnCase 6, deflate). It holds a small Windows-like tree (System32 DLLs,
# drivers, 7-Zip, alice's documents, downloads, temp files, Recent links;
# file contents are placeholders) and, written last (MFT entry 194),
# ProgramData/Microsoft/Crypto/wuauhelper.exe. Its $STANDARD_INFORMATION
# times were then set to 2019-03-19 04:52:11 by writing the four FILETIMEs
# of the SI attribute in its MFT record, as SetMACE-style timestomping does;
# $FILE_NAME keeps the real creation time (2026-11-28). MFTECmd's own SI<FN
# column is True for that row (row 150 of 150).
#   raw volume sha256 ca650df5c4a98171ca87ec9dd226c3cb0992c969f5c1b52f6bf15954e8ab12d0
case_id: P4117-010
problem: P4117
server: mulder
variant: mulder-3164843
