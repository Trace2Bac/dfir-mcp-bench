realism: common
realism_ko: "사용자 PC의 메일함에는 메일이 수천 통 있어 bulk_extractor의 email 결과가 window 200개를 쉽게 넘고, 가장 최근에 받은 피싱 메일은 mbox의 끝에 있다."
coverage: "partial: bulk.email is shown; bulk.url and bulk.domain are cut the same way"
coverage_ko: "`bulk.email`만 보인다. `bulk.url`·`bulk.domain`도 같은 방식으로 앞 200 window만 읽는다."
summary: >-
  After run_bulk_extractor indexes the email feature of a disk with a 1,500
  mail Thunderbird inbox, get_ioc_summary lists the colleagues' addresses
  but not the phishing sender it-helpdesk@northwind-traders-support.example,
  which search finds in bulk.email; only the first 200 windows were read and
  the response does not say so.
summary_ko: "메일 1,500통이 든 Thunderbird 받은편지함 디스크에서 `run_bulk_extractor`로 email 특징을 적재한 뒤, `get_ioc_summary`는 동료 주소들은 내지만 피싱 발신자 `it-helpdesk@northwind-traders-support.example`는 내지 않는다. `search`로는 이 주소가 `bulk.email`에 있다. 앞 200 window만 읽었고 응답은 그 사실을 말하지 않는다."
defect_ko: "이 서버는 `bulk.email`·`bulk.url`·`bulk.domain`에서 앞 200 window만 읽어 IOC를 모으고, 나머지를 건너뛴 것을 알리지 않는다. 정상이라면 전체를 읽거나, 읽은 window 수와 남은 수를 밝혀야 한다. 모델은 이 목록이 디스크의 모든 이메일 IOC라고 잘못 알고 피싱 발신자를 놓친다."
setup_ko: "사용자 alice의 Thunderbird 받은편지함(mbox, 사내 메일 1,500통)이 든 NTFS 디스크 이미지(E01)를 두었다. 가장 최근 메일은 `it-helpdesk@northwind-traders-support.example`가 보낸 피싱 메일이다."
