# Matrix case P4117-069: get_ioc_summary reads only the first 200 windows of
# bulk.email, bulk.url and bulk.domain (review.py _BULK_LIMIT) and does not
# say so; the response has no count of windows read or skipped.
#
# Evidence: an 8 MiB NTFS volume made in this image with mkntfs and ntfs-3g
# (mounted with --privileged only while building), acquired with ewfacquire
# (EnCase 6, deflate). It holds alice's Thunderbird profile; Local
# Folders/Inbox is an mbox (written by a script, the headers Thunderbird
# keeps) of 1,500 internal mails from 40 colleagues at
# northwind-traders.example, January to April 2026, and, last, the newest
# mail: a phishing mail from it-helpdesk@northwind-traders-support.example
# linking to https://login.northwind-traders-support.example/owa/.
# bulk_extractor in this image writes 9,010 lines to email.txt for it; the
# phishing sender's four lines are the last ones, far past window 200.
#   raw volume sha256 d3b44923a61f0514abb425e933d4526aec32312ac03c343aad55d635f8e20c29
case_id: P4117-069
