steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: ws0219-mail
  - tool: run_bulk_extractor
    note_ko: "디스크에서 이메일·URL·도메인 적재"
    args:
      image_path: ${EVIDENCE}/ws0219-c.E01
      scanners: [email]
    timeout_s: 600
  - tool: get_ioc_summary
    note_ko: "결함 호출: IOC 요약"
  - tool: search
    note_ko: "비교 호출: bulk.email에서 피싱 발신자 찾기"
    args:
      query: it-helpdesk
      source: bulk.email
expect:
  - step: 2
    note_ko: "bulk.email이 window 200개를 넘게 적재된다"
    regex: 'bulk\.email\\", \\"windows_indexed\\": (\d{4,}|[2-9]\d\d)'
  - step: 3
    note_ko: "요약에 동료 주소는 있다"
    contains: 'anna.berg@northwind-traders.example'
  - step: 3
    note_ko: "요약의 이메일 목록에 피싱 발신자가 없다"
    not_regex: '"email_addresses": \[[^\]]*it-helpdesk@northwind-traders-support\.example'
  - step: 3
    note_ko: "읽은 범위나 건너뛴 window에 대한 표시가 없다"
    not_regex: '(?i)truncat|limit|first 200|skipped|partial'
  - step: 4
    note_ko: "bulk.email에는 피싱 발신자가 있다"
    contains: 'it-helpdesk@northwind-traders-support.example'
  - step: 4
    note_ko: "그 주소는 bulk.email의 마지막 줄들(9,004~9,010행)에 있다"
    contains: '"line_start": 9004,'
