# Matrix case P4117-070: every run_pcap_analysis mode passes "-c max_packets"
# (10,000 by default) to tshark, so only the first packets of the capture are
# read, and neither the response nor the indexed text says whether the cap
# was reached or how many packets the capture holds. The beaconing text says
# "Destinations analyzed: N, Potential beacons flagged: 0" as if for the
# whole capture.
#
# Evidence: a classic pcap, gzip-compressed as rotated SPAN captures often
# are (tshark and capinfos read it directly), written by a small script
# (Ethernet/IPv4/TCP/UDP with correct checksums). 12,080 packets on
# 2026-11-05: from 08:58:00, 12,000 packets of an nmap -sS style scan by
# 10.0.2.15 (1,000 ports on each of 10.0.2.20-25, SYN and RST/ACK or
# SYN/ACK); from 09:04 to 09:43, the workstation 10.0.2.42 sends a DNS TXT
# query for <random>.<n>.cdn-telemetry.example straight to 198.51.100.53:53
# every 60 s (+-2 s), 40 times, each answered with a TXT record. Packet
# 10,000 is still part of the scan.
case_id: P4117-070
problem: P4117
server: mulder
