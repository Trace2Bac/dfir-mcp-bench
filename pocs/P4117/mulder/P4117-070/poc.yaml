realism: common
realism_ko: "사고 대응에서 받는 캡처는 수만~수백만 패킷이 보통이라 기본 상한 10,000패킷을 쉽게 넘고, 앞부분이 스캔·대용량 전송으로 채워지는 일도 흔하다."
coverage: "partial: the beaconing mode is shown; the other modes pass the same -c cap"
coverage_ko: "beaconing 모드만 보인다. 다른 모드도 같은 `-c` 상한을 쓴다."
summary: >-
  For a 12,080-packet capture whose first 12,000 packets are a port scan,
  run_pcap_analysis mode=beaconing with the default max_packets reports
  "Potential beacons flagged: 0" for the destinations it analyzed, without
  saying that it stopped at packet 10,000; with max_packets 20000 the same
  mode flags 198.51.100.53:53 (a DNS query every 60 s) as a POTENTIAL BEACON.
summary_ko: "앞 12,000패킷이 포트 스캔인 12,080패킷 캡처에 `run_pcap_analysis` beaconing 모드를 기본 `max_packets`로 부르면, 10,000번째 패킷에서 멈췄다는 말 없이 `Potential beacons flagged: 0`을 낸다. `max_packets` 20000으로 부르면 같은 모드가 `198.51.100.53:53`(60초마다 DNS 질의)을 `POTENTIAL BEACON`으로 잡는다."
defect_ko: "이 서버는 캡처의 앞 `max_packets`(기본 10,000)패킷만 읽으면서, 상한에 닿았는지와 전체 패킷 수를 알리지 않는다. 정상이라면 상한에 닿았음과 읽은 패킷·전체 패킷 수를 밝혀야 한다. 모델은 캡처 전체에 비콘이 없다고 잘못 안다."
setup_ko: "8시 58분부터 내부 스캐너(10.0.2.15)의 포트 스캔 12,000패킷이 있고, 9시 4분부터 워크스테이션 10.0.2.42가 외부 DNS 서버 198.51.100.53에 60초마다 TXT 질의를 40번 보내는 캡처(12,080패킷, gzip)를 두었다."
