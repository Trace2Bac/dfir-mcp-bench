steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: span-beacon
  - tool: run_pcap_analysis
    note_ko: "결함 호출: 비콘 찾기(기본 max_packets)"
    args:
      pcap_path: ${EVIDENCE}/net/span-vlan20-20261105.pcap.gz
      mode: beaconing
  - tool: get_raw_output
    note_ko: "적재된 비콘 분석 결과 읽기"
    args:
      source_name: pcap.beaconing
  - tool: run_pcap_analysis
    note_ko: "비교 호출: 같은 캡처의 summary(capinfos 패킷 수)"
    args:
      pcap_path: ${EVIDENCE}/net/span-vlan20-20261105.pcap.gz
      mode: summary
  - tool: get_raw_output
    note_ko: "적재된 summary 읽기"
    args:
      source_name: pcap.summary
  - tool: run_pcap_analysis
    note_ko: "비교 호출: 비콘 찾기(max_packets 20000)"
    args:
      pcap_path: ${EVIDENCE}/net/span-vlan20-20261105.pcap.gz
      mode: beaconing
      max_packets: 20000
  - tool: get_raw_output
    note_ko: "두 번의 비콘 분석 결과 읽기"
    args:
      source_name: pcap.beaconing
expect:
  - step: 3
    note_ko: "기본 상한으로는 비콘이 없다고 낸다"
    contains: 'Potential beacons flagged: 0'
  - step: 3
    note_ko: "상한에 닿았거나 일부 패킷만 읽었다는 표시가 없다"
    not_regex: '(?i)max_packets|limit|truncat|first 10000|10,000|packets read|of \d+ packets'
  - step: 5
    note_ko: "같은 캡처는 12,080패킷이다"
    contains: 'Number of packets = 12080'
  - step: 7
    note_ko: "상한을 올리면 같은 모드가 198.51.100.53:53을 비콘으로 잡는다"
    contains: 'POTENTIAL BEACON: 198.51.100.53:53 **'
