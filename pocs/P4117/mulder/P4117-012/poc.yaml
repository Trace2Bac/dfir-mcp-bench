steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: phone-steg
  - tool: detect_steganography
    note_ko: "결함 호출: 사진 폴더 전체 검사"
    args:
      target_path: ${EVIDENCE}/phone
  - tool: detect_steganography
    note_ko: "비교 호출: 같은 폴더의 IMG_0412.JPG 하나만 검사"
    args:
      target_path: ${EVIDENCE}/phone/DCIM/100APPLE/IMG_0412.JPG
  - tool: get_raw_output
    note_ko: "비교 호출: 파일 하나 검사의 결과 원문"
    args:
      source_name: steg.detection
expect:
  - step: 2
    note_ko: "폴더에 사진이 세 장인데 한 장만 보고 숨긴 데이터가 없다고 답한다"
    contains: 'No steganographic content detected in 1 files'
  - step: 2
    contains: '"files_scanned": 1,'
  - step: 3
    note_ko: "파일 하나로 부르면 결과 2줄을 적재한다"
    contains: '"result_count": 2,'
  - step: 4
    note_ko: "같은 도구가 파일 하나로는 JPEG 뒤에 붙은 ZIP을 찾는다"
    regex: 'IMG_0412\.JPG[^"]*appended|IMG_0412\.JPG: \d+ bytes after JPEG EOI'
