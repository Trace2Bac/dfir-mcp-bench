# Matrix case P4117-012: detect_steganography collects a folder's images with
# rglob("*.jpg"), rglob("*.jpeg") and rglob("*.png") (artifacts.py), which are
# case-sensitive on Linux, so .JPG/.PNG files are never examined (the HEIC
# glob does include "*.HEIC"). The response counts only the lowercase files:
# "No steganographic content detected in 1 files", files_scanned 1.
#
# Evidence: JPEGs written with Pillow 12.3 in this image (192x144, EXIF
# Apple / iPhone 13). IMG_0412.JPG is a photo with a ZIP archive
# (q4_customers.csv) appended after the EOI marker, as `copy /b photo.jpg +
# data.zip` makes; stegdetect in this image reports it as
# "appended(514)<[nonrandom][data][PK...". IMG_0411.JPG and
# Downloads/wallpaper.jpg are the same kind of photo without appended data.
case_id: P4117-012
problem: P4117
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "iPhone·디지털카메라는 사진을 `IMG_0412.JPG`처럼 대문자 확장자로 저장하고, mulder는 대소문자를 가리는 Linux 파일시스템(컨테이너)에서 증거를 읽는다."
coverage: full
summary: >-
  In a folder with three photos, detect_steganography on the folder returns
  "No steganographic content detected in 1 files" (files_scanned 1): only
  Downloads/wallpaper.jpg was examined, and the two camera files
  DCIM/100APPLE/IMG_0411.JPG and IMG_0412.JPG were skipped for their
  uppercase extension, although the same tool on IMG_0412.JPG alone reports
  a ZIP appended after the JPEG data.
summary_ko: "사진 세 장이 든 폴더에 `detect_steganography`를 부르면 `No steganographic content detected in 1 files`(`files_scanned: 1`)를 낸다. 실제로 본 것은 `Downloads/wallpaper.jpg`뿐이고, 카메라 파일 `DCIM/100APPLE/IMG_0411.JPG`·`IMG_0412.JPG`는 확장자가 대문자라 건너뛰었다. 같은 도구를 `IMG_0412.JPG` 하나에 부르면 JPEG 뒤에 붙은 ZIP을 찾아낸다."
defect_ko: "이 서버는 폴더에서 이미지를 고를 때 소문자 확장자(`.jpg`·`.jpeg`·`.png`)만 찾고, 건너뛴 파일이 있다는 것을 알리지 않는다. 정상이라면 확장자의 대소문자를 가리지 않고 모든 이미지를 보거나, 건너뛴 파일 수를 밝혀야 한다. 모델은 폴더의 사진에 숨긴 데이터가 없다고 잘못 안다."
setup_ko: "휴대폰 사진 폴더 `DCIM/100APPLE`에 `IMG_0411.JPG`와, 뒤에 고객 목록 ZIP을 붙인 `IMG_0412.JPG`를 두고, `Downloads/wallpaper.jpg`를 하나 더 두었다."
