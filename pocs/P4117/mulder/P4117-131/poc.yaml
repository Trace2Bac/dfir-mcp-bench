display: multi-call
level: mcp
realism: common
realism_ko: "실제 Security 로그는 기록이 수천~수만 건이라 같은 종류의 이벤트가 window 20개보다 많은 것이 보통이다. 여기서도 1,194건짜리 실제 로그에서 4648만 15개 window에 있다."
coverage: "partial: find_lateral_movement_indicators (explicit credentials, k=20) is shown; the other composite tools use the same top-k sub-query"
coverage_ko: "`find_lateral_movement_indicators`의 명시적 자격 증명 질의(k=20)만 보인다. 다른 composite 도구도 같은 상위 k 질의를 쓴다."
summary: >-
  On a real Security log with 15 explicit-credential logons (4648) in 15
  windows, find_lateral_movement_indicators reports only a few of them,
  and neither of informant's two logons to the file server Company-PC
  (2015-03-23 20:23:27, 2015-03-24 13:47:06) that search finds, because only the 20
  best-ranked windows of its keyword query were read; the result does not
  say so.
summary_ko: "명시적 자격 증명 로그온(4648)이 15개 window에 15건 있는 실제 Security 로그에서, `find_lateral_movement_indicators`는 그중 몇 건만 낸다. `search`로 찾히는, informant가 파일 서버 Company-PC에 로그온한 두 기록(2015-03-23 20:23:27, 2015-03-24 13:47:06)은 하나도 없다. 키워드 질의의 상위 20개 window만 읽었기 때문이고, 결과는 그 사실을 말하지 않는다."
defect_ko: "이 서버의 composite 도구는 키워드 질의로 bm25 상위 k개(여기서는 20개) window만 받아 지표를 만들고, 그 범위를 결과에 적지 않는다. 정상이라면 조건에 맞는 window를 모두 보거나, 상위 k개만 봤다는 것과 나머지 건수를 밝혀야 한다. 모델은 결과에 있는 4648이 전부라고 알고, 파일 서버로의 로그온을 놓친다."
setup_ko: "NIST CFReDS Data Leakage 사건의 실제 Security 로그(1,194건)를 `C/Windows/System32/winevt/Logs`에 담은 트리아지 USB 이미지(E01)를 두었다. 4648은 15건이고, 그중 두 건이 informant가 Company-PC에 로그온한 기록이다."
