steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: informant-triage
  - tool: run_evtx_parser
    note_ko: "이미지에서 이벤트 로그 꺼내기"
    args:
      evtx_path: ${EVIDENCE}/informant-pc-triage.E01
  - tool: index_evtx_file
    note_ko: "Security 로그 적재"
    args:
      filename: Security.evtx
  - tool: find_lateral_movement_indicators
    note_ko: "결함 호출: 측면 이동 지표 찾기"
  - tool: search
    note_ko: "비교 호출: 적재된 로그에서 Company-PC 찾기"
    args:
      query: Company-PC
      source: evtx.c_windows_system32_winevt_logs_security
      max_results: 100
  - tool: get_raw_output
    note_ko: "비교 호출: Company-PC가 든 window 311 원문"
    args:
      source_name: evtx.c_windows_system32_winevt_logs_security
      after_id: 310
      limit: 1
expect:
  - step: 4
    note_ko: "결과에 명시적 자격 증명(4648) 지표가 있다"
    regex: '"type": "explicit_credentials",[^}]*,4648,'
  - step: 4
    note_ko: "Company-PC로의 4648 로그온은 결과에 하나도 없다"
    not_contains: 'Company-PC'
  - step: 4
    note_ko: "상위 k개 window만 봤다는 표시가 없다"
    not_regex: '(?i)top[ _-]?\d+|top_k|"k":|max_results|truncat|limited to'
  - step: 5
    note_ko: "적재된 로그에는 Company-PC가 든 window가 있다"
    contains: '"line_start": 1111,'
  - step: 6
    note_ko: "그 window에 2015-03-24 13:47:06 Company-PC 4648 로그온이 있다"
    regex: '2015-03-24 13:47:06\.0751875,4648,[^\n]*Company-PC'
