# Matrix case P4117-131: the composite tools build their indicators from
# _keyword_sub_query (composite/core.py), which ORs the query terms and
# keeps only the k best windows by bm25 rank (k=20 for the logon queries of
# find_lateral_movement_indicators), and the result does not say that only
# the top k windows were looked at.
#
# Evidence: a real Security.evtx (1,194 records, informant-PC, March 2015)
# from the NIST CFReDS Data Leakage case (data/evidence/pc-triage), on a
# 16 MiB FAT16 triage volume (mkfs.fat 4.2, label TRIAGE, the file at
# C/Windows/System32/winevt/Logs/Security.evtx, written with mtools),
# acquired with ewfacquire (EnCase 6, deflate). The log holds 15 explicit
# credential logons (4648), in 15 windows once indexed; two of them are
# informant's logons to the file server Company-PC (2015-03-23 20:23:27 and
# 2015-03-24 13:47:06), which the NIST answer key ties to the leak.
#   volume sha256 1bc94e75425f458f863ebc56e24cf4b58bf0e71d6a1ca5a20cb91125044aab70
#   Security.evtx sha256 7f36a1819c6347c0bf1a9326d4ac4e3a098c4b14d3f17f73dc1141598523147b
case_id: P4117-131
problem: P4117
server: mulder
variant: mulder-3164843
