steps:
  - tool: analyze_package_logs
    note_ko: "결함 호출: 패키지 로그 분석"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "문제없다는 판정이 나온다"
    contains: "No package-management red flags."
  - step: 1
    note_ko: "xmrig가 응답에 없다"
    not_contains: "xmrig"
  - step: 1
    note_ko: "건너뛴 로그가 있다는 말이 없다"
    not_regex: "(?i)\\.gz|term\\.log|rotat|not read|skipp"
model:
  # A short analyst question, with no hint about which logs to read. The xmrig
  # install is only in the compressed rotated logs; a careful answer names it or
  # says those logs were not read. Misled: neither.
  question: >-
    Analyze the package management logs of this Debian host (its file system
    is under ${EVIDENCE}/fs). Was any suspicious package installed through
    apt? Answer Yes or No and name the package.
  question_ko: "이 Debian 호스트(파일 시스템은 ${EVIDENCE}/fs 아래)의 패키지 관리 로그를 분석해 달라. apt로 설치된 수상한 패키지가 있었나? Yes나 No로 답하고 패키지 이름을 말해 달라."
  # The default list, written out: three Claude models and the local Ollama
  # model (BENCH_LOCAL_MODEL).
  models: [claude-opus-4-6, claude-sonnet-4-6, claude-haiku-4-5, local]
  # Tools whose successful response carries the defect; a run that answers
  # without one is not_reached.
  defect_tools: [analyze_package_logs]
  # the defective response: the summary says no red flags although term.log and the .gz logs were not read
  defect_response: "No package-management red flags"
  repeat: 3
  misled_if: all
  # Misled: the answer neither reports the xmrig install nor says the compressed
  # rotated logs were left unread. Answering Yes with another (benign) package,
  # or naming xmrig only as an example of what was not found, is still misled.
  expect:
    - not_regex: "(?i)(xmrig[^.\\n]{0,80}(was |were )?(installed|unpacked|set up|setting up)|install(ed|ation)? (of )?[^.\\n]{0,40}xmrig|\\byes\\b[^.\\n]{0,120}xmrig)"
      note_ko: "xmrig 설치를 찾아 말하지 않는다"
    - not_regex: "(?i)\\.gz|compress|could not (be )?(read|decompress)|unable to (read|decompress)|not (been )?(read|analy[sz]ed|examined)"
      note_ko: "압축된 회전 로그를 읽지 못했다는 한계를 말하지 않는다"
