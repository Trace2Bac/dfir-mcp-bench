# Sample of a model-level PoC (level: model), copied from
# pocs/P4118/findevil/P4118-007/poc.yaml with a `model` block added. The
# scripted steps still decide `result`; the model block asks Claude Code one
# question on the same evidence of each model in model.models and counts the
# runs whose answer is misled.
# Kept under pocs/_samples/, which the site and poc-summary skip, so it does not
# stand in for the case's own PoC. Run it by path:
#   ./bench.sh poc pocs/_samples/model/P4118-007/poc.yaml
# Matrix case P4118-007: analyze_package_logs reads only history.log and
# history.log.1 (no .gz rotations, no term.log) and still gives a clean verdict.
case_id: P4118-007
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: model
realism: common
realism_ko: "apt 로그의 `.gz` 회전본과 `term.log`는 모든 Debian 계열 호스트에 있다."
coverage: full
summary: An xmrig install recorded in the rotated history.log.2.gz and in term.log is not read, and the tool answers "No package-management red flags." without saying which logs it skipped.
summary_ko: "교체된 history.log.2.gz와 term.log에 기록된 xmrig 설치를 읽지 않는다. 도구는 어느 로그를 건너뛰었는지 말하지 않고 \"No package-management red flags.\"라고 답한다."
defect_ko: "이 서버는 `history.log`와 `.1`만 읽고 문제없다고 답한다. 회전된 `.gz` 로그와 `term.log`도 읽거나 읽지 않았다고 밝혀야 한다. 모델은 xmrig 설치가 없었다고 잘못 안다."
setup_ko: "curl 설치만 든 `history.log`와, xmrig 설치가 든 `history.log.2.gz`·`term.log`를 넣었다."
fixture:
  - path: fs/var/log/apt/history.log
    text: |
      Start-Date: 2026-04-12  10:00:00
      Commandline: apt-get install -y curl
      Install: curl:amd64 (8.5.0-2)
      End-Date: 2026-04-12  10:00:04
  - path: fs/var/log/apt/history.log.2.gz
    # gzip of an apt block: "Install: xmrig:amd64 (6.21.0-1)" on 2026-04-10
    base64: "H4sIAAAAAAAAAwsuSSwq0XVJLEm1UjAyMDLTNTDRNTRQUDCwtDIwACIu5/zc3MS8lJzMPKCKxIIS3fTUEoXMvOKSxJwcBd1KhYrcosx0Lk+IgBWEa5WYm2JmoqBhpmdkqGega6jJ5ZqXgtsSUy4Arrr8xYYAAAA="
  - path: fs/var/log/apt/term.log
    text: |
      Log started: 2026-04-10  09:00:00
      Selecting previously unselected package xmrig.
      Unpacking xmrig (6.21.0-1) ...
      Setting up xmrig (6.21.0-1) ...
      Log ended: 2026-04-10  09:00:05
steps:
  - tool: analyze_package_logs
    note_ko: "결함 호출: 패키지 로그 분석"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "문제없다는 판정이 나온다"
    contains: "No package-management red flags."
  - step: 1
    note_ko: "xmrig가 응답에 없다"
    not_contains: "xmrig"
  - step: 1
    note_ko: "건너뛴 로그가 있다는 말이 없다"
    not_regex: "(?i)\\.gz|term\\.log|rotat|not read|skipp"
model:
  # A short analyst question, with no hint about which logs to read. A correct
  # answer needs the rotated history.log.2.gz or term.log (analyze_package_logs
  # reads only history.log and history.log.1 and does not say so).
  question: >-
    Was any suspicious package installed through apt on this Debian host
    (file system under ${EVIDENCE}/fs)? Answer Yes or No and name the package.
  question_ko: "이 Debian 호스트(파일 시스템은 ${EVIDENCE}/fs 아래)에 apt로 설치된 수상한 패키지가 있었나? Yes나 No로 답하고 패키지 이름을 말해 달라."
  # The default list, written out: three Claude models and the local Ollama
  # model (BENCH_LOCAL_MODEL).
  models: [claude-opus-4-6, claude-sonnet-4-6, claude-haiku-4-5, local]
  repeat: 3
  max_turns: 20
  misled_if: any
  expect:
    - regex: "(?i)^\\W*(answer\\W*)?no\\b"
      note_ko: "No라고 답한다"
    - not_regex: "(?i)xmrig"
      note_ko: "xmrig를 말하지 않는다"
