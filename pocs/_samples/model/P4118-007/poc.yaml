# Sample of a model-level PoC (level: model), copied from
# pocs/P4118/findevil/P4118-007/poc.yaml with a `model` block added. The
# scripted steps still decide `result`; the model block asks Claude Code one
# question on the same evidence of each model in model.models and counts the
# runs whose answer is misled.
# Kept under pocs/_samples/, which the site and poc-summary skip, so it does not
# stand in for the case's own PoC. Run it by path:
#   ./bench.sh poc pocs/_samples/model/P4118-007/poc.yaml
# Matrix case P4118-007: analyze_package_logs reads only history.log and
# history.log.1 (no .gz rotations, no term.log) and still gives a clean verdict.
case_id: P4118-007
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: model
realism: common
realism_ko: "apt 로그의 `.gz` 회전본과 `term.log`는 모든 Debian 계열 호스트에 있다."
coverage: full
summary: On a busy host whose xmrig install of 2026-04-10 survives only in the compressed rotated logs (history.log.2.gz, term.log.2.gz, dpkg.log.2.gz), the tool parses the 100 benign events of the current and .1 logs and answers "No package-management red flags." without saying which logs it did not read.
summary_ko: "xmrig 설치(2026-04-10) 기록이 압축된 회전 로그(`history.log.2.gz`, `term.log.2.gz`, `dpkg.log.2.gz`)에만 남은 서버에서, 도구는 현재·`.1` 로그의 정상 기록 100건만 읽고 읽지 않은 로그를 밝히지 않은 채 \"No package-management red flags.\"라고 답한다."
defect_ko: "이 서버는 `history.log`와 `.1`만 읽고 문제없다고 답한다. 회전된 `.gz` 로그와 `term.log`도 읽거나 읽지 않았다고 밝혀야 한다. 모델은 xmrig 설치가 없었다고 잘못 안다."
setup_ko: "정상 설치·업그레이드 100건이 든 현재·`.1` 로그와 syslog·auth.log를 두고, xmrig 설치는 logrotate가 압축한 `.2.gz` 로그에만 넣었다."
