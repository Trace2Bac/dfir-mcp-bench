realism: common
realism_ko: "mulder 이미지의 volatility3에는 Windows 심볼 팩이 없어서, Windows 메모리 이미지를 처음 열면 언제나 커널 심볼을 찾으러 나간다."
coverage: "partial: run_volatility through the vol CLI only; the library path of run_volatility_batch is not run; the memory dump is a minimal one holding only what vol needs to find the kernel; the symbol server is a local stand-in"
coverage_ko: "`run_volatility`의 vol CLI 경로만 보였다. `run_volatility_batch`의 라이브러리 경로는 돌리지 않았다. 메모리 덤프는 vol이 커널을 찾는 데 필요한 것만 담은 최소 덤프이고, 심볼 서버는 로컬 대역이다."
summary: >-
  run_volatility windows.info.Info on a Windows 10 x64 memory dump runs vol
  without --offline, and vol sends GET
  http://msdl.microsoft.com/download/symbols/ntkrnlmp.pdb/B9DB443817206749BE7AA4A2C20430FA1/ntkrnlmp.pdb
  through the stand-in proxy, though the README says mulder never reaches
  the network; there is no setting that keeps it offline.
summary_ko: "Windows 10 x64 메모리 덤프에 `run_volatility windows.info.Info`를 돌리면 서버는 `--offline` 없이 vol을 실행하고, vol은 `http://msdl.microsoft.com/download/symbols/ntkrnlmp.pdb/B9DB443817206749BE7AA4A2C20430FA1/ntkrnlmp.pdb`를 요청한다(대역 프록시가 기록). README는 네트워크에 나가지 않는다고 적고, 오프라인으로 두는 설정은 없다."
defect_ko: "이 서버는 Volatility 3를 오프라인 설정 없이 실행해, 커널 심볼이 없으면 사용자가 켜지 않아도 Microsoft 심볼 서버에 접속한다. 정상이라면 기본은 오프라인(`--offline`)으로 두고, 심볼 내려받기는 사용자가 켰을 때만 해야 한다. 격리된 조사 장비가 외부에 연결하고, 분석 중인 커널의 빌드 정보(PDB GUID)가 밖으로 나간다."
setup_ko: "Windows 10 x64 전체 메모리 덤프(커널을 찾는 데 필요한 페이지만 담은 최소 덤프)를 두고, 서버의 HTTP·HTTPS 요청이 컨테이너 안 대역 프록시로 가게 했다. 이미지의 volatility3에는 Windows 심볼이 없다."
env:
  HTTP_PROXY: http://127.0.0.1:18443
  http_proxy: http://127.0.0.1:18443
  HTTPS_PROXY: http://127.0.0.1:18443
  https_proxy: http://127.0.0.1:18443
services:
  - name: recorder
    args: ["${OUTSIDE}/received.log"]
    ready_port: 18443
    text: |
      #!/usr/bin/env python3
      # Stand-in for the Microsoft symbol server: an HTTP proxy on 127.0.0.1:18443
      # that logs the request line of each request it is sent (a CONNECT too) and
      # answers 404. Nothing is forwarded and no name is resolved.
      import socket, sys, threading
      log_path = sys.argv[1]
      lock = threading.Lock()
      def handle(c):
          try:
              f = c.makefile("rb")
              first = f.readline().decode(errors="replace").rstrip()
              while f.readline() not in (b"", b"\r\n", b"\n"):
                  pass
              with lock, open(log_path, "a") as lf:
                  lf.write(f"proxy: {first}\n")
              c.sendall(b"HTTP/1.1 404 Not Found\r\nContent-Length: 0\r\nConnection: close\r\n\r\n")
          finally:
              c.close()
      srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      srv.bind(("127.0.0.1", 18443)); srv.listen(16)
      while True:
          c, _ = srv.accept()
          threading.Thread(target=handle, args=(c,), daemon=True).start()

