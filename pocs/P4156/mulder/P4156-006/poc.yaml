# Matrix case P4156-006: run_volatility (and run_volatility_batch when it
# falls back to the CLI) runs `vol -f <image> <plugin>` with no --offline
# and no -s (volatility.py 101-104, 140-143; extractors/volatility.py
# 17-47), and the library path builds its context without the offline
# setting (volatility.py 307-321). The image's volatility3 has only the
# generic symbol tables, so for a Windows memory image whose kernel symbols
# are not cached vol fetches the kernel PDB from msdl.microsoft.com, sending
# the PDB GUID of the kernel under analysis. README.md 40 says the server
# "never reaches the network".
#
# No request leaves the container: HTTP_PROXY / HTTPS_PROXY (and their lower
# case forms, which urllib reads) point vol at a stand-in proxy on
# 127.0.0.1:18443 (the `recorder` service) that logs each request and
# answers 404.
#
# Evidence: the minimal Windows 10 x64 complete memory dump of P4156-012
# (trudi): PAGEDU64, DumpType 1, 2 header pages and 12 physical pages with
# the kernel page tables (DTB 0x1AD000), KUSER_SHARED_DATA (NtMajorVersion
# 10) and the first page of the kernel image with its CodeView record (RSDS,
# ntkrnlmp.pdb, GUID B9DB443817206749BE7AA4A2C20430FA, age 1).
case_id: P4156-006
problem: P4156
server: mulder
variant: mulder-3164843
