coverage_ko: "기본 ip-api 질의만 보였다. 분석가 프롬프트의 지시는 소스에서 확인했고 모델로 돌리지 않았다."
summary: >-
  With no API key or setting, enrich_iocs on the C2 address 198.51.100.23
  sends GET http://ip-api.com/json/198.51.100.23 in plaintext through the
  stand-in proxy and answers with the ip-api result; nothing asked the user
  to allow the outside query.
summary_ko: "API 키도 설정도 없이 C2 주소 198.51.100.23으로 `enrich_iocs`를 부르면 서버는 `GET http://ip-api.com/json/198.51.100.23`을 평문으로 보내고(대역 프록시가 기록) ip-api 결과로 답한다. 외부 조회를 허락할지 사용자에게 묻는 단계는 없다."
defect_ko: "이 서버는 사용자가 켜지 않아도 `enrich_iocs`의 ip-api 평문 HTTP 질의를 기본으로 보낸다. 정상이라면 외부 통신은 사용자가 설정으로 켰을 때만 하고, 기본은 꺼져 있어야 한다. 조사 중인 주소와 조사 사실이 암호화되지 않은 채 제3자에게 가고, 공격자가 운영하는 주소라면 공격자 쪽에 조사가 알려질 수 있다."
setup_ko: "감염 PC의 `netstat -ano` 결과(PowerShell이 C2 198.51.100.23:443에 연결)를 적재하고, API 키는 하나도 넣지 않은 채 서버의 HTTP·HTTPS 요청이 컨테이너 안 대역 프록시로 가게 했다."
env:
  HTTP_PROXY: http://127.0.0.1:18443
  HTTPS_PROXY: http://127.0.0.1:18443
  SSL_CERT_FILE: ${OUTSIDE}/cert.pem
services:
  - name: recorder
    args: ["${OUTSIDE}/received.log", "${OUTSIDE}/cert.pem", "${OUTSIDE}/key.pem"]
    ready_port: 18443
    text: |
      #!/usr/bin/env python3
      # Stand-in for ip-api.com, AbuseIPDB and VirusTotal: an HTTP proxy on
      # 127.0.0.1:18443. A plain request (absolute URI, as httpx sends through
      # HTTP_PROXY) is logged and answered the way ip-api.com answers a private or
      # reserved address; a CONNECT (HTTPS_PROXY) is answered, TLS is ended with
      # the PoC's own certificate (trusted through SSL_CERT_FILE), the request is
      # logged and answered 404. Nothing is forwarded and no name is resolved.
      import json, re, socket, ssl, sys, threading
      log_path, cert, key = sys.argv[1:4]
      lock = threading.Lock()
      def log(s):
          with lock, open(log_path, "a") as f:
              f.write(s + "\n")
      ctx = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH)
      ctx.load_cert_chain(cert, key)
      def head(f):
          lines = []
          while True:
              ln = f.readline()
              if not ln or ln in (b"\r\n", b"\n"):
                  return lines
              lines.append(ln.decode(errors="replace").rstrip())
      def reply(sock, code, body):
          b = json.dumps(body).encode()
          sock.sendall(f"HTTP/1.1 {code}\r\nContent-Type: application/json\r\nContent-Length: {len(b)}\r\nConnection: close\r\n\r\n".encode() + b)
      def handle(c):
          try:
              f = c.makefile("rb")
              req = head(f)
              if not req:
                  return
              if req[0].startswith("CONNECT "):
                  log(f"proxy: {req[0]}")
                  c.sendall(b"HTTP/1.1 200 Connection established\r\n\r\n")
                  t = ctx.wrap_socket(c, server_side=True)
                  inner = head(t.makefile("rb"))
                  for ln in inner:
                      if not ln.lower().startswith(("accept", "user-agent", "connection")):
                          log(f"  {ln}")
                  reply(t, "404 Not Found", {"error": {"code": "NotFoundError", "message": "stand-in"}})
                  t.close()
                  return
              log(f"proxy: {req[0]}")
              for ln in req[1:]:
                  if ln.lower().startswith("host:"):
                      log(f"  {ln}")
              m = re.search(r"/json/([0-9.]+)", req[0])
              ip = m.group(1) if m else ""
              private = re.match(r"^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)", ip)
              reply(c, "200 OK", {"status": "fail", "message": "private range" if private else "reserved range", "query": ip})
          except Exception as e:
              log(f"error: {e}")
          finally:
              c.close()
      srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      srv.bind(("127.0.0.1", 18443)); srv.listen(16)
      while True:
          c, _ = srv.accept()
          threading.Thread(target=handle, args=(c,), daemon=True).start()

