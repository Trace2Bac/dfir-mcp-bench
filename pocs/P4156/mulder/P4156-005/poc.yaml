# Matrix case P4156-005: enrich_iocs always queries ip-api.com for an IPv4,
# over plain HTTP, with no API key and no setting that turns it on
# (enrichment.py 130-182, 474-475); only the keyed services wait for a key.
# mulder's analyst prompt tells the model to use enrich_iocs whenever it
# finds a suspicious connection (extract_analyst.md 187-188). With nothing
# configured, a call sends the investigated address, in clear text, to a
# third-party service.
#
# No request leaves the container: HTTP_PROXY and HTTPS_PROXY point httpx at
# a stand-in proxy on 127.0.0.1:18443 (the `recorder` service), which logs
# what it is sent and answers as ip-api.com answers a reserved address. No
# API key is set.
case_id: P4156-005
problem: P4156
