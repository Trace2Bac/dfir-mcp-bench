realism_ko: "API 키 없이 설치한 그대로 쓰는 것이 보통이고, 분석가 프롬프트가 의심 연결마다 `enrich_iocs`를 부르라고 하므로 키·설정 없이도 이 호출은 흔하게 일어난다."
