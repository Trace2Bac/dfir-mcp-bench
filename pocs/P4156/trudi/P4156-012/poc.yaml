# Matrix case P4156-012: trudi runs Volatility 3 as
# `vol -s <symbol cache> -f <image> -r json <plugin>`, without --offline.
# When the cache has no symbols for the image's kernel (a fresh install, or
# any new Windows build), vol fetches the kernel PDB from
# msdl.microsoft.com, sending the kernel's PDB GUID, without the user having
# turned anything on. vol_symbol_check even tells the model to do this.
# No request leaves the container: HTTP(S)_PROXY points vol at a stand-in
# proxy on 127.0.0.1:18443 (outside/recorder.py, started by the first
# batch_run) that logs each request and answers 404.
# Evidence: a minimal Windows 10 x64 complete memory dump (PAGEDU64,
# DumpType 1, 12 pages): the kernel page tables (DTB 0x1AD000,
# self-reference at 0x1ED), KUSER_SHARED_DATA (NtMajorVersion 10) and the
# first page of the kernel image with its CodeView record (RSDS,
# ntkrnlmp.pdb). The build script is not kept; the layout is in the summary.
case_id: P4156-012
problem: P4156
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: network
level: mcp
realism: common
realism_ko: "새로 설치한 분석 장비나 처음 보는 Windows 빌드의 메모리를 열면 심볼 캐시에 맞는 심볼이 없는 것이 보통이다."
coverage: "partial: vol_info only (every vol_* call goes through the same command line); the memory dump is a minimal one holding only what vol needs to find the kernel; the symbol server is a local stand-in"
coverage_ko: "vol_info만 보였다(다른 vol_* 도구도 같은 명령줄을 쓴다). 메모리 덤프는 vol이 커널을 찾는 데 필요한 것만 담은 최소 덤프다. 심볼 서버는 로컬 대역이다."
summary: With an empty symbol cache, vol_symbol_check says to run vol_info "to download symbols (requires internet)", and vol_info runs vol without --offline, which sends GET http://msdl.microsoft.com/download/symbols/ntkrnlmp.pdb/<GUID+age>/ntkrnlmp.pdb (and .pd_) as the stand-in proxy records; trudi has no setting that keeps it offline.
summary_ko: "심볼 캐시가 비어 있으면 vol_symbol_check는 vol_info를 한 번 불러 심볼을 받으라고(인터넷 필요) 안내하고, vol_info는 --offline 없이 vol을 실행해 http://msdl.microsoft.com/download/symbols/ntkrnlmp.pdb/<GUID+age>/ntkrnlmp.pdb(그리고 .pd_)를 요청한다(대역 프록시가 기록). trudi에는 오프라인으로 두는 설정이 없다."
defect_ko: "이 서버는 Volatility 3를 --offline 없이 실행해, 심볼이 없으면 사용자가 켜지 않아도 Microsoft 심볼 서버에 접속한다. 정상이라면 기본은 오프라인으로 두고, 외부 접속은 사용자가 켰을 때만 하거나 접속 전에 알려야 한다. 조사 장비가 외부에 연결하고, 분석 중인 커널의 빌드 정보(PDB GUID)가 밖으로 나간다."
setup_ko: "빈 심볼 캐시를 쓰고, Windows 10 x64 전체 메모리 덤프(커널을 찾는 데 필요한 페이지만 담은 최소 덤프)를 넣었다. 서버의 HTTP 요청은 컨테이너 안 대역 프록시로 가게 했다."
env:
  VOLATILITY_SYMBOLS: ${DB_DIR}/symbols
  HTTP_PROXY: http://127.0.0.1:18443
  http_proxy: http://127.0.0.1:18443
  HTTPS_PROXY: http://127.0.0.1:18443
  https_proxy: http://127.0.0.1:18443
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: recorder.py
    root: outside
    text: |
      # Stand-in for the Microsoft symbol server: an HTTP proxy on 127.0.0.1:18443
      # that logs the request line of each request it is sent and answers 404.
      # Nothing is forwarded.
      import socket, sys, time
      log = open(sys.argv[1], "w")
      srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      srv.bind(("127.0.0.1", 18443)); srv.listen(8); srv.settimeout(5)
      end = time.time() + 300
      while time.time() < end:
          try:
              c, _ = srv.accept()
          except socket.timeout:
              continue
          f = c.makefile("rb")
          first = f.readline().decode(errors="replace").rstrip()
          while f.readline() not in (b"", b"\r\n", b"\n"):
              pass
          log.write(f"proxy: {first}\n"); log.flush()
          c.sendall(b"HTTP/1.1 404 Not Found\r\nContent-Length: 0\r\nConnection: close\r\n\r\n")
          c.close()
  # Windows 10 x64 complete memory dump, 57,344 bytes: 2 header pages
  # (PAGEDU64, DirectoryTableBase 0x1AD000, runs 0x1AD-0x1B6 and
  # 0x1BA-0x1BB) and 12 physical pages; kernel PDB GUID
  # B9DB443817206749BE7AA4A2C20430FA, age 1.
  - path: memory/MEMORY.DMP
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4156-012
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: misc_batch_run
    note_ko: "준비: 심볼 서버 대역 프록시를 띄운다"
    args:
      tool_calls:
        - cmd: ["sh", "-c", "python3 ${OUTSIDE}/recorder.py ${OUTSIDE}/received.log >/dev/null 2>&1 & sleep 1"]
  - tool: vol_symbol_check
    note_ko: "비교 호출: 심볼 캐시 상태를 본다"
    args:
      memory_image: ${EVIDENCE}/memory/MEMORY.DMP
  - tool: vol_info
    note_ko: "결함 호출: 메모리 이미지의 OS 정보를 본다"
    args:
      image: ${EVIDENCE}/memory/MEMORY.DMP
    timeout_s: 300
  - tool: misc_batch_run
    note_ko: "확인: 대역 프록시가 받은 요청 기록을 읽는다"
    args:
      tool_calls:
        - cmd: ["cat", "${OUTSIDE}/received.log"]
expect:
  - step: 3
    note_ko: "서버는 캐시가 비었으니 vol_info로 심볼을 받으라고(인터넷 필요) 안내한다"
    regex: '"symbols_ready":\s*false[\s\S]*call vol_info once to download symbols \(requires internet\)'
  - step: 4
    note_ko: "vol은 --offline 없이 실행된다"
    regex: '"cmd":\s*"/usr/local/bin/vol -s [^"]*/symbols -f [^"]*MEMORY\.DMP -r json windows\.info"'
  - step: 5
    note_ko: "vol이 커널 PDB GUID를 담아 Microsoft 심볼 서버에 요청했다"
    regex: 'proxy: GET http://msdl\.microsoft\.com/download/symbols/ntkrnlmp\.pdb/B9DB443817206749BE7AA4A2C20430FA1/ntkrnlmp\.pdb HTTP/1\.1'
