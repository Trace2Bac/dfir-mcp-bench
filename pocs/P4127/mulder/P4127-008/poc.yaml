display: side-effect
level: mcp
realism: common
realism_ko: "발견 사항 제목에 실행된 명령을 그대로 적는 것은 흔하고 PowerShell 명령에는 거의 늘 파이프(`|`)가 있다. 설명에 스크립트 내용을 옮겨 적을 때 `#` 주석 줄이 들어가는 것도 흔하다."
coverage: full
summary: >-
  After findings titled with the commands from a PowerShell transcript
  ("... -DisableRealtimeMonitoring $true | Out-Null", "Get-WmiObject
  Win32_ShadowCopy | ForEach-Object { $_.Delete() }") and a description
  quoting the new logon script, finalize_report writes a report whose Attack
  Timeline rows have five cells under a four-column header, so the Severity
  column shows "Out-Null" and "ForEach-Object { $_.Delete() }", the real
  severity moves to Sources and the source falls off the table, and whose Appendix A has a
  top-level heading "# Corp logon script - maps the shared drives" from the
  quoted script.
summary_ko: "PowerShell transcript의 명령을 제목에 그대로 적은 발견 사항(`... -DisableRealtimeMonitoring $true | Out-Null`, `Get-WmiObject Win32_ShadowCopy | ForEach-Object { $_.Delete() }`)과 새 로그온 스크립트를 옮겨 적은 설명을 낸 뒤 `finalize_report`가 쓴 보고서에서, 공격 타임라인 표의 행은 4열 머리 아래 5칸이 되어 Severity 칸에 `Out-Null`·`ForEach-Object { $_.Delete() }`가 들어가고, 실제 심각도는 Sources 칸으로 밀리며 source는 표 밖으로 빠진다. 부록 A에는 옮겨 적은 스크립트의 `# Corp logon script - maps the shared drives`가 보고서 제목과 같은 수준의 머리글로 생긴다."
defect_ko: "이 서버는 발견 사항 제목·설명을 Markdown 보고서의 표 칸과 본문에 기호를 바꾸지 않고 넣어, 증거에서 온 `|`·`#`이 표의 열을 늘리고 보고서의 절 머리글처럼 보이게 한다. 정상이라면 표 칸의 `|`를 `\\|`로 바꾸고 줄 앞의 Markdown 기호를 이스케이프하거나 코드로 감싸야 한다. 보고서를 읽는 사람(과 보고서를 다시 읽는 모델)은 Severity 칸의 명령 조각을 심각도로, 스크립트 주석을 보고서의 새 절로 잘못 읽는다."
setup_ko: "WS0142에서 Defender 끄기, 섀도 복사본 삭제, NETLOGON 로그온 스크립트 교체가 기록된 PowerShell transcript를 `run_strings`로 적재한 기존 사건을 열고, 명령을 제목에 그대로 적은 발견 사항 3개와 서술을 낸 뒤 보고서를 만들었다."
