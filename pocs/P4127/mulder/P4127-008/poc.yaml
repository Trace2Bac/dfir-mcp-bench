# Matrix case P4127-008: report.md.j2 is rendered with autoescape off
# (renderer.py 976-984, on purpose for .md) and puts finding titles and
# descriptions into the report's Markdown as they are: a title goes into a
# table cell of the Attack Timeline (report.md.j2 77-79) and a description
# into Appendix A as a block of its own (report.md.j2 101-118). A "|" in a
# title, as in any PowerShell pipeline, adds table columns, and a line of a
# quoted script that starts with "# " becomes a heading at the level of the
# report's own title.
#
# The case is resumed: ${DB_DIR} holds a case database and audit log written
# by this same image (scan_evidence of /ev, then run_strings tc_958bd698 on a
# PowerShell transcript of WS0142). The database was VACUUMed to a 512-byte
# page size to keep this file small; its tables are unchanged. The
# transcript, PowerShell's own format, is also written to the evidence
# folder for reference.
case_id: P4127-008
problem: P4127
