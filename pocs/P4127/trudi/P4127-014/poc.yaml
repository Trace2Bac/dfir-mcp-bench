steps:
  - tool: misc_start_execution_log
    note_ko: "준비: Report 단계까지 온 사건 기록을 이어서 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: reason_pre_report_check
    note_ko: "준비: 보고 전 검사"
  - tool: misc_write_final_report
    note_ko: "결함 호출: 최종 보고서를 쓴다"
    args:
      output_path: ${OUTSIDE}/case01/reports/CASE-001_final.md
      content: |
        # CASE-001 FS01 ransomware - final report

        ## Summary
        FS01 was encrypted on 2026-11-26 after its shadow copies were deleted.
  - tool: read_output
    note_ko: "비교 호출: 쓴 보고서를 읽는다"
    args:
      path: ${OUTSIDE}/case01/reports/CASE-001_final.md
expect:
  - step: 2
    note_ko: "보고 전 검사가 통과한다"
    regex: '"ready_to_report": true'
  - step: 3
    note_ko: "보고서를 쓴다"
    regex: '"success": true, "output_path": "[^"]*CASE-001_final\.md"'
  - step: 4
    note_ko: "서버의 발견 절 안에서 노트의 ## 줄이 최상위 절 제목으로 들어가고, 다음 발견 F-7이 그 아래에 놓인다"
    regex: '\\n## Current recorded findings\\n[^"]*\\n### F-6 [^"]*\\n## What happened\?\\n[^"]*\\n## How to recover\?\\n[^"]*\\n### F-7 '
