# Matrix case P4127-014: write_final_report renders each current finding as
# "### <id> · call <n> · <confidence>" followed by its description as is
# (tools/misc.py, the "Current recorded findings" section; the description is
# stored unchanged by core/execution_log.record_finding). A description that
# quotes evidence with Markdown headings puts "## ..." lines into the report
# at the same level as the server's own sections, so the quoted text opens
# new report sections and the next finding falls under them.
# The investigation is resumed from a trace that already holds the earlier
# phases (reason.plan, dair_assess Triage -> Collect -> Analyze -> Report,
# two findings, a reason.synthesize with no blockers), in the shapes the
# server writes, because the bench has no DAIR/review backend key. The first
# finding quotes the ransom note, which uses Markdown headings ("## What
# happened?", "## How to recover?"); the note itself is in the evidence.
case_id: P4127-014
problem: P4127
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: possible
realism_ko: "랜섬노트를 Markdown(README.md)으로 남기는 랜섬웨어가 있고, 발견에 노트 원문을 인용하는 것은 보고서에서 자연스럽다."
coverage: "partial: the findings and earlier phases come from a resumed trace (entries in the shapes the server writes), because the bench has no DAIR/review backend key; no model check, since the rendered report is not returned to a model in the server's flow"
coverage_ko: "DAIR·검토 백엔드 키가 없어 이전 단계와 발견 두 건은 이어 연 trace에서 온다(서버가 쓰는 모양 그대로). 보고서 본문은 서버 흐름에서 모델에게 돌아가지 않으므로 모델 확인은 하지 않았다"
summary: With a finding that quotes a Markdown ransom note, write_final_report writes the report with the note's "## What happened?" and "## How to recover?" lines as top-level sections inside "## Current recorded findings", so the next finding (### F-7, the shadow-copy deletion) ends up under "## How to recover?" instead of under the findings section.
summary_ko: "Markdown 랜섬노트를 인용한 발견이 있으면, write_final_report는 노트의 \"## What happened?\"·\"## How to recover?\" 줄을 \"## Current recorded findings\" 안에서 최상위 절 제목으로 쓴다. 그래서 다음 발견(### F-7, 섀도 복사본 삭제)이 발견 절이 아니라 \"## How to recover?\" 아래에 놓인다."
defect_ko: "이 서버는 발견 서술을 그대로 `### …` 아래에 넣어, 서술 안의 `## …` 줄이 서버가 쓰는 절 제목과 같은 모양이 된다. 정상이라면 인용한 원문을 코드 블록·인용으로 감싸거나 제목 기호를 바꿔 보고서 구조와 섞이지 않게 해야 한다. 보고서를 읽는 사람이나 모델은 랜섬노트 문장을 보고서의 절로, F-7을 발견 목록 밖의 내용으로 잘못 안다."
setup_ko: "Markdown 제목(## What happened? 등)이 든 랜섬노트를 증거에 두고, 그 노트를 인용한 발견과 섀도 복사본 삭제 발견이 기록된 Report 단계 trace를 이어서 연다."
