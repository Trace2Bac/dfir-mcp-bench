# Matrix case P3075-069: finalize_report, which the server instructions call
# the only way to emit conclusions, records only how many claims it was given
# (autonomy.py:503-508), so two accepted reports with opposite conclusions
# read back from get_audit_trail as the same entry.
# The server is started with FINDEVIL_LOGS_DIR=${DB_DIR}, so the call record
# is ${DB_DIR}/audit.json.
case_id: P3075-069
problem: P3075
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: common
realism_ko: "서버 지침이 결론은 `finalize_report`로만 내고 거절되면 고쳐 다시 내라고 하므로, 주장을 바꿔 여러 번 부르는 일은 흔하다."
coverage: full
summary: 'finalize_report accepts a report that the host was compromised and then a report that it was not, both of two claims, but get_audit_trail shows both entries with the same params {"claim_count": 2} and the same "ACCEPTED" result, so the record cannot tell which conclusions were finalized.'
summary_ko: "`finalize_report`가 침해됐다는 보고와 침해되지 않았다는 보고(둘 다 주장 2개)를 차례로 받아들인다. 그런데 `get_audit_trail`은 두 항목의 params `{\"claim_count\": 2}`와 결과 `ACCEPTED`를 똑같이 보여, 기록으로는 어떤 결론을 확정했는지 알 수 없다."
defect_ko: "이 서버는 결론을 내는 유일한 도구인 `finalize_report`의 기록에 입력 주장 대신 그 개수만 남긴다. 확정한 주장을 알아볼 수 있는 값(원문이나 그 해시)을 기록해야 한다. 모델은 기록을 보고 같은 보고를 두 번 확정했다고 잘못 알고, 마지막에 확정한 결론이 무엇인지 기록으로 되짚지 못한다."
setup_ko: "증거 파일은 쓰지 않았다. 결론이 반대인 추정 주장 2개짜리 묶음 두 개를 준다."
steps:
  - tool: finalize_report
    note_ko: "침해됐다는 결론을 확정한다"
    args:
      claims_json: '[{"id": "c1", "type": "initial_access", "confidence": "inference", "statement": "SSH brute force from 203.0.113.50 led to a deploy login"}, {"id": "c2", "type": "persistence", "confidence": "inference", "statement": "attacker added cron job /etc/cron.d/kworker"}]'
  - tool: finalize_report
    note_ko: "결함 호출: 개수가 같고 결론이 반대인 묶음을 확정한다"
    args:
      claims_json: '[{"id": "c1", "type": "initial_access", "confidence": "inference", "statement": "no successful login from external addresses"}, {"id": "c2", "type": "persistence", "confidence": "inference", "statement": "cron.d holds only distribution default jobs"}]'
  - tool: get_audit_trail
    note_ko: "두 확정의 기록을 다시 읽는다"
    args:
      filter_tool: finalize_report
expect:
  - step: 1
    note_ko: "첫 보고는 침해 결론으로 받아들여진다"
    contains: "SSH brute force from 203.0.113.50 led to a deploy login"
  - step: 2
    note_ko: "둘째 보고는 반대 결론으로 받아들여진다"
    contains: "no successful login from external addresses"
  - step: 3
    note_ko: "기록에 두 확정이 모두 있다"
    contains: "(2 matching entries"
  - step: 3
    note_ko: "두 항목의 params와 결과가 똑같다"
    regex: '(?s)params: \{"claim_count": 2\}\n  result: ACCEPTED: 0 rejected, 0 contradictions\n.*params: \{"claim_count": 2\}\n  result: ACCEPTED: 0 rejected, 0 contradictions'
  - step: 3
    note_ko: "기록에 확정한 결론이 없다"
    not_regex: "brute force|no successful login|cron"
