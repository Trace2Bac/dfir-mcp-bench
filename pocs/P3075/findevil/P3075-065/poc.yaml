# Matrix case P3075-065: extract_iocs records only the length of the text it
# was given (threat_intel.py:261), so two calls on different log lines of the
# same length, which return different IPs, read back from get_audit_trail with
# the same params and the same result.
# The server is started with FINDEVIL_LOGS_DIR=${DB_DIR}, so the call record
# is ${DB_DIR}/audit.json.
case_id: P3075-065
problem: P3075
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: common
realism_ko: "서버 지침이 IOC를 찾을 때마다 `extract_iocs`로 피벗하라고 하므로, 형식이 같은 로그 줄마다 이 도구를 부르는 일은 흔하다."
coverage: full
summary: 'extract_iocs on two auth.log lines of the same length returns 203.0.113.17 and then 198.51.100.9, but get_audit_trail shows both entries as {"text_len": 96} with "1 IOCs", so the record cannot tell what text was scanned or which IOC came out.'
summary_ko: "길이가 같은 `auth.log` 두 줄에 `extract_iocs`를 부르면 `203.0.113.17`과 `198.51.100.9`가 나온다. 그런데 `get_audit_trail`은 두 항목을 똑같이 `{\"text_len\": 96}`과 `1 IOCs`로 보여, 기록으로는 어떤 글을 검사해 어떤 IOC가 나왔는지 알 수 없다."
defect_ko: "이 서버는 `extract_iocs`의 기록에 입력 글 대신 그 길이만 남긴다. 입력을 알아볼 수 있는 값(원문이나 그 해시)을 기록해야 한다. 모델은 기록을 보고 같은 글을 두 번 검사했다고 잘못 알고, 어느 IOC를 피벗했는지 되짚지 못한다."
setup_ko: "증거 파일은 쓰지 않았다. 출발지 IP만 다르고 길이가 같은 `auth.log` 두 줄을 입력으로 준다."
steps:
  - tool: extract_iocs
    note_ko: "첫 로그 줄에서 IOC를 뽑는다"
    args:
      text: "Mar  3 02:14:07 web01 sshd[2211]: Accepted password for deploy from 203.0.113.17 port 51822 ssh2"
  - tool: extract_iocs
    note_ko: "결함 호출: 길이가 같은 다른 로그 줄에서 IOC를 뽑는다"
    args:
      text: "Mar  3 02:14:07 web01 sshd[2211]: Accepted password for deploy from 198.51.100.9 port 51822 ssh2"
  - tool: get_audit_trail
    note_ko: "두 호출의 기록을 다시 읽는다"
    args:
      filter_tool: extract_iocs
expect:
  - step: 1
    note_ko: "첫 호출은 `203.0.113.17`을 낸다"
    contains: "`203.0.113.17`"
  - step: 2
    note_ko: "둘째 호출은 `198.51.100.9`를 낸다"
    contains: "`198.51.100.9`"
  - step: 3
    note_ko: "기록에 두 호출이 모두 있다"
    contains: "(2 matching entries"
  - step: 3
    note_ko: "두 항목의 params와 결과가 똑같다"
    regex: '(?s)params: \{"text_len": (\d+)\}\n  result: 1 IOCs\n.*params: \{"text_len": \1\}\n  result: 1 IOCs'
  - step: 3
    note_ko: "기록에 뽑힌 IP가 없다"
    not_regex: "203\\.0\\.113\\.17|198\\.51\\.100\\.9"
