# Matrix case P3075-004: findevil writes an audit entry only where a tool body
# reaches its own _audit call at the end. file_info returns early for a path
# outside the evidence folder and for a file that does not exist, so of three
# file_info calls only the one that succeeded is in the record that
# get_audit_trail reads back as "every tool call made during this session".
# The server is started with FINDEVIL_LOGS_DIR=${DB_DIR}, so the call record
# is ${DB_DIR}/audit.json.
case_id: P3075-004
problem: P3075
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: common
realism_ko: "증거 밖 경로와 없는 파일 이름은 모델이 경로를 잘못 짓거나 증거 속 문구를 따라 `path` 인자에 넣는 일로 흔히 들어온다."
coverage: full
summary: 'Of three file_info calls (a path outside the evidence folder, a file that does not exist, a file that exists), get_audit_trail reports one, because the two calls that returned early never reached _audit.'
summary_ko: "`file_info`를 증거 밖 경로, 없는 파일, 있는 파일로 세 번 불렀는데 `get_audit_trail`은 1건만 보여 준다. 앞에서 돌아간 두 호출은 `_audit`에 닿지 않았기 때문이다."
defect_ko: "이 서버는 도구 본문 끝의 `_audit`에 닿은 호출만 기록하고, 경로 검사나 파일 확인에서 돌아간 호출은 기록하지 않는다. 받은 호출은 결과와 관계없이 모두 기록해야 한다. 모델은 기록을 보고 증거 밖 경로를 요청한 적이 없다고, 이 세션의 `file_info` 호출이 한 번뿐이라고 잘못 안다."
setup_ko: "증거 폴더에 `auth.log` 하나를 두었다."
fixture:
  - path: case01/var/log/auth.log
    text: |
      Mar  3 02:11:41 web01 sshd[2198]: Failed password for invalid user admin from 203.0.113.50 port 51790 ssh2
      Mar  3 02:14:07 web01 sshd[2211]: Accepted password for deploy from 203.0.113.50 port 51822 ssh2
steps:
  - tool: file_info
    note_ko: "결함 호출: 증거 밖 경로"
    args:
      path: /etc/shadow
  - tool: file_info
    note_ko: "결함 호출: 증거 안의 없는 파일"
    args:
      path: ${EVIDENCE}/case01/var/log/auth.log.2.gz
  - tool: file_info
    note_ko: "있는 파일"
    args:
      path: ${EVIDENCE}/case01/var/log/auth.log
  - tool: get_audit_trail
    note_ko: "`file_info` 호출 기록을 다시 읽는다"
    args:
      filter_tool: file_info
expect:
  - step: 1
    note_ko: "증거 밖 경로는 거부된다"
    contains: "Error: Access denied: /etc/shadow"
  - step: 2
    note_ko: "없는 파일은 찾지 못했다고 돌아온다"
    contains: "File not found:"
  - step: 3
    note_ko: "있는 파일은 정상으로 처리된다"
    contains: "## File Type"
  - step: 4
    note_ko: "세 번 부른 `file_info`가 기록에는 1건뿐이다"
    contains: "(1 matching entries"
  - step: 4
    note_ko: "호출 수 집계도 1이다"
    contains: "`file_info`: 1"
  - step: 4
    note_ko: "남은 1건은 성공한 호출이다"
    regex: 'params: \{"path": "[^"]*/case01/var/log/auth\.log"\}'
  - file_not_contains: ${DB_DIR}/audit.json
    note_ko: "기록 파일에 증거 밖 경로 호출이 없다"
    text: "/etc/shadow"
  - file_not_contains: ${DB_DIR}/audit.json
    note_ko: "기록 파일에 없는 파일 호출이 없다"
    text: "auth.log.2.gz"
