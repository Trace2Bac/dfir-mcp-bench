# Matrix case P3075-023: findevil writes an audit entry only where a tool body
# reaches its own _audit call. auth_failed_logins catches FileNotFoundError and
# ValueError from _read_auth_log but not the PermissionError that read_text
# raises on a log the server account cannot read, so that call ends in an
# exception and leaves nothing in the record.
# The bench container runs the server as a non-root user, so a fixture with
# mode 0000 cannot be read (as in P4095-018).
# The server is started with FINDEVIL_LOGS_DIR=${DB_DIR}, so the call record
# is ${DB_DIR}/audit.json.
case_id: P3075-023
problem: P3075
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: possible
realism_ko: "`auth.log` 계열은 기본 권한이 `0640 root:adm`이라, 권한을 지켜 마운트한 증거를 root가 아닌 계정으로 돌리는 서버는 회전된 로그를 읽지 못할 수 있다."
coverage: "partial: only the PermissionError path is shown; the _run_tool time-out path (subprocess.TimeoutExpired) is not"
coverage_ko: "읽기 권한 예외 경로만 보인다. `_run_tool`의 시간 초과 예외 경로는 보이지 않는다"
summary: 'auth_failed_logins on a readable auth.log and then on an unreadable auth.log.1 gives a result and a PermissionError, but get_audit_trail lists only the first call, because the second ended in an exception before _audit.'
summary_ko: "읽을 수 있는 `auth.log`와 읽을 수 없는 `auth.log.1`에 차례로 `auth_failed_logins`를 부르면 결과 하나와 `PermissionError` 하나가 나온다. 그런데 `get_audit_trail`은 첫 호출만 보여 준다. 둘째 호출은 `_audit` 앞에서 예외로 끝났기 때문이다."
defect_ko: "이 서버는 처리하지 않은 예외로 끝난 호출을 기록하지 않는다. 받은 호출은 실패하더라도 실패했다는 사실과 함께 기록해야 한다. 모델은 기록을 보고 `auth.log.1`을 분석하려 한 적이 없다고, 실패한 호출 없이 조사가 이어졌다고 잘못 안다."
setup_ko: "읽을 수 있는 `auth.log`와 읽기 권한이 없는 회전 로그 `auth.log.1`을 두었다."
fixture:
  - path: case01/var/log/auth.log
    text: |
      Mar  3 02:11:41 web01 sshd[2198]: Failed password for invalid user admin from 203.0.113.50 port 51790 ssh2
      Mar  3 02:11:44 web01 sshd[2198]: Failed password for invalid user admin from 203.0.113.50 port 51790 ssh2
      Mar  3 02:14:07 web01 sshd[2211]: Accepted password for deploy from 203.0.113.50 port 51822 ssh2
  - path: case01/var/log/auth.log.1
    text: |
      Feb 24 23:58:12 web01 sshd[1874]: Failed password for root from 198.51.100.77 port 40112 ssh2
      Feb 24 23:58:15 web01 sshd[1874]: Failed password for root from 198.51.100.77 port 40112 ssh2
    mode: "0000"
steps:
  - tool: auth_failed_logins
    note_ko: "읽을 수 있는 로그"
    args:
      path: ${EVIDENCE}/case01/var/log/auth.log
  - tool: auth_failed_logins
    note_ko: "결함 호출: 읽기 권한이 없는 회전 로그"
    args:
      path: ${EVIDENCE}/case01/var/log/auth.log.1
  - tool: get_audit_trail
    note_ko: "`auth_failed_logins` 호출 기록을 다시 읽는다"
    args:
      filter_tool: auth_failed_logins
expect:
  - step: 1
    note_ko: "첫 호출은 실패 로그인을 분석한다"
    contains: "203.0.113.50"
  - step: 2
    note_ko: "둘째 호출은 읽기 권한 예외로 끝난다"
    contains: "Permission denied"
  - step: 3
    note_ko: "두 번 부른 `auth_failed_logins`가 기록에는 1건뿐이다"
    contains: "`auth_failed_logins`: 1"
  - step: 3
    note_ko: "기록에 `auth.log.1` 호출이 없다"
    not_contains: "auth.log.1"
  - file_not_contains: ${DB_DIR}/audit.json
    note_ko: "기록 파일에도 `auth.log.1` 호출이 없다"
    text: "auth.log.1"
