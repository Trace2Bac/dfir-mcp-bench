steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3075-105
      output_path: ${DB_DIR}/analysis/P3075-105_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: hash_verify_evidence_hash
    note_ko: "비교 호출: usb.dd를 자기 획득 기록의 MD5·SHA1로 검증한다"
    args:
      evidence_path: ${EVIDENCE}/usb.dd
      expected_md5: dadee79bae735ca3fadf50940fc59579
      expected_sha1: c30348f39bc2e59df4c166297a0dd1e2d50c0121
  - tool: hash_verify_evidence_hash
    note_ko: "결함 호출: usb.dd를 두 번째 USB 기록의 MD5·SHA1로 검증한다"
    args:
      evidence_path: ${EVIDENCE}/usb.dd
      expected_md5: 5c2f0a2b7e4b0e1d9a3c6f8e1b2d4a70
      expected_sha1: 8d1e5b3a9c2f7e6d4b0a1c3e5f7092b4d6e8a1c3
  - tool: read_output
    note_ko: "비교 호출: trace에 남은 검증 기록을 읽는다"
    args:
      path: ${DB_DIR}/analysis/P3075-105_trace.json
      query: hash_verify_evidence_hash VERIFIED
expect:
  - step: 2
    note_ko: "첫 검증은 MD5와 SHA1이 모두 맞는다"
    regex: '"md5_match": true, "sha1_match": true, "integrity_verified": true'
  - step: 3
    note_ko: "두 번째 검증은 MD5와 SHA1이 모두 맞지 않는다"
    regex: '"md5_match": false, "sha1_match": false, "integrity_verified": false'
  - step: 4
    note_ko: "trace를 다시 읽으면 두 검증이 같은 결론 줄로만 남아 있다"
    regex: '"conclusion\\": \\"VERIFIED: [^ ]*/usb\.dd sha256=(?P<h>[0-9a-f]{64})\\",[\s\S]*"conclusion\\": \\"VERIFIED: [^ ]*/usb\.dd sha256=(?P=h)\\",'
  - file_not_contains: ${DB_DIR}/analysis/P3075-105_trace.json
    note_ko: "두 번째 호출에 준 기대 MD5는 trace 어디에도 없다"
    text: 5c2f0a2b7e4b0e1d9a3c6f8e1b2d4a70
  - file_not_contains: ${DB_DIR}/analysis/P3075-105_trace.json
    note_ko: "두 번째 호출에 준 기대 SHA1도 trace 어디에도 없다"
    text: 8d1e5b3a9c2f7e6d4b0a1c3e5f7092b4d6e8a1c3
