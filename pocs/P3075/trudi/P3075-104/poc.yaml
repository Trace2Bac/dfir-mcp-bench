# Matrix case P3075-104: read_output records its call as
# "read.output --output <path> query=<query[:80]> columns=... where=<where[:60]>"
# (tools/read_output.py). The query is cut to 80 characters, and max_rows and
# max_chars, which change what the call returns, are not written at all. Two
# reads of the same manifest that differ only in max_rows, with a query whose
# last terms fall past character 80, leave the same cmd.
# The manifest is written in this PoC by hash_directory (output_manifest).
case_id: P3075-104
problem: P3075
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "해시 매니페스트나 파서 CSV에서 관심 파일 이름을 여러 낱말로 한 번에 찾는 질의는 80자를 넘기 쉽고, 결과가 많을 때 max_rows로 줄여 읽는 것도 도구 설명이 안내하는 쓰임이다."
coverage: full
summary: 'Two read_output calls on the same Documents hash manifest with a 102-character query, one with max_rows 3 (3 rows and a row cap) and one with the default (all matching rows), are both recorded as the same cmd "read.output --output <path> query=<first 80 characters>", without max_rows and without the query terms "confidential q3 merger".'
summary_ko: "같은 Documents 해시 매니페스트를 102자 질의로 `read_output`할 때, `max_rows` 3(3행과 행 제한 표시)과 기본값(맞는 행 전부)으로 부른 두 호출이 trace에는 똑같이 `read.output --output <경로> query=<앞 80자>` 하나로 남는다. `max_rows`도, 질의 끝의 \"confidential q3 merger\"도 없다."
defect_ko: "이 서버는 `read_output` 기록에 질의를 80자에서 잘라 적고, 결과를 바꾸는 `max_rows`, `max_chars`를 적지 않는다. 정상이라면 받은 인자를 그대로 기록해야 한다. 기록을 읽는 모델과 검토자는 두 읽기를 같은 요청으로 잘못 알고, 기록에 적힌 cmd대로 다시 읽으면 다른 순위와 행 수가 나온다."
setup_ko: "사용자 Documents 폴더에 급여, 계약, VPN, 인수합병 관련 이름의 파일 12개를 넣고, PoC 안에서 hash_directory로 그 매니페스트 CSV를 analysis/에 만든다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
