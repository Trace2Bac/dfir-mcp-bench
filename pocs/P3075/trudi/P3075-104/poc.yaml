steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3075-104
      output_path: ${DB_DIR}/analysis/P3075-104_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: hash_directory
    note_ko: "준비: Documents 폴더의 해시 매니페스트 CSV를 analysis/에 만든다"
    args:
      directory: ${EVIDENCE}/Users/jdoe/Documents
      output_manifest: ${DB_DIR}/analysis/documents_sha256.csv
  - tool: read_output
    note_ko: "결함 호출: 관심 낱말 102자 질의로 상위 3행만 읽는다"
    args:
      path: ${DB_DIR}/analysis/documents_sha256.csv
      query: payroll salary invoice contract vpn password credentials backup customer export confidential q3 merger
      max_rows: 3
  - tool: read_output
    note_ko: "결함 호출: 같은 질의를 기본 행 수로 읽는다"
    args:
      path: ${DB_DIR}/analysis/documents_sha256.csv
      query: payroll salary invoice contract vpn password credentials backup customer export confidential q3 merger
  - tool: read_output
    note_ko: "비교 호출: trace에 적힌 cmd 그대로(앞 80자 질의, 기본 행 수) 다시 읽는다"
    args:
      path: ${DB_DIR}/analysis/documents_sha256.csv
      query: "payroll salary invoice contract vpn password credentials backup customer export "
expect:
  - step: 3
    note_ko: "max_rows 3인 읽기는 행 제한에 걸려 잘렸다"
    regex: '"body": "file,sha256(\x5cn/[^"]*?){3}\x5cn\x5cu2026\[row cap\]", "truncated": true'
  - step: 4
    note_ko: "기본값 읽기는 merger 파일까지 맞는 행을 더 돌려주고 잘리지 않았다"
    regex: 'merger_dd_checklist\.xlsx[^"]*", "truncated": false'
  - file_regex: ${DB_DIR}/analysis/P3075-104_trace.json
    note_ko: "trace에는 두 읽기가 앞 80자에서 잘린 질의와 같은 cmd로 남고 max_rows는 없다"
    pattern: '"cmd": "read\.output --output [^ "]*/analysis/documents_sha256\.csv query=payroll salary invoice contract vpn password credentials backup customer export ",[\s\S]*"cmd": "read\.output --output [^ "]*/analysis/documents_sha256\.csv query=payroll salary invoice contract vpn password credentials backup customer export ",'
  - file_not_contains: ${DB_DIR}/analysis/P3075-104_trace.json
    note_ko: "trace에 max_rows는 어디에도 없다"
    text: max_rows
  - step: 5
    note_ko: "기록된 cmd대로 다시 읽어도 결과는 나온다(payroll 파일 포함)"
    contains: "payroll_2024_q3.xlsx"
  - step: 5
    note_ko: "그러나 앞의 두 읽기에 있던 인수합병 파일은 나오지 않는다(기록과 실제 요청이 다르다)"
    not_contains: "merger"
