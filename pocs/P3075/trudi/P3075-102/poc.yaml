# Matrix case P3075-102: the trace entry has no field for the MCP arguments.
# A pure-Python tool that does not log itself gets the middleware's baseline
# entry (core/middleware.py _trace_success_baseline), whose cmd is only
# "<py>:<tool name>". correlate_network_to_process(ip=...) filters
# connections by the IP it is given, but the entry keeps neither the IP nor
# the port, so two calls for different addresses leave entries that differ
# only in call_id and time. The exception entry (_trace_exception, argument
# names and types only) is not run here.
case_id: P3075-102
problem: P3075
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "의심 IP마다 correlate_network_to_process로 그 연결을 맺은 프로세스를 찾는 것은 흔한 흐름이고, 기록 코드가 없는 순수 Python 도구는 모두 같은 기본 항목만 남긴다."
coverage: "partial: the baseline entry of a pure-Python tool only; the exception entry, which keeps argument names and types but no values, is not run"
coverage_ko: "순수 Python 도구의 기본 항목만 보였다. 인자 이름과 자료형만 남기는 예외 항목은 실행하지 않았다."
summary: 'correlate_network_to_process called for 203.0.113.7 and then for 198.51.100.23 leaves two trace entries with the same cmd "<py>:correlate_network_to_process" and the same output, and neither IP appears anywhere in the trace.'
summary_ko: "`correlate_network_to_process`를 203.0.113.7로 한 번, 198.51.100.23으로 한 번 부르면 trace에는 cmd가 똑같이 `<py>:correlate_network_to_process`이고 출력도 같은 항목 두 개가 남고, 두 IP는 trace 어디에도 없다."
defect_ko: "이 서버는 기록 코드가 없는 도구의 호출을 도구 이름만 적은 항목으로 남기고, 모델이 준 인자(`ip`, `port`)를 적지 않는다. 정상이라면 받은 인자를 그대로 기록에 남겨야 한다. 기록을 읽는 모델과 검토자는 어느 주소를 조회한 호출인지 알 수 없고, 다른 IP의 조회 두 건을 같은 조회의 반복으로 잘못 안다."
setup_ko: "새 사건 trace를 열고, 아직 netscan 결과가 없는 상태에서 두 의심 IP를 차례로 조회한다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3075-102
      output_path: ${DB_DIR}/analysis/P3075-102_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: correlate_network_to_process
    note_ko: "결함 호출: 첫 번째 의심 IP의 연결과 프로세스를 찾는다"
    args:
      ip: 203.0.113.7
  - tool: correlate_network_to_process
    note_ko: "결함 호출: 두 번째 의심 IP의 연결과 프로세스를 찾는다"
    args:
      ip: 198.51.100.23
  - tool: read_output
    note_ko: "비교 호출: trace에 남은 두 호출의 기록을 읽는다"
    args:
      path: ${DB_DIR}/analysis/P3075-102_trace.json
      query: correlate_network_to_process
expect:
  - step: 2
    note_ko: "첫 호출은 성공했고 호출 번호를 받았다"
    regex: '"success": true, "connections": \[\], "pids_indexed": 0, "_trudi_call_id": 3'
  - step: 3
    note_ko: "두 번째 호출도 성공했고 다른 호출 번호를 받았다"
    regex: '"success": true, "connections": \[\], "pids_indexed": 0, "_trudi_call_id": 4'
  - step: 4
    note_ko: "trace를 다시 읽으면 두 호출이 같은 cmd로만 남아 있다"
    regex: 'cmd\\": \\"<py>:correlate_network_to_process\\"[\s\S]*cmd\\": \\"<py>:correlate_network_to_process\\"'
  - file_regex: ${DB_DIR}/analysis/P3075-102_trace.json
    note_ko: "두 항목은 call_id와 시각만 다르고 cmd와 출력이 같다"
    pattern: '"call_id": 3,\s*"type": "tool_call",\s*"ts": "[^"]+",\s*"cmd": "<py>:correlate_network_to_process",[^{}]*"stdout_excerpt": (?P<o>[^
]*)
[\s\S]*"call_id": 4,\s*"type": "tool_call",\s*"ts": "[^"]+",\s*"cmd": "<py>:correlate_network_to_process",[^{}]*"stdout_excerpt": (?P=o)
'
  - file_not_contains: ${DB_DIR}/analysis/P3075-102_trace.json
    note_ko: "첫 호출에 준 IP는 trace 어디에도 없다"
    text: 203.0.113.7
  - file_not_contains: ${DB_DIR}/analysis/P3075-102_trace.json
    note_ko: "두 번째 호출에 준 IP도 trace 어디에도 없다"
    text: 198.51.100.23
