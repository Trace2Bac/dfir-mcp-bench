# Matrix case P1177-001: finalize_report blocks when
# _find_contradiction_patterns finds any contradiction, and that check looks
# at claim types and fields only, not at confidence. The rejection text, the
# tool description and the server instructions all say to re-investigate or
# downgrade the claim's confidence to inference/uncertain and call again, but
# a pair rejected for contradicting each other is rejected again after both
# are downgraded.
case_id: P1177-001
problem: P1177
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: possible
realism_ko: "앞뒤 조사 결과를 합치다 같은 로그에 대해 서로 맞지 않는 두 주장을 `claims_json`에 넣는 일은 모델의 실수로 있을 수 있고, 거절되면 안내대로 확신도를 낮춰 다시 부르게 된다."
coverage: full
summary: A claim set with brute_force_from_ip and no_failed_logins on the same log_path is rejected for the contradiction with the advice to "downgrade its confidence"; after both claims are downgraded to inference, finalize_report rejects it again for the same contradiction and repeats the same advice.
summary_ko: "같은 `log_path`의 `brute_force_from_ip`와 `no_failed_logins`를 넣은 주장 묶음은 모순으로 거절되고 \"downgrade its confidence\" 안내가 나온다. 두 주장을 모두 `inference`로 낮춰 다시 넣어도 `finalize_report`는 같은 모순으로 다시 거절하고 같은 안내를 되풀이한다."
defect_ko: "이 서버의 `finalize_report`는 모순 검사에서 확신도를 보지 않는데, 거절 응답과 도구 설명, 서버 지침은 확신도를 낮추면 통과할 수 있다고 안내한다. 모순으로 거절할 때는 확신도를 낮춰도 풀리지 않으며 한쪽 주장을 고치거나 빼야 한다고 알려야 한다. 모델은 안내대로 확신도를 낮추면 된다고 잘못 알고 같은 호출을 되풀이한다."
setup_ko: "`203.0.113.7`의 실패 로그인 다섯 줄이 든 `auth.log`를 두었다."
fixture:
  - path: var/log/auth.log
    text: |
      Mar  3 02:11:04 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:07 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:10 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:12 web01 sshd[2214]: Invalid user admin from 203.0.113.7 port 51040
      Mar  3 02:11:14 web01 sshd[2214]: Failed password for invalid user admin from 203.0.113.7 port 51040 ssh2
steps:
  - tool: finalize_report
    note_ko: "서로 모순되는 두 주장을 confirmed로 넣는다"
    args:
      claims_json: '[{"id": "c1", "type": "brute_force_from_ip", "confidence": "confirmed", "statement": "SSH brute force from 203.0.113.7", "log_path": "${EVIDENCE}/var/log/auth.log", "ip": "203.0.113.7", "min_attempts": 5}, {"id": "c2", "type": "no_failed_logins", "confidence": "confirmed", "statement": "no failed logins in auth.log", "log_path": "${EVIDENCE}/var/log/auth.log", "evidence": "var/log/auth.log"}]'
  - tool: finalize_report
    note_ko: "결함 호출: 안내대로 두 주장의 확신도를 inference로 낮춰 다시 넣는다"
    args:
      claims_json: '[{"id": "c1", "type": "brute_force_from_ip", "confidence": "inference", "statement": "SSH brute force from 203.0.113.7", "log_path": "${EVIDENCE}/var/log/auth.log", "ip": "203.0.113.7", "min_attempts": 5}, {"id": "c2", "type": "no_failed_logins", "confidence": "inference", "statement": "no failed logins in auth.log", "log_path": "${EVIDENCE}/var/log/auth.log", "evidence": "var/log/auth.log"}]'
expect:
  - step: 1
    note_ko: "첫 호출은 모순으로 거절된다"
    contains: "## Contradictions (1)"
  - step: 1
    note_ko: "확신도를 낮추라는 안내가 나온다"
    contains: "downgrade its confidence, then call `finalize_report` again"
  - step: 2
    note_ko: "확신도를 낮춘 뒤에도 거절된다"
    contains: "# ❌ Finalization REJECTED — 2 claim(s) inspected"
  - step: 2
    note_ko: "거절 이유는 같은 모순 하나뿐이다"
    contains: "## Contradictions (1)"
  - step: 2
    note_ko: "확신도 때문에 막힌 주장은 없다"
    not_contains: "Unsupported CONFIRMED claims"
  - step: 2
    note_ko: "그런데도 같은 '확신도를 낮추라'는 안내를 되풀이한다"
    contains: "downgrade its confidence, then call `finalize_report` again"
