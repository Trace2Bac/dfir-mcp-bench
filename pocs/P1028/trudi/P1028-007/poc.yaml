# Matrix case P1028-007: the repeat-call gate keeps its counts in a module
# variable of the server process (core/middleware.py _repeat_state). Neither
# misc_clear_case_run, which resets a case "for a fresh investigation run",
# nor a new misc_start_execution_log clears it. A search that was refused
# after five identical runs in the first run is refused on its very first
# try in the fresh run, before it is executed at all.
# The evidence is a PSReadLine console history as Windows writes it; the
# search (mimikatz) has no match, a normal negative search.
# The fresh run is opened as a new case folder (CASE-002): reopening CASE-001
# at the same path was seen to resume the old trace (entries_recovered 10),
# because the in-memory log flushed its entries back to the deleted file when
# clear_case_run's own call was recorded; that is a separate behaviour.
case_id: P1028-007
problem: P1028
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "`clear_case_run`은 같은 사건을 처음부터 다시 조사하라고 둔 도구이고, 다시 조사할 때 앞 실행과 같은 검색을 먼저 돌리는 것은 자연스럽다. 앞 실행에서 같은 음성 검색을 되풀이해 게이트에 걸리는 일은 서버가 이 게이트를 만든 이유(같은 검색 수백 번 반복)대로 실제로 일어난다."
coverage: full
summary: After strings_grep is refused by the repeat-call gate in one run, misc_clear_case_run and a new misc_start_execution_log open a fresh run, yet the same strings_grep is refused on its first call there with "has run 4 times with an IDENTICAL result", because the gate's counts live in the server process and no reset clears them.
summary_ko: "한 실행에서 `strings_grep`이 반복 호출 게이트에 막힌 뒤 `misc_clear_case_run`과 새 `misc_start_execution_log`로 조사를 새로 열어도, 새 실행의 첫 `strings_grep`이 실행되지 않고 \"4번 같은 결과로 실행됐다\"는 이유로 막힌다. 게이트의 횟수가 서버 프로세스 메모리에 남고 어느 초기화도 이를 지우지 않기 때문이다."
defect_ko: "이 서버는 반복 호출 횟수를 프로세스 전체 변수에 두고 사건 초기화나 새 기록 시작 때 지우지 않아, 새 조사에서 한 번도 돌리지 않은 검색을 앞 조사의 횟수로 거부한다. 새 실행을 열면 반복 상태도 그 실행 기준으로 새로 시작해야 한다. 모델은 이 검색을 이번 조사에서 이미 여러 번 돌렸다고 알고, 실행하지 않은 검색을 음성 결과로 기록하거나 건너뛴다."
setup_ko: "증거 폴더에 PowerShell 콘솔 기록 파일 하나를 두고, 사건 기록을 연 뒤 이 파일에서 `mimikatz`를 찾는 같은 `strings_grep`을 여섯 번 부른다. 그 뒤 `misc_clear_case_run`으로 사건을 초기화하고 `misc_start_execution_log`로 새 사건 기록을 열어 같은 검색을 한 번 부른다."
fixture:
- path: cases/CASE-001/analysis
  root: outside
  dir: true
- path: cases/CASE-002/analysis
  root: outside
  dir: true
- path: C/Users/jdoe/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt
  text: "Get-Service | Where-Object {$_.Status -eq 'Running'}\r\ncd C:\\Users\\jdoe\\Downloads\r\nExpand-Archive .\\tools.zip -DestinationPath C:\\ProgramData\\tools\r\nGet-ChildItem C:\\ProgramData\\tools\r\nnet user /domain\r\nnltest /dclist:corp.local\r\nRemove-Item .\\tools.zip\r\n"
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 첫 조사의 기록을 연다"
  args:
    case_id: CASE-001
    output_path: ${OUTSIDE}/cases/CASE-001/analysis/CASE-001_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-001
    launch_dashboard: false
- tool: strings_grep
  note_ko: "첫 조사의 첫 검색: 실행되어 0건을 돌려준다"
  args: &grep
    file_path: ${EVIDENCE}/C/Users/jdoe/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt
    pattern: mimikatz
- tool: strings_grep
  args: *grep
  note_ko: "준비: 같은 검색을 되풀이한다(2번째)"
- tool: strings_grep
  args: *grep
  note_ko: "준비: 같은 검색을 되풀이한다(3번째)"
- tool: strings_grep
  args: *grep
  note_ko: "준비: 같은 검색을 되풀이한다(4번째)"
- tool: strings_grep
  args: *grep
  note_ko: "준비: 같은 검색을 되풀이한다(5번째)"
- tool: strings_grep
  args: *grep
  note_ko: "준비: 6번째 같은 검색은 첫 조사 안에서 게이트에 막힌다"
- tool: misc_clear_case_run
  note_ko: "사건을 새 조사용으로 초기화한다"
  args:
    case_dir: ${OUTSIDE}/cases/CASE-001
- tool: misc_start_execution_log
  note_ko: "새 조사의 기록을 새 사건 폴더에 연다"
  args:
    case_id: CASE-002
    output_path: ${OUTSIDE}/cases/CASE-002/analysis/CASE-002_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-002
    launch_dashboard: false
- tool: strings_grep
  args: *grep
  note_ko: "결함 호출: 새 조사의 첫 검색"
expect:
- step: 2
  note_ko: 첫 조사의 첫 검색은 실행되어 0건을 돌려준다
  regex: '"success": true, "file": "[^"]*ConsoleHost_history.txt", "pattern": "mimikatz", "match_count": 0'
- step: 7
  note_ko: 첫 조사 안에서는 다섯 번 같은 결과 뒤 막힌다
  contains: 'repeat_call_gate: this exact strings_grep call has run 4 times with an IDENTICAL result'
- step: 9
  note_ko: 새 조사의 기록은 비어 있는 새 기록이다
  regex: '"success": true, "case_id": "CASE-002", "log_path": "[^"]*", "entries_recovered": 0, "resumed": false'
- step: 10
  note_ko: 새 조사의 첫 검색이 실행되지 않고 앞 조사의 횟수로 막힌다
  contains: 'Tool strings_grep blocked: repeat_call_gate: this exact strings_grep call has run 4 times with an IDENTICAL result'
- file_regex: ${OUTSIDE}/cases/CASE-002/analysis/CASE-002_trace.json
  note_ko: 새 조사의 trace에 이 검색이 반복 게이트로 막힌 기록이 남는다
  pattern: '"type": "tool_blocked"[^}]*repeat_call_gate'
- file_not_contains: ${OUTSIDE}/cases/CASE-002/analysis/CASE-002_trace.json
  note_ko: 새 조사의 trace에는 이 검색을 실행한 기록이 없다
  text: '"mcp_tool": "strings_grep"'
