# Matrix case P1028-003: after a server restart the trace is bound lazily:
# the first record_* call runs ExecutionLog._auto_recover, which reopens the
# trace that session.json names. dair_assess builds the DAIR model's input
# (current phase, EVIDENCE AVAILABLE, WORK ORDER STATUS, evidence-kind
# filtering) BEFORE its first trace write (record_call_initiated inside
# _ask_claude), so the first dair_assess after a restart runs on an empty,
# unbound log: the phase is taken from the agent's phase_stack ("[]" ->
# Triage) instead of the recorded Collect, the evidence inventory is
# undetermined, the unrun work order is not listed, and a tool the case's
# evidence cannot feed (vol.pslist on a disk-triage case) is not filtered.
# The second, identical call sees all of it.
# The restart is prepared as the previous session leaves it: the trace in the
# shape the server writes (trace_initialized, run_profile, call_initiated, and
# a dair_call that pushed Triage -> Collect with ez.lecmd and ez.pecmd as the
# Collect work order, stamped dair_phase Collect), and session.json in
# TRUDI_CACHE_DIR with the two keys _save_session writes (case_id and the
# absolute trace path). The DAIR answers come from the Anthropic stub; the
# model's input for each call is recorded by the server on the dair_call
# entry (inputs.user_message), which the file checks read.
case_id: P1028-003
problem: P1028
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "서버를 다시 띄운 뒤 `session.json`으로 앞 trace를 되살리는 것은 서버가 설계한 정상 흐름이고, `start_execution_log` 없이 바로 `dair_assess`를 부르는 것도 도구 설명이 첫 호출에 `phase_stack='[]'`를 주라고 안내하는 흐름과 같다."
coverage: full
summary: On the first dair_assess after a restart the server builds the DAIR input before it recovers the trace, so the recorded input says CURRENT PHASE Triage (the trace is in Collect) with no EVIDENCE AVAILABLE or WORK ORDER STATUS line, and the response keeps vol.pslist on a disk-triage case with evidence_kinds []; the same call repeated sees phase Collect, the triage evidence, the unrun ez.lecmd and ez.pecmd, and drops vol.pslist.
summary_ko: "서버를 다시 띄운 뒤 첫 `dair_assess`는 trace를 되살리기 전에 DAIR 입력을 만들어, 기록된 입력이 현재 단계를 Triage로 적고(trace는 Collect) `EVIDENCE AVAILABLE`과 `WORK ORDER STATUS` 줄이 없다. 응답은 디스크 트리아지 사건에서 `vol.pslist`를 그대로 두고 `evidence_kinds`는 빈 목록이다. 같은 호출을 다시 하면 Collect 단계, 트리아지 증거, 미실행 `ez.lecmd`·`ez.pecmd`가 보이고 `vol.pslist`는 빠진다."
defect_ko: "이 서버는 `dair_assess`에서 모델 입력을 만든 뒤에야 첫 기록 단계에서 trace를 되살려, 재시작 직후 첫 판단이 빈 기록을 바탕으로 이루어진다. 입력을 만들기 전에 trace를 되살려야 한다. DAIR 모델은 조사가 Triage에 있고 남은 작업 지시가 없다고 알고, 증거에 맞지 않는 도구까지 다음 작업 지시로 내린다."
setup_ko: "앞 세션이 남긴 trace(Collect 단계, 작업 지시 `ez.lecmd`·`ez.pecmd`)와 그 trace를 가리키는 `session.json`을 두고 서버를 띄운다. 트리아지 수집물(`Windows/System32/config` 폴더)만 있고 메모리 이미지는 없다. 가짜 Anthropic API는 두 번 모두 같은 Collect stay 답(`ez.lecmd`, `ez.pecmd`, `vol.pslist`)을 돌려준다."
