realism: common
realism_ko: "이벤트 로그를 `run_evtx_parser`로 적재한 뒤 채널 이름으로 `get_eventlog_anomalies`를 부르는 것은 도구 설명대로의 사용이고, 적재 이름이 `ez.evtx`라 어떤 채널 이름을 줘도 같은 결과가 난다."
coverage: "partial: get_eventlog_anomalies is shown; the other fixed-source tools (list_processes_from_memory, get_process_tree, extract_mft_timeline, parse_prefetch, get_amcache, get_userassist, get_process_environment, get_process_privileges, parse_mft, parse_usn_journal, get_plaso_stats, list_partitions, get_fs_timeline, get_deleted_files) and search with a source that does not exist answer the same way but are not called"
coverage_ko: "`get_eventlog_anomalies`만 보인다. 정해진 source를 읽는 다른 도구(`list_processes_from_memory`, `get_process_tree`, `extract_mft_timeline`, `parse_prefetch`, `get_amcache` 등)와 없는 source를 준 `search`도 같은 방식으로 답하지만 부르지 않았다."
summary: >-
  After run_evtx_parser indexes a TerminalServices LocalSessionManager log as
  ez.evtx, get_eventlog_anomalies for that channel over March 2015 answers
  success with total_windows 0 and no word that evtx.<channel> was never
  indexed, while search in the same range finds the log's session events.
summary_ko: "`run_evtx_parser`가 TerminalServices LocalSessionManager 로그를 `ez.evtx`로 적재한 뒤, 그 채널로 2015년 3월 범위의 `get_eventlog_anomalies`를 부르면 `total_windows: 0`인 성공 응답이 온다. `evtx.<채널>` source가 없다는 말은 없다. 같은 범위의 `search`는 그 로그의 세션 사건을 찾는다."
defect_ko: "이 서버는 요청한 source(`evtx.<채널>`)가 색인됐는지 확인하지 않고, 없으면 0건을 성공으로 돌려준다. 정상이라면 그 source가 없다고 오류나 안내로 알려야 한다. 모델은 그 채널·기간에 이상한 사건이 하나도 없다고 잘못 안다."
setup_ko: "NIST CFReDS Data Leakage 사건 PC의 실제 TerminalServices LocalSessionManager 로그(2015년 3월, 기록 36건)를 넣고 `run_evtx_parser`로 적재했다."
