# Matrix case P4095-047: the fixed-source read tools (get_eventlog_anomalies,
# list_processes_from_memory, get_process_tree, extract_mft_timeline,
# parse_prefetch, get_amcache, ...) read one source name with
# get_windows_by_source and answer success with whatever windows come back;
# they never check that the source exists. get_eventlog_anomalies reads
# "evtx.<channel>", but run_evtx_parser on a log file (EvtxECmd, present in the
# image) indexes it as "ez.evtx", so no channel name finds it.
# The evidence is a real event log from the NIST CFReDS Data Leakage case
# (informant PC, data/evidence/pc-triage):
# Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx,
# 36 records, March 2015, one chunk. Only the first 25,008 bytes are not zero;
# `size` pads it back to its 69,632 bytes (sha256 babf936ec89f863e...).
case_id: P4095-047
