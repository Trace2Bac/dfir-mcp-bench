steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p4095-047
  - tool: run_evtx_parser
    note_ko: "준비: 이벤트 로그 적재"
    args:
      evtx_path: ${EVIDENCE}/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
  - tool: get_eventlog_anomalies
    note_ko: "결함 호출: 그 채널의 2015년 3월 이상 사건 요청"
    args:
      channel: Microsoft-Windows-TerminalServices-LocalSessionManager/Operational
      t_start: "2015-03-01T00:00:00"
      t_end: "2015-04-01T00:00:00"
  - tool: search
    note_ko: "비교 호출: 같은 범위에서 세션 사건 검색"
    args:
      query: LocalSessionManager
      t_start: "2015-03-01T00:00:00"
      t_end: "2015-04-01T00:00:00"
expect:
  - step: 2
    note_ko: "로그는 `ez.evtx`로 적재됐다"
    regex: 'ez\.evtx\\?", \\?"source_id\\?": \d+, \\?"windows_indexed\\?": [1-9]'
  - step: 3
    note_ko: "없는 source를 읽고 0건을 성공으로 돌려준다"
    regex: '"status": "success"[\s\S]*"source": "evtx\.Microsoft-Windows-TerminalServices-LocalSessionManager/Operational"[\s\S]*"total_windows": 0\b'
  - step: 3
    note_ko: "오류 표시가 없다"
    is_error: false
  - step: 4
    note_ko: "같은 기간에 그 로그의 사건이 실제로 있다"
    regex: '"total_matches": [1-9]'
