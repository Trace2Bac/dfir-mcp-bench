# Matrix case P4095-046: parse_android_artifacts on a raw image (.bin, .raw,
# .dd, .img) carves SQLite databases into a temporary folder as
# carved_<offset>.sqlite (phone.py _carve_sqlite_databases), then looks for each
# artifact by its database file name (mmssms.db, contacts2.db, ...). No carved
# file has such a name, so nothing is read and the answer is no_results "No
# Android artifacts found".
# userdata.bin is a raw chunk of an Android userdata partition: random bytes
# around an intact mmssms.db (AOSP sms table, 4096-byte pages) at offset
# 0x6000. The same database is also given as a logical extraction for
# comparison.
case_id: P4095-046
problem: P4095
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "논리 추출이 안 되는 기기는 원시 덤프(`.bin`)만 확보되는 일이 흔하고, 도구 설명도 원시 덤프를 넣으면 SQLite를 잘라 내 분석한다고 안내한다."
coverage: full
summary: >-
  On a raw dump (userdata.bin) that holds an intact mmssms.db,
  carve_sqlite_from_raw finds the database with its sms table, but
  parse_android_artifacts on the same file answers success with no_results
  "No Android artifacts found"; the same database in a logical extraction
  folder gives the SMS messages.
summary_ko: "온전한 `mmssms.db`가 든 원시 덤프(`userdata.bin`)에서 `carve_sqlite_from_raw`는 `sms` 테이블이 있는 DB를 찾는데, 같은 파일에 `parse_android_artifacts`를 부르면 success에 `no_results`(\"No Android artifacts found\")가 온다. 같은 DB를 논리 추출 폴더로 주면 SMS가 나온다."
defect_ko: "이 서버는 원시 덤프에서 잘라 낸 DB를 `carved_<오프셋>.sqlite`라는 이름으로 저장하고, 아티팩트는 `mmssms.db` 같은 원래 파일 이름으로만 찾아 하나도 읽지 못한다. 정상이라면 잘라 낸 DB를 테이블 구조로 알아보고 파싱하거나, 적어도 찾은 DB를 읽지 못했다고 알려야 한다. 모델은 이 덤프에 SMS·연락처 같은 안드로이드 기록이 없다고 잘못 안다."
setup_ko: "SMS 5건이 든 `mmssms.db`(AOSP `sms` 테이블)를 0x6000 위치에 품은 원시 덤프 `userdata.bin`과, 같은 DB를 둔 논리 추출 폴더를 넣었다."
