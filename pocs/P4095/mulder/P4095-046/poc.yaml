steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p4095-046
  - tool: carve_sqlite_from_raw
    note_ko: "비교 호출: 같은 덤프에서 SQLite DB 잘라 내기"
    args:
      image_path: ${EVIDENCE}/phone/userdata.bin
  - tool: parse_android_artifacts
    note_ko: "결함 호출: 원시 덤프에서 SMS 파싱"
    args:
      evidence_path: ${EVIDENCE}/phone/userdata.bin
      artifact_types: [sms]
  - tool: parse_android_artifacts
    note_ko: "비교 호출: 같은 DB를 논리 추출 폴더로 파싱"
    args:
      evidence_path: ${EVIDENCE}/logical
      artifact_types: [sms]
expect:
  - step: 2
    note_ko: "덤프 안에 sms 테이블이 있는 SQLite DB가 있다"
    regex: 'tables\\?": \[[^\]]*\\?"sms\\?"'
  - step: 3
    note_ko: "같은 덤프의 SMS 파싱은 오류 없이 \"안드로이드 기록 없음\"으로 끝난다"
    regex: 'no_results[\s\S]*No Android artifacts found'
  - step: 3
    note_ko: "오류 표시도 없다"
    is_error: false
  - step: 4
    note_ko: "같은 DB를 이름이 있는 파일로 주면 SMS가 나온다(DB는 온전하다)"
    regex: 'parsed_types\\?": \[\\?"sms'
