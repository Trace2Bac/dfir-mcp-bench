stubs:
  # Recorder: runs the image's real stegdetect with the same arguments and
  # passes its output and exit code through; stderr is also appended to a log.
  - name: stegdetect
    text: |
      #!/bin/sh
      /usr/local/bin/stegdetect "$@" 2>>"${OUTSIDE}/stegdetect-stderr.log"
env:
  PATH: ${STUBS}:${PATH}
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p4095-092
  - tool: detect_steganography
    note_ko: "결함 호출: 스캔 폴더의 스테가노그래피 검사"
    args:
      target_path: ${EVIDENCE}/Users/jdoe/Documents/Scans
expect:
  - step: 2
    note_ko: "두 파일을 검사했고 숨긴 내용이 없다고 답한다"
    regex: '"message": "No steganographic content detected in 2 files"[\s\S]*"files_scanned": 2'
  - step: 2
    note_ko: "stegdetect를 썼다고 알린다"
    contains: '"stegdetect": true'
  - file_contains: ${OUTSIDE}/stegdetect-stderr.log
    note_ko: "stegdetect는 scan_0007.jpg를 분석하지 못했다(RGB가 아님)"
    text: "scan_0007.jpg : error: is not a RGB image"
  - file_contains: ${OUTSIDE}/stegdetect-stderr.log
    note_ko: "scan_0008.jpg도 분석하지 못했다"
    text: "scan_0008.jpg : error: is not a RGB image"
