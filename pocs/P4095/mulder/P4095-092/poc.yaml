summary: >-
  On a folder of two grayscale document scans, detect_steganography answers
  success with files_scanned 2 and no_results "No steganographic content
  detected in 2 files", while stegdetect, the only detector it ran, failed on
  both with "error: is not a RGB image".
summary_ko: "회색조 문서 스캔 2장이 든 폴더에 `detect_steganography`를 부르면 `files_scanned: 2`, `no_results`(\"No steganographic content detected in 2 files\")인 성공 응답이 온다. 그런데 서버가 돌린 유일한 탐지기 stegdetect는 두 파일 모두 `error: is not a RGB image`로 실패했다."
defect_ko: "이 서버는 탐지기가 실패한 파일을 말없이 건너뛰고, 검사한 파일 수에 넣은 채 숨긴 내용이 없다고 답한다. 정상이라면 분석하지 못한 파일과 이유를 알려야 한다. 모델은 이 이미지들을 검사해 깨끗하다고 확인한 것으로 잘못 안다."
setup_ko: "회색조(색 성분 1개) JPEG 문서 스캔 `scan_0007.jpg`·`scan_0008.jpg`를 `Documents/Scans` 폴더에 넣었다."
