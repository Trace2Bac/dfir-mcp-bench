# Matrix case P4095-092: detect_steganography keeps only stegdetect's stdout
# (and zsteg's) and drops a file whose run fails; files_scanned still counts
# it and, with nothing collected, the answer is no_results "No
# steganographic content detected in N files".
# stegdetect 0.6 (the image's /usr/local/bin/stegdetect) analyses RGB JPEGs
# only: on a grayscale JPEG it prints "error: is not a RGB image" to stderr
# and nothing to stdout. The two scans are real baseline JFIF files with one
# colour component, written by Pillow. The stub named stegdetect is a
# recorder only: it runs the real binary unchanged and copies its stderr to
# ${OUTSIDE}/stegdetect-stderr.log so the failure can be checked.
