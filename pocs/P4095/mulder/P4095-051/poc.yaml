# Matrix case P4095-051: when tshark exits non-zero with nothing on stdout,
# _tshark_output_or_error (pcap.py) turns stderr into the text
# "[tshark error (exit N): ...]", and run_pcap_analysis indexes that text as
# the mode's source (here pcap.filtered) and answers success with status
# "indexed". The response preview is the indexing summary, not the text, so the
# failure shows only when the source is read back.
# The trigger is a display filter on tls.handshake.ja4: JA4 fields exist from
# Wireshark 4.2, and the image ships TShark 3.6.2, which rejects the filter
# (exit 2). The capture is a real libpcap file written by a script: three
# TCP sessions to 185.199.110.42:443, each with a TLS ClientHello (SNI
# cdn.update-check.net or login.microsoftonline.com), valid checksums.
case_id: P4095-051
problem: P4095
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "JA4 지문으로 악성 TLS 클라이언트를 찾는 것은 요즘 흔한 사냥 방식인데, 이미지의 TShark 3.6.2에는 그 필드가 없어 필터가 거부된다. 오타·버전 차이로 tshark가 실패하는 일은 실제로 생긴다."
coverage: "partial: custom mode with a filter tshark rejects is shown; the other modes index tshark's error text the same way (dns and smtp mode: see P2049-107)"
coverage_ko: "tshark가 거부하는 필터를 준 custom 모드만 보인다. 다른 모드도 tshark 오류 문구를 같은 방식으로 적재한다(dns·smtp 모드는 P2049-107)."
summary: >-
  run_pcap_analysis in custom mode with a tls.handshake.ja4 filter answers
  success with pcap.filtered "indexed", but the indexed text is TShark 3.6.2's
  error that tls.handshake.ja4 is not a field; tls mode on the same capture
  lists the three ClientHellos.
summary_ko: "`tls.handshake.ja4` 필터로 `run_pcap_analysis`를 custom 모드로 부르면 `pcap.filtered`가 `indexed`인 성공 응답이 온다. 그러나 적재된 것은 `tls.handshake.ja4`가 필드가 아니라는 TShark 3.6.2의 오류 문구다. 같은 캡처의 tls 모드는 ClientHello 3건을 보여 준다."
defect_ko: "이 서버는 tshark가 실패해도 그 오류 문구를 분석 결과로 적재하고 성공(`indexed`)으로 답한다. 정상이라면 실패를 `status: error`와 tshark 메시지로 알려야 한다. 모델은 필터가 적용됐다고 보고, `pcap.filtered`에 해당 패킷이 없으니 그런 TLS 클라이언트가 없었다고 잘못 안다."
setup_ko: "`10.0.5.21`이 `185.199.110.42:443`으로 TLS 연결 3건(SNI `cdn.update-check.net` 2건, `login.microsoftonline.com` 1건)을 맺는 pcap 파일을 넣었다."
