steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p4095-051
  - tool: run_pcap_analysis
    note_ko: "비교 호출: 같은 캡처의 TLS 핸드셰이크(정상 동작하는 모드)"
    args:
      pcap_path: ${EVIDENCE}/net/egress.pcap
      mode: tls
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 pcap.tls 원문 읽기"
    args:
      source_name: pcap.tls
  - tool: run_pcap_analysis
    note_ko: "결함 호출: JA4 지문 필터로 custom 모드 실행"
    args:
      pcap_path: ${EVIDENCE}/net/egress.pcap
      mode: custom
      display_filter: tls.handshake.ja4 == "t12d1207h1_c866b44c5a26_e8cd2fbbe8b9"
  - tool: get_raw_output
    note_ko: "결함 호출: 적재된 pcap.filtered 원문 읽기"
    args:
      source_name: pcap.filtered
expect:
  - step: 3
    note_ko: "캡처에는 TLS ClientHello가 있다(캡처 파일은 멀쩡하다)"
    contains: "cdn.update-check.net"
  - step: 4
    note_ko: "custom 모드는 오류가 아닌 응답으로 돌아온다"
    is_error: false
  - step: 4
    note_ko: "응답은 성공이고 pcap.filtered가 적재됐다(indexed)고 한다"
    regex: '"status": "success"[\s\S]*pcap\.filtered\\?"[^}]*\\?"status\\?": \\?"indexed'
  - step: 5
    note_ko: "pcap.filtered에 적재된 것은 패킷이 아니라 tls.handshake.ja4가 필드가 아니라는 tshark 오류다"
    regex: 'tshark error \(exit \d+\): tshark: Neither \\?"tls\.handshake\.ja4\\?"'
