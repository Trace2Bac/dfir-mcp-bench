# Matrix case P4095-016: analyze_memory_summary knows every vol run failed
# (rc 127 when vol is missing, 124 on timeout, rc != 0 on plugin failure) but
# fills the counts with 0 and gives the clean verdict.
# vol is chosen with FINDEVIL_VOL so the result does not depend on whether
# the image ships volatility:
# - missing: a stub whose "--help" fails, so the server takes the
#   "vol not installed" path (rc 127).
# - crash: a stub that answers "--help" and fails every plugin with rc 1 and
#   a vol3-style exception on stderr (not a symbol-table message), as vol3
#   does on a truncated or unsupported dump.
# External tool output is simulated.
case_id: P4095-016
problem: P4095
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "Volatility가 없거나 덤프·심볼 문제로 플러그인이 모두 실패하는 일은 흔하다."
coverage: "partial: the time-out path (rc 124) is not shown (10-minute limit)"
coverage_ko: "시간 초과 경로(rc 124)는 보이지 않는다(10분 제한)"
summary: When volatility is missing (rc 127) or every plugin fails (rc 1), analyze_memory_summary still reports 0 processes, 0 sockets and "No strong memory-resident compromise indicators ... internally consistent" without saying no plugin ran.
summary_ko: "volatility가 없거나(rc 127) 모든 플러그인이 실패해도(rc 1) `analyze_memory_summary`는 프로세스 0개, 소켓 0개와 \"No strong memory-resident compromise indicators ... internally consistent\"를 낸다. 플러그인이 하나도 실행되지 않았다는 말은 없다."
defect_ko: "플러그인이 하나도 돌지 않으면 이 서버는 모든 수를 0으로 두고 깨끗하다고 판정한다. 분석하지 못했다고 알려야 한다. 모델은 메모리를 분석해 침해 지표가 없다고 잘못 안다."
setup_ko: "작은 LiME 머리 파일을 두고, Volatility를 '설치 안 됨'과 '모든 플러그인 실패' 두 흉내 스크립트로 바꿔 각각 띄웠다."
stubs:
  - name: vol_missing
    text: |
      #!/bin/sh
      echo "vol: command not usable" >&2
      exit 127
  - name: vol_crash
    text: |
      #!/bin/sh
      if [ "$1" = "--help" ]; then echo "usage: vol [-h] [-c CONFIG] [-f FILE] PLUGIN ..."; exit 0; fi
      echo "Volatility 3 Framework 2.7.0" >&2
      echo "volatility3.framework.exceptions.LayerException: Offset outside of the buffer boundaries" >&2
      exit 1
conditions:
  - name: missing
    env: {FINDEVIL_VOL: "${STUBS}/vol_missing"}
  - name: crash
    env: {FINDEVIL_VOL: "${STUBS}/vol_crash"}
fixture:
  - path: mem/host.lime
    hex: 454d694c0100000000000000000000000000000000000000
steps:
  - tool: analyze_memory_summary
    note_ko: "결함 호출: 메모리 요약 분석"
    args:
      memory_dump_path: ${EVIDENCE}/mem/host.lime
expect:
  - step: 1
    note_ko: "Volatility가 없을 때 프로세스 0개로 나온다"
    condition: missing
    contains: "- Processes: 0 (0 anomalies)"
  - step: 1
    note_ko: "Volatility가 없을 때 깨끗하다는 판정이 나온다"
    condition: missing
    contains: "No strong memory-resident compromise indicators. The dump is internally consistent"
  - step: 1
    note_ko: "Volatility가 없을 때 실행 실패 안내가 없다"
    condition: missing
    not_regex: "(?i)not installed|failed|rc=|could not run"
  - step: 1
    note_ko: "플러그인이 모두 실패할 때 프로세스 0개로 나온다"
    condition: crash
    contains: "- Processes: 0 (0 anomalies)"
  - step: 1
    note_ko: "플러그인이 모두 실패할 때 깨끗하다는 판정이 나온다"
    condition: crash
    contains: "No strong memory-resident compromise indicators. The dump is internally consistent"
  - step: 1
    note_ko: "플러그인이 모두 실패할 때 실패 안내가 없다"
    condition: crash
    not_regex: "(?i)LayerException|failed|rc=|could not run"
