# Matrix case P4095-019: several tools treat read / JSON failures as "nothing
# here" and do not report the file they could not process. This PoC covers
# the JSON part in analyze_container_artifacts (daemon.json) and a read
# failure in find_webshells: a .php file the server cannot read (fixture mode
# 0000; the bench server runs as a non-root user) is counted as scanned and
# the scan says "No webshell indicators found".
case_id: P4095-019
problem: P4095
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "웹 폴더에 읽기 권한이 없는 파일은 실제로 생길 수 있지만, 끝 쉼표가 있는 `daemon.json`은 Docker가 시작하지 못하는 파일이라 실제 노출로 이어지지 않는다."
coverage: "partial: failures of find_recent_changes, find_timestamp_anomalies, find_ai_signatures and verify_package_integrity are shown through two of them"
coverage_ko: "find_recent_changes, find_timestamp_anomalies, find_ai_signatures, verify_package_integrity의 실패는 그중 두 개로 보인다"
summary: A daemon.json exposing tcp://0.0.0.0:2375 but with a trailing comma is dropped without notice while the compose finding next to it is reported, so the report looks complete; an unreadable .php file is counted as scanned and the webshell scan reports no indicators.
summary_ko: "tcp://0.0.0.0:2375를 노출하지만 끝에 쉼표가 있는 daemon.json이 알림 없이 빠지고 그 옆의 compose 발견만 보고되어, 보고서가 완전해 보인다. 읽을 수 없는 .php 파일은 검사한 것으로 세어지고 웹셸 검사는 지표 없음을 보고한다."
defect_ko: "정상이라면 읽거나 해석하지 못한 파일은 알려야 하는데, 이 서버는 말없이 건너뛰거나 검사한 것으로 센다. 그래서 모델은 보고서가 완전하다고, 웹셸이 없다고 잘못 안다."
setup_ko: "끝 쉼표가 있는 `daemon.json`, `privileged: true` compose 파일, 읽기 권한을 없앤 웹셸 `.php` 파일을 두었다."
fixture:
  - path: fs/etc/docker/daemon.json
    text: "{\"hosts\": [\"tcp://0.0.0.0:2375\"], \"insecure-registries\": [\"10.0.0.5:5000\"],}\n"
  - path: fs/srv/app/docker-compose.yml
    text: |
      services:
        app:
          image: nginx:1.25
          privileged: true
  - path: fs/var/www/html/upload/x.php
    text: "<?php system($_GET['c']); ?>\n"
    mode: "0000"
steps:
  - tool: analyze_container_artifacts
    note_ko: "결함이 있는 호출: 컨테이너 설정 분석"
    args:
      root_path: ${EVIDENCE}/fs
  - tool: find_webshells
    note_ko: "결함이 있는 호출: 웹셸 검사"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "compose 발견은 보고된다"
    contains: "privileged: true set on a service"
  - step: 1
    note_ko: "`daemon.json`은 응답에 없다"
    not_contains: "daemon.json"
  - step: 1
    note_ko: "해석하지 못한 파일이 있다는 안내가 없다"
    not_regex: "(?i)parse|invalid json|skipp|could not|unreadable"
  - step: 2
    note_ko: "읽지 못한 `.php` 파일을 검사한 것으로 센다"
    contains: "- **Files with executable extensions scanned:** 1"
  - step: 2
    note_ko: "웹셸 지표가 없다고 한다"
    contains: "No webshell indicators found in scanned files."
