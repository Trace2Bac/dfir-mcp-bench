# Matrix case P4095-020: parse_journal skips lines that are not valid JSON
# without counting them, so analyze_journal summarises a partly parsed export
# as if it were complete. Only a file with no parseable line at all gets
# "No parseable journal entries".
case_id: P4095-020
problem: P4095
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
coverage: full
summary: In a journal export where five failed-login lines are cut off (not valid JSON) and one accepted login is intact, analyze_journal reports "Failed auth attempts 0" and "Total entries parsed 1" and never says that five lines could not be read.
fixture:
  - path: journal.jsonl
    text: |
      {"__REALTIME_TIMESTAMP": "1775971800000000", "SYSLOG_IDENTIFIER": "sshd", "MESSAGE": "Failed password for root from 198.51.100.9 port 40001 ssh2"
      {"__REALTIME_TIMESTAMP": "1775971801000000", "SYSLOG_IDENTIFIER": "sshd", "MESSAGE": "Failed password for root from 198.51.100.9 port 40002 ssh2"
      {"__REALTIME_TIMESTAMP": "1775971802000000", "SYSLOG_IDENTIFIER": "sshd", "MESSAGE": "Failed password for root from 198.51.100.9 port 40003 ssh2"
      {"__REALTIME_TIMESTAMP": "1775971803000000", "SYSLOG_IDENTIFIER": "sshd", "MESSAGE": "Failed password for root from 198.51.100.9 port 40004 ssh2"
      {"__REALTIME_TIMESTAMP": "1775971804000000", "SYSLOG_IDENTIFIER": "sshd", "MESSAGE": "Failed password for root from 198.51.100.9 port 40005 ssh2"
      {"__REALTIME_TIMESTAMP": "1775971860000000", "SYSLOG_IDENTIFIER": "sshd", "MESSAGE": "Accepted password for root from 198.51.100.9 port 40006 ssh2"}
steps:
  - tool: analyze_journal
    args:
      path: ${EVIDENCE}/journal.jsonl
expect:
  - step: 1
    contains: "- **Total entries parsed:** 1"
  - step: 1
    contains: "- **Failed auth attempts:** 0 from 0 IPs"
  - step: 1
    not_regex: "(?i)skipp|unparse|malformed|not valid json|could not (be )?(read|parse)|invalid json"
