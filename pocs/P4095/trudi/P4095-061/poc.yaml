# Matrix case P4095-061: read_output passes the path to a line scanner that
# returns an empty string on any OSError (open() on a directory raises
# IsADirectoryError), and then answers success with an empty body, the same
# response as a file with no matching rows.
# Here the path is the folder AmcacheParser wrote its CSVs into. AmcacheParser
# writes several CSVs with a timestamp prefix, so a read of its output folder
# is an easy step to take.
case_id: P4095-061
problem: P4095
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "AmcacheParser·RECmd처럼 출력 폴더에 이름이 정해지지 않은 CSV 여러 개를 쓰는 도구가 있어, 파일 대신 그 출력 폴더를 read_output에 넘기는 일이 있을 수 있다."
coverage: "partial: a directory path only; an unreadable file (permissions) takes the same except branch but is not shown"
coverage_ko: "폴더 경로만 보였다. 권한 때문에 읽지 못하는 파일도 같은 예외 처리를 지나지만 보이지 않았다."
summary: Given the AmcacheParser output folder instead of one of its CSVs, read_output with query mimikatz answers success with an empty body and truncated false, the same as a file with no match, while the UnassociatedFileEntries CSV in that folder has a mimikatz.exe row.
summary_ko: "AmcacheParser 출력 CSV 대신 그 출력 폴더를 read_output에 query mimikatz로 넘기면 빈 body와 truncated false를 성공으로 돌려줘 일치 없는 파일과 같은 응답이 되는데, 그 폴더의 UnassociatedFileEntries CSV에는 mimikatz.exe 행이 있다."
defect_ko: "이 서버는 파일을 열다 난 오류(폴더라서 열 수 없음)를 빈 문자열로 받아 성공과 빈 결과로 돌려준다. 정상이라면 경로가 폴더라서 읽지 못했다고 실패로 알리거나 안의 파일을 알려 줘야 한다. 모델은 Amcache에 mimikatz 실행 흔적이 없다고 잘못 안다."
setup_ko: "analysis/amcache 폴더에 AmcacheParser가 쓰는 이름의 CSV 두 개(UnassociatedFileEntries에 mimikatz.exe 행 포함, ProgramEntries)를 두었다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # AmcacheParser output, named <timestamp>_Amcache_<kind>.csv as it writes
  # them; columns of AmcacheParser 1.5 UnassociatedFileEntries / ProgramEntries.
  - path: analysis/amcache/20261127201502_Amcache_UnassociatedFileEntries.csv
    root: db
    text: |
      ApplicationName,ProgramId,FileKeyLastWriteTimestamp,SHA1,IsOsComponent,FullPath,Name,FileExtension,LinkDate,ProductName,Size,Version,ProductVersion,LongPathHash,BinaryType,IsPeFile,BinFileVersion,BinProductVersion,Usn,Language,Description
      Unassociated,0006a4c1d2f0e2b39c1a8b3f4e5d6c7b80000ffff,2026-11-20 09:14:07,d241df7b9d2ec0b8194751cd5ce153e27cc40fa4,False,c:\users\alice\appdata\local\temp\mimikatz.exe,mimikatz.exe,.exe,2022-09-19 15:44:56,mimikatz,1355680,2.2.0.0,2.2.0.0,mimikatz.exe|6e1f4a0c2b9d3e58,pe64_amd64,True,2.2.0.0,2.2.0.0,51245872,0,mimikatz for Windows
      Unassociated,0006b7e2a1c3d4e5f6a7b8c9d0e1f2a3b40000ffff,2026-11-18 16:02:41,8f3b0c1d2e4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c,False,c:\program files\7-zip\7z.exe,7z.exe,.exe,2024-06-19 00:00:00,7-Zip,566784,24.07,24.07,7z.exe|a9c41e7d03b2f615,pe64_amd64,True,24.7.0.0,24.7.0.0,50981120,0,7-Zip Console
  - path: analysis/amcache/20261127201502_Amcache_ProgramEntries.csv
    root: db
    text: |
      ProgramId,KeyLastWriteTimestamp,Name,Version,Publisher,InstallDate,OSVersionAtInstallTime,BundleManifestPath,HiddenArp,InboxModernApp,MsiPackageCode,MsiProductCode,PackageFullName,ProgramInstanceId,RegistryKeyPath,RootDirPath,Type,Source,StoreAppType,UninstallString
      0000f519feec486de87ed73cb92d3cac802400000000,2026-11-18 16:02:41,7-Zip 24.07 (x64),24.07,Igor Pavlov,2026-11-18 16:02:30,10.0.19045,,False,False,,,,000068d1a1f0c2b3,HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\7-Zip,C:\Program Files\7-Zip\,Application,AddRemoveProgram,,"C:\Program Files\7-Zip\Uninstall.exe"
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4095-061
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: read_output
    note_ko: "결함 호출: AmcacheParser 출력 폴더에서 mimikatz를 찾는다"
    args:
      path: ${DB_DIR}/analysis/amcache
      query: mimikatz
  - tool: read_output
    note_ko: "비교 호출: 같은 폴더의 UnassociatedFileEntries CSV에서 찾는다"
    args:
      path: ${DB_DIR}/analysis/amcache/20261127201502_Amcache_UnassociatedFileEntries.csv
      query: mimikatz
expect:
  - step: 2
    note_ko: "폴더를 읽지 못했는데 성공으로 끝난다"
    regex: "\"success\":\\s*true"
  - step: 2
    note_ko: "body가 빈 문자열이고 잘림도 없어 일치 없음과 같다"
    regex: "\"body\":\\s*\"\",\\s*\"truncated\":\\s*false"
  - step: 3
    note_ko: "그 폴더의 CSV에는 mimikatz.exe 행이 있다"
    regex: "\"body\":\\s*\"[^\"]*mimikatz\\.exe"
