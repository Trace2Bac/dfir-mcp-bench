realism_ko: "호스트마다 `config/SYSTEM`처럼 같은 하위 구조로 하이브를 모은 수집물은 흔한 증거 형태이고, `ez_recmd_batch`는 그런 트리 전체를 받으라고 안내한다."
coverage: full
summary: ez_recmd_batch over a collection with WKSTN-01/config/SYSTEM and WKSTN-02/config/SYSTEM answers success with two hive runs whose output_dir is the same <output_dir>/config_SYSTEM.
summary_ko: "`WKSTN-01/config/SYSTEM`과 `WKSTN-02/config/SYSTEM`이 든 수집물에 `ez_recmd_batch`를 부르면, 하이브 실행 두 건의 `output_dir`이 똑같이 `<output_dir>/config_SYSTEM`인 성공 응답이 온다."
defect_ko: "이 서버는 하이브별 출력 폴더를 부모 폴더 이름과 파일 이름만으로 정해, 다른 호스트의 같은 이름 하이브가 한 폴더에 결과를 쓴다. 정상이라면 입력 경로 전체나 호스트처럼 입력마다 구별되는 값으로 폴더를 정해야 한다. 모델은 `config_SYSTEM` 폴더의 결과를 한 호스트의 것으로 잘못 알고, 두 호스트의 결과가 섞이거나 한쪽이 다른 쪽을 덮어쓴 것을 모른다."
setup_ko: "두 워크스테이션 수집 폴더에 같은 구조로 SYSTEM 하이브를 두었다(`WKSTN-01/config/SYSTEM`, `WKSTN-02/config/SYSTEM`). 하이브는 P4117-024의 regf 하이브다."
