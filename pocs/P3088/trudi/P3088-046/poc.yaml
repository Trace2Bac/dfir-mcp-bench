# Matrix case P3088-046: ez_recmd_batch (per_hive, the default) names each
# hive's output folder from the hive's parent folder name and file name only,
# <output_dir>/<parent>_<file> (tools/eztools.py:274-278). Hives of two hosts
# collected in the same layout (WKSTN-01/config/SYSTEM, WKSTN-02/config/SYSTEM)
# get the same folder, config_SYSTEM, so both RECmd runs write into it.
# Evidence: the SYSTEM hive of P4117-024 (a regf 1.5 hive holding the real
# AppCompatCache value, Select and PROCESSOR_ARCHITECTURE of a Windows 7
# image), placed in both workstations' collection folders.
