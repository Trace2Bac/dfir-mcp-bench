steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3088-046
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: ez_recmd_batch
    note_ko: "결함 호출: 두 호스트의 하이브가 든 수집 폴더에 RECmd 배치를 돌린다"
    timeout_s: 300
    args:
      hives_dir: ${EVIDENCE}/collection
      batch_file: /opt/zimmermantools/RECmd/BatchExamples/BasicSystemInfo.reb
      output_dir: ${DB_DIR}/analysis/recmd
expect:
  - step: 2
    note_ko: "두 호스트의 하이브를 모두 찾았다"
    regex: '"hives_found":\s*2\b'
  - step: 2
    note_ko: "WKSTN-01 하이브의 출력 폴더는 `config_SYSTEM`이다"
    regex: '"hive":\s*"[^"]*/WKSTN-01/config/SYSTEM",\s*"success":\s*\w+,\s*"output_dir":\s*"[^"]*/analysis/recmd/config_SYSTEM"'
  - step: 2
    note_ko: "WKSTN-02 하이브의 출력 폴더도 같은 `config_SYSTEM`이다"
    regex: '"hive":\s*"[^"]*/WKSTN-02/config/SYSTEM",\s*"success":\s*\w+,\s*"output_dir":\s*"[^"]*/analysis/recmd/config_SYSTEM"'
