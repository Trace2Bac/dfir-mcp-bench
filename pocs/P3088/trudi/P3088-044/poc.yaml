commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "`output_path`는 모델이 정하는 인자라, 수집 폴더마다 해시 매니페스트를 만들며 같은 이름(`prefetch.hashdeep`)을 다시 쓰는 것은 있을 수 있는 모델 실수다."
coverage: full
summary: hashdeep_compute of WKSTN-01/Prefetch and then of WKSTN-02/Prefetch with the same output_path both answer success with that manifest_path and no word about an existing file; the manifest then lists only WKSTN-02's files, and hashdeep_audit of WKSTN-01/Prefetch against it reports the audit failed.
summary_ko: "`WKSTN-01/Prefetch`와 `WKSTN-02/Prefetch`에 같은 `output_path`로 차례로 `hashdeep_compute`를 부르면 두 호출 모두 기존 파일에 대한 말 없이 같은 `manifest_path`로 성공한다. 매니페스트에는 WKSTN-02의 파일만 남고, 이 매니페스트로 `WKSTN-01/Prefetch`를 `hashdeep_audit`하면 감사가 실패한다."
defect_ko: "이 서버는 매니페스트 경로에 파일이 이미 있어도 확인하지 않고 덮어쓰며 그 사실을 알리지 않는다. 정상이라면 기존 매니페스트가 있으면 거부하거나 다른 이름으로 쓰고 알려야 한다. 모델은 첫 폴더의 기준 해시가 남아 있다고 잘못 알고, 감사 실패를 WKSTN-01 파일이 바뀐 것으로 잘못 읽을 수 있다."
setup_ko: "실제 Windows 7 Prefetch 파일을 두 워크스테이션 수집 폴더(`WKSTN-01/Prefetch`에 두 개, `WKSTN-02/Prefetch`에 두 개)에 나눠 두었다."
