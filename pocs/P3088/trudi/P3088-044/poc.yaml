steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3088-044
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: hash_hashdeep_compute
    note_ko: "WKSTN-01 수집 폴더의 매니페스트를 `prefetch.hashdeep`으로 만든다"
    args:
      target: ${EVIDENCE}/WKSTN-01/Prefetch
      output_path: ${DB_DIR}/analysis/prefetch.hashdeep
  - tool: hash_hashdeep_compute
    note_ko: "결함 호출: WKSTN-02 수집 폴더의 매니페스트를 같은 경로로 만든다"
    args:
      target: ${EVIDENCE}/WKSTN-02/Prefetch
      output_path: ${DB_DIR}/analysis/prefetch.hashdeep
  - tool: hash_hashdeep_audit
    note_ko: "비교 호출: 그 매니페스트로 WKSTN-01 폴더를 감사한다"
    args:
      manifest_file: ${DB_DIR}/analysis/prefetch.hashdeep
      target_directory: ${EVIDENCE}/WKSTN-01/Prefetch
expect:
  - step: 2
    note_ko: "첫 매니페스트를 그 경로에 썼다고 답한다"
    regex: '"success":\s*true[\s\S]*"manifest_path":\s*"[^"]*/analysis/prefetch\.hashdeep"'
  - step: 3
    note_ko: "같은 경로로 두 번째 매니페스트를 써도 성공으로 답한다"
    regex: '"success":\s*true[\s\S]*"manifest_path":\s*"[^"]*/analysis/prefetch\.hashdeep"'
  - step: 3
    note_ko: "기존 매니페스트를 덮어썼다는 말이 없다(아래 파일과 대조)"
    not_regex: '(?i)overwr|exist|replac'
  - file_contains: ${DB_DIR}/analysis/prefetch.hashdeep
    text: "/WKSTN-02/Prefetch/WEVTUTIL.EXE-400D93E8.pf"
    note_ko: "매니페스트에는 WKSTN-02의 파일이 있다"
  - file_not_contains: ${DB_DIR}/analysis/prefetch.hashdeep
    text: "/WKSTN-01/Prefetch/"
    note_ko: "WKSTN-01의 기준 해시는 사라졌다"
  - step: 4
    note_ko: "그 매니페스트로 WKSTN-01을 감사하면 실패한다"
    regex: '(?i)audit failed'
