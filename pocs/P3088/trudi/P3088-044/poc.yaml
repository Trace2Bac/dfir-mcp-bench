# Matrix case P3088-044: hashdeep_compute (tools/hashing.py:413-416) opens
# output_path with "w" and writes the new manifest over any file already
# there, with no check and no word in the response. Two hashdeep_compute
# calls for two folders with the same output_path leave only the second
# folder's manifest, and hashdeep_audit of the first folder against that
# manifest (tools/hashing.py:453-455) then finds none of its files.
# Evidence: real Windows 7 prefetch files (the same files as P4117-024),
# collected from two workstations into WKSTN-01/Prefetch and WKSTN-02/Prefetch.
case_id: P3088-044
problem: P3088
server: trudi
