realism_ko: "`output_file`을 주지 않고 기본값으로 부르는 것은 흔한 호출이고, 서버 안내가 출력을 `analysis/` 아래로 정하므로 여러 로그를 같은 출력 폴더로 처리하는 것도 흔하다."
coverage: "partial: ez_evtxecmd only; ez_mftecmd (mft.csv), ez_mftecmd_dir (mft_dir.csv) and the other EZ wrappers have the same fixed defaults"
coverage_ko: "`ez_evtxecmd`만 보였다. `ez_mftecmd`(`mft.csv`), `ez_mftecmd_dir`(`mft_dir.csv`) 등 다른 EZ 도구도 같은 고정 기본 이름을 쓴다."
summary: ez_evtxecmd on a PowerShell Operational log and then on a TerminalServices LocalSessionManager log, both into analysis/evtx with the default output_file, answer success; read_output of analysis/evtx/evtx.csv for MiniDumpWriteDump finds the 4104 script block after the first call and nothing after the second, which replaced the file.
summary_ko: "PowerShell Operational 로그와 TerminalServices LocalSessionManager 로그를 기본 `output_file`로 같은 `analysis/evtx`에 차례로 `ez_evtxecmd`하면 둘 다 성공으로 답한다. `analysis/evtx/evtx.csv`에서 `MiniDumpWriteDump`를 찾으면 첫 호출 뒤에는 4104 스크립트 블록이 나오지만, 둘째 호출이 파일을 바꾼 뒤에는 나오지 않는다."
defect_ko: "이 서버는 EZ 도구의 출력 파일 이름을 입력과 무관한 고정값(`evtx.csv`)으로 두어, 같은 출력 폴더에서 다른 로그를 처리하면 앞 결과를 알림 없이 바꾼다. 정상이라면 입력마다 다른 이름을 정하거나 기존 파일이 있으면 거부·알림해야 하고, 기록에 내용 해시를 남겨 파일을 호출에 연결할 수 있어야 한다. 모델은 첫 호출을 인용하며 `evtx.csv`를 PowerShell 로그의 결과로 잘못 알고, lsass 덤프 흔적이 없다고 잘못 읽는다."
setup_ko: "EVTX-ATTACK-SAMPLES의 PowerShell Operational 로그(lsass를 `MiniDumpWriteDump`로 덤프하는 4104 스크립트 블록 포함)와 CFReDS Data Leakage PC의 TerminalServices-LocalSessionManager Operational 로그를 증거로 두었다."
