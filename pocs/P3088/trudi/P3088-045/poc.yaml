steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3088-045
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: ez_evtxecmd
    note_ko: "PowerShell 로그를 기본 출력 이름으로 `analysis/evtx`에 처리한다"
    timeout_s: 300
    args:
      evtx_path: ${EVIDENCE}/Logs/Microsoft-Windows-PowerShell%4Operational.evtx
      output_dir: ${DB_DIR}/analysis/evtx
  - tool: read_output
    note_ko: "비교 호출: `evtx.csv`에서 lsass 덤프 스크립트를 찾는다"
    args:
      path: ${DB_DIR}/analysis/evtx/evtx.csv
      query: MiniDumpWriteDump
  - tool: ez_evtxecmd
    note_ko: "결함 호출: 다른 로그를 같은 폴더에 기본 출력 이름으로 처리한다"
    timeout_s: 300
    args:
      evtx_path: ${EVIDENCE}/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
      output_dir: ${DB_DIR}/analysis/evtx
  - tool: read_output
    note_ko: "비교 호출: 같은 `evtx.csv`에서 같은 것을 다시 찾는다"
    args:
      path: ${DB_DIR}/analysis/evtx/evtx.csv
      query: MiniDumpWriteDump
  - tool: read_output
    note_ko: "비교 호출: 같은 `evtx.csv`의 앞부분을 읽는다"
    args:
      path: ${DB_DIR}/analysis/evtx/evtx.csv
      max_rows: 5
expect:
  - step: 2
    note_ko: "PowerShell 로그 처리가 성공한다"
    regex: '"success":\s*true'
  - step: 3
    note_ko: "첫 호출 뒤 `evtx.csv`에는 lsass 덤프 스크립트(4104, `lsass_wer_ps.ps1`)가 있다"
    contains: "lsass_wer_ps.ps1"
  - step: 4
    note_ko: "둘째 로그도 같은 폴더·같은 이름으로 처리하고 성공으로 답한다"
    regex: '"success":\s*true'
  - step: 4
    note_ko: "기존 결과를 바꿨다는 말이 없다(아래 읽기와 대조)"
    not_regex: '(?i)overwr|already exist|replac'
  - step: 5
    note_ko: "같은 검색에서 첫 로그의 lsass 덤프 스크립트 행이 사라졌다"
    not_contains: "lsass_wer_ps.ps1"
  - step: 6
    note_ko: "같은 파일에는 이제 LocalSessionManager 로그의 행만 있다"
    regex: 'Microsoft-Windows-TerminalServices-LocalSessionManager/Operational'
  - step: 6
    note_ko: "PowerShell 로그의 행은 없다"
    not_contains: "Microsoft-Windows-PowerShell/Operational"
