# Matrix case P3088-045: the EZ tool wrappers default output_file to a fixed
# name that does not depend on the input (ez_evtxecmd: "evtx.csv",
# tools/eztools.py:175; mft.csv, mft_dir.csv likewise), so two logs parsed
# into the same output_dir with the default write the same file and the
# second replaces the first. The trace entry keeps only the output path
# (core/execution_log.py:1522-1523), with no content hash, so the file cannot
# be tied back to the call that wrote it.
# Evidence: two real event logs: the PowerShell Operational log of
# EVTX-ATTACK-SAMPLES (Powershell_4104_MiniDumpWriteDump_Lsass.evtx, as in
# P2054-034) and the TerminalServices-LocalSessionManager Operational log of
# the NIST CFReDS Data Leakage PC (as in P2062-018).
