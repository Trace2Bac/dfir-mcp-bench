steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3088-010
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: tsk_fls
    note_ko: "준비: 이미지의 파일 목록을 본다(Application.evtx 567, System.evtx 569)"
    args:
      image: ${EVIDENCE}/pc.dd
      recursive: true
  - tool: tsk_icat
    note_ko: "Application.evtx(inode 567)를 `extracted.evtx`로 꺼낸다"
    args:
      image: ${EVIDENCE}/pc.dd
      inode: "567"
      output_path: ${DB_DIR}/analysis/export/extracted.evtx
  - tool: hash_file
    note_ko: "비교 호출: 꺼낸 파일의 해시"
    args:
      file_path: ${DB_DIR}/analysis/export/extracted.evtx
  - tool: tsk_icat
    note_ko: "결함 호출: System.evtx(inode 569)를 같은 경로로 꺼낸다"
    args:
      image: ${EVIDENCE}/pc.dd
      inode: "569"
      output_path: ${DB_DIR}/analysis/export/extracted.evtx
  - tool: hash_file
    note_ko: "비교 호출: 같은 경로의 파일 해시를 다시 본다"
    args:
      file_path: ${DB_DIR}/analysis/export/extracted.evtx
expect:
  - step: 2
    note_ko: "이미지에 Application.evtx(567)와 System.evtx(569)가 있다"
    regex: 'r/r 567:\\tApplication\.evtx[\s\S]*r/r 569:\\tSystem\.evtx'
  - step: 3
    note_ko: "첫 추출은 call 4로 성공한다"
    regex: '"success":\s*true[\s\S]*"output_path":\s*"[^"]*/analysis/export/extracted\.evtx"[\s\S]*"_trudi_call_id":\s*4\b'
  - step: 4
    note_ko: "그 파일은 Application.evtx다(SHA-256)"
    contains: '"sha256": "f930bf67d5d10ea7191839d13c1e0e80f07d5a58d5cb6e77d43ce3f843b8bc56"'
  - step: 5
    note_ko: "같은 경로로 다른 inode를 꺼내도 성공으로 답한다"
    regex: '"success":\s*true[\s\S]*"output_path":\s*"[^"]*/analysis/export/extracted\.evtx"'
  - step: 5
    note_ko: "기존 파일을 덮어썼다는 말이 없다(아래 해시와 대조)"
    not_regex: '(?i)overwr|exist|replac'
  - step: 6
    note_ko: "같은 경로의 파일이 System.evtx로 바뀌었다(SHA-256)"
    contains: '"sha256": "5fabf8c5c699a1a3a45d941f01c57b37d1ce5fc55d34e6662f0d2a19f10c97b5"'
  - file_regex: ${DB_DIR}/analysis/trace.json
    pattern: '"call_id": 4,[^}]*"cmd": "sudo icat [^"]*pc\.dd 567"[^}]*"output_path": "[^"]*/analysis/export/extracted\.evtx"'
    note_ko: "trace의 call 4 항목은 여전히 그 경로를 inode 567의 출력으로 적는다"
