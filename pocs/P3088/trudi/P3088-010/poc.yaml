# Matrix case P3088-010: run_with_output_file (core/executor.py:367-417)
# opens output_path with "w"/"wb" and writes the tool's stdout over whatever
# is there, with no check that the path is already in use and nothing in the
# response that says a file was replaced. Two tsk_icat calls for different
# inodes with the same output_path leave only the second file, and the first
# call's trace entry still names that path as its artifact.
# Evidence: the FAT disk image of P2062-021 (made with mkfs.fat and mcopy),
# holding Application.evtx (inode 567) and System.evtx (inode 569) from the
# NIST CFReDS Data Leakage Case PC, each cut to its first 64 KiB chunk.
# The image has no sudo; ${STUBS}/sudo stands in for passwordless sudo on SIFT.
case_id: P3088-010
problem: P3088
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "`output_path`는 모델이 정하는 필수 인자라, 파일을 하나씩 꺼내며 같은 출력 이름(`extracted.evtx`)을 다시 쓰는 것은 있을 수 있는 모델 실수다."
coverage: "partial: tsk_icat only; the other tools that write through run_with_output_file (tsk_mactime, tsk_blkls, misc_evtx_dump and others) open the path the same way"
coverage_ko: "`tsk_icat`만 보였다. `run_with_output_file`로 쓰는 다른 도구(`tsk_mactime`, `tsk_blkls`, `misc_evtx_dump` 등)도 같은 방식으로 경로를 연다."
summary: tsk_icat of inode 567 (Application.evtx) and then of inode 569 (System.evtx) to the same output_path both answer success with no word about an existing file; the file's SHA-256 changes from Application.evtx's to System.evtx's, while the trace entry of the first call still names that path as the output of inode 567.
summary_ko: "inode 567(`Application.evtx`)과 inode 569(`System.evtx`)를 같은 `output_path`로 차례로 `tsk_icat`하면 두 호출 모두 기존 파일에 대한 말 없이 성공으로 답한다. 그 파일의 SHA-256은 Application.evtx 값에서 System.evtx 값으로 바뀌는데, 첫 호출의 trace 항목은 여전히 그 경로를 inode 567의 출력으로 적고 있다."
defect_ko: "이 서버는 받은 출력 경로에 파일이 이미 있어도 확인하지 않고 덮어쓰며 그 사실을 알리지 않는다. 정상이라면 기존 파일이 있으면 거부하거나 이름을 바꾸고, 바꿨다면 알려야 한다. 모델은 첫 호출(call 4)을 인용하며 그 경로의 파일을 Application 로그로 잘못 알고, 실제로는 System 로그를 근거로 쓴다."
setup_ko: "`Windows/System32/winevt/Logs/`에 Application.evtx(inode 567)와 System.evtx(inode 569)가 든 FAT 디스크 이미지 `pc.dd`(P2062-021과 같은 증거)를 넣었다."
env:
  PATH: ${STUBS}:${PATH}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
