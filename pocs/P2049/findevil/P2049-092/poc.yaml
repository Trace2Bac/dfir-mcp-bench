# Matrix case P2049-092: analyze_package_logs says it flags npm typosquats,
# but no npm log is read (_NPM_TYPOSQUATS is never used).
case_id: P2049-092
problem: P2049
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "npm으로 typosquat 패키지를 설치한 리눅스 증거는 드물지만 공급망 공격 사례로 실제로 있다."
coverage: "partial: not reading term.log (shown in P4118-007)"
coverage_ko: "term.log를 읽지 않는 문제(P4118-007에서 보임)"
summary: With an npm debug log recording "npm install lodasch" (an entry in the server's own npm typosquat list), the tool reads only the apt log and answers "No package-management red flags."
summary_ko: "npm debug 로그에 \"npm install lodasch\"(서버 자체 npm typosquat 목록에 있는 이름)가 있다. 도구는 apt 로그만 읽고 \"No package-management red flags.\"라고 답한다."
defect_ko: "이 서버는 apt 기록만 읽는다. 설명대로라면 npm 기록도 읽어 typosquat을 표시해야 한다. 모델은 npm typosquat 설치가 있는 호스트를 문제없다고 잘못 안다."
setup_ko: "정상 apt 설치 기록과, 서버 자체 목록에 있는 `lodasch` 설치가 남은 npm 디버그 로그를 두었다."
fixture:
  - path: fs/var/log/apt/history.log
    text: |
      Start-Date: 2026-04-12  10:00:00
      Commandline: apt-get install -y curl
      Install: curl:amd64 (8.5.0-2)
      End-Date: 2026-04-12  10:00:04
  - path: fs/root/.npm/_logs/2026-04-12T14_30_04_000Z-debug-0.log
    text: |
      0 verbose cli /usr/bin/node /usr/bin/npm
      1 info using npm@10.2.4
      2 verbose title npm install lodasch
      3 verbose argv "install" "lodasch"
      4 http fetch GET 200 https://registry.npmjs.org/lodasch 120ms
      5 info run lodasch@1.0.3 postinstall node_modules/lodasch node setup.js
steps:
  - tool: analyze_package_logs
    note_ko: "결함 호출: 패키지 관리 기록 분석"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "읽은 출처가 apt뿐이다"
    contains: "**Sources:** apt"
  - step: 1
    note_ko: "문제없음 판정이 나온다"
    contains: "No package-management red flags."
  - step: 1
    note_ko: "`lodasch`는 응답 어디에도 없다"
    not_contains: "lodasch"
