# Matrix case P2049-039: extract_iocs puts 0.0.0.0, link-local, CGNAT,
# multicast and broadcast addresses under "ipv4 public", and both
# extract_iocs and bulk_ioc_lookup put 127.x under the private / "RFC1918
# (private address space)" list, so the sets do not match their labels.
case_id: P2049-039
problem: P2049
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "`0.0.0.0`, `127.0.0.1`, 링크 로컬·멀티캐스트 주소는 로그와 설정에 흔히 나온다."
coverage: full
summary: Given 0.0.0.0, 169.254.10.20, 100.64.1.1, 224.0.0.251, 255.255.255.255 and 127.0.0.1, extract_iocs lists the first five as public IPs and bulk_ioc_lookup lists 127.0.0.1 under "RFC1918 IPs (private address space)", so the labels do not describe the sets they hold.
summary_ko: "0.0.0.0, 169.254.10.20, 100.64.1.1, 224.0.0.251, 255.255.255.255, 127.0.0.1을 주었다. `extract_iocs`는 앞의 다섯 개를 공인 IP로 나열하고, `bulk_ioc_lookup`은 127.0.0.1을 \"RFC1918 IPs (private address space)\" 아래에 둔다."
defect_ko: "이 서버는 특수 주소를 공인 IP로, 루프백을 RFC1918로 분류한다. 공인 IP 목록에는 실제 공인 주소만, RFC1918 목록에는 사설 대역만 있어야 한다. 모델은 특수 주소를 외부 IOC로 쫓거나 분류를 잘못 안다."
setup_ko: "`0.0.0.0`, 링크 로컬, CGNAT, 멀티캐스트, 브로드캐스트, 루프백 주소가 든 한 줄을 입력으로 준다."
steps:
  - tool: extract_iocs
    note_ko: "결함 호출: IOC 추출"
    args:
      text: "listen 0.0.0.0:22; dhcp fallback 169.254.10.20; cgnat peer 100.64.1.1; mdns 224.0.0.251; bcast 255.255.255.255; local 127.0.0.1"
  - tool: bulk_ioc_lookup
    note_ko: "결함 호출: 같은 글로 IOC 일괄 조회"
    args:
      text: "listen 0.0.0.0:22; dhcp fallback 169.254.10.20; cgnat peer 100.64.1.1; mdns 224.0.0.251; bcast 255.255.255.255; local 127.0.0.1"
expect:
  - step: 1
    note_ko: "특수 주소 다섯 개가 공인 IP 목록에 들어간다"
    regex: "## ipv4 public \\(5\\)\\n- `0\\.0\\.0\\.0`\\n- `100\\.64\\.1\\.1`\\n- `169\\.254\\.10\\.20`\\n- `224\\.0\\.0\\.251`\\n- `255\\.255\\.255\\.255`"
  - step: 2
    note_ko: "조회 도구도 이 다섯 개를 공인 IP로 센다"
    regex: "## Public IPs \\(5\\)"
  - step: 2
    note_ko: "루프백 `127.0.0.1`이 RFC1918 사설 대역으로 표시된다"
    regex: "## RFC1918 IPs \\(1\\)\\n\\(not looked up — private address space\\)\\n- `127\\.0\\.0\\.1`"
