# Matrix case P2049-196: find_timestamp_anomalies documents `limit` as the cap
# for each category, but the identical-timestamp batch list uses a fixed 10.
case_id: P2049-196
problem: P2049
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: forced
realism_ko: "`limit`보다 많이 보여 줄 뿐이고 묶음 전체 수(12개)도 함께 나와 모델이 잘못 알 것이 없다. `limit=2`처럼 작은 값을 줄 이유도 적다."
coverage: full
summary: With limit=2 and twelve files written in the same second, the identical-timestamp batch still lists ten files, so the documented per-category cap is not applied.
summary_ko: "limit=2로 같은 초에 쓴 파일 열두 개를 주면, 같은 타임스탬프 묶음에 파일 열 개가 그대로 나온다. 문서에 적힌 범주별 상한이 적용되지 않는다."
defect_ko: "정상이라면 `limit`이 같은 시각 묶음에도 적용되어야 하는데, 이 서버는 이 범주에 고정 10을 쓴다. 다만 결과가 더 많이 나올 뿐이라 모델이 잘못 알 내용은 거의 없다."
setup_ko: "같은 초에 만든 파일 12개를 두었다."
fixture:
  - {path: tree/f01, text: "1"}
  - {path: tree/f02, text: "2"}
  - {path: tree/f03, text: "3"}
  - {path: tree/f04, text: "4"}
  - {path: tree/f05, text: "5"}
  - {path: tree/f06, text: "6"}
  - {path: tree/f07, text: "7"}
  - {path: tree/f08, text: "8"}
  - {path: tree/f09, text: "9"}
  - {path: tree/f10, text: "10"}
  - {path: tree/f11, text: "11"}
  - {path: tree/f12, text: "12"}
steps:
  - tool: find_timestamp_anomalies
    note_ko: "결함이 있는 호출: `limit=2`로 시각 이상 검사"
    args:
      root_path: ${EVIDENCE}/tree
      limit: 2
expect:
  - step: 1
    note_ko: "같은 시각 묶음 범주가 나온다"
