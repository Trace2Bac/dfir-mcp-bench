  - {path: tree/f01, text: "1"}
  - {path: tree/f02, text: "2"}
  - {path: tree/f03, text: "3"}
  - {path: tree/f04, text: "4"}
  - {path: tree/f05, text: "5"}
  - {path: tree/f06, text: "6"}
  - {path: tree/f07, text: "7"}
