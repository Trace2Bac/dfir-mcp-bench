# Matrix case P2049-007: auth_summary / auth_successful_logins say a login came
# AFTER failed attempts, but they only check that the IP also failed somewhere
# in the log, never the order of the events.
case_id: P2049-007
problem: P2049
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "정상 로그인 뒤에 같은 IP에서 비밀번호를 여러 번 틀리는 일은 드물지만 실제로 생긴다."
coverage: full
summary: When an IP logs in successfully first and only fails five times later, auth_summary still reports LIKELY COMPROMISE "authenticated AFTER failed attempts" and auth_successful_logins flags the login as brute-force-preceded, although no failure came before it.
summary_ko: "어떤 IP가 먼저 로그인에 성공하고 그 뒤에만 다섯 번 실패해도, auth_summary는 LIKELY COMPROMISE \"authenticated AFTER failed attempts\"를 보고하고 auth_successful_logins는 그 로그인을 brute-force-preceded로 표시한다. 그 앞에 실패는 없었다."
defect_ko: "정상이라면 실패 뒤에 성공한 로그인만 무차별 대입 뒤 성공으로 표시해야 하는데, 이 서버는 순서를 보지 않고 같은 IP의 실패가 어디든 있으면 그렇게 표시한다. 그래서 모델은 실패보다 먼저 한 정상 로그인을 침해로 잘못 안다."
setup_ko: "같은 IP가 먼저 한 번 로그인에 성공하고 한 시간 뒤에 다섯 번 실패한 `auth.log`를 두었다."
fixture:
  - path: var/log/auth.log
    text: |
      Apr 15 10:00:00 web sshd[100]: Accepted password for alice from 198.51.100.9 port 50000 ssh2
      Apr 15 11:00:01 web sshd[101]: Failed password for alice from 198.51.100.9 port 50001 ssh2
      Apr 15 11:00:02 web sshd[102]: Failed password for alice from 198.51.100.9 port 50002 ssh2
      Apr 15 11:00:03 web sshd[103]: Failed password for alice from 198.51.100.9 port 50003 ssh2
      Apr 15 11:00:04 web sshd[104]: Failed password for alice from 198.51.100.9 port 50004 ssh2
      Apr 15 11:00:05 web sshd[105]: Failed password for alice from 198.51.100.9 port 50005 ssh2
steps:
  - tool: auth_summary
    note_ko: "결함이 있는 호출: 인증 로그 요약 판정"
    args:
      path: ${EVIDENCE}/var/log/auth.log
  - tool: auth_successful_logins
    note_ko: "결함이 있는 호출: 성공한 로그인 목록과 표시"
    args:
      path: ${EVIDENCE}/var/log/auth.log
expect:
  - step: 1
    note_ko: "침해 가능성 높음(LIKELY COMPROMISE) 판정이 나온다"
    contains: "LIKELY COMPROMISE"
  - step: 1
    note_ko: "그 IP가 실패 뒤에(AFTER) 인증했다고 적는다"
    regex: "authenticated AFTER failed attempts: `198\\.51\\.100\\.9`"
  - step: 2
    note_ko: "실패보다 먼저 한 1번 줄 로그인이 무차별 대입 뒤 성공으로 표시된다"
    regex: "\\| 1 \\| Apr 15 10:00:00 \\| alice \\| 198\\.51\\.100\\.9 \\| password \\| ⚠ brute-force-preceded"
