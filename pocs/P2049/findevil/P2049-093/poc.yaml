# Matrix case P2049-093: analyze_container_artifacts says it flags "daemon TCP
# listeners without TLS", but _scan_docker_daemon never reads tls /
# tlsverify and flags every non-loopback TCP listener, including one that
# requires client certificates.
case_id: P2049-093
problem: P2049
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
coverage: full
summary: A daemon.json with tcp://0.0.0.0:2376 and tlsverify true (mutual TLS) is reported as a TCP listener weakening isolation, the case the tool description reserves for listeners without TLS.
fixture:
  - path: fs/etc/docker/daemon.json
    text: |
      {
        "hosts": ["unix:///var/run/docker.sock", "tcp://0.0.0.0:2376"],
        "tls": true,
        "tlsverify": true,
        "tlscacert": "/etc/docker/certs/ca.pem",
        "tlscert": "/etc/docker/certs/server-cert.pem",
        "tlskey": "/etc/docker/certs/server-key.pem",
        "userns-remap": "default"
      }
steps:
  - tool: analyze_container_artifacts
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    contains: "daemon listens on TCP: tcp://0.0.0.0:2376"
  - step: 1
    contains: "\"tlsverify\": true"
