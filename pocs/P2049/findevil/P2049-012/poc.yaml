# Matrix case P2049-012: verify_package_integrity's "Actual MD5" is _md5_of(),
# which stops reading at 1 GiB, but it is compared with dpkg's MD5 of the
# whole file, so any packaged file over 1 GiB is reported as Modified.
#
# The fixture is a sparse file of 1 GiB + 1 zero bytes (fixture "size").
#   MD5 of 1073741825 zero bytes (whole file, what dpkg records): ba82f54484baeb7846d8df0fe3623c99
#   MD5 of the first 1073741824 bytes (what the tool computes):  cd573cfaace07e7949bc0c46028904ff
case_id: P2049-012
problem: P2049
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
coverage: full
summary: An unmodified 1 GiB + 1 byte package file whose dpkg MD5 matches the whole file is listed as Modified, with the MD5 of only its first 1 GiB shown as "Actual MD5".
summary_ko: "dpkg MD5가 파일 전체와 일치하는, 수정되지 않은 1 GiB + 1바이트 패키지 파일이 Modified로 표시되고, 처음 1 GiB만의 MD5가 \"Actual MD5\"로 표시된다."
fixture:
  - path: fs/usr/lib/bigpkg/model.bin
    size: 1073741825
  - path: fs/var/lib/dpkg/info/bigpkg.md5sums
    text: "ba82f54484baeb7846d8df0fe3623c99  usr/lib/bigpkg/model.bin\n"
steps:
  - tool: verify_package_integrity
    args:
      root_path: ${EVIDENCE}/fs
    timeout_s: 120
expect:
  - step: 1
    contains: "| `bigpkg` | `/usr/lib/bigpkg/model.bin` | `ba82f54484baeb7846d8df0fe3623c99` | `cd573cfaace07e7949bc0c46028904ff` |"
