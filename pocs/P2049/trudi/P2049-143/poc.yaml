# Matrix case P2049-143: net_tcpdump_list_connections says it extracts the
# unique source/destination IP pairs and ports from a pcap, but it returns
# the output of `tcpdump -r <pcap> -nn -q "tcp or udp"` as is: one line per
# packet, with nothing de-duplicated.
# The capture is a real pcap (libpcap, Ethernet): a DNS lookup of
# update-cdn.example.net and five short HTTPS connections from 10.0.0.8 to
# 203.0.113.7:443, one a minute (42 packets).
# trudi runs tcpdump as `sudo tcpdump ...` (SIFT has passwordless sudo); the
# image has no sudo, so ${STUBS}/sudo only runs the command it is given.
# tcpdump itself is the real one.
case_id: P2049-143
problem: P2049
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "주기적인 C2 비컨처럼 같은 두 호스트 사이 연결이 반복되는 pcap은 흔하고, 연결 목록은 분석의 첫 단계다."
coverage: full
summary: On a pcap of one DNS lookup and five HTTPS connections from 10.0.0.8 to 203.0.113.7:443, net_tcpdump_list_connections returns all 42 packet lines (the first connection's client-to-server line alone 4 times) instead of the unique pairs and ports.
summary_ko: "DNS 조회 하나와 10.0.0.8→203.0.113.7:443 HTTPS 연결 다섯 개가 든 pcap에서, net_tcpdump_list_connections는 고유한 쌍·포트 대신 패킷 42줄을 모두 돌려준다(첫 연결의 클라이언트→서버 줄만 4줄)."
defect_ko: "이 서버는 tcpdump의 패킷별 출력을 그대로 돌려준다. 정상이라면 설명대로 출발지·목적지 IP 쌍과 포트를 중복 없이 뽑아야 한다(여기서는 DNS 한 쌍과 443 연결 다섯 개). 모델은 줄 수를 연결 수로 읽거나, 긴 pcap에서는 잘린 패킷 목록을 전체 연결 목록으로 잘못 안다."
setup_ko: "update-cdn.example.net DNS 조회와, 1분 간격으로 203.0.113.7:443에 붙는 짧은 HTTPS 연결 다섯 개(패킷 42개)가 든 실제 pcap을 넣었다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
  PATH: ${STUBS}:${PATH}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: net/beacon.pcap
    hex: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P2049-143
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: net_tcpdump_list_connections
    note_ko: "결함 호출: pcap의 고유 연결 목록"
    args:
      pcap_file: ${EVIDENCE}/net/beacon.pcap
expect:
  - step: 2
    note_ko: "성공 응답이다"
    regex: "\"success\":\\s*true"
  - step: 2
    note_ko: "첫 연결의 같은 출발지·목적지·포트 줄이 하나로 묶이지 않고 네 번 나온다"
    regex: "(10\\.0\\.0\\.8\\.49812 > 203\\.0\\.113\\.7\\.443[\\s\\S]*?){4}"
  - step: 2
    note_ko: "다섯째 연결의 마지막 패킷까지 패킷마다 한 줄이 있다"
    contains: "08:04:01.337000 IP 203.0.113.7.443 > 10.0.0.8.49824: tcp 0"
