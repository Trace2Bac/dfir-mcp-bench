# Matrix case P2049-137: af_event_log_clear says it finds EID 1102/104 in the
# ez.evtxecmd output with the clearing account, but it searches only the first
# 600 characters of each run's console output (stdout_excerpt). EvtxECmd
# writes the events to its CSV, and its console starts with a banner, so a
# Security log that holds a 1102 still gives clear_events_found: 0.
case_id: P2049-137
problem: P2049
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "공격자가 wevtutil cl 등으로 보안 로그를 지우면 1102 한 건이 남는 것은 흔한 안티포렌식이고, 이 도구는 바로 그것을 찾으라고 있다."
coverage: full
summary: On a Security.evtx that holds an EID 1102 (log cleared by EXAMPLE\user01), ez.evtxecmd parses it and counts the 1102, yet af_event_log_clear answers success with clear_events_found 0 and no clearing account.
summary_ko: "EID 1102(EXAMPLE\\user01이 로그를 지움)가 든 Security.evtx를 ez.evtxecmd가 해석해 1102를 1건으로 세는데도, af_event_log_clear는 clear_events_found 0과 함께 성공으로 답하고 지운 계정도 내지 않는다."
defect_ko: "이 서버는 EvtxECmd 콘솔 출력의 앞 600자(배너와 명령줄)만 뒤져 1102를 찾지 못하고 0건을 성공으로 돌려준다. 정상이라면 EvtxECmd가 만든 CSV에서 1102·104를 찾아 지운 계정과 함께 돌려줘야 한다. 모델은 이벤트 로그가 지워진 흔적이 없다고 잘못 안다."
setup_ko: "보안 로그 지우기 공개 표본(EVTX-ATTACK-SAMPLES의 DE_1102_security_log_cleared.evtx, 1102 1건과 4663 등 112건)을 Security.evtx로 넣었다."
fixture:
  # trudi does not create the trace folder; an empty analysis/ is made for it.
  - path: analysis/.keep
    root: db
    text: ""
  # Real Security.evtx from EVTX-ATTACK-SAMPLES (sbousseaden), "Defense
  # Evasion/DE_1102_security_log_cleared.evtx", sha256 a0615707...a39e8,
  # 1,118,208 bytes. Its two used chunks (first 135,168 bytes) are given; the
  # rest of the file is the zero-filled preallocated space, written by size.
  - path: C/Windows/System32/winevt/Logs/Security.evtx
    size: 1118208
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P2049-137
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: ez_evtxecmd
    note_ko: "비교 호출: EvtxECmd로 Security.evtx를 해석한다"
    args:
      evtx_path: ${EVIDENCE}/C/Windows/System32/winevt/Logs/Security.evtx
      output_dir: ${DB_DIR}/analysis/evtx
      output_file: Security.csv
    timeout_s: 300
  - tool: read_output
    note_ko: "비교 호출: EvtxECmd CSV에서 EventId 1102 행을 읽는다"
    args:
      path: ${DB_DIR}/analysis/evtx/Security.csv
      where: EventId=1102
      columns: TimeCreated,EventId,MapDescription,UserName
  - tool: af_event_log_clear
    note_ko: "결함 호출: 이벤트 로그 지우기 탐지"
expect:
  - step: 3
    note_ko: "EvtxECmd CSV에 1102(Event log cleared) 행이 있다"
    regex: "1102[^\\n]{0,80}Event log cleared"
  - step: 4
    note_ko: "탐지 도구는 성공으로 답한다"
    regex: "\"success\":\\s*true"
  - step: 4
    note_ko: "탐지 도구는 지우기 이벤트를 0건으로 센다"
    regex: "\"clear_events_found\":\\s*0\\b"
