# Matrix case P2049-149: hash_ssdeep_scan_directory says it finds similar
# files in a directory and reports those at or above `threshold`, but it runs
# `ssdeep -r -t N <dir>` with no matching mode (-d, -p, -m). Without one,
# ssdeep only computes a fuzzy hash per file; -t only applies to matching
# output. ssdeep is the real one (1.1).
# The folder holds two variants of one PowerShell beacon script (C2 host and
# key differ; `ssdeep -r -d` scores them 96) and an unrelated backup script.
case_id: P2049-149
problem: P2049
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "떨군 스크립트의 변종을 폴더에서 찾으려고 퍼지 해시 유사도 검사를 쓰는 일은 흔하다."
coverage: full
summary: hash_ssdeep_scan_directory with threshold 50 on a folder holding two variants of one script (ssdeep scores them 96) returns success with a fuzzy hash line per file, the unrelated script included, and no match line, so no similar pair is reported.
summary_ko: "한 스크립트의 변종 두 개(ssdeep 유사도 96)가 든 폴더에 `hash_ssdeep_scan_directory`를 threshold 50으로 돌리면, 관계없는 스크립트까지 파일마다 해시 한 줄씩만 담긴 성공 응답이 오고 비슷한 쌍은 보고되지 않는다."
defect_ko: "이 서버는 비교 모드 없이 `ssdeep -r -t`를 돌려 파일별 퍼지 해시만 돌려준다. 설명대로라면 파일끼리 비교해 threshold 이상인 쌍(`A matches B (96)`)만 보고해야 한다. 모델은 폴더에 비슷한 파일이 없다고 잘못 알거나, 나열된 파일을 모두 threshold 이상 비슷한 파일로 잘못 안다."
setup_ko: "C2 주소와 키만 다른 PowerShell 비컨 스크립트 두 개와 관계없는 백업 스크립트 하나를 폴더에 넣었다."
