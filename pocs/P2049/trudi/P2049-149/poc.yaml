  - path: case01/analysis/.keep
    root: outside
    text: ""
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 기록을 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: hash_ssdeep_scan_directory
    note_ko: "결함 호출: 폴더에서 유사도 50 이상인 파일을 찾음"
    args:
      directory: ${EVIDENCE}/scripts
      threshold: 50
  - tool: hash_ssdeep_compare
    note_ko: "비교 호출: 두 변종을 직접 비교해 유사도를 확인함"
    args:
      file1: ${EVIDENCE}/scripts/WinUpdHealth.ps1
      file2: ${EVIDENCE}/scripts/svc_helper.ps1
expect:
  - step: 3
    note_ko: "두 변종은 직접 비교하면 유사도 96이다"
    regex: 'svc_helper\.ps1 matches \S*WinUpdHealth\.ps1 \(96\)'
  - step: 2
    note_ko: "폴더 검사는 성공 응답이다"
    contains: '"success": true'
  - step: 2
    note_ko: "응답은 비교 결과가 아니라 ssdeep 해시 목록 머리글로 시작한다"
    contains: "ssdeep,1.1--blocksize:hash:hash,filename"
  - step: 2
    note_ko: "비슷한 파일이 없는 백업 스크립트도 해시 줄로 나온다"
    regex: '96:[^,]+,\\"\S*backup\.ps1'
  - step: 2
    note_ko: "유사한 쌍을 알리는 matches 줄이 없다"
    not_contains: " matches "
