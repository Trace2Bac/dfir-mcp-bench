# Matrix case P2049-031: af_prefetch_deletion says it cross-references the
# ez.pecmd output against ez.appcompatcacheparser / ez.amcacheparser entries,
# but it only pulls .exe names out of the 600-character console excerpt of
# each run in the trace. PECmd's excerpt names one prefetch file, and
# AppCompatCacheParser's console names no executable at all (the entries are
# in its CSV), so nothing is compared and the response still says
# cross_ref_complete: true.
case_id: P2049-031
problem: P2049
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "공격자가 CCleaner 같은 도구를 쓰고 그 Prefetch 파일을 지우는 것은 흔한 안티포렌식이고, 도구는 PECmd·ShimCache를 돌린 뒤 부르라고 안내한다."
coverage: full
summary: With 5 prefetch files parsed by ez.pecmd and 292 ShimCache entries (CCleaner64.exe among them, with no .pf) parsed by ez.appcompatcacheparser, af_prefetch_deletion reports prefetched_count 1, executed_count 0, no deletion candidates and cross_ref_complete true.
summary_ko: "ez.pecmd가 Prefetch 파일 5개를, ez.appcompatcacheparser가 ShimCache 항목 292개(.pf가 없는 CCleaner64.exe 포함)를 해석했는데도, af_prefetch_deletion은 prefetched_count 1, executed_count 0, 삭제 후보 없음과 cross_ref_complete true를 돌려준다."
defect_ko: "이 서버는 두 도구의 콘솔 출력 앞 600자에서 exe 이름만 뽑아 대조한다. PECmd 발췌에는 .pf 하나만, AppCompatCacheParser 발췌에는 exe가 하나도 없어 실제로는 아무것도 대조하지 않고 cross_ref_complete true를 붙인다. 정상이라면 두 도구가 만든 CSV 전체를 대조해 .pf 없는 실행 파일(CCleaner64.exe 등)을 후보로 내야 한다. 모델은 Prefetch 삭제 흔적이 없다고 잘못 안다."
setup_ko: "실제 Windows 7 이미지(pc-triage)에서 Prefetch 파일 5개와, 그 이미지 SYSTEM 하이브의 AppCompatCache 값(항목 292개, CCleaner64.exe 포함)만 담은 SYSTEM 하이브를 넣었다. CCleaner64.exe의 .pf는 없다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # SYSTEM hive reduced to what AppCompatCacheParser reads: the real
  # AppCompatCache value (60,816 bytes, 292 Windows 7 x64 entries) of the
  # pc-triage image's SYSTEM hive, with Select and
  # Session Manager\Environment\PROCESSOR_ARCHITECTURE, in a regf 1.5 hive.
  - path: C/Windows/System32/config/SYSTEM
    base64: 
  # SC.EXE-945D79AE.pf: real Windows 7 prefetch file from the same image (sha1 323b5b6d0f50)
  - path: C/Windows/Prefetch/SC.EXE-945D79AE.pf
    base64: 
  # PING.EXE-371F41E2.pf: real Windows 7 prefetch file from the same image (sha1 0085f04d585f)
  - path: C/Windows/Prefetch/PING.EXE-371F41E2.pf
    base64: 
  # WEVTUTIL.EXE-400D93E8.pf: real Windows 7 prefetch file from the same image (sha1 a4b345cb096c)
  - path: C/Windows/Prefetch/WEVTUTIL.EXE-400D93E8.pf
    base64: 
  # CONHOST.EXE-1F3E9D7E.pf: real Windows 7 prefetch file from the same image (sha1 45a7112aff19)
  - path: C/Windows/Prefetch/CONHOST.EXE-1F3E9D7E.pf
    base64: 
  # SCHTASKS.EXE-AD598958.pf: real Windows 7 prefetch file from the same image (sha1 44c37f27b160)
  - path: C/Windows/Prefetch/SCHTASKS.EXE-AD598958.pf
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P2049-031
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: ez_pecmd
    note_ko: "비교 호출: PECmd로 Prefetch 폴더를 해석한다"
    args:
      prefetch_path: ${EVIDENCE}/C/Windows/Prefetch
      output_dir: ${DB_DIR}/analysis/prefetch
      output_file: prefetch.csv
    timeout_s: 300
  - tool: ez_appcompatcacheparser
    note_ko: "비교 호출: AppCompatCacheParser로 SYSTEM 하이브의 ShimCache를 해석한다"
    args:
      system_hive: ${EVIDENCE}/C/Windows/System32/config/SYSTEM
      output_dir: ${DB_DIR}/analysis/shimcache
      output_file: shimcache.csv
    timeout_s: 300
  - tool: read_output
    note_ko: "비교 호출: ShimCache CSV에서 CCleaner64.exe 항목을 읽는다"
    args:
      path: ${DB_DIR}/analysis/shimcache/shimcache.csv
      query: CCleaner64.exe
      max_rows: 3
  - tool: read_output
    note_ko: "비교 호출: Prefetch CSV의 실행 파일 이름을 읽는다"
    args:
      path: ${DB_DIR}/analysis/prefetch/prefetch.csv
      columns: SourceFilename,ExecutableName,RunCount
  - tool: af_prefetch_deletion
    note_ko: "결함 호출: Prefetch 삭제 탐지"
expect:
  - step: 2
    note_ko: "PECmd는 Prefetch 파일 5개를 찾았다"
    contains: "Found 5 Prefetch files"
  - step: 3
    note_ko: "AppCompatCacheParser는 ShimCache 항목 292개를 찾았다"
    contains: "Found 292 cache entries"
  - step: 4
    note_ko: "ShimCache에 CCleaner64.exe가 있다"
    regex: "CCleaner\\\\\\\\CCleaner64\\.exe"
  - step: 5
    note_ko: "Prefetch CSV에는 CCleaner64.exe가 없다"
    not_regex: "(?i)ccleaner"
  - step: 5
    note_ko: "Prefetch CSV에는 실행 파일 5개의 행이 있다"
    regex: "(\\.pf,[A-Z]+\\.EXE,\\d+[\\s\\S]*?){5}"
  - step: 6
    note_ko: "탐지 도구는 Prefetch 실행 파일을 1개로 센다"
    regex: "\"prefetched_count\":\\s*1\\b"
  - step: 6
    note_ko: "탐지 도구는 실행된 파일을 0개로 센다"
    regex: "\"executed_count\":\\s*0\\b"
  - step: 6
    note_ko: "삭제 후보가 없다"
    regex: "\"deletion_candidates\":\\s*\\[\\]"
  - step: 6
    note_ko: "그런데도 대조를 끝냈다고 한다"
    regex: "\"cross_ref_complete\":\\s*true"
