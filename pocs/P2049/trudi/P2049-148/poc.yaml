      118850,1,True,4120,1,.\ProgramData\Microsoft,update.log,.log,912,1,,False,False,False,False,False,False,Archive,DosWindows,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,2024-10-27 03:41:09.7702114,94121336,0,1764,,,,C:\cases\case01\$MFT
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 기록을 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: af_timestomp_drift
    note_ko: "결함 호출: MFTECmd CSV에서 timestomp를 찾음"
    args:
      mft_csv_path: ${OUTSIDE}/case01/analysis/mft/20241028_MFTECmd_$MFT_Output.csv
expect:
