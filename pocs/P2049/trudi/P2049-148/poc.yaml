    note_ko: "세 행을 모두 읽었다"
    contains: '"total_checked": 3'
  - step: 2
    note_ko: "만든 시각이 5년 어긋난 행이 있는데도 어긋난 행이 0건이다"
    contains: '"drift_count": 0'
  - step: 2
    note_ko: "timestomp 발견 제안도 없다"
    contains: '"suggested_finding": null'
