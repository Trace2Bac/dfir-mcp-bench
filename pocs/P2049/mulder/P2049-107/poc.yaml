# Matrix case P2049-107: run_pcap_analysis's dns and smtp modes pass tshark
# fields that do not exist in this tshark (dns.resp.addr, smtp.response.parameter),
# so tshark always fails; the error text is indexed as pcap.dns / pcap.smtp and
# the tool reports success with status "indexed" (upstream issue #273).
# The capture is a real libpcap file: three DNS lookups with answers and one
# SMTP session (Ethernet/IPv4/UDP and TCP, valid checksums), written by a script.
case_id: P2049-107
problem: P2049
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: response
level: mcp
realism: common
realism_ko: "DNS 질의와 메일 전송을 보는 것은 패킷 분석의 기본이고, 필드 이름 오류는 입력과 상관없이 dns·smtp 모드를 부를 때마다 일어난다."
coverage: full
summary: >-
  On a capture with three DNS lookups and one SMTP session, run_pcap_analysis
  in dns and smtp mode returns success with pcap.dns and pcap.smtp "indexed",
  but what was indexed is tshark's "Some fields aren't valid" error for
  dns.resp.addr and smtp.response.parameter, not DNS or SMTP records.
summary_ko: "DNS 조회 3건과 SMTP 세션 1건이 든 캡처에서 `run_pcap_analysis`의 dns·smtp 모드는 `pcap.dns`·`pcap.smtp`가 `indexed`인 성공 응답을 낸다. 그러나 적재된 것은 DNS·SMTP 기록이 아니라 `dns.resp.addr`·`smtp.response.parameter`가 유효하지 않다는 tshark 오류 문구다."
defect_ko: "이 서버는 이 tshark에 없는 필드 이름을 넘겨 dns·smtp 추출이 늘 실패하는데, 그 오류 문구를 결과로 적재하고 성공(`indexed`)이라고 답한다. 정상이라면 `dns.a`·`smtp.rsp.parameter`로 질의·응답을 뽑거나, 적어도 실패를 오류로 알려야 한다. 모델은 DNS·SMTP 결과가 적재됐다고 믿고, 그 source에서 도메인·메일 주소를 못 찾으면 그런 통신이 없었다고 잘못 안다."
setup_ko: "`update.windows-cdn.net` 등 DNS 조회 3건(응답 포함)과 `drop.box@mailbox.example.net`으로 메일을 보내는 SMTP 세션 1건이 든 pcap 파일을 넣었다."
fixture:
  - path: net/capture.pcap
    hex: 
steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: pcap-dns-smtp
  - tool: run_pcap_analysis
    note_ko: "결함 호출: DNS 질의·응답 추출"
    args:
      pcap_path: ${EVIDENCE}/net/capture.pcap
      mode: dns
  - tool: get_raw_output
    note_ko: "결함 호출: 적재된 pcap.dns 원문 읽기"
    args:
      source_name: pcap.dns
  - tool: run_pcap_analysis
    note_ko: "결함 호출: SMTP 거래 추출"
    args:
      pcap_path: ${EVIDENCE}/net/capture.pcap
      mode: smtp
  - tool: get_raw_output
    note_ko: "결함 호출: 적재된 pcap.smtp 원문 읽기"
    args:
      source_name: pcap.smtp
  - tool: run_pcap_analysis
    note_ko: "비교 호출: 같은 캡처의 대화 목록(정상 동작하는 모드)"
    args:
      pcap_path: ${EVIDENCE}/net/capture.pcap
      mode: conversations
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 pcap.conversations 원문 읽기"
    args:
      source_name: pcap.conversations
expect:
  - step: 2
    note_ko: "dns 모드가 오류가 아닌 응답으로 돌아온다"
    is_error: false
  - step: 2
    note_ko: "응답은 성공이고 pcap.dns가 적재됐다(indexed)고 한다"
    regex: '"status": "success"[\s\S]*pcap\.dns\\?"[^}]*\\?"status\\?": \\?"indexed'
  - step: 3
    note_ko: "pcap.dns에 적재된 것은 DNS 기록이 아니라 dns.resp.addr이 유효하지 않다는 tshark 오류다"
    regex: "tshark error \\(exit 1\\): tshark: Some fields aren't valid:\\\\n\\\\tdns\\.resp\\.addr"
  - step: 4
    note_ko: "smtp 모드도 성공이고 pcap.smtp가 적재됐다고 한다"
    regex: '"status": "success"[\s\S]*pcap\.smtp\\?"[^}]*\\?"status\\?": \\?"indexed'
  - step: 5
    note_ko: "pcap.smtp에 적재된 것은 smtp.response.parameter가 유효하지 않다는 tshark 오류다"
    regex: "Some fields aren't valid:\\\\n\\\\tsmtp\\.response\\.parameter"
  - step: 7
    note_ko: "같은 캡처의 다른 모드는 SMTP 서버 주소를 정상으로 뽑는다(캡처 파일은 멀쩡하다)"
    contains: "198.51.100.25"
