# Matrix case P2049-061: get_carved_iocs in summary mode says it returns
# per-feature window counts, but fills window_count with line_count // 4 + 1,
# not the number of windows the feature was indexed into.
# The evidence is a real 1 MiB FAT12 image (mkfs.fat 4.2, label USBSTICK) with
# one file, CONTACTS.CSV (60 contact rows with e-mail addresses), written into
# the first free cluster by a script; fsck.fat and fls read it cleanly. Only
# the first 21,504 bytes are not zero; the rest of the image is written sparse.
# bulk_extractor 2.2.1 in the image crashes (SIGSEGV) when run under a uid with
# no /etc/passwd entry; run the server as the image's mulder user (uid 1000).
case_id: P2049-061
problem: P2049
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "bulk_extractor로 이미지에서 이메일 주소를 뽑은 뒤 `get_carved_iocs` 요약으로 무엇이 얼마나 나왔는지 보는 것은 도구 설명이 안내하는 기본 흐름이고, 잘못된 값은 줄이 4줄 이상인 모든 feature에서 나온다."
coverage: full
summary: >-
  After run_bulk_extractor indexes 65 lines of e-mail features from a USB
  image into 2 windows, get_carved_iocs in summary mode reports window_count
  17 for bulk.email (65 // 4 + 1), while the same tool in detail mode returns
  total_windows 2.
summary_ko: "`run_bulk_extractor`가 USB 이미지에서 뽑은 이메일 feature 65줄을 window 2개로 적재한 뒤, `get_carved_iocs` 요약 모드는 `bulk.email`의 `window_count`를 17(65 // 4 + 1)로 알린다. 같은 도구의 상세 모드는 `total_windows` 2를 돌려준다."
defect_ko: "이 서버는 요약 모드의 `window_count`를 실제 window 수가 아니라 줄 수에서 만든 값(`line_count // 4 + 1`)으로 채운다. 설명대로라면 feature별로 실제 적재된 window 수를 알려야 한다. 모델은 이메일 feature가 window 17개 분량이라고 믿고, 상세 모드가 2개만 돌려주면 나머지가 잘렸거나 빠졌다고 잘못 안다."
setup_ko: "연락처 60명(이메일 주소 포함)이 든 `CONTACTS.CSV` 하나가 있는 1MiB FAT12 USB 이미지를 넣었다."
fixture:
  - path: usb.img
    # First 21,504 bytes of the FAT12 image (boot sector, two FATs, root
    # directory, the CSV's clusters); size pads the rest with zeros.
    base64: 
    size: 1048576
steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: usb-carve
  - tool: run_bulk_extractor
    note_ko: "비교 호출: 이메일 스캐너로 카빙·적재(feature별로 적재한 window 수를 알린다)"
    args:
      image_path: ${EVIDENCE}/usb.img
      scanners: [email]
  - tool: get_carved_iocs
    note_ko: "결함 호출: feature별 window 수 요약"
    args: {}
  - tool: get_carved_iocs
    note_ko: "비교 호출: 이메일 feature의 window 상세"
    args:
      feature: email
expect:
  - step: 2
    note_ko: "적재 결과는 bulk.email을 65줄, window 2개로 적재했다고 한다"
    regex: 'bulk\.email\\?", \\?"windows_indexed\\?": 2, \\?"line_count\\?": 65'
  - step: 3
    note_ko: "요약 모드는 bulk.email의 window 수를 17(65 // 4 + 1)로 알린다"
    regex: '"source_name": "bulk\.email",\s*"feature": "email",\s*"window_count": 17\b'
  - step: 4
    note_ko: "같은 도구의 상세 모드는 bulk.email의 전체 window가 2개라고 돌려준다"
    regex: '"source": "bulk\.email",[\s\S]*"total_windows": 2\b'
