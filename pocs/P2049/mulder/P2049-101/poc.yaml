# Matrix case P2049-101: get_eventlog_anomalies says it scores every event of a
# channel by k-NN density and returns the top outliers, but it returns the
# channel's windows in the time range as they are; top_percent only goes into
# the audit params.
# The evidence is a real 1 MiB FAT12 image (mkfs.fat 4.2, label EVTXLOGS) that
# holds one real event log, Microsoft-Windows-TerminalServices-LocalSessionManager
# %4Operational.evtx (36 records, informant-PC, March 2015) from the NIST CFReDS
# Data Leakage case (data/evidence/pc-triage), written with its long file name
# by a script; fsck.fat reads it cleanly and icat returns the log byte for byte.
# Only the first 44,032 bytes are not zero; the rest is written sparse.
case_id: P2049-101
problem: P2049
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "이벤트 로그를 적재한 뒤 이상한 항목만 골라 보려고 `get_eventlog_anomalies`를 부르는 것은 도구 설명이 그대로 권하는 사용이고, 결과는 채널·시간 범위와 상관없이 늘 같은 방식으로 나온다."
coverage: full
summary: >-
  After a TerminalServices LocalSessionManager log (36 records) is indexed into
  5 windows, get_eventlog_anomalies with top_percent 0.1 returns all 5 windows
  in time order, starting with the CSV header window, which is exactly what
  get_raw_output returns for the source; nothing was scored or selected.
summary_ko: "TerminalServices LocalSessionManager 로그(기록 36건)가 window 5개로 적재된 뒤, `get_eventlog_anomalies`를 `top_percent` 0.1로 부르면 CSV 머리줄 window부터 시작해 window 5개를 모두 시간 순서대로 돌려준다. 이는 같은 source의 `get_raw_output`과 똑같고, 점수를 매기거나 고른 것이 없다."
defect_ko: "이 서버는 채널의 window를 시간 범위로 잘라 그대로 돌려주고 `top_percent`는 감사 기록에만 넣는다. 설명대로라면 사건마다 k-NN 밀도 점수를 매겨 상위 이상치(여기서는 상위 10%)만 돌려줘야 한다. 모델은 돌려받은 항목을 이상치로 골라낸 사건으로 잘못 알고, 평범한 로그온·로그오프 기록을 이상 징후로 보고한다."
setup_ko: "실제 Windows 이벤트 로그 하나(원격 데스크톱 세션 로그온·로그오프 기록 36건)가 든 FAT12 USB 이미지를 넣었다."
fixture:
  - path: logs.img
    # First 44,032 bytes of the FAT12 image (boot sector, FATs, root directory
    # with the long file name, the log's clusters); size pads the rest with zeros.
    base64: 
    size: 1048576
steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: evtx-anomalies
  - tool: run_evtx_parser
    note_ko: "이미지에서 이벤트 로그 꺼내기"
    args:
      evtx_path: ${EVIDENCE}/logs.img
  - tool: index_evtx_file
    note_ko: "비교 호출: 로그 적재(적재한 window 수를 알린다)"
    args:
      filename: Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
  - tool: get_eventlog_anomalies
    note_ko: "결함 호출: 상위 10% 이상치 요청"
    args:
      channel: microsoft-windows-terminalservices-localsessionmanager4operational
      t_start: "2015-03-01T00:00:00"
      t_end: "2015-04-01T00:00:00"
      top_percent: 0.1
  - tool: get_raw_output
    note_ko: "비교 호출: 같은 source의 원문 전체"
    args:
      source_name: evtx.microsoft-windows-terminalservices-localsessionmanager4operational
expect:
  - step: 3
    note_ko: "로그는 기록 37줄(머리줄 포함), window 5개로 적재됐다"
    regex: 'windows_indexed\\?": 5, \\?"line_count\\?": 37'
  - step: 4
    note_ko: "상위 10%를 요청했는데 window 5개 전부가 돌아온다"
    regex: '"result_count": 5,\s*"total_windows": 5\b'
  - step: 4
    note_ko: "첫 결과는 점수 매긴 사건이 아니라 CSV 머리줄(RecordNumber,EventRecordId,…)로 시작하는 첫 window다"
    regex: '"results": \[\s*\{\s*"window_id": \d+,\s*"source_id": \d+,\s*"line_start": 1,[\s\S]*?"raw_text": "\S*RecordNumber,EventRecordId,TimeCreated'
  - step: 5
    note_ko: "같은 source의 원문도 window 5개다(이상치 도구가 전체를 그대로 돌려준 것이다)"
    regex: '"total_windows": 5,\s*"returned_windows": 5'
