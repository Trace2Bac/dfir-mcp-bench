steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: time-range-by-mode
  - tool: run_pcap_analysis
    note_ko: "pcap의 HTTP 요청 적재"
    args:
      pcap_path: ${EVIDENCE}/net/capture.pcap
      mode: http
  - tool: search
    note_ko: "결함 호출: 다운로드 시각(09:41)을 포함한 한 시간을 키워드로 검색"
    args:
      query: svchost.exe
      source: pcap
      t_start: "2026-11-03T09:00:00"
      t_end: "2026-11-03T10:00:00"
  - tool: search
    note_ko: "결함 호출: 같은 출처·같은 한 시간을 정규식으로 검색"
    args:
      query: "svchost\\.exe"
      regex: true
      source: pcap
      t_start: "2026-11-03T09:00:00"
      t_end: "2026-11-03T10:00:00"
  - tool: search
    note_ko: "결함 호출: 다운로드와 상관없는 2020년 하루를 정규식으로 검색"
    args:
      query: "svchost\\.exe"
      regex: true
      source: pcap
      t_start: "2020-06-30T00:00:00"
      t_end: "2020-06-30T23:59:59"
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 HTTP 출력 원문(09:41:27의 요청)"
    args:
      source_name: pcap.http
expect:
  - step: 6
    note_ko: "적재된 원문에 09:41:27의 `/dl/svchost.exe` 요청이 있다"
    regex: 'Nov  3, 2026 09:41:27\.\d+ UTC\\t10\.0\.2\.42\\t203\.0\.113\.7\\tGET\\t/dl/svchost\.exe'
  - step: 3
    note_ko: "키워드 검색은 그 시간 범위에서 success에 0건이다"
    regex: '"status": "success"[\s\S]*"total_matches": 0\b'
  - step: 4
    note_ko: "같은 범위의 정규식 검색은 `pcap.http` 창 1건을 돌려준다"
    regex: '"event_time": null[\s\S]*"total_matches": 1\b'
  - step: 5
    note_ko: "정규식 검색은 2020년 범위에서도 같은 창을 돌려준다"
    regex: '"event_time": null[\s\S]*"total_matches": 1\b'
