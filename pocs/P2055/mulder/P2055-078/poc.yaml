# Matrix case P2055-078: search says t_start/t_end filter by ISO 8601 time
# and regex is a Python regex, but the keyword path (FTS) drops windows whose
# event_time is NULL while the regex path keeps them, so the same source and
# time range give different results by search mode. pcap windows have no
# event_time in mulder (tshark's "Nov  3, 2026 09:41:27" matches none of
# _parse_timestamp's patterns).
case_id: P2055-078
problem: P2055
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "사고 시각 전후로 범위를 좁혀 pcap 결과를 찾는 것은 흔하고, 설명이 시간 범위가 검색 방식에 따라 다르게 적용된다고 알리지 않으므로 모델은 키워드와 정규식을 섞어 쓴다."
coverage: full
summary: >-
  For a pcap whose HTTP download of /dl/svchost.exe happened at 2026-11-03
  09:41:27 UTC, search on source 'pcap' for 09:00-10:00 that day returns 0
  matches as a keyword search and 1 match as a regex search; the regex search
  also returns the same window for a 2020 range it is not in.
summary_ko: "2026-11-03 09:41:27 UTC에 `/dl/svchost.exe`를 받은 HTTP 요청이 든 pcap에서, `source='pcap'`으로 그날 09:00~10:00을 키워드 검색하면 0건이고 정규식 검색하면 1건이다. 정규식 검색은 이 요청과 상관없는 2020년 범위에서도 같은 창을 돌려준다."
defect_ko: "이 서버는 시각을 못 읽은 창(`event_time` 없음)을 키워드 검색에서는 시간 범위로 빼고 정규식 검색에서는 범위와 상관없이 남긴다. 시간 범위는 검색 방식과 상관없이 같게 적용되거나, 시각이 없는 창을 어떻게 다루는지 밝혀야 한다. 모델은 키워드 검색 0건을 보고 그 시간에 다운로드가 없었다고 잘못 알거나, 정규식 결과를 그 시간대 사건으로 잘못 안다."
setup_ko: "업데이트 서버 요청(08:14:05)과 203.0.113.7에서 `/dl/svchost.exe`를 받은 요청(09:41:27)이 든 pcap을 HTTP 모드로 적재했다. mulder는 tshark 시각 형식을 읽지 못해 이 창의 `event_time`이 비어 있다."
