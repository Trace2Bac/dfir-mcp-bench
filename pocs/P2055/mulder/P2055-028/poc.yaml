steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: android-sms-cap
  - tool: parse_android_artifacts
    note_ko: "결함 호출: Android 문자 적재"
    args:
      evidence_path: ${EVIDENCE}
      artifact_types: ["sms"]
  - tool: search
    note_ko: "결함 호출: 적재된 문자에서 가장 오래된 메시지 찾기"
    args:
      query: "Storage unit 14B"
      source: phone.android
  - tool: run_strings
    note_ko: "비교 호출: 같은 `mmssms.db`의 문자열 적재"
    args:
      target_path: ${EVIDENCE}/data/data/com.android.providers.telephony/databases/mmssms.db
  - tool: search
    note_ko: "비교 호출: 문자열 결과에서 같은 메시지 찾기"
    args:
      query: "Storage unit 14B"
      source: strings.output
expect:
  - step: 2
    note_ko: "문자 적재가 success이고 머리글 포함 1,002줄(문자 1,000건)만 적재된다"
    regex: '"status": "success"[\s\S]*\\"line_count\\": 1002\b'
  - step: 3
    note_ko: "적재된 문자에서 가장 오래된 메시지가 0건이다"
    regex: '"status": "success"[\s\S]*"total_matches": 0\b'
  - step: 5
    note_ko: "DB 문자열에서는 같은 메시지가 나온다"
    regex: '"total_matches": 1\b'
