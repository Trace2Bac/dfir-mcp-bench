# Matrix case P2055-028: parse_android_artifacts (and parse_ios_artifacts)
# do not state a limit, but each query takes only the newest 1,000 rows (SMS,
# calls, WhatsApp, Signal, Skype) or 500 (browser, accounts, downloads,
# calendar, Gmail), so older records are left out of a normal response.
#
# Evidence: an Android logical extraction holding
#   data/data/com.android.providers.telephony/databases/mmssms.db
# written with Python's sqlite3 in AOSP's sms table layout (_id, thread_id,
# address, date in ms, type 1 inbox / 2 sent, body, ...): 1,041 SMS, the
# oldest of which (2026-09-02 22:14:05 UTC, from +15550142233) names a
# storage unit and tells the owner to wipe the laptop; 1,040 everyday
# messages with five contacts follow until 2026-10-20.
#   sha256 c049ca1c2ec86d208e6a5d2a2bec6108b10e16011bb71c6b31b89b6e409099e7
case_id: P2055-028
problem: P2055
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: source-vs-result
level: mcp
realism: common
realism_ko: "평범한 휴대폰도 문자가 몇 주면 1,000건을 넘고, 사건의 핵심 메시지는 압수보다 한참 전에 오가는 일이 많다."
coverage: "partial: shows the 1,000-row SMS limit of parse_android_artifacts only; the other Android types and parse_ios_artifacts' limits are not run"
coverage_ko: "`parse_android_artifacts`의 SMS 1,000건 상한만 보인다. 다른 Android 항목과 `parse_ios_artifacts`의 상한은 실행하지 않았다."
summary: >-
  On an Android extraction whose mmssms.db holds 1,041 SMS, parse_android_artifacts
  returns success and indexes the newest 1,000 (line_count 1002 with headers);
  a search for the oldest message ("Storage unit 14B ... Wipe the laptop
  tonight") finds nothing, while run_strings on the same database finds it.
summary_ko: "`mmssms.db`에 문자 1,041건이 든 Android 추출본에서 `parse_android_artifacts`는 success를 돌려주며 최신 1,000건만 적재한다(머리글 포함 1,002줄). 가장 오래된 문자(\"Storage unit 14B … Wipe the laptop tonight\")는 검색에서 0건이고, 같은 DB에 `run_strings`를 돌리면 나온다."
defect_ko: "이 서버는 SMS를 최신 1,000건만 질의하면서 그 상한을 알리지 않는다. 모든 기록을 적재하거나 잘랐다는 것과 남은 건수를 응답에 밝혀야 한다. 모델은 오래된 문자(증거 인멸 지시)가 기록에 없다고 잘못 안다."
setup_ko: "Android 논리 추출본의 `mmssms.db`에 문자 1,041건을 두었다. 가장 오래된 한 건(2026-09-02)이 창고 위치와 노트북 초기화를 지시하는 문자이고, 그 뒤로 일상 문자 1,040건이 있다."
