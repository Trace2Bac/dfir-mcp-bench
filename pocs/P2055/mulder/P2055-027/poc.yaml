steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: first-ntfs-partition
  - tool: run_mmls
    note_ko: "파티션 표 적재"
    args:
      image_path: ${EVIDENCE}/ws0142.E01
  - tool: run_fls
    note_ko: "파일 목록 적재(가장 큰 NTFS 파티션)"
    args:
      image_path: ${EVIDENCE}/ws0142.E01
  - tool: get_raw_output
    note_ko: "비교 호출: 파일 목록에서 inode 67 확인"
    args:
      source_name: tsk.filelist
  - tool: extract_file_by_inode
    note_ko: "결함 호출: 목록의 inode 67(`run.bat`) 꺼내기"
    args:
      inode: 67
  - tool: get_file_metadata
    note_ko: "결함 호출: inode 67의 메타데이터"
    args:
      inode: 67
  - tool: get_raw_output
    note_ko: "적재된 inode 67 메타데이터 읽기"
    args:
      source_name: tsk.metadata.67
expect:
  - step: 4
    note_ko: "파일 목록에서 inode 67은 `Users/alice/Desktop/run.bat`이다"
    contains: 'r/r 67-128-2:\tUsers/alice/Desktop/run.bat'
  - step: 5
    note_ko: "inode 67을 꺼내면 success에 8,192바이트 바이너리가 온다(run.bat은 269바이트 텍스트)"
    regex: '"status": "success"[\s\S]*"type": "binary"[\s\S]*"size_bytes": 8192'
  - step: 5
    note_ko: "돌아온 해시는 System Reserved의 `BOOTSECT.BAK` 해시다"
