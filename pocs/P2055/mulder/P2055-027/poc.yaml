# Matrix case P2055-027: extract_file_by_inode and get_file_metadata do not
# say which partition they read, and take the offset of the FIRST NTFS row of
# the mmls table (tsk.py _parse_offset_from_windows), while run_fls lists the
# LARGEST NTFS partition (extract/tsk.py _parse_partition_offset). On a
# Windows 7-style disk with "System Reserved" first, an inode from the run_fls
# listing is read from System Reserved and the other file's content, hash and
# metadata come back as a normal response.
#
# Evidence: an 18 MiB MBR disk image made in this image with mkntfs and
# ntfs-3g (mounted with --privileged only while building), sfdisk for the
# table, and ewfacquire (EnCase 6, deflate) for the E01:
#   partition 1, sector 2048, 4 MiB, type 0x07, bootable, label "System Reserved":
#     Boot/ (64), Boot/BCD (65), bootmgr (66), BOOTSECT.BAK (67, 8,192 bytes,
#     sha256 0ef18a82c93e6b370ad5a6c83b7f335fb4777069cc456e1751171c8424b474fd)
#   partition 2, sector 10240, 12 MiB, type 0x07, label "OS":
#     Users/ (64), Users/alice/ (65), Users/alice/Desktop/ (66),
#     Users/alice/Desktop/run.bat (67, a PsExec batch file, 269 bytes,
#     sha256 d174101a2689bcb53f709347c94659c1af74f9aeb8fc568c2e7c1ac8626caeb6)
#   raw image sha256 121fc8f04a768c4cf7c5c85c8e1e39154d142860927442a3fe67433693b65458
case_id: P2055-027
problem: P2055
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: source-vs-result
level: mcp
realism: common
realism_ko: "MBR로 설치한 Windows 7·초기 Windows 10 디스크는 첫 파티션이 작은 NTFS \"System Reserved\"이고 C:가 그 뒤에 온다."
coverage: full
summary: >-
  On a Windows 7-style disk (System Reserved NTFS first, then C:), run_fls
  lists inode 67 as Users/alice/Desktop/run.bat, but extract_file_by_inode(67)
  returns success with a binary file of 8,192 bytes (sha256 0ef18a82...,
  BOOTSECT.BAK of System Reserved) and get_file_metadata(67) indexes the
  metadata of BOOTSECT.BAK, without saying which partition was read.
summary_ko: "첫 파티션이 System Reserved NTFS이고 그 뒤가 C:인 Windows 7식 디스크에서 `run_fls`는 inode 67을 `Users/alice/Desktop/run.bat`으로 보여 준다. 그런데 `extract_file_by_inode(67)`은 8,192바이트 바이너리(sha256 0ef18a82…, System Reserved의 `BOOTSECT.BAK`)를 success로 돌려주고, `get_file_metadata(67)`도 `BOOTSECT.BAK`의 메타데이터를 적재한다. 어느 파티션을 읽었는지는 말하지 않는다."
defect_ko: "이 서버는 inode로 파일을 꺼낼 때 mmls 표의 첫 NTFS 파티션을 쓰고, 파일 목록(`run_fls`)은 가장 큰 NTFS 파티션에서 만든다. 같은 파티션을 쓰거나 어느 파티션을 읽었는지 밝히고 고를 수 있게 해야 한다. 모델은 System Reserved의 `BOOTSECT.BAK` 내용·해시를 `run.bat`의 것으로 잘못 안다."
setup_ko: "첫 파티션이 System Reserved(NTFS, `BOOTSECT.BAK` 등)이고 두 번째가 C:(NTFS, `Users/alice/Desktop/run.bat`)인 Windows 7식 디스크 이미지를 E01로 두었다. 두 파일의 inode는 둘 다 67이다."
