# Matrix case P2055-029: parse_browser_history says it "queries for URLs,
# timestamps, and visit counts", but each query (Chrome, Firefox, Safari) is
# ORDER BY last visit DESC LIMIT 500, so URLs older than the 500 most recent
# are left out with no note.
#
# Evidence: a 14 MiB MBR disk image with one NTFS partition (sector 2048),
# made in this image with mkntfs and ntfs-3g (mounted with --privileged only
# while building), sfdisk and ewfacquire (EnCase 6, deflate). It holds
#   Users/alice/AppData/Local/Google/Chrome/User Data/Default/History (inode 72)
# a Chrome History database (meta version 69, Chrome's urls/visits tables)
# with 602 URLs: two mega.nz upload pages visited 2026-10-20 18:42-18:47 UTC,
# then 600 ordinary work pages (Outlook, SharePoint, Teams, search, news)
# from 2026-10-21 to 2026-11-13, one visit each row.
#   raw image sha256 8f93693e27f7ef753c8935a82b7770c500e0d7c7fd2c4b30038600f20555a765
case_id: P2055-029
problem: P2055
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: source-vs-result
level: mcp
realism: common
realism_ko: "업무용 PC의 Chrome 기록은 몇 주만 지나도 URL이 500개를 넘고, 사고는 보통 압수 몇 주 전에 일어난다."
coverage: full
summary: >-
  On a disk whose Chrome History has 602 URLs, parse_browser_history returns
  success and indexes only the 500 most recent; a search for mega.nz (the
  upload pages visited 2026-10-20, before 600 later visits) finds nothing,
  while a SQL query on the same History database returns both mega.nz URLs.
summary_ko: "Chrome 기록에 URL 602개가 든 디스크에서 `parse_browser_history`는 success를 돌려주지만 최근 500개만 적재한다. 그래서 2026-10-20에 방문한 mega.nz 업로드 페이지(그 뒤 방문 600건)는 `mega.nz` 검색에서 0건이고, 같은 History DB에 SQL을 직접 주면 mega.nz URL 두 개가 나온다."
defect_ko: "이 서버는 브라우저마다 최근 방문 500개 URL만 질의하면서 그 상한을 알리지 않는다. 모든 URL을 적재하거나 500개로 잘랐다고 응답에 밝혀야 한다. 모델은 mega.nz 업로드 같은 오래된 방문이 기록에 없다고 잘못 안다."
setup_ko: "NTFS 디스크 이미지에 alice의 Chrome History(URL 602개)를 두었다. 가장 오래된 두 URL이 2026-10-20의 mega.nz 업로드 페이지이고, 그 뒤 업무 페이지 600개를 방문했다."
