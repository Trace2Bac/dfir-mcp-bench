steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: browser-history-cap
  - tool: run_mmls
    note_ko: "파티션 표 적재"
    args:
      image_path: ${EVIDENCE}/lt-alice.E01
  - tool: run_fls
    note_ko: "파일 목록 적재"
    args:
      image_path: ${EVIDENCE}/lt-alice.E01
  - tool: parse_browser_history
    note_ko: "결함 호출: 브라우저 기록 적재"
  - tool: search
    note_ko: "결함 호출: 적재된 기록에서 mega.nz 찾기"
    args:
      query: mega.nz
      source: browser.history
  - tool: query_sqlite_from_image
    note_ko: "비교 호출: 같은 History DB에 SQL로 mega.nz URL 조회"
    args:
      inode: 72
      query: "SELECT url, datetime(last_visit_time/1000000-11644473600,'unixepoch') AS visit_time, (SELECT count(*) FROM urls) AS total_urls FROM urls WHERE url LIKE '%mega.nz%'"
  - tool: get_raw_output
    note_ko: "비교 호출: SQL 결과 읽기"
    args:
      source_name: sqlite.inode_72
expect:
  - step: 4
    note_ko: "브라우저 기록 적재가 success다"
    regex: '"status": "success"[\s\S]*"source": "browser.history"'
  - step: 5
    note_ko: "적재된 기록에 mega.nz가 0건이다"
    regex: '"status": "success"[\s\S]*"total_matches": 0\b'
  - step: 7
    note_ko: "DB에는 URL이 602개 있고 mega.nz 업로드 페이지가 있다"
    regex: 'https://mega.nz/fm/upload[\s\S]*2026-10-20 18:42:11[\s\S]*602'
