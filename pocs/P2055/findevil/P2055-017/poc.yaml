# Matrix case P2055-017: find_recent_changes
# documents since_iso/until_iso only as "ISO 8601", but a value without an
# offset is read as the server's local time. The same call is run with the
# server in UTC and in Asia/Seoul; the file (mtime 10:00 UTC) is in the window
# only in the first run.
case_id: P2055-017
problem: P2055
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: definition
level: mcp
realism: possible
realism_ko: "분석 서버가 UTC가 아닌 시간대로 돌고 모델이 오프셋 없는 시각을 주는 일은 드물지 않지만, Docker 기본 환경은 UTC다."
coverage: full
summary: With since_iso/until_iso given without an offset, find_recent_changes reads them in the server's local time zone, so the same window matches the file under TZ=UTC and matches nothing under TZ=Asia/Seoul, and the tool description does not say so.
summary_ko: "`since_iso`/`until_iso`를 오프셋 없이 주면 `find_recent_changes`는 서버의 현지 시간대로 읽는다. 그래서 같은 구간이 TZ=UTC에서는 파일과 일치하고 TZ=Asia/Seoul에서는 아무것도 일치하지 않으며, 도구 설명은 이를 말하지 않는다."
defect_ko: "오프셋 없는 시각을 이 서버는 말없이 서버 현지 시각으로 읽는다. 정의가 어느 시간대로 읽는지 밝혀야 한다. 같은 구간이 서버 시간대에 따라 다른 파일을 돌려주고, 모델은 그 구간에 바뀐 파일이 없다고 잘못 알 수 있다."
setup_ko: "mtime이 10:00 UTC인 웹셸 파일 하나를 두고, 서버를 `TZ=UTC`와 `TZ=Asia/Seoul`로 각각 띄웠다."
fixture:
  - path: var/www/html/shell.php
    text: "<?php system($_GET['c']); ?>\n"
    mtime: "2025-03-01T10:00:00Z"
conditions:
  - name: utc
    env: {TZ: UTC}
  - name: seoul
    env: {TZ: Asia/Seoul}
steps:
  - tool: find_recent_changes
    note_ko: "결함 호출: 오프셋 없는 09:30~10:30 구간으로 최근 변경 검색"
    args:
      root_path: ${EVIDENCE}/var
      since_iso: "2025-03-01T09:30:00"
      until_iso: "2025-03-01T10:30:00"
expect:
  - step: 1
    note_ko: "UTC 서버에서는 파일 1개가 나온다"
    condition: utc
    contains: "**Files matched:** 1"
  - step: 1
    note_ko: "서울 시간대 서버에서는 같은 호출이 0개다"
    condition: seoul
    contains: "**Files matched:** 0"
  - differs: {step: 1, conditions: [utc, seoul]}
    note_ko: "두 서버의 응답이 서로 다르다"
