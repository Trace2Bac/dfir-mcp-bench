# Matrix case P2055-018: build_timeline does not say which time zone it uses.
# syslog times (host local) are labelled +00:00 and sorted together with
# journal times that really are UTC.
case_id: P2055-018
problem: P2055
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: definition
level: mcp
realism: common
realism_ko: "증거 호스트가 UTC가 아닌 시간대로 설정된 경우는 흔하고, syslog 시각에는 시간대 정보가 없다."
coverage: "partial: nginx offsets and file mtime ordering are not shown here (nginx: P2049-005)"
coverage_ko: "nginx 오프셋과 파일 mtime 순서는 여기서 보이지 않는다(nginx: P2049-005)"
summary: On a host set to Asia/Seoul, one SSH login appears twice in the timeline, at 05:30:00+00:00 from the journal and at 14:30:00+00:00 from auth.log, and neither the tool definition nor the response says syslog times were assumed to be UTC.
summary_ko: "Asia/Seoul 호스트의 SSH 로그인 하나가 타임라인에 두 번 나온다. journal에서 온 05:30:00+00:00과 `auth.log`에서 온 14:30:00+00:00이고, 정의와 응답 어디에도 syslog 시각을 UTC로 가정했다는 말이 없다."
defect_ko: "이 서버는 syslog 현지 시각에 말없이 `+00:00`을 붙인다. 정의나 응답이 어느 시간대로 가정했는지 밝혀야 한다. 모델은 같은 로그인 하나를 9시간 떨어진 두 사건으로 잘못 안다."
setup_ko: "시간대가 `Asia/Seoul`인 호스트의 SSH 로그인 하나를 `auth.log`와 journal 양쪽에 기록해 두었다."
fixture:
  - path: case/fs/etc/timezone
    text: "Asia/Seoul\n"
  - path: case/auth.log
    text: "Apr 12 14:30:00 web sshd[811]: Accepted password for alice from 203.0.113.7 port 50022 ssh2\n"
  - path: case/journal.jsonl
    text: "{\"__REALTIME_TIMESTAMP\": \"1775971800000000\", \"SYSLOG_IDENTIFIER\": \"sshd\", \"MESSAGE\": \"Accepted password for alice from 203.0.113.7 port 50022 ssh2\"}\n"
steps:
  - tool: build_timeline
    note_ko: "결함 호출: 두 출처를 합친 타임라인을 만듦"
    args:
      evidence_root: ${EVIDENCE}/case
expect:
  - step: 1
    note_ko: "journal 기록은 실제 UTC 05:30으로 나온다"
    contains: "| 2026-04-12T05:30:00+00:00 | journal |"
  - step: 1
    note_ko: "같은 로그인의 `auth.log` 기록은 14:30 UTC로 나온다"
    contains: "| 2026-04-12T14:30:00+00:00 | auth.log |"
  - step: 1
    note_ko: "시간대를 가정했다는 안내가 응답에 없다"
    not_regex: "(?i)local time|time ?zone|assum"
