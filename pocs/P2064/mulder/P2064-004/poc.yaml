# Matrix case P2064-004: submit_finding builds a Finding model, so severity,
# confidence and evidence_refs are checked; update_finding writes the given
# values to the database directly (db.update_finding), without that check.
# A row that the model rejects is then stored, and every later read of the
# findings (get_findings, finalize_report) builds Finding from it and fails.
#
# The case is resumed: ${DB_DIR} holds a case database and audit log written
# by this same image (scan_evidence, run_strings on update.ps1, then
# submit_finding f_8087ed40 with confidence "inference"). The database was
# VACUUMed to a 512-byte page size to keep this file small; its tables are
# unchanged. Its evidence root is /ev, where it was made.
case_id: P2064-004
problem: P2064
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "`update_finding` 설명은 confidence를 \"New confidence level\"이라고만 하므로, 근거가 늘어 확신을 올리려는 모델이 흔한 낱말 `high`를 주는 일이 있을 수 있다."
coverage: "partial: an invalid confidence is shown; severity and an empty evidence_refs reach the database the same way"
coverage_ko: "잘못된 confidence 값만 보인다. severity와 빈 evidence_refs도 같은 방식으로 DB에 들어간다."
summary: submit_finding rejects confidence "high", but update_finding with confidence "high" writes it to the stored finding and then fails, and from then on get_findings fails without a reason, so none of the case's findings can be read until the value is put back.
summary_ko: "`submit_finding`은 confidence `high`를 거부하지만, `update_finding`은 `high`를 저장된 발견 사항에 먼저 써 놓고 실패한다. 그 뒤로는 `get_findings`가 이유 없이 실패해, 값을 되돌릴 때까지 사건의 발견 사항을 하나도 읽을 수 없다."
defect_ko: "이 서버는 `update_finding`에서 `submit_finding`의 모델 검사를 건너뛰고 값을 DB에 쓴다. 정상이라면 쓰기 전에 같은 검사로 거부해야 한다. 모델은 갱신만 실패했다고 보지만 사건의 발견 사항 전체를 읽을 수 없게 된다."
setup_ko: "PowerShell 다운로드 실행에 대한 발견 사항 `f_8087ed40`(confidence `inference`)이 있는 기존 사건 `ir-2026-031`을 열었다."
