# Matrix case P2064-003: a direct MCP call checks run_chainsaw's mode against
# its Literal["hunt", "search", "srum", "timeline"], but run_parallel (and
# start_extraction_batch) take the tool function from _tool_dispatch and only
# check the argument names (validate_tool_args), so a value outside the list
# reaches the function and falls into its last branch, timeline.
#
# Chainsaw 2.16.0 in the image runs for real.
case_id: P2064-003
problem: P2064
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "도구 설명이 \"Analyze Windows artifacts using Chainsaw with Sigma rules\"로 시작하므로, Sigma 탐지를 원하는 모델이 `mode`에 `sigma`를 주는 일이 있을 수 있다."
coverage: "partial: run_parallel with run_chainsaw is shown; start_extraction_batch reaches the function the same way"
coverage_ko: "`run_parallel`과 `run_chainsaw`만 보인다. `start_extraction_batch`도 같은 방식으로 함수를 부른다."
summary: Called directly, run_chainsaw with mode "sigma" is rejected by the argument check, but the same task in run_parallel runs Chainsaw's timeline mode and returns success (chainsaw.timeline) with no word that the mode was not one of the allowed values.
summary_ko: "`run_chainsaw`를 직접 `mode: \"sigma\"`로 부르면 인자 검사에서 거부되지만, 같은 작업을 `run_parallel`로 주면 Chainsaw timeline 모드로 돌아 `chainsaw.timeline`이 success로 오고, 허용 값이 아니었다는 말이 없다."
defect_ko: "이 서버는 일괄 실행 경로에서 `mode`의 허용 값 검사를 건너뛰고, 목록 밖 값을 마지막 분기인 timeline으로 실행한다. 정상이라면 직접 호출처럼 거부해야 한다. 모델은 Sigma 규칙으로 탐지한 결과를 받았다고 잘못 안다."
setup_ko: "NIST CFReDS Data Leakage Case PC의 TerminalServices-LocalSessionManager 로그를 `evtx/`에 넣었다."
fixture:
  - path: evtx/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
    # NIST CFReDS Data Leakage Case, PC image, copied unchanged (69,632 bytes).
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 생성"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p2064-003
  - tool: run_chainsaw
    note_ko: "비교 호출: 직접 `mode: sigma`로 호출"
    args:
      evidence_path: ${EVIDENCE}/evtx
      mode: sigma
  - tool: run_parallel
    note_ko: "결함 호출: 같은 작업을 `run_parallel`로 실행"
    timeout_s: 600
    args:
      tasks:
        - tool: run_chainsaw
          args:
            evidence_path: ${EVIDENCE}/evtx
            mode: sigma
expect:
  - step: 2
    note_ko: "직접 호출은 허용 값 검사에서 거부된다"
    is_error: true
  - step: 3
    note_ko: "일괄 실행에서는 같은 값이 success로 끝난다"
    regex: '"tool": "run_chainsaw",\s*"result": \{[^}]*"status": "success"'
  - step: 3
    note_ko: "실제로 돈 것은 timeline 모드다"
    contains: '"source": "chainsaw.timeline"'
