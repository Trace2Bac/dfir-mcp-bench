# Matrix case P3187-008: when the trace file does not parse as JSON,
# ExecutionLog.configure prints a warning to stderr ("trace file corrupted
# ..., starting fresh") and starts an empty trace over it
# (core/execution_log.py), and start_execution_log answers success with
# entries_recovered 0. The server's own writes are atomic, so the broken
# trace comes from the defect before it (P3086-006): strings_extract writes
# its output with a plain open(output_path, "w"), and an output_path equal
# to the trace path replaces the trace with the strings text. That call is
# made first here; re-opening the trace then drops every earlier entry.
case_id: P3187-008
problem: P3187
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "strings 결과를 저장할 output_path로 analysis/ 아래 이미 있는 파일 이름을 잘못 주는 것은 모델 실수로 일어날 수 있고, 서버를 다시 붙거나 사건을 이어서 할 때 start_execution_log를 다시 부르는 것은 도구 설명이 권하는 흐름이다."
coverage: full
summary: 'After strings_extract is given the trace path as output_path (P3086-006) and overwrites the trace with strings text, misc_start_execution_log on the same case answers success with entries_recovered 0 and resumed false, where the same call a moment earlier recovered 3 entries; the earlier hash_file record is gone from the trace.'
summary_ko: "`strings_extract`에 trace 경로를 `output_path`로 주어 trace가 strings 글로 덮인 뒤(P3086-006), 같은 사건으로 `misc_start_execution_log`를 부르면 성공 응답에 `entries_recovered` 0, `resumed` false가 나온다. 조금 전 같은 호출은 항목 3개를 되살렸고, 앞서 남긴 `hash_file` 기록은 trace에서 사라진다."
defect_ko: "이 서버는 기록 파일이 JSON으로 읽히지 않으면 표준 오류에 경고만 남기고 빈 기록으로 새로 시작해 그 파일을 덮어쓴다. 정상이라면 읽지 못한 기록을 보존하고 사건 기록을 열지 못했다고 실패를 알려야 한다. 모델은 `entries_recovered` 0을 보고 이 사건에 앞선 기록이 없었다고 잘못 알고, 앞서 한 해시와 분석은 기록에서 사라진다."
setup_ko: "사용자 Downloads 폴더에서 나온 의심 실행 파일 조각을 넣고, 사건 trace를 연 뒤 그 파일을 해시한다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # The first 667 bytes of a dropper carved from the user's Downloads: DOS
  # header and stub, PE signature, then its .rdata strings.
  - path: Users/jdoe/Downloads/upd.exe
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3187-008
      output_path: ${DB_DIR}/analysis/P3187-008_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: hash_file
    note_ko: "준비: 의심 파일을 해시해 기록에 남긴다"
    args:
      file_path: ${EVIDENCE}/Users/jdoe/Downloads/upd.exe
  - tool: misc_start_execution_log
    note_ko: "비교 호출: 같은 사건 trace를 다시 열면 앞 항목을 되살린다"
    args:
      case_id: P3187-008
      output_path: ${DB_DIR}/analysis/P3187-008_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: strings_extract
    note_ko: "앞선 결함(P3086-006): strings 결과의 output_path로 trace 경로를 준다"
    args:
      file_path: ${EVIDENCE}/Users/jdoe/Downloads/upd.exe
      output_path: ${DB_DIR}/analysis/P3187-008_trace.json
  - tool: misc_start_execution_log
    note_ko: "결함 호출: 같은 사건 trace를 다시 연다"
    args:
      case_id: P3187-008
      output_path: ${DB_DIR}/analysis/P3187-008_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: read_output
    note_ko: "비교 호출: trace에서 앞서 남긴 해시 기록을 찾는다"
    args:
      path: ${DB_DIR}/analysis/P3187-008_trace.json
      query: hash.file upd.exe
expect:
  - step: 3
    note_ko: "덮이기 전에는 같은 호출이 앞 항목을 되살렸다"
    regex: '"entries_recovered": [1-9]\d*, "resumed": true'
  - step: 4
    note_ko: "strings 결과를 trace 경로에 썼다며 성공한다"
    regex: '^\{"success": true, "ascii_lines": [1-9]'
  - step: 5
    note_ko: "덮인 뒤에는 같은 호출이 성공하면서 되살린 항목이 0이다"
    regex: '^\{"success": true, [^{}]*"entries_recovered": 0, "resumed": false'
  - step: 6
    note_ko: "앞서 남긴 해시 기록은 trace에서 찾을 수 없다"
    regex: '"body": "", "truncated": false'
  - file_not_contains: ${DB_DIR}/analysis/P3187-008_trace.json
    note_ko: "새 trace에는 hash_file 결과(hash_result) 기록이 없다"
    text: '"hash_result"'
