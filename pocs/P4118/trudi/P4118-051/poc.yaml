# Matrix case P4118-051: attribution_attribute_actors ranks ATT&CK groups by
# how many of the techniques in the trace's CONFIRMED/LIKELY findings they
# share. With 5 or more shared techniques across 3 or more tactics it calls the
# group's caveat "Strong technique + tactic overlap with this profile." and
# suggests a LIKELY attribution finding, without saying that common techniques
# (PowerShell, scheduled tasks, LSASS dumps, RDP, log clearing, encryption)
# are used by many groups, so the overlap does not single one out.
# The trace is resumed from a previous session of an ordinary ransomware
# intrusion on WKSTN-07: four tool calls and eight LIKELY findings in the
# shape the server writes, each citing one technique. With the ATT&CK groups
# table trudi ships (cases/.common/mitre_groups.json, 165 groups), 27 groups
# share 5 or more of the 8 techniques.
case_id: P4118-051
problem: P4118
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: model
realism: common
realism_ko: "PowerShell·예약 작업·LSASS 덤프·RDP·로그 삭제·암호화는 랜섬웨어 침입에서 흔한 기법 조합이고, 도구 설명은 위협 행위자를 적기 전에 이 도구를 부르라고 한다."
coverage: full
summary: For eight LIKELY findings of a common ransomware intrusion (T1059.001, T1105, T1053.005, T1003.001, T1078, T1021.001, T1070.001, T1486), attribution_attribute_actors ranks one group first with a HIGH band, the caveat "Strong technique + tactic overlap with this profile." and a suggested LIKELY attribution finding, with no warning that these techniques are shared by many groups (dozens pass the threshold).
summary_ko: "흔한 랜섬웨어 침입의 LIKELY 발견 8개(T1059.001, T1105, T1053.005, T1003.001, T1078, T1021.001, T1070.001, T1486)로 `attribution_attribute_actors`가 한 집단을 HIGH 등급, \"Strong technique + tactic overlap with this profile.\" 주의 문구와 LIKELY 귀속 발견 제안으로 내놓는다. 이 기법들은 수십 개 집단이 함께 쓴다는 주의는 없다."
defect_ko: "이 서버는 기법 5개·전술 3개만 겹치면 강한 일치라고 하고 LIKELY 귀속을 제안한다. 정상이라면 흔한 기법은 여러 집단이 함께 써서 겹침만으로는 집단을 가를 수 없다는 주의와, 같은 기준을 넘은 집단이 몇 개인지를 함께 알려야 한다. 모델은 이 침입을 1위 집단의 소행으로 잘못 안다."
setup_ko: "이전 세션에서 WKSTN-07 랜섬웨어 침입을 조사하며 남긴 trace(도구 호출 4건, 기법을 하나씩 단 LIKELY 발견 8개)를 이어서 연다. 집단 표는 trudi가 배포하는 표(165개)를 쓴다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
  TRUDI_MITRE_TABLE: /opt/trudi/cases/.common/mitre_techniques.json
  TRUDI_MITRE_GROUPS: /opt/trudi/cases/.common/mitre_groups.json
