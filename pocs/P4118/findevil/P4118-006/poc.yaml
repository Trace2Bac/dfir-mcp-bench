# Matrix case P4118-006: find_persistence reports "No persistence mechanisms
# found" even when none of the scanned directories (etc, var/spool, home ...)
# exist under root_path. Here root_path is one level above the real fs root,
# which holds a cron downloader, so the scan looks at nothing.
case_id: P4118-006
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "수집본 폴더를 그대로 넘기는 일은 생긴다. 다만 모델은 대개 먼저 폴더를 열어 보고 `fs/`를 넘겨, 결함에 닿는 일은 드물다."
coverage: full
summary: When root_path is the case folder instead of its fs/ subfolder, so no etc/ or other scanned directory exists under it, find_persistence answers "No persistence mechanisms found under ..." without saying nothing was scanned, while the fs/ root below holds a cron job that downloads and runs a script.
summary_ko: "`root_path`를 `fs/` 하위 폴더가 아니라 사건 폴더로 주면 그 아래에 `etc/` 같은 검사 대상이 없다. `find_persistence`는 아무것도 검사하지 않았다는 말 없이 \"No persistence mechanisms found under ...\"라고 답하는데, 그 아래 `fs/`에는 스크립트를 내려받아 실행하는 cron 작업이 있다."
defect_ko: "검사할 폴더가 하나도 없어도 이 서버는 지속성이 없다고 답한다. 그렇다고 알려야 한다. 모델은 한 단계 아래에 있는 악성 cron 작업이 없다고 잘못 안다."
setup_ko: "수집본 폴더(`case/`) 안에 파일 시스템 사본(`fs/`)과 수집 메모·해시 목록을 두고, Debian 기본 cron 작업과 서비스 파일 사이 `/etc/crontab`에 내려받아 실행하는 줄 하나를 넣었다."
