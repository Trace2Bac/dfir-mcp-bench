  - path: case/collection_notes.txt
    text: 'Triage collection of web01 (Debian 12), 2026-04-28.

      fs/       file system copy (etc, home, var/log)

      hashes.txt  SHA-256 of collected files

      '
  - path: case/hashes.txt
    text: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  fs/etc/crontab

      '
steps:
  - tool: find_persistence
    note_ko: "결함 호출: 사건 폴더를 루트로 검사"
    args:
      root_path: ${EVIDENCE}/case
  - tool: find_persistence
    note_ko: "비교 호출: `fs/`를 루트로 검사"
    args:
      root_path: ${EVIDENCE}/case/fs
expect:
  - step: 1
    note_ko: "지속성이 없다고 답한다"
    contains: "No persistence mechanisms found under"
  - step: 1
    note_ko: "검사 대상 폴더가 없었다는 말이 없다"
    not_regex: "(?i)not found|no etc|does not look like|not a filesystem root|nothing (was )?scanned"
  # control: the same evidence one level down is flagged
  - step: 2
    note_ko: "한 단계 아래를 검사하면 crontab 작업을 찾는다"
    contains: "etc/crontab"

model:
  # Realistic question: the analyst points at the collection folder, as handed over.
  question: >-
    This is a triage collection of a Debian web server under ${EVIDENCE}/case.
    Check it for persistence mechanisms an attacker may have left. Answer Yes
    or No, and name each mechanism with its file.
  question_ko: "${EVIDENCE}/case 아래는 Debian 웹 서버에서 모은 분류 수집본이다. 공격자가 남긴 지속성 수단이 있는지 확인해 달라. Yes나 No로 답하고, 수단마다 파일을 말해 달라."
  # The defect shows only when find_persistence gets the collection folder
  # (no etc/ directly under it) and answers that nothing was found.
  defect_tools: [find_persistence]
  defect_response: "No persistence mechanisms found under"
  repeat: 3
  misled_if: all
  expect:
    - not_regex: "(?i)203\\.0\\.113\\.7|x\\.sh|curl[^\\n]{0,80}\\|\\s*(ba)?sh"
      note_ko: "내려받아 실행하는 cron 작업을 말하지 않는다"
