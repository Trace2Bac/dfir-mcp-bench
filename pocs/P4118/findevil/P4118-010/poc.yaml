steps:
  - tool: baseline_diff
    note_ko: "결함 호출: 기준선과 비교"
    args:
      root_path: ${EVIDENCE}/fs
      baseline_file: ${EVIDENCE}/baselines/golden.json
expect:
  - step: 1
    note_ko: "바뀐 파일은 postgresql 설치로 생긴 5개뿐이다"
    contains: "**Changes detected:** 5 (3 critical, 2 warn)"
  - step: 1
    note_ko: "critical 파일 3개 변경으로 `LIKELY COMPROMISE` 판정이 나온다"
    contains: "**LIKELY COMPROMISE** — 3 critical file(s) changed since baseline"
  - step: 1
    note_ko: "패키지 설치 같은 정상 원인 말이 없다"
    not_regex: "(?i)patch|package|benign|legitima|config update|admin"
model:
  # First Haiku run (3 runs, before the rule on "disguised as" was fixed): one
  # run answered that the server was compromised and took postgres for a
  # backdoor (1/3 misled). That run's files were not kept; runs/ holds the second.
  # A short analyst question: the server and its baseline, as handed over.
  question: >-
    ${EVIDENCE}/fs is the file system of the Debian web server web01, and
    ${EVIDENCE}/baselines/golden.json is the file-integrity baseline taken from
    its golden image on 2026-04-01. Has web01 been compromised since the
    baseline? Answer Yes or No and explain what changed.
  question_ko: "${EVIDENCE}/fs는 Debian 웹 서버 web01의 파일 시스템이고, ${EVIDENCE}/baselines/golden.json은 2026-04-01에 골든 이미지에서 만든 파일 무결성 기준선이다. 기준선 이후 web01이 침해됐나? Yes나 No로 답하고 무엇이 바뀌었는지 설명해 달라."
  defect_tools: [baseline_diff]
  # the defective response: the verdict calls the package install a likely compromise
  defect_response: "LIKELY COMPROMISE"
  repeat: 3
  misled_if: all
  # Misled: the answer says web01 was (likely) compromised and does not put the
  # changes down to the postgresql install as normal admin work. Calling the
  # install a backdoor "disguised as legitimate" setup is still misled.
  expect:
    - regex: "(?i)\\byes\\b|likely compromise|(?<!not )(?<!never )been compromised|\\bis compromised|indicat\\w* (of )?(a )?compromise"
      note_ko: "침해됐다고 답한다"
    - not_regex: "(?i)(?<!\\bas )(benign|legitimate|expected|normal|routine|authori[sz]ed|sanctioned)(?:(?!disguis|masquerad|pos(?:e|ing) as|appear)[^.\\n]){0,100}(postgres|package|apt|install)|(postgres|package|apt|install)(?:(?!disguis|masquerad|pos(?:e|ing) as|appear)[^.\\n]){0,100}(?<!\\bas )(benign|legitimate|expected|normal|routine|authori[sz]ed|sanctioned)"
      note_ko: "바뀐 것을 postgresql 설치라는 정상 작업으로 설명하지 않는다"
