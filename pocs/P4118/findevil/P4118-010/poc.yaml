- path: fs/etc/init.d/procps
  text: "#! /bin/sh\n\n### BEGIN INIT INFO\n# Provides:\t\tprocps\n# Required-Start:\t$remote_fs $syslog\n# Required-Stop:\t$remote_fs $syslog\n# Default-Start:\t2 3 4 5\n# Default-Stop:\n# Short-Description:\tConfigure kernel parameters at boottime\n### END INIT INFO\n\nset -e\n\n# /etc/init.d/procps: start and stop the Configure kernel parameters at boottime\n\ntest -x /sbin/sysctl || exit 0\n\n. /lib/lsb/init-functions\n\ncase \"$1\" in\n  start)\n\tlog_daemon_msg \"Starting Configure kernel parameters at boottime\" \"procps\" || true\n\tif start-stop-daemon --start --quiet --oknodo --exec /sbin/sysctl; then\n\t    log_end_msg 0 || true\n\telse\n\t    log_end_msg 1 || true\n\tfi\n\t;;\n  stop)\n\tlog_daemon_msg \"Stopping Configure kernel parameters at boottime\" \"procps\" || true\n\tif start-stop-daemon --stop --quiet --oknodo --exec /sbin/sysctl; then\n\t    log_end_msg 0 || true\n\telse\n\t    log_end_msg 1 || true\n\tfi\n\t;;\n  restart|force-reload)\n\t$0 stop\n\t$0 start\n\t;;\n\
    \  status)\n\tstatus_of_proc /sbin/sysctl procps && exit 0 || exit $?\n\t;;\n  *)\n\tlog_action_msg \"Usage: /etc/init.d/procps {start|stop|restart|force-reload|status}\" || true\n\texit 1\nesac\n\nexit 0\n"
  mode: '0755'
  mtime: '2024-06-01T12:00:00Z'
- path: fs/etc/init.d/postgresql
  text: "#!/bin/sh\nset -e\n\n### BEGIN INIT INFO\n# Provides:\t\tpostgresql\n# Required-Start:\t$local_fs $remote_fs $network $time\n# Required-Stop:\t$local_fs $remote_fs $network $time\n# Should-Start:\t\t$syslog\n# Should-Stop:\t\t$syslog\n# Default-Start:\t2 3 4 5\n# Default-Stop:\t\t0 1 6\n# Short-Description:\tPostgreSQL RDBMS server\n### END INIT INFO\n\n# Setting environment variables for the postmaster here does not work; please\n# set them in /etc/postgresql/<version>/<cluster>/environment instead.\n\n[ -r /usr/share/postgresql-common/init.d-functions ] || exit 0\n\n. /usr/share/postgresql-common/init.d-functions\n\n# versions can be specified explicitly\nif [ -n \"$2\" ]; then\n    versions=\"$2 $3 $4 $5 $6 $7 $8 $9\"\nelse\n    get_versions\nfi\n\ncase \"$1\" in\n    start|stop|restart|reload)\n        if [ \"$1\" = \"start\" ]; then\n            create_socket_directory\n        fi\n\tif [ -z \"`pg_lsclusters -h`\" ]; then\n\t    log_warning_msg 'No PostgreSQL clusters exist;\
    \ see \"man pg_createcluster\"'\n\t    exit 0\n\tfi\n\tfor v in $versions; do\n\t    $1 $v || EXIT=$?\n\tdone\n\texit ${EXIT:-0}\n        ;;\n    status)\n\tLS=`pg_lsclusters -h`\n\t# no clusters -> unknown status\n\t[ -n \"$LS\" ] || exit 4\n\techo \"$LS\" | awk 'BEGIN {rc=0} {if (match($4, \"down\")) rc=3; printf (\"%s/%s (port %s): %s\\n\", $1, $2, $3, $4)}; END {exit rc}'\n\t;;\n    force-reload)\n\tfor v in $versions; do\n\t    reload $v\n\tdone\n        ;;\n    *)\n        echo \"Usage: $0 {start|stop|restart|reload|force-reload|status} [version ..]\"\n        exit 1\n        ;;\nesac\n\nexit 0\n"
  mode: '0755'
  mtime: '2026-04-12T10:01:52Z'
