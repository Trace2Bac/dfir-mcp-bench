- path: fs/etc/cron.daily/logrotate
  text: |
    #!/bin/sh

    # skip in favour of systemd timer
    if [ -d /run/systemd/system ]; then
        exit 0
    fi

    # this cronjob persists removals (but not purges)
    if [ ! -x /usr/sbin/logrotate ]; then
        exit 0
    fi

    /usr/sbin/logrotate /etc/logrotate.conf
    EXITVALUE=$?
    if [ $EXITVALUE != 0 ]; then
        /usr/bin/logger -t logrotate "ALERT exited abnormally with [$EXITVALUE]"
    fi
    exit $EXITVALUE
  mode: '0755'
  mtime: '2024-05-10T12:00:00Z'
- path: fs/etc/cron.daily/man-db
  text: |
    #!/bin/sh
    #
    # man-db cron daily

    set -e

    iosched_idle=
    # Don't try to change I/O priority in a vserver or OpenVZ.
    if ! grep -Eq '(envID|VxID):.*[1-9]' /proc/self/status && \
       { [ ! -d /proc/vz ] || [ -d /proc/bc ]; }; then
        iosched_idle='--iosched idle'
    fi

    if [ -d /run/systemd/system ]; then
        # Skip in favour of systemd timer.
        exit 0
    fi

    # man-db may have been removed but not purged.
    if ! [ -x /usr/bin/mandb ]; then
        exit 0
    fi

    if ! [ -d /var/cache/man ]; then
        # Recover from deletion, per FHS.
        mkdir -p /var/cache/man
        chown man:man /var/cache/man || true
        chmod 2755 /var/cache/man
    fi

    # expunge old catman pages which have not been read in a week
    find /var/cache/man -type f -name '*.gz' -atime +6 -print0 | \
        start-stop-daemon --start --pidfile /dev/null --startas /usr/bin/xargs \
            --chuid man $iosched_idle -- -0 -r rm -f

    # regenerate man database
    start-stop-daemon --start --pidfile /dev/null --startas /usr/bin/mandb \
        --chuid man $iosched_idle -- --quiet

    exit 0
  mode: '0755'
  mtime: '2024-05-10T12:00:00Z'
