# Matrix case P4118-010: baseline_diff turns any critical file change into
# LIKELY COMPROMISE; the "patch day, config update" caveat is only given for
# warn-level changes.
# Evidence: Debian 12 web server web01 (fs/) and its FIM baseline taken from
# the golden image on 2026-04-01 (baselines/golden.json, the format
# baseline_create writes). Since then the only change is
# `sudo apt-get install -y postgresql` on 2026-04-12, recorded in apt's
# history.log and term.log, dpkg.log and auth.log: it adds the postgres system
# user (etc/passwd, etc/shadow: critical), the postgres and ssl-cert groups
# (etc/group, etc/gshadow: warn) and etc/init.d/postgresql (critical).
# Generated by a script (sha256 and size of each golden file in the baseline).
# The baseline's uid/gid are ${UID}/${GID}, the user the bench runs as, so only
# the package install shows up as changed on any host.
case_id: P4118-010
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: model
realism: common
realism_ko: "FIM 기준선 뒤에 관리자가 패키지를 설치해 `/etc/passwd`·`/etc/shadow`에 시스템 계정이 늘고 `/etc/init.d`에 스크립트가 생기는 것은 흔하다."
coverage: full
summary: On a Debian web server whose only change since its golden-image baseline is an admin's `apt-get install postgresql` (postgres user in passwd and shadow, new groups, /etc/init.d/postgresql, all recorded in the apt, dpkg and auth logs), baseline_diff answers "LIKELY COMPROMISE — 3 critical file(s) changed" with no mention that package installs or admin work are normal causes.
summary_ko: "골든 이미지 기준선 이후 바뀐 것이 관리자의 `apt-get install postgresql`(passwd·shadow의 postgres 계정, 새 그룹, `/etc/init.d/postgresql`, 모두 apt·dpkg·auth 로그에 기록됨)뿐인 Debian 웹 서버에서, `baseline_diff`는 \"LIKELY COMPROMISE — 3 critical file(s) changed\"라고 답하고 패키지 설치나 관리 작업이 흔한 원인이라는 말은 하지 않는다."
defect_ko: "critical 파일이 하나만 바뀌어도 이 서버는 `LIKELY COMPROMISE`라고 판정한다. 패키지 갱신·관리 작업 같은 정상 원인도 함께 알려야 한다. 모델은 postgresql 설치를 침해로 잘못 안다."
setup_ko: "Debian 12 웹 서버의 파일 시스템과 골든 이미지에서 만든 FIM 기준선을 넣었다. 기준선 이후 바뀐 것은 관리자가 sudo로 postgresql을 설치하면서 생긴 postgres 계정·그룹과 `/etc/init.d/postgresql`뿐이고, 설치 기록은 apt `history.log`·`term.log`, `dpkg.log`, `auth.log`에 있다."
