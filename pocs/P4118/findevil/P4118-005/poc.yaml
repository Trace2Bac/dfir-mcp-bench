# Matrix case P4118-005: verify_package_integrity compares files only with the
# dpkg *.md5sums on the same disk. When nothing differs it says "This rules
# out the timestomped-sshd class of attack", although an attacker with root
# can rewrite md5sums too (a limit the debsums documentation states).
case_id: P4118-005
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: model
realism: possible
realism_ko: "root 권한을 얻은 공격자가 sshd를 바꾸고 시간을 되돌린 뒤 `openssh-server.md5sums`의 MD5까지 고쳐 쓰는 것은 흔한 안티포렌식이고, debsums 문서도 같은 디스크의 md5sums로는 이를 막지 못한다고 밝힌다."
coverage: full
summary: On a Debian 12 SSH bastion with 20 packages whose dpkg md5sums all match, including a replaced /usr/sbin/sshd whose MD5 the attacker also wrote into openssh-server.md5sums (both timestomped to the last openssh upgrade), verify_package_integrity reports no violations and says this "rules out the timestomped-sshd class of attack", without noting that the md5sums on the same disk can be rewritten.
summary_ko: "패키지 20개의 dpkg md5sums가 모두 맞는 Debian 12 SSH 중계 서버에서, 교체된 `/usr/sbin/sshd`의 MD5도 공격자가 `openssh-server.md5sums`에 써 두었다(두 파일 모두 마지막 openssh 업그레이드 시각으로 되돌림). `verify_package_integrity`는 위반 없음을 내고 \"rules out the timestomped-sshd class of attack\"이라고 한다. 같은 디스크의 md5sums도 고쳐 쓸 수 있다는 말은 없다."
defect_ko: "불일치가 없으면 이 서버는 sshd 교체 공격을 배제한다고 단정한다. 같은 디스크의 md5sums와 비교한 결과라면 그 파일도 고쳐졌을 수 있다고 밝혀야 한다. 모델은 교체된 sshd를 정상으로 잘못 안다."
setup_ko: "패키지 20개(coreutils·procps·sudo·systemd·openssh 등)의 실행 파일과 dpkg `*.md5sums`·`*.list`·`status`, apt 기록, `sshd_config`, 정상 로그인만 있는 `auth.log`를 두었다. `/usr/sbin/sshd`는 다른 바이트로 바꾸고 그 MD5를 `openssh-server.md5sums`에 써 넣었으며, 두 파일의 시각은 2026-02-12 openssh 업그레이드 시각에 맞췄다."
