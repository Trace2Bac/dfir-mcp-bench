# Matrix case P4118-005: verify_package_integrity compares files only with the
# dpkg *.md5sums on the same disk. When nothing differs it says "This rules
# out the timestomped-sshd class of attack", although an attacker with root
# can rewrite md5sums too (a limit the debsums documentation states).
case_id: P4118-005
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "root 권한 공격자가 md5sums까지 고치는 일은 있을 수 있고, debsums 문서도 이 한계를 밝힌다."
coverage: full
summary: With a replaced /usr/sbin/sshd whose MD5 was also written into openssh-server.md5sums, verify_package_integrity reports no violations and says this "rules out the timestomped-sshd class of attack", without noting that the md5sums on the same disk can be rewritten.
summary_ko: "교체된 `/usr/sbin/sshd`의 MD5를 openssh-server.md5sums에도 써 두면 `verify_package_integrity`는 위반 없음을 내고, \"rules out the timestomped-sshd class of attack\"이라고 한다. 같은 디스크의 md5sums도 고쳐 쓸 수 있다는 말은 없다."
defect_ko: "불일치가 없으면 이 서버는 sshd 교체 공격을 배제한다고 단정한다. 같은 디스크의 md5sums와 비교한 결과라면 그 파일도 고쳐졌을 수 있다고 밝혀야 한다. 모델은 교체된 sshd를 정상으로 잘못 안다."
setup_ko: "교체된 `/usr/sbin/sshd`와, 그 MD5를 적어 둔 `openssh-server.md5sums`를 넣었다."
fixture:
  - path: fs/usr/sbin/sshd
    text: |
      #!/bin/sh
      # backdoored sshd: accepts master password
      exec /usr/sbin/sshd.real "$@"
  - path: fs/var/lib/dpkg/info/openssh-server.md5sums
    # aa870cc2... is the MD5 of the replaced sshd above, written by the attacker
    text: "aa870cc2703b7a15936b332efa6b96aa  usr/sbin/sshd\n"
steps:
  - tool: verify_package_integrity
    note_ko: "결함 호출: 패키지 무결성 검사"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "바뀐 파일이 0개로 나온다"
    contains: "**Modified files:** 0"
  - step: 1
    note_ko: "sshd 교체 공격을 배제한다고 말한다"
    contains: "This rules out the timestomped-sshd class of attack"
  - step: 1
    note_ko: "md5sums도 고쳐졌을 수 있다는 말이 없다"
    not_regex: "(?i)md5sums (can|could|may) (also )?be (rewritten|modified|tampered|altered)"
