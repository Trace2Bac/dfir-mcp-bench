# Matrix case P4118-007: analyze_package_logs reads only history.log and
# history.log.1 (no .gz rotations, no term.log) and still gives a clean verdict.
case_id: P4118-007
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "apt 로그의 `.gz` 회전본과 `term.log`는 모든 Debian 계열 호스트에 있다."
coverage: full
summary: An xmrig install recorded in the rotated history.log.2.gz and in term.log is not read, and the tool answers "No package-management red flags." without saying which logs it skipped.
summary_ko: "교체된 history.log.2.gz와 term.log에 기록된 xmrig 설치가 읽히지 않고, 도구는 어느 로그를 건너뛰었는지 말하지 않은 채 \"No package-management red flags.\"라고 답한다."
defect_ko: "정상이라면 회전된 `.gz` 로그와 `term.log`도 읽거나 읽지 않았다고 밝혀야 하는데, 이 서버는 `history.log`와 `.1`만 읽고 문제없다고 답한다. 그래서 모델은 xmrig 설치가 없었다고 잘못 안다."
setup_ko: "curl 설치만 든 `history.log`와, xmrig 설치가 든 `history.log.2.gz`·`term.log`를 넣었다."
fixture:
  - path: fs/var/log/apt/history.log
    text: |
      Start-Date: 2026-04-12  10:00:00
      Commandline: apt-get install -y curl
      Install: curl:amd64 (8.5.0-2)
      End-Date: 2026-04-12  10:00:04
  - path: fs/var/log/apt/history.log.2.gz
    # gzip of an apt block: "Install: xmrig:amd64 (6.21.0-1)" on 2026-04-10
    base64: "H4sIAAAAAAAAAwsuSSwq0XVJLEm1UjAyMDLTNTDRNTRQUDCwtDIwACIu5/zc3MS8lJzMPKCKxIIS3fTUEoXMvOKSxJwcBd1KhYrcosx0Lk+IgBWEa5WYm2JmoqBhpmdkqGega6jJ5ZqXgtsSUy4Arrr8xYYAAAA="
  - path: fs/var/log/apt/term.log
    text: |
      Log started: 2026-04-10  09:00:00
      Selecting previously unselected package xmrig.
      Unpacking xmrig (6.21.0-1) ...
      Setting up xmrig (6.21.0-1) ...
      Log ended: 2026-04-10  09:00:05
steps:
  - tool: analyze_package_logs
    note_ko: "결함이 있는 호출: 패키지 로그 분석"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "문제없다는 판정이 나온다"
    contains: "No package-management red flags."
  - step: 1
    note_ko: "xmrig가 응답에 없다"
    not_contains: "xmrig"
  - step: 1
    note_ko: "건너뛴 로그가 있다는 말이 없다"
    not_regex: "(?i)\\.gz|term\\.log|rotat|not read|skipp"
