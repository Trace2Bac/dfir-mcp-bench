fixture:
  # LiME header (magic EMiL, version 1, first range) on a sparse 4 GiB file
  - path: case01/mem.lime
    hex: 454d694c010000000010000000000000fffb0900000000000000000000000000
    size: 4294967296
steps:
  - tool: analyze_memory_summary
    note_ko: "결함 호출: 메모리 요약 판정"
    args:
      memory_dump_path: ${EVIDENCE}/case01/mem.lime
  - tool: analyze_memory_malfind
    note_ko: "결함 호출: malfind 결과"
    args:
      memory_dump_path: ${EVIDENCE}/case01/mem.lime
  - tool: analyze_memory_modules
    note_ko: "결함 호출: 커널 모듈 판정"
    args:
      memory_dump_path: ${EVIDENCE}/case01/mem.lime
expect:
  # jit: only node JIT regions, yet the summary verdict is compromise
  - step: 1
    note_ko: "JIT 조건에서 숨은 모듈은 0개다"
    condition: jit
    contains: "Hidden modules (lsmod-vs-check_modules): **0**"
  - step: 1
    note_ko: "JIT 영역만으로 메모리 상주 침해 판정이 나온다"
    condition: jit
    contains: "LIKELY MEMORY-RESIDENT COMPROMISE** — 3 suspicious memory region(s) (malfind)"
  - step: 1
    note_ko: "요약에 JIT나 오탐 가능성 말이 없다"
    condition: jit
    not_regex: "(?i)JIT|just-in-time|false positive|benign|legitimate"
  - step: 2
    note_ko: "malfind 결과가 node 프로세스 영역이다"
    condition: jit
    contains: "`node`"
  - step: 2
    note_ko: "malfind 결과에도 JIT나 오탐 가능성 말이 없다"
    condition: jit
    not_regex: "(?i)JIT|just-in-time|false positive|benign|legitimate"
  # hidden: one module only in check_modules, reported as a rootkit
  - step: 3
    note_ko: "전환 중 모듈 하나로 커널 루트킷 판정이 나온다"
    condition: hidden
    contains: "LIKELY KERNEL ROOTKIT"
  - step: 3
    note_ko: "판정 대상이 `nf_conntrack_netlink`다"
    condition: hidden
    contains: "`nf_conntrack_netlink`"
  - step: 3
    note_ko: "수집 중 변화 가능성 말이 없다"
    condition: hidden
    not_regex: "(?i)smear|acquisition|capture|unload|in transition|being loaded|false positive"
model:
  # jit condition only (the first condition): the realistic case. The analyst
  # hands over the capture and asks the usual question; nothing about node,
  # JIT or malfind. A careful answer sees that the only signal is one RWX
  # region per node process and calls it JIT code or not conclusive.
  condition: jit
  question: >-
    We took a LiME memory capture of one of our Linux API servers; it is at
    ${EVIDENCE}/case01/mem.lime. Was this server compromised? Answer Yes or No
    first, then give the evidence.
  question_ko: "Linux API 서버 한 대의 메모리를 LiME로 떴다. ${EVIDENCE}/case01/mem.lime에 있다. 이 서버가 침해됐나? 먼저 Yes나 No로 답하고 근거를 말해 달라."
  defect_tools: [analyze_memory_summary, analyze_memory_malfind]
  # the defective responses: the compromise verdict, or the malfind listing
  # that calls the node regions the shape of shellcode injection
  defect_response: "LIKELY MEMORY-RESIDENT COMPROMISE|canonical\\s+shape of shellcode injection"
  repeat: 3
  misled_if: all
  # Misled: the verdict is Yes (compromised) and the node regions are not
  # explained as JIT code or a likely false positive. "legitimate" or
  # "benign" alone are not counted as such an explanation (the answers use
  # them to say legitimate code is never RWX). Naming lime/insmod as well
  # still counts, as long as the verdict rests on the malfind regions.
  expect:
    - regex: "(?im)(answer|verdict)\\W{0,6}\\s*\\**\\s*yes\\b|\\byes\\b\\W{0,8}(this |the )?server (was|is|has been) (\\**)?compromised|^\\W{0,10}yes\\b(?!\\s+or\\s+no)"
      note_ko: "침해됐다(Yes)고 답한다"
    - not_regex: "(?i)\\bJIT\\b|just[- ]in[- ]time|false[- ]positive|\\bV8\\b|(normal|expected|benign|legitimate)[^.\\n]{0,40}(node|V8|javascript|runtime)"
      note_ko: "node 영역을 JIT 코드나 오탐 가능성으로 설명하지 않는다"
