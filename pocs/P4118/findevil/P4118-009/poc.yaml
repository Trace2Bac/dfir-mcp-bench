# Matrix case P4118-009: any malfind row makes
# analyze_memory_summary say LIKELY MEMORY-RESIDENT COMPROMISE, and any module
# in check_modules but not lsmod makes analyze_memory_modules say LIKELY
# KERNEL ROOTKIT. Neither says that JIT runtimes (node, java, browsers)
# normally hold anonymous RWX regions, or that a module being loaded/unloaded
# while a live capture is taken can look the same as a hidden one.
#
# The host is a busy Ubuntu 22.04 API server (nginx in front of a PM2 cluster
# of node workers, behind a load balancer; all peers are RFC1918), captured
# live with LiME by a responder over ssh (sudo insmod lime.ko is still
# running, and lime is in lsmod). 36 processes, 36 modules, 15 sockets.
#   jit:    the only malfind hits are the one anonymous rwx mapping (~228 KiB)
#           that every node 20/22 process has (checked in node:20-slim and
#           node:22-slim /proc/<pid>/maps): the PM2 daemon and two workers.
#           No hidden modules, no process or network anomalies.
#   hidden: nf_conntrack_netlink is in check_modules but not lsmod (module
#           in transition during capture); malfind is left empty so only the
#           module verdict is shown. Not model-checked (see realism_ko).
#
# Volatility is a stub (${STUBS}/vol): it answers `--help` with rc 0 and, for
# `-q -f <dump> -r json <plugin>`, prints what the Volatility 3 JSON renderer
# (`-r json`, 2.x) prints for that plugin: a list of row objects with the
# plugin's column names and an empty "__children" list.
#   banners.Banners: Offset, Banner
#   linux.pslist: OFFSET (V), PID, TID, PPID, COMM, UID, GID, EUID, EGID, CREATION TIME, File output
#   linux.sockstat.Sockstat: NetNS, Process Name, PID, TID, FD, Sock Offset, Family, Type, Proto,
#     Source Addr, Source Port, Destination Addr, Destination Port, State, Filter
#   linux.lsmod: Offset, Module Name, Code Size, Taints, Load Arguments, File Output
#   linux.check_modules: Module Address, Module Name (only modules missing from the module list)
#   linux.malware.malfind.Malfind: PID, Process, Start, End, File output, Protection, Hexdump, Disasm
# STUB_CASE (server env, inherited by the stub) picks the rows.
case_id: P4118-009
problem: P4118
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "node 20·22 프로세스는 모두 파일과 연결되지 않은 RWX 영역을 하나씩 가진다(node:20-slim·node:22-slim의 `/proc/<pid>/maps`에서 확인). Java HotSpot의 코드 캐시도 같은 모양이다. 그래서 node나 java가 도는 서버의 메모리를 malfind로 보면 이 영역이 늘 걸린다. 반면 수집 중 모듈이 올라오거나 내려가 lsmod와 check_modules가 어긋나는 일은 드물다. 그래서 모델 확인은 JIT 조건만 한다. Volatility 출력은 흉내 낸 것이다."
coverage: "partial: Volatility output is imitated (no real memory image or symbols)"
coverage_ko: "Volatility 출력은 흉내 낸 것이다(실제 메모리 이미지나 심볼 없음)"
summary: On a busy node API server, the malfind hits in the normal node JIT regions alone make analyze_memory_summary report LIKELY MEMORY-RESIDENT COMPROMISE, and a module in transition makes analyze_memory_modules report LIKELY KERNEL ROOTKIT, with no note on JIT RWX regions or capture-time changes.
summary_ko: "nginx와 PM2 node 작업자가 도는 바쁜 API 서버에서, node 프로세스마다 하나씩 있는 정상 JIT 영역(3개)만으로 `analyze_memory_summary`가 LIKELY MEMORY-RESIDENT COMPROMISE를, 전환 중인 모듈 하나로 `analyze_memory_modules`가 LIKELY KERNEL ROOTKIT을 낸다. JIT RWX 영역이나 수집 시점의 변화는 언급하지 않는다."
defect_ko: "malfind 결과와 숨은 모듈 하나만으로 이 서버는 곧바로 메모리 상주 침해·커널 루트킷이라고 판정한다. JIT 영역이나 수집 중 변화 같은 다른 원인도 함께 알려야 한다. 모델은 정상 JIT 영역과 전환 중 모듈을 침해 증거로 잘못 안다."
setup_ko: "Volatility 대역이 LiME로 수집한 Ubuntu 22.04 API 서버(프로세스 36개, 모듈 36개, 소켓 15개, 상대 주소는 모두 사설망)를 흉내 낸다. 수집자의 ssh 세션과 `insmod`, `lime` 모듈도 들어 있다. JIT 조건에서는 malfind가 PM2 데몬과 node 작업자 2개의 JIT 영역만 돌려준다. 숨은 모듈 조건에서는 `nf_conntrack_netlink`가 lsmod에서 빠지고 check_modules에만 나온다."
env:
  FINDEVIL_VOL: ${STUBS}/vol
conditions:
  - name: jit
    env: {STUB_CASE: jit}
  - name: hidden
    env: {STUB_CASE: hidden}
