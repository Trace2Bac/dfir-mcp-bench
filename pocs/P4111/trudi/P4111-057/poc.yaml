# Matrix case P4111-057: the server instructions say "Timestamps are always
# UTC.", but several tools return times in another clock with no zone mark:
# misc_device_install_inventory copies the times of setupapi.dev.log, which
# Windows writes in the host's local time, and the net_tcpdump_* tools run
# tcpdump -tttt, which prints in the analysis server's local time zone.
# setupapi.dev.log here is from a Windows 10 host in US Eastern time (EDT,
# UTC-4, in October); a SanDisk USB stick was plugged in at 22:15:31 local,
# 02:15:31 UTC on the next day. The pcap is the real capture of P2049-143
# (first packet 2026-04-10 08:00:00 UTC), read by a server in UTC and by one
# whose TZ is America/New_York.
# trudi runs tcpdump as "sudo tcpdump ..." (SIFT has passwordless sudo); the
# image has no sudo, so ${STUBS}/sudo only runs the command it is given.
# tcpdump itself is the real one. The live_* tools (remote host's clock) are
# not run here.
case_id: P4111-057
problem: P4111
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "setupapi.dev.log는 언제나 그 PC의 현지 시각으로 기록되고, 분석 서버의 시간대를 현지 시각으로 둔 채 쓰는 일도 흔하다."
coverage: "partial: live_recent_logins and live_event_log_tail (the remote host's clock, no year or zone) are not run"
coverage_ko: "원격 호스트 시각을 그대로 내는 live_recent_logins·live_event_log_tail은 돌리지 않았다."
summary: Although the server instructions say "Timestamps are always UTC.", misc_device_install_inventory returns a USB stick's first_seen as 2024-10-27 22:15:31, the Eastern local time of setupapi.dev.log (02:15:31 UTC on 10-28), and net_tcpdump_read prints the same packet at 08:00:00 or 04:00:00 depending on the server's TZ, with no zone in either response.
summary_ko: "서버 지침은 \"Timestamps are always UTC.\"인데, `misc_device_install_inventory`는 USB 메모리의 first_seen을 setupapi.dev.log의 미국 동부 현지 시각 그대로 2024-10-27 22:15:31(UTC로는 10-28 02:15:31)로 내고, `net_tcpdump_read`는 같은 패킷을 서버 시간대에 따라 08:00:00 또는 04:00:00으로 낸다. 두 응답 모두 시간대 표시가 없다."
defect_ko: "이 서버는 증거 기록의 현지 시각과 분석 서버의 현지 시각을 시간대 표시 없이 그대로 돌려주면서, 지침에서는 모든 시각이 UTC라고 한다. 정상이라면 UTC로 바꾸거나, 바꿀 수 없으면 어느 시간대의 시각인지 응답에 밝혀야 한다. 모델은 USB가 꽂힌 시각을 UTC 22:15로 알아 실제보다 4시간 이르게 타임라인에 놓는다."
setup_ko: "미국 동부(EDT, UTC-4) Windows 10 PC의 setupapi.dev.log에 SanDisk USB 메모리 설치 기록(현지 22:15:31)을 넣었다. 실제 pcap(첫 패킷 2026-04-10 08:00:00 UTC)을 서버 시간대 UTC와 America/New_York 두 조건에서 읽는다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
  PATH: ${STUBS}:${PATH}
conditions:
  - name: utc
    env: {TZ: UTC}
  - name: new_york
    env: {TZ: America/New_York}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
