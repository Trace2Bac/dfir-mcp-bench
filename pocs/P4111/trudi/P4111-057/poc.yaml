steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4111-057
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: misc_device_install_inventory
    note_ko: "결함 호출: setupapi.dev.log에서 장치 목록과 처음 본 시각을 뽑음"
    args:
      setupapi_log_path: ${EVIDENCE}/C/Windows/INF/setupapi.dev.log
  - tool: net_tcpdump_read
    note_ko: "결함 호출: pcap의 패킷을 시각과 함께 읽음"
    args:
      pcap_file: ${EVIDENCE}/net/beacon.pcap
      count: 1
expect:
  - step: 2
    note_ko: "USB 메모리의 처음 본 시각이 로그의 동부 현지 시각(UTC로는 10-28 02:15:31) 그대로다"
    contains: '"first_seen": "2024-10-27 22:15:31"'
  - step: 2
    note_ko: "조사 범위 시각도 현지 시각 그대로, 시간대 없이 나온다"
    contains: '"coverage_window": {"start": "2024-10-27 22:15:31", "end": "2024-10-27 22:15:32"}'
  - step: 3
    condition: utc
    note_ko: "UTC 서버에서는 첫 패킷이 08:00:00으로 나온다"
    regex: '2026-04-10 08:00:00\.\d+ IP 10\.0\.0\.8'
  - step: 3
    condition: new_york
    note_ko: "시간대가 뉴욕인 서버에서는 같은 패킷이 04:00:00으로, 표시 없이 나온다"
    regex: '2026-04-10 04:00:00\.\d+ IP 10\.0\.0\.8'
  - differs: {step: 3, conditions: [utc, new_york]}
    note_ko: "같은 pcap인데 서버 시간대에 따라 응답이 다르다"
