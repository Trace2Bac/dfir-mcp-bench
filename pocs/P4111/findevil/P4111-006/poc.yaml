# Matrix case P4111-006: build_timeline mixes apt times without an offset with
# auth.log times labelled +00:00; analyze_package_logs leaves yum times in
# their raw "Apr 10 ..." form and string-sorts them after ISO times.
case_id: P4111-006
problem: P4111
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: source-vs-result
level: mcp
realism: possible
realism_ko: "오프셋 없는 apt 시각은 흔하지만, 한 호스트에 apt와 yum 기록이 함께 있는 경우는 드물다."
coverage: full
summary: The timeline shows an apt install as 2026-04-12T14:30:04 with no offset next to auth.log rows marked +00:00, and analyze_package_logs lists a yum install from Apr 10 after an apt install from Apr 12 because the raw yum time sorts after ISO strings.
summary_ko: "타임라인이 오프셋 없는 apt 설치 시각 2026-04-12T14:30:04를 +00:00이 붙은 `auth.log` 행 옆에 둔다. `analyze_package_logs`는 Apr 10의 yum 설치를 Apr 12의 apt 설치 뒤에 나열하는데, yum의 원래 시각 문자열이 ISO 문자열 뒤로 정렬되기 때문이다."
defect_ko: "이 서버는 오프셋 없는 apt 시각을 UTC 시각 옆에 그대로 두고, yum 시각 문자열을 ISO 문자열과 글자 순으로 정렬한다. 시각을 같은 기준으로 맞춰 실제 순서대로 정렬해야 한다. 모델은 4월 10일의 yum 설치를 4월 12일 apt 설치보다 뒤의 일로 잘못 안다."
setup_ko: "auth.log 한 줄, apt history.log(4월 12일 설치), yum.log(4월 10일 설치)를 같은 파일 시스템에 넣었다."
fixture:
  - path: case/auth.log
    text: "Apr 12 14:00:00 web sshd[811]: Accepted password for root from 203.0.113.7 port 50022 ssh2\n"
  - path: case/fs/var/log/apt/history.log
    text: |
      Start-Date: 2026-04-12  14:30:04
      Commandline: apt-get install -y xmrig
      Install: xmrig:amd64 (6.21.0-1)
      End-Date: 2026-04-12  14:30:09
  - path: case/fs/var/log/yum.log
    text: "Apr 10 09:00:00 Installed: xmrig-6.20.0-1.x86_64\n"
steps:
  - tool: build_timeline
    note_ko: "결함 호출: 타임라인에 오프셋 없는 apt 시각이 섞임"
    args:
      evidence_root: ${EVIDENCE}/case
  - tool: analyze_package_logs
    note_ko: "결함 호출: 패키지 로그 표의 정렬"
    args:
      root_path: ${EVIDENCE}/case/fs
expect:
  - step: 1
    note_ko: "auth.log 행에는 `+00:00`이 붙어 있다"
    contains: "| 2026-04-12T14:00:00+00:00 | auth.log |"
  - step: 1
    note_ko: "apt 행에는 오프셋이 없다"
    contains: "| 2026-04-12T14:30:04 | apt |"
  - step: 2
    note_ko: "4월 10일 yum 설치가 4월 12일 apt 설치 뒤에 나온다"
    regex: "\\| 2026-04-12T14:30:04 \\| apt \\|[^\\n]*\\n\\| Apr 10 09:00:00 \\| yum \\|"
