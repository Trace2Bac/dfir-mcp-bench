# Matrix case P4111-035: run_mactime runs mactime with -d, whose rows start
# "Tue Mar 24 2015 09:41:12". _parse_timestamp (extract_helpers.py 52-100)
# knows ISO, syslog ("Mar 24 09:41:12", no year between) and plaso dates, so
# every tsk.timeline window gets event_time NULL. get_fs_timeline filters on
# event_time (db.get_windows_by_source), so a range that holds the files
# returns nothing. search with t_start/t_end drops the NULL windows on the
# keyword (FTS) path and keeps them on the regex path (core.py 205-208).
# Nothing in a response says that windows were left out for having no time.
#
# Evidence: a 1 MiB FAT12 image of a USB stick made in this image with
# mkfs.fat 4.2 (label KINGSTON) and mcopy -m, the volume label's times set
# to 2015-03-20 10:02:00 afterwards; fsck.fat reads it cleanly.
#   /backup/                  mtime 2015-03-24 09:40:58
#   /backup/Orion_Roadmap_Q2.docx (37 bytes)  mtime 2015-03-24 09:41:12
#   /backup/customers_2015.xlsx   (30 bytes)  mtime 2015-03-24 09:41:40
#   sha256 f9107913db5bf94378368d58481233a499daff8034dfbc38ad1fb13163c011b7
