realism: common
realism_ko: "디스크 이미지의 파일 시각을 보려고 `run_mactime`을 돌린 뒤 사건 날짜로 `get_fs_timeline`을 부르는 것은 도구 설명이 그대로 권하는 사용이고, `-d` 출력 형식은 늘 같으므로 모든 이미지에서 같은 일이 생긴다."
coverage: full
summary: >-
  After run_mactime on a USB stick image whose /backup files were written on
  2015-03-24 09:41, get_fs_timeline for 2015-03-24 returns success with no
  windows, and search for Orion_Roadmap_Q2 in tsk.timeline with that day as
  t_start/t_end finds 0 matches by keyword but 1 with regex=True, while
  get_raw_output shows the rows "Tue Mar 24 2015 09:41:12 ...
  /backup/Orion_Roadmap_Q2.docx".
summary_ko: "`/backup`의 파일이 2015-03-24 09:41에 쓰인 USB 이미지에 `run_mactime`을 돌린 뒤 2015-03-24로 `get_fs_timeline`을 부르면 success에 window 0개다. 같은 날을 `t_start`·`t_end`로 주고 `tsk.timeline`에서 `Orion_Roadmap_Q2`를 찾으면 키워드 검색은 0건, `regex=True`는 1건이다. `get_raw_output`에는 `Tue Mar 24 2015 09:41:12 … /backup/Orion_Roadmap_Q2.docx` 줄이 있다."
defect_ko: "이 서버는 자기가 만든 mactime `-d` 출력의 시각을 읽지 못해 `tsk.timeline`의 모든 window 시각을 비워 두고, 시각으로 거르는 조회에서 그 window를 알리지 않고 뺀다(정규식 검색만 넣는다). 정상이라면 그 형식을 읽거나, 시각을 못 읽어 빠진 window 수를 알려야 한다. 모델은 그날 USB에 쓰인 파일이 없다고 잘못 안다."
setup_ko: "기밀 문서 두 개가 2015-03-24 09:41에 `/backup`에 복사된 1 MiB FAT12 USB 이미지를 두고 `run_mactime`으로 파일 시스템 타임라인을 적재했다."
