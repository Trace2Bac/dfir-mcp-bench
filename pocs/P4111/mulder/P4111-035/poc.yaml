steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: mactime-dates
  - tool: run_mactime
    note_ko: "준비: 파일 시스템 타임라인 적재"
    args:
      image_path: ${EVIDENCE}/usb.img
  - tool: get_fs_timeline
    note_ko: "결함 호출: 2015-03-24 하루의 파일 시스템 타임라인"
    args:
      t_start: "2015-03-24T00:00:00"
      t_end: "2015-03-24T23:59:59"
  - tool: search
    note_ko: "결함 호출: 같은 날짜 범위로 문서 이름 키워드 검색"
    args:
      query: Orion_Roadmap_Q2
      source: tsk.timeline
      t_start: "2015-03-24T00:00:00"
      t_end: "2015-03-24T23:59:59"
  - tool: search
    note_ko: "비교 호출: 같은 조건의 정규식 검색"
    args:
      query: Orion_Roadmap_Q2
      source: tsk.timeline
      regex: true
      t_start: "2015-03-24T00:00:00"
      t_end: "2015-03-24T23:59:59"
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 타임라인 원문"
    args:
      source_name: tsk.timeline
expect:
  - step: 3
    note_ko: "그날의 파일 시스템 타임라인이 success에 0건이다"
    regex: '"status": "success"[\s\S]*"total_windows": 0\b'
  - step: 4
    note_ko: "같은 날짜 범위의 키워드 검색은 0건이다"
    regex: '"total_matches": 0\b'
  - step: 5
    note_ko: "같은 조건의 정규식 검색은 1건을 찾는다"
    regex: '"total_matches": 1\b'
  - step: 6
    note_ko: "적재된 원문에는 그날 09:41:12에 쓰인 문서 줄이 있다"
    regex: 'Tue Mar 24 2015 09:41:12,37,m\.\.b,[^"]*\\"/backup/Orion_Roadmap_Q2\.docx'
