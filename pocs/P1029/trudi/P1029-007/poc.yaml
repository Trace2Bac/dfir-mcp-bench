# Matrix case P1029-007: core/evidence_kinds.py classify_name decides what a
# case holds from the file name only: a .img is a memory image when its base
# name contains "mem", otherwise a disk image. A RAM capture saved as
# host1.img (dd-style naming) makes the case "disk_image only", and
# dair_assess then drops every vol.* tool DAIR prescribes as needing memory
# evidence the case does not hold, and tells the DAIR model so.
# Evidence: the case folder <case>/evidence/ holds one raw RAM capture of a
# Windows host. A raw capture (dd, winpmem raw) has no header, so the bytes
# cannot tell memory from disk either; it is a 4 MiB sparse file here. The
# comparison condition holds the same capture named host1.mem. The case sits
# under ${OUTSIDE}/cases because the server finds evidence/ next to the
# trace's analysis/ folder.
# DAIR is the server's own model backend; anthropic_stub answers it with one
# RESULT block (the shape tools/dair.py parses) that stays in Triage and
# prescribes three Volatility tools for the memory capture.
case_id: P1029-007
problem: P1029
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: source-vs-result
level: mcp
realism: possible
realism_ko: "증거 파일 이름은 수집 도구나 분석가가 붙인 값으로 증거와 함께 들어온다. `dd`로 뜬 메모리나 다른 도구의 raw 메모리 덤프를 `host1.img`처럼 `.img`로 저장하는 일은 실제로 있다."
coverage: "partial: the .img naming rule is shown through dair_assess's evidence inventory; the IOC coverage rows that use the same inventory need a mitre_detection.json, which trudi does not ship, and are not run"
coverage_ko: "`.img` 이름 규칙이 `dair_assess`의 증거 목록과 작업 지시에 미치는 영향만 보인다. 같은 목록을 쓰는 IOC 범위 행은 trudi가 배포하지 않는 `mitre_detection.json`이 있어야 나오므로 돌리지 않았다."
summary: With one RAM capture named host1.img in evidence/, dair_assess reports evidence_kinds ["disk_image"], drops vol.pslist, vol.netscan and vol.malfind from the work order as needing memory, and tells the DAIR model the case holds no memory evidence; the same capture named host1.mem gives evidence_kinds ["memory"] and keeps the three tools.
summary_ko: "`evidence/`에 RAM 캡처 하나를 `host1.img`라는 이름으로 두면 `dair_assess`는 `evidence_kinds`를 `[\"disk_image\"]`로 내고, DAIR가 지시한 `vol.pslist`, `vol.netscan`, `vol.malfind`를 메모리가 필요하다며 작업 지시에서 빼며, DAIR 모델에도 메모리 증거가 없다고 알린다. 같은 캡처를 `host1.mem`으로 두면 `[\"memory\"]`가 되고 세 도구가 남는다."
defect_ko: "이 서버는 증거의 종류를 파일 이름(확장자와 이름 속 `mem`)으로만 정해, 이름에 `mem`이 없는 `.img` 메모리 이미지를 디스크 이미지로 본다. 이름으로 정할 수 없는 확장자는 두 종류를 함께 두거나 내용과 분석가의 확인으로 정해야 한다. 모델과 DAIR는 이 사건에 메모리 증거가 없다고 알고, 메모리 분석을 하지 않은 채 조사를 진행한다."
setup_ko: "사건 폴더의 `evidence/`에 Windows 호스트의 RAM 캡처 하나를 `host1.img`로 두고 기록을 연 뒤 `dair_assess`를 부른다. DAIR 모델 응답은 가짜 Anthropic API가 주며 Volatility 도구 세 개를 지시한다. 비교 조건은 같은 캡처를 `host1.mem`으로 둔다."
