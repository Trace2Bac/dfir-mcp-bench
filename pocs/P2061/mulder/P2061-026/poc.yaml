# Matrix case P2061-026: run_aleapp keeps an ALEAPP TSV only when its file
# stem is exactly one of artifact_filter (phone.py _parse_leapp_output). The
# tool description gives "sms" as an example, but ALEAPP names the SMS report
# "SMS Messages", so the filter drops it and the tool answers no_artifacts.
case_id: P2061-026
problem: P2061
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "도구 설명이 `artifact_filter`의 예로 `sms`를 들므로, 모델은 SMS만 보려 할 때 그대로 `[\"sms\"]`를 준다."
coverage: full
summary: On an Android file system extraction whose mmssms.db holds three SMS messages, run_aleapp with artifact_filter ["sms"] (the example in its own description) returns status success with a preview of no_artifacts, "ALEAPP produced no parseable output", while the same call without the filter returns the "SMS Messages" artifact with 3 records.
summary_ko: "SMS 3건이 든 `mmssms.db`가 있는 안드로이드 파일 시스템 추출본에 도구 설명의 예시대로 `artifact_filter: [\"sms\"]`를 주면 success 응답에 `no_artifacts`(\"ALEAPP produced no parseable output\")가 실려 온다. 필터 없이 부르면 `SMS Messages` 3건이 나온다."
defect_ko: "이 서버는 필터 값을 ALEAPP TSV 파일 이름과 정확히 같은지만 비교하고, 맞는 이름이 없다고 알리지 않는다. 정상이라면 설명의 예시 값이 동작하거나, 맞는 모듈 이름이 없다고 알려야 한다. 모델은 이 기기에 SMS가 없다고 잘못 안다."
setup_ko: "AOSP 형식의 `mmssms.db`(SMS 3건)를 `data/data/com.android.providers.telephony/databases/`에 둔 안드로이드 파일 시스템 추출본을 넣었다."
fixture:
  - path: android_fs/data/data/com.android.providers.telephony/databases/mmssms.db
    # SQLite database with the AOSP telephony provider tables (sms, threads,
    # canonical_addresses, pdu, part, addr), page size 512; three SMS rows.
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 생성"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p2061-026
  - tool: run_aleapp
    note_ko: "결함 호출: 설명의 예시 `sms`로 거른 ALEAPP 실행"
    timeout_s: 900
    args:
      extraction_path: ${EVIDENCE}/android_fs
      artifact_filter: [sms]
  - tool: run_aleapp
    note_ko: "비교 호출: 필터 없는 ALEAPP 실행"
    timeout_s: 900
    args:
      extraction_path: ${EVIDENCE}/android_fs
expect:
  - step: 2
    note_ko: "`sms`로 거른 호출이 success로 끝난다"
    contains: '"status": "success"'
  - step: 2
    note_ko: "결과는 아티팩트가 없다는 것이고, 맞는 이름이 없다는 말 대신 ALEAPP 출력이 없다고 한다"
    contains: 'no_artifacts\", \"message\": \"ALEAPP produced no parseable output'
  - step: 3
    note_ko: "필터 없이 부르면 같은 추출본에서 SMS 3건이 나온다"
    contains: 'SMS Messages\", \"record_count\": 3'
