# Matrix case P2061-074: read_evidence_file passes max_bytes to f.read()
# without checking it. A negative value (the usual "no limit" convention)
# reads the whole file, and truncated = file_size > max_bytes is then always
# true, so a complete read is reported as cut.
case_id: P2061-074
problem: P2061
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "`-1`을 \"제한 없음\"으로 쓰는 관례가 흔해, 파일 전체를 읽으려는 모델이 `max_bytes: -1`을 줄 수 있다."
coverage: "partial: read_evidence_file with max_bytes -1 is shown; the other size and offset arguments listed for this case (get_raw_output, search, get_timeline, get_findings and others) are not"
coverage_ko: "`read_evidence_file`의 `max_bytes: -1`만 보인다. 이 사례에 함께 적힌 다른 도구의 크기·위치 인자(`get_raw_output`, `search`, `get_timeline`, `get_findings` 등)는 보이지 않는다."
summary: read_evidence_file with max_bytes -1 returns the whole auth.log, last line included, yet reports truncated true; the same file read with the default limit reports truncated false.
summary_ko: "`max_bytes: -1`로 `read_evidence_file`을 부르면 `auth.log` 전체(마지막 줄 포함)가 오는데 `truncated`가 true다. 기본 한도로 읽으면 같은 파일이 `truncated: false`다."
defect_ko: "이 서버는 음수 `max_bytes`를 거부하지 않고 파일 전체를 읽은 뒤 잘렸다고 표시한다. 정상이라면 음수를 거부하거나, 전체를 읽었으면 `truncated: false`여야 한다. 모델은 받은 내용 뒤에 읽지 못한 부분이 있다고 잘못 안다."
setup_ko: "로그인 기록 40줄이 든 `var/log/auth.log`를 증거에 넣었다."
