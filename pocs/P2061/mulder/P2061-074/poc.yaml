steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 생성"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p2061-074
  - tool: read_evidence_file
    note_ko: "결함 호출: `max_bytes: -1`로 파일 읽기"
    args:
      file_path: ${EVIDENCE}/var/log/auth.log
      max_bytes: -1
  - tool: read_evidence_file
    note_ko: "비교 호출: 기본 한도로 같은 파일 읽기"
    args:
      file_path: ${EVIDENCE}/var/log/auth.log
expect:
  - step: 2
    note_ko: "파일의 마지막 줄까지 다 왔다"
    contains: "Session 41 logged out. Waiting for processes to exit."
  - step: 2
    note_ko: "그런데 잘렸다고 표시한다"
    contains: '"truncated": true'
  - step: 3
    note_ko: "기본 한도로 읽으면 같은 파일이 잘리지 않았다고 표시된다"
    contains: '"truncated": false'
