# Matrix case P2061-041: submit_finding (and update_finding) store
# mitre_attack_ids as given; the IDs are neither checked for the T#### shape
# nor looked up in the ATT&CK table the server ships (attack.py), so a
# deprecated or mistyped ID becomes part of the finding.
#
# The case is resumed: ${DB_DIR} holds a case database and audit log written
# by this same image (scan_evidence, then run_strings on update.ps1), so the
# finding can cite the run_strings call tc_841c0a02. The database was
# VACUUMed to a 512-byte page size to keep this file small; its tables are
# unchanged. Its evidence root is /ev, where it was made.
case_id: P2061-041
problem: P2061
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "PowerShell 실행의 옛 기법 ID `T1086`은 2020년에 폐기됐지만 오래된 보고서·규칙과 모델 답에 아직 자주 나오므로, 발견 사항에 그대로 적는 일이 있을 수 있다."
coverage: "partial: submit_finding with one deprecated ID is shown; update_finding stores the IDs the same way"
coverage_ko: "`submit_finding`과 폐기된 ID 하나만 보인다. `update_finding`도 같은 방식으로 저장한다."
summary: lookup_attack_technique says the server's ATT&CK table has no T1086, yet submit_finding with mitre_attack_ids ["T1086"] is accepted without a warning and get_findings returns the finding with T1086 as its technique.
summary_ko: "`lookup_attack_technique`는 서버의 ATT&CK 표에 `T1086`이 없다고 답하는데, `mitre_attack_ids: [\"T1086\"]`인 `submit_finding`은 경고 없이 accepted되고 `get_findings`는 그 발견 사항을 `T1086` 기법으로 돌려준다."
defect_ko: "이 서버는 ATT&CK ID를 모양도, 자기 기법 표도 보지 않고 저장한다. 정상이라면 표에 없는 ID(폐기·오타)를 거부하거나 경고해야 한다. 모델은 발견 사항의 기법 매핑이 확인된 값이라고 잘못 안다."
setup_ko: "`run_strings`로 C2 주소에서 내려받아 실행하는 PowerShell 스크립트를 색인해 둔 기존 사건(`ir-2026-031`)을 열고, 폐기된 기법 ID `T1086`으로 발견 사항을 냈다."
fixture:
  - path: ir-2026-031.audit.jsonl
    root: db
    text: |
      {"type":"tool_call","tool_call_id":"tc_3cfd9de2","tool_name":"scan_evidence","params":{"evidence_path":"/ev","case_id":"ir-2026-031","replace":false},"output_hash":"blake2b:f5b51a97d98872661c9f7f1f211b3e72b818b701fa651c1492aada55120092e8","duration_ms":25.697874999991654,"timestamp":"2026-11-28T05:24:54.504566+00:00"}
      {"type":"tool_call","tool_call_id":"tc_841c0a02","tool_name":"run_strings","params":{"target_path":"/ev/update.ps1","min_length":8},"output_hash":"blake2b:8b6664e19f17d33f12958fa0639b383e79d1ce278e6d1860b9cb9a9418a80913","duration_ms":9.648167000023022,"timestamp":"2026-11-28T05:24:54.557468+00:00"}
  - path: ir-2026-031.db
    root: db
    base64: 
steps:
  - tool: open_case
    note_ko: "준비: 기존 사건 열기"
    args:
      case_id: ir-2026-031
  - tool: lookup_attack_technique
    note_ko: "비교 호출: 서버의 ATT&CK 표에서 T1086 찾기"
    args:
      query: T1086
  - tool: submit_finding
    note_ko: "결함 호출: 폐기된 기법 ID T1086으로 발견 사항 제출"
    args:
      title: PowerShell download cradle runs a script from 203.0.113.7
      description: update.ps1 downloads http://203.0.113.7/a with Net.WebClient and runs it with IEX.
      severity: high
      confidence: inference
      evidence_refs: [tc_841c0a02]
      sources: [strings.output]
      mitre_attack_ids: [T1086]
  - tool: get_findings
    note_ko: "확인 호출: 저장된 발견 사항"
expect:
  - step: 2
    note_ko: "서버의 기법 표에는 T1086이 없다"
    contains: '"match_count": 0'
  - step: 3
    note_ko: "표에 없는 ID인데 발견 사항이 accepted된다"
    contains: '"status": "accepted"'
  - step: 3
    note_ko: "ID에 대한 경고가 없다"
    not_regex: '(?i)mitre|attack|T1086'
  - step: 4
    note_ko: "저장된 발견 사항의 기법이 T1086이다"
    regex: '"mitre_attack_ids": \[\s*"T1086"\s*\]'
