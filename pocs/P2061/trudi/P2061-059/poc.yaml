# Matrix case P2061-059: coverage_report scopes its "gaps" by matching each
# name in relevant_tactics as a substring of the table's tactic names
# ("Credential Access", "Lateral Movement") and never checks that a name
# matched anything. ATT&CK's own tactic short names (credential-access,
# lateral-movement, the kill_chain_phases names in the STIX data) match
# nothing, so the scope is empty and the report says there are no gaps.
# TRUDI_MITRE_TABLE points at the table trudi ships
# (cases/.common/mitre_techniques.json, copied to ~/cases/.common by install.sh).
case_id: P2061-059
problem: P2061
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: possible
realism_ko: "ATT&CK 데이터와 여러 도구는 전술을 credential-access처럼 줄인 이름으로 쓰므로, 그 표기로 범위를 주는 일이 있을 수 있다."
coverage: full
summary: On the same trace, coverage_report with "Credential Access, Lateral Movement" lists the untouched techniques of those tactics, but with ATT&CK's short names "credential-access, lateral-movement" it returns success with an empty gaps list.
summary_ko: "같은 trace에서 `coverage_report`에 \"Credential Access, Lateral Movement\"를 주면 손대지 않은 기법을 빈틈으로 나열하지만, ATT&CK의 짧은 이름 \"credential-access, lateral-movement\"를 주면 성공 응답에 빈틈이 0건이다."
defect_ko: "이 서버는 전술 이름이 표의 어느 전술에도 맞지 않아도 알리지 않고 범위를 비운 채 빈틈 0건을 돌려준다. 정상이라면 모르는 전술 이름을 거부하거나 맞는 전술이 없다고 알려야 한다. 모델은 두 전술을 빠짐없이 살폈다고 잘못 안다."
setup_ko: "발견이 없는 새 사건 기록을 열고, trudi가 배포하는 ATT&CK 기법 표로 같은 두 전술을 두 가지 표기로 주어 비교한다."
env:
  TRUDI_MITRE_TABLE: /opt/trudi/cases/.common/mitre_techniques.json
fixture:
  - path: case01/analysis/.keep
    root: outside
    text: ""
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 기록을 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: coverage_report
    note_ko: "비교 호출: 표의 전술 이름으로 범위를 준다"
    args:
      relevant_tactics: "Credential Access, Lateral Movement"
  - tool: coverage_report
    note_ko: "결함 호출: ATT&CK의 짧은 전술 이름으로 같은 범위를 준다"
    args:
      relevant_tactics: "credential-access, lateral-movement"
expect:
  - step: 2
    note_ko: "표의 전술 이름이면 손대지 않은 기법(예: T1003 OS Credential Dumping)이 빈틈에 있다"
    regex: '"gaps": \[[^\]]*"T1003"'
  - step: 3
    note_ko: "짧은 이름이면 성공 응답에 빈틈이 하나도 없다"
    contains: '"success": true'
  - step: 3
    note_ko: "빈틈 목록이 비어 있다"
    contains: '"gaps": []'
  - step: 3
    note_ko: "요약도 범위 안의 빈틈을 0건으로 적는다"
    contains: "0 untouched in scope"
