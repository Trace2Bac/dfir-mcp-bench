# Matrix case P2061-060: monitor_check_alerts and monitor_list_watchers never
# check that the case exists: they create ~/cases/<case_id>/monitoring/ with
# _ensure_layout and return success with no alerts and no watchers. A case id
# typed in other letter case than the live-monitoring case's folder (Linux
# paths are case-sensitive) gets an empty, successful answer, while the real
# case holds an unconsumed high-severity alert.
# TRUDI_CASES_ROOT is the cases folder. The alert is written as
# bin/trudi-velo-watcher.py writes one (_write_alert: <seq:08d>_<detector>.json,
# _seq.txt), with its watcher pid file.
case_id: P2061-060
problem: P2061
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "사람이 사건 ID를 소문자로 불러 주거나 모델이 옮겨 적으며 대소문자가 바뀌는 일은 있을 수 있고, Linux 경로는 대소문자를 구분한다."
coverage: full
summary: The live case LIVE-WEB01 holds one unconsumed high-severity alert, but monitor_check_alerts and monitor_list_watchers called with live-web01 return success with no alerts and no watchers, and create a new live-web01 monitoring folder.
summary_ko: "실시간 감시 사건 LIVE-WEB01에는 처리되지 않은 high 경보가 1건 있지만, `live-web01`로 부른 `monitor_check_alerts`·`monitor_list_watchers`는 경보·감시자 0건을 성공으로 돌려주고 live-web01 감시 폴더를 새로 만든다."
defect_ko: "이 서버는 사건이 있는지 보지 않고 감시 폴더를 만든 뒤 빈 결과를 성공으로 준다. 정상이라면 없는 사건이라고 거부해야 한다. 모델은 그 사건에 새 경보도 돌고 있는 감시자도 없다고 잘못 안다."
setup_ko: "감시자 하나와 새 프로세스 경보 1건(처리 안 됨)이 있는 실시간 감시 사건 LIVE-WEB01 폴더를 넣었다."
env:
  TRUDI_CASES_ROOT: ${OUTSIDE}/cases
fixture:
  - path: cases/LIVE-WEB01/monitoring/watchers/C.4f8a2b91d3e6c057.pid
    root: outside
    text: "48211\n"
  - path: cases/LIVE-WEB01/monitoring/alerts/_seq.txt
    root: outside
    text: "1"
  - path: cases/LIVE-WEB01/monitoring/alerts/00000001_NewProcess.json
    root: outside
    text: |
      {
        "alert_id": "6d1f0c52-8b7e-4a3d-9f21-3c5b7e9a0d44",
        "seq": 1,
        "case_id": "LIVE-WEB01",
        "client_id": "C.4f8a2b91d3e6c057",
        "hostname": "web01",
        "timestamp_utc": "2026-11-27T08:14:09Z",
        "detector": "Custom.TRUDI.NewProcess",
        "severity": "high",
        "summary": "New process not in baseline: /tmp/.x/kworkerd (pid=48877)",
        "evidence": {
          "pid": 48877,
          "ppid": 1311,
          "image_path": "/tmp/.x/kworkerd",
          "cmdline": "/tmp/.x/kworkerd -o 203.0.113.7:3333",
          "username": "www-data",
          "Hostname": "web01",
          "timestamp_utc": "2026-11-27T08:14:09Z"
        },
        "suggested_pivot_tools": ["live_process_details", "live_open_files", "live_network_connections"],
        "consumed": false
      }
steps:
  - tool: monitor_check_alerts
    note_ko: "비교 호출: 폴더 이름 그대로 LIVE-WEB01의 경보를 확인한다"
    args:
      case_id: LIVE-WEB01
  - tool: monitor_check_alerts
    note_ko: "결함 호출: 같은 사건을 소문자 live-web01로 확인한다"
    args:
      case_id: live-web01
  - tool: monitor_list_watchers
    note_ko: "결함 호출: 소문자 live-web01의 감시자를 확인한다"
    args:
      case_id: live-web01
expect:
  - step: 1
    note_ko: "실제 사건에는 처리되지 않은 경보가 1건 있다"
    regex: '"severity": "high".*"count": 1'
  - step: 2
    note_ko: "소문자 ID로 부르면 없는 사건인데도 경보 0건을 성공으로 준다"
    contains: '{"success": true, "alerts": [], "count": 0'
  - step: 3
    note_ko: "감시자도 0건을 성공으로 준다"
    contains: '{"success": true, "watchers": [], "alerts_emitted": 0'
  - file_exists: ${OUTSIDE}/cases/live-web01/monitoring/alerts
    note_ko: "없는 사건의 감시 폴더가 새로 만들어졌다"
