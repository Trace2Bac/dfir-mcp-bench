# Matrix case P2061-002: get_audit_trail does not parse filter_since as a time.
# It compares it as text with the "+00:00" timestamp strings in audit.json, so
# the same instant written with another offset or a space separator filters
# the wrong entries, and the result is returned as normal.
# Two audit entries are written to ${DB_DIR}/audit.json before the server
# starts (FINDEVIL_LOGS_DIR=${DB_DIR}; the fixture uses root: db):
# hash_file at 09:00Z and auth_summary at 11:00Z.
case_id: P2061-002
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "`+09:00` 오프셋이나 공백으로 구분한 시각은 모델이 실제로 줄 수 있는 값이다."
coverage: full
summary: With audit entries at 09:00Z and 11:00Z, filter_since "2026-01-05T19:00:00+09:00" (10:00Z) returns "No matching entries" and "2026-01-05 10:00:00" returns the 09:00Z entry, because the value is compared as text, and neither answer says the filter was not understood.
summary_ko: "09:00Z와 11:00Z의 감사 항목이 있다. `filter_since` \"2026-01-05T19:00:00+09:00\"(10:00Z)은 \"No matching entries\"를, \"2026-01-05 10:00:00\"은 09:00Z 항목을 돌려준다. 값을 문자열로 비교하지만 어느 응답도 필터를 이해하지 못했다고 말하지 않는다."
defect_ko: "`filter_since`를 이 서버는 기록의 문자열과 글자로 비교한다. 시각으로 해석하거나, 못 읽으면 알려야 한다. 모델은 기준 뒤의 호출이 없다고, 기준 앞의 호출이 기준 뒤에 있었다고 잘못 안다."
setup_ko: "09:00 UTC의 `hash_file`과 11:00 UTC의 `auth_summary` 감사 기록을 `audit.json`에 넣었다."
fixture:
  - path: audit.json
    root: db
    text: "{\"timestamp\": \"2026-01-05T09:00:00+00:00\", \"tool\": \"hash_file\", \"params\": {\"path\": \"/evidence/a.bin\"}, \"result_summary\": \"## MD5 ...\"}\n{\"timestamp\": \"2026-01-05T11:00:00+00:00\", \"tool\": \"auth_summary\", \"params\": {\"path\": \"/evidence/auth.log\"}, \"result_summary\": \"## Auth summary ...\"}\n"
steps:
  - tool: get_audit_trail
    note_ko: "결함 호출: `+09:00` 오프셋으로 10:00 UTC 이후 요청"
    args:
      filter_since: "2026-01-05T19:00:00+09:00"
  - tool: get_audit_trail
    note_ko: "결함 호출: 공백 구분 형식으로 10:00 이후 요청"
    args:
      filter_since: "2026-01-05 10:00:00"
expect:
  # 11:00Z is after 10:00Z but is dropped
  - step: 1
    note_ko: "11:00 UTC 기록이 있는데 0건이 나온다"
    contains: "No matching entries."
  - step: 1
    note_ko: "그 결과가 오류가 아니라 정상 응답이다"
    is_error: false
  # 09:00Z is before 10:00Z but is kept
  - step: 2
    note_ko: "10:00보다 앞선 09:00 기록이 결과에 섞인다"
    contains: "2026-01-05T09:00:00+00:00"
  - step: 2
    note_ko: "형식을 읽지 못했다는 안내가 없다"
    not_regex: "(?i)invalid|cannot parse|error"
