# Matrix case P2061-018: top_n / top_n_ips / limit have no minimum, so a
# negative value reaches a [:n] slice and silently drops items from the end.
# Shown with auth_failed_logins(top_n=-1).
case_id: P2061-018
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "모델이 '전부'라는 뜻으로 `-1`을 주는 일이 실제로 있다."
coverage: full
summary: auth_failed_logins with top_n=-1 is accepted without error, reports "4 total attempts from 2 unique IPs" but lists only one source IP, because the [:-1] slice drops the last IP with no note.
summary_ko: "`top_n=-1`인 `auth_failed_logins`가 오류 없이 \"4 total attempts from 2 unique IPs\"를 내지만 출발지 IP는 하나만 나열한다. `[:-1]` 슬라이스가 마지막 IP를 말없이 빼기 때문이다."
defect_ko: "음수 `top_n`을 이 서버는 `[:n]` 슬라이스에 그대로 넘겨 뒤쪽 IP를 뺀다. 거부해야 한다. 모델은 공격 IP가 하나뿐이라고 잘못 안다."
setup_ko: "두 IP에서 온 실패 로그인 네 줄이 있는 `auth.log`를 두었다."
fixture:
  - path: var/log/auth.log
    text: |
      Apr 15 10:00:01 web sshd[101]: Failed password for root from 203.0.113.5 port 40001 ssh2
      Apr 15 10:00:02 web sshd[102]: Failed password for root from 203.0.113.5 port 40002 ssh2
      Apr 15 10:00:03 web sshd[103]: Failed password for root from 203.0.113.5 port 40003 ssh2
      Apr 15 10:00:04 web sshd[104]: Failed password for admin from 198.51.100.77 port 40004 ssh2
steps:
  - tool: auth_failed_logins
    note_ko: "결함 호출: `top_n=-1`로 실패 로그인 분석"
    args:
      path: ${EVIDENCE}/var/log/auth.log
      top_n: -1
expect:
  - step: 1
    note_ko: "오류 없이 응답한다"
    is_error: false
  - step: 1
    note_ko: "머리말은 IP 2개라고 한다"
    contains: "4 total attempts from 2 unique IPs"
  - step: 1
    note_ko: "첫 IP는 나열된다"
    contains: "## Source IP: `203.0.113.5`"
  - step: 1
    note_ko: "두 번째 IP `198.51.100.77`은 빠졌다"
    not_contains: "198.51.100.77"
  - step: 1
    note_ko: "빠졌다는 안내나 값 오류가 없다"
    not_regex: "(?i)omitted|truncated|not shown|showing|invalid|must be"
