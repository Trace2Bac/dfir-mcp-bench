# Matrix case P2061-017: strings_extract's min_length and log_search's
# context_lines are passed to strings / grep without range checks. With 0 or
# a negative value the tool's error text comes back, behind "[STDERR]:", as an
# ordinary result.
# The strings step needs GNU binutils strings (the Docker image); macOS
# strings has no -e option, so locally it fails for a different reason.
case_id: P2061-017
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: forced
realism_ko: "외부 도구의 오류 문구가 `[STDERR]` 뒤에 그대로 보여 서버가 실패를 드러내고 있고, `min_length 0`이나 `context_lines -1`을 줄 이유도 적다."
coverage: full
summary: strings_extract with min_length 0 and log_search with context_lines -1 are not rejected; the external tool's usage error comes back after "[STDERR]:" as a normal, non-error result.
summary_ko: "min_length 0인 strings_extract와 context_lines -1인 log_search는 거부되지 않는다. 외부 도구의 사용법 오류가 \"[STDERR]:\" 뒤에 오류 아닌 정상 결과로 돌아온다."
defect_ko: "정상이라면 범위 밖의 값은 서버가 먼저 거부해야 하는데, 이 서버는 외부 도구에 그대로 넘긴다. 다만 도구의 오류 문구가 응답에 보여 모델이 결과로 잘못 알기는 어렵다."
setup_ko: "SSH 로그인 한 줄이 있는 `auth.log`를 두었다."
fixture:
  - path: auth.log
    text: "Apr 12 14:30:04 web01 sshd[2211]: Accepted password for alice from 203.0.113.5 port 51122 ssh2\n"
steps:
  - tool: strings_extract
    note_ko: "결함이 있는 호출: `min_length 0`으로 문자열 추출"
    args:
      path: ${EVIDENCE}/auth.log
      min_length: 0
  - tool: log_search
    note_ko: "결함이 있는 호출: `context_lines -1`로 검색"
    args:
      path: ${EVIDENCE}/auth.log
      pattern: "Accepted"
      context_lines: -1
expect:
  - step: 1
    note_ko: "`strings`의 길이 오류 문구가 결과로 나온다"
    regex: "\\[STDERR\\]: .*(?i:minimum string length)"
  - step: 1
    note_ko: "그 응답이 오류가 아니라 정상으로 왔다"
    is_error: false
  - step: 2
    note_ko: "`grep`의 문맥 길이 오류 문구가 결과로 나온다"
    regex: "\\[STDERR\\]: .*(?i:context)"
  - step: 2
    note_ko: "그 응답이 오류가 아니라 정상으로 왔다"
    is_error: false
