# Matrix case P2061-072: max_events is not range-checked. A negative value
# slices from the end and the "more truncated" count is computed from it.
# get_audit_trail's limit is not checked either: after two build_timeline
# calls (two audit entries), limit 0 returns both and limit -1 drops the
# older one, each labelled "showing last N".
case_id: P2061-072
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "모델이 '전부'라는 뜻으로 `-1`이나 `0`을 주는 일이 실제로 있다."
coverage: "partial: the hidden count in _table is not checked"
coverage_ko: "_table의 숨겨진 수는 검사하지 않는다"
summary: build_timeline with max_events=-1 over three auth events returns two rows and says "4 more events truncated", a count larger than the whole timeline, instead of rejecting the value; get_audit_trail with limit 0 lists every entry and with limit -1 shows only the newest one instead of rejecting the value.
summary_ko: "인증 이벤트 세 개에 `max_events=-1`로 `build_timeline`을 부르면 두 행을 돌려주고 \"4 more events truncated\"라고 한다. 타임라인 전체보다 큰 수다. `get_audit_trail`은 `limit` 0이면 모든 항목을, -1이면 가장 최근 항목 하나만 보여 준다."
defect_ko: "음수나 0인 상한을 이 서버는 슬라이스에 그대로 넘겨 행을 말없이 빼고, 잘린 수도 틀리게 센다. 이런 값은 거부해야 한다. 모델은 타임라인이 실제보다 크다고, 감사 기록이 실제보다 적다고 잘못 안다."
setup_ko: "실패 두 줄과 성공 한 줄이 있는 `auth.log`를 두었다."
fixture:
  - path: case/auth.log
    text: |
      Apr 12 14:30:00 web sshd[811]: Failed password for root from 203.0.113.7 port 50020 ssh2
      Apr 12 14:30:05 web sshd[812]: Failed password for root from 203.0.113.7 port 50021 ssh2
      Apr 12 14:30:10 web sshd[813]: Accepted password for root from 203.0.113.7 port 50022 ssh2
steps:
  - tool: build_timeline
    note_ko: "결함 호출: `max_events=-1`로 타임라인"
    args:
      evidence_root: ${EVIDENCE}/case
      max_events: -1
  - tool: build_timeline
    note_ko: "준비: 감사 기록을 두 건으로 만듦"
    args:
      evidence_root: ${EVIDENCE}/case
  - tool: get_audit_trail
    note_ko: "결함 호출: `limit 0`으로 감사 기록 조회"
    args:
      limit: 0
  - tool: get_audit_trail
    note_ko: "결함 호출: `limit -1`로 감사 기록 조회"
    args:
      limit: -1
expect:
  - step: 1
    note_ko: "타임라인에는 이벤트가 3개다"
    contains: "**Events:** 3"
  - step: 1
    note_ko: "그런데 4개가 더 잘렸다고 한다"
    contains: "4 more events truncated"
  - step: 3
    note_ko: "`limit 0`인데 모든 기록이 나온다"
    contains: "(2 matching entries, showing last 2)"
  - step: 4
    note_ko: "`limit -1`이면 오래된 기록 하나를 말없이 뺀다"
    contains: "(2 matching entries, showing last 1)"
