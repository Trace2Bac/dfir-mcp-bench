# Matrix case P2061-016: hexdump passes a negative offset straight to
# `xxd -s`, which reads relative to the end of the file.
case_id: P2061-016
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: forced
realism_ko: "응답의 주소 열이 실제로 읽은 위치 0x20을 그대로 보여 모델이 잘못 알 것이 없고, 음수 `offset`을 줄 이유도 적다."
coverage: full
summary: hexdump with offset=-16 on a 48-byte file is not rejected; xxd seeks from the end and returns the last 16 bytes at position 0x20, a region the caller did not ask for.
summary_ko: "48바이트 파일에 offset=-16으로 hexdump를 부르면 거부되지 않는다. xxd가 파일 끝에서부터 찾아가 위치 0x20의 마지막 16바이트를 돌려준다. 호출자가 요청하지 않은 영역이다."
defect_ko: "정상이라면 음수 `offset`은 거부해야 하는데, 이 서버는 그대로 `xxd -s`에 넘겨 파일 끝 기준으로 읽는다. 다만 응답에 실제 위치가 찍혀 결과를 잘못 해석하기는 어렵다."
setup_ko: "앞 32바이트는 `A`, 끝 16바이트는 `TAIL`인 48바이트 파일을 두었다."
fixture:
  - path: bin/sample.bin
    # 32 x "A" + "TAILTAILTAILTAIL"
    text: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAATAILTAILTAILTAIL"
steps:
  - tool: hexdump
    note_ko: "결함이 있는 호출: `offset=-16`으로 hexdump"
    args:
      path: ${EVIDENCE}/bin/sample.bin
      offset: -16
      length: 16
expect:
  - step: 1
    note_ko: "출력이 위치 0x20부터 시작한다"
    regex: "^00000020: "
  - step: 1
    note_ko: "파일 끝 16바이트가 나온다"
    contains: "TAILTAILTAILTAIL"
  - step: 1
    note_ko: "음수 값에 대한 오류가 없다"
    not_regex: "(?i)error|invalid|negative"
