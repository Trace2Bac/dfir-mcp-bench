# Matrix case P2061-071: hexdump says length is at most 4096 bytes, but
# min(length, 4096) keeps a negative value, and xxd -l with a negative length
# dumps to the end of the file. The fixture is 4,200 bytes; offset 0x1060
# (4,192) is past the promised maximum.
case_id: P2061-071
problem: P2061
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "모델이 '끝까지'라는 뜻으로 `length -1`을 주는 일은 실제로 있다. 다만 응답 내용 자체는 정확하고 해는 출력 크기에 있다."
coverage: full
summary: hexdump with length -1 on a 4,200-byte file dumps the whole file up to offset 0x1060, past the 4,096-byte maximum in its definition, instead of rejecting the negative length.
summary_ko: "4,200바이트 파일에 `length -1`로 `hexdump`를 부르면 음수를 거부하지 않는다. 정의의 최대 4,096바이트를 넘어 오프셋 0x1060까지 파일 전체를 덤프한다."
defect_ko: "음수 `length`를 이 서버는 그대로 `xxd -l`에 넘겨 파일 끝까지 출력한다. 음수는 거부하고 출력은 최대 4,096바이트를 넘지 않아야 한다. 큰 파일이면 응답이 맥락을 넘칠 만큼 커진다."
setup_ko: "4,200바이트 파일 하나를 두었다."
fixture:
  - path: blob.bin
    text: ""
steps:
  - tool: hexdump
    note_ko: "결함 호출: `length -1`로 hexdump"
    args:
      path: ${EVIDENCE}/blob.bin
      length: -1
expect:
  - step: 1
    note_ko: "4,096바이트 한도를 넘는 위치 0x1060까지 출력된다"
    contains: "00001060: 4141"
  - step: 1
    note_ko: "음수 값에 대한 오류가 없다"
    not_regex: "(?i)error|invalid|negative"
