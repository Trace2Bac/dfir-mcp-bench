steps:
  - tool: read_mail
    note_ko: "결함 호출: 추출한 메일 폴더의 메일을 본문과 함께 읽는다"
    args:
      mail_path: ${DB_DIR}/exports/mail/jhpark
expect:
  - step: 1
    note_ko: "EUC-KR 본문은 대체 문자 덩어리가 되고 ASCII 숫자만 남는다"
    regex: '"body":\s*"\\ufffd[^"]*\\ufffd 0815 \\ufffd'
  - step: 1
    note_ko: "같은 메일의 EUC-KR 제목(\"3분기 고객 명단\")은 제대로 풀려 있다"
    regex: '"subject":\s*"3\\ubd84\\uae30 \\uace0\\uac1d \\uba85\\ub2e8"'
  - step: 1
    note_ko: "HTML만 있는 피싱 메일은 본문이 빈 문자열이다"
    regex: '"subject":\s*"Mailbox storage full - action required",\s*"body":\s*""'
