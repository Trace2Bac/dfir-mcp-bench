# Matrix case P4192-023: the shared run() decodes every wrapped tool's stdout
# with decode("utf-8", errors="replace"). tsk_blkcat ("Extract raw content of
# a specific data block") passes blkcat's raw bytes through it, so every byte
# that is not valid UTF-8 becomes U+FFFD (E9 A5 -> one U+FFFD), with no hex
# and no note, and the block cannot be rebuilt from the response.
# Evidence: a 4 MiB FAT12 USB image (mkfs.vfat, mtools) with notes.txt and a
# deleted customers_2024Q3.zip (1,791 bytes, sectors 24-27). Only its first
# 14,336 bytes are non-zero; the rest is written sparse.
# trudi runs TSK as `sudo blkcat ...` (SIFT has passwordless sudo); the
# image has no sudo, so ${STUBS}/sudo only runs the command it is given.
# blkcat and istat are the real ones.
case_id: P4192-023
problem: P4192
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: source-vs-result
level: mcp
realism: common
realism_ko: "지워진 파일의 섹터를 istat로 찾아 blkcat로 내용을 보는 것은 흔한 절차이고, 압축 파일·실행 파일 같은 이진 파일의 블록은 대부분 UTF-8이 아니다."
coverage: "partial: tsk_blkcat only; tsk_mmcat and tsk_jcat (same run() path) are not run"
coverage_ko: "tsk_blkcat만 보였다. 같은 경로를 쓰는 tsk_mmcat·tsk_jcat은 실행하지 않았다."
summary: tsk_blkcat on the first sector of a deleted ZIP on a FAT12 USB image returns its 512 bytes as text in which the 254 bytes that are not UTF-8 are replaced by U+FFFD (E9 A5 7B becomes U+FFFD {), with success true, no hex and no note that bytes were replaced.
summary_ko: "FAT12 USB 이미지에서 지워진 ZIP의 첫 섹터를 tsk_blkcat으로 보면, 512바이트 가운데 UTF-8이 아닌 254바이트가 U+FFFD로 바뀐 글이 성공 응답으로 온다(E9 A5 7B가 U+FFFD {가 된다). hex도, 바이트를 바꿨다는 표시도 없다."
defect_ko: "이 서버는 blkcat이 낸 원시 바이트를 UTF-8로 풀며 풀리지 않는 바이트를 U+FFFD로 바꿔 싣는다. 정상이라면 hex나 base64로 주거나 파일로 저장하고 바이트를 바꿨다고 알려야 한다. 모델은 U+FFFD가 보여 바이트가 바뀐 것은 짐작할 수 있어도, 원래 바이트(ZIP의 CRC·압축 데이터)는 되살릴 수 없다."
setup_ko: "USB 메모리 이미지(FAT12)에 notes.txt와, 지워진 customers_2024Q3.zip(섹터 24-27)을 넣었다."
env:
  PATH: ${STUBS}:${PATH}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # First 28 sectors of the image (boot sector, both FATs, root directory,
  # notes.txt and the deleted ZIP); the image is 4,194,304 bytes.
  - path: usb/USBDRIVE.dd
    size: 4194304
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4192-023
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: tsk_istat
    note_ko: "비교 호출: 지워진 ZIP(항목 7)이 있던 섹터를 확인한다"
    args:
      image: ${EVIDENCE}/usb/USBDRIVE.dd
      inode: 7
  - tool: tsk_blkcat
    note_ko: "결함 호출: 그 첫 섹터 24의 내용을 본다"
    args:
      image: ${EVIDENCE}/usb/USBDRIVE.dd
      block_number: 24
expect:
  - step: 2
    note_ko: "지워진 ZIP(1,791바이트, 짧은 이름 _USTOM~1.ZIP)은 섹터 24-27에 있다"
    regex: 'Size: 1791\\nName: _USTOM~1\.ZIP[\s\S]*Sectors:\\n24 25 26 27'
  - step: 3
    note_ko: "blkcat은 성공으로 끝났다"
    regex: '"success":\s*true'
  - step: 3
    note_ko: "ZIP 머리의 E9 A5 두 바이트가 U+FFFD 하나로 바뀌어 있다(원래 PK 03 04 14 00 00 00 08 00 E9 A5 7B 5D)"
    regex: 'PK\\u0003\\u0004\\u0014\\u0000\\u0000\\u0000\\b\\u0000\\ufffd\{\]uW'
