# Matrix case P4192-026: parse_scheduled_tasks tries raw.decode("utf-16")
# first, with no BOM check. Python's utf-16 codec without a BOM decodes as
# little-endian, so any ASCII/UTF-8 task XML of even length decodes with no
# error into CJK-looking text. The task's content comes back unreadable, the
# injector regex (-nop / -w hidden / -enc) no longer matches, and the
# response does not say which encoding was used.
# The same task XML is given twice: as Task Scheduler stores it (UTF-16LE
# with BOM) and as PowerShell 7 writes it with Export-ScheduledTask |
# Out-File (UTF-8 without BOM, CRLF; 1,130 bytes).
case_id: P4192-026
problem: P4192
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: source-vs-result
level: mcp
realism: possible
realism_ko: "현장 수집 스크립트가 PowerShell 7의 Export-ScheduledTask | Out-File로 작업 XML을 내보내면 BOM 없는 UTF-8이 되고, 그런 파일의 절반쯤은 길이가 짝수다."
coverage: full
summary: The same hidden-PowerShell task is flagged as an injector payload when stored as UTF-16LE with BOM, but as BOM-less UTF-8 (1,130 bytes) parse_scheduled_tasks returns its content as CJK-looking text decoded as UTF-16, with no injector flag and no note on the encoding.
summary_ko: "숨은 PowerShell을 실행하는 같은 작업이 BOM 있는 UTF-16LE일 때는 injector payload로 잡히지만, BOM 없는 UTF-8(1,130바이트)일 때 parse_scheduled_tasks는 UTF-16으로 잘못 풀어 한자처럼 보이는 content를 돌려주고, 표시도 인코딩 안내도 없다."
defect_ko: "이 서버는 BOM을 보지 않고 먼저 UTF-16으로 풀어, 길이가 짝수인 UTF-8 작업 파일을 오류 없이 깨진 글로 바꾼다. 정상이라면 BOM과 XML 선언을 보고 UTF-8로 풀거나 어떤 인코딩으로 풀었는지 알려야 한다. 모델은 작업 내용(실행 명령)을 읽을 수 없고, 숨은 PowerShell 작업이 없다고 잘못 안다."
setup_ko: "로그온 때 `powershell.exe -nop -w hidden -enc ...`를 실행하는 숨은 작업 XML을 두 폴더에 넣었다. 한 폴더는 작업 스케줄러가 저장하는 UTF-16LE(BOM 있음), 다른 폴더는 PowerShell 7로 내보낸 BOM 없는 UTF-8이다."
fixture:
  # Task Scheduler's own form: UTF-16LE with BOM, encoding="UTF-16".
  - path: C/Windows/System32/Tasks/OneDriveSyncHealthTasks
    base64: 
  # The same XML exported with PowerShell 7 (Out-File: UTF-8, no BOM, CRLF).
  - path: triage/tasks_export/OneDriveSyncHealthTasks.xml
    base64: 
steps:
  - tool: misc_parse_scheduled_tasks
    note_ko: "비교 호출: UTF-16LE로 저장된 작업 폴더를 읽는다"
    args:
      tasks_dir: ${EVIDENCE}/C/Windows/System32/Tasks
  - tool: misc_parse_scheduled_tasks
    note_ko: "결함 호출: BOM 없는 UTF-8로 내보낸 작업 폴더를 읽는다"
    args:
      tasks_dir: ${EVIDENCE}/triage/tasks_export
expect:
  - step: 1
    note_ko: "UTF-16LE 작업은 내용이 읽히고 injector payload로 잡힌다"
    regex: '"injector_payload_tasks":\s*\["/OneDriveSyncHealthTasks"\][\s\S]*-nop -w hidden -enc'
  - step: 2
    note_ko: "같은 작업을 UTF-8로 두면 잡히지 않는다"
    regex: '"injector_payload_tasks":\s*\[\]'
  - step: 2
    note_ko: "content는 UTF-16으로 잘못 풀린 한자 모양 글이다('<?xml'이 '㼼浸'이 된다)"
    regex: '"content":\s*"\\u3f3c\\u6d78'
  - step: 2
    note_ko: "오류로 처리되지도 않는다"
    regex: '"errors":\s*\[\]'
