steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: psreadline-history
  - tool: run_strings
    note_ko: "준비: 기록 파일 적재"
    args:
      target_path: ${EVIDENCE}/C/Users/jlee/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt
  - tool: get_raw_output
    note_ko: "결함 호출: 적재 응답이 안내한 이름으로 원문 전체 읽기"
    args:
      source_name: strings.output
expect:
  - step: 2
    note_ko: "151줄이 window 6개로 적재된다"
    regex: '"line_count": 151,\s*"windows_indexed": 6'
  - step: 3
    note_ko: "한 번에 window 6개를 모두 받는다"
    regex: '"total_windows": 6,\s*"returned_windows": 6,[^}]*"has_more": false'
  - step: 3
    note_ko: "빈 줄이 없는 기록인데 명령 사이에 빈 줄이 생긴다"
    regex: 'gpupdate /force \}\\n\\npowershell\.exe -NoP -W Hidden'
  - step: 3
    note_ko: "`-EncodedCommand` 한 줄의 base64 가운데에 줄바꿈이 들어간다"
    regex: '-EncodedCommand JAB[A-Za-z0-9+/]*\\n[A-Za-z0-9+/]+'
