# Matrix case P4192-011: get_raw_output joins the windows of a source with
# "\n".join (core.py 899), but every window already ends with the line break
# it was cut after (extract_helpers.py 132-149, splitlines(keepends=True)).
# Each window boundary therefore gains an empty line the output never had,
# and a line longer than the 4,096-character window budget, cut into pieces
# when it was indexed, comes back with a line break inside it. Nothing in the
# response says raw_text was changed.
#
# The evidence is a PSReadLine history (ConsoleHost_history.txt, one command
# per line, no blank lines) with an admin's routine commands and one
# Cobalt Strike style "powershell -EncodedCommand" line of 10,291 characters.
case_id: P4192-011
problem: P4192
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: source-vs-result
level: mcp
realism: common
realism_ko: "PowerShell 기록·명령줄·로그처럼 한 source가 window 여러 개가 되는 것은 흔하고, 인코딩된 PowerShell 명령은 수천~수만 자 한 줄인 경우가 많다. 원문 전체를 읽으려고 `get_raw_output`을 부르는 것은 도구 설명이 권하는 기본 사용법이다."
coverage: full
summary: >-
  get_raw_output on the strings of a PSReadLine history (151 lines, no blank
  line) returns a raw_text with three empty lines that are not in the file,
  one at each window boundary, and with two line breaks inside the
  10,291-character -EncodedCommand line, where it was cut into windows; the
  response says nothing about the change.
summary_ko: "빈 줄이 없는 PSReadLine 기록(151줄)의 strings를 `get_raw_output`으로 읽으면, `raw_text`에는 window 경계마다 파일에 없는 빈 줄이 3개 생기고 10,291자짜리 `-EncodedCommand` 한 줄은 window로 잘린 두 곳에 줄바꿈이 들어간다. 응답은 원문을 바꿨다고 알리지 않는다."
defect_ko: "이 서버는 이미 줄 끝을 가진 window들을 다시 줄바꿈으로 이어, 원문에 없는 빈 줄과 긴 줄 안의 줄바꿈을 넣은 채 원문처럼 돌려준다. 정상이라면 window를 그대로 이어(`\"\".join`) 원래 출력과 같은 글을 돌려주거나, 바꿨다면 그 사실을 알려야 한다. 모델은 인코딩된 명령이 여러 줄로 나뉜 것으로 보거나 잘린 조각을 그대로 옮겨 적어, 명령줄·해시·길이를 틀리게 보고한다."
setup_ko: "관리 명령 150줄 사이에 Cobalt Strike 방식의 `powershell -EncodedCommand` 한 줄(10,291자)이 든 사용자 `ConsoleHost_history.txt`를 `run_strings`로 적재했다."
