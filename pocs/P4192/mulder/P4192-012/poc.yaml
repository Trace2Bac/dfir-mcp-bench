# Matrix case P4192-012 (run_tcpflow part): run_tcpflow reads each
# reassembled stream with read_text(encoding="utf-8", errors="replace")
# (misc.py 1116-1121), so every byte that is not UTF-8 becomes U+FFFD before
# the stream is indexed and returned, and nothing says so. Here the stream is
# a phishing page served as EUC-KR (Content-Type: text/html;
# charset=euc-kr), as Korean sites commonly still are: every Korean
# character of its title and text comes back as replacement characters (a
# few byte pairs that happen to be valid UTF-8 become other letters, such as
# U+01AE and U+0233), and the original bytes cannot be recovered from the
# case. read_text also turns the stream's CRLF line ends into LF.
#
# The capture (written for this PoC, real pcap format) is one HTTP GET from
# ws0142 to 203.0.113.7 for /kb/notice.html.
case_id: P4192-012
problem: P4192
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: source-vs-result
level: mcp
realism: common
realism_ko: "국내 웹 페이지·메일·로그에는 EUC-KR(CP949) 글이 여전히 흔하고, 피싱·악성 코드 배포 페이지도 그렇다. 캡처의 HTTP 내용을 보려고 `run_tcpflow`를 돌리는 것은 기본 분석이다."
coverage: "partial: run_tcpflow only; extract_file_by_inode and extract_steganography, which decode the same way, are not run"
coverage_ko: "`run_tcpflow`만 확인했다. 같은 방식으로 디코딩하는 `extract_file_by_inode`·`extract_steganography`는 돌리지 않았다."
summary: >-
  run_tcpflow on an HTTP capture of a phishing page served as EUC-KR indexes
  the server's stream with every Korean character replaced by U+FFFD:
  get_raw_output('tcpflow.streams') shows "Content-Type: text/html;
  charset=euc-kr" followed by a title and text made of replacement
  characters and a few wrong letters, with no mark that bytes were
  replaced.
summary_ko: "EUC-KR로 내려온 피싱 페이지의 HTTP 캡처에 `run_tcpflow`를 돌리면 서버 쪽 stream의 한글이 모두 U+FFFD로 바뀐 채 적재된다. `get_raw_output('tcpflow.streams')`에는 `Content-Type: text/html; charset=euc-kr` 뒤에 대체 문자와 엉뚱한 글자(Ʈ·ȳ)로 된 제목·본문이 나오고, 바이트를 바꿨다는 표시는 없다."
defect_ko: "이 서버는 재조립한 TCP stream을 UTF-8로 억지로 디코딩해, UTF-8이 아닌 바이트를 U+FFFD로 바꾼 채 적재·반환하고 그 사실과 원래 인코딩을 알리지 않는다. 정상이라면 원래 바이트를 보존(예: 16진수·base64)하거나 선언된 문자셋으로 디코딩하고, 바꿨다면 표시해야 한다. 모델은 피싱 문구(계정·비밀번호 재입력 요구)를 읽지 못하고, 깨진 글을 바이너리나 암호화된 내용으로 잘못 본다."
setup_ko: "워크스테이션 ws0142가 203.0.113.7에서 `/kb/notice.html`을 받는 HTTP 캡처를 두었다. 응답은 `charset=euc-kr`로 선언된 \"보안 업데이트 안내\" 피싱 페이지로, 보안 모듈 설치와 메일 계정·비밀번호 재입력을 요구한다."
