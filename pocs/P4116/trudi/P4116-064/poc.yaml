# Matrix case P4116-064: af_timestomp_drift reports any MFTECmd row whose $SI
# LastModified differs from its $FN LastModified by more than 1 s as a strong
# timestomp indicator and suggests a LIKELY T1070.006 finding. Windows updates
# the $SI times on every content write but leaves the $FN times as they were at
# creation (or the last rename/move), so every file edited after it was created
# has $SI LastModified later than $FN LastModified. That is normal; the
# timestomp shape is $SI earlier than $FN (MFTECmd's own SI<FN column).
# The CSV has MFTECmd's own column layout. Three ordinary files were edited
# after creation (a Word document, a spreadsheet, the user's NTUSER.DAT); one
# was never edited. MFTECmd marks none of them SI<FN or uSecZeros.
case_id: P4116-064
problem: P4116
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "만든 뒤 내용을 고친 파일은 $SI 수정 시각만 바뀌고 $FN 수정 시각은 그대로라, 어느 MFT에나 이런 행이 대부분이다."
coverage: full
summary: On an MFTECmd CSV of four ordinary files, three of them simply edited after creation (none marked SI<FN), af_timestomp_drift returns drift_count 3 and a suggested LIKELY finding "Timestomp evidence ... (T1070.006)", because a $SI LastModified later than $FN LastModified is what every edit produces.
summary_ko: "평범한 파일 넷(그중 셋은 만든 뒤 내용만 고친 파일, SI<FN 표시 없음)이 든 MFTECmd CSV에서 `af_timestomp_drift`가 `drift_count: 3`과 `LIKELY` 등급의 \"Timestomp evidence … (T1070.006)\" 발견 제안을 낸다. $SI 수정 시각이 $FN보다 늦은 것은 파일을 고치기만 해도 생기는 정상 상태다."
defect_ko: "이 서버는 $SI와 $FN의 수정 시각이 1초 넘게 다르기만 하면 timestomp의 강한 지표로 보고 LIKELY 발견을 제안한다. 정상이라면 내용 수정으로 생기는 차이($SI가 더 늦음)는 빼고, $SI가 $FN보다 앞서는 경우처럼 시각 조작의 모양만 지표로 내야 한다. 모델은 평범하게 고친 문서들을 시각이 조작된 파일로 잘못 안다."
setup_ko: "MFTECmd CSV 형식으로 파일 넷을 넣었다. `report_q3.docx`·`budget_2024.xlsx`·`NTUSER.DAT`는 만든 뒤 내용을 고친 파일이고, `readme.txt`는 고친 적 없는 파일이다. MFTECmd의 `SI<FN`·`uSecZeros` 열은 모두 False다."
