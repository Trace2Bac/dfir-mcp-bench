# Matrix case P4116-069: misc_parse_scheduled_tasks marks a task as a
# keystroke-injector payload (injector_payload: true) when its XML matches
# INJECTOR_PAYLOAD_RE, which besides the Rubber Ducky / Bash Bunny markers
# also matches the bare switches -NoProfile, -nop and -WindowStyle Hidden.
# Those switches are in ordinary admin tasks, so routine tasks are reported as
# BadUSB payload traces.
# The Tasks folder holds three task XML files as Windows writes them (UTF-16LE
# with BOM, CRLF, Task 1.2 schema): an IT backup script run with
# "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ...", the task that
# PowerShell's Register-ScheduledJob creates (its action is always
# "powershell.exe -NoLogo -NonInteractive -WindowStyle Hidden -Command
# Import-Module PSScheduledJob; ..."), and the per-user OneDrive updater task.
# None has a Ducky/Bunny/Hak5 marker, an encoded command or FromBase64String.
case_id: P4116-069
problem: P4116
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "관리용 PowerShell 작업은 흔히 `-NoProfile`로 돌리고, `Register-ScheduledJob`이 만드는 작업은 항상 `-WindowStyle Hidden`을 단다."
coverage: full
summary: On a Tasks folder with an IT backup task (powershell -NoProfile -ExecutionPolicy Bypass -File) and a PowerShell scheduled job (powershell -NoLogo -NonInteractive -WindowStyle Hidden -Command Import-Module PSScheduledJob), misc_parse_scheduled_tasks marks both as injector_payload and reports "2 with injector-payload signatures", though neither has any keystroke-injector marker.
summary_ko: "IT 백업 작업(`powershell -NoProfile -ExecutionPolicy Bypass -File`)과 PowerShell 예약 작업(`-WindowStyle Hidden -Command Import-Module PSScheduledJob`)이 든 Tasks 폴더에서, `misc_parse_scheduled_tasks`는 둘 다 `injector_payload: true`로 표시하고 \"2 with injector-payload signatures\"라고 낸다. 두 작업에는 키 입력 주입 장치의 흔적이 하나도 없다."
defect_ko: "이 서버는 `-NoProfile`·`-nop`·`-WindowStyle Hidden` 스위치 하나만 있어도 그 작업을 키 입력 주입 장치(BadUSB) payload로 표시한다. 정상이라면 `%duck%`·Hak5 표식이나 인코딩된 명령처럼 주입 payload에 고유한 흔적이 있을 때만 표시하고, 흔한 스위치는 지표로 쓰지 않아야 한다. 모델은 평범한 관리 작업을 BadUSB가 심은 지속성 흔적으로 잘못 안다."
setup_ko: "Windows가 쓰는 형식(UTF-16LE, Task 1.2 XML) 그대로 예약 작업 셋을 넣었다. IT 부서의 야간 백업 스크립트 작업, `Register-ScheduledJob`이 만든 `UpdateHelp` 작업, 사용자별 OneDrive 업데이트 작업이다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: C/Windows/System32/Tasks/CorpIT/Nightly-UserData-Backup
    base64: 
  - path: C/Windows/System32/Tasks/Microsoft/Windows/PowerShell/ScheduledJobs/UpdateHelp
    base64: 
  - path: C/Windows/System32/Tasks/OneDrive Standalone Update Task-S-1-5-21-3623811015-3361044348-30300820-1013
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4116-069
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: misc_parse_scheduled_tasks
    note_ko: "결함 호출: 디스크의 예약 작업 XML을 읽고 주입 payload 흔적을 찾음"
    args:
      tasks_dir: ${EVIDENCE}/C/Windows/System32/Tasks
expect:
  - step: 2
    note_ko: "세 작업을 모두 읽었다"
    contains: '"task_count": 3'
  - step: 2
    note_ko: "-NoProfile만 있는 백업 작업이 주입 payload 작업으로 나온다"
    regex: '"injector_payload_tasks": \[[^\]]*Nightly-UserData-Backup'
  - step: 2
    note_ko: "Register-ScheduledJob이 만든 작업도 주입 payload 작업으로 나온다"
    regex: '"injector_payload_tasks": \[[^\]]*ScheduledJobs[^\]]*UpdateHelp'
  - step: 2
    note_ko: "두 관리 작업이 주입 payload 작업 목록의 전부이고, OneDrive 작업은 빠진다"
    contains: '"injector_payload_tasks": ["/CorpIT/Nightly-UserData-Backup", "/Microsoft/Windows/PowerShell/ScheduledJobs/UpdateHelp"]'
