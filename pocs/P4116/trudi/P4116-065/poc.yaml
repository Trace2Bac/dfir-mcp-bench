# Matrix case P4116-065: af_usn_gaps reports every step of more than 100
# between consecutive USN values as journal pruning ("USN journal pruning
# detected", SUSPECTED, T1070). A USN is the byte offset of the record in
# $UsnJrnl:$J, so consecutive records differ by the record length: a
# USN_RECORD_V2 is 60 bytes plus the UTF-16 file name, rounded up to 8. Any
# file name longer than 20 characters makes the next USN more than 100 higher
# with nothing removed.
# The CSV is a Velociraptor Windows.Forensics.Usn result exported as CSV (its
# columns, with Usn), the one documented-looking source that carries a Usn
# column; misc_usnparser_parse's CSV has none. The 15 records are contiguous:
# each Usn is the previous one plus the previous record's length. Word saving
# a document (three DATA_OVERWRITE records, a ~WRL temp file created and
# deleted, three more), a Windows Search package file and a spreadsheet.
case_id: P4116-065
problem: P4116
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: possible
realism_ko: "Velociraptor 오프라인 수집기의 USN 결과는 Usn 열이 있는 CSV로 받는 일이 흔하고, 이름이 20자를 넘는 파일은 어느 볼륨에나 많다."
coverage: full
summary: On 15 contiguous USN records (each USN is the previous one plus the previous record's length), af_usn_gaps returns 9 gaps over 100 and a suggested finding "USN journal pruning detected", because USNs are byte offsets and any record with a file name over 20 characters is longer than 100 bytes.
summary_ko: "빠진 레코드 없이 이어진 USN 레코드 15개(각 USN = 앞 USN + 앞 레코드 길이)에서 `af_usn_gaps`가 100 넘는 간격 9개와 \"USN journal pruning detected\" 발견 제안을 낸다. USN은 바이트 오프셋이라 파일 이름이 20자를 넘는 레코드 다음은 늘 100 넘게 벌어진다."
defect_ko: "이 서버는 이웃한 USN 값 차이가 100을 넘으면 저널이 일부 지워졌다고 본다. USN은 레코드의 바이트 위치라서, 정상이라면 앞 레코드의 길이(60바이트 + 파일 이름)만큼의 차이는 빼고 그보다 큰 빈 구간만 간격으로 내야 한다. 모델은 정상 저널을 공격자가 레코드를 지운 흔적(T1070)으로 잘못 안다."
setup_ko: "Velociraptor `Windows.Forensics.Usn` 결과를 CSV로 내보낸 형식으로, 빠진 것 없이 이어진 USN 레코드 15개를 넣었다. Word가 문서를 저장하는 과정(임시 파일 `~WRL0003.tmp` 생성·삭제 포함)과 검색 패키지 파일, 스프레드시트 수정이다."
