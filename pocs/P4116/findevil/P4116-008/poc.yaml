# Matrix case P4116-008: _parse_sshd_config keeps the LAST value of each
# keyword, but OpenSSH uses the FIRST value it reads (sshd_config(5): "the
# first obtained value will be used"). It also ignores Match blocks, so a
# per-user override is read as the global setting.
# Step 2: Include is not followed. Ubuntu's default sshd_config starts with
# "Include /etc/ssh/sshd_config.d/*.conf", and cloud images ship
# 50-cloud-init.conf with "PasswordAuthentication yes"; that first value is
# the effective one, but the tool reads only the main file's later "no".
case_id: P4116-008
problem: P4116
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "`Match` 블록과 Ubuntu 클라우드 이미지의 `Include`된 `50-cloud-init.conf`는 흔하다."
coverage: "partial: case sensitivity is not checked"
coverage_ko: "대소문자 구분은 검사하지 않는다"
summary: An sshd_config that sets PasswordAuthentication no first and only re-enables it inside a "Match User backup" block is flagged as "PasswordAuthentication yes" and listed with yes as the effective value, although sshd uses no for every other user; and a config whose Include'd 50-cloud-init.conf enables password login is reported clean with PasswordAuthentication no.
summary_ko: "먼저 PasswordAuthentication no를 설정하고 \"Match User backup\" 블록 안에서만 다시 켜는 sshd_config가 \"PasswordAuthentication yes\"로 표시되고 실제 값도 yes로 나열된다. sshd는 다른 모든 사용자에게 no를 쓴다. 또 Include된 50-cloud-init.conf가 비밀번호 로그인을 켜는 설정은 PasswordAuthentication no로 깨끗하다고 보고된다."
defect_ko: "정상이라면 OpenSSH처럼 첫 값을 쓰고 `Match`·`Include`를 반영해 유효 설정을 판정해야 하는데, 이 서버는 마지막 값을 쓰고 둘 다 무시한다. 그래서 모델은 전역 비밀번호 로그인을 켜진 것으로, 실제로 켜진 호스트는 꺼진 것으로 잘못 안다."
setup_ko: "`Match User backup` 안에서만 비밀번호를 켜는 sshd_config와, `Include`된 파일에서 비밀번호를 켜는 sshd_config를 따로 넣었다."
fixture:
  - path: etc/ssh/sshd_config
    text: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes

      Match User backup
          PasswordAuthentication yes
  - path: host2/etc/ssh/sshd_config
    text: |
      Include /etc/ssh/sshd_config.d/*.conf
      PermitRootLogin no
      PasswordAuthentication no
  - path: host2/etc/ssh/sshd_config.d/50-cloud-init.conf
    text: "PasswordAuthentication yes\n"
steps:
  - tool: analyze_sshd_config
    note_ko: "결함이 있는 호출: `Match` 블록이 있는 설정"
    args:
      path: ${EVIDENCE}/etc/ssh/sshd_config
  - tool: analyze_sshd_config
    note_ko: "결함이 있는 호출: `Include`가 있는 설정"
    args:
      path: ${EVIDENCE}/host2/etc/ssh/sshd_config
expect:
  - step: 1
    note_ko: "`PasswordAuthentication yes`가 위험 설정으로 표시된다"
    contains: "⚠ **PasswordAuthentication yes**"
  - step: 1
    note_ko: "유효 값이 `yes`로 나열된다"
    contains: "- `PasswordAuthentication`: `yes`"
  # the Match block is not reported as a condition
  - step: 1
    note_ko: "`Match` 조건부 설정이라는 말이 없다"
    not_regex: "(?i)match block|only for|conditional"
  - step: 2
    note_ko: "실제로 비밀번호 로그인이 켜진 설정을 위험 없음으로 답한다"
    contains: "No dangerous settings detected."
  - step: 2
    note_ko: "유효 값이 `no`로 나열된다"
    contains: "- `PasswordAuthentication`: `no`"
