# Matrix case P4116-010: the "non-RFC1918 IP in config" rule in
# _SUSPICIOUS_CMD_PATTERNS only matches IPv4-shaped values starting with 185,
# 45, 91 or 194. Other public IPs are not flagged, and a version string of the
# same shape is.
case_id: P4116-010
problem: P4116
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "공인 IP와 통신하는 cron 작업은 흔하지만, 45로 시작하는 네 마디 버전 문자열은 드물다."
coverage: full
summary: find_persistence flags a cron job whose only "IP" is the version string 45.10.2.1 as high with "non-RFC1918 IP in config", but leaves a cron job that talks to the public IP 203.0.113.7 unflagged, so the label does not describe what the rule matches.
summary_ko: "`find_persistence`는 IP라고는 버전 문자열 45.10.2.1뿐인 cron 작업을 \"non-RFC1918 IP in config\"로 high 표시한다. 정작 공인 IP 203.0.113.7과 통신하는 cron 작업은 표시하지 않는다."
defect_ko: "`non-RFC1918 IP in config` 규칙은 185·45·91·194로 시작하는 값만 잡는다. 이름대로라면 공인 IP를 모두 잡아야 한다. 모델은 다른 공인 IP와 통신하는 작업은 정상으로, 버전 문자열은 공인 IP로 잘못 안다."
setup_ko: "버전 `45.10.2.1`을 인자로 쓰는 cron 작업과 공인 IP `203.0.113.7`과 통신하는 cron 작업을 넣었다."
fixture:
  - path: fs/etc/cron.d/app-upgrade
    text: "0 3 * * * root /opt/app/bin/upgrade --to-version 45.10.2.1\n"
  - path: fs/etc/cron.d/peer-sync
    text: "*/5 * * * * root /usr/local/bin/sync-agent --peer 203.0.113.7 --port 9000\n"
steps:
  - tool: find_persistence
    note_ko: "결함 호출: 지속성 검사"
    args:
      root_path: ${EVIDENCE}/fs
expect:
  - step: 1
    note_ko: "버전 문자열만 있는 작업이 `non-RFC1918 IP`로 표시된다"
    regex: "### `etc/cron\\.d/app-upgrade` — Suspicious cron entry\\n- \\*\\*Category:\\*\\* cron\\n- \\*\\*Reasons:\\*\\*\\n  - non-RFC1918 IP in config"
  - step: 1
    note_ko: "공인 IP와 통신하는 작업은 표시되지 않는다"
    not_contains: "### `etc/cron.d/peer-sync`"
