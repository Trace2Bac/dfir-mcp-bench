# Matrix case P4116-011: correlate_memory_and_disk builds the
# disk-side module set only from backtick-quoted [A-Za-z0-9_]+ names in
# scan_kernel_modules reasons, which in practice are the non-stock names in
# /etc/modules. The out-of-tree module (`diamorphine.ko`, a dot inside the
# backticks) and the modprobe.d install directive that loads it are found by
# scan_kernel_modules but never counted, so the tool says disk has 0 modules
# and memory and disk "agree".
#
# Volatility is a stub (${STUBS}/vol): it answers `--help` with rc 0 and, for
# `-q -f <dump> -r json <plugin>`, prints what the Volatility 3 JSON renderer
# (`-r json`, 2.x) prints for that plugin: a list of row objects with the
# plugin's column names and an empty "__children" list.
#   linux.lsmod columns: Offset, Module Name, Code Size, Taints, Load Arguments, File Output
#   linux.check_modules columns: Module Address, Module Name (only modules
#   found in sysfs but missing from the module list; none here)
case_id: P4116-011
problem: P4116
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "트리 밖 모듈과 `modprobe.d` 지시문을 쓰는 LKM 루트킷은 실제로 있다. Volatility 출력은 흉내 낸 것이다."
coverage: "partial: Volatility output is imitated (no real memory image or symbols)"
coverage_ko: "Volatility 출력은 흉내 낸 것이다(실제 메모리 이미지나 심볼 없음)"
summary: 'With an out-of-tree diamorphine.ko under lib/modules/*/extra and a modprobe.d install directive for it, correlate_memory_and_disk reports "Disk: 0 module name(s)" and "Memory and disk agree", because it only counts backtick names that the /etc/modules check produces.'
summary_ko: "lib/modules/*/extra 아래의 트리 밖 diamorphine.ko와 그에 대한 modprobe.d install 지시문이 있어도, correlate_memory_and_disk는 \"Disk: 0 module name(s)\"와 \"Memory and disk agree\"를 보고한다. /etc/modules 검사가 만드는 백틱 이름만 세기 때문이다."
defect_ko: "정상이라면 디스크 쪽 모듈 목록에 `scan_kernel_modules`가 찾은 `.ko` 파일과 `install` 지시문이 들어가야 하는데, 이 서버는 `/etc/modules` 검사가 만든 이름만 센다. 그래서 모델은 루트킷 흔적이 있는 디스크를 메모리와 일치하는 깨끗한 상태로 잘못 안다."
setup_ko: "`diamorphine.ko`와 그 `install` 지시문을 디스크에 두고, Volatility 대역이 `diamorphine`이 적재된 lsmod 결과를 돌려주게 했다."
env:
  FINDEVIL_VOL: ${STUBS}/vol
stubs:
  - name: vol
    text: |
      #!/bin/sh
      # Stub of Volatility 3 (vol) with the JSON renderer output for two plugins.
      plugin=""
      for a in "$@"; do
        case "$a" in
          --help) echo "usage: vol [-h] [-c CONFIG] ... plugin ..."; exit 0 ;;
          linux.*|banners.*) plugin="$a" ;;
        esac
      done
      case "$plugin" in
        linux.lsmod)
          cat <<'JSON'
      [
        {
          "Code Size": 16384,
          "File Output": "Disabled",
          "Load Arguments": "",
          "Module Name": "diamorphine",
          "Offset": 18446744072646127616,
          "Taints": "OOT_MODULE,UNSIGNED_MODULE",
          "__children": []
        },
        {
          "Code Size": 155648,
          "File Output": "Disabled",
          "Load Arguments": "",
          "Module Name": "ext4",
          "Offset": 18446744072647737344,
          "Taints": "",
          "__children": []
        }
      ]
      JSON
          ;;
        linux.check_modules)
          echo "[]"
          ;;
        *)
          echo "vol: error: invalid choice: $plugin" >&2; exit 2 ;;
      esac
fixture:
  - path: case01/mem.lime
    hex: 454d694c0100000000000000
  - path: case01/fs/lib/modules/5.15.0-91-generic/extra/diamorphine.ko
    hex: 7f454c46020101000000000000000000
  - path: case01/fs/etc/modprobe.d/diamorphine.conf
    text: "install diamorphine /bin/sh -c '/sbin/insmod /lib/modules/5.15.0-91-generic/extra/diamorphine.ko'\n"
  - path: case01/fs/etc/modules
    text: "# /etc/modules\nloop\n"
steps:
  - tool: find_persistence
    note_ko: "비교용: 디스크 검사는 모듈과 지시문을 찾음"
    args:
      root_path: ${EVIDENCE}/case01/fs
  - tool: correlate_memory_and_disk
    note_ko: "결함이 있는 호출: 메모리와 디스크 대조"
    args:
      memory_dump_path: ${EVIDENCE}/case01/mem.lime
      fs_root: ${EVIDENCE}/case01/fs
expect:
  # the disk scanner does find the module and the install directive ...
  - step: 1
    note_ko: "디스크 검사가 `diamorphine.ko`를 찾는다"
    contains: "diamorphine.ko"
  - step: 1
    note_ko: "디스크 검사가 `install` 지시문을 찾는다"
    contains: "install directive runs shell"
  # ... but the correlation counts none of it and says the two sides agree
  - step: 2
    note_ko: "메모리에 모듈 2개가 적재돼 있다고 나온다"
    contains: "Memory: 2 loaded, 0 hidden"
  - step: 2
    note_ko: "디스크 쪽 모듈이 0개로 나온다"
    contains: "Disk: 0 module name(s) in /etc/modules or modprobe.d/"
  - step: 2
    note_ko: "메모리와 디스크가 일치한다고 판정한다"
    contains: "Memory and disk agree"
  - step: 2
    note_ko: "대조 결과에 `diamorphine`이 없다"
    not_contains: "diamorphine"
