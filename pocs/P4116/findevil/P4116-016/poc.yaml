# Matrix case P4116-016: for the same sshd_config, find_persistence assumes
# OpenSSH defaults and reports "PasswordAuthentication yes", while
# analyze_sshd_config only judges directives that are written and says
# "No dangerous settings detected.".
case_id: P4116-016
problem: P4116
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "`PasswordAuthentication` 줄이 없는 sshd_config는 흔하다."
coverage: full
summary: For one sshd_config with no PasswordAuthentication line, find_persistence reports a high "PasswordAuthentication yes" finding and analyze_sshd_config says "No dangerous settings detected.", so the verdict depends on which tool the model calls.
summary_ko: "PasswordAuthentication 줄이 없는 sshd_config 하나에 대해 find_persistence는 high \"PasswordAuthentication yes\" 발견을 보고하고 analyze_sshd_config는 \"No dangerous settings detected.\"라고 한다. 판정이 모델이 부르는 도구에 달려 있다."
defect_ko: "정상이라면 같은 설정에 두 도구가 같은 판정을 내야 하는데, 이 서버의 `find_persistence`는 OpenSSH 기본값을 반영해 비밀번호 로그인이 켜졌다고 하고 `analyze_sshd_config`는 적힌 줄만 보아 위험 없음이라고 한다. 그래서 `analyze_sshd_config`만 부른 모델은 비밀번호 로그인이 꺼졌다고 잘못 안다."
setup_ko: "`PasswordAuthentication` 줄이 없는 sshd_config를 넣었다."
fixture:
  - path: fs/etc/ssh/sshd_config
    text: |
      Port 22
      PermitRootLogin no
      UsePAM yes
steps:
  - tool: find_persistence
    note_ko: "비교용: 지속성 검사는 기본값을 반영함"
    args:
      root_path: ${EVIDENCE}/fs
  - tool: analyze_sshd_config
    note_ko: "결함이 있는 호출: sshd 설정 분석"
    args:
      path: ${EVIDENCE}/fs/etc/ssh/sshd_config
expect:
  - step: 1
    note_ko: "지속성 검사는 비밀번호 로그인이 켜졌다고 보고한다"
    contains: "PasswordAuthentication yes — password-based login is enabled"
  - step: 2
    note_ko: "sshd 설정 분석은 위험 설정이 없다고 답한다"
    contains: "No dangerous settings detected."
