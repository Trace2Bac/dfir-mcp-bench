# Matrix case P4116-012: assess_coverage marks an artifact class "examined" if
# any matching tool name appears in audit.json, whatever file it was run on.
case_id: P4116-012
problem: P4116
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "여러 호스트의 로그를 받아 일부만 먼저 본 상태는 흔하다."
coverage: "partial: calls from another case (an earlier session) are shown in P2049-004"
coverage_ko: "다른 사건(이전 세션)의 호출은 P2049-004에서 보인다"
summary: After auth_summary is run on host-a's auth.log only, assess_coverage marks both host-a and host-b auth logs as examined and returns COVERAGE CLEAN, although host-b's log (with a successful root login) was never read.
summary_ko: "host-a의 auth.log에만 auth_summary를 실행한 뒤, assess_coverage는 host-a와 host-b의 auth 로그를 모두 검사함으로 표시하고 COVERAGE CLEAN을 돌려준다. host-b의 로그(root 로그인 성공이 있음)는 한 번도 읽지 않았다."
defect_ko: "정상이라면 실제로 읽은 파일만 검사함으로 표시해야 하는데, 이 서버는 그 종류의 도구 이름이 감사 기록에 한 번만 있어도 같은 종류의 파일을 모두 검사함으로 표시한다. 그래서 모델은 읽지 않은 host-b의 root 로그인 기록까지 확인했다고 잘못 안다."
setup_ko: "host-a와 host-b의 auth.log를 넣고, host-b에는 root 로그인 성공 줄을 두었다."
fixture:
  - path: host-a/auth.log
    text: "Apr 12 14:00:00 a sshd[800]: Accepted publickey for deploy from 10.0.0.5 port 50000 ssh2\n"
  - path: host-b/auth.log
    text: "Apr 12 14:05:00 b sshd[900]: Accepted password for root from 203.0.113.7 port 51000 ssh2\n"
steps:
  - tool: auth_summary
    note_ko: "host-a의 auth.log만 읽음"
    args:
      path: ${EVIDENCE}/host-a/auth.log
  - tool: assess_coverage
    note_ko: "결함이 있는 호출: 검사 범위 평가"
    args: {}
expect:
  - step: 2
    note_ko: "두 호스트의 auth 로그가 모두 검사함으로 표시된다"
    contains: "| auth log (SSH / sudo / useradd) | `host-a/auth.log`, `host-b/auth.log` | ✅ examined |"
  - step: 2
    note_ko: "`COVERAGE CLEAN` 판정이 나온다"
    contains: "**Verdict: COVERAGE CLEAN**"
