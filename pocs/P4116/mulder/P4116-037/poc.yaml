# Matrix case P4116-037: audit_tool_coverage builds tools_run for each
# evidence item from the set of tool names in the audit log
# (audit.summary().tool_call_counts), not from the calls made on that item
# (review.py 174-240). A tool run on one capture is then listed as run on
# every capture, and tools_not_run and total_gaps leave the other out.
# Upstream PR #270 changes this to match calls by their evidence path.
#
# Evidence: two classic pcaps written by a small script (Ethernet/IPv4,
# correct checksums), one per sensor: a DNS lookup and an HTTP CRL/OCSP fetch
# from 10.0.2.42 (ws0142) and from 10.0.3.17 (db01).
