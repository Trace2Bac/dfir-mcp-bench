steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: two-captures
  - tool: run_pcap_analysis
    note_ko: "ws0142 캡처만 분석"
    args:
      pcap_path: ${EVIDENCE}/net/ws0142-span.pcap
      mode: conversations
  - tool: audit_tool_coverage
    note_ko: "결함 호출: 증거별 도구 실행 현황"
expect:
  - step: 2
    note_ko: "ws0142 캡처 분석이 성공한다"
    contains: 'pcap.conversations\", \"source_id\": 1, \"windows_indexed\": 1'
  - step: 3
    note_ko: "분석하지 않은 db01 캡처도 `run_pcap_analysis`를 돌린 것으로 나온다"
    regex: 'db01-span\.pcap",\s*"artifact_type": "network_capture",\s*"tools_run": \[\s*"run_pcap_analysis"\s*\],\s*"tools_not_run": \[\]'
  - step: 3
    note_ko: "빠진 분석이 0건으로 나온다"
    regex: '"total_gaps": 0\b'
