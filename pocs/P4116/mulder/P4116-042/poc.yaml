# Matrix case P4116-042: run_pcap_analysis mode=beaconing collects
# frame.time_epoch per ip.dst:dstport for every packet (pcap.py
# _pcap_beaconing), measures the gaps between packets, and prints the packet
# count as "Connections". A single long TCP session whose packets in one
# direction are evenly spaced is then reported as a POTENTIAL BEACON.
#
# Evidence: a classic pcap written by a small script (Ethernet/IPv4/TCP with
# correct checksums), one SSH session from a Windows workstation (OpenSSH for
# Windows 9.5) to a Linux jump host 198.51.100.20:22 on 2026-10-26: a full
# handshake, version exchange, key exchange and login, then about 100 minutes
# idle with ServerAliveInterval 30: every 30 s the client sends a
# keepalive@openssh.com request, the server answers with one packet, and the
# client ACKs it 41 ms later; FIN teardown at the end. 639 packets, one TCP
# connection. Encrypted SSH payloads are random bytes.
case_id: P4116-042
problem: P4116
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "관리자가 SSH 접속을 `ServerAliveInterval`을 켜 둔 채 오래 열어 두는 일은 흔하고, 그 동안 keepalive 패킷이 일정한 간격으로 오간다."
coverage: full
summary: >-
  For a capture holding one SSH session (one TCP connection, kept alive every
  30 s), run_pcap_analysis mode=beaconing reports the workstation's own
  address and ephemeral port 10.0.2.42:50514 as a POTENTIAL BEACON with
  "Connections: 213", while the conversations mode of the same capture lists
  a single TCP conversation.
summary_ko: "SSH 세션 하나(TCP 연결 하나, 30초마다 keepalive)가 든 캡처에 `run_pcap_analysis` beaconing 모드를 돌리면, 워크스테이션 자신의 주소와 임시 포트 `10.0.2.42:50514`를 `Connections: 213`인 `POTENTIAL BEACON`으로 낸다. 같은 캡처의 conversations 모드는 TCP 대화 하나만 보여 준다."
defect_ko: "이 서버는 비콘 판정을 연결이 아니라 목적지별 패킷 도착 간격으로 하고, 패킷 수를 'Connections'로 적는다. 정상이라면 같은 목적지로 새로 맺은 연결(세션 시작)의 간격을 재고 연결 수를 적어야 한다. 모델은 한 SSH 세션의 keepalive를 213번 연결한 C2 비콘으로 잘못 안다."
setup_ko: "워크스테이션 10.0.2.42가 점프 호스트 198.51.100.20:22에 SSH로 한 번 접속해 로그인한 뒤, 30초 간격 keepalive만 오가며 약 100분 열어 둔 세션 하나가 든 캡처를 두었다."
