steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: pcap-netscan
  - tool: run_pcap_analysis
    note_ko: "캡처의 대화 목록 적재"
    args:
      pcap_path: ${EVIDENCE}/net/fw-ws0142-20261026-0940.pcap
      mode: conversations
  - tool: run_volatility
    note_ko: "메모리의 네트워크 연결 적재"
    args:
      plugin: netscan
      memory_path: ${EVIDENCE}/ws0142-memory.raw
  - tool: correlate_pcap_with_host
    note_ko: "결함 호출: 캡처와 호스트 연결 상관 분석"
  - tool: get_raw_output
    note_ko: "비교 호출: 캡처 대화 목록 원문"
    args:
      source_name: pcap.conversations
expect:
  - step: 4
    note_ko: "상관 결과가 12건이다(10.0.2.42가 든 netscan 줄 전부)"
    regex: '"result_count": 12,'
  - step: 4
    note_ko: "파일 서버 SMB 연결이 호스트 자신의 주소로만 맞아 상관 결과가 된다"
    regex: '"matched_ips": \[\s*"10\.0\.2\.42"\s*\],[^{}]*"netscan_text": "0xa50e2c11a8a0\\tTCPv4\\t10\.0\.2\.42\\t49821\\t10\.0\.2\.10\\t445'
  - step: 4
    note_ko: "OneDrive 연결도 같은 식으로 상관 결과가 된다"
    regex: '"matched_ips": \[\s*"10\.0\.2\.42"\s*\],[^{}]*"netscan_text": "0xa50e2c2071d0\\tTCPv4\\t10\.0\.2\.42\\t49844\\t20\.190\.151\.7\\t443'
  - step: 5
    note_ko: "캡처의 대화는 10.0.2.42와 DNS 서버 10.0.2.1, 203.0.113.7 사이뿐이다"
    regex: 'IPv4 Conversations[\s\S]*Duration[^\n]*\|\\n10\.0\.2\.42\s+<-> 203\.0\.113\.7[^\n]*\\n10\.0\.2\.42\s+<-> 10\.0\.2\.1 [^\n]*\\n====='
