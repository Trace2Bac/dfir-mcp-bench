# Matrix case P4116-041: correlate_pcap_with_host collects every IPv4 address
# in the pcap sources (misc.py _extract_pcap_indicators), the captured host's
# own address included, and reports each netscan line sharing any of them as
# pcap_netscan_ip_match (_correlate_with_netscan). Every connection or
# listener of the host is then "correlated" through its own address.
#
# Evidence: a classic pcap written by a small script (Ethernet/IPv4, correct
# checksums), taken at the firewall on 2026-10-26 09:40 UTC: ws0142
# (10.0.2.42) resolves cdn-update.example.net to 203.0.113.7 and opens one
# TLS session to it on 443. A raw memory image of ws0142 taken at 10:31 UTC.
# Volatility is a stub: no real memory image or symbol pack fits in a PoC.
# It prints what Volatility 3 Framework 2.28.2 (the version in the image)
# prints for windows.netscan.NetScan with its default "quick" renderer: the
# banner, a blank line, the tab-separated header, a blank line, one row per
# socket (progress goes to stderr). 18 sockets; 12 have 10.0.2.42 as the
# local address, and one of those (powershell.exe, PID 6488) goes to
# 203.0.113.7:443.
case_id: P4116-041
problem: P4116
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "같은 호스트의 캡처와 메모리를 함께 받는 것은 흔하고, 그 호스트의 캡처에는 언제나 호스트 자신의 IP가, netscan에는 그 IP를 로컬 주소로 쓰는 연결이 대부분이다."
coverage: full
summary: >-
  With a firewall capture of ws0142 (10.0.2.42) talking only to its DNS
  server and 203.0.113.7, and its memory netscan, correlate_pcap_with_host
  returns 12 pcap_netscan_ip_match results: the powershell.exe connection to
  203.0.113.7 and 11 others (SMB to the file server, LDAP, OneDrive, NetBIOS
  listeners) matched only through the host's own address 10.0.2.42.
summary_ko: "ws0142(10.0.2.42)가 DNS 서버와 203.0.113.7하고만 통신한 방화벽 캡처와 그 호스트의 메모리 netscan을 두고 `correlate_pcap_with_host`를 부르면 `pcap_netscan_ip_match`가 12건 나온다. 203.0.113.7로 가는 `powershell.exe` 연결 1건 말고 11건(파일 서버 SMB, LDAP, OneDrive, NetBIOS 수신 대기)은 호스트 자신의 주소 10.0.2.42로만 맞은 것이다."
defect_ko: "이 서버는 캡처에 나온 모든 IP(분석 호스트 자신 포함)와 netscan 줄의 IP가 하나라도 겹치면 상관 결과로 낸다. 정상이라면 호스트 자신의 주소를 빼고 상대 주소(와 포트)가 맞는 연결만 내야 한다. 모델은 캡처에 없던 SMB·LDAP·OneDrive 연결까지 캡처의 네트워크 활동과 이어진 것으로 잘못 안다."
setup_ko: "ws0142가 C2로 보이는 203.0.113.7에 TLS로 접속한 방화벽 캡처와, 50분 뒤 받은 같은 호스트의 메모리 이미지를 두고 캡처 대화 목록과 netscan을 적재했다(Volatility는 stub)."
env:
  PATH: ${STUBS}:${PATH}
