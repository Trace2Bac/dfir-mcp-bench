steps:
  - tool: open_case
    note_ko: "준비: 기존 사건 열기"
    args:
      case_id: ir-2026-047
  - tool: assess_recovery
    note_ko: "결함 호출: 복구 가능성 평가"
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 fls 파일 목록 원문"
    args:
      source_name: tsk.filelist
expect:
  - step: 2
    note_ko: "흔적 지우기 항목은 로그 삭제 하나뿐이다"
    regex: '"anti_forensics_detected": \[\s*\{\s*"type": "log_clearing",\s*"source": "evtx\.security"[^\]]*\],\s*"anti_forensics_count": 1,'
  - step: 2
    note_ko: "그런데 '보안 삭제 도구가 탐지됐다'는 증거 공백이 붙는다"
    contains: '"Secure delete tools detected -- some deleted files may be unrecoverable"'
  - step: 2
    note_ko: "삭제 파일 수가 1로 나온다"
    regex: '"total_deleted_files": 1,'
  - step: 3
    note_ko: "fls 목록에는 지운 폴더·파일이 여럿 있다(예: Finance의 원장 파일)"
    regex: 'r/r \* 39:\\tBackup/Finance/Q1-2026-ledger-1\.xlsx\\nr/r \* 42:\\tBackup/Finance/Q2-2026-ledger-2\.xlsx'
  - step: 3
    note_ko: "같은 window 끝까지 삭제된 고아 파일이 이어진다"
    contains: '-/r * 4142:\t$OrphanFiles/_ALCO~14.PDF'
