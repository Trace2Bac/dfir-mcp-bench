# Matrix case P4116-036: assess_recovery (misc.py)
#   - _build_recovery_assessment 527-546 adds "Secure delete tools detected"
#     to evidence_gaps whenever anti_forensics is not empty, so a
#     log_clearing item alone produces it;
#   - _collect_deleted_files 484-493 returns the number of tsk.filelist
#     windows that contain "* ", reported as total_deleted_files.
#
# The case is resumed: ${DB_DIR} holds a case database and audit log made in
# this same image the way the calls in its audit log index them:
#   run_fls on usb-kingston.dd: the real `fls -r -p` output (TSK in the image)
#     of a 64 MiB FAT32 USB stick image made with mtools: Photos/ (60 JPGs),
#     Tools/rar.exe, backup-0926.rar, and Backup/Finance, HR, Projects whose
#     42 staged files were then deleted with mdel/mrd. fls lists 45 deleted
#     entries (3 folders, 12 files, 30 $OrphanFiles); the 116-line listing is
#     one 4,096-character window.
#   run_evtx_parser and index_evtx_file("Security.evtx") on ws0142.E01:
#     extract_and_index of an EvtxECmd CSV as evtx.security. The CSV is not
#     from a real Security.evtx (no EVTX writer fits in a PoC): its rows follow
#     EvtxECmd 1.5's CSV layout: 1102 (alice cleared the Security log at
#     10:12:07), then service logons 4624/4672 and a 4634.
# No prefetch, amcache, shimcache or USN journal source is indexed. The
# database was VACUUMed to a 512-byte page size to keep this file small. Its
# evidence root is /ev, where it was made.
