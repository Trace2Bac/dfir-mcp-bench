realism_ko: "공격자가 보안 로그를 지우는 것(1102)은 흔한 흔적 지우기이고, 반출에 쓴 USB에서 옮긴 파일을 지운 흔적은 fls 목록에 삭제 항목으로 여러 개 남는다."
coverage: "partial: both parts are shown with a log_clearing item and one window of fls output; the EvtxECmd CSV is imitated"
coverage_ko: "로그 삭제 항목 하나와 window 하나짜리 fls 목록으로 두 부분을 모두 보인다. EvtxECmd CSV는 형식을 따라 만든 것이다."
summary: >-
  With a USB image whose fls listing has 45 deleted entries and a Security
  log cleared by alice (1102), and no prefetch, amcache or shimcache indexed,
  assess_recovery returns total_deleted_files 1 and, from the log_clearing
  item alone, the evidence gap "Secure delete tools detected -- some deleted
  files may be unrecoverable".
summary_ko: "fls 목록에 삭제 항목이 45개인 USB 이미지와 alice가 지운 보안 로그(1102)가 있고 prefetch·amcache·shimcache는 적재되지 않은 사건에서, `assess_recovery`는 `total_deleted_files: 1`을 내고, 로그 삭제 항목 하나만으로 `evidence_gaps`에 \"Secure delete tools detected -- some deleted files may be unrecoverable\"을 넣는다."
defect_ko: "이 서버는 흔적 지우기 항목이 하나라도 있으면(로그 삭제뿐이어도) '보안 삭제 도구가 탐지됐다'고 쓰고, 삭제 표시가 든 window 수를 삭제 파일 수로 낸다. 정상이라면 보안 삭제 도구 항목이 있을 때만 그 문장을 넣고, 삭제 항목 줄 수를 세야 한다. 모델은 SDelete 같은 도구로 파일이 지워져 복구할 수 없고 삭제 파일은 1개뿐이라고 잘못 안다."
setup_ko: "반출에 쓴 USB 메모리 이미지(옮긴 문서 42개를 지운 흔적)의 파일 목록과, 사용자가 지운 보안 로그(1102)를 적재한 기존 사건(`ir-2026-047`)을 열었다. 실행 흔적(prefetch 등)은 적재하지 않았다."
