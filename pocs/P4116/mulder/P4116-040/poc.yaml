steps:
  - tool: open_case
    note_ko: "준비: 기존 사건 열기"
    args:
      case_id: ir-2026-049
  - tool: analyze_execution_timeline
    note_ko: "결함 호출: 실행 타임라인 만들기"
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 prefetch 원문"
    args:
      source_name: ez.prefetch
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 Amcache 원문"
    args:
      source_name: ez.amcache
expect:
  - step: 2
    note_ko: "prefetch 11건과 Amcache 12건에서 7건만 나온다"
    regex: '"result_count": 7,'
  - step: 2
    note_ko: "prefetch가 있는 winword.exe에 'prefetch 없이 Amcache에만 있다(정리 흔적)'가 붙는다"
    regex: 'winword\.exe,winword\.exe,\.exe",\s*"sources": \[\s*"amcache"\s*\],[^{}]*"anomaly_flags": \[\s*"amcache_only_no_prefetch"\s*\]'
  - step: 2
    note_ko: "타임라인에 RAR 실행이 없다"
    not_regex: '(?i)rar\.exe'
  - step: 3
    note_ko: "prefetch에는 USB에서 한 번 실행된 RAR.EXE가 있다"
    contains: "RAR.EXE,6B1C8E2A,20324,Windows 10 or Windows 11,1,2026-10-26 10:09:15"
  - step: 3
    note_ko: "prefetch에는 64번 실행된 WINWORD.EXE도 있다"
    contains: "WINWORD.EXE,B0B5D97F,58526,Windows 10 or Windows 11,64,"
  - step: 4
    note_ko: "Amcache에도 USB의 rar.exe가 있다"
    contains: 'e:\\tools\\rar.exe,rar.exe,.exe'
