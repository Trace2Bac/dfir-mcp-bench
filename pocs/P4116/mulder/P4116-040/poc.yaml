realism: common
realism_ko: "PECmd·AmcacheParser CSV는 한 행이 길어 window 하나에 실행 파일 행이 여러 개 들어가고, 침입 도구를 USB에서 한 번 실행한 흔적은 prefetch·amcache에 함께 남는 일이 흔하다."
coverage: "partial: dropped rows and a false amcache_only_no_prefetch are shown; a run count or SHA1 from another row is attached the same way when the window's first values belong to another row; the EZ Tools CSVs are imitated"
coverage_ko: "빠지는 행과 잘못된 `amcache_only_no_prefetch`만 보인다. window의 첫 값이 다른 행 것일 때 실행 횟수·SHA1이 다른 행에서 붙는 것도 같은 방식이다. EZ Tools CSV는 형식을 따라 만든 것이다."
summary: >-
  With 11 prefetch records and 12 Amcache entries indexed, among them RAR.EXE
  run once from the USB stick and recorded in both, analyze_execution_timeline
  returns 7 entries: RAR.EXE is not among them, and winword.exe, which has a
  prefetch record of 64 runs, is flagged amcache_only_no_prefetch.
summary_ko: "prefetch 11건과 Amcache 12건이 적재되고 그중 USB에서 한 번 실행된 `RAR.EXE`가 양쪽에 다 있는데, `analyze_execution_timeline`은 7건만 낸다. `RAR.EXE`는 없고, 64번 실행된 prefetch 기록이 있는 `winword.exe`에는 `amcache_only_no_prefetch`가 붙는다."
defect_ko: "이 서버는 window마다 첫 실행 파일 이름 하나만 뽑아 그 window의 값을 붙이고 나머지 행은 버린다. 정상이라면 행마다 실행 파일과 그 행의 값을 읽어야 한다. 모델은 USB에서 실행한 RAR가 실행 기록에 없다고 보고, prefetch가 있는 Word에 '정리 흔적'이 있다고 잘못 안다."
setup_ko: "워크스테이션 ws0142의 prefetch와 Amcache를 적재한 기존 사건(`ir-2026-049`)을 열었다. 둘 다에 USB의 `E:\\Tools\\rar.exe`를 한 번 실행한 기록이 있다."
