# Matrix case P4116-040: analyze_execution_timeline (execution.py 119-189,
# 285-312) takes one executable name per 4,096-character window
# (_EXE_NAME_RE.search, the first "\S+\.exe" in the window), and gives it the
# window's event_time, run count and first SHA1. Every other executable row
# in that window is dropped, and an Amcache entry whose name is not one of
# those first-per-window prefetch names is flagged amcache_only_no_prefetch
# ("possible evidence cleanup").
#
# The case is resumed: ${DB_DIR} holds a case database and audit log made in
# this same image the way run_prefetch_parser and run_amcache_parser index
# their output: extract_and_index of the EZ Tools CSVs (extractor eztools) as
# ez.prefetch and ez.amcache. The CSVs are not from real .pf files or a real
# Amcache.hve (neither fits in a PoC): their columns follow PECmd's
# PECmd_Output.csv + PECmd_Output_Timeline.csv and AmcacheParser's
# Amcache_UnassociatedFileEntries.csv. ws0142, 2026-10-26: 11 prefetch
# records, among them RAR.EXE run once at 10:09:15 from the USB stick
# (\VOLUME{...-5a3e21c4}\TOOLS\RAR.EXE) and WINWORD.EXE (64 runs); 12 Amcache
# file entries, among them e:\tools\rar.exe and winword.exe. The database was
# VACUUMed to a 512-byte page size to keep this file small. Its evidence root
# is /ev, where it was made.
