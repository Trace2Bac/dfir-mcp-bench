fixture:
  # A raw memory image: only its name and size reach the stub.
  - path: ws0142-memory.raw
    size: 1048576
steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: cmdline-window
  - tool: run_volatility
    note_ko: "프로세스 명령줄 적재"
    args:
      plugin: cmdline
      memory_path: ${EVIDENCE}/ws0142-memory.raw
  - tool: find_suspicious_processes
    note_ko: "결함 호출: 의심 프로세스 찾기"
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 명령줄 원문"
    args:
      source_name: volatility.cmdline
expect:
  - step: 2
    note_ko: "명령줄 출력이 window 하나로 적재된다"
    regex: 'windows_indexed\\": 1,'
  - step: 3
    note_ko: "31개 프로세스 모두가 의심 프로세스로 나온다"
    regex: '"result_count": 31,'
  - step: 3
    note_ko: "System(PID 4)이 `encoded_powershell`로 나온다"
    regex: '"pid": 4,[^{}]*"suspicion_reasons": \[\s*"encoded_powershell"\s*\]'
  - step: 3
    note_ko: "`lsass.exe`(PID 684)도 `encoded_powershell`로 나온다"
    regex: '"pid": 684,[^{}]*"suspicion_reasons": \[\s*"encoded_powershell"\s*\]'
  - step: 3
    note_ko: "`notepad.exe`(PID 7044)도 `encoded_powershell`로 나온다"
    regex: '"pid": 7044,[^{}]*"suspicion_reasons": \[\s*"encoded_powershell"\s*\]'
  - step: 4
    note_ko: "원문에서 인코딩된 명령은 PID 6488 `powershell.exe` 한 줄뿐이고, `notepad.exe`(7044)는 메모 파일을 연 명령줄이다"
    regex: '6488\\tpowershell\.exe\\tpowershell\.exe -nop -w hidden -enc [\s\S]*7044\\tnotepad\.exe\\t\\"C:\\\\Windows\\\\system32\\\\notepad\.exe\\" C:'
