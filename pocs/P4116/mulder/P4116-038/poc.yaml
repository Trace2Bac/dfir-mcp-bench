# Matrix case P4116-038: the composite tools give an indicator to a whole
# 4,096-character window when a substring appears anywhere in it. Shown here
# with two of them on one ordinary System log:
#   find_lateral_movement_indicators, winrm_connection (lateral.py 182-200):
#     any("91", "168", "169" in window text)
#   find_defense_evasion, log_clearing (misc.py 159-190):
#     "104" in window text or "1102" or "cleared"
# Digits in timestamps, thread IDs or SIDs are enough.
#
# The case is resumed: ${DB_DIR} holds a case database and audit log made in
# this same image the way run_evtx_parser (on the disk image) and
# index_evtx_file("System.evtx") index them: extract_and_index of the
# EvtxECmd CSV as evtx.system (extractor eztools). The CSV is not from a real
# System.evtx (no EVTX writer fits in a PoC): its rows follow EvtxECmd 1.5's
# CSV layout and are an ordinary Windows 10 boot and morning: Kernel-General
# 12, EventLog 6005/6009/6013, Service Control Manager 7036/7040, Time-Service
# 37, Winlogon 7001, WindowsUpdateClient 19, DNS-Client 1014. No WinRM event,
# no log-cleared event (104/1102). The database was VACUUMed to a 512-byte
# page size to keep this file small. Its evidence root is /ev, where it was
# made.
