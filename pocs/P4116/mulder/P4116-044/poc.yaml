realism_ko: "카탈로그·설명서 PDF가 같은 폴더의 엑셀·워드 파일을 여는 링크를 `/Launch` 동작으로 넣는 일이 있고, 오래된 배포 자료에서 흔히 보인다."
coverage: full
summary: >-
  For a product catalog PDF whose only action is a link that launches the
  price list pricelist-2026.xlsx (no JavaScript, no auto action, no embedded
  file), analyze_pdf returns risk_level "malicious".
summary_ko: "유일한 동작이 같은 폴더의 가격표 `pricelist-2026.xlsx`를 여는 링크인 제품 카탈로그 PDF(JavaScript·자동 실행·내장 파일 없음)에 `analyze_pdf`는 `risk_level: malicious`를 낸다."
defect_ko: "이 서버는 `/Launch` 동작이 하나라도 있으면 무엇을 실행하는지 보지 않고 `malicious`로 판정한다. 정상이라면 실행 대상(실행 파일·명령인지)과 자동 실행 여부를 보고 의심 수준을 매겨야 한다. 모델은 가격표를 여는 링크뿐인 카탈로그를 악성 PDF로 잘못 안다."
setup_ko: "가격표 엑셀 파일을 여는 링크 하나만 있는 공급사 제품 카탈로그 PDF를 내려받기 폴더에 두었다."
