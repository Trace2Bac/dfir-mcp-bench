# Matrix case P4116-044: analyze_pdf sets risk_level "malicious" whenever
# pdfid counts one /Launch (documents.py _compute_pdf_risk 749-758:
# `if has_launch or (...)`), the same level as auto-run obfuscated
# JavaScript, without looking at what the action launches.
#
# Evidence: a one-page PDF 1.7 written by a small script (uncompressed, valid
# xref): a supplier's product catalog whose only action is a link annotation
# with /Launch /F (pricelist-2026.xlsx), to open the price list kept next to
# it. No JavaScript, no /OpenAction or /AA, no embedded file. pdfid 0.2.10
# (in the image) counts /Launch 1 and every other keyword 0.
