# Matrix case P1002-006: respond_suggest_containment checks only that the
# case_id argument is a live-monitoring case (response/gates.py: a
# non-empty monitoring/baselines folder) and looks finding_id up in the
# trace that is open now (tools/respond.py _load_finding, log.index()). With
# CASE-A's trace open and its NewNetwork finding, a call naming the other
# live case CASE-B writes containment suggestions under CASE-B's folder
# with CASE-A's finding id and the detector inferred from CASE-A's finding,
# and never checks that the trace belongs to CASE-B.
# TRUDI_CASES_ROOT puts the cases under ${OUTSIDE}/cases (~/cases by
# default). Both cases have a baseline in the shape monitor_baseline_capture
# writes. CASE-A's trace is resumed from a previous session whose
# dair_assess moved it into Collect (shape as in P2061-057): record_finding
# needs a recent dair_call.
case_id: P1002-006
problem: P1002
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "`case_id`는 모델이 주는 인자라, 한 서버로 live 사건 여러 개를 동시에 감시할 때 모델이 사건 ID를 헷갈리거나 경보·증거 속 문구에 적힌 다른 사건 ID를 그대로 쓸 수 있다."
coverage: full
summary: With CASE-A's trace open, respond_suggest_containment(case_id='CASE-B', finding_id=<CASE-A's NewNetwork finding>) succeeds and writes ACT-1/ACT-2 under CASE-B's monitoring/response folder with case_id CASE-B, CASE-A's finding id and the detector inferred from CASE-A's finding, because the case is checked only for a baseline and the finding is taken from whatever trace is open.
summary_ko: "사건 A의 기록이 열린 상태에서 `respond_suggest_containment`에 `case_id='CASE-B'`와 사건 A의 NewNetwork 발견사항 번호를 주면 성공하고, 사건 B 폴더의 `monitoring/response/suggestions`에 `case_id` CASE-B, 사건 A의 발견사항 번호, 사건 A 발견사항에서 추론한 `detector`가 든 제안 자료를 쓴다. 사건은 baseline이 있는지만 보고 발견사항은 지금 열린 trace에서 찾기 때문이다."
defect_ko: "이 서버는 `case_id`가 baseline을 가진 live 사건인지만 확인하고 `finding_id`는 지금 열린 전역 trace에서 찾아, 다른 사건의 발견사항으로 이 사건의 차단 제안을 만든다. 지금 열린 trace의 사건과 `case_id`가 같은지 확인하고 다르면 거부해야 한다. 운영자와 모델은 사건 B의 발견사항에 근거한 조치 제안으로 알고 사건 B 호스트에서 프로세스 종료와 통신 차단을 승인할 수 있다."
setup_ko: "`cases/CASE-A`와 `cases/CASE-B` 두 live 사건에 baseline을 하나씩 두고, 사건 A의 trace를 이어 열어 NewNetwork 경보에 대한 SUSPECTED 발견사항을 기록한다. 그 뒤 사건 B의 `case_id`와 사건 A의 발견사항 번호로 차단 제안을 만든다."
env:
  TRUDI_CASES_ROOT: ${OUTSIDE}/cases
fixture:
- path: cases/CASE-A/monitoring/baselines/C.4f1a2b3c4d5e6f70.json
  root: outside
  text: "{\n  \"client_id\": \"C.4f1a2b3c4d5e6f70\",\n  \"case_id\": \"CASE-A\",\n  \"captured_at_utc\": \"2026-11-26T01:10:04Z\",\n  \"flow_ids\": [\"F.D4K2J7Q1M9P3A\", \"F.D4K2J8B6X2C1E\", \"F.D4K2J9H5R7T0N\"],\n  \"process_names\": [\"cron\", \"nginx\", \"sshd\", \"systemd\"],\n  \"image_paths\": [\"/usr/sbin/cron\", \"/usr/sbin/nginx\", \"/usr/sbin/sshd\"],\n  \"persistence_paths\": [\"/etc/cron.d/e2scrub_all\", \"/etc/systemd/system/multi-user.target.wants/nginx.service\"],\n  \"endpoints\": [{\"remote_ip\": \"10.0.0.53\", \"remote_port\": 53}],\n  \"yara_rules_path\": \"/rules/trudi-demo.yar\"\n}"
- path: cases/CASE-B/monitoring/baselines/C.9e8d7c6b5a493827.json
  root: outside
  text: "{\n  \"client_id\": \"C.9e8d7c6b5a493827\",\n  \"case_id\": \"CASE-B\",\n  \"captured_at_utc\": \"2026-11-26T02:44:51Z\",\n  \"flow_ids\": [\"F.D4K3A1C2E3G4H\", \"F.D4K3A2Q8W7E6R\", \"F.D4K3A3Z1X2C3V\"],\n  \"process_names\": [\"cron\", \"postgres\", \"sshd\", \"systemd\"],\n  \"image_paths\": [\"/usr/lib/postgresql/15/bin/postgres\", \"/usr/sbin/cron\", \"/usr/sbin/sshd\"],\n  \"persistence_paths\": [\"/etc/cron.d/e2scrub_all\"],\n  \"endpoints\": [{\"remote_ip\": \"10.0.0.53\", \"remote_port\": 53}],\n  \"yara_rules_path\": \"/rules/trudi-demo.yar\"\n}"
- path: cases/CASE-A/analysis/CASE-A_trace.json
  root: outside
  text: "{\n  \"case_id\": \"CASE-A\",\n  \"entries\": [\n    {\n      \"call_id\": 1,\n      \"type\": \"dair_call\",\n      \"ts\": \"2026-11-27T09:12:40Z\",\n      \"current_phase\": \"Triage\",\n      \"phase_rationale\": \"NewNetwork alert on web-01 triaged; collect the process and connection details.\",\n      \"transition_recommended\": true,\n      \"next_phase\": \"Collect\",\n      \"transition_rationale\": \"Triage complete; collect live process and network state from web-01.\",\n      \"stack_action\": \"push\",\n      \"investigation_focus\": \"Collect live process and network state from web-01.\",\n      \"verification_satisfied\": true,\n      \"verification_challenges\": [],\n      \"recommended_actions\": [],\n      \"directives\": {\"priority_tools\": [], \"skip_tools\": [], \"focus_pids\": [4242], \"focus_paths\": []},\n      \"input_tokens\": 3120,\n      \"output_tokens\": 410,\n      \"phase\": \"Collect\"\n    }\n  ]\n}\n"
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 사건 A의 기록(Collect 단계)을 이어서 연다"
  args:
    case_id: CASE-A
    output_path: ${OUTSIDE}/cases/CASE-A/analysis/CASE-A_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-A
    launch_dashboard: false
- tool: misc_record_finding
  note_ko: "준비: 사건 A의 NewNetwork 경보를 SUSPECTED 발견사항으로 기록한다"
  args:
    description: "Custom.TRUDI.NewNetwork alert on web-01: /tmp/.x/kworkerd (pid 4242) opened an outbound connection to 203.0.113.50:4444, not in the baseline."
    confidence: SUSPECTED
    source: monitor.check_alerts
- tool: respond_suggest_containment
  note_ko: "결함 호출: 사건 B의 case_id와 사건 A의 발견사항 번호로 차단 제안을 만든다"
  args:
    case_id: CASE-B
    finding_id: 4
    evidence:
      pid: 4242
      remote_ip: 203.0.113.50
      remote_port: 4444
expect:
- step: 2
  note_ko: 사건 A의 발견사항이 call_id 4로 기록된다
  regex: '"success": true.*"_trudi_call_id": 4'
- step: 3
  note_ko: 사건 B 이름으로 사건 A 발견사항의 제안이 성공한다
  regex: '"success": true, "case_id": "CASE-B", "detector": "Custom.TRUDI.NewNetwork", "finding_id": 4'
- file_regex: ${OUTSIDE}/cases/CASE-B/monitoring/response/suggestions/ACT-2.json
  note_ko: 사건 B 폴더의 제안 자료가 사건 A의 발견사항 번호와 그 경보의 프로세스 종료 명령을 담는다
  pattern: '"case_id": "CASE-B",\s+"finding_id": 4,\s+"detector": "Custom.TRUDI.NewNetwork",[\s\S]*"manual_command": "kill -9 4242"'
- file_regex: ${OUTSIDE}/cases/CASE-A/analysis/CASE-A_trace.json
  note_ko: 그 발견사항 4는 사건 A의 trace에 있다
  pattern: '"call_id": 4,\s+"finding_id": "F-4",\s+"revision": 1,\s+"type": "finding",\s+"ts": "[^"]*",\s+"description": "Custom\.TRUDI\.NewNetwork alert on web-01'
- file_missing: ${OUTSIDE}/cases/CASE-B/analysis/CASE-B_trace.json
  note_ko: 사건 B에는 trace가 없다
