# Matrix case P4107-006: build_timeline takes the bash actor from the first
# "home" path segment of the absolute path, so a case stored under
# /.../home/<name>/ gives every bash event that name.
case_id: P4107-006
problem: P4107
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
realism_ko: "분석가가 사건 폴더를 자기 홈 폴더 아래에 두는 일은 있지만, 표준 위치는 아니다."
coverage: full
summary: When the case folder sits under home/analyst/, commands from fs/home/alice/.bash_history and fs/root/.bash_history are both attributed to "analyst", and provenance only says ".bash_history:N", so the real owner cannot be recovered.
summary_ko: "사건 폴더가 home/analyst/ 아래에 있으면 fs/home/alice/.bash_history와 fs/root/.bash_history의 명령이 모두 \"analyst\"의 것으로 돌려지고, 출처는 \".bash_history:N\"으로만 나와 실제 소유자를 되찾을 수 없다."
defect_ko: "정상이라면 bash 명령의 사용자는 기록 파일이 있는 증거 안의 홈 폴더로 정해야 하는데, 이 서버는 절대 경로에서 처음 나오는 `home` 다음 이름을 쓴다. 그래서 모델은 alice와 root의 명령을 모두 분석가 `analyst`가 한 것으로 잘못 안다."
setup_ko: "사건 폴더를 `home/analyst/case`에 두고 그 안에 alice와 root의 `.bash_history`를 넣었다."
fixture:
  - path: home/analyst/case/fs/home/alice/.bash_history
    text: "#1775971800\nwget http://203.0.113.7/x\n"
  - path: home/analyst/case/fs/root/.bash_history
    text: "#1775972100\nchmod +x /tmp/x\n"
steps:
  - tool: build_timeline
    note_ko: "결함이 있는 호출: 분석가 홈 아래의 사건 폴더로 타임라인을 만듦"
    args:
      evidence_root: ${EVIDENCE}/home/analyst/case
expect:
  - step: 1
    note_ko: "`wget` 명령의 사용자가 `analyst`로 나온다"
    regex: "\\| bash_history \\| `analyst` \\| shell_command \\| wget"
  - step: 1
    note_ko: "`chmod` 명령의 사용자도 `analyst`로 나온다"
    regex: "\\| bash_history \\| `analyst` \\| shell_command \\| chmod"
  - step: 1
    note_ko: "실제 소유자인 `alice`나 `root`는 어디에도 나오지 않는다"
    not_regex: "`(alice|root)` \\| shell_command"
