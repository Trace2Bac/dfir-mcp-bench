# Matrix case P4107-006: build_timeline takes the bash actor from the first
# "home" segment of the absolute path of each .bash_history, so a case stored
# under /home/<analyst>/ gives every bash event the analyst's name.
#
# findevil's README installs the server by cloning it on a SIFT Workstation
# (whose default account is sansforensics, see the README's
# /home/sansforensics/findevil path) and copies cases into ./evidence, the
# default FINDEVIL_EVIDENCE_DIR. The case below sits at that place:
# home/sansforensics/findevil/evidence/web-prod-02.
#
# The case is an Ubuntu web server: eight days of normal work by alice (SRE)
# and deploy (CI account), timestamped shell histories (HISTTIMEFORMAT is set
# in /etc/profile.d), and on 2026-04-14 an SSH brute force on deploy from
# 203.0.113.7, a payload download in deploy's shell, sudo -i to root, and
# persistence (cron.d, a new sudo user) in root's shell.
case_id: P4107-006
problem: P4107
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: model
realism: common
realism_ko: "findevil README는 SIFT Workstation(기본 계정 `sansforensics`)의 홈 폴더에 저장소를 받고 사건을 `./evidence`에 복사하게 안내한다. 그래서 기본 설치대로 쓰면 사건 폴더가 늘 `/home/sansforensics/` 아래에 있다."
coverage: full
summary: With the case in findevil's default evidence folder under /home/sansforensics/, build_timeline labels all 158 shell commands of deploy, alice and root, including the attacker's wget, chmod, cron and useradd, as run by "sansforensics", an account that does not exist on the host; provenance only says ".bash_history:N", so the owner cannot be recovered from the table.
summary_ko: "사건을 findevil 기본 증거 폴더(`/home/sansforensics/` 아래)에 두면 `build_timeline`은 deploy·alice·root의 셸 명령 158건(공격자의 `wget`·`chmod`·cron·`useradd` 포함)을 모두 호스트에 없는 계정 \"sansforensics\"가 실행한 것으로 적는다. 출처는 \".bash_history:N\"뿐이라 표만으로는 실제 소유자를 되찾을 수 없다."
defect_ko: "이 서버는 절대 경로에서 처음 나오는 `home` 다음 이름을 사용자로 쓴다. 증거 안에서 기록 파일이 있는 홈 폴더로 정해야 한다. 모델은 공격자 명령을 분석가 계정 `sansforensics`가 실행한 것으로 잘못 안다."
setup_ko: "README 기본 설치처럼 사건 폴더를 `home/sansforensics/findevil/evidence/web-prod-02`에 두었다. 그 안에 8일 동안의 정상 작업(alice·deploy·root 셸 기록, auth.log)과, 4월 14일 deploy 계정 무차별 대입 → deploy 셸에서 페이로드 내려받기 → `sudo -i` → root 셸에서 cron·계정 추가로 이어지는 침입을 넣었다."
