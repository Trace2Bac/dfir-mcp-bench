steps:
  - tool: open_case
    note_ko: "준비: 기존 사건 열기"
    args:
      case_id: ir-2026-031
  - tool: submit_finding
    note_ko: "준비: 다운로드 발견 사항"
    args:
      title: PowerShell download cradle runs a script from 203.0.113.7
      description: update.ps1 downloads http://203.0.113.7/a with Net.WebClient and runs it with IEX.
      severity: high
      confidence: inference
      evidence_refs: [tc_841c0a02]
      sources: [strings.output]
      mitre_attack_ids: [T1059.001]
  - tool: submit_finding
    note_ko: "준비: 업체 보고서의 다른 지표를 배제한 `[NEGATIVE]` 발견 사항"
    args:
      title: "[NEGATIVE] No second-stage C2 or dropper from the vendor report"
      description: >-
        The vendor report for this campaign lists a second C2 at 198.51.100.23
        and a dropper at C:\Windows\Temp\svchost32.exe. Neither appears in the
        strings of update.ps1, which contacts only 203.0.113.7; this hypothesis
        is ruled out.
      severity: info
      confidence: inference
      evidence_refs: [tc_841c0a02]
      sources: [strings.output]
  - tool: get_ioc_summary
    note_ko: "결함 호출: 사건의 IOC 목록"
  - tool: get_findings
    note_ko: "비교 호출: 198.51.100.23이 나온 발견 사항"
expect:
  - step: 3
    note_ko: "`[NEGATIVE]` 발견 사항이 받아들여진다"
    contains: '"status": "accepted"'
  - step: 4
    note_ko: "배제한 주소 198.51.100.23이 203.0.113.7과 같은 IP 목록에 나온다"
    regex: '"ip_addresses": \{[^}]*"198\.51\.100\.23"[^}]*\}|"ip_addresses": \{[^}]*"203\.0\.113\.7"[^}]*"198\.51\.100\.23"'
  - step: 4
    note_ko: "배제한 드로퍼 경로가 파일 경로 IOC로 나온다"
    regex: '"file_paths": \[[^\]]*svchost32\.exe'
  - step: 5
    note_ko: "198.51.100.23이 나온 발견 사항은 `[NEGATIVE]` 하나뿐이다"
    regex: '"title": "\[NEGATIVE\] No second-stage C2[^"]*",\s*"description": "[^"]*198\.51\.100\.23'
