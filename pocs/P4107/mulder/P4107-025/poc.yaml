# Matrix case P4107-025: get_ioc_summary pulls IPs, domains, e-mail
# addresses, paths and accounts out of the title and description of every
# submitted finding, [NEGATIVE] ones included, and puts them in the same
# lists as the bulk_extractor IOCs, with no mark of where each came from
# (review.py 470-479). An address a [NEGATIVE] finding rules out comes back
# as an IOC of the case.
#
# The case is resumed from the database of P2061-041: ${DB_DIR} holds a case
# database and audit log written by this same image (scan_evidence, then
# run_strings on update.ps1), so the findings can cite the run_strings call
# tc_841c0a02. Its evidence root is /ev, where it was made.
case_id: P4107-025
problem: P4107
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "mulder의 역할 프롬프트는 조사해서 배제한 가설을 `[NEGATIVE]` 발견 사항으로 내라고 하고, 배제한 주소·경로를 그 설명에 적는 것은 자연스럽다. 그 뒤 IOC 목록을 뽑으려고 `get_ioc_summary`를 부르는 것도 흔하다."
coverage: full
summary: >-
  After a finding on update.ps1's download from 203.0.113.7 and a
  [NEGATIVE] finding that rules out 198.51.100.23 and
  C:\Windows\Temp\svchost32.exe (named in a vendor report but absent from
  the evidence), get_ioc_summary lists 198.51.100.23 and that path among the
  case's IOCs next to 203.0.113.7, with nothing that says which came from a
  ruled-out finding.
summary_ko: "`update.ps1`이 203.0.113.7에서 내려받는다는 발견 사항과, 보안 업체 보고서에 나온 198.51.100.23과 `C:\\Windows\\Temp\\svchost32.exe`가 증거에 없다고 배제한 `[NEGATIVE]` 발견 사항을 낸 뒤, `get_ioc_summary`는 198.51.100.23과 그 경로를 203.0.113.7과 함께 사건의 IOC로 낸다. 어느 것이 배제된 발견 사항에서 나왔는지는 알 수 없다."
defect_ko: "이 서버는 배제된(`[NEGATIVE]`) 발견 사항의 글에서도 주소·경로를 뽑아 증거 IOC와 같은 목록에 출처 없이 합친다. 정상이라면 `[NEGATIVE]` 발견 사항은 빼거나, 항목마다 어느 발견 사항·source에서 나왔는지 달아야 한다. 모델은 배제한 주소·파일을 이 사건의 침해 지표로 잘못 알고 차단·보고 목록에 넣는다."
setup_ko: "C2(203.0.113.7)에서 스크립트를 받아 실행하는 `update.ps1`을 `run_strings`로 적재해 둔 기존 사건을 열고, 그 다운로드 발견 사항과, 업체 보고서의 두 번째 C2와 드로퍼 경로가 증거에 없다는 `[NEGATIVE]` 발견 사항을 냈다."
