# Matrix case P4107-023: the composite tools label each indicator with a
# constant source name instead of the source the window came from.
# find_lateral_movement_indicators tags every logon indicator "evtx.security"
# (lateral.py _classify_logon_windows); when no evtx.security source exists,
# _keyword_sub_query searches every source instead, and the windows it finds
# still get "evtx.security". The source_window (which would have carried the
# window id) is removed before the response (finalize_composite_result).
#
# Evidence: the FAT12 image of P2049-101, a real 1 MiB FAT12 image (mkfs.fat
# 4.2, label EVTXLOGS) that holds one real event log,
# Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
# (36 records, informant-PC, March 2015) from the NIST CFReDS Data Leakage case
# (data/evidence/pc-triage). Only the first 44,032 bytes are not zero.
case_id: P4107-023
problem: P4107
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "공격자가 Security 로그를 지웠거나 수집본에 RDP·세션 로그만 있는 일은 실제로 있고, 그 상태에서 측면 이동 도구를 부르는 것은 도구 설명이 권하는 사용이다."
coverage: "partial: find_lateral_movement_indicators is shown; the other composite tools that label indicators with constants, window prefixes or composite_analysis are not"
coverage_ko: "`find_lateral_movement_indicators`만 보인다. 상수·window 앞부분·`composite_analysis`를 출처로 다는 다른 composite 도구는 보이지 않는다."
summary: >-
  With only a TerminalServices LocalSessionManager log indexed,
  find_lateral_movement_indicators reports in the same response that it
  queried 0 of 2 sources and that evtx.security, evtx.system and
  plaso.timeline are not indexed, yet returns 19 indicators whose source is
  "evtx.security", "evtx.system" or "plaso.timeline", all built from that
  LocalSessionManager log; search with source evtx.security finds nothing.
summary_ko: "TerminalServices LocalSessionManager 로그만 적재된 사건에서 `find_lateral_movement_indicators`는 같은 응답 안에서 source 2개 중 0개를 조회했고 `evtx.security`·`evtx.system`·`plaso.timeline`이 적재되지 않았다고 하면서도, 출처가 `evtx.security`·`evtx.system`·`plaso.timeline`인 지표 19건을 돌려준다. 모두 그 LocalSessionManager 로그에서 나온 것이고, `source='evtx.security'`로 찾으면 0건이다."
defect_ko: "이 서버는 지표의 `source`를 실제로 읽은 source가 아니라 도구 안의 상수로 달고, 그 source가 없어 전체 source를 뒤졌을 때도 같은 상수를 단다. window ID도 응답 전에 지운다. 정상이라면 지표마다 실제 source 이름과 window를 달아야 한다. 모델은 RDP 세션 로그의 기록을 Security 로그·System 로그·plaso 타임라인에서 나온 것으로 잘못 알고, 그 출처로 다시 찾지도 못한다."
setup_ko: "실제 Windows 이벤트 로그 하나(TerminalServices LocalSessionManager, 세션 로그온·로그오프 기록 36건)가 든 FAT12 USB 이미지에서 로그를 꺼내 적재했다. Security·System 로그는 없다."
fixture:
  - path: logs.img
    # First 44,032 bytes of the FAT12 image (boot sector, FATs, root directory
    # with the long file name, the log's clusters); size pads the rest with zeros.
    base64: 
    size: 1048576
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: lateral-source-label
  - tool: run_evtx_parser
    note_ko: "준비: 이미지에서 이벤트 로그 꺼내기"
    args:
      evtx_path: ${EVIDENCE}/logs.img
  - tool: index_evtx_file
    note_ko: "준비: RDP 세션 로그 적재"
    args:
      filename: Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
  - tool: find_lateral_movement_indicators
    note_ko: "결함 호출: 측면 이동 지표 찾기"
  - tool: search
    note_ko: "비교 호출: 지표가 출처로 단 source에서 찾기"
    args:
      query: logon
      source: evtx.security
  - tool: list_sources
    note_ko: "비교 호출: 적재된 source 목록"
expect:
  - step: 4
    note_ko: "같은 응답이 조회한 source가 0개이고 `evtx.security`·`evtx.system`이 적재되지 않았다고 한다"
    regex: '"sources_queried": 0,[\s\S]*Sources not yet indexed: \[''evtx.security'', ''evtx.system'''
  - step: 4
    note_ko: "LocalSessionManager 기록으로 만든 로그온 지표의 출처가 `evtx.security`다"
    regex: '"type": "network_logon",[^}]*"source": "evtx.security",[^}]*Microsoft-Windows-TerminalServices-LocalSessionManager/Operational'
  - step: 4
    note_ko: "같은 기록이 적재되지 않은 `plaso.timeline`에서 나온 RDP 흔적으로도 나온다"
    regex: '"type": "rdp_artifact",[^}]*"source": "plaso.timeline",[^}]*Microsoft-Windows-TerminalServices-LocalSessionManager/Operational'
  - step: 5
    note_ko: "지표가 단 출처 `evtx.security`로 찾으면 0건이다"
    regex: '"total_matches": 0\b'
  - step: 6
    note_ko: "적재된 이벤트 로그는 LocalSessionManager 로그 하나뿐이다"
    regex: '"source_name": "evtx.microsoft-windows-terminalservices-localsessionmanager4operational"'
