# Matrix case P4142-007: run_parallel's _slim_result cuts a sub-result's
# raw_text to 500 characters (app.py 638-642) but leaves next_after_id and
# has_more as get_raw_output set them for the whole page (core.py 901-908).
# Here get_raw_output on an auth.log of 31 windows, run in run_parallel,
# returns the first 500 characters with next_after_id 31 and has_more false;
# continuing from that cursor returns nothing, so the rest of the log,
# including the attacker's successful login in window 29, is never reached by
# the cursor the response gives.
case_id: P4142-007
problem: P4142
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "`run_parallel` 설명은 서로 독립인 도구 호출을 함께 돌리라고 하고, 적재한 로그 원문 읽기와 키워드 검색을 한 번에 부르는 것은 자연스럽다. 500자를 넘는 원문은 거의 모든 로그가 그렇다."
coverage: full
summary: >-
  Inside run_parallel, get_raw_output on a 31-window auth.log returns 500
  characters with raw_text_truncated, next_after_id 31 and has_more false;
  get_raw_output from after_id 31 returns zero windows, so the cursor skips
  everything after the first 500 characters, including the "Accepted
  password for svc_backup from 198.51.100.23" login in window 29.
summary_ko: "`run_parallel` 안에서 window 31개인 auth.log를 `get_raw_output`으로 읽으면 앞 500자만 싣고(`raw_text_truncated`) `next_after_id: 31`, `has_more: false`를 준다. 그 커서(`after_id: 31`)로 이어 읽으면 window 0개라, 500자 뒤의 내용, 곧 window 29의 \"Accepted password for svc_backup from 198.51.100.23\" 로그인까지 모두 건너뛴다."
defect_ko: "이 서버는 `run_parallel` 응답에서 `raw_text`를 500자로 자르면서 이어 읽기 커서와 `has_more`는 자르기 전 값으로 둔다. 정상이라면 커서를 실제로 실린 곳까지로 고치거나 `has_more`를 참으로 두어, 이어 읽으면 잘린 부분부터 나오게 해야 한다. 모델은 안내된 커서로 이어 읽어도 남은 것이 없다고 나오므로 로그를 다 읽었다고 믿고, 성공한 침입 로그인을 놓친다."
setup_ko: "198.51.100.23의 SSH 무차별 대입 끝에 svc_backup 계정의 비밀번호 로그인과 sudo curl이 이어지는 웹 서버 auth.log(1,234줄)를 `run_strings`로 적재하고, `run_parallel`로 원문 읽기와 검색을 함께 불렀다."
