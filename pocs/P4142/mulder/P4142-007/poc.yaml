steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: web01-ssh
  - tool: run_strings
    note_ko: "준비: auth.log 적재"
    args:
      target_path: ${EVIDENCE}/web01/var/log/auth.log
  - tool: run_parallel
    note_ko: "결함 호출: 원문 읽기와 검색을 함께"
    args:
      tasks:
        - tool: get_raw_output
          args:
            source_name: strings.output
        - tool: search
          args:
            query: sudo
            source: strings.output
  - tool: get_raw_output
    note_ko: "비교 호출: 응답이 준 커서로 이어 읽기"
    args:
      source_name: strings.output
      after_id: 31
  - tool: search
    note_ko: "비교 호출: 건너뛴 부분에 있는 로그인 찾기"
    args:
      query: svc_backup
      source: strings.output
  - tool: get_raw_output
    note_ko: "비교 호출: window 29 원문"
    args:
      source_name: strings.output
      after_id: 28
      limit: 1
expect:
  - step: 3
    note_ko: "원문은 500자로 잘렸는데 커서는 마지막 window 31이고 `has_more`는 거짓이다"
    regex: '"total_windows": 31,\s*"returned_windows": 31,\s*"next_after_id": 31,\s*"has_more": false,\s*"raw_text": "[^"]{0,520}",\s*"tool_call_id": "[^"]+",\s*"raw_text_truncated": true'
  - step: 4
    note_ko: "그 커서로 이어 읽으면 window가 하나도 없다"
    regex: '"returned_windows": 0,\s*"next_after_id": 31,\s*"has_more": false'
  - step: 5
    note_ko: "svc_backup이 나오는 곳은 커서가 건너뛴 window 29다"
    regex: '"window_id": 29,'
  - step: 6
    note_ko: "window 29에 svc_backup의 비밀번호 로그인이 있다"
    regex: '"next_after_id": 29,[^}]*Accepted password for svc_backup from 198\.51\.100\.23'
