steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: psreadline-history
  - tool: run_strings
    note_ko: "준비: 기록 파일 적재"
    args:
      target_path: ${EVIDENCE}/C/Users/jlee/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt
  - tool: search
    note_ko: "준비: 인코딩된 명령 찾기"
    args:
      query: EncodedCommand
  - tool: get_raw_output
    note_ko: "결함 호출: hint대로 offset으로 찾은 window(3번째) 읽기"
    args:
      source_name: strings.output
      offset: 2
      limit: 1
  - tool: get_raw_output
    note_ko: "비교 호출: 실제 커서 인자 after_id로 같은 window 읽기"
    args:
      source_name: strings.output
      after_id: 2
      limit: 1
expect:
  - step: 3
    note_ko: "`search`가 window 3을 찾고 `offset` 인자를 안내한다"
    regex: '"window_id": 3,[\s\S]*Use get_raw_output\(source_name, offset, limit\)'
  - step: 4
    note_ko: "안내대로 부른 호출이 오류 없이 첫 window(기록 맨 앞)를 돌려준다"
    regex: '"status": "success",[^}]*"returned_windows": 1,\s*"next_after_id": 1,[^}]*"raw_text": "Start-Process msiexec\.exe'
  - step: 5
    note_ko: "`after_id`로 부르면 인코딩된 명령이 든 window 3이 온다"
    regex: '"next_after_id": 3,[^}]*"raw_text": "powershell\.exe -NoP -W Hidden -Exec Bypass -EncodedCommand'
