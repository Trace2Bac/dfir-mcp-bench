display: multi-call
level: mcp
realism: common
realism_ko: "`search`는 결과마다 이 안내를 붙이고, 찾은 window의 앞뒤를 읽으려고 안내대로 `offset`을 넣어 `get_raw_output`을 부르는 것은 자연스럽다."
coverage: full
summary: >-
  search for EncodedCommand finds window 3 of strings.output and its hint
  says to use get_raw_output(source_name, offset, limit); get_raw_output with
  offset 2 and limit 1 succeeds but ignores offset and returns window 1, the
  admin commands at the top of the history, with next_after_id 1.
summary_ko: "`search`로 EncodedCommand를 찾으면 `strings.output`의 window 3이 나오고, 응답의 `hint`는 `get_raw_output(source_name, offset, limit)`을 쓰라고 한다. 안내대로 `offset: 2, limit: 1`로 부르면 성공 응답이지만 `offset`은 무시되어 기록 맨 앞의 관리 명령(window 1, `next_after_id` 1)이 온다."
defect_ko: "이 서버는 `get_raw_output`에 없는 `offset` 인자를 쓰라고 안내하고, 그 인자를 넣은 호출을 거부하지도 않고 버린 채 첫 쪽을 돌려준다. 정상이라면 안내는 실제 인자(`after_id`)를 써야 하고, 모르는 인자는 거부되어야 한다. 모델은 찾은 위치의 원문을 받았다고 믿고, 엉뚱한 쪽(관리 명령)을 인코딩된 명령 주변의 내용으로 잘못 읽는다."
setup_ko: "관리 명령 사이에 인코딩된 PowerShell 명령 한 줄이 든 사용자 `ConsoleHost_history.txt`를 `run_strings`로 적재하고, `search`로 그 명령을 찾은 뒤 안내대로 `get_raw_output`을 불렀다."
