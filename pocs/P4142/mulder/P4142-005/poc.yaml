# Matrix case P4142-005: every search response carries the hint "Use
# get_raw_output(source_name, offset, limit) to retrieve full evidence text"
# (core.py 371, 378), but get_raw_output has no offset parameter, only the
# after_id cursor (core.py 874-878). The call made as the hint says is not
# rejected: the unknown argument is dropped and the first page of the source
# comes back, so a model that asks for the window search pointed at gets
# another part of the file.
case_id: P4142-005
problem: P4142
server: mulder
