# Matrix case P4142-008: hash_directory walks with os.walk (a folder's files
# first, then its subfolders) but resumes by plain string comparison
# (`p <= start_after` is skipped). When a capped run stops at a file of a
# folder, every subfolder whose name sorts before that file name is skipped
# on the resumed run.
# The evidence is a mounted Windows\System32: 5,003 files at the top level
# (the cap is the default max_files 5000) and the config, drivers and winevt
# subfolders. The top-level DLL files are small stand-ins with an MZ header;
# their names and count follow a real System32, which has several thousand
# files at the top level.
case_id: P4142-008
problem: P4142
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "Windows System32에는 맨 위에만 파일이 수천 개라 기본 max_files(5000)에 닿기 쉽고, 하위 폴더 이름(config·drivers·winevt)은 마지막 파일 이름(w·x로 시작)보다 앞에 정렬된다."
coverage: full
summary: hash_directory over a System32 folder stops at the default 5,000 files at wow64.dll and says to re-call with start_after; the resumed call hashes only the 3 remaining top-level files and answers truncated false, so config\SAM, SYSTEM, SOFTWARE, SECURITY, drivers\etc\hosts and winevt\Logs\Security.evtx are never hashed, although they are there.
summary_ko: "System32 폴더에 hash_directory를 부르면 기본 상한 5,000개에서 wow64.dll에 멈추고 start_after로 다시 부르라고 한다. 안내대로 이어 부르면 맨 위 파일 3개만 해시하고 truncated false로 끝나, 실제로 있는 config\\SAM·SYSTEM·SOFTWARE·SECURITY, drivers\\etc\\hosts, winevt\\Logs\\Security.evtx는 한 번도 해시되지 않는다."
defect_ko: "이 서버는 폴더의 파일을 먼저 돌고 하위 폴더를 나중에 도는데, 이어 읽기는 경로 문자열 비교로 건너뛰어 마지막 파일 이름보다 앞에 정렬되는 하위 폴더를 통째로 뺀다. 정상이라면 걷는 순서와 같은 기준으로 이어 읽어 빠지거나 겹치는 파일이 없어야 한다. 모델은 두 번의 호출로 System32 전체를 해시했다고 잘못 알고, 레지스트리 하이브와 이벤트 로그의 해시가 없는 매니페스트를 근거로 쓴다."
setup_ko: "마운트한 Windows\\System32를 흉내 냈다. 맨 위에 DLL 4,999개(api-ms-win-*.dll, MZ 머리만 든 작은 파일)와 wow64.dll·wow64cpu.dll·wow64win.dll·xcopy.exe가 있고, 하위 폴더 config(SAM·SYSTEM·SOFTWARE·SECURITY), drivers\\etc(hosts), winevt\\Logs(Security.evtx)가 있다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: Windows/System32/api-ms-win-core-l1-{i}.dll
    repeat: 4999
    text: "MZ\x90 stub {i}"
  - path: Windows/System32/wow64.dll
    text: "MZ\x90 wow64"
  - path: Windows/System32/wow64cpu.dll
    text: "MZ\x90 wow64cpu"
  - path: Windows/System32/wow64win.dll
    text: "MZ\x90 wow64win"
  - path: Windows/System32/xcopy.exe
    text: "MZ\x90 xcopy"
  - path: Windows/System32/config/SAM
    text: "regf SAM"
  - path: Windows/System32/config/SECURITY
    text: "regf SECURITY"
  - path: Windows/System32/config/SOFTWARE
    text: "regf SOFTWARE"
  - path: Windows/System32/config/SYSTEM
    text: "regf SYSTEM"
  - path: Windows/System32/drivers/etc/hosts
    text: |
      # Copyright (c) 1993-2009 Microsoft Corp.
      127.0.0.1       localhost
      203.0.113.50    update.microsoft-cdn.net
  - path: Windows/System32/winevt/Logs/Security.evtx
    text: "ElfFile\x00"
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4142-008
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: hash_directory
    note_ko: "결함 호출: System32 전체를 해시한다. 기본 상한 5,000개에서 멈춘다"
    args:
      directory: ${EVIDENCE}/Windows/System32
    timeout_s: 300
  - tool: hash_directory
    note_ko: "결함 호출: 안내대로 start_after에 next_start_path를 넣어 이어 부른다"
    args:
      directory: ${EVIDENCE}/Windows/System32
      start_after: ${EVIDENCE}/Windows/System32/wow64.dll
    timeout_s: 300
  - tool: hash_directory
    note_ko: "비교 호출: 하위 폴더 config를 따로 해시한다"
    args:
      directory: ${EVIDENCE}/Windows/System32/config
expect:
  - step: 2
    note_ko: "첫 호출은 5,000개에서 멈추고 wow64.dll부터 이어 부르라고 안내한다"
    regex: "\"truncation_reason\": \"max_files\", \"next_start_path\": \"[^\"]*/System32/wow64\\.dll\""
  - step: 3
    note_ko: "이어 부른 호출은 맨 위 파일 3개만 해시하고 끝났다고(truncated false) 답한다"
    regex: "\"file_count\": 3, [\\s\\S]*\"truncated\": false"
  - step: 2
    note_ko: "첫 호출에는 하위 폴더 파일이 하나도 없다(맨 위 파일만 돌다 멈췄다)"
    not_contains: "/System32/config/"
  - step: 3
    note_ko: "이어 부른 호출에도 config 폴더의 하이브는 없다"
    not_contains: "/System32/config/"
  - step: 4
    note_ko: "config 폴더에는 하이브 4개가 실제로 있다(두 호출 어디에도 해시되지 않았다)"
    regex: "\"file_count\": 4, [\\s\\S]*System32/config/SYSTEM"

