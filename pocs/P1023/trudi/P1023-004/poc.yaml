# Matrix case P1023-004: the DAIR engagement nudge in core/middleware.py
# (_nudge_decision) returns at once when log._current_phase is set. Only
# with an empty phase does it attach the dair_notice ("the Triage ritual has
# not started ...") or, once reason.plan is recorded, refuse evidence tools
# until dair.assess runs. misc_start_execution_log (configure) gives every
# new trace the phase Triage, so in the normal flow neither the notice nor
# the block ever happens.
# The two phase values are compared in one server process: the same status
# call before the trace is opened (phase empty) and after it (phase Triage),
# with the ritual state the same (nothing recorded). Then reason_plan is
# recorded (its model answer from anthropic_stub, a RESULT block in the
# shape trudi asks for) and an evidence tool still runs.
case_id: P1023-004
problem: P1023
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "`start_execution_log`로 기록을 여는 것은 서버 지침이 모든 조사의 첫 단계로 정한 정상 흐름이고, 이때 단계 값은 늘 Triage가 된다. 조건은 따로 만들 것이 없다."
coverage: "partial: the plan's model answer comes from anthropic_stub; the empty-phase side is shown before the trace is opened, the only server state with an empty phase"
coverage_ko: "계획 도구의 모델 응답은 가짜 Anthropic API로 만든다. 단계 값이 빈 쪽은 서버에서 그 값이 비는 유일한 상태인 기록을 열기 전으로 보인다."
summary: The same enrich_enrichment_status call carries the dair_notice "the Triage ritual has not started" before the trace is opened (empty phase) but not after misc_start_execution_log (phase Triage) although nothing of the ritual was recorded in between, and after reason_plan is recorded strings_grep still runs, because the nudge and its block only act on an empty phase that a started trace never has.
summary_ko: "같은 `enrich_enrichment_status` 호출에 기록을 열기 전(단계 값 비움)에는 \"Triage ritual has not started\"라는 `dair_notice`가 붙지만 `misc_start_execution_log` 뒤(단계 Triage)에는 붙지 않는다. 그 사이 절차는 하나도 기록되지 않았다. `reason_plan`을 기록한 뒤에도 `strings_grep`이 막히지 않고 실행된다. 안내와 차단이 단계 값이 빈 상태에서만 동작하는데 연 기록은 늘 Triage이기 때문이다."
defect_ko: "이 서버는 DAIR 절차 안내와 `reason_plan` 뒤 증거 도구 차단을 단계 값이 빈 경우에만 적용하는데, 기록을 열면 단계가 Triage로 정해져 정상 흐름에서는 둘 다 동작하지 않는다. 절차가 시작되지 않았거나 계획만 있고 DAIR가 아직 호출되지 않았으면, 단계 값과 상관없이 안내하거나 증거 도구를 막아야 한다. 모델은 안내가 없으니 절차를 따르고 있다고 알고 DAIR 없이 증거 도구를 계속 돌린다."
setup_ko: "증거 폴더에 사용자 임시 폴더의 설치 로그 하나를 둔다. 기록을 열기 전과 연 뒤에 같은 상태 조회 도구를 부르고, 문자열 검색 뒤 `reason_plan`(가짜 Anthropic API가 계획을 돌려준다)을 기록한 다음 다른 문자열 검색을 부른다."
anthropic_stub:
  responses:
  # reason_plan: the RESULT block shape trudi asks for (_result_suffix("reason_plan")).
  - "1. Likely scenario: a user-run downloader dropped update.exe in %TEMP%.\n2. Examine the Temp folder, Prefetch and Amcache first.\n3. Hunt T1105 and T1204.002.\n4. Disk artifacts, then enrichment.\n5. A service install would raise persistence to the top.\n\nRESULT:\n{\"schema_version\": 1, \"rationale\": \"Downloader in user Temp; confirm execution and origin.\", \"directives\": {\"priority_tools\": [\"ez.pecmd\", \"ez.amcacheparser\", \"strings.grep\"], \"skip_tools\": [], \"focus_pids\": [], \"focus_paths\": [\"C:/Users/jdoe/AppData/Local/Temp\"], \"max_depth\": 2, \"next_hypothesis_triggers\": []}}"
fixture:
- path: cases/CASE-001/analysis
  root: outside
  dir: true
- path: C/Users/jdoe/AppData/Local/Temp/install.log
  text: "2026-11-19 08:14:02 Downloading update package from http://198.51.100.23/pkg/update.bin\r\n2026-11-19 08:14:05 Saved C:\\Users\\jdoe\\AppData\\Local\\Temp\\update.exe\r\n2026-11-19 08:14:06 Launching update.exe /silent\r\n"
steps:
- tool: enrich_enrichment_status
  note_ko: "대조 호출: 기록을 열기 전(단계 값 비움)에 상태를 조회한다"
- tool: misc_start_execution_log
  note_ko: "기록을 연다(단계 값이 Triage가 된다)"
  args:
    case_id: CASE-001
    output_path: ${OUTSIDE}/cases/CASE-001/analysis/CASE-001_trace.json
    case_dir: ${OUTSIDE}/cases/CASE-001
    launch_dashboard: false
- tool: enrich_enrichment_status
  note_ko: "결함 호출: 같은 상태 조회를 단계 Triage에서 부른다(절차는 아직 아무것도 없음)"
- tool: strings_grep
  note_ko: "준비: 계획에 넣을 첫 검색(call_id 4)"
  args:
    file_path: ${EVIDENCE}/C/Users/jdoe/AppData/Local/Temp/install.log
    pattern: update
- tool: reason_plan
  note_ko: "준비: 조사 계획을 기록한다(가짜 API 응답)"
  args:
    case_description: "WKSTN-07: user jdoe ran an unexpected update.exe from %TEMP% on 2026-11-19."
    evidence_available: "install.log: download from http://198.51.100.23/pkg/update.bin, saved and launched update.exe /silent"
    case_question: "Did update.exe from 198.51.100.23 execute on WKSTN-07 and what did it do?"
    input_call_ids: [4]
- tool: strings_grep
  note_ko: "결함 호출: 계획 뒤, DAIR 호출 없이 증거 도구를 부른다"
  args:
    file_path: ${EVIDENCE}/C/Users/jdoe/AppData/Local/Temp/install.log
    pattern: 198\.51\.100\.23
expect:
- step: 1
  note_ko: 단계 값이 빈 상태에서는 절차가 시작되지 않았다는 안내가 붙는다
  contains: '"dair_notice": "DAIR PROTOCOL: the Triage ritual has not started.'
- step: 2
  note_ko: 새 기록이 열린다
  regex: '"success": true, "case_id": "CASE-001", "log_path": "[^"]*", "entries_recovered": 0'
- step: 3
  note_ko: 단계 Triage에서는 절차가 여전히 시작되지 않았는데 같은 호출에 안내가 없다
  not_contains: dair_notice
- step: 3
  note_ko: 같은 상태 조회가 정상으로 돌아온다(대조 대상이 같은 응답임을 확인)
  contains: '"virustotal": false, "abuseipdb": false'
- step: 5
  note_ko: 조사 계획이 기록된다
  regex: '"success": true'
- step: 6
  note_ko: 계획 뒤 DAIR 호출이 없는데도 증거 도구가 막히지 않고 실행된다
  regex: '"_trudi_call_id": \d+, "success": true, "file": "[^"]*install.log", "pattern": "198\\\\.51\\\\.100\\\\.23", "match_count": 1'
- file_regex: ${OUTSIDE}/cases/CASE-001/analysis/CASE-001_trace.json
  note_ko: trace에 계획(reason_plan)이 성공으로 남는다
  pattern: '"type": "reason_call",\s+"ts": "[^"]*",\s+"tool": "reason_plan"'
- file_not_contains: ${OUTSIDE}/cases/CASE-001/analysis/CASE-001_trace.json
  note_ko: trace에 증거 도구 차단 기록이 없다
  text: dair_engagement_gate
