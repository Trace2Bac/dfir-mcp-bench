# Matrix case P4101-031: misc_capa_analyze runs capa -j and then writes the
# JSON to output_path itself. When that write fails (here the folder
# analysis/capa does not exist yet; this tool does not create it), the error
# goes into write_error only and the result keeps success true, with no
# output_path in it.
# USER is set because capa (vivisect) calls getpass.getuser(), which fails
# for the container's host uid that has no passwd entry; on a real host the
# account exists.
case_id: P4101-031
problem: P4101
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "보고서를 도구별 하위 폴더(analysis/capa 등)에 두는 것은 흔하고, trudi의 다른 도구는 output_dir을 만들어 주지만 이 도구는 폴더를 만들지 않는다."
coverage: full
summary: capa analyzes a small PE and misc_capa_analyze is asked to save the JSON report to analysis/capa/updater.json; the write fails (No such file or directory) and the result still says success true, with the error only in write_error, and read_output then finds no report.
summary_ko: "작은 PE를 capa로 분석하고 JSON 보고서를 analysis/capa/updater.json에 저장하라고 하면 쓰기가 실패하는데(No such file or directory), misc_capa_analyze는 오류를 write_error에만 넣고 success true를 돌려주며, read_output으로 보면 보고서가 없다."
defect_ko: "이 서버는 보고서 파일 쓰기 실패를 write_error 칸에만 적고 success는 참으로 둔다. 정상이라면 요청한 저장이 실패했으니 success를 거짓으로 두거나 폴더를 만들어 써야 한다. 모델은 capa 보고서가 저장됐다고 잘못 알고 나중에 그 파일을 근거로 인용한다."
setup_ko: "사용자 Downloads 폴더에 작은 Windows 실행 파일 updater.exe(setuptools의 32비트 실행기 cli-32.exe, 11,776바이트)를 넣었다. analysis/capa 폴더는 아직 없다."
env:
  USER: analyst
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # setuptools' cli-32.exe launcher (PE32 i386, 11,776 bytes, sha256
  # 32acc1bc543116cbe2cff10cb867772df2f254ff2634c870aef0b46c4b696fdb), taken
  # from the image's own setuptools; capa finds 3 capabilities in it.
  - path: Users/alice/Downloads/updater.exe
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4101-031
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: misc_capa_analyze
    note_ko: "결함 호출: capa로 분석하고 JSON 보고서를 analysis/capa에 저장한다"
    args:
      file_path: ${EVIDENCE}/Users/alice/Downloads/updater.exe
      output_path: ${DB_DIR}/analysis/capa/updater.json
    timeout_s: 300
  - tool: read_output
    note_ko: "비교 호출: 저장됐다는 보고서를 읽는다"
    args:
      path: ${DB_DIR}/analysis/capa/updater.json
expect:
  - step: 2
    note_ko: "보고서 쓰기는 실패했다"
    regex: "\"write_error\":\\s*\"\\[Errno 2\\] No such file or directory"
  - step: 2
    note_ko: "그런데 결과는 success true다"
    regex: "^\\{\"success\":\\s*true"
  - step: 2
    note_ko: "capa 분석 자체는 끝났다(JSON 결과가 stdout에 있다)"
    contains: "32acc1bc543116cbe2cff10cb867772df2f254ff2634c870aef0b46c4b696fdb"
  - step: 3
    note_ko: "보고서 파일은 없다"
    regex: "\"success\":\\s*false[\\s\\S]*file not found"
