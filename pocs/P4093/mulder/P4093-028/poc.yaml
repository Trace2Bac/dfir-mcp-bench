summary: >-
  On a DCIM folder with two iPhone photos, one of which the server user
  cannot open, run_exiftool returns success while exiftool exited 1; the
  indexed output has the first photo's GPS and time and only
  "Error opening file" for IMG_0413.JPG, and the response does not say a file
  was skipped.
summary_ko: "iPhone 사진 두 장 중 한 장을 서버 사용자가 열 수 없는 DCIM 폴더에 `run_exiftool`을 부르면, exiftool은 종료 코드 1로 끝났는데 응답은 success다. 적재된 출력에는 첫 사진의 GPS·시각만 있고 IMG_0413.JPG에는 `Error opening file`만 있다."
defect_ko: "이 서버는 exiftool이 0이 아닌 코드로 끝나도 출력이 조금이라도 있으면 종료 코드를 버리고 완전한 결과처럼 success를 돌려준다. 정상이라면 일부 파일을 읽지 못했다고 상태로 알려야 한다. 모델은 폴더의 사진 메타데이터를 모두 받았다고 믿고, 23:41 인천 위치가 찍힌 두 번째 사진의 정보가 없다는 것을 놓친다."
setup_ko: "서울(14:22)과 인천공항 부근(23:41)에서 찍힌 iPhone 사진 두 장이 든 DCIM 폴더를 넣고, 두 번째 사진은 서버 사용자가 읽을 수 없게 했다."
