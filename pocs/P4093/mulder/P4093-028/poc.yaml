# Matrix case P4093-028: run_cli_tool (used by run_exiftool, run_strings,
# run_hashdeep and others) turns a nonzero exit into an error only when the
# tool wrote nothing to stdout. exiftool exits 1 when it cannot open one of
# the files under a folder, but it still prints the others, so run_exiftool
# returns success as if every file had been read.
# The two JPEGs were made with Pillow 12.3.0 and tagged with ExifTool 12.40
# in the server image (Apple iPhone 12, DateTimeOriginal, GPS). The second
# photo was root-owned 0600 in the collection; the fixture cannot chown, so
# it is mode 0000, which the server user (uid 1000) cannot open either.
