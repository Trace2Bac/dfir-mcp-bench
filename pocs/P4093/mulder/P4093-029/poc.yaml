  - tool: run_chainsaw
    note_ko: "결함 호출: 검색어를 바꿔 `MiniDumpWriteDump`로 다시 검색"
    args:
      evidence_path: ${EVIDENCE}/Logs
      mode: search
      search_term: MiniDumpWriteDump
  - tool: get_raw_output
    note_ko: "건너뛴 응답이 가리키는 `chainsaw.search` 원문 보기"
    args:
      source_name: chainsaw.search
  - tool: run_chainsaw
    note_ko: "비교 호출: 같은 검색을 `force=True`로"
    args:
      evidence_path: ${EVIDENCE}/Logs
      mode: search
      search_term: MiniDumpWriteDump
      force: true
expect:
  - step: 2
    note_ko: "`mimikatz` 검색은 0건이다"
    regex: 'total_findings\\": 0\b'
  - step: 3
    note_ko: "새 검색어 호출이 최상위 success다"
    regex: '^\{\s*"tool_call_id": "[^"]+",\s*"status": "success"'
  - step: 3
    note_ko: "실행하지 않고 건너뛰었고, 앞 검색의 `chainsaw.search`를 가리킨다"
    regex: 'status\\": \\"skipped[\s\S]*existing_sources\\": \[\\"chainsaw.search'
  - step: 4
    note_ko: "그 source에는 0건 결과만 있다"
    contains: "Total findings: 0"
  - step: 5
    note_ko: "`force=True`로 실행하면 1건이 나온다"
    regex: 'total_findings\\": 1\b'
