# Matrix case P4093-029: the extraction tools skip a run when any source with
# their prefix already exists for the same evidence path, without looking at
# what that source holds. run_chainsaw checks the prefix "chainsaw." for every
# mode, so after one search, a search for a different term is not run: the
# response is top-level success with status skipped and points to the first
# search's source, which holds 0 findings.
case_id: P4093-029
problem: P4093
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "Chainsaw search로 검색어를 바꿔 가며 여러 번 찾는 것은 흔한 사냥 방식이고, 첫 검색어가 맞지 않으면 다음 검색어로 다시 부르는 것은 당연한 흐름이다."
coverage: "partial: run_chainsaw only; the other 15 extraction tools and run_volatility_batch are not run"
coverage_ko: "`run_chainsaw`만 보였다. 나머지 추출 도구 15개와 `run_volatility_batch`는 돌리지 않았다."
summary: >-
  After run_chainsaw mode=search for 'mimikatz' returns 0 findings on a
  PowerShell Operational log, run_chainsaw mode=search for
  'MiniDumpWriteDump' returns top-level success with status skipped and
  existing_sources chainsaw.search, whose text has Total findings: 0; with
  force=True the same search finds the lsass dump script block.
summary_ko: "PowerShell Operational 로그에 `run_chainsaw`를 `mode=search`, `mimikatz`로 불러 0건이 나온 뒤 `MiniDumpWriteDump`로 다시 부르면 최상위 success에 `status: skipped`와 `existing_sources: chainsaw.search`가 온다. 그 source에는 `Total findings: 0`만 있다. `force=True`로 같은 검색을 하면 lsass 덤프 스크립트 블록이 나온다."
defect_ko: "이 서버는 같은 증거에 `chainsaw.`로 시작하는 source가 하나라도 있으면, 그 source가 다른 검색어의 0건 결과여도 실행을 건너뛰고 최상위 success를 돌려준다. 정상이라면 새 검색어로 실행하거나, 적어도 요청한 검색은 실행되지 않았다고 실패로 알려야 한다. 모델은 이미 적재된 `chainsaw.search`가 이번 검색 결과라고 믿고 `MiniDumpWriteDump` 흔적이 없다고 잘못 안다."
setup_ko: "lsass를 MiniDumpWriteDump로 덤프하는 스크립트 블록(4104)이 든 공개 샘플 PowerShell Operational 로그를 넣었다. 로그에 `mimikatz`라는 글자는 없다."
