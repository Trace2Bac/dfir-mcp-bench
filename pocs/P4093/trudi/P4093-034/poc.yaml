# Matrix case P4093-034: enrich_vt_lookup_hash treats only HTTP 404 as a
# special case. Any other error response from VirusTotal (401 for a revoked
# or mistyped key, 429 when the free quota runs out) is parsed as a file
# report with no analysis stats, so the tool answers success, found true and
# malicious 0. enrich_vt_lookup_ip and enrich_abuseipdb_check do not look at
# the status code at all.
# The calls go to the real VirusTotal and AbuseIPDB APIs (the container needs
# network access) with a key that the services reject; the 401 bodies are the
# services' own.
case_id: P4093-034
problem: P4093
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "API 키는 만료·폐기·교체되고 무료 키는 하루·분당 한도가 작아 조사 중간에 401·429가 나는 일이 있으며, 서버는 키가 설정돼 있으면 그대로 요청한다."
coverage: "partial: shown with 401 (rejected key) from the live services; 429 (quota) goes through the same code but is not triggered here; vt_lookup_domain is not called"
coverage_ko: "거부된 키의 401만 실제 서비스로 보였다. 한도 초과 429는 같은 코드를 지나지만 여기서 일으키지 않았고 vt_lookup_domain은 부르지 않았다."
summary: With a VirusTotal key the service rejects (HTTP 401), enrich_vt_lookup_hash on the EICAR test file's SHA-256 answers success, found true, malicious 0 and total_engines 0; enrich_vt_lookup_ip and enrich_abuseipdb_check likewise answer success with empty reputation fields.
summary_ko: "VirusTotal이 거부하는 키(HTTP 401)로 EICAR 시험 파일의 SHA-256을 enrich_vt_lookup_hash로 조회하면 success, found true, malicious 0, total_engines 0이 나오고, enrich_vt_lookup_ip와 enrich_abuseipdb_check도 평판 칸이 빈 채 성공으로 답한다."
defect_ko: "이 서버는 404만 따로 보고 401·429 같은 오류 응답도 정상 보고서처럼 읽어 success, found true, malicious 0을 채운다. 정상이라면 HTTP 상태가 200이 아니면 실패와 오류 내용(키 거부, 한도 초과)을 돌려줘야 한다. 모델은 해시가 VirusTotal에 있고 어느 엔진도 악성으로 보지 않았다고 잘못 안다."
setup_ko: "VirusTotal·AbuseIPDB 키를 설정했지만 서비스가 받아 주지 않는 키(폐기된 키와 같은 상태)다. 조회 대상은 모든 백신이 탐지하는 EICAR 시험 파일의 SHA-256이다."
env:
  # 64-hex keys of the shape both services issue; neither service accepts them.
  VIRUSTOTAL_API_KEY: 3f9c2a7d1e8b4c6f0a5d9e2b7c1f4a8d6e3b0c9f2a5d8e1b4c7f0a3d6e9b2c5f
  ABUSEIPDB_API_KEY: 8e1b4c7f0a3d6e9b2c5f3f9c2a7d1e8b4c6f0a5d9e2b7c1f4a8d6e3b0c9f2a5d1a2b3c4d5e6f7a8b
fixture:
  - path: analysis/.keep
    root: db
    text: ""
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4093-034
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: enrich_vt_lookup_hash
    note_ko: "결함 호출: EICAR 시험 파일 해시를 VirusTotal에서 조회한다"
    args:
      file_hash: 275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f
  - tool: enrich_vt_lookup_ip
    note_ko: "결함 호출: IP를 VirusTotal에서 조회한다"
    args:
      ip_address: 185.220.101.1
  - tool: enrich_abuseipdb_check
    note_ko: "결함 호출: 같은 IP를 AbuseIPDB에서 조회한다"
    args:
      ip_address: 185.220.101.1
expect:
  - step: 2
    note_ko: "키가 거부됐는데 해시 조회는 성공으로 끝난다"
    regex: "\"success\":\\s*true"
  - step: 2
    note_ko: "해시가 VirusTotal에 있다고 답한다"
    regex: "\"found\":\\s*true"
  - step: 2
    note_ko: "악성 판정 0, 검사 엔진 0으로 채운다"
    regex: "\"malicious\":\\s*0\\b[\\s\\S]*\"total_engines\":\\s*0\\b"
  - step: 3
    note_ko: "IP 조회도 성공으로 끝나고 평판 칸이 비어 있다"
    regex: "\"success\":\\s*true[\\s\\S]*\"malicious\":\\s*0\\b[\\s\\S]*\"country\":\\s*null"
  - step: 4
    note_ko: "AbuseIPDB도 성공으로 끝나고 점수가 비어 있다"
    regex: "\"success\":\\s*true[\\s\\S]*\"abuse_confidence_score\":\\s*null"
