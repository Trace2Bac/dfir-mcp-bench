    args:
      case_id: P4093-034
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: misc_batch_run
    note_ko: "준비: 평판 서비스 대역 프록시를 띄운다"
    args:
      tool_calls:
        - cmd: ["sh", "-c", "python3 ${OUTSIDE}/recorder.py ${OUTSIDE}/received.log ${OUTSIDE}/cert.pem ${OUTSIDE}/key.pem >/dev/null 2>&1 & sleep 1"]
  - tool: enrich_vt_lookup_hash
    note_ko: "결함 호출: EICAR 시험 파일 해시를 VirusTotal에서 조회한다"
    args:
      file_hash: 275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f
  - tool: enrich_vt_lookup_ip
    note_ko: "결함 호출: IP를 VirusTotal에서 조회한다"
    args:
      ip_address: 185.220.101.1
  - tool: enrich_abuseipdb_check
    note_ko: "결함 호출: 같은 IP를 AbuseIPDB에서 조회한다"
    args:
      ip_address: 185.220.101.1
  - tool: misc_batch_run
    note_ko: "확인: 대역 프록시가 받은 요청 기록을 읽는다"
    args:
      tool_calls:
        - cmd: ["cat", "${OUTSIDE}/received.log"]
