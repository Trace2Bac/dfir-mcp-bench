# Matrix case P4093-034: enrich_vt_lookup_hash treats only HTTP 404 as a
# special case. Any other error response from VirusTotal (401 for a revoked
# or mistyped key, 429 when the free quota runs out) is parsed as a file
# report with no analysis stats, so the tool answers success, found true and
# malicious 0. enrich_vt_lookup_ip and enrich_abuseipdb_check do not look at
# the status code at all.
# No request leaves the container: HTTPS_PROXY points httpx at a stand-in
# proxy on 127.0.0.1:18443 (outside/recorder.py, started by the first
# batch_run), which ends TLS with its own certificate (SSL_CERT_FILE), logs
# what it is sent and answers 401 with the services' own bodies for a
# rejected key. The API keys are fake.
case_id: P4093-034
problem: P4093
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "API 키는 만료·폐기·교체되고 무료 키는 하루·분당 한도가 작아 조사 중간에 401·429가 나는 일이 있으며, 서버는 키가 설정돼 있으면 그대로 요청한다."
coverage: "partial: shown with 401 (rejected key) from a local stand-in that returns the real services' 401 bodies; 429 (quota) goes through the same code but is not triggered here; vt_lookup_domain is not called"
coverage_ko: "거부된 키의 401만 보였다. 외부 서비스는 실제 서비스의 401 응답 본문을 돌려주는 로컬 대역이다. 한도 초과 429는 같은 코드를 지나지만 여기서 일으키지 않았고 vt_lookup_domain은 부르지 않았다."
summary: With a VirusTotal key the service rejects (HTTP 401), enrich_vt_lookup_hash on the EICAR test file's SHA-256 answers success, found true, malicious 0 and total_engines 0; enrich_vt_lookup_ip and enrich_abuseipdb_check likewise answer success with empty reputation fields.
summary_ko: "VirusTotal이 거부하는 키(HTTP 401)로 EICAR 시험 파일의 SHA-256을 enrich_vt_lookup_hash로 조회하면 success, found true, malicious 0, total_engines 0이 나오고, enrich_vt_lookup_ip와 enrich_abuseipdb_check도 평판 칸이 빈 채 성공으로 답한다."
defect_ko: "이 서버는 404만 따로 보고 401·429 같은 오류 응답도 정상 보고서처럼 읽어 success, found true, malicious 0을 채운다. 정상이라면 HTTP 상태가 200이 아니면 실패와 오류 내용(키 거부, 한도 초과)을 돌려줘야 한다. 모델은 해시가 VirusTotal에 있고 어느 엔진도 악성으로 보지 않았다고 잘못 안다."
setup_ko: "VirusTotal·AbuseIPDB 키를 설정했지만 서비스가 받아 주지 않는 키(폐기된 키와 같은 상태)다. 서버의 HTTPS 요청은 컨테이너 안 대역 프록시(127.0.0.1:18443)로 가고, 대역은 받은 요청을 기록하고 실제 서비스가 거부된 키에 돌려주는 401 본문으로 답한다. 조회 대상은 모든 백신이 탐지하는 EICAR 시험 파일의 SHA-256이다."
