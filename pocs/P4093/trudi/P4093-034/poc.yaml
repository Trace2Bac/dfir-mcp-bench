  - path: recorder.py
    root: outside
    text: |
      # Stand-in for the reputation services: an HTTPS proxy on 127.0.0.1:18443
      # that answers CONNECT, ends TLS with its own certificate (trusted by the
      # server through SSL_CERT_FILE), logs the request it is sent and answers
      # 401 with the body the real service sends for a rejected key (taken from
      # www.virustotal.com and api.abuseipdb.com on 2026-11-28). Nothing is
      # forwarded.
      import socket, ssl, sys, time
      log = open(sys.argv[1], "w")
      ctx = ssl.create_default_context(ssl.Purpose.CLIENT_AUTH)
      ctx.load_cert_chain(sys.argv[2], sys.argv[3])
      srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
      srv.bind(("127.0.0.1", 18443)); srv.listen(8); srv.settimeout(5)
      end = time.time() + 90
      def head(f):
          lines = []
          while True:
              ln = f.readline()
              if not ln or ln in (b"\r\n", b"\n"):
                  return lines
              lines.append(ln.decode(errors="replace").rstrip())
      while time.time() < end:
          try:
              c, _ = srv.accept()
          except socket.timeout:
              continue
          try:
              f = c.makefile("rb")
              connect = head(f)
              log.write(f"proxy: {connect[0]}\n")
              c.sendall(b"HTTP/1.1 200 Connection established\r\n\r\n")
              t = ctx.wrap_socket(c, server_side=True)
              req = head(t.makefile("rb"))
              for ln in req:
                  if not ln.lower().startswith(("accept", "user-agent", "connection")):
                      log.write(f"  {ln}\n")
              log.flush()
              if "abuseipdb" in connect[0]:
                  body = (b'{"errors":[{"detail":"Authentication failed. Your API key is either missing,'
                          b' incorrect, or revoked. Note: The APIv2 key differs from the APIv1 key.","status":401}]}')
              else:
                  body = b'{"error": {"code": "WrongCredentialsError", "message": "Wrong API key"}}'
              t.sendall(b"HTTP/1.1 401 Unauthorized\r\nContent-Type: application/json\r\nContent-Length: "
                        + str(len(body)).encode() + b"\r\nConnection: close\r\n\r\n" + body)
              log.write("  answered: 401 Unauthorized\n"); log.flush()
              t.close()
          except Exception as e:
              log.write(f"error: {e}\n"); log.flush()
