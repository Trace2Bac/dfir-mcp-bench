# Matrix case P1030-002: a file that matches none of _match_artifact's name
# rules (here an E01 disk image) is left out of the inventory and of the
# coverage table, and assess_coverage does not report it as not assessed.
# Next to an examined auth.log, the verdict is COVERAGE CLEAN with no mention
# of disk.E01.
# disk.E01 is a real EWF (EnCase 6) image of a 4 MiB disk with an MBR and one
# Linux partition, written by ewfacquirestream 20240506 and checked with
# ewfverify; assess_coverage never opens it.
case_id: P1030-002
problem: P1030
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: common
realism_ko: "E01은 디스크 증거의 표준 형식이라 로그와 함께 사건 폴더에 들어 있는 일이 흔하다."
coverage: full
summary: list_evidence shows disk.E01 next to auth.log; after auth_summary, assess_coverage lists only the auth log and returns COVERAGE CLEAN, with disk.E01 nowhere in the response.
summary_ko: "`list_evidence`는 `auth.log` 옆에 `disk.E01`이 있다고 보인다. `auth_summary` 뒤 `assess_coverage`는 인증 로그만 표에 올리고 `COVERAGE CLEAN`을 내며, 응답 어디에도 `disk.E01`이 없다."
defect_ko: "이 서버의 `assess_coverage`는 이름 규칙에 맞지 않는 E01 디스크 이미지를 목록에서 빼고, 평가하지 않은 자료가 있다고 알리지 않는다. 표에 넣지 못한 파일을 평가하지 않은 자료로 보여야 한다. 모델은 디스크 이미지까지 포함해 모든 증거를 조사했다고 잘못 안다."
setup_ko: "증거 폴더에 공격 흔적이 든 `auth.log`와, `ewfacquirestream`으로 받은 실제 E01 디스크 이미지(`disk.E01`)를 두었다."
fixture:
  - path: auth.log
    text: |
      Mar  3 02:11:04 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:07 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:10 web01 sshd[2214]: Invalid user admin from 203.0.113.7 port 51040
      Mar  3 02:11:12 web01 sshd[2214]: Failed password for invalid user admin from 203.0.113.7 port 51040 ssh2
      Mar  3 02:12:30 web01 sshd[2230]: Accepted password for root from 203.0.113.7 port 51102 ssh2
  - path: disk.E01
    base64: 
steps:
  - tool: list_evidence
    note_ko: "증거 폴더에 무엇이 있는지 본다"
    args: {}
  - tool: auth_summary
    note_ko: "인증 로그를 분석한다"
    args:
      path: ${EVIDENCE}/auth.log
  - tool: assess_coverage
    note_ko: "결함 호출: 조사 범위 점검"
    args: {}
expect:
  - step: 1
    note_ko: "증거 폴더에 E01 디스크 이미지가 있다"
    contains: "disk.E01"
  - step: 3
    note_ko: "인증 로그는 검사한 것으로 표에 오른다"
    contains: "| auth log (SSH / sudo / useradd) | `auth.log` | ✅ examined |"
  - step: 3
    note_ko: "조사 범위에 빈틈이 없다고 판정한다"
    contains: "**Verdict: COVERAGE CLEAN**"
  - step: 3
    note_ko: "응답 어디에도 E01 디스크 이미지가 없다"
    not_contains: "disk.E01"
