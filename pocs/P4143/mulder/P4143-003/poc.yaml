# Matrix case P4143-003 (run_zeek_analysis part): each Zeek log is indexed as
# its first 50,000 characters (pcap.py 1180) and nothing records the cut; the
# response says "Full output indexed as 'zeek.summary'" and reports Zeek's
# record_count for the whole log. Here dns.log has 360 records, 30 of them
# notable, but zeek.dns keeps about 110: the 30 TXT queries to
# s.cdn-sync.example at the end of the capture are not in the case at all,
# and search finds nothing for them.
#
# The capture (written for this PoC, real pcap format) is ws0142 asking its
# resolver 10.0.2.1 for 330 everyday names over about 30 minutes, then 30 TXT
# queries whose labels carry base32 data to s.cdn-sync.example.
case_id: P4143-003
problem: P4143
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: source-vs-result
level: mcp
realism: common
realism_ko: "mulder의 Zeek는 JSON 로그를 쓰므로 DNS 질의 140건 남짓이면 dns.log가 50,000자를 넘는다. 워크스테이션 하나의 30분짜리 캡처도 그만큼은 되고, 공격 흔적은 캡처의 뒤쪽에 있기 쉽다."
coverage: "partial: run_zeek_analysis only; the other cuts named in the case (run_bulk_extractor, run_tcpflow, run_suricata, query_sqlite_from_image, extract_file_by_inode, index_app_files) are not run"
coverage_ko: "`run_zeek_analysis`만 확인했다. 사례에 적힌 다른 도구(`run_bulk_extractor`·`run_tcpflow`·`run_suricata`·`query_sqlite_from_image`·`extract_file_by_inode`·`index_app_files`)의 자르기는 돌리지 않았다."
summary: >-
  run_zeek_analysis reports dns record_count 360 (notable_count 30) and says
  the full output is indexed, but zeek.dns holds about 110 lines, the first
  50,000 characters; the 30 tunnelling queries to s.cdn-sync.example at the
  end of the capture are not indexed and search for cdn-sync returns 0
  matches.
summary_ko: "`run_zeek_analysis`는 dns 레코드 360건(주목할 것 30건)이라 하고 전체 출력을 색인했다고 안내하지만, `zeek.dns`에는 앞 50,000자인 110줄 남짓만 있다. 캡처 끝의 `s.cdn-sync.example` 터널링 질의 30건은 적재되지 않아 `search`로 cdn-sync를 찾으면 0건이다."
defect_ko: "이 서버는 Zeek 로그를 앞 50,000자만 적재하면서 잘림을 기록하지 않고, 응답은 전체 출력을 색인했다며 원래 레코드 수를 싣는다. 정상이라면 전체를 적재하거나, 잘랐다면 source와 응답에 잘린 사실과 적재한 건수를 남겨야 한다. 모델은 `zeek.dns`를 캡처의 DNS 전체로 믿고, 검색 0건을 보고 DNS 터널링이 없었다고 결론짓는다."
setup_ko: "워크스테이션 ws0142가 내부 리졸버에 일상적인 이름 330건을 묻고, 이어서 `s.cdn-sync.example`로 데이터를 실은 TXT 질의 30건을 보내는 캡처(pcap)를 두고 `run_zeek_analysis`를 돌렸다."
fixture:
  - path: ws0142/capture.pcap
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: ws0142-dns
  - tool: run_zeek_analysis
    note_ko: "결함 호출: Zeek 로그 적재"
    args:
      pcap_path: ${EVIDENCE}/ws0142/capture.pcap
  - tool: list_sources
    note_ko: "비교 호출: 적재된 source의 줄 수"
  - tool: search
    note_ko: "비교 호출: 캡처 끝의 터널링 도메인 찾기"
    args:
      query: cdn-sync
expect:
  - step: 2
    note_ko: "응답은 dns 레코드 360건, 주목할 것 30건이라 한다"
    regex: 'log_type\\": \\"dns\\", \\"record_count\\": 360, [^}]*\\"notable_count\\": 30'
  - step: 2
    note_ko: "응답은 전체 출력을 색인했다고 안내한다"
    contains: "Full output indexed as 'zeek.summary'"
  - step: 3
    note_ko: "적재된 `zeek.dns`는 360건이 아니라 100여 줄이다"
    regex: '"source_name": "zeek.dns",[^}]*"line_count": 1[01]\d,'
  - step: 4
    note_ko: "캡처에 있는 cdn-sync 질의가 사건 어디에서도 검색되지 않는다"
    regex: '"result_count": 0,\s*"total_matches": 0'
