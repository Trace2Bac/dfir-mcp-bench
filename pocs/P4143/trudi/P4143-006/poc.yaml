        -----END CERTIFICATE-----
      client_private_key: |
        -----BEGIN RSA PRIVATE KEY-----
        MIIEpAIBAAKCAQEAwz3y0K4Yk1o2q0bq8F2W3x8c5ZpA6m7kJ1Yt2eS9iP0nH4dL
        -----END RSA PRIVATE KEY-----
      api_connection_string: velo-server:8001
