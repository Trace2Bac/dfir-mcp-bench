steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4143-006
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: velo_get_collection_results
    note_ko: "결함 호출: 끝난 프로세스 목록 수집의 행을 받는다(_trudi_call_id 3)"
    args:
      client_id: C.4f2a9e1b7c3d5e60
      flow_id: F.CT3K9Q1M2V8RA
      artifact: Windows.System.Pslist
  - tool: read_output
    note_ko: "비교 호출: trace에 기록된 그 호출의 출력 길이와 사이드카 경로를 본다"
    args:
      path: ${DB_DIR}/analysis/trace.json
      query: stdout_chars stdout_path stdout_partial
  - tool: read_output
    note_ko: "비교 호출: 전체 출력이라는 사이드카에서 rundll32를 찾는다"
    args:
      path: ${DB_DIR}/analysis/.tool_output/3.txt
      query: rundll32
  - tool: velo_query
    note_ko: "비교 호출: 같은 수집을 이름으로 걸러 조회한다"
    args:
      vql: "SELECT * FROM source(client_id=\"C.4f2a9e1b7c3d5e60\", flow_id=\"F.CT3K9Q1M2V8RA\", artifact=\"Windows.System.Pslist\") WHERE Name =~ 'rundll32'"
expect:
  - step: 2
    note_ko: "응답은 호출 3으로 기록됐다"
    contains: "\"_trudi_call_id\": 3"
  - step: 3
    note_ko: "trace는 그 호출의 출력 길이를 잘린 길이 51,200자로, 사이드카를 .tool_output/3.txt로 기록한다"
    regex: "stdout_chars.{1,3}: 51200,[\\s\\S]*stdout_path.{1,3}: .{1,3}[^\"]*/analysis/\\.tool_output/3\\.txt"
  - step: 3
    note_ko: "사이드카가 잘렸다는 stdout_partial은 없다"
    not_regex: "stdout_partial.{1,3}: true"
  - step: 4
    note_ko: "전체 출력이라는 사이드카에서 rundll32를 찾으면 아무것도 없다"
    regex: "\"query\": \"rundll32\"[\\s\\S]*\"body\": \"\""
  - step: 5
    note_ko: "같은 수집에는 rundll32.exe가 있다(사이드카가 잘려 빠졌다)"
    contains: "msupdate.dll,DllRegisterServer"

