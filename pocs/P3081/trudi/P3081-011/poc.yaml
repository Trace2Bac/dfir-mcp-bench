# Matrix case P3081-011: tcpxtract_streams starts a detached job
# (core/jobs.py start_job) and returns its handle at once without a
# _trudi_call_id, so the middleware writes its baseline entry
# "<py>:net_tcpxtract_streams" with success true at that moment
# (core/middleware.py _trace_success_baseline). The job's own outcome is
# recorded only when misc_job_status collects it; until the model calls
# job_status, a failed carve stays in the trace as a success.
# Here the model gives a pcap path that does not exist (.pcapng for the
# .pcap in evidence). The job id is random and the runner cannot pass it to
# a later step, so the job's own exit file is not read; the same tcpxtract
# command is run directly with misc_batch_run instead, to show that it
# fails. trudi runs the job as `sudo timeout 1800 tcpxtract ...`; the image
# has no sudo, so ${STUBS}/sudo only runs the command it is given.
# tcpxtract is the real one.
case_id: P3081-011
problem: P3081
server: trudi
variant: trudi-88fbca7-fastmcp3
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "pcap 파일 이름이나 확장자(.pcap, .pcapng)를 잘못 적는 것은 흔한 모델 실수이고, 분리 실행 작업은 30분 넘게 돌 수 있어 모델이 job_status를 끝까지 부르지 않고 넘어가는 일도 생긴다. 실제 운영에서는 1800초 시간 제한에 걸린 작업(종료 코드 124)도 같은 경로를 탄다."
coverage: "partial: the failure of the job is shown by running the same tcpxtract command directly (batch_run), because the runner cannot pass the random job_id to misc_job_status or read the job's exit file"
coverage_ko: "실행기가 무작위 job_id를 다음 단계에 넘기지 못해 작업의 exit 파일을 읽지 못했다. 그래서 같은 tcpxtract 명령을 batch_run으로 직접 실행해 실패하는 것을 보였다."
summary: 'net_tcpxtract_streams on a pcap path that does not exist returns a running job, and the trace records "<py>:net_tcpxtract_streams" with success true and exit_code 0; the same tcpxtract command run directly fails, and as long as misc_job_status is not called the trace has no other entry for the job.'
summary_ko: "없는 pcap 경로로 `net_tcpxtract_streams`를 부르면 실행 중인 작업 handle이 오고, trace에는 `<py>:net_tcpxtract_streams`가 `success: true`, `exit_code` 0으로 남는다. 같은 tcpxtract 명령을 직접 돌리면 실패하는데, `misc_job_status`를 부르지 않는 한 trace에는 그 작업의 다른 항목이 없다."
defect_ko: "이 서버는 분리 실행 작업을 시작한 순간 그 호출을 성공으로 기록하고, 작업이 실패해도 `job_status`가 불리기 전에는 기록을 고치지 않는다. 정상이라면 시작 시점에는 시작했다는 사실만 남기고, 끝난 결과(실패와 종료 코드)를 작업 쪽에서 기록해야 한다. 기록을 읽는 모델과 검토자는 실패한 스트림 추출을 성공한 호출로 잘못 안다."
setup_ko: "네트워크 캡처 net/beacon.pcap을 넣었다. 모델은 확장자를 잘못 적어 없는 net/beacon.pcapng를 준다."
env:
  PATH: ${STUBS}:${PATH}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: net/beacon.pcap
    hex: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3081-011
      output_path: ${DB_DIR}/analysis/P3081-011_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: net_tcpxtract_streams
    note_ko: "결함 호출: 확장자를 잘못 적은 pcap 경로로 스트림 추출 작업을 띄운다"
    args:
      pcap_file: ${EVIDENCE}/net/beacon.pcapng
      output_dir: ${DB_DIR}/analysis/tcpxtract_streams
  - tool: misc_batch_run
    note_ko: "비교 호출: 같은 tcpxtract 명령을 직접 돌려 결과를 본다"
    args:
      tool_calls:
        - cmd: [tcpxtract, -f, "${EVIDENCE}/net/beacon.pcapng", -o, "${DB_DIR}/analysis/tcpxtract_check"]
  - tool: read_output
    note_ko: "비교 호출: job_status 없이 trace에서 그 작업의 기록을 읽는다"
    args:
      path: ${DB_DIR}/analysis/P3081-011_trace.json
      query: net_tcpxtract_streams
expect:
  - step: 2
    note_ko: "작업은 실행 중으로 시작됐다"
    regex: '"success": true, "status": "running", "job_id": "net_tcpxtract_streams-[0-9a-f]{12}"'
  - step: 3
    note_ko: "같은 명령을 직접 돌리면 파일을 열지 못해 실패한다(종료 코드 2)"
    regex: '"success": false, "stdout": "", "stderr": "Couldn.t open file [^"]*/net/beacon\.pcapng: [^"]*No such file or directory", "exit_code": 2'
  - file_regex: ${DB_DIR}/analysis/P3081-011_trace.json
    note_ko: "trace에는 그 작업 호출이 성공(exit_code 0)으로 남아 있다"
    pattern: '"cmd": "<py>:net_tcpxtract_streams",\s*"success": true,\s*"truncated": false,\s*"retries": 0,\s*"exit_code": 0'
  - file_not_contains: ${DB_DIR}/analysis/P3081-011_trace.json
    note_ko: "trace에는 작업 명령(-o .../tcpxtract_streams)의 실행 결과 항목이 없다"
    text: '/analysis/tcpxtract_streams",'
