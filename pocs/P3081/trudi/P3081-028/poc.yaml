# Matrix case P3081-028: verify_evidence_hash always records a successful
# reason_call whose conclusion starts with "VERIFIED:", even when the MD5 it
# was given does not match (tools/hashing.py record_reason_call, success=True,
# conclusion f"VERIFIED: {evidence_path} sha256=..."). The trace report
# renderer (core/execution_log.py _render_entries) prints that conclusion as
# is, but the export that renders it is gated behind reason.pre_report_check
# READY_TO_REPORT, which needs the review backend; here the trace is read
# back with read_output instead. Same code as P2049-032.
case_id: P3081-028
problem: P3081
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "복사나 전송 중 손상으로 이미지 해시가 획득 기록과 다른 일은 실제로 있고, 획득 기록의 값을 옮겨 넣다 다른 증거의 값을 넣는 실수도 흔하다. 그때 바로 이 검증을 쓴다."
coverage: "partial: the trace is read back with read_output; the Markdown trace report (misc_export_execution_log) that prints the same conclusion needs reason.pre_report_check READY_TO_REPORT and was not produced"
coverage_ko: "trace는 read_output으로 다시 읽었다. 같은 결론을 그대로 찍는 Markdown 추적 보고서(misc_export_execution_log)는 reason.pre_report_check의 READY_TO_REPORT가 있어야 만들어져 만들지 않았다."
summary: 'verify_evidence_hash with an MD5 that does not match the USB image returns md5_match false and integrity_verified false, yet the trace holds a successful hash_verify_evidence_hash reason_call whose conclusion reads "VERIFIED: <path> sha256=...", and read_output on the trace returns that conclusion.'
summary_ko: "USB 이미지와 맞지 않는 MD5로 `verify_evidence_hash`를 부르면 `md5_match: false`, `integrity_verified: false`가 나오는데, trace에는 성공한 `hash_verify_evidence_hash` 기록과 \"VERIFIED: <경로> sha256=...\" 결론이 남고 `read_output`으로 trace를 읽으면 그 결론이 나온다."
defect_ko: "이 서버는 해시 대조가 실패해도 호출 기록에 성공(`success: true`)과 `VERIFIED:` 결론을 남긴다. 정상이라면 대조 실패를 실패나 불일치로 기록해야 한다. 기록을 다시 읽는 모델과 검토자는 이 증거가 무결성 검증을 통과했다고 잘못 안다."
setup_ko: "USB 이미지 usb.dd와, 원본 획득 때 기록한(지금 사본과 다른) MD5가 적힌 획득 기록 usb.dd.txt를 넣었다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # A 1 MiB raw image of a USB stick: an MBR (boot code, one FAT32 LBA
  # partition from sector 1, 55AA); the rest is zero.
  - path: usb.dd
    size: 1048576
    hex: 
  # The acquisition log written when the stick was imaged (FTK Imager format);
  # its hashes are those of the original, not of this copy.
  - path: usb.dd.txt
    text: |
      Created By AccessData® FTK® Imager 4.7.1.2

      Case Information:
      Acquired using: ADI4.7.1.2
      Case Number: 2026-0412
      Evidence Number: USB-01
      Unique description: SanDisk Cruzer Blade 16GB
      Examiner: J. Park
      Notes:

      --------------------------------------------------------------

      Information for usb.dd:

      Physical Evidentiary Item (Source) Information:
      [Device Info]
       Source Type: Physical
      [Drive Geometry]
       Bytes per Sector: 512
       Sector Count: 2,048
      [Image]
       Image Type: Raw (dd)
       Source data size: 1 MB
       Sector count:    2048
      [Computed Hashes]
       MD5 checksum:    5c2f0a2b7e4b0e1d9a3c6f8e1b2d4a70
       SHA1 checksum:   8d1e5b3a9c2f7e6d4b0a1c3e5f7092b4d6e8a1c3

      Image Information:
       Acquisition started:   Sun Apr 12 09:14:02 2026
       Acquisition finished:  Sun Apr 12 09:14:03 2026
       Segment list:
        usb.dd
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3081-028
      output_path: ${DB_DIR}/analysis/P3081-028_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: hash_verify_evidence_hash
    note_ko: "결함 호출: 획득 기록의 MD5로 이미지를 검증한다"
    args:
      evidence_path: ${EVIDENCE}/usb.dd
      expected_md5: 5c2f0a2b7e4b0e1d9a3c6f8e1b2d4a70
  - tool: read_output
    note_ko: "비교 호출: trace에서 검증 결론을 찾는다"
    args:
      path: ${DB_DIR}/analysis/P3081-028_trace.json
      query: VERIFIED
expect:
  - step: 2
    note_ko: "MD5가 맞지 않아 무결성 검증에 실패했다"
    regex: '"md5_match": false, "sha1_match": null, "integrity_verified": false'
  - step: 3
    note_ko: "trace를 다시 읽으면 그 이미지의 결론이 VERIFIED로 나온다"
    regex: 'VERIFIED: [^ ]*/evidence/usb\.dd sha256=[0-9a-f]{64}'
  - file_regex: ${DB_DIR}/analysis/P3081-028_trace.json
    note_ko: "trace의 그 기록은 성공한 hash_verify_evidence_hash reason_call이다"
    pattern: '"type": "reason_call",[^{}]*"tool": "hash_verify_evidence_hash",\s*"success": true,[^{}]*"conclusion": "VERIFIED: [^ "]*/usb\.dd sha256='
