steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P3086-006
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: strings_extract
    note_ko: "준비: 앞선 분석 호출 하나를 trace에 남긴다"
    args:
      file_path: ${EVIDENCE}/C/Windows/Prefetch/SC.EXE-945D79AE.pf
  - tool: hash_hashdeep_compute
    note_ko: "결함 호출: 해시 매니페스트를 사건 trace 경로로 쓴다"
    args:
      target: ${EVIDENCE}/C/Windows/Prefetch
      output_path: ${DB_DIR}/analysis/trace.json
  - tool: read_output
    note_ko: "비교 호출: 바로 trace 파일을 읽는다"
    args:
      path: ${DB_DIR}/analysis/trace.json
  - tool: read_output
    note_ko: "비교 호출: 다음 기록 쓰기 뒤 trace 파일을 다시 읽는다"
    args:
      path: ${DB_DIR}/analysis/trace.json
expect:
  - step: 3
    note_ko: "trace 경로를 매니페스트 경로로 받아 성공으로 답한다"
    regex: "\"success\":\\s*true[\\s\\S]*\"manifest_path\":\\s*\"[^\"]*/analysis/trace\\.json\""
  - step: 4
    note_ko: "바로 읽은 trace 파일의 내용은 trace 항목이 아니라 hashdeep 매니페스트다"
    regex: "\"body\":\\s*\"%%%% HASHDEEP-1\\.0\\\\n%%%% size,md5,sha256,filename"
  - step: 4
    note_ko: "그 순간 trace 파일에는 앞선 호출의 기록이 없다"
    not_contains: "\\\"call_id\\\": 3"
  - step: 5
    note_ko: "다음 기록 쓰기 뒤에는 trace 파일이 다시 trace JSON이다"
    regex: "\"body\":\\s*\"\\{\\\\n  \\\\\"schema_version\\\\\": \\\\\"2\\.0\\\\\""
  - file_not_contains: ${DB_DIR}/analysis/trace.json
    text: "%%%% size,md5,sha256,filename\n##"
    note_ko: "응답이 가리킨 경로에 매니페스트는 남아 있지 않다"
