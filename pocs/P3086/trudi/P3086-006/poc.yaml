# Matrix case P3086-006: the output check only refuses evidence locations
# (core/paths.py:58-74, 109-149), so an output path that names the case's
# trace file is accepted. hashdeep_compute (tools/hashing.py:413-416) logs its
# run first (which rewrites the trace) and only then writes the manifest to
# output_path, so the trace file on disk is replaced by the manifest. The next
# trace write (_flush, core/execution_log.py:1080-1119) cannot parse the file,
# drops what it read from disk and rewrites the trace from memory, so the
# manifest the response pointed at is gone in turn. Entries that only exist in
# the file (written by trudi's Claude Code hooks) would be lost at that point;
# no hook runs in an MCP-only PoC, so that part is not shown.
# Evidence: two real Windows 7 prefetch files (the same files as P4117-024).
case_id: P3086-006
problem: P3086
