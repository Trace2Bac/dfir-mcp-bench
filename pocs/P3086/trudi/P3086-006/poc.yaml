realism_ko: "`output_path`는 모델이 정하는 인자라, 모델이 매니페스트 이름을 `analysis/` 안의 기존 파일로 잘못 고르거나 증거 속 지시문이 trace 경로를 적어 들어올 수 있다. 드문 값이지만 서버가 막아야 하는 입력이다."
coverage: "partial: hashdeep_compute only; entries that only the hooks write to the trace file, which the next _flush drops, are not shown because no Claude Code hook runs here"
coverage_ko: "`hashdeep_compute`만 보였다. trace 파일에만 있는 hook 항목이 다음 `_flush`에서 사라지는 부분은 Claude Code hook이 돌지 않아 보이지 않았다."
summary: hashdeep_compute with output_path set to the case trace answers success with manifest_path pointing at the trace; read_output of the trace right after returns the hashdeep manifest instead of the trace entries, and a second read_output returns the trace again with the manifest gone.
summary_ko: "`hashdeep_compute`에 사건 trace 경로를 `output_path`로 주면 `manifest_path`를 그 trace로 적어 성공으로 답한다. 바로 trace를 `read_output`으로 읽으면 trace 항목 대신 hashdeep 매니페스트가 나오고, 다시 읽으면 trace가 돌아와 있고 매니페스트는 사라졌다."
defect_ko: "이 서버는 출력 경로가 사건 trace 파일을 가리켜도 막지 않아, 매니페스트가 trace 파일을 덮어쓰고 다음 기록 쓰기가 다시 trace로 덮어써 매니페스트도 사라진다. 정상이라면 서버가 관리하는 기록 파일을 가리키는 출력 경로를 거부해야 한다. 그 사이 디스크의 trace에는 앞선 호출의 기록이 없고, 모델은 응답의 `manifest_path`에 매니페스트가 남아 있어 `hashdeep_audit`에 쓸 수 있다고 잘못 안다."
setup_ko: "실제 Windows 7 Prefetch 파일 두 개(`SC.EXE-945D79AE.pf`, `PING.EXE-371F41E2.pf`)를 증거로 두었다."
