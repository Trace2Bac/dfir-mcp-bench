steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 새로 연다"
    args:
      case_id: P3086-009
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: strings_extract
    note_ko: "준비: SC.EXE Prefetch의 문자열을 뽑는다(call 4의 출력이 `.tool_output/4.txt`에 남는다)"
    args:
      file_path: ${EVIDENCE}/C/Windows/Prefetch/SC.EXE-945D79AE.pf
  - tool: strings_extract
    note_ko: "결함 호출: PING.EXE Prefetch의 문자열을 call 4의 stdout 사본 경로로 쓴다"
    args:
      file_path: ${EVIDENCE}/C/Windows/Prefetch/PING.EXE-371F41E2.pf
      output_path: ${DB_DIR}/analysis/.tool_output/4.txt
  - tool: read_output
    note_ko: "비교 호출: call 4의 stdout 사본을 읽는다"
    args:
      path: ${DB_DIR}/analysis/.tool_output/4.txt
expect:
  - step: 2
    note_ko: "첫 호출의 인용 번호는 4다"
    regex: "\"_trudi_call_id\":\\s*4\\b"
  - step: 3
    note_ko: "trace의 stdout 사본을 가리키는 출력 경로를 받아 성공으로 답한다"
    regex: "\"success\":\\s*true[\\s\\S]*\"output_path\":\\s*\"[^\"]*/analysis/\\.tool_output/4\\.txt\""
  - step: 4
    note_ko: "call 4의 사본을 읽으면 PING.EXE의 문자열이 나온다"
    contains: "PING.EXE"
  - step: 4
    note_ko: "SC.EXE의 문자열은 사본에서 사라졌다"
    not_contains: "SC.EXE"
  - file_regex: ${DB_DIR}/analysis/trace.json
    pattern: "\"call_id\": 4,[^}]*SC\\.EXE-945D79AE\\.pf[^}]*\"stdout_path\": \"[^\"]*/analysis/\\.tool_output/4\\.txt\""
    note_ko: "trace의 call 4 항목은 여전히 SC.EXE에 돌린 명령과 그 사본 경로를 가리킨다"
