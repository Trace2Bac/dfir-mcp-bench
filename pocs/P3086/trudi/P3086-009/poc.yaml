# Matrix case P3086-009: the output check only refuses evidence locations
# (core/paths.py:58-74, 109-149), so an output path that names the trace's
# own stdout copy, analysis/.tool_output/<call_id>.txt (written by
# record_tool_call, core/execution_log.py:1542-1591), is accepted. The tool
# overwrites that copy, and the earlier call's trace entry keeps its
# stdout_path pointing at a file that now holds another call's output.
# Here strings_extract writes a second prefetch file's strings over the copy
# of the first call (.tool_output/4.txt: call 4 is the UTF-16 strings run of
# the first strings_extract; the call ids are fixed because the trace is new).
# Evidence: two real Windows 7 prefetch files (the same files as P4117-024).
