realism_ko: "`output_path`는 모델이 정하는 인자이고, `.tool_output/<call_id>.txt`는 trace 항목의 `stdout_path`에 적혀 `read_output`으로 trace를 읽는 모델이 보는 경로라, 모델이 출력 파일 이름을 그 경로로 잘못 고르거나 증거 속 지시문을 따라 적을 수 있다."
coverage: "partial: strings_extract over a stdout copy only; write_final_report and the other output-path tools pass the same check"
coverage_ko: "`strings_extract`로 stdout 사본을 덮어쓰는 경우만 보였다. `write_final_report`와 출력 경로를 받는 다른 도구도 같은 검사를 거친다."
summary: After strings_extract on SC.EXE-945D79AE.pf (call 4, stdout copy .tool_output/4.txt), strings_extract on PING.EXE-371F41E2.pf with output_path .tool_output/4.txt answers success; read_output of that file then returns PING.EXE's strings, while the trace entry of call 4 still says it ran on SC.EXE and points its stdout_path at that file.
summary_ko: "`SC.EXE-945D79AE.pf`에 `strings_extract`를 부른 뒤(call 4, stdout 사본 `.tool_output/4.txt`), `PING.EXE-371F41E2.pf`에 `output_path=.tool_output/4.txt`로 `strings_extract`를 부르면 성공으로 답한다. 이어 그 파일을 `read_output`으로 읽으면 PING.EXE의 문자열이 나오는데, trace의 call 4 항목은 여전히 SC.EXE에 돌린 명령과 그 파일을 `stdout_path`로 가리킨다."
defect_ko: "이 서버는 출력 경로가 trace가 관리하는 stdout 사본(`.tool_output/<call_id>.txt`)을 가리켜도 막지 않아 앞 호출의 사본을 다른 파생물로 덮어쓴다. 정상이라면 서버가 관리하는 기록·사본 파일을 가리키는 출력 경로를 거부해야 한다. 모델과 검토 도구는 call 4의 출력을 다시 읽을 때 PING.EXE의 문자열을 SC.EXE에서 나온 결과로 잘못 안다."
setup_ko: "실제 Windows 7 Prefetch 파일 `SC.EXE-945D79AE.pf`와 `PING.EXE-371F41E2.pf`를 증거로 두었다."
