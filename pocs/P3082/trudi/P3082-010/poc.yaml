# Matrix case P3082-010: when the middleware's baseline entry cannot be
# written, _trace_success_baseline prints a warning to stderr only
# (core/middleware.py, "except Exception as err: print(...)") and the tool
# result goes back as a success. accuracy_export_report has then written its
# report file. Shown with the write failure a call made before
# misc_start_execution_log gets (record_tool_call -> _require_configured
# raises RuntimeError, caught by the same except); this path stops before
# _next_id and _append_entry, so the part of the case where the call id and
# entry stay in memory after a disk or permission failure is not shown.
# execute_action (respond_*), which runs a remote action the same way, needs
# an SSH target and is not run.
case_id: P3082-010
problem: P3082
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "start_execution_log를 맨 먼저 부르라는 안내를 건너뛰고 다른 도구를 먼저 부르는 것은 모델의 호출 순서 실수로 일어날 수 있고, 같은 처리 누락은 디스크 가득이나 권한 문제로 기록 쓰기가 실패할 때도 그대로 탄다."
coverage: "partial: the baseline write fails because the trace is not open yet; a disk-full or permission failure (which also leaves the call id and entry in memory) and execute_action (needs an SSH target) are not shown"
coverage_ko: "기록이 아직 열리지 않아 기본 항목 쓰기가 실패하는 경우만 보였다. 디스크 가득이나 권한 문제로 실패해 메모리에 번호와 항목이 남는 경우와, SSH 대상이 있어야 하는 execute_action은 보이지 않았다."
summary: 'Before the trace is opened, accuracy_export_report answers success and writes reports/accuracy.md, but the trace opened afterwards has no entry for it; the same call after the trace is open is recorded as "<py>:accuracy_export_report".'
summary_ko: "기록을 열기 전에 `accuracy_export_report`를 부르면 성공 응답과 함께 reports/accuracy.md가 써지는데, 그 뒤 연 trace에는 그 호출의 항목이 없다. 기록을 연 뒤 같은 호출은 `<py>:accuracy_export_report`로 기록된다."
defect_ko: "이 서버는 호출의 기본 기록 항목을 쓰지 못해도 표준 오류에만 경고를 남기고 결과를 성공으로 돌려준다. 정상이라면 기록에 실패한 호출을 실패로 알리거나, 기록 없이 남은 결과물을 알려야 한다. 모델은 보고서 생성이 정상으로 기록됐다고 잘못 알고, 검토자는 reports/에 기록에 없는 보고서 파일을 만나게 된다."
setup_ko: "사건 폴더에 정답 목록 파일(expected_findings 2건)과 빈 reports/ 폴더를 두고, trace를 열지 않은 채 정확도 보고서를 만든다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  - path: reports/.keep
    root: db
    text: ""
  # A ground-truth manifest in the schema accuracy_compare documents.
  - path: ground_truth.json
    root: db
    text: |
      {
        "case_id": "P3082-010",
        "expected_findings": [
          {"id": "F1", "description": "Scheduled task OneDriveUpdater runs hidden PowerShell that downloads http://203.0.113.7/a.ps1 at logon", "confidence_min": "CONFIRMED", "category": "persistence"},
          {"id": "F2", "description": "rundll32.exe loads C:\\Users\\Public\\Libraries\\msupdate.dll from explorer.exe", "confidence_min": "LIKELY", "category": "execution"}
        ],
        "negative_assertions": ["No lateral movement from WKSTN-07 to other hosts"]
      }
steps:
  - tool: accuracy_export_report
    note_ko: "결함 호출: 기록을 열기 전에 정확도 보고서를 reports/에 쓴다"
    args:
      ground_truth_path: ${DB_DIR}/ground_truth.json
      output_path: ${DB_DIR}/reports/accuracy.md
  - tool: misc_start_execution_log
    note_ko: "비교 호출: 이제 사건 trace를 연다"
    args:
      case_id: P3082-010
      output_path: ${DB_DIR}/analysis/P3082-010_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: read_output
    note_ko: "비교 호출: trace에서 보고서 호출의 기록을 찾는다"
    args:
      path: ${DB_DIR}/analysis/P3082-010_trace.json
      query: accuracy_export_report
  - tool: accuracy_export_report
    note_ko: "비교 호출: 기록을 연 뒤 같은 보고서를 다시 쓴다"
    args:
      ground_truth_path: ${DB_DIR}/ground_truth.json
      output_path: ${DB_DIR}/reports/accuracy_2.md
expect:
  - step: 1
    note_ko: "기록을 열기 전의 보고서 호출이 성공했다"
    regex: '^\{"success": true, "output_path": "[^"]*/reports/accuracy\.md"'
  - file_contains: ${DB_DIR}/reports/accuracy.md
    note_ko: "그 호출의 보고서 파일이 reports/에 남았다"
    text: "# Accuracy Report — P3082-010"
  - step: 2
    note_ko: "trace를 열 때 되살린 항목은 없다"
    contains: '"entries_recovered": 0'
  - step: 3
    note_ko: "trace에는 보고서 호출의 기록이 없다"
    regex: '"body": "", "truncated": false'
  - file_regex: ${DB_DIR}/analysis/P3082-010_trace.json
    note_ko: "trace의 accuracy_export_report 항목은 기록을 연 뒤의 한 건뿐이다"
    pattern: '^(?![\s\S]*"cmd": "<py>:accuracy_export_report"[\s\S]*"cmd": "<py>:accuracy_export_report")[\s\S]*"cmd": "<py>:accuracy_export_report",\s*"success": true'
