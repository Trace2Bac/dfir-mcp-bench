# Matrix case P3082-024: run_with_output_file (core/executor.py) runs the
# command with stdout into output_path and only then calls _log_tool; when
# the trace write fails, _log_tool re-raises and the call ends as a tool
# error, but the output file stays and nothing says so. Shown with the
# write failure a call made before misc_start_execution_log gets
# ("trace log not configured", the same raise as disk-full or permission
# errors). The later half of the case (an entry appended in memory before a
# failed _flush is written as a success on the next flush) needs a real
# write failure and is not shown.
# trudi runs TSK as `sudo icat ...` (SIFT has passwordless sudo); the image
# has no sudo, so ${STUBS}/sudo only runs the command it is given. icat is
# the real one.
case_id: P3082-024
problem: P3082
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: side-effect
level: mcp
realism: possible
realism_ko: "start_execution_log를 맨 먼저 부르라는 안내를 건너뛰고 바로 지워진 파일을 꺼내는 것은 모델의 호출 순서 실수로 일어날 수 있고, 기록 쓰기 실패는 디스크 가득이나 권한 문제로도 같은 경로를 탄다."
coverage: "partial: the trace write fails because the trace is not open yet; an entry left in memory by a failed flush and written later as a success needs a real write failure (disk full, permissions) and is not shown"
coverage_ko: "기록이 아직 열리지 않아 기록 쓰기가 실패하는 경우만 보였다. 쓰기 실패 뒤 메모리에 남은 항목이 다음 쓰기 때 성공으로 기록되는 부분은 실제 쓰기 실패(디스크 가득, 권한)가 있어야 해 보이지 않았다."
summary: 'Before the trace is opened, tsk_icat of the deleted customers ZIP on a USB image to analysis/ fails with "trace log not configured", yet the file it extracted is left in analysis/ (a 1,791-byte ZIP), and the trace opened afterwards has no entry for it.'
summary_ko: "기록을 열기 전에 USB 이미지의 지워진 고객 ZIP을 `tsk_icat`으로 analysis/에 꺼내면 \"trace log not configured\" 오류로 끝나는데, 꺼낸 파일(1,791바이트 ZIP)은 analysis/에 그대로 남고 그 뒤 연 trace에는 그 호출의 항목이 없다."
defect_ko: "이 서버는 출력 파일을 쓴 뒤 기록 쓰기가 실패하면 호출을 오류로 끝내면서 이미 쓴 파일을 지우지도 알리지도 않는다. 정상이라면 기록에 실패한 작업의 결과를 치우거나, 결과 파일이 남았다는 사실을 오류와 함께 알려야 한다. 모델은 추출이 실패해 파일이 없다고 잘못 알고, 나중에 analysis/에서 그 파일을 보는 검토자는 기록에 없는 증거 사본을 만나게 된다."
setup_ko: "USB 메모리 이미지(FAT12)에 notes.txt와 지워진 customers_2024Q3.zip을 넣었다."
env:
  PATH: ${STUBS}:${PATH}
stubs:
  - name: sudo
    text: |
      #!/bin/sh
      # Stand-in for passwordless sudo on SIFT: run the command as is.
      exec "$@"
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # First 28 sectors of the image (boot sector, both FATs, root directory,
  # notes.txt and the deleted ZIP); the image is 4,194,304 bytes.
  - path: usb/USBDRIVE.dd
    size: 4194304
    base64: 
steps:
  - tool: tsk_icat
    note_ko: "결함 호출: 기록을 열기 전에 지워진 ZIP(항목 7)을 analysis/로 꺼낸다"
    args:
      image: ${EVIDENCE}/usb/USBDRIVE.dd
      inode: "7"
      output_path: ${DB_DIR}/analysis/customers_2024Q3.zip
  - tool: misc_start_execution_log
    note_ko: "비교 호출: 이제 사건 trace를 연다"
    args:
      case_id: P3082-024
      output_path: ${DB_DIR}/analysis/P3082-024_trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: strings_file_identify
    note_ko: "비교 호출: 오류로 끝난 추출이 남긴 파일을 확인한다"
    args:
      file_path: ${DB_DIR}/analysis/customers_2024Q3.zip
expect:
  - step: 1
    note_ko: "추출 호출은 기록 미설정 오류로 끝났다"
    regex: 'trace log not configured'
  - step: 1
    note_ko: "오류 응답이다"
    is_error: true
  - step: 2
    note_ko: "trace를 열 때 되살린 항목은 없다"
    contains: '"entries_recovered": 0'
  - step: 3
    note_ko: "오류로 끝난 호출이 꺼낸 ZIP이 analysis/에 남아 있다"
    regex: 'customers_2024Q3\.zip: Zip archive data'
  - file_regex: ${DB_DIR}/analysis/customers_2024Q3.zip
    note_ko: "남은 파일은 지워진 ZIP의 내용(customers_2024Q3.csv를 담은 ZIP)이다"
    pattern: '^PK\x03\x04[\s\S]*customers_2024Q3\.csv'
  - file_not_contains: ${DB_DIR}/analysis/P3082-024_trace.json
    note_ko: "trace에는 그 추출의 기록이 없다"
    text: "icat "
