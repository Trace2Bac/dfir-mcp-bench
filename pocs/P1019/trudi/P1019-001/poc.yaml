# Matrix case P1019-001: install.sh (lines 188-198) copies the ATT&CK table to
# ~/cases/.common/mitre_techniques.json only when no file is there yet, so an
# upgraded install keeps the table an earlier install left. correlate.
# mitre_validate then reports a technique the current table has as absent,
# and its response carries no table version or hash, so "absent because the
# table is old" cannot be told from "absent".
# Evidence: the table as trudi 3cc720a (2026-06-03) shipped it in
# cases/.common/mitre_techniques.json (_meta.version v14, 48 techniques,
# exact bytes from `git show 3cc720a:cases/.common/mitre_techniques.json`).
# The install.sh of that commit copied it to the same place, so this is the
# file an earlier install leaves. The bench cannot write under the server's
# HOME, so TRUDI_MITRE_TABLE (the server's own override of that default path)
# points at the same file under ${OUTSIDE}/cases/.common. The table the
# current commit ships (/opt/trudi/cases/.common, v15, 486 techniques) is the
# comparison.
