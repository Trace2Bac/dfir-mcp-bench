realism_ko: "같은 분석 호스트에서 trudi를 새 버전으로 다시 설치하면 `install.sh`가 이미 있는 `~/cases/.common/mitre_techniques.json`을 바꾸지 않으므로, 앞 설치가 남긴 옛 표가 정상 흐름에서 그대로 쓰인다."
coverage: full
summary: With the ATT&CK table an earlier install left (v14, 48 techniques), correlate_mitre_validate(T1003.002) answers exists false with available_count 48 and no table version or hash, while the same call against the table the current commit ships (486 techniques) returns T1003.002 Security Account Manager.
summary_ko: "앞 설치가 남긴 ATT&CK 표(v14, 기법 48개)로 `correlate_mitre_validate(T1003.002)`를 부르면 `exists` false와 `available_count` 48만 나오고 표 버전이나 해시는 없다. 지금 커밋이 배포하는 표(486개)로 같은 호출을 하면 `T1003.002` Security Account Manager가 나온다."
defect_ko: "이 서버는 설치 때 기법 표가 이미 있으면 바꾸지 않고, 그 표로 기법이 없다고 판정하면서 응답에 표의 버전이나 해시를 싣지 않는다. 새 버전의 표로 갱신하거나 판정에 쓴 표의 버전을 함께 알려야 한다. 모델은 실제 ATT&CK 기법을 없는 기법으로 알고 보고서에서 빼거나 다른 기법으로 바꾼다."
setup_ko: "trudi 3cc720a가 배포하고 그때의 `install.sh`가 `~/cases/.common`에 복사한 옛 기법 표(48개)를 서버의 기본 표 자리에 두고 `T1003.002`를 검증한 뒤, 지금 커밋이 배포하는 표로 같은 기법을 검증한다."
