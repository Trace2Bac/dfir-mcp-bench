# Matrix case P1027-001: assess_coverage puts into its table only the
# artifact classes it finds by name and path. When no evidence file matches
# the table (here a case folder holding only an E01 disk image), the table
# and the gap list are both empty, and it returns COVERAGE CLEAN with "every
# artifact class present in evidence has been examined", without saying that
# it found no class at all.
# disk.E01 is a real EWF (EnCase 6) image of a 4 MiB disk with an MBR and one
# Linux partition, written by ewfacquirestream 20240506 and checked with
# ewfverify; assess_coverage never opens it.
case_id: P1027-001
problem: P1027
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: multi-call
level: mcp
realism: common
realism_ko: "디스크를 E01로만 받은 사건 폴더는 흔하다."
coverage: "partial: the condition where FINDEVIL_EVIDENCE_DIR names a missing folder is not run (the runner's own FINDEVIL_EVIDENCE_DIR comes after the PoC's env)"
coverage_ko: "`FINDEVIL_EVIDENCE_DIR`이 없는 폴더를 가리키는 조건은 돌리지 않았다(실행기가 정하는 `FINDEVIL_EVIDENCE_DIR`이 PoC의 환경 변수보다 뒤에 붙어 바꿀 수 없다)"
summary: With only disk.E01 in evidence and no tool run, assess_coverage returns no artifact table, 0 recorded executions and "COVERAGE CLEAN — every artifact class present in evidence has been examined", while list_evidence shows the E01 is there.
summary_ko: "증거에 `disk.E01`만 있고 아무 도구도 돌리지 않았는데 `assess_coverage`는 자료 표 없이 호출 0건과 \"COVERAGE CLEAN — every artifact class present in evidence has been examined\"를 낸다. `list_evidence`는 그 E01이 있다고 보인다."
defect_ko: "이 서버의 `assess_coverage`는 이름 표에 맞는 자료가 하나도 없으면 빈 표를 빈틈 없음으로 읽어 모든 자료를 조사했다고 판정한다. 찾은 자료 종류가 없다고, 표에 없는 파일은 평가하지 않았다고 알려야 한다. 모델은 아무것도 분석하지 않은 사건을 조사 완료로 잘못 안다."
setup_ko: "증거 폴더에 MBR과 리눅스 파티션 하나가 든 4 MiB 디스크를 `ewfacquirestream`으로 받은 실제 E01(`disk.E01`) 하나만 두었다."
fixture:
  - path: disk.E01
    base64: 
steps:
  - tool: assess_coverage
    note_ko: "결함 호출: 아무것도 분석하지 않은 채 조사 범위를 점검함"
    args: {}
  - tool: list_evidence
    note_ko: "증거 폴더에 무엇이 있는지 본다"
    args: {}
expect:
  - step: 1
    note_ko: "기록된 호출이 없다"
    contains: "- **Tool executions recorded:** 0"
  - step: 1
    note_ko: "자료 표가 비어 아무 행도 없다"
    not_contains: "## Artifact coverage"
  - step: 1
    note_ko: "그런데도 증거의 모든 자료 종류를 조사했다고 판정한다"
    contains: "**Verdict: COVERAGE CLEAN** — every artifact class present in evidence has been examined"
  - step: 2
    note_ko: "증거 폴더에는 E01 디스크 이미지가 있다"
    contains: "disk.E01"
