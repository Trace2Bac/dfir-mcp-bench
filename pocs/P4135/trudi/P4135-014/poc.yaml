# Matrix case P4135-014: core.executor.run cuts stdout to OUTPUT_CAP (51,200
# chars) first and applies the 150-line cap afterwards, so the footer
# "[TRUNCATED — n lines omitted]" counts n only inside the 51,200 chars that
# were kept, not in the whole output.
# The evidence is a phone photo folder (300 JPEGs with the EXIF a phone
# writes); exiftool -q -r prints 29 tag lines per photo, 8,700 lines in all,
# so 8,550 lines are left out of the 150 returned.
case_id: P4135-014
problem: P4135
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "사진 폴더처럼 파일이 수백 개인 폴더에 exiftool_batch를 돌리면 출력은 쉽게 51,200자를 넘는다. 출력이 상한을 넘을 때마다 생기는 일이다."
coverage: full
summary: strings_exiftool_batch over a folder of 300 photos (8,700 lines of exiftool output) answers with 150 lines and the footer "[TRUNCATED — 944 lines omitted]"; 944 counts only the lines left inside the first 51,200 characters, while 8,550 lines were left out, as the trace's stdout_lines (8,700) for the same call shows.
summary_ko: "사진 300장이 든 폴더에 strings_exiftool_batch를 부르면(exiftool 출력 8,700줄) 150줄과 함께 '[TRUNCATED — 944 lines omitted]'를 붙인다. 944는 앞 51,200자 안에 남은 줄만 센 수이고, trace에 기록된 같은 호출의 stdout_lines(8,700)로 보면 실제로 빠진 줄은 8,550줄이다."
defect_ko: "이 서버는 출력을 51,200자에서 먼저 자른 뒤 줄 수를 세어 생략 줄 수를 실제보다 훨씬 작게 적는다. 정상이라면 원래 출력 전체에서 빠진 줄 수를 적어야 한다. 모델은 남은 양이 수백 줄(사진 몇십 장)뿐이라고 잘못 안다."
setup_ko: "사용자 Pictures 폴더에 휴대폰 사진 300장(IMG_0.jpg~IMG_299.jpg, Apple iPhone 13 EXIF가 든 JPEG)을 넣었다. exiftool은 사진 한 장에 29줄을 낸다."
fixture:
  - path: analysis/.keep
    root: db
    text: ""
  # 32x24 JPEG made with Pillow, EXIF Make Apple, Model iPhone 13, Software
  # 16.3.1, DateTimeOriginal 2026:03:14 09:12:44 (842 bytes).
  - path: Users/alice/Pictures/IMG_{i}.jpg
    repeat: 300
    base64: 
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: P4135-014
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: strings_exiftool_batch
    note_ko: "결함 호출: 사진 폴더 전체의 메타데이터를 뽑는다"
    args:
      directory: ${EVIDENCE}/Users/alice/Pictures
  - tool: strings_exiftool_metadata
    note_ko: "비교 호출: 사진 한 장이 몇 줄인지 본다"
    args:
      file_path: ${EVIDENCE}/Users/alice/Pictures/IMG_0.jpg
  - tool: read_output
    note_ko: "비교 호출: trace에 기록된 같은 호출(call 3)의 전체 출력 줄 수를 본다"
    args:
      path: ${DB_DIR}/analysis/trace.json
      query: stdout_lines
expect:
  - step: 2
    note_ko: "응답은 150줄에서 잘리고 생략 줄 수를 944로 적는다"
    regex: "\\[TRUNCATED \\\\u2014 944 lines omitted"
  - step: 2
    note_ko: "응답은 잘렸다고 표시한다"
    regex: "\"truncated\":\\s*true"
  - step: 3
    note_ko: "사진 한 장도 같은 태그(마지막 Megapixels)를 낸다. 단건 호출의 stdout_lines는 29다"
    contains: "Megapixels"
  - step: 4
    note_ko: "trace에는 같은 호출의 전체 출력이 8,700줄로 기록돼 있다(300장 × 29줄). 실제로 빠진 줄은 8,550줄이다"
    regex: "stdout_lines.{1,3}: 8700,"

