# Matrix case P4135-009 (parse_shimcache part): the seven EZ Tools summary
# tools (eztools.py 88-124) put the number of windows of their source (4,096
# character chunks of the CSV) into "Showing N of M entries" and take one
# 200-character sample per window, so M is a count of chunks, not of the
# entries the tool parsed.
#
# The evidence is the E01 of a 10 MiB NTFS disk laid out as Windows XP
# (WINDOWS/system32/config/system). The SYSTEM hive holds the real
# AppCompatCache value (96 entries), Select, Environment and ComputerName
# keys copied with hivexregedit from the SYSTEM hive of the NIST CFReDS
# "Hacking Case" laptop, in a small hive so the PoC stays small.
# AppCompatCacheParser 1.5 reports "Found 96 cache entries for WindowsXP in
# ControlSet001".
case_id: P4135-009
problem: P4135
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "ShimCache는 실행 흔적 조사의 기본 artifact이고, 항목 수십~수백 개의 CSV는 언제나 window 여러 개가 된다. 요약 도구의 \"Showing N of M entries\"를 항목 수로 읽는 것은 자연스럽다."
coverage: "partial: parse_shimcache only; parse_amcache and parse_prefetch_detailed share the code but were not run (PECmd refuses to run on Linux), and parse_jump_lists, parse_lnk_files, parse_shellbags and parse_srum have no extractor that fills their source"
coverage_ko: "`parse_shimcache`만 확인했다. 같은 코드인 `parse_amcache`·`parse_prefetch_detailed`는 돌리지 않았고(PECmd는 Linux에서 실행을 거부한다), `parse_jump_lists`·`parse_lnk_files`·`parse_shellbags`·`parse_srum`은 source를 채우는 추출 도구가 없다."
summary: >-
  After run_shimcache_parser indexes 96 ShimCache entries from a Windows XP
  SYSTEM hive, parse_shimcache says "Showing 4 of 4 entries" with four
  200-character samples, one per 4,096-character window, so the 96 entries
  are reported as 4 and the response reads as if all were shown.
summary_ko: "`run_shimcache_parser`가 Windows XP SYSTEM 하이브에서 ShimCache 항목 96개를 적재한 뒤, `parse_shimcache`는 window(4,096자)마다 200자 표본 하나씩 4개를 싣고 \"Showing 4 of 4 entries\"라 한다. 항목 96개가 4개로 알려지고, 응답은 전부를 보여 준 것처럼 읽힌다."
defect_ko: "이 서버는 window 수를 항목 수 자리에 넣어 \"Showing N of M entries\"라 알린다. 정상이라면 M은 파싱한 항목(CSV 행) 수여야 하고, 표본이 일부라면 몇 항목을 보였는지 알려야 한다. 모델은 이 컴퓨터의 ShimCache 항목이 4개뿐이고 다 보았다고 믿어, 표본에 없는 실행 흔적(예: telnet.exe 뒤의 도구들)을 찾지 않는다."
setup_ko: "NIST CFReDS Hacking Case 노트북의 SYSTEM 하이브에서 ShimCache 값(항목 96개)과 관련 키를 옮긴 하이브를 `WINDOWS/system32/config/system`에 둔 XP 형태 NTFS 디스크 E01을 두고, `run_fls`·`run_shimcache_parser`로 적재했다."
fixture:
  - path: XP-LAPTOP.E01
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: xp-laptop
  - tool: run_fls
    note_ko: "준비: 파일 목록 적재"
    args:
      image_path: ${EVIDENCE}/XP-LAPTOP.E01
  - tool: run_shimcache_parser
    note_ko: "준비: ShimCache 적재"
    args:
      image_path: ${EVIDENCE}/XP-LAPTOP.E01
  - tool: parse_shimcache
    note_ko: "결함 호출: ShimCache 요약"
  - tool: get_raw_output
    note_ko: "비교 호출: 적재된 CSV 원문"
    args:
      source_name: ez.shimcache
expect:
  - step: 3
    note_ko: "CSV 98줄이 window 4개로 적재된다"
    regex: '"line_count": 98,\s*"windows_indexed": 4'
  - step: 4
    note_ko: "요약은 항목 4개 중 4개를 보였다고 한다"
    contains: "Showing 4 of 4 entries."
  - step: 5
    note_ko: "적재된 CSV에는 위치 0부터 95까지 항목 96개가 있다"
    regex: '\\n1,0,C:\\\\WINDOWS\\\\system32\\\\services\.exe,[\s\S]*\\n1,95,'
