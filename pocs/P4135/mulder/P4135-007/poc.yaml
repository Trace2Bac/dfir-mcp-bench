realism_ko: "긴 source를 `limit`을 정해 쪽 단위로 읽는 것은 도구 설명이 권하는 방법이고, 남은 window 수가 `limit`의 배수이면 마지막 쪽에서 늘 이렇게 된다."
coverage: full
summary: >-
  Reading a six-window source two windows at a time, the third
  get_raw_output page returns windows 5 and 6 (next_after_id 6 of
  total_windows 6) with has_more true; following its cursor returns zero
  windows.
summary_ko: "window 6개인 source를 2개씩 읽으면 세 번째 `get_raw_output` 쪽은 마지막 window 5·6을 돌려주면서(`next_after_id` 6, `total_windows` 6) `has_more: true`라 한다. 그 커서로 다시 부르면 window 0개가 온다."
defect_ko: "이 서버는 받은 window 수가 `limit`과 같기만 하면 남은 출력이 있다고 표시한다. 정상이라면 마지막 window까지 받았을 때 `has_more`는 거짓이어야 한다. 모델은 아직 읽지 않은 출력이 있다고 보고 빈 쪽을 더 부르거나, 다 읽지 못했다고 보고한다."
setup_ko: "관리 명령과 인코딩된 PowerShell 명령이 든 사용자 `ConsoleHost_history.txt`를 `run_strings`로 적재하면 window 6개가 된다. 이것을 `limit: 2`로 차례로 읽었다."
