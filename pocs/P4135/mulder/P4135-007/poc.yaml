# Matrix case P4135-007: get_raw_output sets has_more = len(page) == limit
# (core.py 908), so a page that happens to hold exactly the last `limit`
# windows still says there is more. Here a PSReadLine history indexed as six
# windows is read two windows at a time: the third page returns windows 5
# and 6, the last two, with has_more true, and the cursor it gives returns
# nothing.
