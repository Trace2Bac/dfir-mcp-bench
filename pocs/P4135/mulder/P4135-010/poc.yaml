# Matrix case P4135-010: list_files and get_deleted_files filter tsk.filelist
# window by window (a window is kept if any of its lines has the path filter,
# or "* "), then count every line of every kept window (tsk.py 253-262,
# 304-314) and report that as approx_file_count / approx_deleted_count and
# in the hint ("Showing summary of N entries", "N deleted entries found").
# The number is the size of the windows that matched, not the entries that
# matched.
#
# The evidence is the E01 of a 16 MiB FAT16 USB stick (built with mkfs.fat
# and mtools, acquired with ewfacquire): 180 camera photos in DCIM/100CANON,
# a Projects/Orion folder with 5 documents and 40 spec PDFs, and 3 of the
# Orion documents deleted. `fls -r -p` on it gives 236 lines, 47 of them
# under Projects/Orion and 3 marked deleted.
case_id: P4135-010
problem: P4135
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "디스크 이미지에서 삭제 파일 수와 특정 폴더의 파일 수를 묻는 것은 정보 유출 조사의 첫 단계이고, `fls` 목록이 window 여러 개가 되는 것은 거의 모든 이미지에서 그렇다."
coverage: full
summary: >-
  On a USB image with 3 deleted files, get_deleted_files reports
  approx_deleted_count 17 and "17 deleted entries found" (the lines of the
  one window holding them), and list_files(path_filter="Orion") reports
  approx_file_count 124 with DCIM, 70 entries, as a top directory, where fls
  lists 47 Orion entries and 3 deleted ones.
summary_ko: "삭제 파일이 3개인 USB 이미지에서 `get_deleted_files`는 `approx_deleted_count: 17`, \"17 deleted entries found\"라 한다(삭제 항목이 든 window 하나의 줄 수). `list_files(path_filter=\"Orion\")`은 `approx_file_count: 124`라 하고 경로에 Orion이 없는 DCIM(70개)을 상위 폴더로 싣는다. `fls` 목록에서 Orion 항목은 47개, 삭제 항목은 3개다."
defect_ko: "이 서버는 조건에 맞는 줄이 하나라도 든 window를 통째로 세어 그 window의 줄 수를 일치한 항목 수로 알린다. 정상이라면 조건에 맞는 줄만 세어야 한다. 모델은 삭제 파일이 17개라고 보고하거나 Orion 폴더에 124개 파일이 있었다고 보고해, 유출·삭제 규모를 부풀린다."
setup_ko: "카메라 사진 180장과 `Projects/Orion` 폴더(문서 5개, 사양서 PDF 40개)가 든 FAT16 USB에서 Orion 문서 3개를 지운 뒤 E01로 획득한 이미지를 두고 `run_fls`로 파일 목록을 적재했다."
fixture:
  - path: USB-0317.E01
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: usb-0317
  - tool: run_fls
    note_ko: "준비: 파일 목록 적재"
    args:
      image_path: ${EVIDENCE}/USB-0317.E01
  - tool: get_deleted_files
    note_ko: "결함 호출: 삭제 파일 요약"
  - tool: list_files
    note_ko: "결함 호출: Orion 경로 파일 요약"
    args:
      path_filter: Orion
  - tool: get_raw_output
    note_ko: "비교 호출: 삭제 항목이 든 마지막 window 원문"
    args:
      source_name: tsk.filelist
      after_id: 2
expect:
  - step: 2
    note_ko: "fls 목록 236줄이 window 3개로 적재된다"
    regex: '"line_count": 236,\s*"windows_indexed": 3'
  - step: 3
    note_ko: "삭제 항목이 17개라고 한다"
    regex: '"approx_deleted_count": 17,[\s\S]*"hint": "17 deleted entries found'
  - step: 3
    note_ko: "같은 응답의 상위 폴더 집계는 삭제 항목 3개다"
    regex: '"name": "Projects",\s*"entries": 3\s*\}\s*\]'
  - step: 4
    note_ko: "Orion 경로 파일이 124개라 하고, 경로에 Orion이 없는 DCIM 70개를 상위 폴더로 싣는다"
    regex: '"approx_file_count": 124,\s*"top_directories": \[\s*\{\s*"name": "DCIM",\s*"entries": 70'
  - step: 5
    note_ko: "실제 삭제 표시(`*`)가 붙은 항목은 Orion 문서 3개다"
    regex: 'r/r 712:\\tProjects/Orion/Orion_Roadmap_Q2\.docx\\nr/r \* 715:\\tProjects/Orion/Orion_Pricing_2026\.xlsx\\nr/r \* 718:\\tProjects/Orion/Orion_Customer_List\.xlsx\\nr/r \* 721:\\tProjects/Orion/Orion_Source_Escrow\.zip\\nr/r 724:'
