# Matrix case P1024-016: misc_record_disposition settles a work-order tool
# with target_kind='tool' and reason 'absent_from_evidence' (or
# 'inapplicable') without any evidence call: tools/_gates/_dispositions.py
# requires evidence_call_ids for absent_from_evidence only on a source or a
# coverage row, not on a tool. tool_waived (tools/_gates/work_order.py) then
# counts the tool as done, so it leaves the unrun list of the readiness check.
# The work order is written by the server itself: dair_assess runs against
# the Anthropic stub, whose answer pushes Triage -> Collect with ez.lecmd and
# ez.pecmd as the Collect work order. ez.pecmd stays as the never-run control.
# The evidence is a CyLR-style triage tree (Windows/System32/config marks it
# as triage) holding one LNK file in the user's Recent folder: a
# ShellLinkHeader (CLSID 00021401-0000-0000-C000-000000000046, HasLinkInfo)
# and a LinkInfo with the local base path C:\Users\jdoe\Documents\
# Q3_payroll.xlsx, as Windows Explorer writes it. strings_file_identify shows
# it is a Windows shortcut, so "absent from evidence" is false for LECmd.
case_id: P1024-016
problem: P1024
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: possible
realism_ko: "처분 대상과 사유는 모델 인자이고, 서버의 미실행 차단 문구가 `misc.record_disposition(target_kind=\"tool\", ..., reason=\"inapplicable\"|\"absent_from_evidence\")`를 직접 권하므로 모델이 도구를 실행하는 대신 처분을 남기는 일이 생긴다."
coverage: full
summary: With ez.lecmd in the Collect work order and an LNK file in the evidence, misc_record_disposition(target_kind='tool', target_id='ez.lecmd', reason='absent_from_evidence') with no evidence call succeeds and ez.lecmd leaves the readiness check's unrun list, while the same reason for a source without evidence is refused and the never-run ez.pecmd stays listed.
summary_ko: "Collect 작업 지시에 `ez.lecmd`가 있고 증거에 LNK 파일이 있는데, 근거 호출 없이 `misc_record_disposition(target_kind='tool', target_id='ez.lecmd', reason='absent_from_evidence')`를 부르면 성공하고 `ez.lecmd`가 준비 점검의 미실행 목록에서 빠진다. 같은 사유를 source에 근거 없이 주면 거부되고, 돌리지 않은 `ez.pecmd`는 목록에 남는다."
defect_ko: "이 서버는 도구 처분의 `absent_from_evidence`나 `inapplicable` 사유에 근거 호출을 요구하지 않고, 그 처분 하나로 작업 지시 도구를 처리된 것으로 센다. 증거에 대한 주장인 `absent_from_evidence`는 source와 같이 목록이나 검색 근거를 요구해야 한다. 모델과 준비 점검, 보고서는 LNK 자료가 증거에 없어서 LECmd를 돌리지 않은 것으로 알게 된다."
setup_ko: "트리아지 수집물(`Windows/System32/config` 폴더가 있는 트리)에 사용자 `Recent` 폴더의 LNK 파일 하나를 둔다. 새 기록을 열고, 가짜 Anthropic API가 Collect로 넘어가며 `ez.lecmd`와 `ez.pecmd`를 작업 지시로 내리는 DAIR 답을 돌려주게 한다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
anthropic_stub:
  responses:
  - |
    Triage is complete; the Collect work order follows.
    RESULT: {"schema_version": 1, "assessment": {"current_phase": "Triage", "phase_rationale": "The alert on WKSTN-07 (jdoe opening payroll files) is confirmed; Triage is satisfied.", "transition_recommended": true, "next_phase": "Collect", "transition_rationale": "Triage satisfied; collect the file-access artifacts.", "stack_action": "push", "investigation_focus": "Which files did jdoe open on WKSTN-07, and which programs ran?", "verification_satisfied": true, "verification_challenges": [], "recommended_actions": [], "directives": {"priority_tools": ["ez.lecmd", "ez.pecmd"], "skip_tools": [], "focus_pids": [], "focus_paths": [], "curiosity_budget": 1}}}
fixture:
- path: C/Windows/System32/config
  dir: true
- path: C/Users/jdoe/AppData/Roaming/Microsoft/Windows/Recent/Q3_payroll.xlsx.lnk
  hex: 
- path: case01/evidence
  root: outside
  symlink: ${EVIDENCE}
- path: case01/analysis
  root: outside
  dir: true
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 새 사건 기록을 연다"
  args:
    case_id: CASE-001
    output_path: ${OUTSIDE}/case01/analysis/CASE-001_trace.json
    case_dir: ${OUTSIDE}/case01
    launch_dashboard: false
- tool: dair_assess
  note_ko: "준비: DAIR(가짜 API)가 Collect로 넘기며 ez.lecmd와 ez.pecmd를 작업 지시로 내린다"
  args:
    tool_results_summary: "Triage confirmed the DLP alert: jdoe on WKSTN-07 opened payroll spreadsheets outside working hours. The triage collection is in evidence/C."
    phase_stack: "[]"
    case_context: "CASE-001; host WKSTN-07; user jdoe"
- tool: reason_readiness_status
  note_ko: "비교 호출: 작업 지시의 두 도구가 미실행으로 나온다"
- tool: strings_file_identify
  note_ko: "준비: 증거에 LNK 파일이 있음을 확인한다"
  args:
    file_path: ${OUTSIDE}/case01/evidence/C/Users/jdoe/AppData/Roaming/Microsoft/Windows/Recent/Q3_payroll.xlsx.lnk
- tool: misc_record_disposition
  note_ko: "비교 호출: 같은 사유를 source에 근거 없이 주면 거부된다"
  args:
    target_kind: source
    target_id: lnk_files
    reason: absent_from_evidence
- tool: misc_record_disposition
  note_ko: "결함 호출: 근거 호출 없이 ez.lecmd를 '증거에 없음'으로 처분한다"
  args:
    target_kind: tool
    target_id: ez.lecmd
    reason: absent_from_evidence
- tool: reason_readiness_status
  note_ko: "결함 확인: 같은 점검을 다시 부른다"
expect:
- step: 3
  note_ko: 처분 전에는 LECmd와 PECmd가 미실행 목록에 있다
  contains: 'never run or dispositioned: ez.lecmd, ez.pecmd.'
- step: 4
  note_ko: 증거에는 Windows 바로가기(LNK) 파일이 있다
  contains: 'MS Windows shortcut'
- step: 5
  note_ko: source에 대한 '증거에 없음'은 근거 호출을 요구하며 거부된다
  regex: '"success": false, "gate": "typed_disposition", "missing": \["evidence_call_ids"\]'
- step: 6
  note_ko: 도구에 대한 '증거에 없음'은 근거 없이 받아들여진다
  regex: '"success": true, "call_id": \d+, "_trudi_call_id": \d+, "target_kind": "tool", "target_norm": "ez.lecmd", "reason": "absent_from_evidence"'
- step: 7
  note_ko: 처분 뒤에는 LECmd가 미실행 목록에서 빠지고 PECmd만 남는다
  contains: '1 tool(s) DAIR prescribed in a priority_tools work order were never run or dispositioned: ez.pecmd.'
