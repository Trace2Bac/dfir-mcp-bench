# Matrix case P1024-022: the FK corroboration check
# (tools/_gates/fk_corroboration.py) proves that a corroborator ran by a regex
# over the cmd of every tool_call; the regex for ez_pecmd is
# "(?<![a-z])pecmd|prefetch", so ANY call whose command line holds a path
# under Windows\Prefetch counts as a PECmd run. Here a file-type check of the one file
# left in the Prefetch folder (strings_file_identify, recorded as
# "file .../Windows/Prefetch/Layout.ini") clears the "Uncorroborated execution
# finding" blocker of an Amcache-grounded LIKELY execution finding, although
# PECmd never ran and the folder holds no .pf file at all.
# hash_directory, which the matrix summary names, does not show this: its
# trace entry is "<py>:hash_directory" with no path in the cmd.
# Amcache is the grounding artifact because its FK sheet disclaims execution
# and names ez_pecmd as a corroborator (the Prefetch sheet does not disclaim
# execution, so a Prefetch-grounded finding never gets the check). The
# Amcache rows come from an AmcacheParser CSV an earlier session left in
# analysis/ (the column header AmcacheParser writes for
# UnassociatedFileEntries), read with read_output; the bench cannot build a
# real Amcache.hve. The Prefetch folder holds only Layout.ini (UTF-16LE with
# BOM, one path per line, as Windows writes it): the .pf files were deleted,
# as an intruder clearing Prefetch leaves it. DAIR, the hypothesis pass and
# the reviewer run against the Anthropic stub.
case_id: P1024-022
problem: P1024
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: multi-call
level: mcp
realism: common
realism_ko: "Prefetch 폴더에 남은 파일의 종류를 보거나 해시·문자열로 살피는 것은 흔한 호출이고, 공격자가 지운 Prefetch 폴더에 `Layout.ini`만 남는 일도 있다."
coverage: "partial: the Amcache rows are read from an AmcacheParser CSV placed in analysis/ (as an earlier session leaves it), because the bench cannot build a real Amcache.hve; DAIR, hypothesis and reviewer answers come from the Anthropic stub"
coverage_ko: "실제 Amcache.hve를 만들 수 없어 앞 세션이 `analysis/`에 남긴 AmcacheParser CSV를 읽어 Amcache 행을 얻는다. DAIR, 가설, 검토 모델의 답은 가짜 Anthropic API가 준다."
summary: An Amcache-grounded LIKELY execution finding is recorded with a completeness_note naming ez_pecmd and reason_readiness_status blocks it as uncorroborated; after strings_file_identify only checks the file type of Windows/Prefetch/Layout.ini (the folder holds no .pf file), the blocker is gone, although PECmd never ran.
summary_ko: "Amcache에 근거한 LIKELY 실행 발견은 `ez_pecmd`를 보강 도구로 든 `completeness_note`와 함께 기록되고 `reason_readiness_status`가 보강 안 된 발견으로 차단한다. `strings_file_identify`로 `.pf` 없이 `Layout.ini`만 남은 `Windows/Prefetch` 폴더에서 그 파일의 종류만 확인하면 PECmd를 돌리지 않았는데도 이 차단이 사라진다."
defect_ko: "이 서버는 PECmd 실행 여부를 명령 문자열에 `prefetch`라는 글자가 있는지로도 정해, Prefetch 폴더 경로를 받은 다른 도구의 호출을 보강 도구 실행으로 센다. PECmd(또는 Prefetch 해석 도구)가 실제로 성공해 결과를 낸 호출만 세야 한다. 모델과 보고 전 점검은 Amcache 하나에 기댄 실행 발견을 Prefetch로 보강한 것으로 안다."
setup_ko: "트리아지 수집물의 `Windows/Prefetch` 폴더에 `Layout.ini`만 남기고(`.pf`는 지워짐), 앞 세션이 `analysis/amcache/`에 남긴 AmcacheParser CSV에 `rclone.exe` 행을 둔다. 가짜 Anthropic API가 DAIR(Collect로 넘김), 가설, 검토(SUPPORTED) 답을 차례로 돌려준다."
