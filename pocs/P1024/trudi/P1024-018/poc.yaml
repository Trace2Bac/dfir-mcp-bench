# Matrix case P1024-018: when an optional program is missing, the typed
# fail-fast result (tools/tool_capabilities.py tool_unavailable_result) says
# "An uninstalled tool establishes nothing about the evidence" and then tells
# the model to settle it with reason='inapplicable'. The server has its own
# disposition reason for exactly this, tool_unavailable ("the tool failed
# because it is not installed / cannot run here — says nothing about the
# evidence", tools/_gates/_dispositions.py), which record_disposition accepts
# for a tool. inapplicable is the reason for a tool that does not apply to
# the case's evidence.
# esedbexport (libesedb-utils) is not in the image, the situation of an
# analysis host without that optional package. The investigation is resumed
# from a trace whose previous dair_assess moved it into Collect (shape as in
# P2061-057), because record_disposition needs a dair_call in the trace.
case_id: P1024-018
problem: P1024
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "`esedbexport`는 SIFT 기본 구성 밖의 선택 패키지라 분석 호스트에 없는 일이 흔하고, SRUM이 든 Windows 수집물에 `misc_srum_export`를 부르는 것은 정상 흐름이다."
coverage: full
summary: With esedbexport not installed, misc_srum_export returns status tool_unavailable with a note that the missing tool "establishes nothing about the evidence" yet tells the model to record reason='inapplicable', while the server's own disposition reason for an uninstalled tool, tool_unavailable, is accepted by record_disposition for the same tool.
summary_ko: "`esedbexport`가 없으면 `misc_srum_export`는 `status` tool_unavailable과 함께 \"설치되지 않은 도구는 증거에 대해 아무것도 말하지 않는다\"고 하면서 `reason='inapplicable'`로 처분하라고 안내한다. 서버에는 설치되지 않은 도구를 위한 처분 사유 `tool_unavailable`이 따로 있고 `record_disposition`은 같은 도구에 이 사유를 받아 준다."
defect_ko: "이 서버는 선택 프로그램이 없을 때 \"적용 대상 아님\"을 뜻하는 `inapplicable` 처분을 권한다. 서버가 정의한 대로 설치되지 않은 도구는 `tool_unavailable`로 처분하라고 안내해야 한다. 모델은 안내대로 SRUM 분석이 이 사건에 적용되지 않는다고 기록하고, 보고서는 SRUM을 검토할 필요가 없던 자료로 읽는다."
setup_ko: "증거 폴더에 SRUDB.dat 경로의 ESE 데이터베이스 머리 부분을 두고(`esedbexport`는 이미지에 없다), 앞 세션에서 Collect 단계로 넘어간 trace를 이어 연 뒤 `misc_srum_export`를 부른다. 비교로 같은 도구를 `tool_unavailable` 사유로 처분한다."
fixture:
- path: case01/analysis/trace.json
  root: outside
  text: "{\n  \"case_id\": \"CASE-001\",\n  \"entries\": [\n    {\n      \"call_id\": 1,\n      \"type\": \"dair_call\",\n      \"ts\": \"2026-11-27T09:12:40Z\",\n      \"current_phase\": \"Triage\",\n      \"phase_rationale\": \"Initial alert triaged; scope the host artifacts next.\",\n      \"transition_recommended\": true,\n      \"next_phase\": \"Collect\",\n      \"transition_rationale\": \"Triage complete; collect SRUM, registry and event logs.\",\n      \"stack_action\": \"push\",\n      \"investigation_focus\": \"Collect SRUM network usage and registry hives from WKSTN-07.\",\n      \"verification_satisfied\": true,\n      \"verification_challenges\": [],\n      \"recommended_actions\": [],\n      \"directives\": {\"priority_tools\": [], \"skip_tools\": [], \"focus_pids\": [], \"focus_paths\": []},\n      \"input_tokens\": 3120,\n      \"output_tokens\": 410,\n      \"phase\": \"Collect\"\n    }\n  ]\n}\n"
# The first bytes of an ESE database header as Windows writes SRUDB.dat:
# checksum, then the signature ef cd ab 89 at offset 4, format version 0x620.
- path: C/Windows/System32/sru/SRUDB.dat
  hex: "5c 1a 3e 7b ef cd ab 89 20 06 00 00 03 00 00 00"
  size: 65536
steps:
- tool: misc_start_execution_log
  note_ko: "준비: 앞 세션의 사건 기록(Collect 단계)을 이어서 연다"
  args:
    case_id: CASE-001
    output_path: ${OUTSIDE}/case01/analysis/trace.json
    case_dir: ${OUTSIDE}/case01
    launch_dashboard: false
- tool: misc_srum_export
  note_ko: "결함 호출: esedbexport가 없는 호스트에서 SRUM을 내보낸다"
  args:
    srudb_path: ${EVIDENCE}/C/Windows/System32/sru/SRUDB.dat
    output_dir: ${OUTSIDE}/case01/analysis/srum
- tool: misc_record_disposition
  note_ko: "비교 호출: 서버가 설치되지 않은 도구용으로 둔 사유 tool_unavailable로 같은 도구를 처분한다"
  args:
    target_kind: tool
    target_id: misc.srum_export
    reason: tool_unavailable
    note: esedbexport is not installed on this analysis host
expect:
- step: 2
  note_ko: 프로그램이 없어 tool_unavailable로 실패한다
  contains: '"status": "tool_unavailable", "tool_unavailable": true, "binary": "esedbexport"'
- step: 2
  note_ko: 같은 응답이 증거에 대해 아무것도 말하지 않는다면서 inapplicable 처분을 권한다
  contains: "An uninstalled tool establishes nothing about the evidence; settle it with misc.record_disposition(target_kind='tool', reason='inapplicable')"
- step: 3
  note_ko: 서버는 같은 도구의 tool_unavailable 처분을 받아 준다
  regex: '"success": true.*"reason": "tool_unavailable"'
