# Matrix case P1024-006: assess_coverage takes only tool names from
# audit.json, which the server appends to in LOGS_DIR across cases and
# sessions, and marks an artifact class examined if any expected tool name
# is there, whatever file it ran on. An auth_summary call recorded by an
# earlier server run on another case makes the auth log of a new case
# "examined" before anything has run on it.
# The fixture writes that earlier record line in the format of
# server._audit (json.dumps of timestamp, tool, params, result_summary) with
# auth_summary's params {"path": ...} and result_summary (linux_auth.py:570),
# to ${DB_DIR}/audit.json; the server is started with FINDEVIL_LOGS_DIR=${DB_DIR}.
case_id: P1024-006
problem: P1024
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
realism_ko: "기본 로그 폴더(`./logs`)의 `audit.json`은 사건 구분 없이 이어 쓰이므로, 같은 설치로 다음 사건을 맡으면 앞 사건의 호출 기록이 그대로 남아 있다."
coverage: full
summary: With an audit.json line left by an earlier run that called auth_summary on another case's auth.log, assess_coverage on a new case marks its auth.log "✅ examined" and returns COVERAGE CLEAN before any tool has run on it.
summary_ko: "앞 실행이 다른 사건의 `auth.log`에 `auth_summary`를 부른 기록이 `audit.json`에 남아 있으면, 새 사건에서 아무 분석도 하지 않고 부른 `assess_coverage`가 이 사건의 `auth.log`를 `✅ examined`로 표시하고 `COVERAGE CLEAN`을 낸다."
defect_ko: "이 서버의 `assess_coverage`는 사건 구분 없이 쌓인 기록에서 도구 이름만 보고, 다른 사건 파일에 부른 호출로 이번 증거를 검사했다고 판정한다. 이번 증거의 그 파일에 대한 호출만 검사로 세야 한다. 모델은 분석하지 않은 인증 로그를 이미 조사했다고 잘못 안다."
setup_ko: "새 사건 증거에 공격 흔적이 든 `var/log/auth.log`를 두고, 앞 실행이 다른 사건 경로(`/cases/2026-118/...`)에 `auth_summary`를 부른 기록 한 줄을 `audit.json`에 미리 넣었다."
fixture:
  - path: audit.json
    root: db
    text: "{\"timestamp\": \"2026-11-20T08:14:02.311540+00:00\", \"tool\": \"auth_summary\", \"params\": {\"path\": \"/cases/2026-118/evidence/var/log/auth.log\"}, \"result_summary\": \"verdict: 0 suspect IPs\"}\n"
  - path: var/log/auth.log
    text: |
      Mar  3 02:11:04 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:07 web01 sshd[2211]: Failed password for root from 203.0.113.7 port 51022 ssh2
      Mar  3 02:11:10 web01 sshd[2214]: Invalid user admin from 203.0.113.7 port 51040
      Mar  3 02:11:12 web01 sshd[2214]: Failed password for invalid user admin from 203.0.113.7 port 51040 ssh2
      Mar  3 02:12:30 web01 sshd[2230]: Accepted password for root from 203.0.113.7 port 51102 ssh2
      Mar  3 02:13:02 web01 sudo:     root : TTY=pts/0 ; PWD=/root ; USER=root ; COMMAND=/usr/sbin/useradd -m -s /bin/bash svc-backup
steps:
  - tool: assess_coverage
    note_ko: "결함 호출: 새 사건에서 분석 전에 조사 범위를 점검함"
    args: {}
expect:
  - step: 1
    note_ko: "기록된 호출이 앞 사건의 한 건뿐이다"
    contains: "- **Tool executions recorded:** 1"
  - step: 1
    note_ko: "분석하지 않은 이번 사건의 인증 로그를 검사했다고 표시한다"
    contains: "| auth log (SSH / sudo / useradd) | `var/log/auth.log` | ✅ examined |"
  - step: 1
    note_ko: "조사 범위에 빈틈이 없다고 판정한다"
    contains: "**Verdict: COVERAGE CLEAN**"
