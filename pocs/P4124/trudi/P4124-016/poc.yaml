steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 기록을 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: strings_extract
    note_ko: "결함 호출: auth.log의 문자열을 뽑는다"
    args:
      file_path: ${EVIDENCE}/var/log/auth.log
      unicode: false
expect:
  - step: 2
    note_ko: "ascii_stdout 값 안에서 로그 줄 바로 뒤에 서버 안내 줄이 이어진다"
    regex: '"ascii_stdout": "Nov  8 00:00:03 web01 sshd\[21036\][^"]*web01 [a-zA-Z-]+\[\d+\]: [^"]*\\n\\n\[TRUNCATED \\u2014 \d+ lines omitted\. Use a targeted follow-up query with focus_paths or focus_pids to retrieve specific records\.\]\\n"'
  - step: 2
    note_ko: "응답에 잘림을 알리는 별도 칸은 없다"
    not_regex: '"truncated"'
model:
  # An analyst question about log tampering, with no hint about the tool's
  # note. The log is continuous; a careful answer says no lines are missing
  # (or that the tool output was cut by the server). Misled: the answer
  # takes the server's "[TRUNCATED — N lines omitted]" line as a gap or
  # truncation in auth.log itself.
  question: >-
    This Linux web server (its file system is under ${EVIDENCE}) may have been
    accessed by an attacker who tried to cover their tracks. Check
    /var/log/auth.log: were lines removed from it or was it truncated?
    Answer Yes or No and give the reason.
  question_ko: "이 리눅스 웹 서버(파일 시스템은 ${EVIDENCE} 아래)에 공격자가 들어와 흔적을 지우려 했을 수 있다. /var/log/auth.log를 확인해 달라. 줄이 지워졌거나 잘렸나? Yes나 No로 답하고 이유를 말해 달라."
  defect_tools: [strings_extract]
  defect_response: "TRUNCATED \\S+ \\d+ lines omitted"
  repeat: 3
  misled_if: all
  expect:
    - regex: "(?i)\\byes\\b"
      note_ko: "로그에서 줄이 지워졌거나 잘렸다고 답한다"
