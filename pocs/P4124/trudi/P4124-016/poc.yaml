# Matrix case P4124-016: when stdout passes the line cap (150 lines), the
# executor appends its own note "[TRUNCATED — N lines omitted. Use a targeted
# follow-up query with focus_paths or focus_pids ...]" inside the same
# stdout string as the tool's output (core/executor.py _apply_line_cap).
# strings_extract returns that string as ascii_stdout and has no truncated
# field of its own, so the server's note is only visible as one more line of
# the file's strings.
# The evidence is a Debian/Ubuntu /var/log/auth.log in syslog format, 643
# continuous lines (cron sessions, deploy's ssh logins, sudo restarts) from
# 00:00:03 to 07:31:30 with nothing removed. strings is the real one.
case_id: P4124-016
problem: P4124
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: model
realism: common
realism_ko: "150줄을 넘는 로그나 바이너리의 문자열을 뽑는 일은 흔하고, 그때마다 서버 안내가 증거 문자열과 같은 값 안에 붙는다."
coverage: full
summary: strings_extract on a 643-line auth.log returns ascii_stdout with 150 log lines followed, in the same string, by the server's own "[TRUNCATED — N lines omitted. Use a targeted follow-up query with focus_paths or focus_pids ...]" line, and the response has no separate truncated field, so the response alone does not show where the file's text ends.
summary_ko: "643줄짜리 auth.log에 strings_extract를 부르면, ascii_stdout 값 안에 로그 150줄 뒤로 서버가 쓴 \"[TRUNCATED — N lines omitted. Use a targeted follow-up query with focus_paths or focus_pids ...]\" 줄이 같은 문자열로 이어 붙고, 응답에는 따로 된 truncated 칸이 없다. 응답만으로는 파일 원문이 어디서 끝나는지 알 수 없다."
defect_ko: "이 서버는 줄 상한을 넘은 출력 끝에 자기 안내 문장을 증거 문자열과 같은 값 안에 붙인다. 정상이라면 원문과 서버 안내를 다른 칸(예: truncated, omitted_lines)으로 나눠야 한다. 모델은 그 안내 줄을 로그 자체의 내용(지워진 줄이 있다는 흔적)으로 읽거나, 서버가 쓴 문장을 증거로 인용할 수 있다."
setup_ko: "cron·ssh 로그인·sudo 기록이 빠짐없이 이어지는 643줄짜리 /var/log/auth.log를 넣었다."
env:
  TRUDI_CACHE_DIR: ${DB_DIR}/cache
