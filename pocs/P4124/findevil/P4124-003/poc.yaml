# Matrix case P4124-003: _run_tool appends "[STDERR]: ..." to stdout in the
# same string, and the basic tools wrap that output with server header lines
# ("## MD5", "## SHA256"), so tool error text, evidence-derived text and
# server text are one undivided block.
case_id: P4124-003
problem: P4124
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
coverage: "partial: only hash_file (the other 5 tools and the [TRUNCATED] note share the cause)"
coverage_ko: "hash_file만 다룬다(나머지 도구 5개와 [TRUNCATED] 알림은 원인이 같다)"
summary: hash_file on a folder returns the md5sum and sha256sum error text behind "[STDERR]:" inside the same text as the server's "## MD5" and "## SHA256" headings, with nothing marking which lines are tool output and which the server wrote.
summary_ko: "폴더에 hash_file을 부르면 md5sum과 sha256sum의 오류 문구가 \"[STDERR]:\" 뒤에, 서버의 \"## MD5\"와 \"## SHA256\" 제목과 같은 글 안에 담겨 돌아온다. 어느 줄이 도구 출력이고 어느 줄을 서버가 썼는지 구분하는 표시가 없다."
fixture:
  - path: case/dir/readme.txt
    text: "x\n"
steps:
  - tool: hash_file
    args:
      path: ${EVIDENCE}/case/dir
expect:
  - step: 1
    regex: "^## MD5\\n\\n\\[STDERR\\]: md5sum: .*Is a directory"
  - step: 1
    regex: "\\n## SHA256\\n\\n\\[STDERR\\]: sha256sum: .*Is a directory"
