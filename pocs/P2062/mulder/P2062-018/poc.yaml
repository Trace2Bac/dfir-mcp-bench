# Matrix case P2062-018: run_hayabusa lowercases min_severity and, when it is
# not one of informational/low/medium/high/critical, silently uses "medium"
# (hayabusa.py: `if severity not in _VALID_SEVERITIES: severity = "medium"`).
# "info" -- the word mulder's own finding severities and Hayabusa's Level
# column use -- therefore drops every informational and low alert.
#
# Stub: the Hayabusa in this image (1.5.2 release) has an empty rules folder
# and stops with "The required rules and config files were not found", so a
# stand-in is put at ${OUTSIDE}/assets/hayabusa/hayabusa and MULDER_ASSET_ROOT
# points there. It reads the EVTX with the python evtx module in the image and
# writes Hayabusa's super-verbose csv-timeline columns for the
# TerminalServices-LocalSessionManager session events, which Hayabusa's
# built-in rules rate informational, honouring -m the way Hayabusa's
# --min-level does. The rule titles follow Hayabusa's RDS session rules but
# are not copied from a rules release.
case_id: P2062-018
problem: P2062
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "mulder의 발견 사항 심각도와 Hayabusa 결과의 Level 칸이 모두 `info`라는 낱말을 쓰므로, 모델이 가장 낮은 단계를 `info`로 주는 일이 있을 수 있다."
coverage: "partial: Hayabusa is a stub (the image has no Hayabusa rules); the same silent fallback in hindsight, mvt, binary and yara listed for this case is not shown"
coverage_ko: "Hayabusa는 stub이다(이미지에 Hayabusa 규칙이 없다). 이 사례에 함께 적힌 hindsight·mvt·binary·yara의 같은 대체는 보이지 않는다."
summary: run_hayabusa with min_severity "info" on a TerminalServices session log runs Hayabusa with -m medium and returns success with total_alerts 0, while min_severity "informational" on the same folder returns the informational session alerts.
summary_ko: "TerminalServices 세션 로그에 `min_severity: \"info\"`로 `run_hayabusa`를 부르면 Hayabusa가 `-m medium`으로 돌아 `total_alerts: 0`이 success로 온다. 같은 폴더에 `\"informational\"`을 주면 informational 세션 경보가 나온다."
defect_ko: "이 서버는 모르는 심각도 값을 알리지 않고 `medium`으로 바꿔 실행한다. 정상이라면 허용 값이 아니라고 거부하거나 바꾼 값을 알려야 한다. 모델은 이 로그에 낮은 단계 경보도 없다고 잘못 안다."
setup_ko: "NIST CFReDS Data Leakage Case PC의 `Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx`(세션 로그온·로그오프 기록)를 `evtx/`에 넣었다."
env:
  MULDER_ASSET_ROOT: ${OUTSIDE}/assets
fixture:
  - path: assets/hayabusa/hayabusa
    root: outside
    mode: "755"
    text: |
      #!/usr/bin/env python3
      # Stand-in for Hayabusa csv-timeline (see the comment at the top of poc.yaml).
      import csv, json, pathlib, sys
      import evtx
      a = sys.argv[1:]
      d, out, m = a[a.index("-d") + 1], a[a.index("-o") + 1], a[a.index("-m") + 1]
      with open(pathlib.Path(__file__).resolve().parents[2] / "hayabusa-args.log", "a") as log:
          log.write(" ".join(a) + "\n")
      order = ["informational", "low", "medium", "high", "critical"]
      if m not in order:
          sys.exit("error: invalid value '%s' for '--min-level <LEVEL>'" % m)
      rules = {21: "RDS Sess Logon", 23: "RDS Sess Logoff", 24: "RDS Sess Disconnect", 25: "RDS Sess Reconnect"}
      cols = ["Timestamp", "RuleTitle", "Level", "Computer", "Channel", "EventID", "RuleAuthor",
              "RuleModifiedDate", "Status", "RecordID", "Details", "ExtraFieldInfo", "MitreTactics",
              "MitreTags", "OtherTags", "Provider", "RuleCreationDate", "RuleFile", "EvtxFile"]
      rows = []
      if order.index(m) <= order.index("informational"):
          for f in sorted(pathlib.Path(d).rglob("*.evtx")):
              for r in evtx.PyEvtxParser(str(f)).records_json():
                  e = json.loads(r["data"])["Event"]
                  s = e["System"]
                  eid = s["EventID"]
                  if eid not in rules:
                      continue
                  u = e.get("UserData", {}).get("EventXML", {})
                  rows.append([r["timestamp"].replace(" UTC", "").replace("T", " "), rules[eid], "info", s["Computer"],
                               "RDS-LSM", eid, "Zach Mathis", "2023/03/16", "stable", r["event_record_id"],
                               "TgtUser: %s ¦ SessID: %s ¦ SrcIP: %s" % (u.get("User", "-"), u.get("SessionID", "-"), u.get("Address", "-")),
                               "", "", "", "", "Microsoft-Windows-TerminalServices-LocalSessionManager", "2022/12/16",
                               "RDS-LSM_%s.yml" % eid, str(f)])
      with open(out, "w", newline="") as fh:
          w = csv.writer(fh, quoting=csv.QUOTE_ALL)
          w.writerow(cols)
          w.writerows(rows)
  - path: evtx/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx
    # NIST CFReDS Data Leakage Case, PC image, copied unchanged (69,632 bytes).
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 생성"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p2062-018
  - tool: run_hayabusa
    note_ko: "결함 호출: `min_severity: info`로 Hayabusa 실행"
    timeout_s: 300
    args:
      evtx_dir: ${EVIDENCE}/evtx
      min_severity: info
  - tool: run_hayabusa
    note_ko: "비교 호출: `min_severity: informational`로 다시 실행(force)"
    timeout_s: 300
    args:
      evtx_dir: ${EVIDENCE}/evtx
      min_severity: informational
      force: true
expect:
  - step: 2
    note_ko: "`info`로 부르면 경보 0건이 success로 온다"
    contains: 'total_alerts\": 0,'
  - step: 2
    note_ko: "응답은 성공이다"
    contains: '"status": "success"'
  - step: 3
    note_ko: "같은 폴더에 `informational`을 주면 informational 경보 25건이 나온다"
    contains: 'total_alerts\": 25, \"by_severity\": {\"info\": 25}'
  - file_regex: ${OUTSIDE}/hayabusa-args.log
    note_ko: "`info`를 준 첫 실행이 Hayabusa에 `-m medium`으로 넘어갔다"
    pattern: '\A[^\n]*-m medium\n[^\n]*-m informational\n'
