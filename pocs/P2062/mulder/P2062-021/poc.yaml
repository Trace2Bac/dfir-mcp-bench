# Matrix case P2062-021: when index_evtx_file's filename is not an exact name
# in the extraction folder, it takes the first file, in sorted order, of the
# glob *<filename>* (evtx.py:524-528) and says nothing. run_evtx_parser names
# the extracted files after their image path (Windows_System32_winevt_Logs_
# <log>.evtx), so "System" matches every log through "System32" and the first
# in sorted order, Application, is indexed in its place.
#
# Evidence: a FAT disk image (made with mkfs.fat and mcopy in this image) of a
# log collection holding Application.evtx and System.evtx from the NIST CFReDS
# Data Leakage Case PC. Each log is cut to its first 64 KiB chunk (124 and 165
# records) with the file header's chunk count, last chunk and next record
# number set to match and its CRC32 recomputed, to keep this file small.
case_id: P2062-021
problem: P2062
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "도구 설명이 \"Recommended order: Security, System, ...\"처럼 로그를 확장자 없는 이름으로 부르므로, 모델이 `filename`에 `System`을 주는 일이 있을 수 있다."
coverage: full
summary: After run_evtx_parser on a disk image with Application.evtx and System.evtx, index_evtx_file with filename "System" indexes the Application log instead (source evtx.windows_system32_winevt_logs_application) and returns success without saying the name did not match.
summary_ko: "Application.evtx와 System.evtx가 든 디스크 이미지에 `run_evtx_parser`를 돌린 뒤 `index_evtx_file(filename=\"System\")`을 부르면 System 대신 Application 로그가 `evtx.windows_system32_winevt_logs_application`으로 색인되고, 이름이 맞지 않았다는 말 없이 success가 온다."
defect_ko: "이 서버는 정확한 이름이 없으면 부분 일치하는 파일 중 사전순 첫 파일로 알리지 않고 바꿔 색인한다. 정상이라면 맞는 파일이 없거나 여럿이라고 알려야 한다. 모델은 System 로그를 색인했다고 잘못 안다."
setup_ko: "Application.evtx와 System.evtx(CFReDS Data Leakage PC의 로그, 첫 청크만)를 `Windows/System32/winevt/Logs/`에 둔 FAT 디스크 이미지 `pc.dd`를 넣었다."
fixture:
  - path: pc.dd
    base64: 
steps:
  - tool: scan_evidence
    note_ko: "준비: 사건 생성"
    args:
      evidence_path: ${EVIDENCE}
      case_id: p2062-021
  - tool: run_evtx_parser
    note_ko: "준비: 디스크 이미지에서 EVTX 추출"
    timeout_s: 300
    args:
      evtx_path: ${EVIDENCE}/pc.dd
  - tool: index_evtx_file
    note_ko: "결함 호출: `System` 로그 색인"
    timeout_s: 300
    args:
      filename: System
  - tool: index_evtx_file
    note_ko: "비교 호출: `System.evtx`로 색인"
    timeout_s: 300
    args:
      filename: System.evtx
expect:
  - step: 3
    note_ko: "`System`을 요청했는데 success로 끝난다"
    contains: '"status": "success"'
  - step: 3
    note_ko: "색인된 것은 Application 로그다"
    contains: '"source": "evtx.windows_system32_winevt_logs_application"'
  - step: 4
    note_ko: "확장자를 붙이면 System 로그가 색인된다"
    contains: '"source": "evtx.windows_system32_winevt_logs_system"'
