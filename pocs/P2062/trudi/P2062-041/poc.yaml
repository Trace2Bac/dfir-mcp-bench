steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 trace를 연다"
    args:
      case_id: CASE-001
      output_path: ${DB_DIR}/analysis/trace.json
      case_dir: ${DB_DIR}
      launch_dashboard: false
  - tool: read_mail
    note_ko: "결함 호출: 메일 헤더 이름 'from'으로 eve가 보낸 메일을 찾는다"
    args:
      mail_path: ${DB_DIR}/exports/mail/j.doe
      query: eve@rival.example
      field: from
  - tool: read_mail
    note_ko: "비교 호출: 정의된 값 'sender'로 같은 주소를 찾는다"
    args:
      mail_path: ${DB_DIR}/exports/mail/j.doe
      query: eve@rival.example
      field: sender
expect:
  - step: 2
    note_ko: "응답은 성공이고 field에 from이 그대로 실린다"
    regex: '"success": true.*"field": "from"'
  - step: 2
    note_ko: "메일함 주인이 eve에게 보낸 메일이 결과에 들어 있다"
    regex: '"from": "John Doe <j\.doe@corp\.example>", "to": "Eve Martin <eve@rival\.example>"'
  - step: 2
    note_ko: "결과는 세 통이다"
    contains: '"match_count": 3'
  - step: 3
    note_ko: "sender로 찾으면 eve가 보낸 한 통만 온다"
    contains: '"match_count": 1'
  - step: 3
    note_ko: "sender로 찾은 결과에는 eve가 보낸 메일이 있다"
    regex: '"from": "Eve Martin <eve@rival\.example>"'
