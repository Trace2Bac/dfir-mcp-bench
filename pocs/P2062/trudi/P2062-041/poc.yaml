# Matrix case P2062-041: read_mail documents field as any | sender |
# recipient | subject | body, but a value outside that list (here 'from', the
# mail header name) is not refused: the lookup returns None and the query is
# matched against sender, recipients, subject and body together ('any'). The
# response echoes field 'from' with success true.
# The store is a readpst -e export (one folder per PST folder, numbered .eml
# files), the layout misc_readpst_extract writes.
case_id: P2062-041
problem: P2062
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "보낸 사람을 가리키는 메일 헤더 이름이 From이라, 보낸 사람으로 찾으려고 field에 'from'을 주는 일은 흔하다."
coverage: 'partial: shows the field fallback only; the mode fallback (an unlisted mode runs as messages) is not called'
coverage_ko: "`field` 대체만 보이고, 목록 밖 `mode`가 messages로 바뀌는 부분은 부르지 않았다."
summary: read_mail with field 'from' and query eve@rival.example returns success with field 'from' echoed and three messages, two of them sent by the mailbox owner to eve, while field 'sender' returns only the one message eve sent.
summary_ko: "`read_mail`에 `field: from`, `query: eve@rival.example`을 주면 응답에 `field: from`이 그대로 실린 채 세 통이 오는데, 그중 두 통은 메일함 주인이 eve에게 보낸 메일이다. `field: sender`로 주면 eve가 보낸 한 통만 온다."
defect_ko: "이 서버는 목록에 없는 `field` 값을 거부하지 않고 모든 필드에서 찾는다. 정상이라면 `from`을 거부하거나 `sender`로 맞춰 보낸 사람만 찾아야 한다. 모델은 메일함 주인이 eve에게 보낸 메일까지 eve가 보낸 메일로 잘못 세고, match_count 3을 eve가 보낸 메일 수로 잘못 안다."
setup_ko: "readpst -e로 뽑은 메일함에 eve@rival.example이 보낸 메일 한 통과, 메일함 주인 j.doe가 eve에게 보낸 메일 두 통, 관계없는 메일 한 통을 넣었다."
