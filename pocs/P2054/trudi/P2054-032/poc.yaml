# Matrix case P2054-032: tsk_hfind documents lookup_type as the hash kind
# ('md5', 'sha1', 'nsrl-md5', 'nsrl-sha1'), but the function passes it to
# `hfind -f`, which takes the path of a file of hashes to look up. hfind then
# refuses the call (-f together with a hash on the command line), so a lookup
# made as documented never reaches the database.
# The hash database is a real md5sum-format list with the index hfind builds
# for it (`hfind -i md5sum known_good.md5`, TSK 4.x text index); a plain
# `hfind known_good.md5 <hash>` finds the calc.exe entry.
case_id: P2054-032
problem: P2054
server: trudi
variant: trudi-88fbca7
commit: 88fbca78186b6a0ca40423cf5e37a9dc46ae051e
display: response
level: mcp
realism: common
realism_ko: "알려진 정상 파일 해시 DB(NSRL·md5sum 목록)에서 해시를 찾아보는 일은 분석에서 흔하고, 모델은 안내대로 lookup_type에 'md5'를 넣거나 기본값을 쓴다."
coverage: full
summary: tsk_hfind is called on an indexed md5sum hash database with lookup_type 'md5', as documented, and with the default; both times hfind is run as `hfind -f md5 ...` and refuses the call, so a hash that is in the database is never looked up.
summary_ko: "색인된 md5sum 해시 DB에 대해 `tsk_hfind`를 안내대로 `lookup_type='md5'`로, 또 기본값으로 부른다. 두 번 모두 `hfind -f md5 ...`로 실행되어 hfind가 호출을 거부하고, DB에 있는 해시도 조회되지 않는다."
defect_ko: "이 서버는 해시 종류로 알린 `lookup_type` 값을 `hfind -f`(조회할 해시 목록 파일) 자리에 넣는다. 정상이라면 해시 종류에 맞게 DB를 조회해 일치 항목을 돌려줘야 한다. 모델은 정의대로 불렀는데 거부되므로 해시 DB나 인자가 잘못됐다고 잘못 알고, 알려진 정상 파일 판정을 건너뛴다."
setup_ko: "notepad.exe·calc.exe 두 항목이 든 md5sum 형식 해시 DB와 hfind가 만든 색인 파일을 넣었다. calc.exe의 MD5로 조회한다."
fixture:
  - path: hashdb/known_good.md5
    text: |
      098f6bcd4621d373cade4e832627b4f6  C:/Windows/System32/notepad.exe
      5d41402abc4b2a76b9719d911017c592  C:/Windows/System32/calc.exe
  # written by `hfind -i md5sum known_good.md5` (TSK 4.x)
  - path: hashdb/known_good.md5-md5.idx
    text: |
      00000000000000000000000000000000000000000|md5sum
      00000000000000000000000000000000000000001|known_good.md5
      098F6BCD4621D373CADE4E832627B4F6|0000000000000000
      5D41402ABC4B2A76B9719D911017C592|0000000000000066
  - path: case01/analysis/.keep
    root: outside
    text: ""
steps:
  - tool: misc_start_execution_log
    note_ko: "준비: 사건 기록을 연다"
    args:
      case_id: CASE-001
      output_path: ${OUTSIDE}/case01/analysis/trace.json
      case_dir: ${OUTSIDE}/case01
      launch_dashboard: false
  - tool: tsk_hfind
    note_ko: "결함 호출: 안내대로 lookup_type='md5'로 calc.exe의 MD5를 조회"
    args:
      hash_db: ${EVIDENCE}/hashdb/known_good.md5
      hash_value: 5d41402abc4b2a76b9719d911017c592
      lookup_type: md5
  - tool: tsk_hfind
    note_ko: "결함 호출: lookup_type을 빼고(기본값 'md5') 같은 해시를 조회"
    args:
      hash_db: ${EVIDENCE}/hashdb/known_good.md5
      hash_value: 5d41402abc4b2a76b9719d911017c592
expect:
  - step: 2
    note_ko: "실행된 명령에 lookup_type 값이 -f 뒤에 들어가 있다"
    contains: '"cmd": "hfind -f md5 '
  - step: 2
    note_ko: "hfind가 -f와 해시를 함께 받았다며 거부한다, 즉 lookup_type이 해시 목록 파일 자리에 들어갔다"
    contains: "-f can't be used when hashes are also given"
  - step: 2
    note_ko: "DB에 있는 calc.exe 항목이 응답에 없다"
    not_contains: "calc.exe"
  - step: 3
    note_ko: "기본값으로 불러도 같은 거부가 온다"
    contains: "-f can't be used when hashes are also given"
