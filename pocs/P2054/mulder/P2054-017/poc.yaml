# Matrix case P2054-017: get_timeline and search describe t_start/t_end as
# ISO 8601 times, but the handlers compare them as strings with event_time,
# which mulder stores as a naive 'YYYY-MM-DDTHH:MM:SS' (_parse_timestamp's
# isoformat()). A date-only t_end ('2020-06-30') sorts before every event of
# that day, and an offset ('+09:00') is ignored, so both return success with
# no events.
case_id: P2054-017
problem: P2054
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "하루치 사건을 보려고 `t_end`에 날짜만 주거나, 현지 시각(KST 등)으로 받은 사고 시각을 오프셋과 함께 넘기는 것은 ISO 8601 안에서 자연스러운 입력이다."
coverage: full
summary: >-
  On a PowerShell Operational log whose lsass dump script block ran at
  2020-06-30 14:24:08 UTC, get_timeline for t_start='2020-06-30',
  t_end='2020-06-30' and for 23:20-23:30+09:00 (the same minutes in KST) both
  return success with 0 events, and search for MiniDumpWriteDump with the
  date-only range returns 0 matches; the range written out in UTC returns the
  events.
summary_ko: "lsass 덤프 스크립트 블록이 2020-06-30 14:24:08 UTC에 실행된 PowerShell Operational 로그에서, `get_timeline`을 `t_start='2020-06-30'`, `t_end='2020-06-30'`으로 부르거나 같은 시각을 KST(`23:20~23:30+09:00`)로 주면 둘 다 success에 0건이다. 같은 날짜 범위로 `MiniDumpWriteDump`를 `search`해도 0건이다. UTC로 풀어 쓴 범위에서는 그 사건이 나온다."
defect_ko: "이 서버는 ISO 8601이라고 알린 `t_start`·`t_end`를 저장된 시각 문자열과 사전식으로만 비교해, 날짜만 준 `t_end`는 그날 0시로, `+09:00` 오프셋은 없는 것처럼 다룬다. ISO 8601로 받았다면 날짜만 준 끝은 그날 전체로, 오프셋은 UTC로 바꿔 비교하거나 거부해야 한다. 모델은 그 시간대에 사건이 없었다고 잘못 안다."
setup_ko: "lsass를 MiniDumpWriteDump로 덤프하는 스크립트 블록(4104)이 2020-06-30 14:24:08 UTC에 남은 공개 샘플 PowerShell Operational 로그를 두고 `run_evtx_parser`로 적재했다. 그 시각은 KST로 23:24다."
