    args:
      t_start: "2020-06-30"
      t_end: "2020-06-30"
  - tool: get_timeline
    note_ko: "결함 호출: 사고 시각 전후 10분을 KST 오프셋으로 지정"
    args:
      t_start: "2020-06-30T23:20:00+09:00"
      t_end: "2020-06-30T23:30:00+09:00"
  - tool: get_timeline
    note_ko: "비교 호출: 같은 10분을 UTC로 지정"
    args:
      t_start: "2020-06-30T14:20:00Z"
      t_end: "2020-06-30T14:30:00Z"
  - tool: search
    note_ko: "결함 호출: 날짜만 준 범위로 `MiniDumpWriteDump` 검색"
    args:
      query: MiniDumpWriteDump
      t_start: "2020-06-30"
      t_end: "2020-06-30"
  - tool: search
    note_ko: "비교 호출: 시간 범위 없이 같은 검색"
    args:
      query: MiniDumpWriteDump
expect:
  - step: 2
    note_ko: "로그가 `ez.evtx`로 적재된다"
    regex: '"status": "success"[\s\S]*"source": "ez.evtx"'
  - step: 3
    note_ko: "날짜만 준 하루 범위가 success에 0건이다"
    regex: '"status": "success"[\s\S]*"total_events": 0\b'
  - step: 4
    note_ko: "KST 오프셋을 준 10분 범위가 success에 0건이다"
    regex: '"status": "success"[\s\S]*"total_events": 0\b'
  - step: 5
    note_ko: "같은 10분을 UTC로 주면 14:24:08의 스크립트 블록이 나온다"
    contains: '"event_time": "2020-06-30T14:24:08"'
  - step: 6
    note_ko: "날짜만 준 범위의 검색이 success에 0건이다"
    regex: '"status": "success"[\s\S]*"total_matches": 0\b'
  - step: 7
    note_ko: "범위 없이 찾으면 같은 날 14:24:08의 창이 나온다"
    contains: '"event_time": "2020-06-30T14:24:08"'
