# Matrix case P2054-015: search says that without `source` it searches all
# ingested evidence, but with regex=True the handler turns source=None into
# '' and get_windows_page then matches only source_name = '' OR LIKE '.%',
# so a regex search over all evidence returns total_matches 0 even when the
# text is indexed. The description adds that zero results mean a claim is
# unsupported by evidence.
case_id: P2054-015
problem: P2054
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "IP·파일 이름 패턴을 정규식으로 전체 증거에서 찾는 것은 흔하고, 설명이 `source`를 생략하면 전체를 찾는다고 하므로 모델은 `source` 없이 부른다."
coverage: full
summary: >-
  After run_pcap_analysis indexes an HTTP download of /dl/svchost.exe from
  203.0.113.7, search with regex=True and no source returns success with
  total_matches 0, while the same regex with source='pcap' and a keyword
  search without source both find the request.
summary_ko: "`run_pcap_analysis`가 203.0.113.7에서 `/dl/svchost.exe`를 받은 HTTP 요청을 적재한 뒤, `source` 없이 `regex=True`로 찾으면 success에 `total_matches: 0`이 온다. 같은 정규식에 `source='pcap'`을 주거나 `source` 없이 키워드로 찾으면 그 요청이 나온다."
defect_ko: "이 서버는 정규식 검색에서 생략된 `source`를 빈 문자열로 바꿔 어떤 출처와도 맞지 않는 조건으로 찾는다. 설명대로라면 `source`를 생략하면 적재된 모든 증거를 찾아야 한다. 모델은 0건을 보고 그 IP·파일이 증거에 없다(설명대로 '주장이 뒷받침되지 않는다')고 잘못 안다."
setup_ko: "업데이트 서버에서 받은 요청 하나와 203.0.113.7에서 `/dl/svchost.exe`를 받은 요청 하나가 든 pcap을 두고 HTTP 모드로 적재했다."
