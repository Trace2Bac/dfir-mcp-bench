steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: regex-no-source
  - tool: run_pcap_analysis
    note_ko: "pcap의 HTTP 요청 적재"
    args:
      pcap_path: ${EVIDENCE}/net/capture.pcap
      mode: http
  - tool: search
    note_ko: "결함 호출: `source` 없이 정규식으로 전체 증거 검색"
    args:
      query: "203\\.0\\.113\\.\\d+"
      regex: true
  - tool: search
    note_ko: "비교 호출: 같은 정규식에 `source='pcap'`"
    args:
      query: "203\\.0\\.113\\.\\d+"
      regex: true
      source: pcap
  - tool: search
    note_ko: "비교 호출: `source` 없이 키워드 검색"
    args:
      query: "203.0.113.7"
expect:
  - step: 2
    note_ko: "HTTP 출력이 `pcap.http`로 적재된다"
    contains: "pcap.http"
  - step: 3
    note_ko: "`source` 없는 정규식 검색이 success로 돌아온다"
    regex: '"status": "success"'
  - step: 3
    note_ko: "`source` 없는 정규식 검색이 0건이다"
    regex: '"total_matches": 0\b'
  - step: 4
    note_ko: "같은 정규식에 `source='pcap'`을 주면 `pcap.http` 창 1건이 나온다"
    regex: '"total_matches": 1\b[\s\S]*"sources_matched": \[\s*"pcap.http"'
  - step: 5
    note_ko: "`source` 없는 키워드 검색도 `pcap.http` 창 1건을 찾는다"
    regex: '"total_matches": 1\b[\s\S]*"sources_matched": \[\s*"pcap.http"'
