# Matrix case P2054-016: run_zeek_analysis lists "smb" among the valid
# `protocols` values, but the handler keeps a Zeek log only when its file
# stem equals a listed value, and Zeek writes SMB as smb_files.log and
# smb_mapping.log. protocols=["smb"] therefore drops every SMB log and
# returns success with nothing.
case_id: P2054-016
problem: P2054
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: common
realism_ko: "측면 이동을 볼 때 SMB만 골라 보는 것은 흔하고, `smb`는 설명이 허용 값으로 적은 값이다."
coverage: full
summary: >-
  On a pcap where 10.0.2.42 maps \\10.0.1.5\ADMIN$ and writes PSEXESVC.exe
  over SMB2, run_zeek_analysis with protocols=["smb"] returns success with
  empty log_summaries and no connections, while protocols=["smb_files",
  "smb_mapping"] returns both SMB logs.
summary_ko: "10.0.2.42가 SMB2로 `\\\\10.0.1.5\\ADMIN$`에 연결해 `PSEXESVC.exe`를 쓰는 pcap에서, `run_zeek_analysis`를 `protocols=[\"smb\"]`로 부르면 success에 `log_summaries`가 비어 있다. `protocols=[\"smb_files\", \"smb_mapping\"]`으로 부르면 SMB 로그 두 개가 나온다."
defect_ko: "이 서버는 `smb`를 허용 값으로 알리지만 Zeek 로그 파일 이름과 정확히 같은 값만 남겨, `smb_files.log`·`smb_mapping.log`가 모두 빠진다. `smb`를 주면 SMB 로그(`smb_*`)를 모두 남겨야 한다. 모델은 이 pcap에 SMB 활동(PsExec 흔적)이 없다고 잘못 안다."
setup_ko: "10.0.2.42가 10.0.1.5의 `ADMIN$` 공유에 연결해 `PSEXESVC.exe`를 만들고 쓰는 SMB2 세션 하나(협상, 세션 설정, 트리 연결, 파일 생성·쓰기·닫기)가 든 pcap을 두었다."
