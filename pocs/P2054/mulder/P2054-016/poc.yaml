steps:
  - tool: scan_evidence
    note_ko: "사건 만들기"
    args:
      evidence_path: ${EVIDENCE}
      case_id: zeek-smb-filter
  - tool: run_zeek_analysis
    note_ko: "결함 호출: 설명의 허용 값 `smb`로 SMB 로그만 보기"
    args:
      pcap_path: ${EVIDENCE}/net/lateral.pcap
      protocols: ["smb"]
  - tool: run_zeek_analysis
    note_ko: "비교 호출: Zeek 로그 파일 이름(`smb_files`, `smb_mapping`)으로 보기"
    args:
      pcap_path: ${EVIDENCE}/net/lateral.pcap
      protocols: ["smb_files", "smb_mapping"]
expect:
  - step: 2
    note_ko: "`smb`로 부르면 success에 로그 요약이 비어 있다"
    regex: '"status": "success"[\s\S]*\\"log_summaries\\": \[\]'
  - step: 3
    note_ko: "파일 이름으로 부르면 `smb_files` 로그가 나온다"
    contains: '\"log_type\": \"smb_files\"'
  - step: 3
    note_ko: "파일 이름으로 부르면 `smb_mapping` 로그가 나온다"
    contains: '\"log_type\": \"smb_mapping\"'
