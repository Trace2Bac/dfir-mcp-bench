# Matrix case P2054-038: get_tool_guide documents inputs that the tools'
# inputSchema does not have (correlate_across_sources "optional query
# filter", get_raw_output "optional tool filter", index_evtx_file "optional
# channel and time filters", ...). The SDK drops an argument that is not in
# the schema and the call succeeds, so a filter given as the guide says is
# silently not applied. This PoC shows correlate_across_sources' query.
case_id: P2054-038
problem: P2054
server: mulder
variant: mulder-3164843
commit: 3164843baf74c7fe69e7121dbd6150f8f77ce660
display: multi-call
level: mcp
realism: possible
realism_ko: "mulder는 다음 도구를 고를 때 `get_tool_guide`를 부르라고 안내하므로, 모델이 안내서에 적힌 대로 `query` 필터를 붙여 부르는 일은 있을 수 있다."
coverage: "partial: shows correlate_across_sources' query filter only; the guide's other inputs that are not in the schema (get_raw_output tool, list_directory source, index_evtx_file channel/time, read_evidence_file inode) are not called"
coverage_ko: "`correlate_across_sources`의 `query` 필터만 보인다. 안내서의 다른 없는 입력(`get_raw_output`의 tool, `list_directory`의 source, `index_evtx_file`의 channel·time, `read_evidence_file`의 inode)은 부르지 않았다."
summary: >-
  get_tool_guide lists correlate_across_sources with "optional query
  filter"; called with t_start/t_end around a PowerShell lsass dump and
  query='Invoke-Mimikatz', it returns success with both event windows of the
  hour, while search for Invoke-Mimikatz in the same hour returns 0 matches.
summary_ko: "`get_tool_guide`는 `correlate_across_sources`의 입력을 '선택 query 필터'라고 적는다. PowerShell lsass 덤프 전후 한 시간에 `query='Invoke-Mimikatz'`를 붙여 부르면 그 시간의 사건 창 2개가 모두 success로 온다. 같은 시간 `Invoke-Mimikatz` 검색은 0건이다."
defect_ko: "이 서버의 안내서는 `correlate_across_sources`에 없는 `query` 인자를 적고, 그 인자는 버려진 채 호출이 성공한다. 안내서는 실제 인자만 적거나, 서버가 모르는 인자를 거부해야 한다. 모델은 거르지 않은 결과를 'Invoke-Mimikatz와 관련된 사건'으로 잘못 안다."
setup_ko: "2020-06-30 14:23~14:24 UTC 사건 4건이 든 공개 샘플 PowerShell Operational 로그를 `run_evtx_parser`로 적재했다. 로그에 `Invoke-Mimikatz`는 없다."
