# Matrix case P2054-004: get_audit_trail documents filter_since as ISO 8601,
# but it compares the string lexically with the audit timestamps, which are
# UTC isoformat() strings ("2025-06-01T12:00:00+00:00").
# - The ISO 8601 basic form "20250101T000000Z" sorts after "2025-..." because
#   "0" > "-", so an entry made after that time is dropped.
# - "2025-06-01T20:00:00+09:00" is 11:00 UTC, before the 12:00 UTC entry, but
#   "T20" sorts after "T12", so the entry is dropped.
# The audit entry is a fixture (format of server._audit) written to
# ${DB_DIR}/audit.json with root: db (FINDEVIL_LOGS_DIR=${DB_DIR}), so the
# times do not depend on when the PoC runs.
case_id: P2054-004
problem: P2054
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: possible
coverage: "partial: the space-separated format (shown in P2061-002)"
summary: With an auth_summary call recorded at 2025-06-01T12:00:00+00:00, get_audit_trail returns 0 entries for filter_since "20250101T000000Z" (ISO 8601 basic form) and for "2025-06-01T20:00:00+09:00" (11:00 UTC), while the unfiltered trail shows the call, so a call that really happened after the filter time is reported as absent.
fixture:
  - path: audit.json
    root: db
    text: "{\"timestamp\": \"2025-06-01T12:00:00.000000+00:00\", \"tool\": \"auth_summary\", \"params\": {\"path\": \"/evidence/var/log/auth.log\"}, \"result_summary\": \"# Auth Log Summary ... LIKELY COMPROMISE\"}\n"
steps:
  - tool: get_audit_trail
    args:
      filter_since: "20250101T000000Z"
  - tool: get_audit_trail
    args:
      filter_since: "2025-06-01T20:00:00+09:00"
  - tool: get_audit_trail
    args: {}
expect:
  - step: 1
    contains: "# Audit trail (0 matching entries"
  - step: 2
    contains: "# Audit trail (0 matching entries"
  - step: 3
    contains: "**2025-06-01T12:00:00.000000+00:00** `auth_summary`"
