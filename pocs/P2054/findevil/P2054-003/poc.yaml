# Matrix case P2054-003: log_search's own example pattern
# '192\.168\.1\.\d+' is run with grep -E. In GNU grep \d is not a digit class
# in ERE (it is a -P feature), so the example matches nothing.
# Needs GNU grep (the Docker image); macOS BSD grep accepts \d.
case_id: P2054-003
problem: P2054
server: findevil
variant: findevil-d1a8d25
commit: d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1
display: response
level: mcp
realism: common
coverage: full
summary: Sending the pattern exactly as the log_search description gives it, 192\.168\.1\.\d+, against a log that has 192.168.1.50, returns no matching line ("No matches found", grep's "stray \ before d" warning, or an empty result, depending on the grep version) because grep -E does not treat \d as a digit.
summary_ko: "log_search 설명에 나온 그대로의 패턴 192\\.168\\.1\\.\\d+를 192.168.1.50이 있는 로그에 보내면 일치하는 줄이 나오지 않는다(grep 버전에 따라 \"No matches found\", grep의 \"stray \\ before d\" 경고, 또는 빈 결과). grep -E는 \\d를 숫자로 다루지 않기 때문이다."
fixture:
  - path: auth.log
    text: "Apr 12 14:30:04 web01 sshd[2211]: Accepted password for root from 192.168.1.50 port 51122 ssh2\n"
steps:
  - tool: log_search
    args:
      path: ${EVIDENCE}/auth.log
      pattern: "192\\.168\\.1\\.\\d+"
      context_lines: 0
  - tool: log_search
    args:
      path: ${EVIDENCE}/auth.log
      pattern: "192\\.168\\.1\\.[0-9]+"
      context_lines: 0
expect:
  # GNU grep 3.8+ also prints "warning: stray \ before d" on stderr; with
  # exit code 1 the server then returns that warning instead of
  # "No matches found", so either text is accepted. The defect is that the
  # IP line is missing.
  - step: 1
    not_contains: "192.168.1.50"
  - step: 1
    regex: "No matches found for pattern|stray \\\\ before d|^\\s*\\[STDERR\\]: ?\\s*$"
  - step: 2
    contains: "192.168.1.50"
