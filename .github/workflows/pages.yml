# Builds the results site from experiments/ and publishes it on GitHub Pages
# (https://trace2bac.github.io/dfir-mcp-bench/) when main changes.
# Settings > Pages > Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: [experiments/**, cases/**, datasets/**, servers/mulder/variants/**, docs/**, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
