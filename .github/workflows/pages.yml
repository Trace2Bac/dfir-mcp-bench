# Builds the results site and publishes it on GitHub Pages
# (https://trace2bac.github.io/dfir-mcp-bench/) when a version tag is pushed:
# v<YYYY-MM-DD>, or v<YYYY-MM-DD>.<n> for another release on the same day.
# Pushes to main do not deploy.
# Settings > Pages > Source must be "GitHub Actions", and Settings >
# Environments > github-pages must allow the tag rule v*.
name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check the tag
        if: github.ref_type == 'tag'
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not v<YYYY-MM-DD> or v<YYYY-MM-DD>.<n>."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
