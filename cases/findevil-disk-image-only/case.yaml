id: findevil-disk-image-only
title: assess_coverage on a folder that holds only a disk image
title_ko: 디스크 이미지만 있는 폴더에서의 assess_coverage
name: "NIST Hacking Case image, findevil coverage"   # short name for lists
name_ko: "NIST Hacking Case 이미지, findevil 진척 평가"
dataset: nist-hacking-case
evidence: nist-hacking-case
purpose: |
  The NIST Hacking Case EnCase image (two segments), not mounted, as
  findevil's evidence folder. findevil reads files, not disk images, and
  recognizes none of these as an artifact it checks. No analysis tool is
  called: the evidence is listed, then assess_coverage is asked.
purpose_ko: |
  NIST Hacking Case의 EnCase 이미지(조각 두 개)를 마운트하지 않은 채 findevil의 증거 폴더로 씁니다. findevil은 디스크 이미지가 아니라 파일을 읽으므로, 이 중 어느 것도 점검하는 자료로 알아보지 못합니다. 분석 도구는 부르지 않고, 증거 목록을 본 뒤 assess_coverage를 부릅니다.

setup: []

tools: [list_evidence, assess_coverage]

scripted:                             # --scripted: fixed calls, no model
  - tool: list_evidence
    args: {}
  - tool: assess_coverage
    args: {}

# The coverage report is the answer.
questions:
  - id: Q1
    text: With nothing analyzed and nothing recognized, does the coverage report avoid calling the investigation clean?
    text_ko: "아무것도 분석하지 않았고 알아본 자료도 없을 때, 커버리지 보고서가 조사를 CLEAN이라고 하지 않나요?"
    expect: {all: ["Verdict: NOT ASSESSED"], none: ["COVERAGE CLEAN"]}
    requires_tools: [assess_coverage]
  - id: Q2
    text: Does the report say why nothing was assessed?
    text_ko: "보고서가 평가하지 못한 이유를 말하나요?"
    expect: {all: ["disk images and Windows artifacts"]}
    requires_tools: [assess_coverage]

limits: {max_turns: 12, max_tool_chars: 8000}
