id: linux-ten-hosts-examine
title: Examine the auth logs of ten Linux hosts
title_ko: 리눅스 호스트 열 대의 인증 로그 검사
name: "Ten Linux hosts, examine auth logs"   # short name for lists
name_ko: "리눅스 호스트 열 대, 인증 로그 검사"
dataset: linux-ten-hosts
evidence: linux-ten-hosts
purpose: |
  Ten hosts' auth logs, one folder per host, asked in the words of findevil's
  coverage report: every host's auth log has to be examined, and
  assess_coverage says which auth logs it counts as examined. Only app-1
  (Honeynet Forensic Challenge 5, a real log) was broken into, by SSH brute
  force; it is fifth or sixth of the ten in name order.

  - Q1 asks which hosts' auth logs were examined, and is checked against the
    auth_summary calls the agent actually made.
  - Q2 asks for the break-in. A run that never examined app-1 cannot answer
    it from the tools.
purpose_ko: |
  호스트 열 대의 인증 로그가 호스트마다 폴더 하나씩 있고, 이를 findevil 진척 보고의 표현으로 묻습니다. 모든 호스트의 인증 로그를 검사(examine)해야 하고, assess_coverage는 어떤 인증 로그를 검사한 것으로 세는지 보여 줍니다. 침입당한 것은 app-1(Honeynet Forensic Challenge 5, 실제 로그)뿐이고, 이름 순으로 열 대 중 다섯째나 여섯째입니다.

  - Q1은 어떤 호스트의 인증 로그를 검사했는지 묻고, 에이전트가 실제로 부른 auth_summary와 대조합니다.
  - Q2는 침입을 묻습니다. app-1을 검사하지 않은 실행은 도구 결과로 답할 수 없습니다.

setup: []

tools: [list_evidence, auth_summary, assess_coverage]

scripted: []

questions:
  - id: Q1
    text: "Examine every host's auth log. Which hosts' auth logs were examined?"
    text_ko: "모든 호스트의 인증 로그를 검사하세요. 어떤 호스트의 인증 로그를 검사했나요?"
    review_only: true   # checked against the auth_summary calls in the run
  - id: Q2
    source: 1           # Honeynet question 1, asked of every host
    text: "Was any host broken into over SSH? If so, give the host and the source IP."
    text_ko: "SSH로 침입당한 호스트가 있나요? 있다면 호스트와 출발지 IP를 적으세요."
    # Answer: app-1, from 219.150.161.20 (530 failed passwords, then a root
    # login at Apr 19 05:41:44).
    expect: {all: ["app-1", "219.150.161.20"]}
    requires_any_tool: [auth_summary]

limits: {max_turns: 60, max_tool_chars: 4000}
