id: nist-data-leakage
title: NIST CFReDS Data Leakage Case, questions with short answers
title_ko: NIST CFReDS Data Leakage Case, 답이 짧은 질문
name: "NIST Data Leakage Case"       # short name for lists
name_ko: "NIST Data Leakage Case"
dataset: nist-data-leakage
evidence: nist-data-leakage
purpose: >
  25 of the 60 questions in NIST's answer document, asked over the EnCase
  images of a Windows 7 PC, a USB stick and a CD-R. Chosen are the
  questions whose answer is a short fact (a hash, a name, an address, a date,
  a list of names) rather than a long table or a timeline; the wording is
  NIST's, numbered here in order (NIST's number in a comment). Expected facts
  come from NIST's answers; Q22 is left to a reviewer. Dates and times in
  NIST's answers are in the PC's time zone (US Eastern, daylight time in
  effect); a reviewer should accept the same moment in UTC.
purpose_ko: >
  NIST 답안 문서의 질문 60개 중 25개를, Windows 7 PC와 USB 메모리, CD-R의 EnCase 이미지에 대해
  묻는다. 답이 긴 표나 타임라인이 아니라 짧은 사실(해시, 이름, 주소, 날짜, 이름 목록)인 질문을
  골랐다. 문구는 NIST의 것이고 여기서 순서대로 번호를 다시 매겼다(NIST 번호는 주석에). 기대 사실은
  NIST 답안에서 가져왔고, Q22는 검토자가 판정한다. NIST 답안의 날짜와 시각은 PC의 시간대(미국
  동부, 서머타임 적용) 기준이므로, 검토자는 같은 시점의 UTC 표기도 인정해야 한다.
answers_source: https://cfreds-archive.nist.gov/data_leakage_case/leakage-answers.pdf

setup:
  - tool: scan_evidence
    args: {evidence_path: "${EVIDENCE}", case_id: "${CASE_ID}"}

# For bench-runner runs. mulder investigate picks from all of mulder's tools.
tools:
  - get_tool_guide
  - list_sources
  - run_mmls
  - run_fls
  - list_files
  - get_deleted_files
  - get_file_metadata
  - extract_file_by_inode
  - run_regripper
  - query_registry_value
  - run_strings
  - parse_browser_history
  - run_evtx_parser
  - search
  - get_raw_output

# No scripted calls yet: the scripted ceiling for this case has not been measured.
scripted: []

# Any tool that reads the evidence: an answer with no tool call behind it
# (the answers are public) does not pass.
x-reads-evidence: &reads_evidence
  [run_fls, list_files, get_deleted_files, get_file_metadata, extract_file_by_inode, run_regripper,
   run_registry_parser, query_registry_value, run_strings, search, get_raw_output, read_evidence_file,
   parse_browser_history, run_evtx_parser, run_mft_parser, parse_mft, run_plaso, start_extraction_batch]

questions:
  - id: Q1   # NIST 1
    text: "What are the hash values (MD5 & SHA-1) of all images? Does the acquisition and verification hash value match?"
    text_ko: "모든 이미지의 해시 값(MD5, SHA-1)은? 획득 해시와 검증 해시가 일치하는가?"
    expect: {all: ["A49D1254C873808C58E6F1BCD60B5BDE", "B4644902ACAB4583A1D0F9F1A08FAA77", "DF914108FB3D86744EB688EBA482FBDF"]}
    requires_any_tool: *reads_evidence
  - id: Q2   # NIST 3
    text: "Explain installed OS information in detail. (OS name, install date, registered owner...)"
    text_ko: "설치된 OS 정보를 자세히 설명하라. (OS 이름, 설치 날짜, 등록된 소유자...)"
    expect: {all: ["Windows 7 Ultimate", "2015-03-22", "informant"]}
    requires_any_tool: *reads_evidence
  - id: Q3   # NIST 4
    text: "What is the timezone setting?"
    text_ko: "시간대 설정은?"
    expect: {all: ["Eastern"]}
    requires_any_tool: *reads_evidence
  - id: Q4   # NIST 5
    text: "What is the computer name?"
    text_ko: "컴퓨터 이름은?"
    expect: {all: ["INFORMANT-PC"]}
    requires_any_tool: *reads_evidence
  - id: Q5   # NIST 6
    text: "List all accounts in OS except the system accounts: Administrator, Guest, systemprofile, LocalService, NetworkService. (Account name, login count, last logon date...)"
    text_ko: "시스템 계정(Administrator, Guest, systemprofile, LocalService, NetworkService)을 뺀 OS 계정을 모두 나열하라. (계정 이름, 로그인 횟수, 마지막 로그온 날짜...)"
    expect: {all: ["informant", "admin11", "ITechTeam", "Temporary"]}
    requires_any_tool: *reads_evidence
  - id: Q6   # NIST 7
    text: "Who was the last user to logon into PC?"
    text_ko: "PC에 마지막으로 로그온한 사용자는?"
    expect: {all: ["informant"]}
    requires_any_tool: *reads_evidence
  - id: Q7   # NIST 8; 11:31:05 Eastern daylight time is 15:31:05 UTC
    text: "When was the last recorded shutdown date/time?"
    text_ko: "마지막으로 기록된 종료 날짜와 시각은?"
    expect: {all: ["2015-03-25"]}
    requires_any_tool: *reads_evidence
  - id: Q8   # NIST 9
    text: "Explain the information of network interface(s) with an IP address assigned by DHCP."
    text_ko: "DHCP로 IP 주소를 받은 네트워크 인터페이스의 정보를 설명하라."
    expect: {all: ["10.11.11.129"]}
    requires_any_tool: *reads_evidence
  - id: Q9   # NIST 10
    text: "What applications were installed by the suspect after installing OS?"
    text_ko: "용의자가 OS 설치 후에 설치한 응용 프로그램은?"
    expect: {any: ["Office", "Chrome", "Apple Application Support", "Bonjour", "Apple Software Update", "Google Drive", ".NET Framework", "Eraser"], min: 6}
    requires_any_tool: *reads_evidence
  - id: Q10  # NIST 13
    text: "What web browsers were used?"
    text_ko: "어떤 웹 브라우저가 쓰였는가?"
    expect: {all: ["Internet Explorer", "Chrome"]}
    requires_any_tool: *reads_evidence
  - id: Q11  # NIST 18
    text: "What application was used for e-mail communication?"
    text_ko: "이메일 통신에 쓰인 응용 프로그램은?"
    expect: {all: ["Outlook"]}
    requires_any_tool: *reads_evidence
  - id: Q12  # NIST 20
    text: "What was the e-mail account used by the suspect?"
    text_ko: "용의자가 쓴 이메일 계정은?"
    expect: {all: ["iaman.informant@nist.gov"]}
    requires_any_tool: *reads_evidence
  - id: Q13  # NIST 22
    text: "List external storage devices attached to PC."
    text_ko: "PC에 연결된 외부 저장 장치를 나열하라."
    expect: {all: ["4C530012450531101593", "4C530012550531106501"]}
    requires_any_tool: *reads_evidence
  - id: Q14  # NIST 24
    text: "What is the IP address of company's shared network drive?"
    text_ko: "회사 공유 네트워크 드라이브의 IP 주소는?"
    expect: {all: ["10.11.11.128"]}
    requires_any_tool: *reads_evidence
  - id: Q15  # NIST 29
    text: "Find traces related to cloud services on PC. (Service name, log files...)"
    text_ko: "PC에서 클라우드 서비스와 관련된 흔적을 찾아라. (서비스 이름, 로그 파일...)"
    expect: {all: ["Google Drive", "iCloud"]}
    requires_any_tool: *reads_evidence
  - id: Q16  # NIST 30
    text: "What files were deleted from Google Drive? Find the filename and modified timestamp of the file."
    text_ko: "Google Drive에서 삭제된 파일은? 파일 이름과 수정 시각을 찾아라."
    expect: {all: ["happy_holiday.jpg", "do_u_wanna_build_a_snow_man.mp3"]}
    requires_any_tool: *reads_evidence
  - id: Q17  # NIST 31
    text: "Identify account information for synchronizing Google Drive."
    text_ko: "Google Drive 동기화에 쓰인 계정 정보를 찾아라."
    expect: {all: ["iaman.informant.personal@gmail.com"]}
    requires_any_tool: *reads_evidence
  - id: Q18  # NIST 33
    text: "When did the suspect burn CD-R?"
    text_ko: "용의자는 언제 CD-R을 구웠는가?"
    expect: {all: ["2015-03-24"]}
    requires_any_tool: *reads_evidence
  - id: Q19  # NIST 37
    text: "How and when did the suspect print a resignation file?"
    text_ko: "용의자는 사직서 파일을 어떻게, 언제 인쇄했는가?"
    expect: {all: ["XPS", "2015-03-25"]}
    requires_any_tool: *reads_evidence
  - id: Q20  # NIST 41
    text: "Identify notes stored in the Sticky Note file."
    text_ko: "Sticky Note 파일에 저장된 메모를 찾아라."
    expect: {all: ["Everything will be OK"]}
    requires_any_tool: *reads_evidence
  - id: Q21  # NIST 51; the Recycle Bin was emptied, its $I files are deleted
    text: "Examine 'Recycle Bin' data in PC."
    text_ko: "PC의 '휴지통' 데이터를 조사하라."
    expect: {any: ["Burn\\Burn", "Burn/Burn", "Penguins.jpg", "Koala.jpg", "Tulips.jpg", "Hydrangeas.jpg", "IE11-Windows6.1-x64-en-us.exe"], min: 3}
    requires_any_tool: *reads_evidence
  - id: Q22  # NIST 52
    text: "What actions were performed for anti-forensics on PC at the last day '2015-03-25'?"
    text_ko: "마지막 날 '2015-03-25'에 PC에서 수행된 안티포렌식 행위는?"
    review_only: true            # a list of actions; answer key: Eraser and CCleaner installed and run, files wiped, Recycle Bin and logs cleared
    requires_any_tool: *reads_evidence
  - id: Q23  # NIST 53
    text: "Recover deleted files from USB drive 'RM#2'."
    text_ko: "USB 드라이브 'RM#2'에서 삭제된 파일을 복구하라."
    expect: {any: ["winter_storm.amr", "winter_whether_advisory.zip", "my_favorite_cars.db", "my_favorite_movies.7z", "new_years_day.jpg", "super_bowl.avi", "my_friends.svg", "my_smartphone.png", "new_year_calendar.one", "a_gift_from_you.gif", "landscape.png", "diary_#1d.txt"], min: 5}
    requires_any_tool: *reads_evidence
  - id: Q24  # NIST 54
    text: "What actions were performed for anti-forensics on USB drive 'RM#2'?"
    text_ko: "USB 드라이브 'RM#2'에서 수행된 안티포렌식 행위는?"
    expect: {all: ["format"]}
    requires_any_tool: *reads_evidence
  - id: Q25  # NIST 56
    text: "Recover hidden files from the CD-R 'RM#3'. How to determine proper filenames of the original files prior to renaming tasks?"
    text_ko: "CD-R 'RM#3'에서 숨긴 파일을 복구하라. 이름을 바꾸기 전의 원래 파일 이름은 어떻게 알아낼 수 있는가?"
    expect: {all: ["secret_project"]}
    requires_any_tool: *reads_evidence

limits: {max_turns: 40, max_tool_chars: 4000, keep_tool_results: 4, context_budget_tokens: 24000}
