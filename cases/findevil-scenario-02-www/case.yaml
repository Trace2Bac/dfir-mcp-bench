id: findevil-scenario-02-www
title: An agent investigates findevil's scenario 02 with a web account's shell history
title_ko: 웹 계정 셸 이력이 있는 findevil 시나리오 02를 에이전트가 조사
name: "findevil scenario 02 + www-data history"   # short name for lists
name_ko: "findevil 시나리오 02 + www-data 이력"
dataset: findevil-samples
evidence: findevil-scenario-02-www
purpose: |
  findevil's own scenario 02 (its README left out) plus one file written for
  this bench: a shell history for the www-data account, whose home in the
  scenario's /etc/passwd is /var/www. As www-data, the attacker fetches a
  file from the scenario's C2 address and runs it. A real Debian /etc gives
  the snapshot a real system's size, without replacing any scenario file.

  - find_shell_histories looks only in /root and /home/*, so it does not
    list this history, and list_evidence cuts its listing at 300 lines,
    before /var. Before the fix, assess_coverage counts shell history as
    examined once any history tool has run, and names only three files.
  - Q1 asks whose shell histories were analyzed, checked against the
    analyze_bash_history calls the agent made.
  - Q2 asks what the shell histories show of the attacker.
purpose_ko: |
  findevil의 시나리오 02(README 제외)에, 이 벤치를 위해 쓴 파일 하나를 더했습니다. 시나리오의 /etc/passwd에서 홈이 /var/www인 www-data 계정의 셸 이력입니다. 공격자는 www-data로 시나리오의 C2 주소에서 파일을 받아 실행합니다. 실제 Debian /etc를 시나리오 파일을 덮어쓰지 않고 더해, 스냅숏을 실제 시스템 크기로 만들었습니다.

  - find_shell_histories는 /root와 /home/*만 보므로 이 이력을 나열하지 않고, list_evidence는 목록을 300줄에서 잘라 /var까지 가지 않습니다. 수정 전 assess_coverage는 이력 도구가 하나라도 실행되면 셸 이력을 검사한 것으로 세고, 파일은 세 개까지만 적습니다.
  - Q1은 누구의 셸 이력을 분석했는지 묻고, 에이전트가 실제로 부른 analyze_bash_history와 대조합니다.
  - Q2는 셸 이력에 공격자의 흔적이 무엇이 있는지 묻습니다.

setup: []

tools: [list_evidence, find_shell_histories, analyze_bash_history, assess_coverage]

scripted: []

questions:
  - id: Q1
    text: "Whose shell histories did you analyze? Name each account."
    text_ko: "누구의 셸 이력을 분석했나요? 계정을 모두 적으세요."
    review_only: true   # checked against the analyze_bash_history calls in the run
  - id: Q2
    text: "Do any of the shell histories show what the attacker did? If so, whose history, and what was done?"
    text_ko: "셸 이력 가운데 공격자가 한 일을 보여 주는 것이 있나요? 있다면 누구의 이력이고, 무엇을 했나요?"
    # Answer: www-data's history; the attacker fetched /tmp/.u from
    # 185.229.59.103 with wget and ran it.
    expect: {all: ["www-data", "185.229.59.103"]}

limits: {max_turns: 80, max_tool_chars: 4000}
