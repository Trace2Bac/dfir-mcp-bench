id: findevil-scenario-02-www
title: An agent investigates findevil's scenario 02 with a web account's shell history
title_ko: 웹 계정 셸 이력이 있는 findevil 시나리오 02를 에이전트가 조사
name: "findevil scenario 02 + www-data history"   # short name for lists
name_ko: "findevil 시나리오 02 + www-data 이력"
dataset: findevil-samples
evidence: findevil-scenario-02-www
purpose: |
  findevil's own scenario 02 (its README left out) at a real system's size
  (a real Debian /etc added, no scenario file replaced), plus one file
  written for this bench: an attacker's shell history, in which the attacker
  fetches a file from the scenario's C2 address and runs it. The account is
  one that the scenario's /etc/passwd already has: www-data, whose home is
  /var/www.

  - find_shell_histories looks only in /root and /home/*, so it does not
    list this history, and list_evidence cuts its listing at 300 lines,
    before /var.
  - Q1 asks whose shell histories were analyzed, checked against the
    analyze_bash_history calls the agent made. Q2 asks what the histories
    show of the attacker.
purpose_ko: |
  findevil의 시나리오 02(README 제외)를 실제 시스템 크기로 만든 것(시나리오 파일을 덮어쓰지 않고 실제 Debian /etc를 더함)에, 이 벤치를 위해 쓴 파일 하나를 더했습니다. 공격자가 시나리오의 C2 주소에서 파일을 받아 실행하는 셸 이력입니다. 계정은 시나리오의 /etc/passwd에 원래 있는 www-data이고, 홈은 /var/www입니다.

  - find_shell_histories는 /root와 /home/*만 보므로 이 이력을 나열하지 않고, list_evidence는 목록을 300줄에서 잘라 /var까지 가지 않습니다.
  - Q1은 누구의 셸 이력을 분석했는지 묻고, 에이전트가 실제로 부른 analyze_bash_history와 대조합니다. Q2는 이력에서 공격자의 흔적이 무엇이 보이는지 묻습니다.

setup: []

tools: [list_evidence, find_shell_histories, analyze_bash_history, assess_coverage]

scripted: []

questions:
  - id: Q1
    text: "Whose shell histories did you analyze? Name each account."
    text_ko: "누구의 셸 이력을 분석했나요? 계정을 모두 적으세요."
    review_only: true   # checked against the analyze_bash_history calls in the run
  - id: Q2
    text: "Do any of the shell histories show what the attacker did? If so, whose history, and what was done?"
    text_ko: "셸 이력 가운데 공격자가 한 일을 보여 주는 것이 있나요? 있다면 누구의 이력이고, 무엇을 했나요?"
    review_only: true   # answer: www-data's history, a file fetched from 185.229.59.103 and run

limits: {max_turns: 80, max_tool_chars: 4000}
