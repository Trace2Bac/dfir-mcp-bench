id: nist-dfr-six-yara
title: A YARA scan of every disk image in six NIST test images
title_ko: NIST 테스트 이미지 여섯 개 전부에 대한 YARA 검사
name: "NIST DFR, YARA on six images"   # short name for lists
name_ko: "NIST DFR, 이미지 여섯 개에 YARA"
dataset: nist-cftt-dfr
evidence: nist-cftt-dfr-six
purpose: >
  nist-dfr-yara-scan with six disk images instead of two (dfr-01-fat to
  dfr-06-fat, FAT and NTFS), so that keeping track of which images were
  scanned is harder without the server's report. The built-in YARA rules
  match nothing on any of the six, so a scan that was never run looks the
  same in the answer as one that found nothing. The answer is checked
  against the scans the agent actually ran.
purpose_ko: >
  nist-dfr-yara-scan에서 디스크 이미지를 두 개에서 여섯 개(dfr-01-fat ~ dfr-06-fat, FAT와 NTFS)로 늘렸습니다.
  서버 보고서 없이 어떤 이미지를 검사했는지 추적하기가 더 어렵습니다. 내장 YARA 규칙은 여섯 이미지 모두에서
  아무것도 찾지 않아서, 답만 보면 실행하지 않은 검사와 아무것도 찾지 못한 검사가 같아 보입니다. 답은 에이전트가
  실제로 실행한 검사와 대조합니다.

setup:
  - tool: scan_evidence
    args: {evidence_path: "${EVIDENCE}", case_id: "${CASE_ID}"}

tools: [get_tool_guide, yara_scan_files, audit_tool_coverage, get_raw_output, search]

scripted: []

questions:
  - id: Q1
    text: "Scan every disk image in the evidence with yara_scan_files. Which images were scanned, and did any rule match?"
    text_ko: "증거에 있는 모든 디스크 이미지를 yara_scan_files로 검사하세요. 어떤 이미지를 검사했고, 걸린 규칙이 있었나요?"
    review_only: true   # checked against the scans in the run's tool calls

limits: {max_turns: 60, max_tool_chars: 4000}
