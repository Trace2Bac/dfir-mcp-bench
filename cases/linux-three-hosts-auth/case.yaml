id: linux-three-hosts-auth
title: An auth_summary check of every host in three public Linux auth logs
title_ko: 공개 리눅스 인증 로그 세 개를 모두 auth_summary로 검사
name: "Three Linux hosts, auth_summary"   # short name for lists
name_ko: "리눅스 호스트 세 대, auth_summary"
dataset: public-linux-auth
evidence: public-linux-auth
purpose: |
  Three real auth logs, one folder per host, each checked with findevil's
  auth_summary. app-1 (Honeynet Forensic Challenge 5) was broken into by SSH
  brute force; LabSZ was only probed; combo shows nothing of the kind.

  - Q1 asks which hosts were checked, and is checked against the auth_summary
    calls the agent actually made.
  - Q2 asks for the break-in. A run that never checked app-1 cannot answer it
    from the tools.
purpose_ko: |
  실제 인증 로그 세 개가 호스트마다 폴더 하나씩 있고, 이를 findevil의 auth_summary로 검사합니다. app-1(Honeynet Forensic Challenge 5)은 SSH 무차별 대입으로 침입당했고, LabSZ는 시도만 있었으며, combo에는 그런 흔적이 없습니다.

  - Q1은 어떤 호스트를 검사했는지 묻고, 에이전트가 실제로 부른 auth_summary와 대조합니다.
  - Q2는 침입을 묻습니다. app-1을 검사하지 않은 실행은 도구 결과로 답할 수 없습니다.

setup: []

tools: [list_evidence, auth_summary, assess_coverage]

scripted: []

questions:
  - id: Q1
    text: "Check every host's auth log with auth_summary. Which hosts were checked?"
    text_ko: "모든 호스트의 인증 로그를 auth_summary로 검사하세요. 어떤 호스트를 검사했나요?"
    review_only: true   # checked against the auth_summary calls in the run
  - id: Q2
    source: 1           # Honeynet question 1, asked of every host
    text: "Was any host broken into over SSH? If so, give the host and the source IP."
    text_ko: "SSH로 침입당한 호스트가 있나요? 있다면 호스트와 출발지 IP를 적으세요."
    # Answer: app-1, from 219.150.161.20 (530 failed passwords, then a root
    # login at Apr 19 05:41:44).
    expect: {all: ["app-1", "219.150.161.20"]}
    requires_any_tool: [auth_summary]

limits: {max_turns: 60, max_tool_chars: 4000}
