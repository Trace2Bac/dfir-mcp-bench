id: nist-data-leakage-trudi
title: The NIST Data Leakage PC, examined with trudi's attack-lifecycle check
title_ko: trudi의 공격 단계 점검으로 NIST Data Leakage PC를 조사
name: "NIST Data Leakage PC, trudi"   # short name for lists
name_ko: "NIST Data Leakage PC, trudi"
dataset: nist-data-leakage
evidence: nist-data-leakage-pc
purpose: |
  The PC image of the NIST CFReDS Data Leakage Case, without the removable
  media, examined through trudi's tools. The briefing does not say the case
  is about leakage. trudi's procedure asks the investigation to establish or
  rule out each phase of the attack lifecycle, and its readiness check warns
  about each phase whose sources were never examined.

  - The data left the PC through Google Drive, a USB stick (RM#2) and a
    CD-R (RM#3) (NIST's answers).
  - The leaked files include .zip and .rar archives; before the fix, a tool
    call on one of them makes the readiness check count the exfiltration
    phase as examined (EXP-005).
  - Q1 asks for the status of each lifecycle phase; Q2 asks whether data
    left the PC, and how.
purpose_ko: |
  NIST CFReDS Data Leakage Case의 PC 이미지를 이동식 매체 없이, trudi의 도구로 조사합니다. 브리핑은 이것이 유출 사건이라고 말하지 않습니다. trudi의 절차는 공격 단계마다 확인하거나 배제하라고 하고, 준비 점검은 자료를 검사하지 않은 단계마다 경고합니다.

  - 자료는 Google Drive, USB 메모리(RM#2), CD-R(RM#3)로 PC를 떠났습니다(NIST 정답).
  - 유출된 파일에는 .zip과 .rar 압축 파일이 있습니다. 수정 전에는 그중 하나에 도구를 실행하면 준비 점검이 유출 단계를 검사한 것으로 셉니다(EXP-005).
  - Q1은 공격 단계별 상태를, Q2는 자료가 PC를 떠났는지와 그 경로를 묻습니다.

setup: []

tools: [misc_start_execution_log, reason_readiness_status, hash_file, ewf_info, tsk_mmls, tsk_fls, tsk_icat,
        ez_recmd_hive, ez_lecmd, ez_jlecmd, ez_pecmd, ez_sbecmd, misc_usbdeviceforensics, misc_hindsight_chrome,
        misc_evtx_filter, strings_grep]

scripted: []

questions:
  - id: Q1
    text: "For each phase of the attack lifecycle (persistence, privilege escalation, lateral movement, evidence of execution, exfiltration), was it established, ruled out, or not examined? Give the evidence for each."
    text_ko: "공격 단계(지속성, 권한 상승, 내부 이동, 실행 흔적, 유출)마다 확인했는지, 배제했는지, 검사하지 않았는지 적고, 각각의 근거를 적으세요."
    review_only: true
  - id: Q2
    text: "Did data leave this PC? If so, through which channels?"
    text_ko: "이 PC에서 자료가 빠져나갔나요? 그렇다면 어떤 경로였나요?"
    review_only: true   # NIST: yes — Google Drive, USB stick RM#2, CD-R RM#3

limits: {max_turns: 150, max_tool_chars: 4000}
