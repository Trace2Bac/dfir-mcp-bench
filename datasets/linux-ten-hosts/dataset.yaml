id: linux-ten-hosts
title: Ten Linux hosts' auth logs, three of them public
title_ko: 리눅스 호스트 열 대의 인증 로그(그중 세 대는 공개 로그)
source: datasets/public-linux-auth, and make_hosts.py in this folder
prepare: datasets/linux-ten-hosts/make_hosts.py
contents: >
  The three public logs of public-linux-auth (app-1 from Honeynet's Forensic
  Challenge 5, broken into by SSH brute force; LabSZ and combo from Loghub)
  and seven generated hosts with ordinary activity only.
