  - {name: web-01/var/log/auth.log, sha256: ab94576f0ce67702c54e8a1c7d5c17322ab9764878defc81e0ea7c18b5621218, note: "generated; ordinary activity", note_ko: "생성. 평소 활동"}
notes: >
  Only the break-in is real. The generated hosts add the number of targets:
  hourly cron sessions, the deploy account's key logins with sudo, and a few
  failed logins from scanners that never succeed, in April 2010 when app-1
  was attacked. Their addresses are in the documentation ranges (RFC 5737),
  and the generator is seeded, so it writes the same files every time.
notes_ko: >
  침입은 실제 로그에만 있습니다. 생성한 호스트는 대상 수를 늘리기 위한 것으로, app-1이 공격당한 2010년 4월의 매시간 cron 세션, deploy 계정의 키 로그인과 sudo,
  그리고 성공하지 못하는 스캐너의 로그인 실패 몇 건만 있습니다. 주소는 문서용 대역(RFC 5737)이고, 생성 스크립트는 시드가 고정돼 있어 매번 같은 파일을 만듭니다.
