  - {name: combo/var/log/secure, sha256: d474818dad65467e1d0747b70fe77d2c2482a74670aa53671750eefb4edef4fc, note: "Loghub Linux_2k.log, sshd and su lines", note_ko: "Loghub Linux_2k.log의 sshd, su 줄"}
