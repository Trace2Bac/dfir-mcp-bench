id: nist-hacking-case
title: NIST CFReDS Hacking Case ("Mr. Evil")
source: https://cfreds-archive.nist.gov/Hacking_Case.html
contributor: NIST CFReDS
answers: https://cfreds-archive.nist.gov/images/TestAnswers.pdf
answers_note: >
  NIST's answer key to the 31 questions on the case page (created 2004,
  revised 2018). Names in the image are fictional; NIST writes the suspect's
  name with equal signs to keep it out of search indexes, and so do the case
  questions here.
files:
  - {name: 4Dell_Latitude_CPi.E01, sha256: "-", note: "EnCase image, segment 1 (640 MB); published as '4Dell Latitude CPi.E01'", note_ko: "EnCase 이미지 1번 조각(640MB). 원래 파일 이름은 '4Dell Latitude CPi.E01'입니다."}
  - {name: 4Dell_Latitude_CPi.E02, sha256: "-", note: "segment 2 (400 MB)", note_ko: "2번 조각(400MB)"}
image_md5: AEE4FCD9301C03B3B054623CA261959A   # from the answer key, question 1
prepare: datasets/nist-hacking-case/fetch.sh
evidence_dirs:
  nist-hacking-case: the two E01 segments of a Dell Latitude CPi notebook (Windows XP)
notes: >
  The DD form of the same image (SCHARDT.001
  to .008, about 4.6 GB) is not used.
notes_ko: >
  같은 이미지의 DD 형식(SCHARDT.001~.008, 약 4.6GB)은 쓰지 않습니다.

# NIST's 31 questions as the case page publishes them, so a case can show
# which ones it borrows (a case question's `source` is the number here). The
# answers are in NIST's answer key (link above) and are not repeated here.
questions_name: NIST
questions:
  - {n: 1, text: "What is the image hash? Does the acquisition and verification hash match?", text_ko: "이미지 해시는 무엇인가요? 획득 해시와 검증 해시가 일치하나요?"}
  - {n: 2, text: "What operating system was used on the computer?", text_ko: "컴퓨터에서 쓰인 운영체제는 무엇인가요?"}
  - {n: 3, text: "When was the install date?", text_ko: "설치 날짜는 언제인가요?"}
  - {n: 4, text: "What is the timezone settings?", text_ko: "시간대 설정은 무엇인가요?"}
  - {n: 5, text: "Who is the registered owner?", text_ko: "등록된 소유자는 누구인가요?"}
  - {n: 6, text: "What is the computer account name?", text_ko: "컴퓨터 계정 이름은 무엇인가요?"}
  - {n: 7, text: "What is the primary domain name?", text_ko: "주 도메인 이름은 무엇인가요?"}
  - {n: 8, text: "When was the last recorded computer shutdown date/time?", text_ko: "마지막으로 기록된 컴퓨터 종료 일시는 언제인가요?"}
  - {n: 9, text: "How many accounts are recorded (total number)?", text_ko: "기록된 계정은 모두 몇 개인가요?"}
  - {n: 10, text: "What is the account name of the user who mostly uses the computer?", text_ko: "컴퓨터를 주로 쓰는 사용자의 계정 이름은 무엇인가요?"}
  - {n: 11, text: "Who was the last user to logon to the computer?", text_ko: "컴퓨터에 마지막으로 로그온한 사용자는 누구인가요?"}
  - {n: 12, text: "A search for the suspect's name reveals multiple hits. One of these proves that he is Mr. Evil and is also the administrator of this computer. What file is it? What software program does this file relate to?", text_ko: "용의자 이름을 검색하면 여러 결과가 나옵니다. 그중 하나는 용의자가 Mr. Evil이며 이 컴퓨터의 관리자라는 것을 증명합니다. 어떤 파일인가요? 이 파일은 어떤 프로그램과 관련이 있나요?"}
  - {n: 13, text: "List the network cards used by this computer.", text_ko: "이 컴퓨터가 쓴 네트워크 카드를 나열하세요."}
  - {n: 14, text: "This same file reports the IP address and MAC address of the computer. What are they?", text_ko: "같은 파일에 컴퓨터의 IP 주소와 MAC 주소가 있습니다. 무엇인가요?"}
  - {n: 15, text: "Which NIC card was used during the installation and set-up for LOOK@LAN?", text_ko: "LOOK@LAN을 설치하고 설정할 때 쓴 네트워크 카드는 무엇인가요?"}
  - {n: 16, text: "Find 6 installed programs that may be used for hacking.", text_ko: "해킹에 쓰일 수 있는 설치된 프로그램 6개를 찾으세요."}
  - {n: 17, text: "What is the SMTP email address for Mr. Evil?", text_ko: "Mr. Evil의 SMTP 이메일 주소는 무엇인가요?"}
  - {n: 18, text: "What are the NNTP (news server) settings for Mr. Evil?", text_ko: "Mr. Evil의 NNTP(뉴스 서버) 설정은 무엇인가요?"}
  - {n: 19, text: "What two installed programs show this information?", text_ko: "이 정보를 보여 주는 설치된 프로그램 두 개는 무엇인가요?"}
  - {n: 20, text: "List 5 newsgroups that Mr. Evil has subscribed to.", text_ko: "Mr. Evil이 구독한 뉴스그룹 5개를 나열하세요."}
  - {n: 21, text: "A popular IRC program called MIRC was installed. What are the user settings that was shown when the user was online and in a chat channel?", text_ko: "IRC 프로그램 MIRC가 설치되어 있습니다. 사용자가 접속해 채팅 채널에 있을 때 보이던 사용자 설정은 무엇인가요?"}
  - {n: 22, text: "This IRC program has the capability to log chat sessions. List 3 IRC channels that the user of this computer accessed.", text_ko: "이 IRC 프로그램은 채팅 기록을 남길 수 있습니다. 이 컴퓨터 사용자가 접속한 IRC 채널 3개를 나열하세요."}
  - {n: 23, text: "Ethereal, a sniffing program, was also installed. When TCP packets are collected and re-assembled, the default save directory is that user's My Documents directory. What is the name of the file that contains the intercepted data?", text_ko: "스니핑 프로그램 Ethereal도 설치되어 있습니다. TCP 패킷을 모아 재조립하면 기본 저장 위치는 사용자의 My Documents 폴더입니다. 가로챈 데이터가 든 파일의 이름은 무엇인가요?"}
  - {n: 24, text: "Viewing the file in a text format reveals much information about who and what was intercepted. What type of wireless computer was the victim using?", text_ko: "이 파일을 텍스트로 보면 누구의 무엇을 가로챘는지 알 수 있습니다. 피해자가 쓴 무선 기기는 어떤 종류인가요?"}
  - {n: 25, text: "What websites was the victim accessing?", text_ko: "피해자는 어떤 웹사이트에 접속했나요?"}
  - {n: 26, text: "Search for the main user's web based email address. What is it?", text_ko: "주 사용자의 웹 메일 주소를 찾으세요. 무엇인가요?"}
  - {n: 27, text: "Yahoo mail saves copies of the email under what file name?", text_ko: "Yahoo 메일은 메일 사본을 어떤 파일 이름으로 저장하나요?"}
  - {n: 28, text: "How many executable files are in the recycle bin?", text_ko: "휴지통에 실행 파일은 몇 개 있나요?"}
  - {n: 29, text: "Are these files really deleted?", text_ko: "이 파일들은 정말 삭제되었나요?"}
  - {n: 30, text: "How many files are actually reported to be deleted by the file system?", text_ko: "파일 시스템이 삭제되었다고 보고하는 파일은 실제로 몇 개인가요?"}
  - {n: 31, text: "Perform a Anti-Virus check. Are there any viruses on the computer?", text_ko: "백신 검사를 하세요. 컴퓨터에 바이러스가 있나요?"}
