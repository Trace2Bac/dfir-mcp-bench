id: rhino-hunt
title: Rhino Hunt (DFRWS 2005 Rodeo Challenge)
source: https://cfreds-archive.nist.gov/dfrws/Rhino_Hunt.html
contributor: Dr. Golden G. Richard III, via NIST CFReDS
answers: https://cfreds-archive.nist.gov/dfrws/DFRWS2005-answers.pdf
files:
  - {name: RHINOUSB.dd, md5: 80348c58eec4c328ef1f7709adc56a54, note: "FAT16 USB key image, 247 MiB"}
  - {name: rhino.log, md5: c0d0093eb1664cd7b73f3a5225ae3f30, note: "pcap: HTTP, IMAP, telnet, FTP"}
  - {name: rhino2.log, md5: cd21eaf4acfb50f71ffff857d7968341, note: "pcap: HTTP, IMAP"}
  - {name: rhino3.log, md5: 7e29f9d67346df25faaf18efcd95fc30, note: "pcap: HTTP, IMAP"}
prepare: datasets/rhino-hunt/fetch.sh
evidence_dirs:
  rhino-hunt: RHINOUSB.dd and the three traces copied as .pcap (the .log names hide the format)
notes: >
  The data is not redistributed here. fetch.sh downloads it from NIST and
  checks the MD5 values published on the dataset page.
