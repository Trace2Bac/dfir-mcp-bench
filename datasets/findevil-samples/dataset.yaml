id: findevil-samples
title: findevil's own sample scenarios
title_ko: findevil에 들어 있는 예시 시나리오
source: https://github.com/marlyocat/findevil/tree/d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1/samples
contributor: findevil (marlyocat/findevil), the samples its own tests and example run use
prepare: datasets/findevil-samples/fetch.sh
contents: >
  Synthetic Linux IR cases shipped with findevil, each an auth log and a
  file-system snapshot with a README that states what an analyst should
  find. Taken from the repository at the commit the findevil variants build.
files:
  - {name: findevil-scenario-02 (samples/attack-scenario-02), sha256: b74c991f025eed174118bb157011f6172a56ea269a1de654d3e521733ac79b6d,
     note: "Stolen CI/CD key, quiet persistence. Shell histories of alice, deploy and root; findevil's analyze_bash_history flags one command in deploy's only",
     note_ko: "탈취한 CI/CD 키로 조용히 지속성 확보. alice, deploy, root의 셸 이력이 있고, findevil의 analyze_bash_history는 deploy 이력에서만 명령 하나를 의심으로 표시함"}
evidence_dirs:
  findevil-scenario-02: samples/attack-scenario-02 as it is in the repository
notes: >
  The SHA-256 above is of the scenario's files, one "hash  path" line each,
  sorted, since GitHub generates the archive itself.
notes_ko: >
  위 SHA-256은 시나리오 파일마다 "해시  경로" 한 줄씩을 정렬해 계산한 값입니다. 압축 파일은 GitHub가 만들어 주는 것이라 그 자체의 해시는 바뀔 수 있습니다.
