id: findevil-samples
title: findevil's own sample scenarios
title_ko: findevil에 들어 있는 예시 시나리오
source: https://github.com/marlyocat/findevil/tree/d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1/samples
contributor: findevil (marlyocat/findevil), the samples its own tests and example run use
prepare: datasets/findevil-samples/fetch.sh
contents: >
  Synthetic Linux IR cases shipped with findevil, each an auth log and a
  file-system snapshot with a README that states what an analyst should
  find. Taken from the repository at the commit the findevil variants build.
files:
  - {name: findevil-scenario-02 (samples/attack-scenario-02), sha256: 09f8312bbc76a81b9ad1bbbe4d5b064628a2b5bf4895092078d6eeb5e02fa65e,
     note: "Stolen CI/CD key, quiet persistence. Shell histories of alice, deploy and root; findevil's analyze_bash_history flags one command in deploy's only",
     note_ko: "탈취한 CI/CD 키로 조용히 지속성 확보. alice, deploy, root의 셸 이력이 있고, findevil의 analyze_bash_history는 deploy 이력에서만 명령 하나를 의심으로 표시함"}
evidence_dirs:
  findevil-scenario-02: samples/attack-scenario-02 without its README.md, which states the answers
  findevil-scenario-02-histories: only the three shell histories of scenario 02 (alice, deploy, root), at the same paths
  findevil-scenario-02-www: scenario 02 plus fs/var/www/.bash_history, written for this bench, for the www-data account its /etc/passwd already has (the attacker fetches and runs a file from the scenario's C2 address 185.229.59.103), and a real Debian /etc (debian:bookworm-slim, pinned by digest) added without replacing any scenario file, so the snapshot has a real system's size (SHA-256 f0f1820f...)
answers: https://github.com/marlyocat/findevil/blob/d1a8d25d9c8c05bd66881506cb1f12314ee7c5e1/samples/attack-scenario-02/README.md
notes: >
  Each scenario's README.md states what an analyst should find, so it is
  the answer key and is left out of the evidence folder. The SHA-256 above
  is of the scenario's files, one "hash  path" line each, sorted, since
  GitHub generates the archive itself.
notes_ko: >
  시나리오마다 있는 README.md는 분석가가 찾아야 할 내용을 적은 정답지라서 증거 폴더에서 뺍니다. 위 SHA-256은 시나리오 파일마다 "해시  경로" 한 줄씩을 정렬해 계산한 값입니다. 압축 파일은 GitHub가 만들어 주는 것이라 그 자체의 해시는 바뀔 수 있습니다.
