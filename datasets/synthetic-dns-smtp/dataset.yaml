id: synthetic-dns-smtp
title: Synthetic DNS and SMTP capture
source: generated by make_pcap.py in this folder
prepare: python3 datasets/synthetic-dns-smtp/make_pcap.py data/evidence/synthetic-dns-smtp/sample.pcap
contents: >
  One DNS query and answer (example.com A 93.184.216.34) and an SMTP session
  with a 220 banner from mail.example.com, MAIL FROM jean@m57.biz and RCPT TO
  alison@example.com. Built to exercise the dns and smtp modes of
  run_pcap_analysis (calebevans/mulder#273).
