id: nist-cftt-dfr
title: NIST CFTT deleted file recovery (DFR) test images
source: https://cfreds-archive.nist.gov/dfr-test-images.html
contributor: NIST Computer Forensics Tool Testing (CFTT) program, via CFReDS
answers: https://cfreds-archive.nist.gov/dfr-images/setup-july-10-2012.pdf
answers_note: >
  The image layout document lists, per image, the partitions, the files
  created and deleted in each, their sizes, MAC times before deletion, delete
  times and sectors. NIST built the images for tool testing, so the ground
  truth is known by construction.
files:
  - {name: dfr-01-fat.dd, sha256: 5d5bf8fb15a1df463fb0b9c0a958c05ece30941af40545f895131ff0daf32fab,
     note: "1 GiB disk (2.2 MB as .bz2); FAT12, FAT16 and FAT32 partitions, one deleted file each (DFR-01)"}
prepare: datasets/nist-cftt-dfr/fetch.sh
evidence_dirs:
  nist-cftt-dfr: the decompressed images
notes: >
  The data is not redistributed. NIST publishes no hashes for these images;
  fetch.sh records SHA-256 at the first download and checks it afterwards.
