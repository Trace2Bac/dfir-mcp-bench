     note: "1 GiB disk (2.2 MB as .bz2); FAT12, FAT16 and FAT32 partitions, one deleted file each (DFR-01)",
     note_ko: "1GiB 디스크(.bz2로 2.2MB). FAT12, FAT16, FAT32 파티션에 삭제 파일이 하나씩 있음(DFR-01)"}
  - {name: dfr-02-ntfs.dd, sha256: 57e6f37d3312ee4a113a6534a1ffcbd45ad3e0325a509442ac54ae632762d1ef,
     note: "1 GiB disk (2.2 MB as .bz2); one NTFS partition with deleted files, Duhr.TXT and Bunda.txt among them (DFR-02)",
     note_ko: "1GiB 디스크(.bz2로 2.2MB). 삭제 파일이 있는 NTFS 파티션 하나, Duhr.TXT와 Bunda.txt 포함(DFR-02)"}
  - {name: dfr-03-ntfs.dd, sha256: 466db91345fc6f5b47527f4b2cb109305bdabf2caa0883eb60516c26e625b03a,
     note: "1 GiB disk (2.2 MB as .bz2); NTFS (DFR-03); only in nist-cftt-dfr-six",
     note_ko: "1GiB 디스크(.bz2로 2.2MB). NTFS(DFR-03). nist-cftt-dfr-six에만 있음"}
  - {name: dfr-04-fat.dd, sha256: e92f32cddea990a7a4d3ca1e6224f9aab76529aee1892a42022f9c725b80aff1,
     note: "1 GiB disk (2.2 MB as .bz2); FAT (DFR-04); only in nist-cftt-dfr-six",
     note_ko: "1GiB 디스크(.bz2로 2.2MB). FAT(DFR-04). nist-cftt-dfr-six에만 있음"}
  - {name: dfr-05-ntfs.dd, sha256: f957f78b200307ef8c49de42309202cbff03c1dc8cea1f4ea1230d8a6eeda27c,
     note: "1 GiB disk (2.2 MB as .bz2); NTFS (DFR-05); only in nist-cftt-dfr-six",
     note_ko: "1GiB 디스크(.bz2로 2.2MB). NTFS(DFR-05). nist-cftt-dfr-six에만 있음"}
  - {name: dfr-06-fat.dd, sha256: 3528de47143586fab381ca33390335af8da2775afacfbe35a5dbcfb98c6f058b,
     note: "1 GiB disk (2.2 MB as .bz2); FAT (DFR-06); only in nist-cftt-dfr-six",
     note_ko: "1GiB 디스크(.bz2로 2.2MB). FAT(DFR-06). nist-cftt-dfr-six에만 있음"}
prepare: datasets/nist-cftt-dfr/fetch.sh
evidence_dirs:
  nist-cftt-dfr: dfr-01-fat.dd and dfr-02-ntfs.dd
  nist-cftt-dfr-six: those two and dfr-03 to dfr-06, six images (hard links, no extra space)
notes: >
  The data is not redistributed. NIST publishes no hashes for these images;
  fetch.sh records SHA-256 at the first download and checks it afterwards.
notes_ko: >
  데이터는 재배포하지 않습니다. NIST가 이 이미지들의 해시를 공개하지 않아서, fetch.sh가 처음 받을 때 SHA-256을
  기록하고 이후에는 그 값으로 확인합니다.
