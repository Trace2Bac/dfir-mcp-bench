id: public-linux-auth
title: Three public Linux auth logs (Honeynet Project, Loghub)
title_ko: 공개 리눅스 인증 로그 세 개(Honeynet Project, Loghub)
source: https://www.honeynet.org/challenges/forensic-challenge-5-log-mysteries/
contributor: >
  The Honeynet Project (Forensic Challenge 5, by Raffael Marty, Anton Chuvakin
  and Sebastien Tricaud, 2010), and Loghub by the CUHK ARISE lab
  (https://github.com/logpai/loghub, Zhu et al., ISSRE 2023)
answers: https://honeynet.org/2010/11/10/project-honeynet-log-mysteries-challenge-lessons/
answers_note: >
  Honeynet publishes no answer key. Its lessons page describes the break-in:
  "a very long (hundreds) string of login failures followed by success, all
  from the same IP address in China". In app-1's log that source is
  219.150.161.20: 530 failed passwords, then a root login at Apr 19 05:41:44,
  and more failures and root logins after it.
files:
  - {name: app-1/var/log/auth.log, sha256: 730bace212f7b2e878a7b2ad31e99e25a7f8e27479a07f1e4d713e15e4a19d18,
     note: "Honeynet Forensic Challenge 5 (sanitized_log.zip): an Ubuntu server broken into by SSH brute force; 102,164 lines",
     note_ko: "Honeynet Forensic Challenge 5(sanitized_log.zip). SSH 무차별 대입으로 침입당한 우분투 서버. 102,164줄"}
  - {name: LabSZ/var/log/auth.log, sha256: 1e4912727fa88245113d41b16a0cd25ceadba7f931e1c406542885b91254264f,
     note: "Loghub OpenSSH_2k.log: a lab server's sshd log with brute-force attempts and no login from them; 2,000 lines",
     note_ko: "Loghub OpenSSH_2k.log. 무차별 대입 시도는 있지만 그로 인한 로그인은 없는 연구실 서버의 sshd 로그. 2,000줄"}
  - {name: combo/var/log/secure, sha256: d474818dad65467e1d0747b70fe77d2c2482a74670aa53671750eefb4edef4fc,
     note: "Loghub Linux_2k.log, its sshd and su lines only (what Red Hat writes to /var/log/secure); 849 lines",
     note_ko: "Loghub Linux_2k.log에서 sshd와 su 줄만 남김(레드햇이 /var/log/secure에 쓰는 줄). 849줄"}
prepare: datasets/public-linux-auth/fetch.sh
notes: >
  Three real logs from three unrelated systems, one folder per host, named
  after the host in each log. Honeynet's archive is no longer on honeynet.org;
  fetch.sh takes the Internet Archive's copy of its original URL. Neither
  source publishes hashes, so fetch.sh records SHA-256 and checks it. Honeynet's
  challenge is CC BY-NC-ND 3.0, and Loghub is free for research use with
  citation.
notes_ko: >
  서로 관계없는 세 시스템의 실제 로그를 호스트마다 폴더 하나에 두고, 폴더 이름은 각 로그에 적힌 호스트 이름을 씁니다. Honeynet 압축 파일은 더 이상
  honeynet.org에 없어서, fetch.sh가 원래 주소를 Internet Archive에 저장한 사본에서 받습니다. 두 출처 모두 해시를 공개하지 않아서 fetch.sh가 SHA-256을
  기록하고 확인합니다. Honeynet 챌린지는 CC BY-NC-ND 3.0이고, Loghub는 출처를 밝히면 연구용으로 자유롭게 쓸 수 있습니다.
questions_name: Honeynet
questions:
  - {n: 1, text: "Was the system compromised and when? How do you know that for sure?", text_ko: "시스템이 침해됐나요? 언제인가요? 어떻게 확신할 수 있나요?"}
  - {n: 2, text: "If the was compromised, what was the method used?", text_ko: "침해됐다면 어떤 방법이었나요?"}
  - {n: 3, text: "Can you locate how many attackers failed? If some succeeded, how many were they? How many stopped attacking after the first success?", text_ko: "실패한 공격자는 몇인가요? 성공한 공격자는 몇이고, 첫 성공 뒤 공격을 멈춘 공격자는 몇인가요?"}
  - {n: 4, text: "What happened after the brute force attack?", text_ko: "무차별 대입 공격 뒤에 무슨 일이 있었나요?"}
  - {n: 5, text: "Locate the authentication logs, was a bruteforce attack performed? if yes how many?", text_ko: "인증 로그를 찾으세요. 무차별 대입 공격이 있었나요? 있었다면 몇 번인가요?"}
  - {n: 6, text: "What is the timeline of significant events? How certain are you of the timing?", text_ko: "주요 사건의 타임라인은? 시간을 얼마나 확신하나요?"}
  - {n: 7, text: "Anything else that looks suspicious in the logs? Any misconfigurations? Other issues?", text_ko: "로그에서 그 밖에 의심스러운 것이 있나요? 잘못된 설정이나 다른 문제는?"}
  - {n: 8, text: "Was an automatic tool used to perform the attack? if yes which one?", text_ko: "공격에 자동화 도구를 썼나요? 썼다면 어떤 도구인가요?"}
  - {n: 9, text: "What can you say about the attacker's goals and methods?", text_ko: "공격자의 목표와 방법에 대해 무엇을 말할 수 있나요?"}
